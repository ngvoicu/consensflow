# A pane's `cf` on Windows, `bin/cf.exe`: see src/main.rs. A crate of its own,
# with no dependencies, so building it never builds the app; on Windows
# app/scripts/prepare-sidecar.mjs builds it and puts it in bin/.
[package]
name = "cf"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
publish = false

[profile.release]
opt-level = "s"
strip = true
