[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
# The identity a build is made with, read from Tauri's configuration as Tauri reads it.
serde_json.workspace = true

[dependencies]
serde_json.workspace = true
serde.workspace = true
cf-proto.workspace = true
cf-bridge.workspace = true
cf-panes.workspace = true
# The environment the app runs in, and the terminal's command repaired at the start.
cf-base.workspace = true
cf-launcher.workspace = true
# The portable exe's format, which the app reads and unpacks at its start.
cf-portable.workspace = true
# The daemon is started as every program here is: holding nothing of the app's but its streams.
cf-process.workspace = true
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-updater = "2.14.1"
semver = "1"
url = "2"
time = { version = "0.3", features = ["formatting"] }
tempfile = "3"
tar = "0.4"
flate2.workspace = true
reqwest = { version = "0.13.4", default-features = false }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# AppKit's dispatch of an event, run where an exception raised under it is caught (panics/appkit.rs).
# The version Tauri's crates are built with (Cargo.lock holds one copy, `exception` already on).
objc2 = { version = "0.6.4", features = ["exception"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
# The page's WebView2, told to load the page again when its process fails (page_crash.rs).
# Its version moves with Tauri's: it is the one tauri-runtime-wry and wry are built with
# (Cargo.lock holds one copy), and a Tauri that takes another needs this one moved with it,
# or Windows builds two and `platform.controller()` no longer has this crate's types.
webview2-com = "0.39.1"

[dev-dependencies]
cf-panes = { workspace = true, features = ["test-support"] }
# Detection as the daemon the app starts runs it, in the tests of the daemon's PATH.
cf-harness.workspace = true
portable-pty.workspace = true
tauri = { version = "2.12.5", features = ["test"] }

[lints]
workspace = true
