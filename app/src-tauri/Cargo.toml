[package]
name = "app"
default-run = "app"
version = "3.0.0-alpha.61"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
futures-channel = "0.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
portable-pty = "0.9"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-updater = "~2.11.0"
semver = "1"
url = "2"
time = { version = "0.3", features = ["formatting"] }
tempfile = "3"
tar = "0.4"
flate2 = "1"
reqwest = { version = "0.13.4", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
socket2 = "0.6"

[dev-dependencies]
tauri = { version = "2.11.3", features = ["test"] }
