[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json.workspace = true
serde.workspace = true
cf-proto.workspace = true
cf-bridge.workspace = true
cf-panes.workspace = true
# The environment the app runs in, and the terminal's command repaired at the start.
cf-base.workspace = true
cf-launcher.workspace = true
# The portable exe's format, which the app reads and unpacks at its start.
cf-portable.workspace = true
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-updater = "~2.11.0"
semver = "1"
url = "2"
time = { version = "0.3", features = ["formatting"] }
tempfile = "3"
tar = "0.4"
flate2.workspace = true
reqwest = { version = "0.13.4", default-features = false }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
# The page's WebView2, told to load the page again when its process fails (page_crash.rs);
# the version tauri-runtime-wry is built with.
webview2-com = "0.38.2"

[dev-dependencies]
cf-panes = { workspace = true, features = ["test-support"] }
# Detection as the daemon the app starts runs it, in the tests of the daemon's PATH.
cf-harness.workspace = true
portable-pty.workspace = true
tauri = { version = "2.11.3", features = ["test"] }

[lints]
workspace = true
