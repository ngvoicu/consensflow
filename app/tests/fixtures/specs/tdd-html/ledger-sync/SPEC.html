<!DOCTYPE html>

<div class="page">

    <section class="section" id="phases">

        <details class="phase" open data-phase="1" data-status="in-progress">

                    <span class="task__text">Write tests for pulling a page of entries</span>

                  <li class="task task--impl" id="task-IMPL-LS-02" data-task="IMPL-LS-02" data-status="pending">
                    <span class="task__code">IMPL-LS-02</span>
                    <span class="task__text">Implement the pull in <code>src/sync/pull.ts</code> &rarr; satisfies <code>[TEST-LS-01]</code>.</span>
                  </li>
                </ol>
              </li>
            </ul>
          </div>
        </details>
      </div>
    </section>
    <!-- endregion:phases -->

    <!-- region:tdd-log -->
    <section class="section" id="tdd-log">
