# One version tag builds and publishes everything people download: the Mac
# app (the DMG, and the signed update bundle installed apps fetch through the
# update feed), signed with the Developer ID and notarized, the Windows
# installer and the portable Windows exe.
#
#   git tag -a v<version> -m "<release notes>" && git push upstream v<version>
#
# (upstream: the GitHub remote; origin is the NAS mirror, which runs nothing.)
#
# The tag names the source version (package.json, Cargo.toml and
# tauri.conf.json agree; prepare-update checks all three). Its message becomes
# the notes; a tag without one gets the commits since the previous release.
# A hand run (Actions → Release → Run workflow) builds, signs and smoke-tests
# the same files and publishes nothing, even where it is run on a tag: only the
# push of a tag publishes. It prints the feeds a tag would move, and what a tag
# would be refused for.
#
# The update feeds. Installed apps read a rolling release's latest.json: the
# apps before the bridge (3.0.0-alpha.80 and earlier) read update-alpha and
# update-stable, the bridge and those after it read feed-alpha and feed-stable
# (app/feeds.json, which also records which release is the bridge). Every
# release moves the new feed of its channels. The bridge moves the old feed of
# each channel in use too, once: it is what the old apps install, being the
# last release laid out as they check for. A later release moves the new feeds
# only, and only once the old feeds serve the bridge, with its files: it reads
# that from the feeds, not from the tags, since a bridge whose release failed
# leaves its tag behind and the old apps where they were. It fails before it
# moves anything when they do not. Nothing deletes the release the old feeds
# name. No run moves a feed backward: the job of a release that is run again
# from the Actions page after a later one went out does what is left of it and
# leaves a feed that names the later release as it is, and says so. The rule, its
# checks and the moving are cf-publish's (tools/cf-publish), which a run that died
# is finished by running again; what runs under the repository's write token is
# said at the jobs below, `publisher` and `publish`.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Releases go out one at a time, so two tags never race to move the feed. A
# hand run publishes nothing and queues apart, on a tag as on a branch: in the
# same group it would replace a tag's run that waits there.
concurrency:
  group: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'release' || format('release-trial-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-latest
    # The build takes about 7 minutes; the two notarizations may take up to
    # an hour each (cf-release sign-mac).
    timeout-minutes: 150
    # The only job that can read the signing keys: the `release` environment
    # admits v* tags and main. No third-party action runs here; Rust comes
    # from the runner's own rustup.
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: rustup update stable --no-self-update && rustup default stable
      - name: The tag names the source version
        if: github.ref_type == 'tag'
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # The rule of the feeds is cf-publish's, the crate the publish job runs. It
      # is built here by itself, with `--locked`, in a step that has no key in its
      # environment (a build runs every build script the lockfile names), and
      # called by its path below: it asks the questions that come before the
      # build, and plans the feeds. The binary that publishes is the publisher
      # job's.
      - name: Build cf-publish, the rule of the feeds
        run: cargo build --release --locked -p cf-publish
      # A release after the bridge finds out here, before an hour of building,
      # that the old feeds serve the bridge with its files; the publish job asks
      # again before it moves anything. A hand run says what a tag would be
      # refused for, and is not failed by it.
      - name: The old feeds serve the bridge, for a release after it
        run: |
          set -euo pipefail
          dry=()
          if [ "$GITHUB_EVENT_NAME" != push ]; then dry=(--dry-run); fi
          app/src-tauri/target/release/cf-publish feeds prerequisites \
            --version "$(node -p "require('./package.json').version")" \
            --base "https://github.com/$GITHUB_REPOSITORY/releases/download" ${dry[@]+"${dry[@]}"}

      - run: npm ci
      - run: npm ci --prefix app
      # The release's own tool (tools/cf-release), built here where no key is,
      # and run by its path in the steps below. A step that holds a key never
      # builds anything: `cargo run` there would build and run whatever the
      # lockfile names with the key in reach. --locked: the lockfile's build, or none.
      - name: Build the release tool
        run: cargo build --release --locked -p cf-release
      # The page and the bundled cf, then the app and its DMG. No key is in
      # this step: a build runs every crate's build script and every tool the
      # lockfiles name.
      - run: npm --prefix app run build
      # The Developer ID: the app signed from the inside out with hardened
      # runtime, notarized and stapled, then its DMG made again around it and
      # notarized too (cf-release sign-mac). The certificate and the notary's
      # key reach that tool and Apple's tools, nothing else.
      - name: Sign and notarize the app and its DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: app/src-tauri/target/release/cf-release sign-mac --bundle app/src-tauri/target/release/bundle
      # The app as it ships, signed under the Developer ID with hardened
      # runtime and no entitlement: what could stop its page or its daemon from
      # starting under that signature is shown here and by no build signed ad
      # hoc. It runs once, and the smoke holds the daemon that started to the
      # bundle's own cf.
      - name: The signed app passes the packaged smoke
        env:
          CONSENSFLOW_SMOKE_APP: ${{ github.workspace }}/app/src-tauri/target/release/bundle/macos/ConsensFlow.app
        run: npm run smoke
      # The update bundle, signed in the one step that sees the key (it has no
      # password): the app as installed apps unpack it, files and folders under
      # ConsensFlow.app only, in plain ustar, as Tauri's own bundle was. Its
      # seal must still hold after the smoke ran it.
      - name: Sign the update bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        working-directory: app/src-tauri/target/release/bundle/macos
        run: |
          set -euo pipefail
          codesign --verify --deep --strict ConsensFlow.app
          COPYFILE_DISABLE=1 tar --format ustar --no-mac-metadata --no-xattrs --no-acls --no-fflags \
            -czf ConsensFlow.app.tar.gz ConsensFlow.app
          "$GITHUB_WORKSPACE/app/node_modules/.bin/tauri" signer sign ConsensFlow.app.tar.gz

      # The tool built above reads the version the three sources agree on, and
      # checks the bundle, the archive and the signature before it writes the
      # feed's entry (tools/cf-release, `prepare-update`).
      - name: Notes, and the update feed for this build
        run: |
          set -euo pipefail
          release_tool="$GITHUB_WORKSPACE/app/src-tauri/target/release/cf-release"
          version=$("$release_tool" version)
          tag="v$version"
          bundle=app/src-tauri/target/release/bundle
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # Checkout can leave an annotated tag lightweight; fetch the tag itself.
            git fetch --force origin "+refs/tags/$tag:refs/tags/$tag"
            if [ "$(git cat-file -t "$tag")" = tag ]; then
              git tag -l --format='%(contents)' "$tag" > "$out/notes.txt"
            fi
          fi
          if [ ! -s "$out/notes.txt" ]; then
            {
              echo "ConsensFlow $version${previous:+, the changes since ${previous#v}}:"
              echo
              git log --no-merges --format='- %s' ${previous:+"$previous..HEAD"}
            } > "$out/notes.txt"
          fi
          archive="ConsensFlow_${version}_aarch64.app.tar.gz"
          cp "$bundle/macos/ConsensFlow.app.tar.gz" "$out/$archive"
          cp "$bundle/macos/ConsensFlow.app.tar.gz.sig" "$out/$archive.sig"
          cp "$bundle/dmg/ConsensFlow_${version}_aarch64.dmg" "$out/"
          case "$version" in *-*) channel=alpha ;; *) channel=stable ;; esac
          "$release_tool" prepare-update --repo "$PWD" \
            --bundle "$bundle/macos/ConsensFlow.app" \
            --archive "$out/$archive" --signature "$out/$archive.sig" \
            --notes "$out/notes.txt" --output "$out/latest.json" \
            --channel "$channel" --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The feeds this release moves, by the rule and the archive. It fails
          # here, before anything is published, for a bridge the old apps would
          # refuse, or a release before the bridge; a hand run says so instead.
          dry=()
          if [ "$GITHUB_EVENT_NAME" != push ]; then dry=(--dry-run); fi
          app/src-tauri/target/release/cf-publish feeds plan --version "$version" \
            --archive "$out/$archive" ${dry[@]+"${dry[@]}"}
      - uses: actions/upload-artifact@v7
        with:
          name: ConsensFlow-mac
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  windows:
    uses: ./.github/workflows/windows-build.yml

  # The whole gate (ci.yml) on the commit being released: what goes out passed
  # it on both platforms, not only its build and the packaged smoke.
  gate:
    uses: ./.github/workflows/ci.yml

  # What runs under the repository's write token is built here, where there is no
  # token and no secret, and does not run here: one binary of one crate,
  # cf-publish (tools/cf-publish), built with `--locked` from Cargo.lock's
  # versions of its two dependencies, serde_json and sha2, and what those bring,
  # which tools/cf-publish/tests/closure.rs lists, so that a dependency added
  # later fails the gate until someone has read it. The binary's SHA-256 is this
  # job's output. Any job of a run can replace an artifact of it (the Mac job
  # runs every build script and every tool the lockfiles name), but no job can
  # forge another's output, and the publish job checks the binary it downloads
  # against this one before it runs it.
  #
  # It runs on a hand run too, which publishes nothing: that is the trial of its
  # build, its hash and its upload.
  publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      # The whole tree: cargo reads the manifest of every member of the
      # workspace. Only cf-publish's crate is built.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update && rustup default stable
      - name: Build cf-publish, and say what it hashes to
        id: build
        run: |
          set -euo pipefail
          cargo build --release --locked -p cf-publish
          sha256=$(shasum -a 256 app/src-tauri/target/release/cf-publish | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "cf-publish hashes to $sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: cf-publish
          path: app/src-tauri/target/release/cf-publish
          if-no-files-found: error

  publish:
    # Only the push of a tag publishes. A hand run is a workflow_dispatch, and
    # is on a tag whenever someone picks one to run it on.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [mac, windows, gate, publisher]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # Nothing of the tree, nothing from npm or crates.io and no installer runs
    # here: no checkout, no setup-node. The code under the write token is the one
    # binary the publisher job built (cf-publish, see there), checked against the
    # hash that job reported before it is run, and the runner's own gh, curl, tar
    # and shasum; the only action is GitHub's own download-artifact, which fetches
    # the files. The token reaches the two steps that run the binary, and no other.
    steps:
      # The files the Mac and Windows jobs built.
      - uses: actions/download-artifact@v8
        with:
          pattern: ConsensFlow-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      # The publisher, in a folder of its own: it is not one of the release's files.
      - uses: actions/download-artifact@v8
        with:
          name: cf-publish
          path: ${{ runner.temp }}/publisher
      # An artifact comes without the bit that makes a file run, and can have
      # been replaced since it was uploaded; the hash is the publisher job's.
      - name: The publisher is the binary that was built
        env:
          PUBLISHER_SHA256: ${{ needs.publisher.outputs.sha256 }}
        run: |
          set -euo pipefail
          publisher="$RUNNER_TEMP/publisher/cf-publish"
          got=$(shasum -a 256 "$publisher" | cut -d' ' -f1)
          if [ -z "$PUBLISHER_SHA256" ] || [ "$got" != "$PUBLISHER_SHA256" ]; then
            echo "the publisher downloaded hashes to $got, and the job that built it says ${PUBLISHER_SHA256:-nothing}" >&2
            exit 1
          fi
          echo "the publisher is the binary that was built: $got"
          chmod +x "$publisher"
      # Versioned files first, then the rolling feeds installed apps read: a
      # feed naming an archive that is not up yet would fail every check. It is
      # cf-publish's, in this order: the rule's refusals before anything moves
      # (a later release is refused until the old feeds serve the bridge with its
      # files), the versioned release, whose files are held to the ones built
      # here (a release made by a run that died is finished, not refused for
      # existing), then each feed the rule names, its latest.json swapped in
      # without a moment spent deleted, and left alone where it already names a
      # later release. Run again after a failure, it finishes the work; it leaves
      # feeds-before.json in this folder, what each new feed named before it
      # changed any, for the check below.
      - name: Publish the release, then its update feeds
        working-directory: ${{ runner.temp }}/dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/publisher/cf-publish" publish --dir . --tag "$GITHUB_REF_NAME" \
            --base "https://github.com/$GITHUB_REPOSITORY/releases/download"
      # What the rule says, read back from where installed apps read it: every
      # file of the release downloads as the one built, every new feed of its
      # channels serves its latest.json (or names a later release, which the
      # publisher left it at, and never one that went back), and the old feeds
      # in use serve the bridge, with the archive, installer and portable the
      # old apps need (cf-publish feeds check).
      - name: The feeds serve this release, and its archive downloads
        working-directory: ${{ runner.temp }}/dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A feed just swapped can answer 404 for a few minutes while GitHub's
          # download links catch up (alpha.83, 2026-10-08): 36 reads, 5 s apart.
          "$RUNNER_TEMP/publisher/cf-publish" feeds check --dir . \
            --version "${GITHUB_REF_NAME#v}" \
            --base "https://github.com/$GITHUB_REPOSITORY/releases/download" \
            --attempts 36
