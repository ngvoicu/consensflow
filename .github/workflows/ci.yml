# The gate on both platforms the app ships for: lint and the Node suite, the
# integration suite on a real pane host (the release bridge), the page's
# Playwright suite (on macOS: it needs no app, and once is enough), and the
# Rust host's tests, headless ones included, and clippy. The packaged smoke
# needs a built app and stays with the release build. Rust comes from the
# runner's own rustup; the one third-party action is pinned to a commit. A
# release runs this same gate on the commit it releases.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hang fails the job in an hour, not GitHub's six.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> app/src-tauri/target"
      # The Rust laid out as rustfmt lays it out, checked before anything builds.
      - run: cargo fmt --check
        working-directory: app/src-tauri

      - run: npm ci
      - run: npm ci --prefix app
      # The page and the Node sidecar the Rust build expects beside it.
      - run: npm --prefix app run bundle:ui
      - run: npm --prefix app run prepare-sidecar

      - run: npm run check
      - if: runner.os == 'macOS'
        working-directory: app
        run: npx playwright install chromium && npm run test:ui
      # The pane host the integration suite drives, consensflow-bridge: a test
      # helper, built only with the test-helper feature, which no app build
      # turns on, so no bundle ships it.
      - run: npm run build:bridge
      - run: npm run test:integration
      # Cargo reads app/src-tauri/.cargo/config.toml from the folder it runs in:
      # on Windows its runner gives each test binary the manifest it needs.
      # The PTY tests read their children with no time limit of their own; a
      # stuck read on a runner (seen once on macOS) ends here. The headless
      # tests (tests/headless.rs) drive the helper; they are Unix-only and
      # build empty on Windows.
      - run: cargo test --features test-helper
        working-directory: app/src-tauri
        timeout-minutes: 15
      # Linted with the helper, and as the app builds: without it.
      - run: cargo clippy --all-targets --features test-helper -- -D warnings
        working-directory: app/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: app/src-tauri
