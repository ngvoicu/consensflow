# The gate on both platforms the app ships for: lint and the Node suite, the
# integration suite on a real pane host (the release bridge), the page's
# Playwright suite (on macOS: it needs no app, and once is enough), and the
# Rust host's tests, headless ones included, and clippy. The packaged smoke
# needs a built app and stays with the release build. Rust comes from the
# runner's own rustup; the one third-party action is pinned to a commit. A
# release runs this same gate on the commit it releases.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hang fails the job in an hour, not GitHub's six.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> app/src-tauri/target"
      # The Rust laid out as rustfmt lays it out, every crate of the
      # workspace, checked before anything builds.
      - run: cargo fmt --all --check

      - run: npm ci
      - run: npm ci --prefix app
      # The page and the Node sidecar the Rust build expects beside it, and the
      # native cf a window runs, built into bin/ for the integration suite.
      - run: npm --prefix app run bundle:ui
      - run: npm --prefix app run prepare-sidecar

      - run: npm run check
      - if: runner.os == 'macOS'
        working-directory: app
        run: npx playwright install chromium && npm run test:ui
      # The pane host the integration suite drives, consensflow-bridge: a
      # binary of cf-panes, which no Tauri bundle ships.
      - run: npm run build:bridge
      - run: npm run test:integration
      # The daemon's suites and the rig's against both daemons, Node's and the
      # native cf ui (step 3.6, behind its switch until the flip).
      - run: npm run test:daemons
        timeout-minutes: 20
      # Cargo reads app/src-tauri/.cargo/config.toml from the folder it runs in:
      # on Windows its runner gives each test binary the manifest it needs.
      # The PTY tests read their children with no time limit of their own; a
      # stuck read on a runner (seen once on macOS) ends here.
      - run: cargo test
        working-directory: app/src-tauri
        timeout-minutes: 15
      # The workspace's other crates, the pane host's tests among them, from
      # its root, where the app's Windows runner does not apply: they link no
      # dialog code. The headless tests (cf-panes/tests/headless.rs) drive the
      # helper; they are Unix-only and build empty on Windows. A limit for the
      # same reason, with room for a slow runner: the ledger's replay alone has
      # taken from 2 to 7 minutes on Windows' (2026-10-06), the step 9 to 15.
      - run: cargo test --workspace --exclude app
        timeout-minutes: 25
      # The ledger's parity while both implementations exist: the Node suite's
      # ledgers recorded afresh from src/ledger as it is now, and replayed
      # against cf-ledger. A change to the Node ledger that cf-ledger does not
      # mirror fails here, whether or not anyone recorded the traces again.
      - run: npm run parity:ledger
        timeout-minutes: 15
      # Every crate linted, its tests included.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The harnesses' crate as the daemon builds it, without the test kit
      # the workspace's tests turn on for it.
      - run: cargo clippy -p cf-harness --lib -- -D warnings
      # The daemon's end of the bridge, behind a feature nothing in the
      # workspace turns on yet: tested and linted here until the daemon does.
      - run: cargo test -p cf-bridge --features local
        timeout-minutes: 15
      - run: cargo clippy -p cf-bridge --features local --all-targets -- -D warnings
