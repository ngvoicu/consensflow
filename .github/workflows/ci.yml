# The gate on both platforms the app ships for: lint and the Node tests (the
# page's units and the extensions'), the black-box suites of crates/cf-e2e
# (the daemon, and the rig on a real pane host, with stand-in agents in real
# terminals, and the regressions on it; the CLI), the page's Playwright suite
# (on macOS: it needs no app, and once is enough), and the Rust host's tests,
# headless ones included, and clippy. The packaged smoke needs a built app and
# stays with the release build. Rust comes from the runner's own rustup; the
# third-party actions are pinned to a commit. A release runs this same gate
# on the commit it releases.
#
# The gate is jobs that run at once on each platform (T-558, 2026-10-25), and
# `gate (macos-latest)` and `gate (windows-latest)` are the checks to trust:
# each fails unless every other job of the run passed, so a job that failed,
# was cancelled or never ran fails both. (A job's result, as `needs` gives it,
# is the result of all its platforms at once.) It was one job a platform, which
# ran 66 to 75 minutes in the green runs of 2026-10-24 and 25 (40048912346,
# 40104125564, 40121152677, 40175643684), of which the daemons' suites were
# 41 to 55 (their cases take turns, a rig at a time: `cf_e2e::serial`), the
# workspace's tests 10 to 11 on macOS and 16 to 18 on Windows, Playwright 4 on
# macOS, the setup and the staging 2 to 4, and the rest 3. Now:
#   checks     the lint, the Node tests, Playwright, the CLI's and the app's
#              tests, cf-e2e's own, clippy, and cf-bridge's;
#   workspace  the workspace's tests, whole (its limit below says why);
#   daemons    the daemons' suites in three shards, a third of their cases
#              each (`cargo xtask test daemons` with CF_TEST_SHARD: suites.rs).
# Five jobs a platform: GitHub runs five macOS jobs of an account at once.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The Rust laid out as rustfmt lays it out, every crate of the
      # workspace, checked before anything builds.
      - run: cargo fmt --all --check
      # The page, and the native cf a window runs, built into bin/ for the
      # page's Playwright suite and staged as the resource the Rust build expects.
      - run: npm --prefix app run bundle:ui
      - run: npm --prefix app run prepare-sidecar
      - run: npm run check
      - if: runner.os == 'macOS'
        working-directory: app
        run: npx playwright install chromium && npm run test:ui
      # The CLI's suites against the native cf, which answers every verb.
      - run: npm run test:clis
        timeout-minutes: 15
      # The app's own tests. On Windows the library's test binary carries the
      # manifest it needs, put there at link time (app/src-tauri/build.rs).
      # The PTY tests read their children with no time limit of their own; a
      # stuck read on a runner (seen once on macOS) ends here.
      - run: cargo test
        working-directory: app/src-tauri
        timeout-minutes: 15
      # What is left of crates/cf-e2e when its black-box suites are run by the
      # daemons' job and the step of the CLI's: its support and the stand-in
      # agents' own tests.
      - run: cargo test -p cf-e2e --lib --bins
        timeout-minutes: 10
      # Every crate linted, its tests included.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The harnesses' crate as the daemon builds it, without the test kit
      # the workspace's tests turn on for it.
      - run: cargo clippy -p cf-harness --lib -- -D warnings
      # The daemon's end of the bridge, behind a feature nothing in the
      # workspace turns on yet: tested and linted here until the daemon does.
      - run: cargo test -p cf-bridge --features local
        timeout-minutes: 15
      - run: cargo clippy -p cf-bridge --features local --all-targets -- -D warnings

  workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm --prefix app run bundle:ui
      - run: npm --prefix app run prepare-sidecar
      # The workspace's other crates, the pane host's tests among them, from
      # its root: they link no dialog code, so they need no manifest. The
      # headless tests (cf-panes/tests/headless.rs) drive the helper; they are
      # Unix-only and build empty on Windows. The black-box suites of
      # crates/cf-e2e run in the daemons' job and the CLI's step, each with a
      # limit of its own; what is left of that crate is the checks' job's.
      # The limit is a bound over what the step takes on Windows' runner, with a
      # margin, and `cargo xtask ci-times` fails when a run passes 80 % of it (32
      # minutes). The step took 17.8 minutes there in the median (13 to 23) until
      # 2026-10-18, 25 once on 2026-10-19, then grew run after run to 34 (main at
      # 04bc9d66, 2026-10-21) and was cut at 40 in the Release run of
      # 3.0.6-alpha.1, in the ledger's replay, which did not grow (203 s in the
      # median before, 232 after): the clock ran out there. What grew, binary by
      # binary: the dispatcher's schedule exploring (B5, 2026-10-18, +170 s, more
      # since), the history viewer (2026-10-21: the daemon's tests +160 s, its
      # whole-history tests +115 s), the long run (2026-10-19, +110 s) and the
      # release commands' tests (2026-10-21, +60 s). Much of it was the commits of
      # ledgers made for a test, each a flush on Windows, which wait for no disk
      # now (cf-ledger's `synchronous`), and the replay of Node's recordings runs
      # four at a time. On zeewin the binaries took 645 s before and 443 s after;
      # applied binary by binary to CI's last three runs (30.7 minutes in the
      # median), that is about 20 minutes: a floor of the saving, as zeewin's disk
      # is quicker than the runner's. 40 stays, as it was: the slowest of the runs
      # before the growth (25 minutes) was 1.4 times their median, and 1.4 times 20
      # is 28, under the 32 the check allows. The runs after this one confirm it (`cargo xtask
      # ci-times --step "cargo test --workspace" --binaries`). The step is not
      # split by crate, for now: its job is the longest of Windows' (about 22
      # minutes in all, 4 of them the build, and xtask's tests 3 to 4 of the
      # tests' 14), and a part split off would build what it tests again.
      # nextest runs a plant's `cargo test` (tools/xtask's plants), and the plants'
      # own tests run it: built once, then the cache's (~/.cargo/bin).
      - run: cargo install cargo-nextest --version 0.9.148 --locked
      - run: cargo test --workspace --exclude app --exclude cf-e2e
        timeout-minutes: 40

  daemons:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        shard: ['1/3', '2/3', '3/3']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm --prefix app run bundle:ui
      - run: npm --prefix app run prepare-sidecar
      # The black-box suites of crates/cf-e2e but the CLI's. Each builds the
      # programs it runs (the native cf, and the pane host consensflow-bridge, a
      # binary of cf-panes which no Tauri bundle ships). The daemon's, as a
      # process, the rig's: the daemon and the pane host in real terminals, with
      # stand-in agents in the windows, and the regressions': a case for each
      # bug the owner hit in real use, on that rig. A shard lists the cases of
      # the three, and runs every third from its own (suites.rs's `shard`), a
      # rig at a time as on one runner; it says how many of how many it ran.
      # They were two steps of one job, the daemon's and the rig's (30 minutes)
      # and the regressions (35): in the runs of 2026-10-24 and 25, 1,140 to
      # 1,250 s and 1,260 to 2,030 s, 2,400 to 3,200 s together, the macOS ones
      # the slower. A shard has a third, 800 to 1,070 s, and the build. 30 is the
      # smaller of the two limits, which no shard comes near; the runs of the
      # shards set it (`cargo xtask ci-times --step "test:daemons"`).
      - run: npm run test:daemons
        env:
          CF_TEST_SHARD: ${{ matrix.shard }}
        timeout-minutes: 30

      # A rig case that fails keeps a report of what its windows showed beside
      # its home, in the runner's temp folder (cf-e2e's rig/report.rs, `keep`),
      # which goes with the runner: so a failure that does not reproduce at home
      # is read from these (2026-10-21: Windows' folder-trust case). Node names
      # the folder as the Rust that wrote there does (TMPDIR on the Mac's
      # runner; on Windows', TMP, which Rust reads first and the runner sets as
      # it does TEMP, which Node reads); `runner.temp` is another folder. The
      # reports hold the stand-in agents' output and the daemon's log, from a
      # rig whose environment is its own (cf-e2e's rig/install.rs): no real
      # harness, home or token. The step that names the folder runs only for a
      # failed job, and the upload, for one that wrote none, says nothing. A rig
      # built for the real harnesses (cf-e2e's live::rig) keeps its report under the
      # workspace's build folder instead, and ten cases of the rig suite build on it
      # with the stand-in, so they fail into that folder: a second upload, not a second
      # line of the first's path, since the action roots an artifact at the common
      # ancestor of its paths and Windows' temp folder and workspace share none (C:, D:).
      # On a runner no real harness runs, so that folder holds stand-in output only.
      - name: Where the rig keeps the reports of its failed cases
        if: failure()
        run: echo "RIG_TEMP=$(node -p "require('os').tmpdir()")" >> "$GITHUB_ENV"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rig-reports-${{ matrix.os }}
          path: ${{ env.RIG_TEMP }}/consensflow-integration-*-left.txt
          if-no-files-found: ignore
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-rig-reports-${{ matrix.os }}
          path: app/src-tauri/target/live-reports/consensflow-integration-*-left.txt
          if-no-files-found: ignore
          retention-days: 7

  # The checks a release and a branch rule read, one a platform, named as the
  # one job a platform was: green only when every job above passed. They run
  # whatever the jobs above did (`always()`), so that a job that failed, was
  # cancelled or was skipped makes them red and not skipped, which a rule would
  # take for passed.
  gate:
    needs: [checks, workspace, daemons]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job of the gate passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null
