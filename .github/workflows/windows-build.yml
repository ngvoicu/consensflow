# The Windows app as people download it: the NSIS installer and the portable
# exe, built on a Windows runner. The release workflow runs it for every
# version tag; run it by hand (Actions → Windows build → Run workflow) for any
# commit, and the run carries both files as its download. Neither is
# code-signed, so Windows shows its unknown-publisher warning on first run.
# What builds them is ours or pinned: Rust from the runner's own rustup, and
# the one third-party action at a commit, never a tag that can move.
name: Windows build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> app/src-tauri/target"

      - run: npm ci
      - run: npm ci --prefix app
      # The page, the Node sidecar and the CLI resources, then the app and its installer.
      - run: npm --prefix app run build
      - run: npm --prefix app run portable

      # The portable exe, started once as someone would: its first start
      # unpacks the runtime its footer names (app/src-tauri/src/portable.rs)
      # into the app's local data folder, and the daemon comes up on that Node,
      # with a home of its own. The folder is read off the exe itself: the
      # gzip trailer's CRC32 ends 24 bytes before the file does.
      - name: The portable exe unpacks its runtime and its daemon starts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Get-Item app/src-tauri/target/release/bundle/portable/*-portable.exe).FullName
          $version = node -p "require('./app/src-tauri/tauri.conf.json').version"
          $file = [IO.File]::OpenRead($exe)
          try {
            $end = [byte[]]::new(24)
            [void]$file.Seek(-24, [IO.SeekOrigin]::End)
            [void]$file.Read($end, 0, 24)
          } finally {
            $file.Dispose()
          }
          if ([Text.Encoding]::ASCII.GetString($end, 16, 8) -ne 'CFPAYLD1') {
            throw "$exe does not end with the portable footer"
          }
          $runtime = Join-Path $env:LOCALAPPDATA ('dev.ngvoicu.consensflow\runtime\{0}-{1:x8}' -f $version, [BitConverter]::ToUInt32($end, 0))
          "payload: $([BitConverter]::ToUInt64($end, 8)) bytes; runtime: $runtime"

          $cfHome = Join-Path $env:RUNNER_TEMP 'portable-home'
          New-Item -ItemType Directory -Force $cfHome | Out-Null
          $env:CONSENSFLOW_HOME = $cfHome
          $app = Start-Process -FilePath $exe -PassThru `
            -RedirectStandardOutput (Join-Path $cfHome 'app-stdout.log') `
            -RedirectStandardError (Join-Path $cfHome 'app-stderr.log')
          # Held now, or the exit code of a process that ended reads as nothing.
          $null = $app.Handle
          $log = Join-Path $cfHome 'daemon.log'
          $deadline = (Get-Date).AddMinutes(3)
          while ($true) {
            $unpacked = Test-Path (Join-Path $runtime '.unpacked')
            $started = (Test-Path $log) -and [bool](Select-String -Path $log -SimpleMatch ' info start pid ' -Quiet)
            $node = @(Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" |
              Where-Object { $_.ExecutablePath -like "$runtime\*" })
            "unpacked: $unpacked; daemon log says it started: $started; node from the runtime: $($node.Count)"
            if ($unpacked -and $started -and $node.Count -gt 0) { $outcome = 'up'; break }
            if ($app.HasExited) { $outcome = "the app exited with code $($app.ExitCode)"; break }
            if ((Get-Date) -gt $deadline) { $outcome = 'nothing came up within three minutes'; break }
            Start-Sleep -Seconds 3
          }
          if ($outcome -ne 'up') {
            "the portable exe did not come up: $outcome"
            foreach ($name in 'daemon.log', 'app\app.log', 'app-stderr.log', 'app-stdout.log') {
              $path = Join-Path $cfHome $name
              if (Test-Path $path) { "--- $path"; Get-Content $path -Tail 80 }
            }
            $root = Split-Path $runtime
            if (Test-Path $root) { "--- $root"; Get-ChildItem $root -Recurse -Depth 1 | ForEach-Object FullName }
          }
          if (-not $app.HasExited) { taskkill /PID $app.Id /T /F | Out-Host }
          # Bounded: this step runs inside every release.
          [void]$app.WaitForExit(30000)
          if ($outcome -ne 'up') { exit 1 }
          # A pane's `cf`: the runtime's cf.exe runs the CLI beside it on the runtime's Node.
          $env:CONSENSFLOW_NODE = Join-Path $runtime 'node.exe'
          $said = & (Join-Path $runtime 'cli\bin\cf.exe') --version
          if ($said -ne $version) { "the runtime's cf.exe said '$said', not $version"; exit 1 }
          "the portable exe unpacked $runtime, its daemon came up on that Node, and its cf.exe runs the CLI"
          exit 0

      - uses: actions/upload-artifact@v7
        with:
          name: ConsensFlow-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*-setup.exe
            app/src-tauri/target/release/bundle/portable/*-portable.exe
          if-no-files-found: error
