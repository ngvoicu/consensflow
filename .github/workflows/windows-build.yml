# The Windows app as people download it: the NSIS installer and the portable
# exe, built on a Windows runner. The release workflow runs it for every
# version tag; run it by hand (Actions → Windows build → Run workflow) for any
# commit, and the run carries both files as its download. Neither is
# code-signed, so Windows shows its unknown-publisher warning on first run.
# What builds them is ours or pinned: Rust from the runner's own rustup, and
# the one third-party action at a commit, never a tag that can move.
name: Windows build

on:
  workflow_dispatch:
    inputs:
      daemon:
        description: The daemon the portable exe starts (default is the app's own choice)
        type: choice
        options: [default, node, native]
        default: default
  workflow_call:
    inputs:
      daemon:
        type: string
        default: default

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # What a run asked of the portable exe's daemon, by name: a release asks
      # for none, and the app starts its own default.
      CF_DAEMON: ${{ inputs.daemon }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> app/src-tauri/target"

      - run: npm ci
      - run: npm ci --prefix app
      # The page, the Node sidecar and the CLI resources, then the app and its installer.
      - run: npm --prefix app run build
      - run: npm --prefix app run portable

      # The portable exe, started once as someone would: its first start
      # unpacks the runtime its footer names (app/src-tauri/src/portable.rs)
      # into the app's local data folder, under portable-runtime (not the
      # runtime folder of the apps before the flip release, whose collector
      # would empty it), and the daemon comes up from that runtime, with a home
      # of its own: Node's node.exe, or the native daemon's cf.exe, whichever
      # the app starts, and the step says which it was. The folder is read off
      # the exe itself: the gzip trailer's CRC32 ends 24 bytes before the file
      # does.
      - name: The portable exe unpacks its runtime and its daemon starts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Get-Item app/src-tauri/target/release/bundle/portable/*-portable.exe).FullName
          $version = node -p "require('./app/src-tauri/tauri.conf.json').version"
          $file = [IO.File]::OpenRead($exe)
          try {
            $end = [byte[]]::new(24)
            [void]$file.Seek(-24, [IO.SeekOrigin]::End)
            [void]$file.Read($end, 0, 24)
          } finally {
            $file.Dispose()
          }
          if ([Text.Encoding]::ASCII.GetString($end, 16, 8) -ne 'CFPAYLD1') {
            throw "$exe does not end with the portable footer"
          }
          $runtime = Join-Path $env:LOCALAPPDATA ('dev.ngvoicu.consensflow\portable-runtime\{0}-{1:x8}' -f $version, [BitConverter]::ToUInt32($end, 0))
          "payload: $([BitConverter]::ToUInt64($end, 8)) bytes; runtime: $runtime"

          $cfHome = Join-Path $env:RUNNER_TEMP 'portable-home'
          New-Item -ItemType Directory -Force $cfHome | Out-Null
          $env:CONSENSFLOW_HOME = $cfHome
          # The daemon, when a hand run asked for one by name (node or native).
          if ($env:CF_DAEMON -and $env:CF_DAEMON -ne 'default') { $env:CONSENSFLOW_DAEMON = $env:CF_DAEMON }
          $app = Start-Process -FilePath $exe -PassThru `
            -RedirectStandardOutput (Join-Path $cfHome 'app-stdout.log') `
            -RedirectStandardError (Join-Path $cfHome 'app-stderr.log')
          # Held now, or the exit code of a process that ended reads as nothing.
          $null = $app.Handle
          $log = Join-Path $cfHome 'daemon.log'
          $deadline = (Get-Date).AddMinutes(3)
          while ($true) {
            $unpacked = Test-Path (Join-Path $runtime '.unpacked')
            # The daemon's own first line says which daemon it is: Node's names its
            # runtime (`node v26...`), the native one says `rust`.
            $kind = ''
            if (Test-Path $log) {
              $line = Select-String -Path $log -Pattern ' info start pid \d+ (node|rust) ' | Select-Object -First 1
              if ($line) { $kind = $line.Matches[0].Groups[1].Value }
            }
            # And that daemon's program runs from the runtime: node.exe, or cf.exe.
            $program = @{ node = 'node.exe'; rust = 'cf.exe' }[$kind]
            $daemons = @()
            if ($program) {
              $daemons = @(Get-CimInstance Win32_Process -Filter "Name = '$program'" |
                Where-Object { $_.ExecutablePath -like "$runtime\*" })
            }
            "unpacked: $unpacked; daemon log says it started: '$kind'; $program from the runtime: $($daemons.Count)"
            if ($unpacked -and $kind -and $daemons.Count -gt 0) { $outcome = 'up'; break }
            if ($app.HasExited) { $outcome = "the app exited with code $($app.ExitCode)"; break }
            if ((Get-Date) -gt $deadline) { $outcome = 'nothing came up within three minutes'; break }
            Start-Sleep -Seconds 3
          }
          if ($outcome -ne 'up') {
            "the portable exe did not come up: $outcome"
            foreach ($name in 'daemon.log', 'app\app.log', 'app-stderr.log', 'app-stdout.log') {
              $path = Join-Path $cfHome $name
              if (Test-Path $path) { "--- $path"; Get-Content $path -Tail 80 }
            }
            $root = Split-Path $runtime
            if (Test-Path $root) { "--- $root"; Get-ChildItem $root -Recurse -Depth 1 | ForEach-Object FullName }
          }
          if (-not $app.HasExited) { taskkill /PID $app.Id /T /F | Out-Host }
          # Bounded: this step runs inside every release.
          [void]$app.WaitForExit(30000)
          if ($outcome -ne 'up') { exit 1 }
          # A daemon asked for by name is the one that started: node says `node`, native says `rust`.
          $expected = if ($env:CF_DAEMON) { @{ node = 'node'; native = 'rust' }[$env:CF_DAEMON] }
          if ($expected -and $kind -ne $expected) { "asked for the $env:CF_DAEMON daemon, its log says '$kind'"; exit 1 }
          # A pane's `cf`: the runtime's cf.exe, on the runtime's Node where it
          # hands a command on to the CLI's sources (the bundle still has them).
          $env:CONSENSFLOW_NODE = Join-Path $runtime 'node.exe'
          $said = & (Join-Path $runtime 'cli\bin\cf.exe') --version
          if ($said -ne $version) { "the runtime's cf.exe said '$said', not $version"; exit 1 }
          # The terminals' console host, which the app names to Windows' library search.
          foreach ($name in 'conpty.dll', 'OpenConsole.exe') {
            if (-not (Test-Path (Join-Path $runtime $name))) { "the runtime has no $name"; exit 1 }
          }
          # The runtime went under its own parent, out of reach of the older
          # apps' collector, and nothing was put in the folder it empties.
          $older = Join-Path $env:LOCALAPPDATA 'dev.ngvoicu.consensflow\runtime'
          if (Test-Path $older) { "the runtime was unpacked into the old folder $older"; exit 1 }
          "the portable exe unpacked $runtime with its console host, its daemon came up from it (the $kind daemon, $program), and its cf.exe runs the CLI"
          exit 0

      - uses: actions/upload-artifact@v7
        with:
          name: ConsensFlow-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*-setup.exe
            app/src-tauri/target/release/bundle/portable/*-portable.exe
          if-no-files-found: error
