# The Windows app as people download it: the NSIS installer and the portable
# zip, built on a Windows runner. The release workflow runs it for every
# version tag; run it by hand (Actions → Windows build → Run workflow) for any
# commit, and the run carries both files as its download. Neither is
# code-signed, so Windows shows its unknown-publisher warning on first run.
name: Windows build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: npm ci
      - run: npm ci --prefix app
      # The page, the Node sidecar and the CLI resources, then the app and its installer.
      - run: npm --prefix app run build
      - run: npm --prefix app run portable

      - uses: actions/upload-artifact@v7
        with:
          name: ConsensFlow-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*-setup.exe
            app/src-tauri/target/release/bundle/portable/*-portable.zip
          if-no-files-found: error
