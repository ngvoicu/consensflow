# What every job of the gate (ci.yml) starts from, after the checkout: Node with
# the npm cache, Rust from the runner's own rustup at the version .github/rust-version
# names (T-1523: never the runner's `stable`, which moves), with clippy and rustfmt,
# Swatinem/rust-cache (pinned to a commit; its key holds the job's id, so each
# job keeps the build it makes, and the shards of one job share one; saved
# only after a green job, unless `cache-on-failure` is true), and the packages
# of the root and of the app.
name: Gate setup
description: Node, Rust, the build cache and the npm packages, for a job of ci.yml
inputs:
  cache-on-failure:
    description: Save the build cache although a step after it failed
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: npm
        cache-dependency-path: |
          package-lock.json
          app/package-lock.json
    - shell: bash
      run: rustup toolchain install "$(cat .github/rust-version)" --profile minimal --component clippy,rustfmt --no-self-update && rustup default "$(cat .github/rust-version)"
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: ". -> app/src-tauri/target"
        cache-on-failure: ${{ inputs.cache-on-failure }}
    - shell: bash
      run: npm ci
    - shell: bash
      run: npm ci --prefix app
