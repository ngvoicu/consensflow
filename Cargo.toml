# Every Rust crate of ConsensFlow in one workspace: one lockfile, shared
# versions and lints. The Node code moves here module by module (decided
# 2026-10-04; the plan is in the consensflow-sme brain).
[workspace]
resolver = "2"
members = ["app/src-tauri", "crates/*"]

[workspace.package]
version = "3.0.0-alpha.73"
edition = "2021"
rust-version = "1.95"

# One version of each dependency for every crate; a crate names it with
# `name.workspace = true`, and adds the features it needs on top of the ones
# named here.
[workspace.dependencies]
cf-proto = { path = "crates/cf-proto" }
cf-bridge = { path = "crates/cf-bridge" }
cf-panes = { path = "crates/cf-panes" }
cf-base = { path = "crates/cf-base" }
cf-board = { path = "crates/cf-board" }
cf-harness = { path = "crates/cf-harness" }
cf-process = { path = "crates/cf-process" }
cf-codex-session = { path = "crates/cf-codex-session" }
cf-ledger = { path = "crates/cf-ledger" }
base64 = "0.22"
bytes = "1"
flate2 = "1"
form_urlencoded = "1"
futures-channel = "0.3"
futures-executor = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
http-body-util = "0.1"
# HTTP/1 for the Codex window's broker, routes matched by hand, as the plan decided.
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# Unicode as Node's ICU holds it, 17.0: normalization forms and general
# categories, for the text Windows' console carries (`consoleText`). Already in
# the build, through `url`.
icu_normalizer = "2.3"
icu_properties = "2.3"
# The time zone database for the quota's resets, and nothing else of it. Its
# defaults, with the database bundled on every platform and not only on
# Windows (`tzdb-bundle-always`): the global one jiff reads by default is the
# system's files, found through `TZDIR` and `/usr/share/zoneinfo`, which a
# machine may lack and a test would then depend on.
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
libc = "0.2"
# A checked close, which std does not give (cf-base forbids unsafe code).
nix = { version = "0.28", default-features = false }
portable-pty = "0.9"
regex = "1"
# The ledger's SQLite, built in: every platform runs the same SQLite.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
# Objects keep their keys in the order written, as JavaScript's do: JSON
# that Node wrote reads back, and goes out again, as Node had it.
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "2"
# One thread, as Node is: a crate adds the features it needs. Only the Codex
# window's supervisor and broker run a runtime so far.
tokio = { version = "1", default-features = false }
# WebSockets with no TLS: both ends of the broker are on this machine.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# Plain HTTP to the daemon on loopback, synchronous: a `cf` run starts no runtime.
ureq = { version = "3", default-features = false }
uuid = { version = "1", default-features = false, features = ["v4"] }
windows-sys = "0.61"
# A file's index on Windows, the identity std keeps unstable, with no unsafe of ours.
winapi-util = "0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
todo = "deny"
# The rewrite's rules: a failure is a value, and nothing prints behind its
# caller's back (tests are exempt in clippy.toml; code older than the rules
# says so where it is).
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
