# Every Rust crate of ConsensFlow in one workspace: one lockfile, shared
# versions and lints. The Node code moves here module by module (decided
# 2026-10-04; the plan is in the consensflow-sme brain).
[workspace]
resolver = "2"
members = ["app/src-tauri", "crates/*"]
# The Windows `cf` launcher goes when the native `cf` replaces it.
exclude = ["app/cf-launcher"]

[workspace.package]
version = "3.0.0-alpha.72"
edition = "2021"
rust-version = "1.95"

# One version of each dependency for every crate; a crate names it with
# `name.workspace = true`.
[workspace.dependencies]
cf-proto = { path = "crates/cf-proto" }
cf-bridge = { path = "crates/cf-bridge" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
todo = "deny"
