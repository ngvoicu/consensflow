# Claude Code's own advisor tool, which a project's Project settings has its members run without
# (A5-20, T-1399): kept in the ledger (`crates/cf-ledger/src/projects/advisor_tool.rs`, migration
# 0035's `advisor_tool`, off until the human ticks it), chosen on the page alone
# (`project.advisor_tool`, Project settings' "Advisor tool"), told by the engine to every
# member's launch at launch and on resume and never to the chief's
# (`crates/cf-engine/src/windows.rs`), and acted on by the Claude adapter alone, in the launch's
# own settings file (`env.CLAUDE_CODE_DISABLE_ADVISOR_TOOL`), never in the owner's config. Each
# plant breaks one of these and the test written for it fails.
#
# Every name holds `advisor off`, so `npm run plants:daemon -- "advisor off"` runs them all.

[run]
ao-ledger-described = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "described", "advisor_tool::"]
ao-engine-dispatcher = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "advisor_off::"]
ao-harness-launch = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "claude::advisor_off"]
ao-daemon-page = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::advisor_tool"]
ao-daemon-opening = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::opening"]
ao-proto-page = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "page::"]
ao-rig = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "advisor_off::"], builds = true }

[[plant]]
name = "advisor off: the Claude adapter writes no switch"
meant = "every_members_launch_of_a_project_with_the_tool_off_has_it_switched_in_its_own_file_and_nothing_else_moves"
runs = ["ao-harness-launch"]

[[plant.edit]]
file = "crates/cf-harness/src/claude/install.rs"
find = '''        file["env"] = json!({ ADVISOR_KILL_SWITCH: "1" });'''
replace = '''        let _ = ADVISOR_KILL_SWITCH;'''

[[plant]]
name = "advisor off: the Claude adapter writes the switch whatever the launch says"
meant = "a_launch_of_a_project_with_the_tool_on_writes_the_settings_file_it_always_wrote_byte_for_byte"
runs = ["ao-harness-launch"]

[[plant.edit]]
file = "crates/cf-harness/src/claude/install.rs"
find = '''    if advisor_off {
        file["env"]'''
replace = '''    if true {
        file["env"]'''

