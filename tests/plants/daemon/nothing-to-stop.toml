# A window whose turn is over has nothing for a stop to interrupt, and is never closed
# for keys nothing in it could heed (T-551, 2026-10-25, 3.0.6-alpha.2): a weekly limit's
# hold pressed Escape into T-502's window, whose turn the refusal had ended, closed it
# after three rounds and ended the plant run it left in the background; a `cf tell`
# stopped T-604's turn with its first Escape, and the window, busy with three
# background agents, was closed all the same. One close was told twice.
#
# - a turn the record says is over is read at work while Claude says busy (T-604);
# - a turn a refusal for quota ended is read at work while the look is not at rest
#   (T-502);
# - Claude's look says nothing of its record's word that the turn is over;
# - a close is told to the human and to the requester, two notes of one event;
# - a close of a task the human gave goes to the chief, or in the chief's words
#   (the human arm of the notes);
# - whoever asked the stop, the human pausing a task the chief gave or the chief
#   telling one the human gave, is not told their act closed the window (T-650);
# - the record's word that a turn is over counts at once, so a look in the moment
#   Claude says busy before a new turn's message is written reads it over, and one
#   not yet counted is pressed again (Calliope on T-551, T-644);
# - the ledger cannot say who asked a stop;
# - the pause's help says the window and its work wait (T-650);
# - the stand-in's `AGENTS --then` starts no agents, so the rig's cases lose their shape;
# - a message of the user's after the one the pressed turn began with is no turn passed,
#   so the turns Claude begins by itself for its agents' notices, a second after the
#   Escape that stopped its turn, are pressed again and closed (T-807);
# - a turn passed is read from the last item of any kind, or from a compaction's summary,
#   so a hung turn that writes, or is compacted, pays its stop and is never closed.
#
# The engine's tests are in `crates/cf-engine/tests/dispatcher/nothing_to_stop.rs` and
# `stops.rs`; Claude's look, in `crates/cf-harness/tests/launch/claude/agents.rs`; the
# rig's cases, in `crates/cf-e2e/tests/regressions/
# a_window_with_nothing_to_stop_was_closed_and_its_work_ended.rs`, which run the native
# `cf` built from the planted sources (`builds`).
#
# The ledger's test of who asked a stop is in `crates/cf-ledger/tests/receipt/sessions.rs`;
# the pause's help, in `crates/cf/tests/help.rs` and `board_goldens.rs`.
#
# Every name holds `nothing to stop`, so `cargo xtask plants daemon "nothing to stop"`
# runs them all.

[run]
# Claude's look at a window busy with the agents its turn left, or whose turn ended.
harness-launch-claude-agents = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "claude::agents::"]
# The rig's cases, against the native `cf`.
rig-regression-nothing-to-stop = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_window_with_nothing_to_stop_was_closed_and_its_work_ended::"], builds = true }
# The stand-in's own tests of what it answers.
fake-agent-reply = ["cargo", "test", "--offline", "-p", "cf-e2e", "--bin", "fake-agent", "reply::"]
# The ledger's tests of the sessions' stops.
ledger-receipt-sessions = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "sessions::"]
# The board's help, against the usage.
cf-help = ["cargo", "test", "--offline", "-p", "cf", "--test", "help"]

[[plant]]
name = "nothing to stop: a turn its record ends is at work while Claude says busy"
meant = "a_tell_whose_escape_stopped_a_turn_with_background_agents_keeps_the_window_and_goes_in_once_it_rests"
runs = ["engine-dispatcher"]

[[plant.edit]]
file = "crates/cf-engine/src/stops.rs"
find = "} else if observed.settled || observed.over == Over::Held || self.cut_short(observed) {"
replace = "} else if observed.settled || self.cut_short(observed) {"

[[plant]]
name = "nothing to stop: a turn its record ends is at work while Claude says busy, on the rig"
meant = "a_tell_that_stopped_a_turn_whose_agents_run_keeps_the_window_and_its_work"
runs = ["rig-regression-nothing-to-stop"]
builds = true

[[plant.edit]]
file = "crates/cf-engine/src/stops.rs"
find = "} else if observed.settled || observed.over == Over::Held || self.cut_short(observed) {"
replace = "} else if observed.settled || self.cut_short(observed) {"

# The stand-in writes Claude's own message of the interrupt, `[Request interrupted by user]`,
# which pays the stop as a turn passed too (T-807): on the rig, that rule goes with it.
[[plant.edit]]
file = "crates/cf-engine/src/stops.rs"
find = "    pressed.is_some_and(|pressed| last_message(observed).is_some_and(|now| now != pressed))"
replace = "    pressed.is_some_and(|pressed| last_message(observed).is_some_and(|now| now != pressed && false))"

