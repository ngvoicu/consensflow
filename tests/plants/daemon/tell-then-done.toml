# The final answer a tell's turn ends with while its task is paused (T-442; T-429 on 3.0.5, T-534's live
# runs on 3.0.6-alpha.2): `cf tell` pauses the task and puts the chief's words to the window as a question;
# the window answered with `cf answer`, went on in the same turn and ended it with its complete answer,
# and nobody had it. The rule (`crates/cf-engine/src/turn_end/paused.rs`, `crates/cf-ledger/src/messages/
# paused_answers.rs`): a turn that ends with a complete answer after the tell's paste, while its task is
# paused (or resumed, the resume queued behind the turn) and nothing is pending, is put to whoever gave
# the task, once for each tell, in a note with the words; the task stays paused; Finish takes a paused
# task's last complete answer as its result (`crates/cf-engine/src/turn_end/finish.rs`, `record_finished` of
# `crates/cf-ledger/src/tasks/finishing.rs`) and withdraws a note not yet given; a window's own `cf task
# done` stays refused for it. Round 2 (the chief's review): a resume does not withdraw the note
# (`leave_pause_notes` in `crates/cf-ledger/src/messages/pauses.rs`); not yet given, it is written again in
# the words of a task that has moved on.
#
# Each plant takes one rule out again. The names begin with `tell then done`, so
# `cargo xtask plants daemon "tell then done"` runs them.

[run]
engine-paused-answers = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "paused_answers::"]
ledger-receipt-suspended = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "suspended::"]
page-finish = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "paused, though its lane"]
ledger-pause-notes = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "pause_notes"]
rig-regression-tell-then-done = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_final_answer_written_in_a_tells_turn"]

