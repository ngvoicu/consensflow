name = "tell then done: a turn that ends on a paused task is never looked at for an answer to a tell"
meant = "the_final_answer_a_window_ends_the_turn_of_a_tell_with_is_put_to_the_chief_once_and_the_task_stays_paused"
runs = ["engine-paused-answers"]

