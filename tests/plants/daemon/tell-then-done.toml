# The final answer a tell's turn ends with while its task is paused (T-442; T-429 on 3.0.5, T-534's live
# runs on 3.0.6-alpha.2): `cf tell` pauses the task and puts the chief's words to the window as a question;
# the window answered with `cf answer`, went on in the same turn and ended it with its complete answer,
# and nobody had it. The rule (`crates/cf-engine/src/turn_end/paused.rs`): a turn that ends with a
# complete answer after the tell's paste, while the task is paused and nothing is pending, is put to
# whoever gave the task, once, in a note with the words; the task stays paused; Finish takes a paused
# task's last complete answer as its result (`crates/cf-engine/src/turn_end/finish.rs`,
# `record_finished` of `crates/cf-ledger/src/tasks/finishing.rs`), and a window's own `cf task done`
# stays refused for it.
#
# Each plant takes one rule out again. The names begin with `tell then done`, so
# `cargo xtask plants daemon "tell then done"` runs them.

[run]
engine-paused-answers = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "paused_answers::"]
rig-regression-tell-then-done = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_final_answer_written_in_a_tells_turn"]

[[plant]]
name = "tell then done: a turn that ends on a paused task is never looked at for an answer to a tell"
meant = "the_final_answer_a_window_ends_the_turn_of_a_tell_with_is_put_to_the_chief_once_and_the_task_stays_paused"
runs = ["engine-paused-answers"]

[[plant.edit]]
file = "crates/cf-engine/src/turn_end.rs"
find = "            self.tell_paused_answer(project, participant, observed)?;\n"
replace = ""

[[plant]]
name = "tell then done: the rig's window answers its tell and goes on, and its final answer reaches nobody"
meant = "the_final_answer_a_worker_ends_the_turn_of_a_tell_with_reaches_the_chief_and_finish_makes_it_the_result"
runs = ["rig-regression-tell-then-done"]
builds = true

[[plant.edit]]
file = "crates/cf-engine/src/turn_end.rs"
find = "            self.tell_paused_answer(project, participant, observed)?;\n"
replace = ""

[[plant]]
name = "tell then done: the answer is told again at every pass"
meant = "the_final_answer_a_window_ends_the_turn_of_a_tell_with_is_put_to_the_chief_once_and_the_task_stays_paused"
runs = ["engine-paused-answers"]

[[plant.edit]]
file = "crates/cf-engine/src/turn_end/paused.rs"
find = "                && message.body == body\n"
replace = "                && message.body == WITHOUT_ANSWER\n"

[[plant]]
name = "tell then done: the note is about no task, so the thread does not hold it and a resume does not withdraw it"
meant = "a_resume_withdraws_the_note_the_chief_has_not_read_and_the_resumed_turn_is_the_result"
runs = ["engine-paused-answers"]

[[plant.edit]]
file = "crates/cf-engine/src/turn_end/paused.rs"
find = "                task: Some(number),\n"
replace = "                task: None,\n"

