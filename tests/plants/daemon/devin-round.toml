replace = '''        .find(|item| item.role == "assistant" && item.text.trim() == answer && last_line(&item.text).is_some())'''

[[plant]]
name = "devin round: a window opens in its project's folder as the project spells it"
meant = "a_window_of_a_project_reached_through_a_link_opens_in_the_real_folder_on_every_harness"
runs = ["devin-round-engine-folder"]
platforms = ["macos", "linux"]

[[plant.edit]]
