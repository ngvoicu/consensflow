# The tests that failed now and then on the CI runners (T-178, 3.0.6), each held by the test
# written for its cause; one plant takes one rule out and a test fails.
#
# - a throwaway OpenCode server is stopped when its process has ended, whatever still holds its
#   error stream open (`crates/cf-harness/src/shared/child.rs`, `cf_process::Child::ended`);
# - a stop waits for the pass it found running and for no longer than that, counted in the
#   timers' own time (`crates/cf-daemon/src/stop.rs`), and so is the stop of everything open (T-376):
#   one deadline for a pass that never ends, a door, an idle connection and a body half sent,
#   whatever the disk is doing (`stop/tests.rs`, reproduced in `stop/tests/load.rs`);
# - a daemon's stop is counted from the lines of its own log, in three parts a failure names: the
#   stop is one deadline for the waiting, the process is gone a moment after its last line, and
#   the whole of it, from the ask, is inside the app's two seconds (`crates/cf/tests/daemon_stop.rs`);
# - a stop does not wait for the error stream of a child that has exited, on any platform
#   (`crates/cf-harness/src/shared/child.rs`, the unit tests on its `Recording` fake).
#
# Every name holds `ci flakes`, so `npm run plants:daemon -- "ci flakes"` runs them all.

[run]
harness-channels-create = ["cargo", "test", "--offline", "-p", "cf-harness", "--features", "test-support", "--test", "channels", "a_server_that_has_exited"]
harness-shared-child = ["cargo", "test", "--offline", "-p", "cf-harness", "--features", "test-support", "--lib", "shared::child::"]
process-child-ended = ["cargo", "test", "--offline", "-p", "cf-process", "--lib", "child::tests::a_program_is_ended"]
daemon-lib-stop-pass = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "stop::tests::a_pass_that_ends"]
daemon-lib-stop-stall = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "stop::tests::a_machine_that_stalls"]
stop-program = ["cargo", "test", "--offline", "-p", "cf", "--test", "daemon_stop", "a_program_the_daemon_is_waiting_for"]
stop-busy = ["cargo", "test", "--offline", "-p", "cf", "--test", "daemon_stop", "a_busy_daemon_is_stopped"]
daemon-lib-stop-open = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "stop::tests::a_pass_that_never_ends"]

