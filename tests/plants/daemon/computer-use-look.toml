# Project settings' Computer use section drawn again, and the page's own sections made alike (T-1266,
# Gabriel, 2026-11-06: "looks like shit"): a block for each harness and one for the permissions,
# every block headed with its status on its line and a muted line under it, the same room between
# them; the permissions in one table, a column for each app (ConsensFlow's, read, and Codex
# Computer Use's, unknown) and one button for each pane, whichever app needs it; no path of the
# project; Windows with its two headings and no panes. And in the rest of the dialog: one gap
# inside every section, Save specs as the other sections' saves are, the compaction's choices
# read as the approval's checkbox does. One plant takes one rule out; a test of it fails. Every
# name holds `computer use look`.

[run]
# The section and the dialog's sections, in the browser Playwright keeps.
cul-page = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "computer use|computer-use|another app|omputer use|both blocks|permissions can't be read|spaced alike inside|compaction's two choices"]

[[plant]]
name = "computer use look: the project's path is shown in the status"
meant = "Project settings: computer use that is on says so, and on Windows says Claude Code has none there"
runs = ["cul-page"]

[[plant.edit]]
file = "app/ui/core/computer-use.js"
find = '''
          status: 'On for this project',
'''
replace = '''
          status: `On for this project (${said.folder})`,
'''

[[plant]]
name = "computer use look: a pane has a button for each app"
meant = "Project settings: a project with Claude Code and Codex members shows both blocks, and one permissions block with a column for each app and one button for each pane"
runs = ["cul-page"]

