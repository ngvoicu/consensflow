# Muse Code as a harness, its first phase (3.0.6, T-703; spec items MUS-04, MUS-05, MUS-06): where
# its CLI is (`crates/cf-harness/src/detect.rs`) and which version it is
# (`crates/cf-harness/src/muse/version.rs`, the admin's row in `admin/inspect.rs`); the reader of a
# session's log (`muse/record.rs`, on the logs of real sessions on Muse's fake model,
# `crates/cf-harness/tests/fixtures/muse`, and the schema's shapes, `muse/record/provisional.rs`);
# whether a session can be resumed (`muse/index.rs`); and the launch it refuses (`muse/adapter.rs`).
# The fixtures are made by `cargo xtask scrub-muse-session`, and swept for what is personal
# (`crates/cf-harness/tests/fixtures.rs`). Every name here begins `muse:`, so
# `cargo xtask plants daemon muse` runs them.

[run]
muse-lib = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "muse::"]
muse-detect = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "detect::"]
muse-admin = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "admin::"]
muse-records = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "records::tests"]
muse-env = ["cargo", "test", "--offline", "-p", "cf-base", "--lib", "env::"]
muse-scrub = ["cargo", "test", "--offline", "-p", "xtask", "--lib", "scrub_muse_session::"]
muse-quota = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::quota"]
muse-state = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::record_state"]
muse-codex = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "codex::record"]
muse-claude = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record"]
muse-pi = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "pi::record"]
muse-opencode = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "opencode::record"]
muse-page = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "says an account that refused"]
muse-accounts = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "a_teammates_turn"]
muse-page-held = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "held for an account"]
muse-page-why = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "says a member whose harness moved|lost its words after a restart"]
muse-scheduler = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "scheduler::"]
muse-records-play = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "records"]
muse-chief-told = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "a_billing_refusal_that_reaches"]
muse-moved = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "moved_models"]
muse-wake = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "a_task_held_for_no_time"]
muse-live = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::guard"]
muse-claude-launch = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "claude::moves"]
muse-tooling = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "tooling::tests::a_question_for_no_op"]
muse-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "unavailable_accounts"]

# The reader: a turn stopped before a word of it, its message put back in the box.
[[plant]]
name = "muse: a retracted turn is not read as taken back"
meant = "a_turn_stopped_before_a_word_is_settled_and_taken_back_its_message_kept"
runs = ["muse-lib"]

[[plant.edit]]
file = "crates/cf-harness/src/muse/record.rs"
find = '''
                self.runs.entry(run).or_default().retracted = true;
'''
replace = '''
                self.runs.entry(run).or_default();
'''

# The reader: a turn taken back only where it was cancelled, not one that completed.
[[plant]]
name = "muse: a retract after any end takes the turn back"
meant = "a_turn_that_failed_is_settled_and_failed_in_muses_own_words"
runs = ["muse-lib"]

[[plant.edit]]
file = "crates/cf-harness/src/muse/record.rs"
