# Muse Code as a harness, its first phase (3.0.6, T-703; spec items MUS-04, MUS-05, MUS-06): where
# its CLI is (`crates/cf-harness/src/detect.rs`) and which version it is
# (`crates/cf-harness/src/muse/version.rs`, the admin's row in `admin/inspect.rs`); the reader of a
# session's log (`muse/record.rs`, on the logs of real sessions on Muse's fake model,
# `crates/cf-harness/tests/fixtures/muse`, and the schema's shapes, `muse/record/provisional.rs`);
# whether a session can be resumed (`muse/index.rs`); and the launch it refuses (`muse/adapter.rs`).
# The fixtures are made by `cargo xtask scrub-muse-session`, and swept for what is personal
# (`crates/cf-harness/tests/fixtures.rs`). Every name here begins `muse:`, so
# `cargo xtask plants daemon muse` runs them.

[run]
muse-lib = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "muse::"]
muse-detect = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "detect::"]
muse-admin = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "admin::"]
muse-records = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "records::tests"]
muse-env = ["cargo", "test", "--offline", "-p", "cf-base", "--lib", "env::"]
muse-scrub = ["cargo", "test", "--offline", "-p", "xtask", "--lib", "scrub_muse_session::"]

# The reader: a turn stopped before a word of it, its message put back in the box.
[[plant]]
name = "muse: a retracted turn is not read as taken back"
meant = "a_turn_stopped_before_a_word_is_settled_and_taken_back_its_message_kept"
runs = ["muse-lib"]

[[plant.edit]]
file = "crates/cf-harness/src/muse/record.rs"
find = '''
                self.runs.entry(run).or_default().retracted = true;
'''
replace = '''
                self.runs.entry(run).or_default();
'''

