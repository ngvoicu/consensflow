# A worker's turn that ends on a question to the chief is a question, not a result (T-1119, from the
# owner's field report of 2026-11-02). Two workers on another board ended their turns with a question
# in their own words ("Should I continue with the live A/B runs and the packet/socket capture, or stop
# here so you can review the findings first?"; "has the Build Tools 2022 install … finished? … I'm
# waiting for your answer.") and not with `cf ask`. Since 3.0.7-alpha.1 a turn's end is the task's
# result, so the chief was shown results, "Decide with: cf task accept | cf task reopen", which
# `cf answer` cannot reach, and a task that had done none of its work showed done.
#
# The rule (`crates/cf-engine/src/turn_end/asks.rs`), applied in `Dispatcher::collect`
# (`crates/cf-engine/src/turn_end.rs`) where a final answer would be recorded as the result: the last
# paragraph of the worker's own words says it waits for the chief ("waiting for your go", "when you
# reply"; a negation before it takes it back, "nothing is waiting for your answer"), or ends with a
# question mark and asks in the first person what to do ("Should I", "Do you want me to"). The answer
# is then put to the chief as the worker's question, as `cf ask` puts one: the task waits, the window
# stays, and `cf answer` reaches it. A report that ends with an open question about its product, a
# wait for a lock or an agent, and an offer are results. The staff's text says it in one sentence
# (`skill/core/staff.md`). The rule was counted on a copy of a real ledger: 18 of 1,963 results
# of members, none that the chief accepted; 12 ended on a question mark and 11 were accepted.
#
# Each plant takes one rule out again. The names begin with `questions not results`, so
# `cargo xtask plants daemon "questions not results"` runs them.

[run]
qnr-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "questions_not_results::"]
qnr-lib = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "turn_end::asks::"]
qnr-text = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text", "teach_the_"]
qnr-rig = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_workers_question_in_its_last_words"]
qnr-fake = ["cargo", "test", "--offline", "-p", "cf-e2e", "--bin", "fake-agent", "a_line_that_says_words"]

[[plant]]
name = "questions not results: a final answer is never looked at for a question"
meant = "a_turn_that_ends_asking_whether_to_go_on_is_a_question_to_the_chief_and_its_task_waits"
runs = ["qnr-engine"]

[[plant.edit]]
file = "crates/cf-engine/src/turn_end.rs"
find = "        if asks_the_chief(&words_of(&answers.final_run)) {\n"
replace = "        if false && asks_the_chief(&words_of(&answers.final_run)) {\n"

[[plant]]
name = "questions not results: the rig's worker that asks in its last words is given its question as a result"
meant = "a_turn_that_ends_asking_whether_to_go_on_is_a_question_the_chief_answers_and_the_reply_is_the_result"
runs = ["qnr-rig"]
builds = true

