# A macOS privacy dialog drawn in the app's name, which a worker's command waits on, was told to
# nobody (field, 3.0.7-alpha.1, 2026-11-03, T-1194): another user's Mac showed "Allow ConsensFlow to
# access your music, video activity, and media library in Apple Music?" over a Claude Code window.
# On a Mac every window's process has the app as its responsible process, so a folder or a library a
# command touches (`ls ~/Music`, `find ~`, a project on the home folder) is asked in the app's name.
# The pane host reads the system's log of those requests (`crates/cf-panes/src/tcc*`), finds the
# window whose tree holds the process (`process_tree.rs` `holds`, `pty/holding.rs`), and tells the
# daemon (`pane.tcc`); the engine tells whoever gave the window's task and the human once and holds
# the window while the dialog waits (`crates/cf-engine/src/privacy.rs`). Claude's window is denied
# reads of the two libraries (`claude/install.rs` `private_reads`), and the worker roles say to look
# inside the project folder (`skill/core/staff.md`).
#
# The tests are the pane host's own (`tcc/tests.rs` on lines recorded from a real Mac, `tcc/watch/
# tests.rs`, `tcc/real/tests.rs`, `process_tree/holds_tests.rs`, `pty/holding.rs`, `alerts.rs`), the
# engine's `tests/dispatcher/privacy_prompts.rs`, the daemon's `host/tests.rs` and `start/tests/
# restart.rs`, Claude's `tests/launch/claude/private_folders.rs`, and the role-text golden. Every name
# holds `privacy prompts`, so `cargo xtask plants daemon "privacy prompts"` runs them all.

[run]
pv-tcc = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "tcc::"]
pv-holds = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "process_tree::holds_tests"]
pv-holding = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "pty::holding"]
pv-alerts = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "alerts::"]
pv-handler = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "pane_handlers::tests::the_host_says_how_many_alerts"]
pv-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "privacy_prompts::"]
pv-engine-lib = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "privacy::"]
pv-daemon-host = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "host::tests"]
pv-daemon-start = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "start::tests::restart::a_privacy_dialog"]
pv-claude = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "claude::private_folders"]
pv-claude-lib = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::install"]
pv-text = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text", "goldens_roles"]

