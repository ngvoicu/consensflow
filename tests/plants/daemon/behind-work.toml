# A follow-up queued behind a window's own work, and a brief edited before a window has it (T-110,
# 3.0.6; the chief of 2026-10-21, running this project on 3.0.5).
#
# `cf task add --after T-3` was refused while T-3's window was still on T-3. Now the follow-up is
# taken, waits on the board with T-3 among what it needs, and goes into that window once T-3 is
# accepted; two behind one window go in order, a task that fails tells the chief once of what waits
# for it, and a cancel of a task a follow-up waits for is refused (T-74). And `cf task edit T-n`
# replaces the brief of a task no window has (open, blocked, queued or paused, but not yet delivered), keeping
# the old brief in the log; a task a window has is refused and told what to do instead. One plant
# takes one fix out, and a test of it fails. The rig's cases build the native `cf` and the daemon
# from the sources as planted, so their plants say `builds`.
#
# Every name holds `behind work` or `brief edit`, so `npm run plants:daemon -- "behind work"` runs
# the first and `-- "brief edit"` the second.

[run]
ledger-behind-work = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "behind_work"]
ledger-edited-brief = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "edited_brief"]
rig-regression-behind-work = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_follow_up_could_not_be_queued_behind_its_windows_own_work"]
rig-regression-brief-edit = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_brief_could_not_be_edited_once_added"]
daemon-lib-routes-tasks = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "routes::tasks"]
daemon-lib-routes-table = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "routes::tests::"]
cf-help = ["cargo", "test", "--offline", "-p", "cf", "--test", "help"]
engine-text-roles = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text", "roles"]

