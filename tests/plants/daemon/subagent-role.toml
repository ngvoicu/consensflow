# A member's sub-agents acted as the member (T-766, 2026-10-26; fixed by T-1053). A sub-agent a
# window starts has the window's board token in its shell on every harness, and `cf` runs as the
# window. A Codex sub-agent began with the window's role on every route, and four of four that could
# not answer something asked the board as the member; a Claude Code `general-purpose` sub-agent listed
# the role's skill and, asked to, loaded it. The fix, harness by harness: Codex's app-server is told,
# for each of Codex's own agent types, a configuration of the launch's own that its sub-agents start
# from in place of the role (Codex's instructions, then that the child is not the window's agent); a
# Claude Code role file's front matter says no model may load it as a skill; the role texts say what a
# sub-agent that still has the role is (a forked one, or one of an agent type the owner defined); and
# Devin's and Muse's SessionStart hooks give a child's session nothing (the hooks were so already; no
# plant held Devin's, nor Muse's `parent_session_id`). One plant takes one rule out; a test of it
# fails. Every name holds `subagent role`.

[run]
# The supervisor's and the arguments' own tests.
codex-session = ["cargo", "test", "--offline", "-p", "cf-codex-session", "--lib"]
# The harness's tests of a Codex window's role, its sub-agents' text and their file.
harness-codex-role = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "codex::role"]
# The launch suite's Codex cases, the rule over both platforms' recordings among them.
harness-launch-codex = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "codex::"]
# Every adapter's scenarios as recorded, which hold both files.
harness-scenarios = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "scenarios::"]
# cf-proto's table of Codex's own agent types, held to what Codex 0.166.0 says.
proto-codex = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "codex::agent_types"]
# The harness's tests of how Claude Code loads a role.
harness-claude-install = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::install"]
# The launch suite's Claude cases.
harness-launch-claude = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "claude::"]
# The SessionStart hooks of Devin and Muse.
devin-session-hook = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "devin::session_hook"]
muse-session-hook = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "muse::session_hook"]
# Every role's text, as recorded.
engine-role-texts = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text", "goldens_roles"]

# --- Codex ---

[[plant]]
name = "subagent role: Codex's server is told nothing of what its sub-agents start with"
meant = "a_windows_sub_agents_start_from_the_file_its_launch_names_which_the_server_alone_is_told_of"
runs = ["codex-session"]

[[plant.edit]]
file = "crates/cf-codex-session/src/supervisor.rs"
find = '''        if let Some(children) = &plan.children {
            args.extend(arguments::children(&children.file, &children.kinds));
        }'''
replace = '''        if let Some(children) = plan.children.as_ref().filter(|_| false) {
            args.extend(arguments::children(&children.file, &children.kinds));
        }'''

[[plant]]
name = "subagent role: a worker sub-agent of Codex still starts with the role"
meant = "an_agent_type_the_owner_defines_stays_the_owners_and_one_they_do_not_is_ours"
runs = ["harness-codex-role", "harness-launch-codex"]

[[plant.edit]]
file = "crates/cf-harness/src/codex/role.rs"
find = '''            .filter(|name| !owned.contains(name))'''
replace = '''            .filter(|name| !owned.contains(name) && *name != "worker")'''

[[plant]]
name = "subagent role: an agent type the owner defines is taken over"
meant = "an_agent_type_the_owner_defines_stays_the_owners_and_one_they_do_not_is_ours"
runs = ["harness-codex-role"]

[[plant.edit]]
file = "crates/cf-harness/src/codex/role.rs"
find = '''        .filter(|name| agents.get(name).is_some_and(Value::is_object))'''
replace = '''        .filter(|name| agents.get(name).is_some_and(|_| false))'''

[[plant]]
name = "subagent role: a Codex agent type is defined again without Codex's own words"
meant = "a_sub_agent_of_each_type_named_starts_from_the_file_named_with_codexs_own_words"
runs = ["codex-session"]

[[plant.edit]]
file = "crates/cf-codex-session/src/arguments.rs"
find = '''                    json_string(kind.description)
                ),
            ]
        })'''
replace = '''                    json_string(kind.description.lines().next().unwrap_or_default())
                ),
            ]
        })'''

[[plant]]
name = "subagent role: the table of Codex's agent types is not what Codex 0.166.0 says"
meant = "the_types_are_codex_0_166_0_s_own_word_for_word_and_set_nothing_else"
runs = ["proto-codex"]

[[plant.edit]]
file = "crates/cf-proto/src/codex/agent_types.rs"
find = '''        description: r#"Default agent."#,'''
replace = '''        description: r#"Default agent"#,'''

[[plant]]
name = "subagent role: a window opens though its sub-agents' file cannot be read"
meant = "a_sub_agents_file_that_is_named_and_cannot_be_read_or_holds_nothing_is_refused_before_anything_starts"
runs = ["codex-session"]

[[plant.edit]]
file = "crates/cf-codex-session/src/supervisor.rs"
find = '''        Err(cause) => Err(SessionError::Children { path, cause }),'''
replace = '''        Err(_) => Ok(path),'''

[[plant]]
name = "subagent role: a Codex sub-agent is given the role in place of the sentence"
meant = "a_sub_agent_starts_from_what_codex_has_of_its_own_and_that_it_is_not_the_windows_agent_never_the_role"
runs = ["harness-codex-role", "harness-launch-codex", "harness-scenarios"]

[[plant.edit]]
file = "crates/cf-harness/src/codex/role.rs"
find = '''        children: format!("{existing}\n\n{}", children(role)),'''
replace = '''        children: format!("{existing}\n\n{content}"),'''

[[plant]]
name = "subagent role: a Codex launch names no file for its sub-agents"
meant = "runs_codex_under_its_supervisor_in_full_permission_mode_its_task_on_no_command_line"
runs = ["harness-launch-codex", "harness-scenarios"]

[[plant.edit]]
file = "crates/cf-harness/src/codex/adapter.rs"
find = '''                    .chain(children)
                    .collect(),'''
replace = '''                    .chain(children.into_iter().filter(|_| false))
                    .collect(),'''

