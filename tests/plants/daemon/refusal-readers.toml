# R1 of the refusal contract (T-1910, D3; round 2 after review T-1932): a refusal in view is the record's last turn's. A genuine
# user turn (Claude's and Pi's user prompt, Codex's task_started) takes an earlier refusal out of
# view; a tool result and a message not yet taken do not; Codex keeps its count privately for the
# reset a failed end names; Pi's JSON null time is no time. In doubt the refusal is kept: only a
# prompt of the person's on the same branch, after the refusal, clears it.
#
# Every name holds `refusal readers`, so `cargo xtask plants daemon "refusal readers"` runs them all.

[run]
refusal-readers-claude = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record::tests::refusals"]
refusal-readers-pi = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "pi::record::tests::steps"]
refusal-readers-codex = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "codex::record::tests::refusals"]
refusal-readers-held = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "refusal_readers"]

[[plant]]
name = "refusal readers: Claude keeps the refusal at a genuine prompt"
meant = "a_refusal_stays_in_view_past_what_opens_no_turn_and_goes_at_a_genuine_prompt"
runs = ["refusal-readers-claude", "refusal-readers-held"]

[[plant.edit]]
file = "crates/cf-harness/src/claude/record/replay.rs"
find = "            self.quota = None;\n            self.refused_uuid = None;"
replace = "            self.refused_uuid = None;"

[[plant]]
name = "refusal readers: Claude clears the refusal at a tool result with words beside it"
meant = "a_refusal_is_taken_out_of_view_only_by_a_prompt_written_after_it_on_its_branch"
runs = ["refusal-readers-claude", "refusal-readers-held"]

[[plant.edit]]
file = "crates/cf-harness/src/claude/record/replay.rs"
find = "            && record.results.is_empty()\n"
replace = ""

[[plant]]
name = "refusal readers: Claude clears the refusal at a prompt written late"
meant = "a_refusal_is_taken_out_of_view_only_by_a_prompt_written_after_it_on_its_branch"
runs = ["refusal-readers-claude", "refusal-readers-held"]

[[plant.edit]]
file = "crates/cf-harness/src/claude/record/replay.rs"
find = "            && descends\n"
replace = ""

[[plant]]
name = "refusal readers: Claude clears the refusal at a command's words"
meant = "a_refusal_is_taken_out_of_view_only_by_a_prompt_written_after_it_on_its_branch"
runs = ["refusal-readers-claude", "refusal-readers-held"]

[[plant.edit]]
file = "crates/cf-harness/src/claude/record/replay.rs"
find = "            && !record.local\n"
replace = ""

[[plant]]
name = "refusal readers: Claude clears the refusal at a sidechain's or another session's prompt"
meant = "a_refusal_is_taken_out_of_view_only_by_a_prompt_written_after_it_on_its_branch"
runs = ["refusal-readers-claude", "refusal-readers-held"]

[[plant.edit]]
file = "crates/cf-harness/src/claude/record/replay.rs"
find = "        if record.main\n"
replace = "        if true\n"

[[plant]]
name = "refusal readers: Pi keeps the refusal at a genuine prompt"
meant = "a_second_distinct_refusal_after_a_retry_is_in_view_and_the_first_is_not"
runs = ["refusal-readers-pi", "refusal-readers-held"]

[[plant.edit]]
file = "crates/cf-harness/src/pi/record.rs"
find = "                        quota: self.quota.take(),"
replace = "                        quota: self.quota.clone(),"

[[plant]]
name = "refusal readers: Pi clears the refusal at a tool result"
meant = "a_refusal_names_its_quota_and_a_genuine_user_turn_or_the_next_step_clears_it"
runs = ["refusal-readers-pi", "refusal-readers-held"]

[[plant.edit]]
file = "crates/cf-harness/src/pi/record.rs"
find = "                let detail = self.result_detail(&call, &field, &at);\n"
replace = "                let detail = self.result_detail(&call, &field, &at);\n                self.quota = None;\n"

[[plant]]
name = "refusal readers: Pi clears the refusal at a retry on another branch"
meant = "a_retry_on_another_branch_than_the_one_pi_is_on_takes_no_refusal_out_of_view"
runs = ["refusal-readers-pi", "refusal-readers-held"]

[[plant.edit]]
file = "crates/cf-harness/src/pi/record.rs"
find = "        if self.linear || self.on_path(user) {"
replace = "        if true {"

[[plant]]
name = "refusal readers: Pi reads a null time as zero"
meant = "the_time_of_a_refusal_is_what_number_makes_of_the_message_time"
runs = ["refusal-readers-pi", "refusal-readers-held"]

[[plant.edit]]
file = "crates/cf-harness/src/pi/record.rs"
find = "js::to_number(field(\"timestamp\").filter(|at| !at.is_null()))"
replace = "js::to_number(field(\"timestamp\"))"

[[plant]]
name = "refusal readers: Codex clears a reached count at a turn's start"
meant = "a_count_that_says_the_limit_was_reached_leaves_view_only_at_the_persons_words_in_a_new_turn"
runs = ["refusal-readers-codex", "refusal-readers-held"]

[[plant.edit]]
file = "crates/cf-harness/src/codex/record.rs"
find = "Some(Level::Exhausted) => self.awaiting_words = Some(named.clone()),"
replace = "Some(Level::Exhausted) => self.quota = None,"

[[plant]]
name = "refusal readers: Codex counts a repeated start as a new turn"
meant = "a_count_that_says_the_limit_was_reached_leaves_view_only_at_the_persons_words_in_a_new_turn"
runs = ["refusal-readers-codex", "refusal-readers-held"]

[[plant.edit]]
file = "crates/cf-harness/src/codex/record.rs"
find = "let new_turn = named != self.latest_turn;"
replace = "let new_turn = true;"

[[plant]]
name = "refusal readers: Codex takes a shell command's record for the person's words"
meant = "a_count_that_says_the_limit_was_reached_leaves_view_only_at_the_persons_words_in_a_new_turn"
runs = ["refusal-readers-codex", "refusal-readers-held"]

[[plant.edit]]
file = "crates/cf-harness/src/codex/record/inputs.rs"
find = "if self.awaiting_words.as_ref() == Some(turn) && is_a_prompt(&text) {"
replace = "if self.awaiting_words.as_ref() == Some(turn) {"

[[plant]]
name = "refusal readers: Codex keeps a count short of the limit at the next turn's start"
meant = "a_count_at_its_limit_leaves_view_at_the_next_turns_start_and_a_failed_end_still_names_its_reset"
runs = ["refusal-readers-codex", "refusal-readers-held"]

[[plant.edit]]
file = "crates/cf-harness/src/codex/record.rs"
find = "Some(Level::Low) => self.quota = None,"
replace = "Some(Level::Low) => {}"

[[plant]]
name = "refusal readers: Codex loses the hidden count for the reset"
meant = "a_count_at_its_limit_leaves_view_at_the_next_turns_start_and_a_failed_end_still_names_its_reset"
runs = ["refusal-readers-codex", "refusal-readers-held"]

[[plant.edit]]
file = "crates/cf-harness/src/codex/record.rs"
find = "self.count = Some(count);"
replace = "self.count = None;"

