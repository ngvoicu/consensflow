# A setting that changes the chief's role while its window is open is told to the window at its
# next rest (T-1182; `crates/cf-engine/src/role_news.rs`, the wording in `roles/news.rs`): the
# project's specs (on, off, the folder, the variant, and what the app says for a project that
# follows it) and the project's rules for its staff. A launch gives the role as it is; the note
# gives a window that is open the section that changed, once, at its rest, on every harness, and
# a Codex conversation is recorded as told it, so its resume says nothing of it again. Each plant
# breaks one rule and the test written for it fails: the dispatcher's tests (`tests/dispatcher/
# role_news.rs` and `specs.rs`), the wording's (`roles::news`), each adapter's (the skill put in
# place for a window that is open) and the page's (the dialog says whether the chief is told now).
# The end to end cases are the rig's (`specs::a_chief_whose_window_is_open_is_told...`,
# `specs_codex`).
#
# Every name holds `role news`, so `npm run plants:daemon -- "role news"` runs them all.

[run]
rn-dispatcher = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "role_news::"]
rn-news-lib = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "roles::news"]
rn-harness-launch = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "--", "a_chief_whose_window_is_open"]
rn-harness-muse = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "muse::adapter::tests::a_chief_whose_window_is_open"]
rn-harness-lib = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::specmint::"]
rn-page = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "a project whose chief has no window open|Project settings: a save answered after the dialog was left|saves the rules for the staff as written"]

