# The CI flakes of alpha.4's A4-16, part 1 (T-1318), each held by the test written for its cause:
#
# - live finish's detach cases: the host looks once a second and a detached job's shell lingers a
#   third of one, so a look may fall on the shell before the job it starts, or on the shell and
#   the job, or after: the verdict says an escape in each shape, and the Mac's limit passes in
#   each (`crates/cf-e2e/tests/live_finish/leaving.rs`, CI run 42425306008). The stand-in's shell
#   waits before it starts the job where `CF_TEST_DETACH_DELAY_MS` says, so that a case makes the
#   look fall on the shell alone (`fake_agent/background.rs`);
# - the stand-in Claude's status line runs a `git` of its own, not the machine's, which on GitHub's
#   macOS runner is Xcode's shim and takes seconds on a cold cache, longer than the host waits
#   before it looks again (`fake_agent/status_line.rs`, CI run 39136355690);
# - an idle daemon's stop is counted in the clock of the timers it waits on, not the machine's
#   (`crates/cf-daemon/src/stop/tests.rs`, CI runs 40958716065 and 42365070150);
# - the same count for the daemon's other bounds of a close that waits for nothing: the API's close of
#   a door and of an idle connection (`api/server/tests.rs`) and the daemon's stop from its input's
#   end, inside the app's two seconds (`start/tests.rs`);
# - a rig's close that times out says which of the daemon and the pane host had not left
#   (`crates/cf-e2e/src/rig/mod.rs`, a resumed Devin case on CI's Windows, run 42419505988).
#
# Every name holds `ci flakes a4`, so `cargo xtask plants daemon "ci flakes a4"` runs them all.

[run]
a4-leaving = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_finish", "leaving::tests::"]
a4-detach-delayed = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_finish", "stand_in::a_stand_in_that_detaches_its_job_after"]
a4-pi-delayed = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_finish", "stand_in::a_stand_in_that_plays_pi_on_a_mac_and_detaches_its_job_after"]
a4-background = ["cargo", "test", "--offline", "-p", "cf-e2e", "--bin", "fake-agent", "background::"]
a4-status-line = ["cargo", "test", "--offline", "-p", "cf-e2e", "--bin", "fake-agent", "status_line::"]
a4-stop = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "stop::tests::"]
a4-api-close = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "api::server::tests::closing_"]
a4-start = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "start::tests::its_input_ending_stops"]
a4-rig-close = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "--", "the_failure_of_a_close_that_timed_out"]

