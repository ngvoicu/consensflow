# Who says that a Pi window is at work (the brain's `architecture/pi-turn-state.md`, 2026-11-27,
# T-2377): Pi's own run state, which ConsensFlow's extension writes as one word (`working`, `busy`,
# `rest`) with the runs begun and ended and the last eight ends; the session file says how a run
# ended, never whether one runs; with no word, the file decides by its entries' own times. It
# answers two field pauses of 2026-11-26: a Pi window stopped at its empty prompt read "working",
# was pressed three times, and its chief was told it "may be hung".
#
# Each plant puts back one guard the page's §8 names, and its case fails: the extension's
# (`tests/pi-extension.test.mjs`), the reader's (`crates/cf-harness/src/pi/record/tests/`,
# `turn_state` over what Pi 1.6.0's and 1.6.1's own loops wrote, `evidence_files`, `looks`), and
# the dispatcher's (`crates/cf-engine/tests/dispatcher/pi_turn_state.rs`). The extension's cases
# against each published Pi's loop (`tests/pi-loop/drive.mjs`) need Pi installed and run apart.
#
# Every name holds `pi turn state`, so `cargo xtask plants daemon "pi turn state"` runs them all.

[run]
pts-extension = ["node", "--test", "--test-reporter=tap", "--test-force-exit", "tests/pi-extension.test.mjs"]
pts-reader = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "pi::record::tests::"]
pts-window = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "pi_turn_state"]

# --- the extension ---

[[plant]]
name = "pi turn state: rest is written inside a handler"
meant = "writes a run's end at agent_settled with its leaf and Pi's flag, and rest only at the next pass"
runs = ["pts-extension"]

[[plant.edit]]
file = "hosts/pi-extension/consensflow-delivery.mjs"
find = "    if (next === 'rest' && !inPoll) next = state ?? 'busy'\n"
replace = "    // rest from a handler too\n"

[[plant]]
name = "pi turn state: no begin at before_agent_start"
meant = "says working first thing at before_agent_start, before a later extension's handler"
runs = ["pts-extension"]

[[plant.edit]]
file = "hosts/pi-extension/consensflow-delivery.mjs"
find = "    return begin(event, ctx).then(() => undefined)\n"
replace = "    return undefined\n"

[[plant]]
name = "pi turn state: ended is not written at agent_settled"
meant = "writes a run's end at agent_settled with its leaf and Pi's flag, and rest only at the next pass"
runs = ["pts-extension"]

[[plant.edit]]
file = "hosts/pi-extension/consensflow-delivery.mjs"
find = "    end(typeof event?.aborted === 'boolean' ? event.aborted : null)\n"
replace = "    // no end\n"

[[plant]]
name = "pi turn state: a poll starts a run"
meant = "says busy at the session's start for a Pi not idle"
runs = ["pts-extension"]

[[plant.edit]]
file = "hosts/pi-extension/consensflow-delivery.mjs"
find = "    if (runOn()) return 'working'\n"
replace = "    if (runOn() || !idle()) return 'working'\n"

[[plant]]
name = "pi turn state: no prompt in hand at input"
meant = "holds a submitted prompt in hand from its input hook: busy, and no message goes in ahead of it"
runs = ["pts-extension"]

[[plant.edit]]
file = "hosts/pi-extension/consensflow-delivery.mjs"
find = "    inHand = now()\n    return say(false).then(() => undefined)\n"
replace = "    return undefined\n"

[[plant]]
name = "pi turn state: the consumer sends on isIdle() alone"
meant = "holds a submitted prompt in hand from its input hook: busy, and no message goes in ahead of it"
runs = ["pts-extension"]

[[plant.edit]]
file = "hosts/pi-extension/consensflow-delivery.mjs"
find = "        if (now_ === 'busy') {\n"
replace = "        if (false) {\n"

[[plant.edit]]
file = "hosts/pi-extension/consensflow-delivery.mjs"
find = "        if (now_ !== 'rest' || state !== 'rest') break\n"
replace = "        if (context?.isIdle?.() !== true) break\n"

[[plant]]
name = "pi turn state: the word at session_start only for a stop leaf"
meant = "says rest at the session's start for an idle Pi on a user message"
runs = ["pts-extension"]

[[plant.edit]]
file = "hosts/pi-extension/consensflow-delivery.mjs"
find = "    restAfter = ended\n    await say(true)\n"
replace = "    restAfter = ended\n    if (ctx.sessionManager?.getLeafEntry?.()?.message?.stopReason === 'stop') await say(true)\n"

