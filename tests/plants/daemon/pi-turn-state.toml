# Who says that a Pi window is at work (the brain's `architecture/pi-turn-state.md`): Pi's own run
# state, which ConsensFlow's extension writes as one word (`working`, `busy`, `rest`) with the runs
# begun and ended, the last end in the session (its leaf and Pi's flag), the prompt in hand and its
# process's number; the session file says how a run ended, never whether one runs; with no word
# (a window opened before this extension, a Pi that sets its run flag late), the file decides by
# its entries' own times. It answers two field pauses of 2026-11-26: a Pi window stopped at its
# empty prompt read "working", was pressed three times, and its chief was told it "may be hung".
#
# Each plant puts back one guard the page names, and its case fails: the extension's
# (`tests/pi-extension.test.mjs`), the reader's (`crates/cf-harness/src/pi/record/tests/`,
# `turn_state` over what Pi 0.87.0's, 1.1.0's, 1.6.0's and 1.6.1's own loops wrote,
# `evidence_files`, `looks`), and the dispatcher's (`crates/cf-engine/tests/dispatcher/
# pi_turn_state.rs`). The extension's cases against each published Pi's loop
# (`tests/pi-loop/drive.mjs`) need Pi installed and run apart.
#
# Every name holds `pi turn state`, so `cargo xtask plants daemon "pi turn state"` runs them all.

[run]
pts-extension = ["node", "--test", "--test-reporter=tap", "--test-force-exit", "tests/pi-extension.test.mjs"]
pts-reader = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "pi::record::tests::"]
pts-window = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "pi_turn_state"]

