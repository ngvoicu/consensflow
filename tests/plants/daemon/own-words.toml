# An answer in the human's own words ("Something else") to a question with options is an answer
# like any other, up to the body limit, and one past it says `pick too long` (issue
# `long-own-words-answer-refused`, `911656f`): a 6,000-character one was refused as `answer: empty
# pick` when a pick was capped at `MAX_TITLE * 10`. `crates/cf-ledger/src/questions.rs` holds the
# picks' rule (its unit tests), and `crates/cf-ledger/tests/receipt/own_words.rs` takes one through
# `answer`. The picks' limit is the answer's: the answer prints each pick under its question's
# header, all of it is the body, and a pick that does not fit is always refused as a pick too long
# (a pick of the limit's own length was taken and then refused by the body's check under another
# name: T-969, 2026-10-29).
# Every name begins `own words:`, so `npm run plants:daemon -- "own words"` runs them.

[run]
ledger-questions = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "questions::"]
ledger-own-words = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "own_words::"]

[[plant]]
name = "own words: a pick is capped at 1,200 characters again"
meant = "a_pick_in_the_humans_own_words_is_taken_up_to_the_body_limit_less_its_header"
runs = ["ledger-questions"]

[[plant.edit]]
file = "crates/cf-ledger/src/questions.rs"
find = "    if printed > MAX_BODY {"
replace = "    if printed > MAX_TITLE * 10 {"

[[plant]]
name = "own words: an answer of 6,000 characters is refused by the picks' cap"
meant = "a_6000_character_answer_in_the_humans_own_words_is_an_answer_like_any_other"
runs = ["ledger-own-words"]

[[plant.edit]]
file = "crates/cf-ledger/src/questions.rs"
find = "    if printed > MAX_BODY {"
replace = "    if printed > MAX_TITLE * 10 {"

[[plant]]
name = "own words: a pick is as long as its bytes, not its characters"
meant = "a_pick_in_the_humans_own_words_is_taken_up_to_the_body_limit_less_its_header"
runs = ["ledger-questions"]

[[plant.edit]]
file = "crates/cf-ledger/src/questions.rs"
find = "    let printed = utf16_len(&render_choices(questions, &taken));"
replace = "    let printed = render_choices(questions, &taken).len();"

[[plant]]
name = "own words: a pick of any length is taken"
meant = "a_pick_that_does_not_fit_the_answer_is_too_long_and_not_empty_or_a_body"
runs = ["ledger-questions"]

[[plant.edit]]
file = "crates/cf-ledger/src/questions.rs"
find = "    if printed > MAX_BODY {"
replace = "    if false && printed > MAX_BODY {"

[[plant]]
name = "own words: a pick too long is refused as an empty one"
meant = "a_pick_that_does_not_fit_the_answer_is_too_long_and_not_empty_or_a_body"
runs = ["ledger-questions"]

[[plant.edit]]
file = "crates/cf-ledger/src/questions.rs"
find = '"pick too long (at most {room} characters here; the headers of the questions and the other picks count too)"'
replace = '"empty pick"'

[[plant]]
name = "own words: the room a pick has is said as the body limit"
meant = "a_pick_that_does_not_fit_the_answer_is_too_long_and_not_empty_or_a_body"
runs = ["ledger-questions"]

[[plant.edit]]
file = "crates/cf-ledger/src/questions.rs"
find = "    let room = longest.unwrap_or(0).saturating_sub(printed - MAX_BODY);"
replace = "    let room = longest.map_or(MAX_BODY, |_| MAX_BODY);"

[[plant]]
name = "own words: only the picks count against the body limit, not the headers"
meant = "the_other_picks_and_headers_of_the_answer_count_against_a_pick_too"
runs = ["ledger-questions"]

[[plant.edit]]
file = "crates/cf-ledger/src/questions.rs"
find = "    let printed = utf16_len(&render_choices(questions, &taken));"
replace = "    let printed = taken.iter().flatten().map(|pick| utf16_len(pick)).sum::<usize>();"

[[plant]]
name = "own words: a pick of the body limit is refused by the body, not as a pick too long"
meant = "a_pick_of_the_body_limit_is_refused_as_a_pick_too_long_and_not_as_a_body"
runs = ["ledger-own-words"]

[[plant.edit]]
file = "crates/cf-ledger/src/questions.rs"
find = "    let printed = utf16_len(&render_choices(questions, &taken));"
replace = "    let printed = taken.iter().flatten().map(|pick| utf16_len(pick)).sum::<usize>();"
