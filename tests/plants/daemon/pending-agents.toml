# The background agents and workflows a turn left running (the report of
# 2026-10-11: a chief with four research agents kept a result waiting twelve
# minutes, because Claude Code's own status says `busy` for as long as an agent
# runs, though its prompt takes input). The reader says a turn that ended with
# some pending is settled and how many (`pending` of the reading, from the counts of
# the `turn_duration` that ends it, beside the jobs the reader counts itself:
# `turn-end.toml`); the Claude adapter reads a window at rest by it, though its status
# is busy; no delivery looks at them (a chief's, a worker's); a worker's turn that ends
# with some is no task's result, which the owner decided on 2026-10-15 (after T-14; it
# was its result at once from 2026-10-13, and held the task before): the task stays
# working, the requester is told the worker goes on in the background, and the turn the
# last agent's end wakes is the result (`turn_end`); and a switch of the chief after its
# turn, which closes the window and ends the agents with it, waits for a turn that
# leaves none (`chief_switch`).
# One plant takes one rule out; a test of it fails. The first
# plants run the tests of the crates, which hold each rule apart; the `pending
# agents rig:` plants after them hold that the rule reaches the board through the
# real daemon and pane host, and run only the case of the rig
# (`crates/cf-e2e/tests/rig/pending_agents.rs`) that holds it. The rig's cases
# build the `cf` and the pane host they run from the sources as planted, in
# release, which makes these the slowest plants, and they say `builds`: the
# family builds the native `cf` again once each is put back. Every name holds
# `pending agents`, so `npm run plants:daemon -- pending` runs them all (a word
# selects the plants whose name holds it, any of the words given), and
# `npm run plants:daemon -- "pending agents rig"` the end to end ones.

[run]
# The Claude reader's own tests: what each record says of a turn and its agents.
claude-reader-agents = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record"]
# The reading, as it is written.
harness-lib-reading = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::record::reading"]
# Node's recordings of the readers, held through the switch: four of them were moved for
# this reader (`crates/cf-harness/tests/goldens/README.md` says which).
harness-records = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "records"]
# A Claude window on the records and the status files of a turn that left agents running.
harness-launch-claude-agents = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "claude::agents"]
# The engine's tests of the result and the note, on the fake windows: what the agents leave and what they do not.
engine-dispatcher-pending-agents = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "pending_agents"]
# The engine's tests of the switch after the chief's turn, on the fake windows.
engine-dispatcher-switching-agents = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "switching_agents"]
# The cases of the rig (`pending_agents` of crates/cf-e2e): the daemon and the pane
# host in real terminals, a case for each rule, found by the start of its name.
rig-pending-chief = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "pending_agents::a_result_for_a_chief"]
rig-pending-worker = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "pending_agents::a_workers_turn"]
rig-pending-switch = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "pending_agents::a_switch_after"]

