# The role texts of spec `smaller-contexts` (T-1009, 2026-10-31): reviews that end, fresh windows,
# targeted checks, briefs that say how a fact is known, and results that begin with the outcome
# (`skill/core/chief.md`, `skill/core/staff.md`; SCX-06 to SCX-10). Each plant takes one sentence out
# of a text, or puts one wrong, and a rule of `crates/cf-engine/tests/text/roles.rs` fails. A sentence
# is dropped with the space or line break that follows it, so the rest still reads; the engine's
# golden of the texts (`goldens_roles`) holds them word for word and is left out of the runs here.
#
# Every name holds `smaller contexts`, so `npm run plants:daemon -- "smaller contexts"` runs them all.

[run]
engine-text-roles = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text", "roles::", "--", "--skip", "goldens_roles"]

[[plant]]
