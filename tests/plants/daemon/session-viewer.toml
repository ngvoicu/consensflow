# The history viewer (the owner's ask of 2026-10-16, ConsensFlow 3.0.6: "near the Switch chief we
# can have a button where we can see the transcript of the whole session we store? like even if we
# change chiefs or they are compacted"): the History button on every window's head, the page's
# `history.get` that reads a participant's every conversation a page at a time from a place that
# does not move, `history.part` that reads a long item a part at a time, and the summary a
# compaction writes in the user's place marked as one, so that `cf history`, the wake-up's check of
# what was typed and the handoff's last words leave it out. The rig's case in the owner's shape is
# `crates/cf-e2e/tests/regressions/whole_history_across_a_compaction_and_a_switch.rs`.
#
# The second round (the reviews of 9943518f) answers four findings, each with plants that put its
# bug back: a delivery's line read out of another participant's message; a long item cut out of
# reach; pages that repeat or skip items as the history moves; and a read that goes through the
# whole history for a page.
#
# Its rig plant builds the native `cf` from the sources as they are planted, so it says `builds`.
# Every name begins `session viewer`, so `npm run plants:daemon -- "session viewer"` runs them all.

[run]
viewer-ledger-history = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "whole_history"]
viewer-ledger-wake-ups = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "wake_ups", "moved::"]
viewer-ledger-held-apart = ["cargo", "test", "--offline", "-p", "cf-ledger", "--features", "test-support", "--lib", "testing::compaction"]
viewer-engine-text = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text"]
viewer-engine-copy = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "transcripts::"]
viewer-harness-claude = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record::tests::compaction"]
viewer-daemon-page = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::history"]
viewer-proto-page = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "page::"]
viewer-rig = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "whole_history_across_a_compaction_and_a_switch::"]
# The viewer in the browser Playwright keeps, by its parts.
viewer-ui-button = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/history-viewer.spec.mjs", "-g", "the History button"]
viewer-ui-headings = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/history-viewer.spec.mjs", "-g", "heads each conversation"]
viewer-ui-labels = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/history-viewer.spec.mjs", "-g", "shows every text as text"]
viewer-ui-delivery = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/history-viewer.spec.mjs", "-g", "folds a delivery"]
viewer-ui-paging = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/history-viewer.spec.mjs", "-g", "goes older from the oldest item shown"]
viewer-ui-find = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/history-viewer.spec.mjs", "-g", "finds words in any case"]
viewer-ui-tools = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/history-viewer.spec.mjs", "-g", "on the switch"]
viewer-ui-long = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/history-viewer.spec.mjs", "-g", "shows a long item by a part"]
viewer-ui-theme = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/history-viewer.spec.mjs", "-g", "app's theme"]
viewer-ui-drawer = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "names a compaction's summary in what a window wrote"]

