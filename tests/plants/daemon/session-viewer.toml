meant = "names a compaction's summary in what a window wrote as one, never as what was sent to it"
runs = ["viewer-ui-drawer"]

[[plant.edit]]
file = "app/ui/core/board.js"
find = "          `${itemLabel(item)}${item.complete ? '' : ' · still writing'}`,"
replace = "          `${item.role === 'user' ? 'Sent to the window' : itemLabel(item)}${item.complete ? '' : ' · still writing'}`,"

[[plant]]
name = "session viewer: a delivery is shown whole, not folded to its line"
meant = "folds a delivery to its line, under what the human typed with it, and opens it on a click or a key"
runs = ["viewer-ui-delivery"]

[[plant.edit]]
file = "app/ui/core/history-viewer.js"
find = "  if (!item.delivery) {"
replace = "  if (!item.delivery || true) {"

[[plant]]
name = "session viewer: the search is not sent with the read"
meant = "finds words in any case, says when nothing holds them, and where a search stopped short"
runs = ["viewer-ui-find"]

[[plant.edit]]
file = "app/ui/core/history-viewer.js"
find = "    if (find) asked.find = find"
replace = ""

[[plant]]
name = "session viewer: Show tool output asks for no tools' outputs"
meant = "shows the tools' outputs on the switch"
runs = ["viewer-ui-tools"]

[[plant.edit]]
file = "app/ui/core/history-viewer.js"
find = "      tools: this.#tools.checked,"
replace = "      tools: false,"

[[plant]]
name = "session viewer: a conversation's heading does not say a Switch chief ended it, nor to what"
meant = "heads each conversation with its harness and agent, from when until when, and what ended it"
runs = ["viewer-ui-headings"]

[[plant.edit]]
file = "app/ui/core/history-viewer.js"
find = "    return `ended by Switch chief, to ${to}`"
replace = "    return 'ended'"

[[plant]]
name = "session viewer: the viewer does not say what is not stored"
meant = "heads each conversation with its harness and agent, from when until when, and what ended it"
runs = ["viewer-ui-headings"]

[[plant.edit]]
file = "app/ui/index.html"
find = '''<p class="history-hint">Not stored: tool calls and thinking.</p>'''
replace = '''<p class="history-hint"></p>'''

[[plant]]
name = "session viewer: the viewer's page is drawn in a colour of its own, not the theme's"
meant = "says the daemon's refusal in its words, and draws in the app's theme"
runs = ["viewer-ui-theme"]

[[plant.edit]]
file = "app/ui/page.css"
find = "align-content: start; gap: 22px; background: var(--deep); }"
replace = "align-content: start; gap: 22px; background: #0c2026; }"
