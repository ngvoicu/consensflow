# A chief's results held for almost two hours as "you have typed in this window and not
# sent it", when nobody had typed (T-839, issues/results-held-for-words-nobody-typed.md in
# consensflow-sme). The pane host counts the human's keys for what they leave unsent, and a
# string the terminal reports in (OSC, DCS, APC, PM, SOS, to its BEL or ST) is no key; a
# delivery held for the human's unsent words is asked about again at every look, and a
# message held at the head of its window's queue for ten minutes, whatever held it (one
# clock a message, joined to chief-meeting's gate, T-883), is told to the human once, in
# the words of what holds it, with what the window's box shows masked and cut short where
# that is words typed and not sent, and to the requester of its task. One plant takes one rule out; a
# test of it fails. The `rig:` plant holds the count end to end through the real daemon
# and pane host (`crates/cf-e2e/tests/regressions/results_held_for_words_nobody_typed.rs`)
# and says `builds`. Every name holds `held-typed`, so `npm run plants:daemon --
# held-typed` runs them all.

[run]
held-typed-arbiter = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "arbiter::tests::what_the_terminal_reports_types_nothing"]
held-typed-arbiter-keys = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "arbiter::tests::a_terminals_report_moves_neither"]
held-typed-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "unsent::"]
held-typed-readers = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "input_box"]
held-typed-rig = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "results_held_for_words_nobody_typed::"]
# The masked trace of the human's input (T-883): the pane host's ring and its snapshot, the
# trace's reader and line, the engine's holds, and the two adapters that read the pane.
held-typed-ring = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "arbiter::tests::a_pane_keeps_the_humans_last_writes_as_age_length_and_kinds_and_no_byte_of_them"]
held-typed-snapshot = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "pane_handlers::tests::a_snapshot_says_the_humans_last_writes_by_age_length_and_kinds"]
held-typed-proto = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "trace::tests::a_held_deliverys_line_says_what_the_pane_host_said_of_the_humans_input"]
held-typed-trace = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "pacing::a_hold_"]
held-typed-claude = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "claude::agents::a_window_says_what_its_last_look_read_of_the_humans_input"]
held-typed-devin = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "devin::adapter::tests::bypass::a_window_says_what_its_last_look_read_of_the_humans_input"]

