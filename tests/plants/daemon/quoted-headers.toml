# What proves a paste arrived (the reviews of 2026-10-16, GPT-6-Astra and GPT-6.1-Sol, two rounds): an
# item its message's header begins, as ConsensFlow pastes it, the lines of the window's text. So does
# one the harness records the paste in: inside the wrapper Claude Code 2.1.296 puts a paste in
# (`<pasted_content id="…">`, opened on a line of its own and closed the same), behind the
# placeholders of the images Claude Code 2.1.308 attached to a paste that has their paths (`[Image
# #4]`, a space between, the header at once or a blank line and the wrapper; the field bug T-215 of
# 2026-10-21: an image designer's result pasted three times and failed), and, for a member's fresh
# window, behind the exact paste of the brief it received, which its launch gives first, and
# nowhere else. A header quoted in other words, the human's or a message's, proves nothing: a look, a
# window's end and a start each took any item that held it for the paste, so a message whose paste
# never showed was confirmed by a question about it; and the stricter rule that followed took every
# paste a real Claude records for lacking, so a Claude chief's result was pasted again.
#
# The cases are the engine's, `crates/cf-engine/tests/dispatcher/quoted_headers.rs` (a look, the record
# read as the window ends, ConsensFlow's copy of it read so, a message that quotes the header after a
# blank line) and `paste_shapes.rs` (Claude's wrapper, its images' placeholders, the brief a fresh
# window is given first, at a look and at a start), and the rule's own, `delivery_text::tests` in
# `crates/cf-engine/src/delivery_text.rs`. The images' shape is shown on the rig by the case
# `a_result_that_starts_with_an_image_path_was_pasted_three_times` (the stand-in Claude makes
# attachments as Claude Code does: `images` in `fake_agent`), and on the real Claude Code by
# `cargo xtask live image-paste`.
#
# Every name holds `quoted header`, so `npm run plants:daemon -- "quoted header"` runs them all.

[run]
engine-dispatcher-quoted-headers = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "quoted_headers::"]
engine-dispatcher-paste-shapes = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "paste_shapes::"]
engine-lib-delivery-text = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "delivery_text::"]
engine-lib-ask = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "testing::ask::"]
fake-agent-images = ["cargo", "test", "--offline", "-p", "cf-e2e", "--features", "test-support", "--bin", "fake-agent", "images::"]
fake-agent-designer = ["cargo", "test", "--offline", "-p", "cf-e2e", "--features", "test-support", "--bin", "fake-agent", "designer"]
rig-image-paste = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_result_that_starts_with_an_image_path_was_pasted_three_times::"]

[[plant]]
name = "quoted header: a look takes a header quoted in the human's words for the paste, and the message is confirmed though it never arrived"
meant = "a_look_takes_no_header_quoted_in_the_humans_words_for_the_paste"
runs = ["engine-dispatcher-quoted-headers"]

[[plant.edit]]
file = "crates/cf-engine/src/arrival.rs"
find = "            item.role == Role::User && is_paste_of(&item.text, message.id, first.as_deref())"
replace = "            item.role == Role::User && item.text.contains(&crate::delivery_text::marker_of(message.id))"

[[plant]]
name = "quoted header: a window's record, read as it ends, has a header quoted in the human's words taken for the paste"
meant = "a_window_that_ends_takes_no_header_quoted_in_its_record_for_the_paste"
runs = ["engine-dispatcher-quoted-headers"]

[[plant.edit]]
file = "crates/cf-engine/src/in_flight.rs"
find = "        .find(|item| item.role == Role::User && is_paste_of(&item.text, message, first))"
replace = "        .find(|item| item.role == Role::User && item.text.contains(&marker_of(message)))"

[[plant]]
name = "quoted header: ConsensFlow's copy of a window, read as it ends, has a header quoted in the human's words taken for the paste"
meant = "a_window_that_ends_takes_no_header_quoted_in_its_copy_for_the_paste"
runs = ["engine-dispatcher-quoted-headers"]

[[plant.edit]]
file = "crates/cf-engine/src/in_flight.rs"
find = "            .find(|(_, text)| is_paste_of(text, message.id, first.as_deref()));"
replace = "            .next();"

[[plant]]
