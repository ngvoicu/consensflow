# Claude Code's prompt suggestion, which a project's Project settings leaves off in every one of its
# Claude Code windows, the chief's and the members', until the human ticks it (T-1444, Gabriel
# 2026-11-11; RS-29, T-1434): after each turn Claude Code makes a call of its own, a fork of the
# whole conversation read from the cache, to guess the person's next prompt. It is kept in the
# ledger (`crates/cf-ledger/src/projects/prompt_suggestion.rs`, migration 0036's
# `prompt_suggestion`, off for every project that exists and every new one), chosen on the page
# alone (`project.prompt_suggestion`, Project settings' "Prompt suggestion"), told by the engine
# to every launch at launch and on resume with no regard to the role
# (`crates/cf-engine/src/windows.rs`), and acted on by the Claude adapter alone, in the launch's
# own settings file (`env.CLAUDE_CODE_ENABLE_PROMPT_SUGGESTION` as `false`; absent where the
# project ticked it, never `true`), never in the owner's config. Each plant breaks one of these and
# the test written for it fails.
#
# Every name holds `prompt suggestion off`, so `npm run plants:daemon -- "prompt suggestion off"`
# runs them all.

[run]
pso-ledger-described = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "described", "prompt_suggestion::"]
pso-engine-dispatcher = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "prompt_suggestion_off::"]
pso-harness-launch = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "claude::prompt_suggestion_off"]
pso-harness-tooling = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "tooling::"]
pso-daemon-page = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::prompt_suggestion"]
pso-daemon-opening = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::opening"]
pso-proto-page = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "page::"]
pso-rig = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "prompt_suggestion_off::"], builds = true }

[[plant]]
name = "prompt suggestion off: the Claude adapter writes no switch"
meant = "every_launch_of_a_project_with_the_suggestion_off_has_it_switched_in_its_own_file_the_chiefs_too_and_nothing_else_moves"
runs = ["pso-harness-launch"]

[[plant.edit]]
file = "crates/cf-harness/src/claude/install.rs"
find = '''        variables.insert(PROMPT_SUGGESTION_SWITCH.to_owned(), json!("false"));'''
replace = '''        let _ = PROMPT_SUGGESTION_SWITCH;'''

