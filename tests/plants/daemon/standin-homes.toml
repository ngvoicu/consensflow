[[plant.edit]]
file = "crates/cf-e2e/src/live/agents.rs"
find = '''    if !super::keychain::live_case() {'''
replace = '''    if false {'''

[[plant.edit]]
file = "crates/cf-e2e/src/live/agents.rs"
find = '''    assert!(
        super::keychain::live_case(),
        "stand-in run attempted Pi provider lookup"
    );'''
replace = '''    // The plant lets provider discovery read the stand-in's decoy.'''

