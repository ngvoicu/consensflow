# CLN-77: a stand-in's parent refuses a home outside its own run, for each
# harness, and Log::begin never reads Pi's provider file. Each plant removes
# one boundary; its named assertion must catch the silent wrong result.

[run]
standin-home-unit = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "standin_isolation_"]

[[plant]]
name = "standin homes: claude home lookup may escape"
meant = "standin_isolation_claude_home_refuses_the_owner"
runs = ["standin-home-unit"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/machine.rs"
find = '''    crate::standin_process::require_home(&home, &format!("{} home lookup", harness.name()));'''
replace = '''    if harness != Harness::Claude {
    crate::standin_process::require_home(&home, &format!("{} home lookup", harness.name()));
    }'''

