[[plant]]
name = "standin homes: Log begins by reading Pi providers"
meant = "standin_isolation_log_begin_never_reads_a_decoy_pi_auth"
runs = ["standin-home-unit"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/agents.rs"
find = '''    asked_with(requested, None, super::keychain::live_case(), pi_providers)'''
replace = '''    let _ = pi_providers();
    asked_with(requested, None, super::keychain::live_case(), pi_providers)'''

[[plant.edit]]
file = "crates/cf-e2e/src/live/agents.rs"
find = '''    assert!(
        super::keychain::live_case(),
        "stand-in run attempted Pi provider lookup"
    );'''
replace = '''    // The plant lets provider discovery read the stand-in's decoy.'''

[[plant]]
name = "standin homes: audit lookup may open an unowned file"
meant = "standin_isolation_unowned_audit_file_is_refused_before_it_is_opened"
runs = ["standin-home-unit"]

[[plant.edit]]
file = "crates/cf-e2e/src/standin_process.rs"
find = '''            && handed.iter().any(|root| same_or_inside(&file, root)),'''
replace = '''            && (handed.iter().any(|root| same_or_inside(&file, root)) || true),'''

[[plant]]
name = "standin homes: missing inherited home permits PATH lookup"
meant = "standin_isolation_missing_inherited_home_refuses_before_searching_path"
runs = ["standin-home-unit"]

[[plant.edit]]
file = "crates/cf-e2e/src/standin_process.rs"
find = '''    assert!(
        ["HOME", "USERPROFILE"]
            .iter()
            .any(|name| std::env::var_os(name).is_some_and(|value| !value.is_empty())),
        "stand-in inherited HOME lookup: neither HOME nor USERPROFILE names a home"
    );'''
replace = '''    // The plant leaves the inherited account boundary unknown.'''

[[plant]]
name = "standin homes: inherited account path remains searchable"
meant = "standin_isolation_inherited_account_home_is_not_searched_on_path"
runs = ["standin-home-unit"]

[[plant.edit]]
file = "crates/cf-e2e/src/standin_process.rs"
find = '''        !launchers.iter().any(|home| may_reach(folder, home)) && safe_path_entry(folder, forbidden)'''
replace = '''        !launchers.iter().any(|_home| false) && safe_path_entry(folder, forbidden)'''

[[plant]]
name = "standin homes: Muse launcher search enters an inherited harness home"
meant = "standin_isolation_muse_search_passes_over_an_inherited_harness_home"
runs = ["standin-home-unit"]

[[plant.edit]]
file = "crates/cf-e2e/src/standin_process.rs"
find = '''    let launchers = muse_launcher_roots();
    if launchers.iter().any(|launcher| launcher == path) {
        return true;
    }
    safe_path_entry(path, forbidden)'''
replace = '''    let _ = (path, forbidden);
    true'''
