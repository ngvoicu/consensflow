[[plant.edit]]
file = "crates/cf-e2e/src/standin_process.rs"
find = '''            && handed.iter().any(|root| same_or_inside(&file, root)),'''
replace = '''            && (handed.iter().any(|root| same_or_inside(&file, root)) || true),'''
