# Codex on Windows (T-1334, alpha.4's A4-12; the tasks T-399 and T-436 before it).
#
# The Admin page offered no update for Codex's standard install. Codex's standalone installer
# (`install.ps1`, `install.sh`; Codex 0.167.0) puts a release in `packages/standalone/releases`
# of Codex's home, a `current` link (a junction on Windows) to the one in use, and a visible folder
# on the PATH that leads to `current`; the admin read where the link leads, found no folder of an
# installer it knew (`<home>/.codex/bin/`, which no Codex installer has made), and said it did not
# recognize the install. Codex's own `codex update` reads the same place (its install context) and
# runs the installer's script, which moves `current`: that is the update, run by the link the
# person runs. Codex counts a program as standalone only under its own home (`CODEX_HOME`, else
# `.codex` of the user's home, each read where it leads), and the admin counts the same, so what it
# offers an Update of is what `codex update` will update (T-1339's review).

[run]
codex-admin-source = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "admin::source"]
codex-admin-update = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "admin::update"]
codex-admin-real = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "admin::tests::real"]

[[plant]]
name = "codex-windows: the standalone installer is no Codex installer of its own"
meant = "codex_installed_by_its_standalone_installer_is_updated_by_its_own_update_through_the_links"
runs = ["codex-admin-source", "codex-admin-update", "codex-admin-real"]

[[plant.edit]]
file = "crates/cf-harness/src/admin/source.rs"
find = "            Place::CodexStandalone => is_codex_standalone(real, env),"
replace = "            Place::CodexStandalone => false,"

[[plant]]
name = "codex-windows: a program is standalone under any folder that has the names"
meant = "codex_is_standalone_only_under_the_home_codex_reads_and_never_by_a_matching_folder_name"
runs = ["codex-admin-source"]

[[plant.edit]]
file = "crates/cf-harness/src/admin/source.rs"
find = "    real.starts_with(&releases)"
replace = '    real.contains("/packages/standalone/releases/")'

[[plant]]
name = "codex-windows: Codex's home is always .codex in the user's home"
meant = "codex_is_standalone_only_under_the_home_codex_reads_and_never_by_a_matching_folder_name"
runs = ["codex-admin-source"]

[[plant.edit]]
file = "crates/cf-harness/src/admin/source.rs"
find = '    let chosen = match set(env, "CODEX_HOME") {'
replace = '    let chosen = match None::<String> {'

[[plant]]
name = "codex-windows: Codex's home is read as it was written, where a link leads"
meant = "a_home_that_is_a_link_is_the_home_it_leads_to_as_codex_reads_it"
runs = ["codex-admin-source"]

[[plant.edit]]
file = "crates/cf-harness/src/admin/source.rs"
find = '''
    let Ok(codex_home) = fs::canonicalize(chosen) else {
        return false;
    };
'''
replace = '''
    let codex_home = chosen;
'''

[[plant]]
name = "codex-windows: any folder of Codex's packages is the standalone install"
meant = "what_codex_keeps_beside_its_standalone_cli_is_no_install_to_update"
runs = ["codex-admin-source"]

[[plant.edit]]
file = "crates/cf-harness/src/admin/source.rs"
find = '        "{}/packages/standalone/releases/",'
replace = '        "{}/packages/",'

[[plant]]
name = "codex-windows: the update runs the release the link leads to, not the link"
meant = "updates_codex_s_standalone_install_by_its_own_update_through_the_link_the_person_runs"
runs = ["codex-admin-update", "codex-admin-real"]

[[plant.edit]]
file = "crates/cf-harness/src/admin/source.rs"
find = "        let mut update = vec![executable.to_owned()];"
replace = "        let mut update = vec![real.clone()];"
