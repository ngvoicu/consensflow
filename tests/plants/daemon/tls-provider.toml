# The Windows update check's panic with no TLS provider (T-1247, 3.0.7-alpha.2). The workspace's
# reqwest is `rustls-no-provider`, which brings none: a client panics at its build where the process
# has none installed. The app's update check on Windows panicked so at every start: it reads the feed
# with `update_page::read_feed`, and only the updater's plugin, which the Mac's check goes through,
# installs ring before it builds its client. Now the app installs ring for its process (`tls.rs`:
# at the start of `run`, and in the feed's client) and the daemon hands its client a rustls config
# built on ring. These plants are the fix's own: the install taken out of each place that makes it.
# Every name here begins `tls provider:`, so `npm run plants:daemon -- "tls provider"` runs them.
#
# The class itself, that every HTTPS client has its provider, is held by clippy (T-1253): a client is
# built only by its crate's one approved constructor (cf-daemon's `screens::network::client`, the
# app's `update_page::client`), and clippy.toml refuses every other construction, as methods
# (`Client::new`, `Client::builder`, `ClientBuilder::new`, `reqwest::get`, rustls'
# `ClientConfig::builder`...) and as types (`reqwest::Client`, `ClientBuilder`: the only way to refuse
# a `Default` impl, an alias or a derive). The plants named `tls provider lint:` are the rules':
#   - a client built beside the approved constructor in the daemon and in the app, in each way
#     the rule names, and in a place that only holds the type;
#   - each entry of clippy.toml taken out in turn: the fixtures of `screens/network/rules.rs`
#     expect every refused shape, so clippy ends on an expectation it did not meet;
#   - an allow of these lints for a whole module or crate, which tools/xtask/tests/tls_clients.rs
#     refuses, and that test's own reader.
# A rule that read the sources to judge where a provider comes from was tried (T-1247) and left out
# of the release: aliases, scopes, closures, conditional installs and `Default::default()` each
# escaped it. The lock's test, `tools/xtask/tests/tls_lock.rs`, has no plant: cargo rewrites a
# `Cargo.lock` that holds a package nothing needs before any test reads it.

[run]
tls-app-client = ["cargo", "xtask", "app", "test", "update_page::tests::the_feeds_client_is_built"]
tls-app-install = ["cargo", "xtask", "app", "test", "tls::tests::"]
# The lints a plant of a rule is tried with, the gate's: clippy over the daemon, and over the app, with
# warnings denied. A plant that does not build, or fails clippy on another lint, is no catch of a rule:
# node says the first line of a rule's denial and ends with 1, and for any other failure says so and
# ends with 0, so that the plant is MISSED where it is read, and never taken for caught.
tls-daemon-lint = ["node", "-e", '''
const ran = require("child_process").spawnSync("cargo", ["clippy", "--offline", "-p", "cf-daemon", "--all-targets", "--", "-D", "warnings"], { encoding: "utf8" });
if (ran.status !== 0) {
  const text = `${ran.stderr}\n${ran.stdout}`.split("\n");
  const denied = text.find((line) => /^error: (use of a disallowed|this lint expectation is unfulfilled)/.test(line));
  if (denied) {
    console.log(`clippy denied: ${denied}`);
    process.exit(1);
  }
  console.log(`clippy failed, and not on a rule of clippy.toml: ${text.find((line) => line.startsWith("error"))}`);
}
''']
tls-app-lint = ["node", "-e", '''
const ran = require("child_process").spawnSync("cargo", ["xtask", "app", "clippy"], { encoding: "utf8" });
if (ran.status !== 0) {
  const text = `${ran.stderr}\n${ran.stdout}`.split("\n");
  const denied = text.find((line) => /^error: (use of a disallowed|this lint expectation is unfulfilled)/.test(line));
  if (denied) {
    console.log(`clippy for the app denied: ${denied}`);
    process.exit(1);
  }
  console.log(`clippy for the app failed, and not on a rule of clippy.toml: ${text.find((line) => line.startsWith("error"))}`);
}
''']
# The test that refuses an allow of those lints for a whole module or crate, and its reader, built in
# the folder xtask is tested in (a test of the package whole is not to replace the xtask that runs).
tls-crate-allows = ["cargo", "test", "--offline", "--target-dir", "app/src-tauri/target/xtask-check", "-p", "xtask", "--test", "tls_clients"]

