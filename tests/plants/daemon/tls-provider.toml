# Every HTTPS client the product builds has its TLS provider (T-1247, 3.0.7-alpha.2). The workspace's
# reqwest is `rustls-no-provider`, which brings none: a client panics at its build where the process
# has none installed. The app's update check on Windows panicked so at every start: it reads the feed
# with `update_page::read_feed`, and only the updater's plugin, which the Mac's check goes through,
# installs ring before it builds its client. Now the app installs ring for its process (`tls.rs`:
# at the start of `run`, and in the feed's client) and the daemon hands its client a rustls config
# built on ring; `tools/xtask/tests/tls_provider.rs` holds the rule over the workspace, reading its
# sources as Rust and judging each construction on its own (the plants of its second half are the
# escapes the review of T-1247 found: a second client with no provider beside a configured one, and
# a constructor reached through an alias).
# Every name here begins `tls provider:`, so `npm run plants:daemon -- "tls provider"` runs them.
#
# The lock's test, `the_build_holds_ring_as_its_only_tls_provider`, has no plant: cargo rewrites a
# `Cargo.lock` that holds a package nothing needs before any test reads it.

[run]
tls-app-client = ["cargo", "xtask", "app", "test", "update_page::tests::the_feeds_client_is_built"]
tls-app-install = ["cargo", "xtask", "app", "test", "tls::tests::"]
tls-rule = ["cargo", "test", "--offline", "-p", "xtask", "--target-dir", "app/src-tauri/target/xtask-check", "--test", "tls_provider"]

# The feed's client is built on whatever the process has: with none, reqwest panics.
[[plant]]
name = "tls provider: the feed's client installs no provider before it is built"
meant = "the_feeds_client_is_built_in_a_process_that_has_installed_no_tls_provider"
runs = ["tls-app-client"]

[[plant.edit]]
file = "app/src-tauri/src/update_page.rs"
find = '''
    crate::tls::install_ring_as_default();
    reqwest::Client::builder()
'''
replace = '''
    reqwest::Client::builder()
'''

# The install does nothing.
[[plant]]
name = "tls provider: the app's install installs nothing"
meant = "the_app_installs_ring_once_for_its_whole_process"
runs = ["tls-app-install"]

[[plant.edit]]
file = "app/src-tauri/src/tls.rs"
find = "    let _ = ring::default_provider().install_default();"
replace = "    let _ = ring::default_provider();"

# The app starts without it, and with it after the app is built.
[[plant]]
name = "tls provider: the app starts without installing its provider"
meant = "the_app_installs_its_provider_before_it_builds_anything"
runs = ["tls-app-install"]

[[plant.edit]]
file = "app/src-tauri/src/lib.rs"
find = '''
    tls::install_ring_as_default();
    let context = tauri::generate_context!();
'''
replace = '''
    let context = tauri::generate_context!();
'''

[[plant]]
name = "tls provider: the app installs its provider after it has built the app"
meant = "the_app_installs_its_provider_before_it_builds_anything"
runs = ["tls-app-install"]

[[plant.edit]]
file = "app/src-tauri/src/lib.rs"
find = '''
    tls::install_ring_as_default();
    let context = tauri::generate_context!();
'''
replace = '''
    let context = tauri::generate_context!();
'''

[[plant.edit]]
file = "app/src-tauri/src/lib.rs"
find = '''
    .expect("error while building the ConsensFlow app");
'''
replace = '''
    .expect("error while building the ConsensFlow app");
    tls::install_ring_as_default();
'''

# The workspace's rule: a client that says nothing of its provider, a client in a file the list does
# not name, a config on the default provider.
[[plant]]
name = "tls provider: the daemon's client is no longer handed a config of its own"
meant = "every_client_the_product_builds_says_where_its_provider_comes_from"
runs = ["tls-rule"]

[[plant.edit]]
file = "crates/cf-daemon/src/screens/network.rs"
find = "        .tls_backend_preconfigured(tls)"
replace = ""

[[plant]]
name = "tls provider: a client with no provider is built in the app's updater"
meant = "every_client_the_product_builds_says_where_its_provider_comes_from"
runs = ["tls-rule"]

[[plant.edit]]
file = "app/src-tauri/src/updates.rs"
find = "fn describe_check_error(channel: Channel, error: tauri_plugin_updater::Error) -> String {"
replace = '''
fn describe_check_error(channel: Channel, error: tauri_plugin_updater::Error) -> String {
    let _client = reqwest::Client::new();
'''

[[plant]]
name = "tls provider: the daemon's config is built on the default provider"
meant = "no_tls_config_is_built_on_the_default_provider"
runs = ["tls-rule"]

[[plant.edit]]
file = "crates/cf-daemon/src/screens/network.rs"
find = "ClientConfig::builder_with_provider(provider)"
replace = "ClientConfig::builder()"

[[plant]]
name = "tls provider: the updater smoke's server config is built on the default provider"
meant = "no_tls_config_is_built_on_the_default_provider"
runs = ["tls-rule"]

[[plant.edit]]
file = "tools/xtask/src/updater_smoke/feed.rs"
find = '''
    let config = ServerConfig::builder_with_provider(provider)
        .with_safe_default_protocol_versions()
        .map_err(|cause| words("protocols", &cause))?
        .with_no_client_auth()
'''
replace = '''
    let _ = provider;
    let config = ServerConfig::builder()
        .with_no_client_auth()
'''

# The feed's client, seen by the rule: no install before it in its function, no config of its own.
[[plant]]
name = "tls provider: the rule sees the feed's client install nothing"
meant = "every_client_the_product_builds_says_where_its_provider_comes_from"
runs = ["tls-rule"]

[[plant.edit]]
file = "app/src-tauri/src/update_page.rs"
