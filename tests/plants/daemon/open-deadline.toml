# A window whose open the pane host did not answer by the open's deadline (T-669; kluris,
# 2026-10-26, T-668's diagnosis): the host goes on with an open it was asked for, and the
# window started three seconds after the daemon gave up on it, ran its brief unseen for
# fourteen minutes and held the Codex thread the task sent again opened on. The bridge's
# deadline is no refusal (`crates/cf-daemon/src/host.rs`, `opened`: `Opened::Unanswered`);
# the engine ends such a window and takes no proof from it, and no other window of the
# participant opens until the host says it has ended it, asked again at each step
# (`crates/cf-engine/src/windows.rs`, `end_abandoned`; `crates/cf-engine/src/dispatcher.rs`,
# `step` and `pass`); and the pane host never opens a window it was asked to kill before its
# open reached it (`crates/cf-panes/src/pty.rs`, `cancel` and `uncancel`). The daemon's open
# deadline can be cut for a test (`CONSENSFLOW_OPEN_DEADLINE_MS`,
# `crates/cf-engine/src/seams.rs`). The case on the rig is
# `crates/cf-e2e/tests/regressions/a_window_whose_open_missed_its_deadline_worked_on_unseen.rs`,
# which builds the native `cf` and pane host from the sources as planted, so its plants say
# `builds`.
#
# Every name holds `open deadline`, so `npm run plants:daemon -- "open deadline"` runs them all.

[run]
# The engine's tests of a window whose open went unanswered, on the fake windows.
od-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "open_deadline::"]
# The engine's limits, the open's wait among them.
od-limits = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "seams::"]
# The daemon's end of the host: what an open's answer, or none, is.
od-host = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "host::"]
# The pane table's windows killed before they opened.
od-panes = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "pty::tests::"]
# The field's shape on the rig: the real daemon and pane host, the open held in the rig.
od-rig = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_window_whose_open_missed_its_deadline_worked_on_unseen::"]

[[plant]]
name = "open deadline: an open the host did not answer in time is taken for a refusal"
meant = "an_open_the_host_never_answers_is_unanswered_after_sixty_seconds_not_refused"
runs = ["od-host"]

[[plant.edit]]
file = "crates/cf-daemon/src/host.rs"
find = "    if error == DEADLINE {"
replace = "    if error == DEADLINE && false {"

[[plant]]
name = "open deadline rig: an open the host did not answer in time is taken for a refusal, and its window works on unseen"
