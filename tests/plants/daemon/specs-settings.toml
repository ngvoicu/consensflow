# What the app says of specs for every project, and the Specmint it brings (2026-10-15, the owner:
# "I don't see in ConsensFlow in the settings what version of Specmint is brought over, if I can set
# them up globally, coz per project says default to follow the app's settings"). Settings has Specs,
# a third entry under Agents and Harnesses, a dialog of the page: whether specs are on for every
# project, the folder and the variant a project uses unless it names its own, and the Specmint the
# build bundles (its version, and each variant's name, commit and what it is), all read from the
# bundled files by the daemon and never typed into the page. They are kept in the agents file beside
# the human's choice about the roster and are no choice about it: the page alone says them
# (`specs.get`, `specs.set`), and the screens' list and route neither say nor take them. A project
# that names no folder or variant uses the app's, else `.specs` and `core`, where the chief's launch,
# its role text and its skill are given them (`ProjectView::specs_setting`); a project's own Specs
# section says what following means. One plant takes one rule out; a test of it fails. The tests are
# in each layer's own place: `cf_proto::specs` (the resolution and the checks every folder and
# variant is held to), the catalog's roster (`roster::app_specs` and `roster::preferences`, the
# agents file), the dispatcher's `specs::` (what a chief is given), the harness's
# `specmint::bundled` (the version read from the files), the daemon's page operations
# (`page::tests::app_specs`), its roster seam, its Agents page and its screens' route, the browser's
# (`Settings, Specs` and the Specs section of Project settings and of New project, in
# `app/tests/core-page.spec.mjs`), and the rig's case that holds the real daemon and a real launch
# to what Settings says (`crates/cf-e2e/tests/rig/specs.rs`), whose plant says `builds`. Every name
# holds `specs settings`, so `npm run plants:daemon -- "specs settings"` runs them all.

[run]
settings-proto = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "specs::"]
settings-proto-page = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "page::"]
settings-ledger = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "specs"]
settings-catalog = ["cargo", "test", "--offline", "-p", "cf-catalog", "--lib", "roster::"]
settings-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "specs::"]
settings-harness = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "specmint::bundled"]
settings-daemon-roster = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "roster::"]
settings-daemon-page = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::app_specs"]
settings-daemon-agents-page = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "screens::pages"]
settings-daemon-route = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "screens::tests::routes"]
# The case of the rig (a real daemon and pane host, a stand-in chief) that holds a launch to what Settings says.
settings-rig = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "specs::what_settings_says"]
# The dialog Settings opens, and the Specs section of Project settings and of New project, in the browser.
settings-page-dialog = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "Settings, Specs|Settings has Specs"]
settings-page-sections = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "following the app means|project that said a variant|variant that changes while"]
settings-page-new-project = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "New project says what following|New project opened again shows the version"]
# A version or a commit the bundled files do not say, in the three places that show them.
settings-page-unknown = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "bundled files do not say its version"]

