# A member's window refuses the commands that end every program by its name (T-2213): the daemon
# makes a folder of stand-ins (`cf` under the names `pkill` and `killall`, `taskkill.exe` and
# `tskill.exe`) and puts it first on every window's PATH; `cf` started under one of those names
# refuses a call by name in the owner's words and never runs the real command.
# One plant leaves the folder off the PATH; one makes a stand-in that goes on to the real command
# (it names a program that is not there on a Mac, so no plant ever runs the real `pkill`); one
# widens taskkill's allow-list; one leaves `PATH_HELPER_ROOT` unset, one the folder out of its
# root. The shell cases resolve names and run none whose guard is not what they resolve to.
#
# Every name holds `member-guard`, so `npm run plants:daemon -- "member-guard:"` runs them all.

[run]
guard-base = ["cargo", "test", "--offline", "-p", "cf-base", "--lib", "member_guard::"]
guard-daemon = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "member_guard::"]
guard-shells = ["cargo", "test", "--offline", "-p", "cf", "--test", "member_guard_shells"]
guard-codex = ["cargo", "test", "--offline", "-p", "cf-codex-session", "--lib", "guards_path_helper_root"]
guard-cf = ["cargo", "test", "--offline", "-p", "cf", "--test", "member_guard"]

[[plant]]
name = "member-guard: the stand-ins' folder is left off the PATH of every window, so pkill is the real one"
meant = "member_guard::tests::every_window_has_the_guards_folder_first_on_its_path_before_the_bundle"
runs = ["guard-daemon", "guard-cf"]

[[plant.edit]]
file = "crates/cf-daemon/src/member_guard.rs"
find = "    let windows = windows.with_guard(&folder);"
replace = "    let _ = &folder;"

[[plant]]
name = "member-guard: a stand-in for pkill goes on to the real command instead of refusing"
meant = "member_guard::tests::pkill_and_killall_refuse_every_call_in_the_owners_words"
runs = ["guard-base", "guard-cf"]

[[plant.edit]]
file = "crates/cf-base/src/member_guard.rs"
find = "        Guarded::Pkill | Guarded::Killall => false,"
replace = "        Guarded::Pkill | Guarded::Killall => true,"

[[plant]]
name = "member-guard: the allow-list is widened to any switch, so a path Git Bash made of an option goes through"
meant = "member_guard::tests::taskkill_by_name_or_filter_is_refused_and_by_number_goes_to_the_real_one"
runs = ["guard-base"]

[[plant.edit]]
file = "crates/cf-base/src/member_guard.rs"
find = "            _ => return false,"
replace = "            _ => named += 1,"

[[plant]]
name = "member-guard: PATH_HELPER_ROOT is left unset, so a login shell puts the real pkill first"
meant = "pkill_and_killall_resolve_to_the_guard_in_every_form_alone_and_each_inside_each"
runs = ["guard-shells"]

[[plant.edit]]
file = "crates/cf-daemon/src/seams.rs"
find = "                [PATH_HELPER_ROOT, GUARD_ROOT].map(|name| (name.to_owned(), root.clone()))"
replace = "                [GUARD_ROOT].map(|name| (name.to_owned(), root.clone()))"

[[plant]]
name = "member-guard: the root's paths file leaves the guard's folder out, so path_helper puts the system's first"
meant = "member_guard::tests::the_root_mirrors_the_systems_files_with_the_guards_folder_first_and_follows_them"
runs = ["guard-daemon", "guard-shells"]

[[plant.edit]]
file = "crates/cf-daemon/src/member_guard.rs"
find = "    paths.push(b'\\n');"
replace = "    paths.clear();"

[[plant]]
name = "member-guard: a Codex thread's commands are not given PATH_HELPER_ROOT, so a policy that keeps only core names loses the guard in a login shell"
meant = "broker::selection::tests::every_start_resume_and_fork_is_given_the_guards_path_helper_root_for_its_commands"
runs = ["guard-codex"]

[[plant.edit]]
file = "crates/cf-codex-session/src/arguments.rs"
find = "        if root == ours {"
replace = "        if root != ours {"

[[plant]]
name = "member-guard: a relative home is published as it is, so a window opened in its project resolves both names to the system's"
meant = "member_guard::tests::a_relative_home_gives_every_window_whole_paths"
runs = ["guard-daemon"]

[[plant.edit]]
file = "crates/cf-daemon/src/member_guard.rs"
find = "    let home = &std::path::absolute(home).unwrap_or_else(|_| home.to_path_buf());"
replace = "    let _ = std::path::absolute(home);"

[[plant]]
name = "member-guard: the mirror takes a link in paths.d that path_helper skips, so its answer differs from the system's"
meant = "member_guard::tests::the_mirror_takes_only_the_entries_the_helper_reads_not_a_link_and_not_a_folder"
runs = ["guard-daemon"]

[[plant.edit]]
file = "crates/cf-daemon/src/member_guard.rs"
find = "        if entry.file_type()?.is_file() {"
replace = "        if std::fs::metadata(entry.path())?.is_file() {"

[[plant.edit]]
file = "crates/cf-daemon/src/member_guard.rs"
find = "    let found = std::fs::symlink_metadata(file).ok()?;"
replace = "    let found = std::fs::metadata(file).ok()?;"

[[plant]]
name = "member-guard: another folder is put before the guard's, so the first program is not the stand-in"
meant = "pkill_and_killall_in_a_window_are_refused_and_the_real_command_is_never_reached"
runs = ["guard-cf"]

[[plant.edit]]
file = "crates/cf-daemon/src/seams.rs"
find = "        self.path = format!(\"{}{delimiter}{}\", folder.display(), self.path);"
replace = "        self.path = format!(\"/usr/bin{delimiter}{}{delimiter}{}\", folder.display(), self.path);"
