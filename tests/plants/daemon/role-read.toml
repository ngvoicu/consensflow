# A role too long for one message, told once its window has read it (T-1021, 2026-11-01; spec
# `smaller-contexts`). Since the chief's rules for smaller contexts (T-1009) a chief's role with
# specs on is longer than one message at a staff of three, so a resumed Codex chief is told its
# role in part: the opening of the note, which says to read the rest now, and `cf inbox read m-N`.
# The role counts as told once the window has read the note: `cf` printed it whole and said so
# (up to a bound of a role's own, `cf_base::role_read`, which Codex and Muse were shown whole),
# the board says which notes tell a role (`"role": true`), and the ledger marks a delivered role
# note read and records the conversation told it, in one write. A window reads the note the
# moment it has it, often before the daemon has seen the paste arrive. A message's read made then
# is kept with it (T-1075; its receipt, `readEarly`) and, given back to the queue, a message a
# read receives is read. A role keeps no such read since review T-1516: each print of it is
# logged as a part (a role read whole is its part 1 of 1), whatever state its note is in, and the
# plants of the kept read that only a role reached went with it. Then no line and no repeat at the
# next Resume; a role not read by then is said again and the human told so. The engine's
# `role_change` (and its greeting of a session no hook greeted), the ledger's `receive_read`, the
# daemon's `GET /api/inbox/<id>` and the `cf` command each hold a rule; one plant takes one out,
# and a test of it fails.
#
# A role `cf` cannot print within that bound it prints in parts, each within it (T-1513, review
# T-1510): the opening says how many, each part's line gives the next one's command, and each
# part printed is said to the board by its number and how many there are. The ledger logs each
# (`message.part_read`, with the conversation it was printed in) whatever state the note is in,
# and reads the role once every part was printed in the conversation it goes to: asked when a
# part is printed and when the paste is confirmed (review T-1516). It counts the parts itself, as
# the window's `cf` prints them, and refuses a read that says another count; a role said read
# whole is its part 1 of 1. The plants at the end take out each of those rules.
#
# Every name holds `role read`, so `npm run plants:daemon -- "role read"` runs them all.

[run]
engine-told = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "role_change::told::"]
engine-cleared = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "role_change::cleared::"]
engine-role-lib = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "role_change::"]
ledger-read = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "read_in_the_inbox::"]
cf-board-role = ["cargo", "test", "--offline", "-p", "cf", "--lib", "board::tests::a_role_cf_inbox_read"]
cf-board-inbox = ["cargo", "test", "--offline", "-p", "cf", "--lib", "board::tests::a_message_cf_inbox_read"]
cf-board-thread = ["cargo", "test", "--offline", "-p", "cf", "--lib", "board::tests::a_task_thread_printed_whole"]
cf-lines = ["cargo", "test", "--offline", "-p", "cf", "--lib", "board::lines::tests::the_answers_still_waiting"]
base-role-read = ["cargo", "test", "--offline", "-p", "cf-base", "--lib", "role_read::"]
daemon-message = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "routes::message"]
engine-in-parts = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "role_change::in_parts::"]
cf-board-parts = ["cargo", "test", "--offline", "-p", "cf", "--lib", "board::tests::a_role_"]
cf-board-queued = ["cargo", "test", "--offline", "-p", "cf", "--lib", "board::tests::a_part_of_a_role_back_in_the_queue"]
daemon-answers = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "routes::answers::tests::a_role_said_read_by_its_parts"]
ledger-role-note = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "role_note", "a_role_read_in_parts_across"]
ledger-part-count = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "role_note", "a_part_read_is_of_its_recipients_own_role"]
daemon-count = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "routes::answers::tests::a_read_that_says_a_count"]

