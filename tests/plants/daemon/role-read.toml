# A read made while the paste of a message is still on its way (T-1075, critical review T-1014 note 8).
# A window reads the note the moment it has it, before the daemon has seen the paste arrive: the
# ledger keeps the read in the message's receipt, with the conversation it was made in (`keep_read`),
# and tells it when the delivery ends: a role is read and recorded by the write that confirms the
# paste; a message a read receives is read when its paste is given back, and not typed in again; a
# role given back keeps the read and waits for its paste. `cf` says it read a message whose paste is
# on its way as it says it of a queued one. One plant takes one of these out, and a test of it fails.

