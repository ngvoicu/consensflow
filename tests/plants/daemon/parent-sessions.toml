# A parent agent's session reached every window (T-971, issues/inherited-claude-env-in-panes.md
# in consensflow-sme): an app, a `tauri dev` or a test run started from inside an agent's
# shell holds the variables that agent marks its own session with (Claude Code's
# `CLAUDE_CODE_SESSION_ID` and `CLAUDE_CODE_CHILD_SESSION`, Codex's `CODEX_THREAD_ID`, Pi's
# `PI_SESSION_ID`…), and the pane host started every window from that environment, the login
# shell the app asks had them too, and the daemon gave them back to every window named in
# `CONSENSFLOW_TERMINAL_ENV`. Each harness's list is `Harness::session_variables` (cf-proto),
# which a harness added to `Harness::ALL` must fill; with a board's window's
# (`cf_base::env::WINDOW_VARIABLES`, T-868, tests/plants/cli/board-env.toml) it is one list,
# `parent_session_variables`. The pane host takes every one out of what a
# pane inherits unless the pane's frame sets it; the daemon gives a window none it took of a
# terminal; the app takes them out of its own environment as it starts, and out of what it
# takes of a terminal's; and `cf ui` takes them out of the daemon's own environment, which its
# own programs (a harness's probes, git) run on (T-1024). A terminal marks its pane too, as cmux
# does (`TERMINAL_SESSION_VARIABLES`), and the one list has it. One plant takes one rule out; a test of it fails. The `rig:` plants
# hold it end to end through the real daemon and pane host
# (`crates/cf-e2e/tests/regressions/a_parent_agents_session_reached_every_window.rs`) and say
# `builds`. Every name holds `parent-sessions`, so `npm run plants:daemon -- parent-sessions`
# runs them all.

[run]
parent-sessions-proto = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "agents::tests::"]
parent-sessions-host = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "a_pane_inherits_nothing_of_a_session"]
parent-sessions-daemon = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "seams::tests::no_window_is_given_a_harness_session"]
parent-sessions-app = ["cargo", "xtask", "app", "test", "harness_sessions_variable"]
parent-sessions-base = ["cargo", "test", "--offline", "-p", "cf-base", "--lib", "env::tests::an_environment_without"]
parent-sessions-live-monitor = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_monitor_wait", "the_window_is_opened_without"]
parent-sessions-kit = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::window::tests::a_muse_window"]
parent-sessions-live-check = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_session_vars"]
parent-sessions-rig = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_parent_agents_session_reached_every_window::"], builds = true }

