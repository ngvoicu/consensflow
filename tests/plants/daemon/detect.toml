# Where `crates/cf-harness` finds a harness's CLI (`detect.rs`): on the PATH the
# daemon was given, then on Windows npm's global folder, `%APPDATA%\npm`, after the
# harness's own places and the common ones, and nowhere off Windows; then, on every
# system, the system's own folders of programs (`/opt/homebrew/bin` on a Mac), which
# the environment carries (`crates/cf-base/src/env.rs`: the ones
# `CONSENSFLOW_TOOL_FOLDERS` names, else the machine's for the process's own, none for
# one a test makes). The daemon runs everything with them after its PATH
# (`crates/cf-daemon/src/start.rs`), and finds what it needs there, the Node of an npm
# shim among it; a harness's CLI alone is looked for on the PATH as given first
# (`crates/cf-process/src/search.rs`, `on_search_path`). The owner's Homebrew `codex` was "not
# installed" when a slow login shell left the daemon on the Finder's PATH (2026-10-15,
# 3.0.4); the rig's cases are
# `crates/cf-e2e/tests/regressions/codex_in_homebrew_taken_for_not_installed.rs`,
# whose run builds the native `cf` from the sources as planted. Every name here
# begins `detect:`, so `npm run plants:daemon -- detect` runs them.

[run]
detect-unit = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "detect::"]
# Node's recordings of detection, played (`crates/cf-harness/tests/goldens/admin`).
detect-goldens = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "admin"]
# The environment's folders of programs, and the PATH they make.
base-env = ["cargo", "test", "--offline", "-p", "cf-base", "--lib", "env::"]
# Where a program is looked for on a PATH.
process-search = ["cargo", "test", "--offline", "-p", "cf-process", "--lib", "search::"]
# What an installed harness's folder says about how to update it.
admin-source = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "admin::source"]
# The daemon started as the Finder starts it: a task to a Codex worker whose Codex is
# only in the system's folder, or the human's own in the home with an older one there,
# and a window that runs a program of the system's folder.
rig-regression-codex-in-homebrew = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "codex_in_homebrew_taken_for_not_installed::"]

# The system's folders of programs, looked in last.
