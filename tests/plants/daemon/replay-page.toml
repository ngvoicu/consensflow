# Plants in D4's P5-C: the page that replays a window's journal muted and then takes everything
# from the boundary live (app/ui/terminal-link.js, app/ui/term.js, app/ui/core). A replay that
# answers the program, a live byte written twice or not at all, a replay left stuck, a history
# pulled before its subscription or let go of before the page took it, and a window left owing its
# room are silent: the screen still shows something. The page's tests are
# app/tests/terminal-replay.spec.mjs and, with the shipped board, app/tests/core-page.spec.mjs.
# The host's rules are in replay-journal.toml.

[run]
page = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/terminal-replay.spec.mjs", "--workers=2"]
board = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "pulls no history early|settles every message|drawn again first|asks to see while|no reply once the lane has left", "--workers=2"]

[[plant]]
name = "replay page: a replay is not muted"
meant = "a replay answers no question of the program and the first live question is answered once"
runs = ["page"]

[[plant.edit]]
file = "app/ui/term.js"
find = "    this.terminal.options.disableStdin = on\n    if (on) {"
replace = "    if (on) {"

[[plant]]
name = "replay page: a live message that straddles the boundary is written whole, twice"
meant = "a live message below the emulator's offset is dropped, and one that straddles it is written from it"
runs = ["page"]

[[plant.edit]]
file = "app/ui/terminal-link.js"
find = "        bytes = bytes.subarray(window.next - offset)\n"
replace = ""

[[plant]]
name = "replay page: the first live byte is lost at the boundary"
meant = "a reloaded page equals a continuous xterm in every case the reviews ran"
runs = ["page"]

[[plant.edit]]
file = "app/ui/terminal-link.js"
find = "    window.next = piece.from + bytes.length\n    window.parsed"
replace = "    window.next = piece.from + bytes.length + 1\n    window.parsed"

[[plant]]
name = "replay page: a replay that xterm fails on is left stuck"
meant = "a window that xterm fails on is drawn clean from the boundary, marked truncated, every time"
runs = ["page"]

[[plant.edit]]
file = "app/ui/term.js"
find = "      window.addEventListener('error', this.failureWatch)\n    } else {"
replace = "    } else {"

[[plant]]
name = "replay page: a pull that fails is not tried again"
meant = "a pull that fails is tried again from the same offset, and a stale page stops"
runs = ["page"]

[[plant.edit]]
file = "app/ui/terminal-link.js"
find = "      await pause(retryDelay(failures))\n      window.retrying = false"
replace = "      return null"

[[plant]]
name = "replay page: the page's own size is journaled at the end, not where its emulator took it"
meant = "a character cut between messages is drawn whole, live and after a reload"
runs = ["page"]

[[plant.edit]]
file = "app/ui/terminal-link.js"
find = "      ...(window?.parsed == null ? {} : { at: window.parsed }),"
replace = ""

[[plant]]
name = "replay page: a history is pulled before the page has subscribed"
meant = "a board that is drawn before subscribe_output has answered pulls no history early, and keeps what was there"
runs = ["board"]

[[plant.edit]]
file = "app/ui/terminal-link.js"
find = "    if (!this.#subscribed) return\n"
replace = ""

[[plant]]
name = "replay page: a window let go of settles none of what it holds"
meant = "a lane that leaves while its history is on its way settles every message it holds, and lets no history go"
runs = ["board"]

[[plant.edit]]
file = "app/ui/terminal-link.js"
find = "      if (window.last !== null) this.#drawn(key, window.last)\n"
replace = ""

[[plant]]
name = "replay page: a window the person does not see is drawn again with the shown ones"
meant = "the windows the person sees are drawn again first, a hidden one after them, one it is shown at once"
runs = ["board"]

[[plant.edit]]
file = "app/ui/terminal-link.js"
find = "      if (!window.started && this.#shown(window.pane)) this.#start(window)"
replace = "      if (!window.started) this.#start(window)"

[[plant]]
name = "replay page: a window waiting to be drawn again sends its size"
meant = "a board that is drawn before pane_page_activate has answered pulls no history early, and keeps what was there"
runs = ["board"]

[[plant.edit]]
file = "app/ui/terminal-link.js"
find = "    if (window?.replaying) return\n"
