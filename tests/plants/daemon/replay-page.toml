[[plant.edit]]
file = "app/ui/terminal-link.js"
find = "    if (this.#retired.has(key)) return this.#drawn(key, message)\n"
replace = "    if (this.#retired.has(key)) {\n      void this.#invoke('pane_reply_enqueue', { pageId: this.#pageId, id: message.id, generation: message.generation, sequence: 99, length: 4, bytes: btoa('\\x1b[0n') })\n      return this.#drawn(key, message)\n    }\n"
