# A model list is read when it is asked for (A4-28, T-1321; Gabriel, 2026-11-08: "for all
# ConsensFlow should show the list it grabs when I open a new project modal or project settings
# modal"; the critical review T-1325 mended it): every dialog starts a read of every installed
# harness as it opens, whatever role or harness was left picked, side by side; every picker of a
# harness in a dialog shows the one read of it, and what it submits names that read (`read`); a
# read that fails lists no model and says why, and an Edit member that changes nothing says so and
# saves the member's own choice. The daemon reads the harness at each ask, one harness at a time;
# **a read serves only the asks that came before it began**, the asks already waiting when it
# begins share it, and a submission is checked against the read it names, kept in memory for the
# daemon's life, else against a read made for it, else refused (crates/cf-daemon/src/models.rs,
# crates/cf-daemon/src/page/staff.rs); it forgets what an earlier life kept as it starts
# (crates/cf-daemon/src/start.rs, crates/cf-ledger/src/model_lists.rs). The page's read of Pi is
# the list Pi shows its human, who opens `/model` seconds after Pi started: the read asks again
# until the list has stood still, which is the only confirmation Pi allows (no ready event in
# 1.5.0's rpc); one the wait could not confirm comes back stale, an empty first answer is waited
# on like any other, and a window's launch does not wait (crates/cf-harness/src/pi/models.rs).
# The ignored real-Pi copy tests hold the copy byte for byte but for Pi's catalog files
# (crates/cf-harness/src/pi/models/tests/homes.rs). Every name holds `live models:`:
# `npm run plants:daemon -- "live models:"` runs them.

[run]
lm-pi = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "pi::models::tests::live"]
lm-homes = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "pi::models::tests::homes::"]
lm-daemon = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "models::tests::"]
lm-members = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::members::"]
lm-start = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "start::tests::restart::a_start_forgets"]
lm-ledger = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "model_lists"]
lm-proto = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "models::"]
lm-page = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "A4-28"]

