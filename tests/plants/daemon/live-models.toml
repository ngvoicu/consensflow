# A model list is read when it is asked for (A4-28, T-1321; Gabriel, 2026-11-08: "for all
# ConsensFlow should show the list it grabs when I open a new project modal or project settings
# modal"): the page's dialogs start a read of every installed harness as they open, side by side,
# each select says it is reading until its answer comes, and a read that fails lists no model and
# says why (the list read before is never put in its place: a member's own model stays in
# its form). The daemon reads the harness at each ask, one harness at a time, and takes the
# ask that waited for the read in flight into that read (crates/cf-daemon/src/models.rs); it
# forgets the lists an earlier life kept as it starts (crates/cf-daemon/src/start.rs,
# crates/cf-ledger/src/model_lists.rs). The page's read of Pi is the list Pi shows its human, who
# opens `/model` seconds after Pi started: the read asks again until the list has stood
# still, a window's launch does not (crates/cf-harness/src/pi/models.rs). Every name holds
# `live models:`: `npm run plants:daemon -- "live models:"` runs them.

[run]
lm-pi = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "pi::models::tests::live"]
lm-daemon = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "models::tests::"]
lm-start = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "start::tests::restart::a_start_forgets"]
lm-ledger = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "model_lists"]
lm-proto = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "models::"]
lm-page = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "A4-28"]

