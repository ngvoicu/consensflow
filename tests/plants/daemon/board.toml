# The board keeps every task in view: a task no lane has is among the open
# ones, whatever its state, and the page and `cf task list` draw it. Three
# cases the owner decided on (2026-10-07) stay in view: a task paused before
# any member had it, one called off or failed before any member had it, and
# the tasks of a member the human removed. One plant takes one case out of the
# board, or one rule out of what draws it; a test of it fails: the ledger's own,
# which holds the board to the placements, or the page's, the eval's and the
# list's. A run written `{ node: [...] }` is `node --test`.

[run]
# The ledger's board, on a ledger of its own: held to the placements.
ledger-board = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "cancelled"]
# The page's rules for the cards it is given.
board-ui = ["node", "--test", "--test-reporter=tap", "tests/board-ui.test.mjs"]
# `cf task list`, over what waits for a member and what does not, and over the
# lanes with a task to look at and the idle sessions (T-261: a board of two days
# listed 141 sessions of finished tasks and buried the few that held work).
board-task-list = ["cargo", "test", "--offline", "-p", "cf", "--lib", "board::task"]
# The usage `cf task list --help` answers with, in a window as a window runs it.
board-task-list-usage = ["cargo", "test", "--offline", "-p", "cf", "--test", "help"]

[[plant]]
name = "board: the ledger leaves a task paused before any member had it off the board"
meant = "a_task_no_lane_has_is_among_the_open_ones_whatever_its_state_as_node_draws_the_board"
runs = ["ledger-board"]

[[plant.edit]]
file = "crates/cf-ledger/src/page_reads.rs"
find = ".filter(|(_, lane)| !has_lane(lane))"
replace = '.filter(|(card, lane)| !has_lane(lane) && !(card.state == "paused" && card.assignee.is_none()))'

[[plant]]
name = "board: the ledger leaves a task called off or failed before any member had it off the board"
meant = "a_task_no_lane_has_is_among_the_open_ones_whatever_its_state_as_node_draws_the_board"
runs = ["ledger-board"]

[[plant.edit]]
file = "crates/cf-ledger/src/page_reads.rs"
find = ".filter(|(_, lane)| !has_lane(lane))"
replace = '.filter(|(card, lane)| !has_lane(lane) && !(matches!(card.state.as_str(), "cancelled" | "failed") && card.assignee.is_none()))'

[[plant]]
name = "board: the ledger leaves a removed member's tasks off the board"
meant = "a_task_no_lane_has_is_among_the_open_ones_whatever_its_state_as_node_draws_the_board"
runs = ["ledger-board"]

[[plant.edit]]
