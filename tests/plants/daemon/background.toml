# What a worker's turn leaves running, and how a window closes (the report of
# 2026-10-09: a recording run left in the background died, killed outright, with
# the window its worker's turn had ended). One plant takes one rule out; a test
# of it fails. The first plants run the tests of the crates, which hold each rule
# apart; the `background rig:` plants after them hold that the rule reaches the
# chief through the real daemon and pane host, and run only the case of the rig
# (`crates/cf-e2e/tests/rig/background_work.rs`) that holds it. The rig's cases
# build the `cf` and the pane host they run from the sources as planted, in
# release, which makes these the slowest plants, and they say `builds`: the
# family builds the native `cf` again once each is put back. Every name holds
# `background`, so `npm run plants:daemon -- background` runs them all, and
# `background rig` or `background close` the end to end ones or the closes.
#
# The closes are Unix's (the signals a window's programs are asked to end with, and
# the grace they are given): Windows asks nothing and ends the tree at once, so on
# Windows these plants would find no test to fail. They are run on a Mac.

[run]
# The engine's tests of the hold, the settle time, the marks and the notes, on the fake windows.
engine-dispatcher-background = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "background"]
# The pane host's tests of what a tree had before a turn.
panes-lib-background = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "background"]
panes-lib-turn = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "turn"]
# The pane host's tests of how a window closes.
panes-lib-close = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "close"]
# The same over the wire, with the helper the daemon runs.
panes-headless-turn-marked = ["cargo", "test", "--offline", "-p", "cf-panes", "--test", "headless", "a_turn_marked"]
# The app's quit, which closes the windows within the grace they are given.
app-test-quitting = ["cargo", "xtask", "app", "test", "quitting"]
# The page's board, which says why a window that works does.
board-ui = ["node", "--test", "--test-reporter=tap", "tests/board-ui.test.mjs"]
# The cases of the rig (`background_work` of crates/cf-e2e): the daemon and the pane host
# in real terminals, a case for each rule, found by the start of its name.
rig-background-hold = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "background_work::a_turn_that_ends_with_the_job"]
rig-background-settle = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "background_work::a_job_that_ends_with_no_turn"]
rig-background-before-the-turn = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "background_work::work_the_window_had_before"]
rig-background-cancel = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "background_work::cancelling_a_task"]
rig-background-pause = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "background_work::pausing_a_task"]
rig-background-grace = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "background_work::a_job_that_ignores"]

