# What a worker's turn leaves running, and how it is ended: a worker's answer is its
# task's result at once, and what its turn left running is ended as the result is
# taken (the owner's decision of 2026-10-13, after T-7 and T-15 on Windows, which
# reverses the hold of 2026-10-09: a recording run left in the background died, killed
# outright, with the window its worker's turn had ended, so the result waited for it
# for ever). When in doubt the pane host ends less: it chooses what it ends, from what
# a chain of processes that run proves the turn's (a shell the harness started, and
# what that started), never what it can prove the harness's, and what it cannot trace
# it leaves running and does not name. What it ends it chooses once, when the ending
# begins: a window's new work is none of it. The daemon waits for the host's answer and
# holds the window until it has it. One plant takes one rule out; a test of it fails.
# The first plants run the tests of the crates, which hold each rule apart; the
# `background rig:` plants after them hold that the rule reaches the chief through the
# real daemon and pane host, and run only the case of the rig
# (`crates/cf-e2e/tests/rig/background_work.rs` and `background_close.rs`) or of the
# regressions that holds it. The rig's cases build the `cf` and the pane host they run
# from the sources as planted, in release, which makes these the slowest plants, and they
# say `builds`: the family builds the native `cf` again once each is put back. Every name
# holds `background`, so `npm run plants:daemon -- background` runs them all, and
# `background rig` or `background close` the end to end ones or the closes.
#
# The closes and the grace are Unix's (the signals a window's programs are asked to end
# with, and the time they are given): Windows asks nothing and ends the tree at once, so
# on Windows these plants would find no test to fail. They are run on a Mac.
#
# A plant that takes the bound of the tree out, or widens what it lets through
# (`background bound:`), runs only `panes-lib-tree`, whose tests signal on a machine made
# up and send no signal to any process there is: never `panes-lib-turn`, `panes-lib-close`,
# the headless tests nor the rig, where the processes are real and the user's own are among
# them. A plant that widens what the tree selects is held by the bound, and its real runs
# have a process outside the window that must still run after (`Sentinel`).
#
# **No plant may edit the guard** (`crates/cf-panes/src/process_tree/guard.rs`). In every
# build that tests with real signals the real system's senders ask it first, by queries of
# its own, whether the target descends from the test process (or is in the session of a
# program the test started, or was registered), and a test that would signal any other
# panics and sends nothing. That is what makes a plant of the snapshot, the selection or
# the bound safe to run on real processes (a fault in the table the bound judges by would
# otherwise reach the user's programs, as it did six times on 2026-10-14), and a plant that
# weakens it takes that away from every run beside it. What holds the guard is its own
# tests, which send signal 0 or none (`panes-lib-guard`); the plants of `background guard:`
# plant what the senders ask of it, or the snapshot it guards against, and run only
# `panes-lib-guard` and `panes-lib-guarded` (a window of real processes, where the guard's
# refusal is what ends the run). If the guard refuses on any other run, stop: something
# signalled what is none of the window's.

[run]
# The engine's tests of the ending, the requester's note, the marks and the close notes,
# on the fake windows.
engine-dispatcher-background = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "background"]
# What the engine tells the host of a window's harness.
engine-dispatcher-servers = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "servers"]
# The engine's own small rules: the note's words, what is quoted of a command.
engine-lib-background = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "background"]
# The wire of a mark and of an ending.
proto-lib-panes = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "panes"]
# The pane host's tests of what the turn's work is and what the harness's own, on lists of
# processes; of the tree it looks at on a Mac; and of what an ending does to real ones.
panes-lib-background = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "background"]
panes-lib-tree = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "process_tree"]
panes-lib-turn = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "turn"]
# The pane host's tests of how a window closes.
panes-lib-close = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "close"]
# The sentinel its real-process tests keep outside the window, which must say when it was ended.
panes-lib-sentinel = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "sentinel"]
# The guard of a test build's real signals, whose tests send signal 0 or none.
panes-lib-guard = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "process_tree::guard"]
# A window of real processes closed by a test: where what the snapshot wrongly admits reaches
# the senders, and the guard stops it.
panes-lib-guarded = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "a_program_that_ignores_the_request_to_end"]
# The same over the wire, with the helper the daemon runs.
panes-headless-turn-marked = ["cargo", "test", "--offline", "-p", "cf-panes", "--test", "headless", "a_turn_marked"]
panes-headless-ending = ["cargo", "test", "--offline", "-p", "cf-panes", "--test", "headless", "an_ending"]
panes-headless-harness = ["cargo", "test", "--offline", "-p", "cf-panes", "--test", "headless", "a_mark_that_names_the_harness"]
# The app's quit, which closes the windows within the grace they are given.
app-test-quitting = ["cargo", "xtask", "app", "test", "quitting"]
# The cases of the rig (`background_work` and `background_close` of crates/cf-e2e): the
# daemon and the pane host in real terminals, a case for each rule, found by the start of
# its name.
rig-background-result = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "background_work::a_workers_answer"]
rig-background-kept = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "background_work::a_window_the_human_keeps_open"]
rig-background-servers = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "background_work::a_job_the_agent_leaves"]
rig-background-before-the-turn = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "background_work::work_the_window_had_before"]
rig-background-cancel = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "background_close::cancelling_a_task"]
rig-background-pause = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "background_close::pausing_a_task"]
rig-background-grace = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "background_work::a_job_that_ignores"]
# The process the rig keeps outside its windows, which it finds still running when it closes.
rig-stranger = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "stranger::"]
# T-15's shape: a command that never exits, and the final answer of the worker that left it.
regression-never-exits = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_command_that_never_exits"]

