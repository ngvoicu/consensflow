# What a worker's turn leaves running, and how it is ended: a worker's answer is its
# task's result at once, and what its turn left running is ended as the result is
# taken (the owner's decision of 2026-10-13, after T-7 and T-15 on Windows, which
# reverses the hold of 2026-10-09: a recording run left in the background died, killed
# outright, with the window its worker's turn had ended, so the result waited for it
# for ever). One plant takes one rule out; a test of it fails. The first plants run
# the tests of the crates, which hold each rule apart; the `background rig:` plants
# after them hold that the rule reaches the chief through the real daemon and pane
# host, and run only the case of the rig (`crates/cf-e2e/tests/rig/background_work.rs`)
# or of the regressions that holds it. The rig's cases build the `cf` and the pane host
# they run from the sources as planted, in release, which makes these the slowest
# plants, and they say `builds`: the family builds the native `cf` again once each is
# put back. Every name holds `background`, so `npm run plants:daemon -- background` runs
# them all, and `background rig` or `background close` the end to end ones or the closes.
#
# The closes and the grace are Unix's (the signals a window's programs are asked to end
# with, and the time they are given): Windows asks nothing and ends the tree at once, so
# on Windows these plants would find no test to fail. They are run on a Mac.

[run]
# The engine's tests of the ending, the requester's note, the marks and the close notes,
# on the fake windows.
engine-dispatcher-background = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "background"]
# What the engine does with the servers a harness keeps, and with a host that will not end.
engine-dispatcher-servers = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "servers"]
# The engine's own small rules: the note's words, what is quoted of a command.
engine-lib-background = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "background"]
# The wire of an ending.
proto-lib-panes = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "panes"]
# The pane host's tests of what a tree had before a turn, and of what it ends of it.
panes-lib-background = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "background"]
panes-lib-turn = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "turn"]
# The pane host's tests of how a window closes.
panes-lib-close = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "close"]
# The same over the wire, with the helper the daemon runs.
panes-headless-turn-marked = ["cargo", "test", "--offline", "-p", "cf-panes", "--test", "headless", "a_turn_marked"]
panes-headless-ending = ["cargo", "test", "--offline", "-p", "cf-panes", "--test", "headless", "an_ending"]
# The app's quit, which closes the windows within the grace they are given.
app-test-quitting = ["cargo", "xtask", "app", "test", "quitting"]
# The cases of the rig (`background_work` of crates/cf-e2e): the daemon and the pane host
# in real terminals, a case for each rule, found by the start of its name.
rig-background-result = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "background_work::a_workers_answer"]
rig-background-kept = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "background_work::a_window_the_human_keeps_open"]
rig-background-servers = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "background_work::a_job_the_agent_leaves"]
rig-background-before-the-turn = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "background_work::work_the_window_had_before"]
rig-background-cancel = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "background_work::cancelling_a_task"]
rig-background-pause = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "background_work::pausing_a_task"]
rig-background-grace = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "background_work::a_job_that_ignores"]
# T-15's shape: a command that never exits, and the final answer of the worker that left it.
regression-never-exits = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_command_that_never_exits"]

