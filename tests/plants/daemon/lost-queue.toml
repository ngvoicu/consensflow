# A task stuck "working" after its window was resumed (T-442, poker-lab, ConsensFlow 3.0.4, Claude
# Code 2.1.302): the worker's window closed with a job's notification queued in Claude's memory, the
# chief's reopen opened it again on its conversation, and the reopen's turn never read as over, since
# the record still had that message to come. ConsensFlow knows where the new process began: the Claude
# adapter takes the transcript's length when it prepares a window on a conversation that already
# was, every look of the window says it (`Options::relaunched`, the length and the bytes before it), and Claude's reader empties the
# queue there, keeping what the new process queued after it
# (`crates/cf-harness/src/claude/record.rs`, `crates/cf-harness/src/claude/adapter.rs`, the length
# from the records seam: `crates/cf-harness/src/records/thread.rs`,
# `crates/cf-daemon/src/seams/boundary.rs`). Claude's close of a cut turn (`No response requested.`)
# is the harness's commentary, no part of a result.
#
# The reader's tests are `crates/cf-harness/src/claude/record/tests/restart.rs` (on T-442's shape,
# `crates/cf-harness/tests/fixtures/claude/restart-left-a-queued-notification.jsonl`), the adapter's
# `crates/cf-harness/tests/launch/claude/relaunched.rs`; the cases are
# `crates/cf-e2e/tests/regressions/a_task_stuck_working_after_its_window_was_resumed.rs`, which build
# the native `cf` from the sources as they are planted, so their plants say `builds`.
#
# Every name holds `lost-queue`, so `npm run plants:daemon -- "lost-queue"` runs them all.

[run]
lost-queue-reader = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record"]
lost-queue-adapter = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "claude::relaunched"]
lost-queue-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "windows::"]
lost-queue-rig = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_task_stuck_working_after_its_window_was_resumed::"]
lost-queue-looks = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "looks_finished::"]

