# T-526 (the consensflow board, 3.0.5 then 3.0.6-alpha.2, Claude Code 2.1.310, 2026-10-25): the same
# shape with an update's restart between the close and the reopen, whose proof T-541 keeps on the
# conversation (`exit-proof.toml`). Where a window opens again on a conversation with no proof that the
# program before was gone, what that program queued may hold its turns for good: the reader stays in
# flight with nothing pending. A window that then waits at its prompt with a complete answer for a
# minute is told to the task's requester once (`crates/cf-engine/src/turn_end.rs`'s `looks_finished`,
# the window's `unproven` in `crates/cf-engine/src/windows.rs`, Claude's `Observed::at_prompt` in
# `crates/cf-harness/src/claude/adapter.rs`). The tests are
# `crates/cf-engine/tests/dispatcher/looks_finished.rs`, the adapter's `relaunched.rs`, and the reader's
# on T-526's records (`restart.rs`).

[[plant]]
name = "lost-queue: a window opened again with no proof is never marked so, and a turn that looks finished is told to nobody"
meant = "a_reopened_turn_that_looks_finished_and_never_reads_as_over_is_told_once_after_a_minute"
runs = ["lost-queue-looks"]

