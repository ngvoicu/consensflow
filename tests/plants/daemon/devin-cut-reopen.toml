# A Devin window opened again with no message on a session whose last turn a quit cut, which
# Devin 3000.12.43 leaves silent: no configuration, so no conversation named by one and no mode,
# until it is typed to, in either mode (T-1432, alpha-5 A5-23, from T-1417's run 3 and T-1432's
# runs A, 2 and 3: five windows, 20 to 65 s). Its log names its session on every line all the
# same. The rules:
#
# - a log that configured none and names one conversation alone, on every line that names one,
#   names it (`wire::Naming::unannounced`); two named, or none, name nothing;
# - the window is on that conversation where it is the one the window is known to be on, from
#   `UNANNOUNCED_MS` after the first look that found the log so (`DevinWindow::shows`, the one
#   place it is decided); before, it is held as a window that has said nothing;
# - such a window's delivery goes behind `/bypass`, and the channel takes a paste into a log
#   that configured none only where the adapter says so (`channel::Guard`);
# - the start hook gives its role text where the log names its session so, with no while;
# - a prompt the log lists new among the steps, after its first `steps` line, is a message the
#   turn took in: `/bypass <message>` is said back by no line;
# - the fallback is only for a window no key of the human's has reached since it opened (T-1474):
#   a window the pane host says was typed into is held as one that has said nothing until its log
#   configures, and the paste behind `/bypass` asks the host to go in only while none has
#   (`untyped` on `pane.write_paste`), which the host checks under its pane's lock as it pastes,
#   after every key its worker took before the paste. The daemon's own keys, the terminal's
#   replies and its reports on the human's path are no key.
#
# The cases are in `crates/cf-harness/src/devin/adapter/tests/unannounced.rs`, `channel/tests.rs`,
# `session_hook.rs` and `record/tests/unsaid.rs`; the host's in `crates/cf-panes/src/arbiter.rs`,
# `input_queue.rs` and `pane_handlers.rs`; the whole way, the rig's pane host and the stand-in on
# 3000.12's shape, in `crates/cf-e2e/tests/rig/live_member.rs`.

[run]
harness-lib-devin = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "devin::"]
# The pane host's input: its arbiter, its queue and the requests it reads.
panes-lib-untyped = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "--", "arbiter::", "input_queue::", "pane_handlers::"]
# The window the human typed into, on the rig's pane host (the case sets 3000.12's shape itself).
rig-live-member-typed-into = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "live_member::a_window_cut_in_its_first_turn_that_the_human"]

