# Nothing is told to the chief that it need not decide (RS-25, T-1491; Gabriel, 2026-11-11: "if
# you see issues with consensflow and interaction and many useless messages sent to the chief we
# act"). Each note typed into the chief's window is a turn: one model call on its whole
# conversation. A note of ConsensFlow's own that asks the chief no decision is shown, not typed:
# it is a row of the ledger landed `read` with its receipt `{"shown": <words>}` (the ledger's
# `queue::send`), its task's line says those words while the task holds (`aside`), and the
# chief's inbox lists it as `[not typed]`.
#
# The rules: shown are a hold said again and a held task's going on (`holds.rs`), a window closed leaving work
# (`background.rs`, `show_closed`), a paused window still open (`background.rs`), a task that
# goes on in a new conversation (`ownership.rs`), a task still at work in the background unless
# it cannot end by itself (`turn_end.rs`), a busy model's one note of a wait, shown again on
# each try (`scheduler.rs`, `show_again`), and a task taken back with nothing bound to its window
# (`giving.rs`). A hold is the exception: its first note to a chief is typed, once a task and
# hold, and the same hold said again is shown (`holds.rs`, `told_this_hold`, read from the
# ledger's notes: a withdrawn or shown note told nobody, and a note that the task went on ends
# the hold). A task held in the background an hour with no turn of its own is told once,
# typed (`STILL_WORKING_REMINDED_AFTER_MS`). A shown close still joins a typed failure of the
# same window (`outage.rs`, `queued_closes`). Every note typed is its own paste, as before
# RS-25. A hold is its window's: another window's first refusal is another hold (`hold_of`). A
# chief that takes over is told in its handoff each task it gave that holds (`chief.rs`,
# `held_tasks`), and a task paused with its member gone from the staff as that, never its hold
# (`member_gone`), as its line says (`views.rs`, `member_left`); a task taken from its member
# holds with nobody (`held_until`).
#
# Every name holds `chief-notes`, so `cargo xtask plants daemon chief-notes` runs them all.

[run]
chief-notes-ledger = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "shown_notes::", "waiting_notes::"]
chief-notes-engine-busy = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "busy_models::"]
chief-notes-engine-outage = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "outage_notes::"]
chief-notes-engine-shown = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "shown_notes::"]
chief-notes-engine-paused-left = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "paused_left::"]
chief-notes-engine-waiting = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "waiting_notes::"]
chief-notes-engine-holds = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "unavailable_accounts::", "moved_models::"]
chief-notes-daemon-inbox = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "api::routes::inbox::"]

