# The Mac's limit of a detached job, expected by the live finish case (T-1100; the chief's
# decision of 2026-11-03, m-7121). Pi's and Devin's tool shells lead sessions of their own, so a
# job they detach with `nohup … &` once the shell has ended has no session, parent or readable
# marker that ties it to the window (`crates/cf-panes/src/background/work.rs`, T-1145): the host
# never lists it, the close does not end it, and the chief is told nothing. T-1068's `live finish`
# was red on both for it. The product is not changed. The case now:
#
# - expects that of Pi and Devin on a Mac, and of no other harness or machine (`Expect::of`);
# - lets that one shape pass: every process of it has parent 1 and no terminal, it still ran after
#   the window closed, the chief was told nothing, and the task is done with its result;
# - ends what it can prove its own: an orphan that holds the command, began after the worker's
#   window and runs in the folder made for the run, with what descends from it, through the
#   descent and by which process it is (`orphans_in_folder`, `working_folder`);
# - fails an orphan it cannot prove its own, by number, and says what it did.
#
# The tests are `crates/cf-e2e` `live::members::descent::` (the orphan, the real folder), the
# step's `leaving::tests::` (the verdict, the choice) and the rig's stand-in that plays Pi on a
# Mac (`stand_in::a_stand_in_that_plays_pi…`). Every name holds `detached limit`, so
# `cargo xtask plants daemon "detached limit"` runs them all.

[run]
dl-descent = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::members::descent::"]
dl-leaving = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_finish", "leaving::tests::"]
dl-stand-in = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_finish", "stand_in::a_stand_in_that_plays_pi"]

