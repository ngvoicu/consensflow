# The long run's watch (`crates/cf-evals/src/long_run/`): the ten invariants a long run holds
# ConsensFlow to all along, nine of them made of the field's bugs of 2026-10-15 (A1 to A5, B1, B2,
# B5, and the end) and the tenth that each disruption has its effect, and what keeps their breaks
# (with what looks like a key or a token hidden, masked whole before it is cut, the run's own names
# shown), replays Claude Code's record as the product does, follows the windows' processes (taking
# who each is only at the look that saw it under its window, saying what is left behind and
# signalling nothing it did not start, by its number never), plays the disruptions and checks each
# effect, holds the project once more after the app has closed (its pane host read to its last
# word, or the close said a break; a ledger it cannot read failing the run), and says the verdict,
# UNRESOLVED where the watch could not judge something. The
# watch reads the ledger with SQLite and the harnesses' own records, and none of the product's
# code, so a plant here is a bug in the watch: one that would let a real run pass over the field's
# shape it was made to catch, or flag a run that was right. Each is caught by the cases of
# `crates/cf-evals/tests/long_run.rs` (ledgers and records made for each invariant, and the
# field's shapes as recorded ledgers: `tests/fixtures/ledgers/field-*.sql`), or by the unit tests
# of the module it is in.
#
# The last plants are of what the run stands on in `crates/cf-e2e`: the rig keeps each window's
# process, the windows the daemon closed itself (which tell a window that closed by itself, B2's
# shape, from the daemon's close), the time each exit was told and every exit once it has closed
# (a real rig: the `last_exits` case of `crates/cf-e2e/tests/rig.rs`), its stranger outlives a run of
# hours, the stand-in agent runs every `DISPATCH` line of a message (which the dry run's chief puts
# its work on the board with) and compacts at `/compact` as Claude Code does, and two stand-in
# Devins that make their store at the same moment each open it (the dry run's two Devin workers,
# given their tasks together).
#
# Every name holds `long run`, so `npm run plants:daemon -- "long run"` runs them all.

[run]
# The invariants against ledgers and records made for them, and the field's recordings.
evals-long-run = ["cargo", "test", "--offline", "-p", "cf-evals", "--test", "long_run"]
# The watch's own modules: the record, the schedule, the tracker, the report, the run's end.
evals-lib-long-run = ["cargo", "test", "--offline", "-p", "cf-evals", "--lib", "long_run"]
# The rig's routing of the frames between the daemon and the pane host.
e2e-lib-route = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "rig::route"]
# The stand-in agent's answer to a message.
fake-agent-reply = ["cargo", "test", "--offline", "-p", "cf-e2e", "--features", "test-support", "--bin", "fake-agent", "reply::"]
# The stand-in agent's compaction.
fake-agent-compact = ["cargo", "test", "--offline", "-p", "cf-e2e", "--features", "test-support", "--bin", "fake-agent", "a_compaction"]
# The stand-in Devin's store.
fake-devin-store = ["cargo", "test", "--offline", "-p", "cf-e2e", "--features", "test-support", "--bin", "fake-devin", "store::"]
# The rig's stranger, which runs beside every window: its own tests, and a real rig's close.
e2e-lib-stranger = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "rig::stranger"]
rig-stranger = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "stranger::"]
# The rig's last word, once it has closed: a real daemon and pane host.
e2e-rig-last-exits = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "last_exits"]
# The rig's last word when the host's output does not end in time: frames written by hand.
e2e-lib-last-word = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "a_last_word"]
# A program run to its end, which a process it left may hold the output of.
e2e-lib-process = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "process::"]
# A harness's version, as the run's setup asks it.
e2e-lib-machine = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::machine"]
# What the rig says of itself when it is dropped unclosed, through its owner's masker.
e2e-lib-report = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "rig::report"]
# A wait for the chief that gave up, and what it says of the chief's window.
evals-lib-run-chief = ["cargo", "test", "--offline", "-p", "cf-evals", "--lib", "run::chief"]

