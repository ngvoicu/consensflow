# A Muse window answered its brief, and its task failed with "the window never showed its
# first message" (T-1047; T-1000's live paste-screen, twice on Muse Code 1.4.14): each plant
# takes one rule of the fix out, and the case named in `meant` fails.
#
# - The Muse reader's own fix (it takes a user's words from `model_messages`) landed for
#   alpha.1 with its plant, `muse-reader.toml`. This is the class over every harness:
#   the engine never fails a launch's first message as never shown where the window's
#   record holds an item of the user's written since the window opened and an answer after
#   it: the message is taken for arrived unproven, whatever the harness kept of its words
#   (`crates/cf-engine/src/arrival.rs`, `answered_unproven`, its cases in
#   `tests/dispatcher/unstarted.rs`). Words never answered, or written before the window
#   opened, take nothing; whoever gave the task is told, and the window nothing (a note
#   pasted into it would begin a turn whose answer took the place of the brief's).
#
# Every name holds `muse never shown`: `npm run plants:daemon -- "muse never shown"` runs
# them all.

[run]
muse-never-shown-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "unstarted::"]

[[plant]]
name = "muse never shown: a launch whose window took words and answered them is failed as never shown"
meant = "a_window_that_took_words_and_answered_them_since_it_opened_took_its_first_message"
runs = ["muse-never-shown-engine"]

[[plant.edit]]
file = "crates/cf-engine/src/arrival.rs"
find = '''            if self.answered_unproven(record, observed, delivering.message)? {'''
replace = '''            if false && self.answered_unproven(record, observed, delivering.message)? {'''

[[plant]]
name = "muse never shown: words written before the window opened take its first message"
meant = "words_never_answered_or_older_than_the_window_take_no_first_message"
runs = ["muse-never-shown-engine"]

[[plant.edit]]
file = "crates/cf-engine/src/arrival.rs"
find = '''        let since_open = |item: &Item| item_ms(item).is_some_and(|at| at >= opened);'''
replace = '''        let since_open = |item: &Item| item_ms(item).is_some_and(|at| at >= opened || at < opened);'''

[[plant]]
name = "muse never shown: words never answered take the window's first message"
meant = "words_never_answered_or_older_than_the_window_take_no_first_message"
runs = ["muse-never-shown-engine"]

[[plant.edit]]
file = "crates/cf-engine/src/arrival.rs"
find = '''        if !items[given + 1..]
            .iter()
            .any(|item| item.role == Role::Assistant && !item.synthetic)
        {'''
replace = '''        if false
            && !items[given + 1..]
                .iter()
                .any(|item| item.role == Role::Assistant && !item.synthetic)
        {'''

[[plant]]
name = "muse never shown: the window taken for its first message is told to read it again"
meant = "a_window_that_took_words_and_answered_them_since_it_opened_took_its_first_message"
runs = ["muse-never-shown-engine"]

[[plant.edit]]
file = "crates/cf-engine/src/arrival.rs"
find = '''            .filter(|note| note.to != on_its_way.recipient)'''
replace = '''            .filter(|note| note.to != on_its_way.recipient || !note.body.is_empty())'''
