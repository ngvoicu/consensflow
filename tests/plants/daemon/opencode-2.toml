# An OpenCode that updated itself to 2 (the owner's report of 2026-10-15, ConsensFlow 3.0.4: their
# OpenCode went from 1.19.0 to 2.0.29, whose flags and server a window is launched on are gone, and
# every OpenCode window the daemon opened waited for ever for ConsensFlow's plugin). Three rules
# stand in 3.0.5, each held by tests:
#
# - the OpenCode adapter asks `--version` first (`crates/cf-harness/src/opencode/version.rs`), once
#   as the file is on disk, before the plugin, the role, a port or a server is made, and refuses an
#   OpenCode of 2 or more in words that say what to do; one that cannot be asked, or says no version,
#   is not refused on a guess (`tests/launch/opencode/versions.rs` and the unit tests of the module);
# - the Harnesses screen says an OpenCode of 2 or more is not supported yet (a `setup`), and offers no
#   update from it, nor to a release of 2 or more, which npm's `latest` is since 2.0 and a 1.x that is
#   put back would be offered (`crates/cf-harness/src/admin/`);
# - an OpenCode window is told not to update itself (`"autoupdate": false` in the
#   `OPENCODE_CONFIG_CONTENT` it runs with), unless the configuration the human set names a word of its
#   own (`crates/cf-harness/src/opencode/role.rs`).
#
# The recordings of Node's launch and admin that these moved, by hand and once, are held by the
# goldens' own tests, which a plant of each rule below makes fail (`tests/goldens/README.md` says
# what moved).
#
# The cases of the rig are `crates/cf-e2e/tests/regressions/opencode_updated_itself_to_2.rs`: the real
# daemon and pane host on a stand-in OpenCode that says `opencode v2.0.29` and answers nothing else,
# one with it as the chief and one with it as the worker. Their runs build the native `cf` from the
# sources as they are planted, so each of their plants says `builds`: the family builds the `cf` again
# once each is put back. One plant takes one rule out, or puts one wrong; a test fails.
#
# Every name holds `opencode 2`, so `npm run plants:daemon -- "opencode 2"` runs them all.

[run]
harness-opencode = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "opencode::"]
harness-admin = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "admin::"]
harness-launch-opencode-versions = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "opencode::versions::"]
harness-launch-goldens = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "every_scenario_plays_as_node_played_it"]
harness-admin-goldens = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "admin", "every_scenario_answers_as_node_answered_step_by_step"]
rig-regression-opencode-2 = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "opencode_updated_itself_to_2::"]
rig-install = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "rig::install::"]
fake-opencode-2 = ["cargo", "test", "--offline", "-p", "cf-e2e", "--bin", "fake-opencode-2"]

# The version, as 1.x and 2 say it.

[[plant]]
name = "opencode 2: the version is asked for between word boundaries, which the v of opencode v2.0.29 is not"
meant = "an_opencode_of_2_or_more_is_not_supported_yet_as_1_x_and_2_say_their_versions"
runs = ["harness-opencode", "harness-launch-opencode-versions"]

[[plant.edit]]
file = "crates/cf-harness/src/opencode/version.rs"
find = 'static VERSION: LazyLock<Regex> = LazyLock::new(|| compile(r"(?:^|\s|v)([0-9]+)\.[0-9]+\.[0-9]+"));'
replace = 'static VERSION: LazyLock<Regex> = LazyLock::new(|| compile(r"(?-u:\b)([0-9]+)\.[0-9]+\.[0-9]+"));'

