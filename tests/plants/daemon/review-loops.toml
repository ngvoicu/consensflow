# The review scenarios of the evals (`review-loop` and `review-blockers`, spec `smaller-contexts`, SCX-17,
# T-1010): what a chief is held to when a review finds a blocker, and the stand-in reviewer they run with.
#
# - The expectations of the two scenarios (`crates/cf-evals/src/scenarios/review_loop.rs`,
#   `review_blockers.rs`) are closures over the numbers the measure reads of a run. A scripted chief plays
#   each scenario on a ledger written by hand (`crates/cf-evals/tests/review_loops.rs`): one that behaves
#   holds every expectation, and each that loops, sends the work back for notes, accepts with a blocker
#   open or leaves the earlier findings out of the next review fails exactly the ones that name it. A
#   plant takes one rule out of an expectation, and the scripted chief that does what the rule forbids
#   (or does what it asks) turns red.
# - The measure's rounds (`crates/cf-evals/src/measure/rounds.rs`): a send-back is a finished or failed
#   task moved back to queued, a resume out of a pause is none, a result the chief decided on before it
#   was given does not stand, and the last acceptance is the one kept.
# - The stand-in reviewer: the eval's `claude` wrapper starts a window on the model `scripted-reviewer` as
#   the stand-in agent only if the run's marker is in the folder of its results and the agent is there; the
#   folder is made again for each play and goes with the run; the stand-in answers each task brief with the
#   next result (counted in the folder, each review being a fresh window) and the last again, and nothing
#   but a task brief; and it refuses a folder with no marker. The staff of such a run has the stand-in as
#   its one reviewer.
#
# Every name holds `review loops`, so `npm run plants:daemon -- "review loops"` runs them all. The words
# the check reads a reopen for (`change_of_work`) have no plant of their own: their cases are the unit
# tests of `review_rounds.rs`, which the scripted chiefs of the blockers also run through.


[run]
# The scripted chiefs of the two review scenarios, on ledgers written by hand.
review-loops-chiefs = ["cargo", "test", "--offline", "-p", "cf-evals", "--test", "review_loops"]
# The measure's rounds of the chief's tasks.
review-loops-measure = ["cargo", "test", "--offline", "-p", "cf-evals", "--test", "measure", "rounds::"]
# The eval's wrapper for a Claude Code window, and its branch for the stand-in reviewer.
review-loops-wrappers = ["cargo", "test", "--offline", "-p", "cf-evals", "--lib", "run::wrappers::"]
# The stand-in reviewer's folder of results.
review-loops-stand-in = ["cargo", "test", "--offline", "-p", "cf-evals", "--lib", "run::stand_in::"]
# The staff of a run with a stand-in reviewer.
review-loops-plan = ["cargo", "test", "--offline", "-p", "cf-evals", "--test", "plan"]
# What a run of the review scenarios is asked for.
review-loops-options = ["cargo", "test", "--offline", "-p", "cf-evals", "--lib", "run::options::"]
# The stand-in agent's scripted-results mode.
review-loops-fake-agent = ["cargo", "test", "--offline", "-p", "cf-e2e", "--features", "test-support", "--bin", "fake-agent", "scripted::"]

