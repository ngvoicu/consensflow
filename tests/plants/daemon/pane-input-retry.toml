# Page identities fence late calls, and a call whose fate is unknown is skipped:
# the pane's count moves past it, so a late original writes nothing and no key
# is ever typed twice.
[run]
pane-input-reconcile = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_skipped_call_is_never_written_when_its_original_comes_late"]
pane-input-late = ["cargo", "test", "--offline", "-p", "cf-panes", "--test", "page_input", "a_late_original_after_its_skip_writes_nothing_and_the_reply_arrives"]
pane-input-skipped-paste = ["cargo", "test", "--offline", "-p", "cf-panes", "--test", "page_input", "a_paste_whose_last_chunk_is_skipped_is_closed_and_holds_nothing"]
pane-input-capacity = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::unanswered_page_input_is_bounded_until_a_new_page"]
pane-input-paste = ["cargo", "test", "--offline", "-p", "cf-panes", "--test", "page_input", "a_reply_cannot_cross_an_active_paste_on_the_real_pty"]
pane-input-interrupted = ["cargo", "test", "--offline", "-p", "cf-panes", "--test", "page_input", "an_interrupted_bracketed_paste_closes_before_fresh_page_typing"]
pane-input-drained = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::an_interrupted_paste_closes_after_its_already_admitted_chunks"]
pane-input-finished = ["cargo", "test", "--offline", "-p", "cf-panes", "--test", "page_input", "a_completed_paste_is_not_closed_again_after_page_replacement"]
pane-input-completion = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_lost_completion_answer_can_be_waited_for_again"]

[[plant]]
name = "pane input retry: let a departed page admit input"
meant = "a_skipped_call_is_never_written_when_its_original_comes_late"
runs = ["pane-input-reconcile"]

[[plant.edit]]
file = "crates/cf-panes/src/input_queue.rs"
find = '''        if page.current.as_deref() != Some(page_id) {
            return Err(INPUT_STALE_PAGE.to_string());
        }
        // The count only goes up.'''
replace = '''        if false {
            return Err(INPUT_STALE_PAGE.to_string());
        }
        // The count only goes up.'''

[[plant]]
name = "pane input retry: a skip leaves the count where it was"
meant = "input_queue::tests::a_skipped_call_is_never_written_when_its_original_comes_late"
runs = ["pane-input-reconcile", "pane-input-late"]

[[plant.edit]]
file = "crates/cf-panes/src/input_queue.rs"
find = '*passed = (*passed).max(sequence);'
replace = 'let _ = (passed, sequence);'

[[plant]]
name = "pane input retry: admit a number the count has passed"
meant = "a_late_original_after_its_skip_writes_nothing_and_the_reply_arrives"
runs = ["pane-input-late", "pane-input-reconcile"]

[[plant.edit]]
file = "crates/cf-panes/src/input_queue.rs"
find = '        if sequence <= passed {'
replace = '        if false && sequence <= passed {'

[[plant]]
name = "pane input retry: a skipped last chunk leaves its paste open"
meant = "a_paste_whose_last_chunk_is_skipped_is_closed_and_holds_nothing"
runs = ["pane-input-skipped-paste"]

[[plant.edit]]
file = "crates/cf-panes/src/input_queue.rs"
find = '''                    if state.bracketed.remove(&id) {
                        state.needs_close = true;
                    }'''
replace = '''                    if state.bracketed.remove(&id) {
                        state.needs_close = false;
                    }'''

[[plant]]
name = "pane input retry: forget to advance the admitted count"
meant = "a_skipped_call_is_never_written_when_its_original_comes_late"
runs = ["pane-input-reconcile"]

[[plant.edit]]
file = "crates/cf-panes/src/input_queue.rs"
find = 'page.last_sequences.insert(key.clone(), sequence);'
replace = 'let _ = sequence;'

[[plant]]
name = "pane input retry: count a refused admission"
meant = "unanswered_page_input_is_bounded_until_a_new_page"
runs = ["pane-input-capacity"]

[[plant.edit]]
file = "crates/cf-panes/src/input_queue.rs"
find = '''        if page.completions.len() >= MAX_PENDING_INPUT_TICKETS {
            return Err("pane-input-ticket-capacity".to_string());'''
replace = '''        if page.completions.len() >= MAX_PENDING_INPUT_TICKETS {
            page.last_sequences.insert(key.clone(), sequence);
            return Err("pane-input-ticket-capacity".to_string());'''

[[plant]]
name = "pane input retry: allow a reply inside a paste"
meant = "a_reply_cannot_cross_an_active_paste_on_the_real_pty"
runs = ["pane-input-paste"]

[[plant.edit]]
file = "crates/cf-panes/src/input_queue.rs"
find = 'state.active = Some(id);'
replace = 'state.active = None;'

[[plant]]
name = "pane input retry: leave a replaced page's paste open"
meant = "an_interrupted_bracketed_paste_closes_before_fresh_page_typing"
runs = ["pane-input-interrupted"]

[[plant.edit]]
file = "crates/cf-panes/src/input_queue.rs"
find = '''                if state.bracketed.remove(&id) {
                    state.needs_close = true;
                }'''
replace = '''                if state.bracketed.remove(&id) {
                    state.needs_close = false;
                }'''

[[plant]]
name = "pane input retry: leave an abandoned queued paste open"
meant = "an_interrupted_paste_closes_after_its_already_admitted_chunks"
runs = ["pane-input-drained"]

[[plant.edit]]
file = "crates/cf-panes/src/input_queue.rs"
find = '''                if abandoned_and_drained && !group.group.end && result.is_ok() && bracketed {
                    state.needs_close = true;
                }'''
replace = '''                if abandoned_and_drained && !group.group.end && result.is_ok() && bracketed {
                    state.needs_close = false;
                }'''

[[plant]]
name = "pane input retry: close a completed paste twice"
meant = "a_completed_paste_is_not_closed_again_after_page_replacement"
runs = ["pane-input-finished"]

[[plant.edit]]
file = "crates/cf-panes/src/input_queue.rs"
find = 'if abandoned_and_drained && !group.group.end && result.is_ok() && bracketed {'
replace = 'if bracketed {'

[[plant]]
name = "pane input retry: lose the completion after the first wait"
meant = "a_lost_completion_answer_can_be_waited_for_again"
runs = ["pane-input-completion"]

[[plant.edit]]
file = "crates/cf-panes/src/input_queue.rs"
find = '''            .get(ticket)
            .cloned()'''
replace = '''            .remove(ticket)'''

[[plant.edit]]
file = "crates/cf-panes/src/input_queue.rs"
find = '''    pub fn page_completion(
        &self,
        page_id: &str,
        ticket: &str,
    ) -> Result<PageInputCompletion, String> {
        let page = self'''
replace = '''    pub fn page_completion(
        &self,
        page_id: &str,
        ticket: &str,
    ) -> Result<PageInputCompletion, String> {
        let mut page = self'''
