# Page identities fence late calls, and a call whose fate is unknown is skipped:
# the number is passed, so a late original writes nothing and no key is ever
# typed twice. A paste is one call, whole or not at all, up to a cap. The host
# writes a window's calls in the order of their numbers (see pane-input-order).
[run]
pane-input-reconcile = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_skipped_call_is_never_written_when_its_original_comes_late"]
pane-input-late = ["cargo", "test", "--offline", "-p", "cf-panes", "--test", "page_input", "a_late_original_after_its_skip_writes_nothing_and_the_reply_arrives"]
pane-input-lost-paste = ["cargo", "test", "--offline", "-p", "cf-panes", "--test", "page_input", "a_lost_paste_writes_none_of_itself_even_when_it_comes_late"]
pane-input-capacity = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::unanswered_page_input_is_bounded_until_a_new_page"]
pane-input-final = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_refused_admission_is_final_for_its_number"]
pane-input-cap = ["cargo", "test", "--offline", "-p", "cf-panes", "--test", "page_input", "a_paste_over_the_cap_is_refused_whole_and_spends_its_number"]
pane-input-fence = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::navigation_fences_a_page_before_the_next_subscription"]
pane-input-whole = ["cargo", "test", "--offline", "-p", "cf-panes", "--test", "page_input", "a_reply_that_comes_during_a_paste_goes_after_all_of_it"]
pane-input-length = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "validation::tests::a_page_calls_bytes_are_the_length_it_stated_or_refused"]
pane-input-cut = ["cargo", "test", "--offline", "-p", "app", "commands::tests::production_ipc_refusal_is_final_for_its_sequence"]
pane-input-completion = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_lost_completion_answer_can_be_waited_for_again"]
failed-pane-answer = ["cargo", "test", "--offline", "-p", "app", "commands::tests::a_pty_write_failure_and_later_keys_report_the_failed_pane"]
failed-pane-notice = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "--workers=4", "-g", "a failed pane input|a late pane refusal|another pane cannot replace failed pane"]

[[plant]]
name = "pane input retry: let a departed page admit input"
meant = "navigation_fences_a_page_before_the_next_subscription"
runs = ["pane-input-fence"]

[[plant.edit]]
file = "crates/cf-panes/src/input_queue.rs"
find = '''        self.current.as_deref() == Some(page_id)
            || self
                .left_at
                .get(page_id)
                .is_some_and(|left| now < *left + ORDER_BOUND)'''
replace = '''        true'''

[[plant]]
name = "pane input retry: a skip leaves its number open"
meant = "a_skipped_call_is_never_written_when_its_original_comes_late"
runs = ["pane-input-reconcile", "pane-input-late", "pane-input-lost-paste"]

[[plant.edit]]
file = "crates/cf-panes/src/input_queue.rs"
find = '''            if sequence > lane.passed
                && !lane.slots.contains_key(&sequence)'''
replace = '''            if false
                && sequence > lane.passed
                && !lane.slots.contains_key(&sequence)'''

[[plant]]
name = "pane input retry: admit a number the count has passed"
meant = "a_late_original_after_its_skip_writes_nothing_and_the_reply_arrives"
runs = ["pane-input-late", "pane-input-reconcile", "pane-input-lost-paste"]

[[plant.edit]]
file = "crates/cf-panes/src/input_queue.rs"
find = '        if sequence <= lane.passed || lane.slots.contains_key(&sequence) {'
replace = '        if false && (sequence <= lane.passed || lane.slots.contains_key(&sequence)) {'

[[plant]]
name = "pane input retry: a lost paste written when it comes late"
meant = "a_lost_paste_writes_none_of_itself_even_when_it_comes_late"
runs = ["pane-input-lost-paste"]

[[plant.edit]]
file = "crates/cf-panes/src/input_queue.rs"
find = '        if sequence <= lane.passed || lane.slots.contains_key(&sequence) {'
replace = '        if (sequence <= lane.passed && sequence != 1) || lane.slots.contains_key(&sequence) {'

[[plant]]
name = "pane input retry: forget to pass a handed-over number"
meant = "a_skipped_call_is_never_written_when_its_original_comes_late"
runs = ["pane-input-reconcile"]

[[plant.edit]]
file = "crates/cf-panes/src/input_queue.rs"
find = '''                lane.passed = first;
                if let Slot::Parked { job, sender, .. } = slot {'''
replace = '''                let _ = first;
                if let Slot::Parked { job, sender, .. } = slot {'''

[[plant]]
name = "pane input retry: a refused admission leaves its number open"
meant = "unanswered_page_input_is_bounded_until_a_new_page"
runs = ["pane-input-capacity", "pane-input-final"]

[[plant.edit]]
file = "crates/cf-panes/src/input_queue.rs"
find = '''            let lane = page.lane(&key, page_id);
            if lane.slots.len() < MAX_LANE_SLOTS {
                lane.slots.insert(
                    sequence,
                    Slot::Void {
                        deadline: now + ORDER_BOUND,
                    },
                );
            }'''
replace = '''            let _ = page.lane(&key, page_id);'''

[[plant]]
name = "pane input retry: a paste over the cap goes in"
meant = "a_paste_over_the_cap_is_refused_whole_and_spends_its_number"
runs = ["pane-input-cap"]

[[plant.edit]]
file = "crates/cf-panes/src/validation.rs"
find = '    if bytes.len() > MAX_PAGE_INPUT_BYTES {'
replace = '    if false && bytes.len() > MAX_PAGE_INPUT_BYTES {'

[[plant]]
name = "pane input retry: a paste written in two parts"
meant = "a_reply_that_comes_during_a_paste_goes_after_all_of_it"
runs = ["pane-input-whole"]

[[plant.edit]]
file = "crates/cf-panes/src/input_queue.rs"
find = '''            InputWork::Typed(bytes) => arbiter.write_typed(&panes, &key, bytes),'''
replace = '''            InputWork::Typed(bytes) => {
                let cut = bytes.len().min(32 * 1024);
                arbiter
                    .write_typed(&panes, &key, &bytes[..cut])
                    .and_then(|()| {
                        thread::sleep(std::time::Duration::from_millis(50));
                        arbiter.write(&panes, &key, &bytes[cut..])
                    })
            }'''

[[plant]]
name = "pane input retry: take text of another size than the length stated"
meant = "a_page_calls_bytes_are_the_length_it_stated_or_refused"
runs = ["pane-input-length", "pane-input-cut"]

[[plant.edit]]
file = "crates/cf-panes/src/validation.rs"
find = '    if text.len() as u64 != length.div_ceil(3) * 4 {'
replace = '    if false && text.len() as u64 != length.div_ceil(3) * 4 {'

[[plant]]
name = "pane input retry: take decoded bytes of another length than stated"
meant = "a_page_calls_bytes_are_the_length_it_stated_or_refused"
runs = ["pane-input-length", "pane-input-cut"]

[[plant.edit]]
file = "crates/cf-panes/src/validation.rs"
find = '    if bytes.len() as u64 != length {'
replace = '    if false && bytes.len() as u64 != length {'

[[plant]]
name = "pane input retry: read a length over the cap"
meant = "a_page_calls_bytes_are_the_length_it_stated_or_refused"
runs = ["pane-input-length"]

[[plant.edit]]
file = "crates/cf-panes/src/validation.rs"
find = '    if length > MAX_PAGE_INPUT_BYTES as u64 {'
replace = '    if false && length > MAX_PAGE_INPUT_BYTES as u64 {'

[[plant]]
name = "pane input retry: lose the completion after the first wait"
meant = "a_lost_completion_answer_can_be_waited_for_again"
runs = ["pane-input-completion"]

[[plant.edit]]
file = "crates/cf-panes/src/input_queue.rs"
find = '''        let page = self.state()?;
        if page.current.as_deref() != Some(page_id) {
            return Err(INPUT_STALE_PAGE.to_string());
        }
        page.completions
            .get(ticket)
            .cloned()'''
replace = '''        let mut page = self.state()?;
        if page.current.as_deref() != Some(page_id) {
            return Err(INPUT_STALE_PAGE.to_string());
        }
        page.completions
            .remove(ticket)'''

[[plant]]
name = "failed pane notice: a failed write does not say the pane is failed"
meant = "a_pty_write_failure_and_later_keys_report_the_failed_pane"
