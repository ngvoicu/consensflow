platforms = ["macos"]

[[plant.edit]]
file = "crates/cf-panes/src/input_queue.rs"
find = '''            Self::FailedWrite(_)
                | Self::Refused {
                    code: INPUT_FAILED,
                    ..
                }'''
replace = '''            Self::Refused {
                code: INPUT_FAILED,
                ..
            }'''

[[plant]]
name = "failed pane notice: a later refusal does not say the pane is failed"
meant = "a_pty_write_failure_and_later_keys_report_the_failed_pane"
runs = ["failed-pane-answer"]
