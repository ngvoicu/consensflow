prepare = [["node", "app/scripts/bundle-ui.mjs"]]

[[plant.edit]]
file = "app/ui/terminal-link.js"
find = '''    this.#report(this.#failedInputs.size > 0 ? new Error(RESTART_INPUT_ADVICE) : cause)'''
replace = '''    this.#report(failed ? new Error(RESTART_INPUT_ADVICE) : cause)'''

[[plant]]
name = "failed pane notice: a retired generation keeps its restart advice"
