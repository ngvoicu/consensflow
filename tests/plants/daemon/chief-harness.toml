# The harnesses' model listings (CHF-03, chief-harness spec, T-727): each harness lists its
# models with no model turn (`Adapter::models`, crates/cf-harness/src/{claude,codex,pi,devin}/models.rs
# over shared/one_shot.rs), one `ModelListing` type (crates/cf-proto/src/models.rs) whose default is
# never a contributor model, a disabled one or one of a stale listing, kept in the home ledger
# (migration 0025, crates/cf-ledger/src/model_lists.rs), and read by the daemon at the first ask of
# its life and at the human's Refresh, one harness at a time (crates/cf-daemon/src/models.rs).
# Phases 1 to 3 of the spec add their own plants here.
#
# Every name holds `listing:`, so `npm run plants:daemon -- "listing:"` runs them all.

[run]
ch-proto = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "models::"]
ch-harness = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "models::"]
ch-one-shot = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::one_shot::"]
ch-ledger = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "model_lists"]
ch-ledger-testing = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "testing::model_list"]
ch-daemon = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "models::"]

[[plant]]
name = 'listing: a stale listing gives a default'
meant = "a_stale_list_gives_no_default_whatever_it_marks"
runs = ["ch-proto"]

[[plant.edit]]
file = "crates/cf-proto/src/models.rs"
find = '        if self.is_stale() {'
replace = '        if self.is_stale() && false {'

[[plant]]
name = 'listing: a contributor model may be the default'
meant = "the_marked_model_is_the_default_unless_it_is_a_contributor_model_then_its_twin"
