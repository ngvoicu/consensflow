# The harnesses' model listings (CHF-03, chief-harness spec, T-727): each harness lists its
# models with no model turn (`Adapter::models`, crates/cf-harness/src/{claude,codex,pi,devin,muse}/models.rs
# over shared/one_shot.rs), one `ModelListing` type (crates/cf-proto/src/models.rs) whose default is
# never a contributor model, a disabled one or one of a stale listing, kept in the home ledger
# (migration 0027, crates/cf-ledger/src/model_lists.rs), and read by the daemon at each ask (A4-28),
# one harness at a time (crates/cf-daemon/src/models.rs).
# Phase 1's plants follow T-727's, their names holding `chief:`; phases 2 and 3 add their own.
#
# CHF-03's names hold `listing:` and Phase 1's (CHF-04 to CHF-10, with Muse's rows and the
# fixes of Calliope's T-955) hold `chief:`: `npm run plants:daemon -- "listing:"` runs the
# first, `-- "chief:"` the second.
#
# Phase 2's (CHF-11 to CHF-13, T-730) hold `timeline:`: the history is one stream of items
# across a participant's conversations with no heading (crates/cf-ledger/src/conversations/history.rs,
# crates/cf-engine/src/handoff/viewer.rs, app/ui/core/history-viewer.js), a conversation that shows
# no item is passed, charged, and gone on past, and migration 0029 drops the indexes the headings
# read. The heading plants of session-viewer.toml went with the headings.
#
# Phase 3's (CHF-14 to CHF-19, T-728) hold `items:`: each reader says what the history draws
# of an item besides its words (crates/cf-harness/src/shared/record/drawn.rs and each
# harness's reader), the items only the history shows stand beside a reading's items and
# never among them or in its recording, the ledger keeps both (migration 0032,
# crates/cf-ledger/src/conversations/transcripts.rs and history.rs) and its readers of words
# leave the history's own out, the engine copies the timeline (crates/cf-engine/src/transcripts.rs)
# and the page and `cf task get --transcript` show a call's header (T-486).
#
# Phase 4's (CHF-20, CHF-21, T-731) hold `view:`: the history viewer drawn to the mock
# (app/ui/core/history-viewer.js, app/ui/page.css, app/ui/index.html): each item by its kind,
# or its role where an older build copied it; prompts and deliveries whole in blue blocks; a
# call's header, its output folded to its last lines with an exit line kept in sight, its
# change as rows, the time it took, and its colour; a compaction violet; the earlier history
# from a quiet first row above what is in view; dark and light; and the ledger's search
# finding a call's header.
#
# T-995's (Calliope's re-check T-994) hold `gone:`: the adapter hears a refusal of the model
# asked for (Pi by the id after its provider), a held chief costs a pass nothing, a default
# that is the gone model holds the chief, and the exit's screen is read without
# ConsensFlow's pastes, at its launch alone, never for the human's Ctrl+C.

