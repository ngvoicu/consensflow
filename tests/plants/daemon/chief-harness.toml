# The harnesses' model listings (CHF-03, chief-harness spec, T-727): each harness lists its
# models with no model turn (`Adapter::models`, crates/cf-harness/src/{claude,codex,pi,devin,muse}/models.rs
# over shared/one_shot.rs), one `ModelListing` type (crates/cf-proto/src/models.rs) whose default is
# never a contributor model, a disabled one or one of a stale listing, kept in the home ledger
# (migration 0025, crates/cf-ledger/src/model_lists.rs), and read by the daemon at the first ask of
# its life and at the human's Refresh, one harness at a time (crates/cf-daemon/src/models.rs).
# Phase 1's plants follow T-727's, their names holding `chief:`; phases 2 and 3 add their own.
#
# CHF-03's names hold `listing:` and Phase 1's (CHF-04 to CHF-10, with Muse's rows and the
# fixes of Calliope's T-955) hold `chief:`: `npm run plants:daemon -- "listing:"` runs the
# first, `-- "chief:"` the second.

[run]
ch-proto = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "models::"]
ch-harness = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "models::"]
ch-one-shot = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::one_shot::"]
ch-ledger = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "model_lists"]
ch-ledger-testing = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "testing::model_list"]
ch-daemon = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "models::"]
chm-ledger = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "chief_model"]
chm-ledger-testing = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "testing::chief_model"]
chm-last-used = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "last_used::"]
chm-tail = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::tail::"]
chm-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "chief_model::"]
chm-dispatcher = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "chief_models::"]
chm-switching = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "switching_refused::"]
chm-role = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "role_change::"]
chm-text = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text", "handoff::"]
chm-daemon = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::opening::"]
chm-daemon-reading = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::reading::"]
chm-page-pick = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "the chief is picked as a harness"]
chm-page-unread = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "models cannot be read"]
chm-page-card = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "card in the dock what the chief is doing|card the model its window ran on"]
chm-ledger-chief = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "chief_model"]
chm-pi-models = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "pi::models::"]
chm-claude-used = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::last_used::"]
chm-muse-used = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "muse::last_used::"]
chm-muse-models = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "muse::models::"]
chm-muse-record = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "muse::record::tests::a_turn_on_a_model"]
chm-page-muse = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "the chief is picked as a harness"]
chm-rig = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "chief_model::"]

