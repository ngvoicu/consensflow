# The tester, the fifth role of the staff (worker, advisor, reviewer, tester, image
# designer): a member holds it, a task is for it (`cf task add --test`), a window opens
# with its text, and its results come back to the chief like any result. One plant
# takes one piece of that out; a test of it fails: the ledger's (the roles and pools it
# knows, migration 0012 that lets its two tables hold them, and what the recordings of
# Node's ledger are held apart by), the engine's (the role it has a text for, and the
# texts), the daemon's route, the page's Project settings, and the rig's case that carries a
# test from the chief to a tester's window and its result back. A run written `{ node:
# [...] }` is `node --test`.
#
# The `tester rig:` plants run only the case of the rig (`crates/cf-e2e/tests/rig/
# core_tiered.rs`) that holds the rule; it builds the `cf` and the pane host it runs from
# the sources as planted, in release, and says `builds`: the family builds the native `cf`
# again once each is put back. Every name holds `tester`, so `npm run plants:daemon --
# tester` runs them all, and `tester rig` the end to end one, `tester page` the page's.

[run]
# The ledger's words for roles and pools, and what it checks them with.
ledger-lib-model = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "model::"]
# The ledger's tests of a tester: its pool read from JSON and refused by name among them.
ledger-tester = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "tester"]
# What holds the recordings of Node's ledger apart from the schema this one has beyond.
ledger-lib-testing = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "testing::"]
# The texts of the roles, and what the chief reads of them: not the golden of Node's chief text, which
# the whole of the `text` test holds with them.
engine-text-roles = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text", "roles::", "--", "--skip", "goldens_roles"]
# The page's Project settings and board: what it offers a human who adds a member, and what it shows of a
# tester's tasks (the cases of `app/tests/core-page.spec.mjs` that say tester, in the browser Playwright
# keeps; each plant's `prepare` bundles the page's xterm first, as `npm run test:ui` does).
page-tester = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "tester"]
# The case of the rig that gives a tester a test: the daemon and the pane host in real terminals.
rig-tester = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "core_tiered::a_test_is_a_task"]

