# A tier nobody on the staff holds goes to the nearest one somebody does, the next one up first,
# for every role that has tiers, as `cf task add` does and now at every moment the task is open
# (T-1108, a field report: `cf task add --test --tier complex` with a standard tester on the
# staff; the staff had changed under the task, and it waited "for a free complex tester: ." with
# no reason, for good). A waiting task says why; a role nobody holds is refused at add; the
# requester is told once whose tier took the task; and `cf task edit T-3 --tier … --needs …
# --before …` changes a task no window has yet, with the brief or without it, all or none.
# The tests are the engine's (`crates/cf-engine/tests/dispatcher/tier_fallback.rs`), the ledger's
# (`crates/cf-ledger/tests/edit_tier.rs`, `edit_links.rs`), the route's
# (`crates/cf-daemon/src/api/routes/task/tests/verbs.rs`, `tasks/tests.rs`), `cf`'s
# (`crates/cf/src/board/task.rs`, `crates/cf/tests/help.rs`) and the role text's
# (`crates/cf-engine/tests/text/roles.rs`). Every name holds `tier fallback`, so
# `cargo xtask plants daemon "tier fallback"` runs them all.

[run]
tf-engine-dispatcher = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "tier_fallback::"]
tf-engine-text = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text"]
tf-ledger-edit-tier = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "edit_tier"]
tf-ledger-edit-links = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "edit_links"]
tf-cf-help = ["cargo", "test", "--offline", "-p", "cf", "--test", "help"]

