# Two flakes seen once each in T-358's merge of turn-end with main (2026-10-23), T-373.
#
# The daemon's refused second start: `core_daemon::touches_no_window_of_the_running_daemon_when_a_second_start_is_refused_its_ledger`
# failed in a gate run under heavy parallel load, the second daemon having ended with 1 and
# its log's `exit 1` and no sentence. The sentence is on its error output, written before
# the exit; the rig's `Spawned::wait` returned the moment the program was gone, and the
# thread that keeps the error output had not run yet. A 400 ms stall of that thread (the
# plant by hand) failed this test and `ends_cf_ui_with_1_when_a_second_start_is_refused…`
# alike. An end seen by `wait` now waits for the thread to read to the end of the pipe,
# for `HELD` at most (`crates/cf-e2e/src/process/spawned.rs`, `process.rs`). The tests are
# the rig's own, `crates/cf-e2e/src/process/tests.rs`.
#
# Folder trust's late-keys case, `a_worker_that_reads_the_humans_keys_late…`, timed out after
# 30 s on zeewin once in the same merge, and did not on main in 73 runs of it, 12 at a time,
# nor in a whole crate's run. On T-358's tree (turn-end, whose workers' windows close once
# their task is done) 8 of 48 copies did, each with the human's yes taken in one window, its
# task done and its window closed, and the other window asking still, no key of ConsensFlow's
# in it. The human's yes was banked for the project's other windows only by a look at the
# screen that saw the window's prompt, a look every half second, and that window was gone
# before the next. The exit's own screen is read now (`trust::yes_at_exit`, `dispatcher::exited`);
# the stand-in's `CF_TEST_TRUST_LEAVES_MS` ends a window as it is past the question.

[run]
process-lib = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "process::tests::shell"]
process-lib-settle = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "process::tests::a_spawned_program_that_has_ended_has_said_all_it_said_on_its_error_output_wherever_it_runs"]
reports-not-judged-drop = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "reports::a_rig_its_case_ends_as_a_drop_on_purpose_leaves_no_report"]
trust-resume = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "resume::a_window_that_asks_and_ends_by_itself"]
trust-tooling = ["cargo", "test", "--offline", "-p", "cf-harness", "--features", "test-support", "--lib", "tooling::tests::the_key_toward"]
trust-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "trust::"]
trust-rig-gone = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_trust_question_after_git_init_stopped_every_launch::a_worker_the_human_said_yes_in_that_is_gone"]
trust-rig-no = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_trust_question_after_git_init_stopped_every_launch::a_humans_no"]

[[plant]]
name = "merge flakes: an end seen by wait does not wait for the program's error output to be all kept"
meant = "a_spawned_program_that_has_ended_has_said_all_it_said_on_its_error_output"
runs = ["process-lib"]

[[plant.edit]]
file = "crates/cf-e2e/src/process/spawned.rs"
