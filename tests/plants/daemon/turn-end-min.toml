# Turn-end's smallest rule (the chief's decision of 2026-10-21, on the advisor's answer of T-8;
# dip-agentos's T-20, poker-lab's T-442 and its Monitor): what is uncertain never completes a task,
# reuses a window or ends a process.
#
# - Claude's reader counts the jobs a turn left that Claude Code wakes its agent for: a command run
#   in the background (`backgroundTaskId`) and a monitor (`taskId`, `timeoutMs`), until Claude
#   Code's own word that each is over: a delivered notification whose head says so by its status,
#   a TaskStop result that names it, or a monitor's own notice of its expiry at its time; a relaunch
#   ConsensFlow proved retires the old process's jobs, not ended
#   (`crates/cf-harness/src/claude/record/jobs.rs`, `project.rs`, `replay.rs`, `record.rs`).
# - A worker's turn that ends with jobs or agents pending keeps its task working, its requester told
#   once; the result is the final answer after the task's latest message, found by its receipt
#   (`crates/cf-engine/src/turn_end.rs`, `role_change.rs`).
# - Finish takes the last complete answer of any working task, once, ending nothing
#   (`turn_end/finish.rs`; the API, the page and `cf task finish`).
# - No other task's message goes into a window a task's message went into, whatever released that
#   task; the window closes first, and a pinned window, a refused close or a task still in hand keeps
#   the message waiting; a window before that was not proved gone has the other task go on in a new
#   conversation (`crates/cf-engine/src/ownership.rs`, `windows.rs`, `deliveries.rs`,
#   `role_change/prelude.rs`, `dispatcher.rs`).
#
# The rig's cases build the native `cf` from the sources as planted, so their plants say `builds`.
# Every name holds `turn-end-min`, so `npm run plants:daemon -- "turn-end-min"` runs them all.

[run]
tem-reader = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record"]
tem-reading = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::record::reading"]
tem-launch-claude = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "claude::"]
tem-engine-lib = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "turn_end"]
tem-engine-role-change-lib = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "role_change"]
tem-engine-turn-end = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "turn_end::"]
tem-engine-final = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "final_answer::"]
tem-engine-pending = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "pending_agents::"]
tem-engine-background = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "background::"]
tem-engine-sessions = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "sessions::"]
tem-engine-deleted = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "deleted_sessions::"]
tem-engine-the-dispatcher = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "the_dispatcher::"]
tem-daemon-routes-task = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "routes::task"]
tem-daemon-routes = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "api::routes::tests"]
tem-daemon-page-held = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::held"]
tem-cf-board-task = ["cargo", "test", "--offline", "-p", "cf", "--lib", "board::task"]
tem-page-finish = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "Finish|background"]
tem-rig-monitor = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_worker_that_waited_on_its_run_with_monitor_lost_it::"]
tem-rig-still-going = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_workers_still_going_was_given_as_its_result::"]
tem-rig-progress = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "results_that_began_with_the_workers_progress::"]
tem-rig-reopen = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_task_stuck_working_after_its_window_was_resumed::a_claude_workers_answer_to_a_reopen_is_its_result_though_its_window_closed_with_its_job_and_monitor_running"]
