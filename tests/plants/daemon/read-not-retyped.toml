# A question the chief had read and answered was typed into its window later, as if new (this
# board, 2026-10-22, ConsensFlow 3.0.5; m-2927, m-2931, m-3103; T-260): it waited behind the
# chief's turn, the chief read it with `cf inbox read` and answered it with `cf answer`, and when
# the turn ended it was pasted with "Run in your shell: cf answer m-…". The rules, as the chief
# decided:
# - what `cf inbox read` printed whole while it was still queued is received, whatever its kind
#   (`Read::receives`, `crates/cf-ledger/src/messages/receipt.rs`): a question, a result, a note
#   or an answer is `read` and never pasted after; a task's words and a note that says a role are
#   not. `cf` says so of any queued message it printed (`crates/cf/src/board/lines.rs`,
#   `waiting_message`), and the board leaves the choice to the ledger and wakes the dispatcher only
#   when something was received (`crates/cf-daemon/src/api/routes/answers.rs`);
# - a question answered is never pasted: still queued when answered, or queued again by a paste
#   retried after it was answered, it is `read` with a receipt naming the answer
#   (`settle_answered`, `crates/cf-ledger/src/messages.rs`, called from `answer()` and from
#   `retry_delivery`, `crates/cf-ledger/src/messages/delivery.rs`); one the asker's own window
#   answered first is withdrawn, as one held at the gate is.
#
# The cases are the ledger's (`crates/cf-ledger/tests/receipt/read_in_the_inbox.rs`), the
# engine's (`crates/cf-engine/tests/dispatcher/read_in_the_inbox.rs`), the board's
# (`crates/cf-daemon/src/api/routes/answers/tests.rs`), `cf`'s (`crates/cf/src/board/tests.rs`)
# and the rig's, in the field's shape
# (`crates/cf-e2e/tests/regressions/a_question_the_chief_answered_was_typed_in_later.rs`). The
# rig's build the native `cf` and daemon from the sources as planted, so their plants say
# `builds`. Every name holds `read not retyped`, so `npm run plants:daemon -- "read not retyped"`
# runs them all.

[run]
retyped-rig-question = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_question_the_chief_answered_was_typed_in_later::a_question_the_chief_read"]
retyped-rig-result = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_question_the_chief_answered_was_typed_in_later::a_result_the_chief_read"]

# --- rule 1: what `cf inbox read` printed whole is received ---

[[plant]]
name = "read not retyped: a read in the inbox receives answers only, as before"
meant = "a_question_the_chief_read_in_its_inbox_and_answered_is_never_the_head_of_its_queue"
runs = ["ledger-receipt"]

[[plant.edit]]
file = "crates/cf-ledger/src/messages/receipt.rs"
find = 'Read::Inbox => message.kind != "task" && !says_a_role,'
replace = 'Read::Inbox => message.kind == "answer",'

[[plant]]
name = "read not retyped: the same, and the chief's turn ends on a result it read pasted again (the engine)"
meant = "pastes_no_result_the_chief_read_in_its_inbox_and_pastes_what_it_did_not_read"
runs = ["engine-dispatcher"]

[[plant.edit]]
file = "crates/cf-ledger/src/messages/receipt.rs"
find = 'Read::Inbox => message.kind != "task" && !says_a_role,'
replace = 'Read::Inbox => message.kind == "answer",'

# In the field's shape the chief reads the question and then answers it, so either rule alone
# keeps it from being typed in: the rig's question case is planted with both taken away, as main
# had it.
[[plant]]
name = "read not retyped: neither rule, as on main, and a question the chief read and answered in its turn is typed in when the turn ends (the field's shape)"
meant = "a_question_the_chief_read_and_answered_in_its_turn_is_not_typed_in_when_the_turn_ends"
runs = ["retyped-rig-question"]
builds = true

[[plant.edit]]
file = "crates/cf-ledger/src/messages/receipt.rs"
find = 'Read::Inbox => message.kind != "task" && !says_a_role,'
replace = 'Read::Inbox => message.kind == "answer",'

[[plant.edit]]
file = "crates/cf-ledger/src/messages.rs"
