[[plant.edit]]
file = "app/ui/term.js"
find = "    this.terminal.open(host)\n"
replace = '''    this.terminal.registerLinkProvider({
      provideLinks: (y, done) => {
        const text = this.terminal.buffer.active.getLine(y - 1)?.translateToString(true) ?? ''
        const found = /https?:\/\/\S+/i.exec(text)
        done(
          found
            ? [
                {
                  range: {
                    start: { x: found.index + 1, y },
                    end: { x: found.index + found[0].length, y },
                  },
                  text: found[0],
                  ...link,
                },
              ]
            : undefined,
        )
      },
    })
    this.terminal.open(host)
'''

