[[plant]]
name = "pane links: the title stays after the pointer has left a link"
meant = "pane links on a Mac › a plain URL is underlined and titled as the pointer comes on it, and Cmd+click opens exactly that address"
runs = ["pl-page"]

[[plant.edit]]
file = "app/ui/term.js"
find = "      leave: () => this.terminal.element?.removeAttribute('title'),\n"
