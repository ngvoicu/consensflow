[[plant]]
name = "pane links: a refusal of the app is not said"
meant = "pane links on a Mac › a refusal of the app shows in the status line, and the link goes on working"
runs = ["pl-page"]

[[plant.edit]]
file = "app/ui/core/terminals.js"
