# A link in a pane opens in the human's browser (T-1291, Gabriel, 2026-11-07: "yes turn on the links"):
# the addresses a program prints in a window (a plain `http://` or `https://` one, or an OSC 8
# hyperlink, words with the address behind them) are links in every pane, and the rules stand, each
# held by a test:
#
# - the pointer on a link underlines it and says in the terminal's title what opens it and where it
#   goes, the address too (words can hide any); the title goes when the pointer does;
# - a click opens it only with the system's key held (Cmd on a Mac, Ctrl on Windows, as VS Code's
#   terminal does) and with the primary button: a click into a pane to type, the other system's key,
#   another button, or a pane whose program has taken the mouse, opens nothing without them;
# - what the page asks of the app is the address as the program printed it (`open_link`), and an OSC 8
#   address that is no web page (`file:`, `javascript:`, `data:`, an app's own scheme) is no link;
# - the app opens only a web page (`http` or `https`), of no more than 2,048 characters, with no
#   control character in what was printed (the parser would drop a tab or a line break from the middle
#   of it), and hands the system's opener the address as the parser writes it, as one argument and
#   no shell between (`app/src-tauri/src/link.rs`, the update's download page opened the same way);
#   a refusal is said in the status line;
# - and what the review of T-1291 found (T-1301, mended in T-1307): on Windows the system's opener
#   is `ShellExecuteW` with the verb `open`, the address as the file and no parameters (Explorer
#   read a comma and an equals sign of a checked address as its own arguments), its answer is read
#   and 32 or less is a refusal the status line shows; a plain address is read whole by
#   `app/ui/link-pattern.js` (parentheses, brackets and braces in pairs, commas, carets, any letters
#   of the scheme, an IPv6 host), without the marks a sentence puts around it, and not as the
#   addon's own pattern cut it at a parenthesis; a test build opens no page unless the test stands
#   an opener in, and never reaches the system's own;
# - and what the second review found (T-1314, mended in T-1315): a link opens the address the
#   program meant or is no link at all. Claude Code and Pi are told, by their launch's environment
#   and no file of the owner's, that the pane draws OSC 8 hyperlinks (`FORCE_HYPERLINK=1`,
#   `PI_HYPERLINKS=1`), so a link is its words with the whole address behind them on every row it
#   is drawn on; a plain address that its row's end may have cut (it runs to the last column or
#   ends the text within the margin of it, and xterm did not mark the next row a continuation) is
#   no link; an apostrophe is part of an address, but one that opens it is the quotation mark that
#   the next apostrophe closes; the marks a pair of brackets or quotes closes right after an
#   address are its own; and the update's download page opens on Windows as a link does, through
#   `ShellExecuteW`, with the shell's answer read and a COM start that was refused said.
#
# A plant that falls through to the system's opener runs a harmless stand-in in its place: the
# plant of the fail-closed rule says "opens" with `|_| Ok(())`, for a plant that really opened
# a page would do on the machine of whoever runs it what the rule is there to stop (T-1291's first
# run opened `file:///etc/passwd` on the Mac). The plant that sends Windows back to Explorer is
# harmless for the same reason: `update_page::open` opens nothing in a test build.
#
# One plant takes one rule out; a test of it fails. The page's run the browser's, the app's the tests
# of the link module on this system; the xterm they stand on is the tracked `app/ui/vendor`, so no
# plant bundles it. Every name holds `pane links`, so `npm run plants:daemon -- "pane links"` runs them all.

[run]
pl-page = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "pane links"]
pl-app = ["cargo", "xtask", "app", "test", "link::"]
pl-pattern = ["node", "--test", "tests/web-address.test.mjs"]
pl-update = ["cargo", "xtask", "app", "test", "update_page::"]
pl-launch = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch"]

