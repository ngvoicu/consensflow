# A link in a pane opens in the human's browser (T-1291, Gabriel, 2026-11-07: "yes turn on the links"):
# an OSC 8 hyperlink, words with the address behind them, is a link in every pane, and the rules
# stand, each held by a test:
#
# - **only an OSC 8 hyperlink is a link** (the third review, T-1323, after the first two mended a
#   reader of plain addresses twice): an address a program prints as text is no link in any form,
#   whole or not, with no underline and no click. From the screen alone it cannot be told whole:
#   Pi lays its text out in rows of its own and writes them with CR/LF, which cut an address inside
#   a table cell well short of the pane's edge, and no rule that reads the text can be sure of the
#   layout. A program that wants a link makes it an OSC 8 hyperlink, which carries its address
#   whole on every row it is drawn on;
# - the pointer on a link underlines it and says in the terminal's title what opens it and where it
#   goes, the address too (words can hide any); the title goes when the pointer does;
# - a click opens it only with the system's key held (Cmd on a Mac, Ctrl on Windows, as VS Code's
#   terminal does) and with the primary button: a click into a pane to type, the other system's key,
#   another button, or a pane whose program has taken the mouse, opens nothing without them;
# - what the page asks of the app is the address as the program printed it (`open_link`), and an OSC 8
#   address that is no web page (`file:`, `javascript:`, `data:`, an app's own scheme) is no link;
# - the app opens only a web page (`http` or `https`), of no more than 2,048 characters, with no
#   control character in what was printed (the parser would drop a tab or a line break from the middle
#   of it), and hands the system's opener the address as the parser writes it, as one argument and
#   no shell between (`app/src-tauri/src/link.rs`, the update's download page opened the same way);
#   a refusal is said in the status line;
# - on Windows the system's opener is `ShellExecuteW` with the verb `open`, the address as the file
#   and no parameters (Explorer read a comma and an equals sign of a checked address as its own
#   arguments; the review of T-1291, T-1301), its answer is read and 32 or less is a refusal the
#   status line shows, a refused COM start is said, and the update's download page opens the same
#   way (T-1315); a test build opens no page unless the test stands an opener in, and never reaches
#   the system's own;
# - a Pi launch tells Pi the pane draws OSC 8 (`PI_HYPERLINKS=1`), so its links are hyperlinks; a
#   Claude Code launch tells it nothing (`FORCE_HYPERLINK=1` made the commands its window runs write
#   OSC 8 into their output, T-1323), and its links are text, which is no link;
# - the page replays what Pi, Claude Code and Codex print (`app/tests/fixtures/pane-links/`, 89
#   cases): an OSC 8 hyperlink opens exactly its address, from any row it is drawn on, and an
#   address in text opens nothing.
#
# A plant that falls through to the system's opener runs a harmless stand-in in its place: the
# plant of the fail-closed rule says "opens" with `|_| Ok(())`, for a plant that really opened
# a page would do on the machine of whoever runs it what the rule is there to stop (T-1291's first
# run opened `file:///etc/passwd` on the Mac). Explorer cannot be planted back for the same reason
# (the only Explorer left in the app is `update_page::open_with`, which starts a program): the
# plants of the Windows route say a page opened and ask the shell nothing instead.
#
# One plant takes one rule out; a test of it fails. The page's run the browser's, the app's the tests
# of the link module on this system, and the launch's the launch tests of cf-harness; the xterm they
# stand on is the tracked `app/ui/vendor`, so no plant bundles it. Every name holds `pane links`, so `npm run plants:daemon -- "pane links"` runs them all.

[run]
pl-page = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "pane links"]
pl-app = ["cargo", "xtask", "app", "test", "link::"]
pl-update = ["cargo", "xtask", "app", "test", "update_page::"]
pl-launch = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch"]

# --- the page: when a click opens a link ---

[[plant]]
name = "pane links: a click without the system's key opens a link"
meant = "pane links on a Mac › a click without Cmd opens nothing, nor does the other system's key, nor another button"
runs = ["pl-page"]

[[plant.edit]]
file = "app/ui/term.js"
find = "const opensLink = (event) => event.button === 0 && (MAC ? event.metaKey : event.ctrlKey)"
replace = "const opensLink = (event) => event.button === 0"

[[plant]]
name = "pane links: the other system's key opens a link too"
meant = "pane links on a Mac › a click without Cmd opens nothing, nor does the other system's key, nor another button"
runs = ["pl-page"]

[[plant.edit]]
file = "app/ui/term.js"
find = "event.button === 0 && (MAC ? event.metaKey : event.ctrlKey)"
replace = "event.button === 0 && (event.metaKey || event.ctrlKey)"

[[plant]]
name = "pane links: a click of any button opens a link"
meant = "pane links on a Mac › a click without Cmd opens nothing, nor does the other system's key, nor another button"
runs = ["pl-page"]

[[plant.edit]]
