# The tests that failed now and then under load (T-133, 3.0.6), each held by the test written for
# its cause; one plant takes one rule out and a test fails.
#
# - a free port of loopback may be held a few milliseconds by a program being started when its
#   listener closed: it is bound again for ten seconds at the most
#   (`crates/cf-harness/src/seams/mod.rs`);
# - a program's error output is read to its end before `Spawned::wait` answers that it ended
#   (`crates/cf-e2e/src/process/spawned.rs`);
# - a file a stand-in says its process in is there whole or not at all
#   (`cf_e2e::files::write_whole`);
# - the rig names what it found left behind, and takes a program that began after the last window
#   was noted for none of the windows (`crates/cf-e2e/src/rig/left.rs`);
# - the lane over a stop is told by its order and not by the second the watch first looked at
#   (`tests/live_stops/midturn/stand_in.rs`);
# - a chief's answer is the assistant's record that ends the turn, not the word its prompt held
#   (`tests/regressions/idle_compaction_read_as_a_cut_turn.rs`), and the line a `node` writes is
#   waited for whole (`codex_in_homebrew_taken_for_not_installed.rs`);
# - the windows of the headless host are given a minute to print (`cf-panes/tests/headless.rs`);
# - a program asked to end with its streams closed meets a closed pipe: the test runs in a process
#   of its own, where no program of another test can hold a copy of the pipe that would let the
#   program answer (`crates/cf-process/src/execute.rs`, held by `capture`'s order in `capture.rs`;
#   T-183, T-190).
#
# Every name holds `load flakes`, so `npm run plants:daemon -- "load flakes"` runs them all.

[run]
harness-seams = ["cargo", "test", "--offline", "-p", "cf-harness", "--features", "test-support", "--lib", "seams::"]
process-closed-stream-stress = ["cargo", "test", "--offline", "-p", "cf-process", "--lib", "--", "--ignored", "whatever_other_tests_start"]
rig-lib-spawned = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "process::spawned"]
rig-lib-files = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "files::"]
rig-lib-left = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "rig::left"]
rig-stand-ins = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "stand_ins::the_stand_in_agents_job_writes"]
live-stops-lane = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_stops", "--", "a_lane_that_worked"]
regressions-idle = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "--", "idle_compaction_read_as_a_cut_turn"]
regressions-finder = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "--", "a_window_of_a_daemon_on_the_finders_path"]
panes-headless-eof = ["cargo", "test", "--offline", "-p", "cf-panes", "--test", "headless", "stdin_eof_reaps_every_spawned_process"]
process-execute = ["cargo", "test", "--offline", "-p", "cf-process", "--lib", "execute::tests::a_program_out_of_time_that_writes"]

[[plant]]
name = "load flakes: a free port of loopback is not let go"
meant = "a_free_port_on_loopback_is_one_a_listener_may_take"
runs = ["harness-seams"]

[[plant.edit]]
file = "crates/cf-harness/src/seams/mod.rs"
find = '''
            return Err("could not choose a loopback port".to_owned());
        }
        Ok(port)
'''
replace = '''
            return Err("could not choose a loopback port".to_owned());
        }
        std::mem::forget(listener);
        Ok(port)
'''

[[plant]]
name = "load flakes: a port held for a moment is not waited for"
