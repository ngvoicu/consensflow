[[plant]]
name = "harness window: only the harnesses that check have a row deadline"
meant = "a_held_claude_code_or_pi_version_does_not_keep_the_whole_page_open_past_40_seconds"
runs = ["harness-window-admin"]

[[plant.edit]]
file = "crates/cf-harness/src/admin.rs"
find = '''
    let row = if path.is_some() {
'''
replace = '''
