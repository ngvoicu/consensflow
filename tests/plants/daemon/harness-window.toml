# The probes are told apart by the name a CLI is invoked by: two commands of one launcher file
# each have their own answer.
[[plant]]
name = "harness window: the probes are told apart by the file alone"
meant = "two_command_names_for_one_dispatcher_each_keep_their_own_version"
runs = ["harness-window-admin"]

[[plant.edit]]
file = "crates/cf-harness/src/seams/processes.rs"
find = '''
        invoked: invoked(executable),
'''
replace = '''
        invoked: None,
'''

# A run whose last caller stopped waiting (a look cut at its time) leaves the map: left there,
# the next look joins it and waits for what never ends.
[[plant]]
name = "harness window: a timed-out probe stays in the map"
meant = "a_version_cut_at_35_seconds_is_not_left_to_hold_the_next_look"
runs = ["harness-window-admin"]

[[plant.edit]]
file = "crates/cf-harness/src/seams/processes.rs"
find = '''
        if !self.answered && alone {
'''
replace = '''
        if false && !self.answered && alone {
'''

# A cut lets go of its own probes alone: what a newer launch was answered is kept.
[[plant]]
name = "harness window: a cut forgets everything kept of the file"
meant = "an_old_cut_keeps_what_a_newer_launch_was_answered"
runs = ["harness-window-admin"]

[[plant.edit]]
file = "crates/cf-harness/src/admin.rs"
find = '''
                cut = true;
                inspect::unfinished(harness, path, checked_at)
'''
replace = '''
                cut = true;
                if let Some(path) = &path {
                    inner.probes.forget(std::path::Path::new(path));
                }
                inspect::unfinished(harness, path, checked_at)
'''

# The daemon decides which look is newest (T-2074): the stamp is taken when a look begins, and
# one update of a harness runs at a time, whichever page asks.
[[plant]]
name = "harness window: the stamp is taken at the answer"
meant = "a_look_begun_later_has_the_higher_stamp_whatever_order_the_answers_arrive_in"
runs = ["harness-window-admin"]

[[plant.edit]]
file = "crates/cf-harness/src/admin.rs"
find = '''
    let stamped = (look, Rc::clone(&row));
'''
replace = '''
    let answered = {
        let mut looks = inner.looks.borrow_mut();
        let counted = looks.entry(harness).or_insert(0);
        *counted += 1;
        *counted
    };
    let stamped = (answered, Rc::clone(&row));
'''

# One update of a harness runs at a time across a daemon's replacement: the record an installer
# leaves in the home (its number and when it began) is looked at before a second one begins.

# No row older than an update that has ended: the look is made again when one ended meanwhile.

# The refusal is the daemon's `error`, and the page shows its words and keeps Update off.

# Nothing polls: a page that is told an update runs asks again only when the person says Refresh.

# The page is read-only (the owner, 2026-11-23): no route of the daemon installs a harness.
[[plant]]
name = "harness window: an install route is put back"
meant = "the_daemon_has_no_route_that_installs_a_harness"
runs = ["harness-window-screens"]

[[plant.edit]]
file = "crates/cf-daemon/src/screens/mod.rs"
find = '''
        "/api/harnesses/check" => Some(Screen::HarnessCheck),
'''
replace = '''
        "/api/harnesses/check" => Some(Screen::HarnessCheck),
        "/api/harnesses/update" => Some(Screen::HarnessCheck),
'''

