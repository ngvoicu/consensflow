# A conversation is resumed unless its harness says it holds nothing of it (2026-10-13: a Codex chief
# that was opened, idle, closed and resumed could not be: Codex writes a thread's record only once it
# has a turn, so `codex resume <thread>` found none, the window ended at once, and a chief's own exit
# closes its project; and the other way round, a turn the human typed into a window is in its
# harness's record at once and in ConsensFlow's copy a look later, so the copy is no judge of what
# there is to go on with, and a conversation that holds things is not left behind for a record that
# cannot tell). A launch asks the adapter of the conversation's harness (`Adapter::resumable`): yes
# where its own record holds the conversation, no where it holds nothing a resume could find, and none
# where it cannot tell. Only no opens the window afresh; the copy plays no part. The cases are
# `crates/cf-engine/tests/dispatcher/resumable.rs` and `launch_stops.rs`, each harness's own
# `can_go_on…` in `crates/cf-harness/tests/launch/` and the unit cases of the name Codex gives a
# rollout, and the rig's `resume_of_a_chief_with_no_turn` and `resume_of_a_turn_the_daemon_never_copied`
# (a real daemon and pane host, on stand-ins that keep what their harnesses keep and end a window
# resumed on what they keep nothing of), and the rig's two restarts that quit as soon as the chief has
# answered. One plant takes one rule out, or puts one wrong; a test of it fails.
#
# - the launch asks the harness, and obeys its no and only its no: not asking it, resuming what it
#   holds nothing of, opening afresh what it cannot tell, and never resuming at all; and a chief that
#   starts afresh is handed over to only for what it left behind;
# - a member's message is begun, and the stop its window owes read, before its harness is asked, and
#   the launch is given up on if a pause came while it was: a pause that comes during the ask is not
#   forgiven;
# - each harness's own answer: where Claude's and Codex's file is kept, and that Codex's is named as
#   Codex names it (a timestamp and the thread, no copy of it), that their record unread tells
#   nothing, that OpenCode and Pi have their session before any turn, and that Devin's store has a
#   turn only where it holds a message of the user's.
#
# Every name holds `resume unturned`, so `npm run plants:daemon -- "resume unturned"` runs them all.

[run]
# The engine's cases of it, on the fake windows: whether a conversation is resumed, the launches a
# pause comes during, and a member's window that comes back on its conversation; the harnesses'.
engine-resumable = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "resumable::"]
engine-launch-stops = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "launch_stops::"]
engine-resume = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "resume::"]
harness-resumable = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "can_go_on"]
harness-codex-paths = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "codex::paths::"]
# The rig's cases of the report and of its review: the real daemon and pane host on the stand-in
# Codex, Claude and Devin; and the two restarts of the rig that quit as soon as the chief answered.
rig-regression-resume = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "resume_of_a_"]
rig-restart = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "--", "a_restart_leaves_the_project_suspended_and_the_humans_resume_brings_the_chief_back_on_its_own_conversation", "the_app_started_again_on_the_same_home_leaves_the_project_suspended_and_its_resume_opens_the_chief_a_window_of_its_own"]

