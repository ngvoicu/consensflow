# A conversation that never had a turn is not resumed (2026-10-13: a Codex chief that was opened,
# idle, closed and resumed could not be: Codex writes a thread's record only once it has a turn, so
# `codex resume <thread>` found none, the window ended at once, and a chief's own exit closes its
# project). A launch goes on with the participant's conversation only if the ledger says it had a
# turn (`Ledger::had_a_turn`): ConsensFlow's copy of it holds an item, or a message was delivered
# to its participant since it began, a delivery being proved only by the harness's own record. The
# cases are `crates/cf-engine/tests/dispatcher/unturned.rs`, the ledger's `receipt/turns.rs`, and
# the rig's `crates/cf-e2e/tests/regressions/resume_of_a_chief_with_no_turn.rs`, which runs a real
# daemon and pane host on a stand-in Codex that keeps no rollout before a thread's first turn and
# ends a window resumed on one. One plant takes one rule out, or puts one wrong; a test of it fails.
#
# - the launch resumes a conversation whatever it holds, or goes afresh whatever it holds;
# - the conversation a fresh chief is handed over from is the one it never had a turn in;
# - what makes a turn: the copy, a delivery, and none of what is not (a message that waits, or was
#   given up, one for another participant, one before the conversation began). A message has the
#   time of its delivery only once it was delivered, so its state is no rule of its own to plant.
#
# Every name holds `resume unturned`, so `npm run plants:daemon -- "resume unturned"` runs them all.

[run]
# The engine's cases of it, on the fake windows, and the ledger's own.
engine-unturned = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "unturned::"]
ledger-turns = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "turns::"]
# The rig's cases of the report: the real daemon and pane host on the stand-in Codex and Claude.
rig-regression-unturned = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "resume_of_a_chief_with_no_turn::"]

# --- the engine ---

[[plant]]
name = "resume unturned: a launch resumes a conversation that never had a turn"
meant = "a_chief_that_never_had_a_turn_is_opened_afresh_by_the_resume_after_a_close_and_the_project_stays_open"
runs = ["engine-unturned"]

[[plant.edit]]
file = "crates/cf-engine/src/windows.rs"
find = '''            Some(current) if ledger.had_a_turn(current.id)? => Some(current),'''
replace = '''            Some(current) => Some(current),'''

# The tests that depart from Node's traces hold it too: Node resumed every conversation it had.
[[plant]]
name = "resume unturned: a launch resumes a conversation that never had a turn, as the traces of Node had it"
meant = "opens_a_members_session_again_on_its_own_conversation_with_the_brief_it_was_opened_for"
runs = ["engine-dispatcher"]

[[plant.edit]]
file = "crates/cf-engine/src/windows.rs"
find = '''            Some(current) if ledger.had_a_turn(current.id)? => Some(current),'''
replace = '''            Some(current) => Some(current),'''

[[plant]]
name = "resume unturned: a launch opens every conversation afresh"
meant = "a_chief_whose_window_wrote_something_is_resumed_on_its_conversation"
runs = ["engine-unturned"]

[[plant.edit]]
file = "crates/cf-engine/src/windows.rs"
find = '''            Some(current) if ledger.had_a_turn(current.id)? => Some(current),'''
replace = '''            Some(current) if false && ledger.had_a_turn(current.id)? => Some(current),'''

[[plant]]
name = "resume unturned: a chief that starts afresh is not handed over to because of a conversation that never had a turn"
meant = "a_fresh_chief_with_earlier_conversations_behind_it_is_given_a_handoff_though_its_own_never_had_a_turn"
runs = ["engine-unturned"]

[[plant.edit]]
file = "crates/cf-engine/src/windows.rs"
find = '''            self.chief_first(project, participant, conversation.as_ref(), message)?'''
replace = '''            let current = self.seams.ledger.borrow().current_conversation(participant.id)?;
            self.chief_first(project, participant, current.as_ref(), message)?'''

# --- the ledger's rule of a turn, as the engine's cases hold it ---

[[plant]]
name = "resume unturned: the copy of a conversation is no turn"
meant = "a_chief_whose_window_wrote_something_is_resumed_on_its_conversation"
runs = ["engine-unturned"]

[[plant.edit]]
file = "crates/cf-ledger/src/conversations.rs"
find = '''WHERE conversation_id = ?1)'''
replace = '''WHERE conversation_id = ?1 AND 0)'''

[[plant]]
name = "resume unturned: a message delivered is no turn"
meant = "a_chief_that_was_delivered_a_message_is_resumed_though_the_copy_of_its_window_never_held_it"
runs = ["engine-unturned"]

[[plant.edit]]
file = "crates/cf-ledger/src/conversations.rs"
find = '''AND delivered_at >= ?3)'''
replace = '''AND delivered_at >= ?3 AND 0)'''

[[plant]]
name = "resume unturned: a message that waits for its window is a turn"
meant = "a_message_that_was_not_delivered_makes_no_turn"
runs = ["engine-unturned"]

[[plant.edit]]
file = "crates/cf-ledger/src/conversations.rs"
find = '''AND delivered_at >= ?3)'''
replace = '''AND created_at >= ?3)'''

[[plant]]
name = "resume unturned: a message delivered to anyone is a turn of the chief's conversation"
meant = "a_chief_that_never_had_a_turn_is_opened_afresh_by_the_resume_after_a_close_and_the_project_stays_open"
runs = ["engine-unturned"]

[[plant.edit]]
file = "crates/cf-ledger/src/conversations.rs"
find = '''WHERE recipient_id = ?2 AND delivered_at'''
replace = '''WHERE ?2 IS NOT NULL AND delivered_at'''

[[plant]]
name = "resume unturned: what was delivered before a conversation began is a turn of it"
meant = "a_conversation_the_human_switched_the_window_to_that_never_had_a_turn_is_not_resumed_either"
runs = ["engine-unturned"]

[[plant.edit]]
file = "crates/cf-ledger/src/conversations.rs"
find = '''AND delivered_at >= ?3)'''
replace = '''AND delivered_at IS NOT NULL AND ?3 IS NOT NULL)'''

