# A conversation is resumed if its harness can go on with it (2026-10-13: a Codex chief that was
# opened, idle, closed and resumed could not be: Codex writes a thread's record only once it has a
# turn, so `codex resume <thread>` found none, the window ended at once, and a chief's own exit
# closes its project; and the other way round, a turn the human typed into a window is in its
# harness's record at once and in ConsensFlow's copy a look later, a second on, so a copy that holds
# nothing is no proof that there is nothing to go on with). A launch asks the adapter of the
# conversation's harness (`Adapter::resumable`): yes where its own record holds the conversation, no
# where it holds nothing a resume could find, and none where it cannot tell, which the ledger's copy
# decides (`Ledger::had_a_turn`: a message of the user's in it, of that conversation and no other's).
# The cases are `crates/cf-engine/tests/dispatcher/resumable.rs`, the ledger's `receipt/turns.rs`,
# each harness's own `can_go_on…` in `crates/cf-harness/tests/launch/`, and the rig's
# `resume_of_a_chief_with_no_turn` and `resume_of_a_turn_the_daemon_never_copied` (a real daemon and
# pane host, on stand-ins that keep what their harnesses keep and end a window resumed on what they
# keep nothing of), and the rig's two restarts that quit as soon as the chief has answered. One plant
# takes one rule out, or puts one wrong; a test of it fails.
#
# - the launch asks the harness, and obeys it: not asking it (the copy decides), resuming what it
#   holds nothing of, opening afresh what it holds, and never resuming at all;
# - where the harness cannot tell, the copy decides: it resumes, or it goes afresh, whatever the copy
#   holds; and a chief that starts afresh is handed over to only for what it left behind;
# - what makes a turn in the copy: a message of the user's, in the conversation's own copy, and not a
#   delivery of a participant at a time (the one before it ended in the same millisecond);
# - each harness's own answer: where Claude's, Codex's and Pi's file is kept, that their record
#   unread tells nothing, that OpenCode has its session before any turn, and that Devin's store has a
#   turn only where it holds a message of the user's.
#
# Every name holds `resume unturned`, so `npm run plants:daemon -- "resume unturned"` runs them all.

[run]
# The engine's cases of it, on the fake windows; the ledger's own; the harnesses'.
engine-resumable = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "resumable::"]
ledger-turns = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "turns::"]
harness-resumable = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "can_go_on"]
# The rig's cases of the report and of its review: the real daemon and pane host on the stand-in
# Codex, Claude and Devin; and the two restarts of the rig that quit as soon as the chief answered.
rig-regression-resume = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "resume_of_a_"]
rig-restart = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "--", "a_restart_leaves_the_project_suspended_and_the_humans_resume_brings_the_chief_back_on_its_own_conversation", "the_app_started_again_on_the_same_home_leaves_the_project_suspended_and_its_resume_opens_the_chief_a_window_of_its_own"]

# --- the engine: the harness is asked, and obeyed ---

[[plant]]
name = "resume unturned: the harness is not asked, and the copy decides"
meant = "a_chief_whose_harness_holds_its_conversation_is_resumed_on_it_though_no_look_has_copied_a_turn_of_it"
runs = ["engine-resumable"]

[[plant.edit]]
file = "crates/cf-engine/src/resume.rs"
find = '''            Some(holds) => holds,'''
replace = '''            Some(_) => self.seams.ledger.borrow().had_a_turn(current.id)?,'''

