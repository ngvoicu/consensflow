# A look at a Claude Code window leaves the engine's thread, remembers nothing of the status
# files Claude Code has kept, and drops an answer that a follow overtook (P22-1, T-2029, T-2038,
# T-2070, round 3). The scan of the status folder is the records worker's
# (`Records::claude_statuses`, `claude_holders`, in crates/cf-harness/src/records/thread.rs); a
# file whose name's number is not alive is not opened (crates/cf-harness/src/claude/status.rs,
# `Scanner`); a look's answers are used only while the window shows the conversation they were
# asked for (crates/cf-harness/src/claude/adapter.rs, `observe`).

[run]
p22-off-thread = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "off_thread"]
p22-ping = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::claude_scan"]
p22-follows = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "claude::follows"]
p22-stale = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "holders_answer"]
p22-status = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::status::"]

[[plant]]
name = 'p22: the status scan runs on the engine thread again'
meant = "a_status_scan_held_at_a_gate_stops_no_timer_of_the_engine_and_its_look_is_answered"
runs = ["p22-off-thread"]

[[plant.edit]]
file = "crates/cf-harness/src/claude/adapter.rs"
find = """            let statuses = self.records.claude_statuses(&self.statuses).await;
            let asked"""
replace = """            let statuses = crate::claude::scan_statuses(&self.statuses);
            let asked"""

[[plant]]
name = 'p22: the records worker scans the status folder on the daemon thread again'
meant = "a_claude_status_scan_held_at_a_gate_holds_up_no_ping_of_the_daemon"
runs = ["p22-ping"]

[[plant.edit]]
file = "crates/cf-harness/src/records/thread.rs"
find = """    fn claude_statuses<'a>(&'a self, folder: &'a str) -> Work<'a, Vec<(u32, Status)>> {
        Box::pin(async move {
            let (answer, answered) = oneshot::channel();"""
replace = """    fn claude_statuses<'a>(&'a self, folder: &'a str) -> Work<'a, Vec<(u32, Status)>> {
        Box::pin(async move {
            if folder.len() > 0 {
                return crate::claude::scan_statuses(folder);
            }
            let (answer, answered) = oneshot::channel();"""

[[plant]]
name = 'p22: every status file is opened, the skip of a dead number removed'
meant = "a_look_asks_once_of_each_file_and_opens_only_the_files_of_live_numbers"
runs = ["p22-status"]

[[plant.edit]]
file = "crates/cf-harness/src/claude/status.rs"
find = "            if !named.is_some_and(|named| self.alive(named)) {"
replace = "            if !named.is_some_and(|named| self.alive(named)) && false {"

[[plant]]
name = 'p22: a status link whose target was rewritten is judged by the link, not the file read'
meant = "a_status_link_whose_target_is_rewritten_is_read_as_the_target"
runs = ["p22-status"]

[[plant.edit]]
file = "crates/cf-harness/src/claude/status.rs"
find = "            let written = file.metadata().ok().and_then(|meta| meta.modified().ok());"
replace = "            let written = fs::symlink_metadata(entry.path()).ok().and_then(|meta| meta.modified().ok());"

[[plant]]
name = 'p22: a metadata call of each listed file is made and not counted'
meant = "every_file_system_call_of_the_scan_is_counted"
runs = ["p22-status"]

[[plant.edit]]
file = "crates/cf-harness/src/claude/status.rs"
find = """            if !is_status_file(&name) {
                continue;
            }"""
replace = """            if !is_status_file(&name) {
                continue;
            }
            let _ = entry.metadata();"""

[[plant]]
name = 'p22: a metadata call of each listed file is made and counted'
meant = "a_look_asks_once_of_each_file_and_opens_only_the_files_of_live_numbers"
runs = ["p22-status"]

[[plant.edit]]
file = "crates/cf-harness/src/claude/status.rs"
find = """            if !is_status_file(&name) {
                continue;
            }"""
replace = """            if !is_status_file(&name) {
                continue;
            }
            self.fs_calls += 1;
            let _ = entry.metadata();"""

[[plant]]
name = 'p22: a program that began within 2 s after a status file was last written is its writer again'
meant = "a_program_that_took_the_writers_number_a_moment_after_its_last_write_is_no_holder"
runs = ["p22-status"]

[[plant.edit]]
file = "crates/cf-harness/src/claude/status.rs"
find = "const SLACK: Duration = Duration::from_millis(20);"
replace = "const SLACK: Duration = Duration::from_secs(2);"

[[plant]]
name = 'p22: the answers on statuses and holders are used though the window followed another conversation'
meant = "a_holders_answer_for_the_conversation_a_window_left_marks_the_one_it_follows_not_shared"
runs = ["p22-stale"]

[[plant.edit]]
file = "crates/cf-harness/src/claude/adapter.rs"
find = """            let holders = self.records.claude_holders(&self.statuses, &asked).await;
            if generation != self.generation.get() {
                return Err(OVERTAKEN.to_owned());
            }"""
replace = """            let holders = self.records.claude_holders(&self.statuses, &asked).await;"""

[[plant]]
name = 'p22: the transcript read is used though the window followed another conversation'
meant = "a_transcript_read_across_a_follow_is_no_answer_and_never_conversation_a_s_result_for_b"
runs = ["p22-follows"]

[[plant.edit]]
file = "crates/cf-harness/src/claude/adapter.rs"
find = """            // The transcript is the conversation's it was asked for too.
            if generation != self.generation.get() {
                return Err(OVERTAKEN.to_owned());
            }"""
replace = """            // The transcript is the conversation's it was asked for too."""

[[plant]]
name = 'p22: a look that a follow overtook asks again'
meant = "a_look_that_follows_keep_overtaking_ends_without_asking_again"
runs = ["p22-follows"]

[[plant.edit]]
file = "crates/cf-harness/src/claude/adapter.rs"
find = """            let holders = self.records.claude_holders(&self.statuses, &asked).await;
            if generation != self.generation.get() {
                return Err(OVERTAKEN.to_owned());
            }"""
replace = """            let holders = self.records.claude_holders(&self.statuses, &asked).await;
            if generation != self.generation.get() {
                return Window::observe(self).await;
            }"""
