# A board window's first message was on its command line (T-432; the issue
# `issues/a-windows-first-message-is-on-its-command-line.md` in consensflow-sme). On 2026-10-24 a
# worker sent SIGINT to every process whose `ps` line matched "xtask plants", and two other workers'
# Claude windows closed: ConsensFlow gave Claude Code's, Pi's and Codex's windows their first message,
# a task's brief, as the last argument of their command line, which every process on the Mac reads
# (`/bin/ps` is set-uid root) and every kill or wait by pattern matches.
#
# - The adapters say how a window takes its first message (`FirstMessage`,
#   `crates/cf-harness/src/contract.rs`): Devin reads it from its prompt file, OpenCode is posted it,
#   and Claude Code, Pi and Codex are given none as they open (`claude/adapter.rs`, `pi/adapter.rs`,
#   `codex/adapter.rs`, `shared/window_args.rs`). Pi's role text goes by its file. A resumed window
#   reads a turn the quit left open whatever its launch carries.
# - The engine delivers it once the window is past the question of trusting its folder, has drawn
#   and is at rest, by the window's own `deliver`, admitted then (`crates/cf-engine/src/windows.rs`,
#   `dispatcher.rs`, `deliveries.rs`'s `hand_first`); one never ready in the launch's time is given up
#   and says so, and a paste the record never shows is pressed Enter for once more (`arrival.rs`).
#
# The rig's cases build the native `cf` from the sources as planted, so their plants say `builds`.
# Every name holds `first message`, so `npm run plants:daemon -- "first message"` runs them all.

[run]
fm-launch-rule = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "scenarios::no_launch_puts_its_first_message_on_its_command_line"]
fm-launch-pi-roles = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "pi::roles::"]
fm-engine-delivered = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "first_delivered::"]
fm-rig-claude = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_windows_first_message_was_on_its_command_line::a_workers_claude"]
fm-rig-codex = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_windows_first_message_was_on_its_command_line::a_workers_codex"]
fm-rig-trust = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_trust_question_after_git_init_stopped_every_launch::a_worker_asked"]
fm-rig-late-trust = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_trust_question_after_git_init_stopped_every_launch::a_worker_whose_question_comes_after_half_a_minute"]
fm-rig-never-prompt = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_trust_question_after_git_init_stopped_every_launch::a_worker_that_never_draws_its_prompt"]
fm-kit-machine = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::machine::"]
fm-rig-servers = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_trust_question_after_git_init_stopped_every_launch::a_worker_asked_of_six_new_servers"]
fm-rig-brief-picture = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_task_cancelled_after_images_were_attached_to_the_words_that_resumed_it_had_no_escape_pressed::a_task_cancelled_while_its_window_works_on_a_brief"]

