# A dialog of a harness's own that waits for a key mid-session, in a window nobody watches, went
# unseen (field, 3.0.6, 2026-10-26, T-1183): Claude Code offered a worker's window to install an
# LSP plugin, and the chief never heard of it. The engine reads such a dialog off the window's
# screen (`crates/cf-engine/src/dialogs.rs`), by its shape (`crates/cf-harness/src/shared/
# dialog.rs`) or where the harness's status says one is open (Claude Code's, `claude/adapter.rs`
# `dialog_sign`), holds a window only its screen shows one in, and tells whoever gave its task
# and the human once; it presses nothing. Claude Code's surveys and Codex's nudge and install
# offers are turned off for each launch alone (`claude/adapter.rs` `QUIET`, `codex/adapter.rs`
# `OFFERS`).
#
# The tests are the engine's `crates/cf-engine/tests/dispatcher/harness_dialogs.rs`, the
# reader's `crates/cf-harness/src/shared/dialog/tests.rs`, Claude's window's
# `crates/cf-harness/tests/launch/claude/dialogs.rs`, the launch pins of `tests/launch/claude.rs`
# and `codex.rs`, and the case
# `crates/cf-e2e/tests/regressions/a_harness_dialog_in_a_workers_window_went_unseen.rs`, whose
# stand-in Claude draws the offer as Claude Code 2.1.317 drew it in a live member's window. The
# case builds the native `cf` from the sources as they are planted, so its plants say `builds`.
# Every name holds `harness dialogs`, so `cargo xtask plants daemon "harness dialogs"` runs them
# all.

[run]
hd-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "harness_dialogs::"]
hd-reader = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::dialog"]
hd-claude = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "claude::"]
hd-codex = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "codex::"]
hd-rig = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_harness_dialog_in_a_workers_window_went_unseen::"]
hd-devin = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "devin::dialogs::"]
hd-muse = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "muse::window::tests::"]
hd-pi = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "pi::dialogs::"]
hd-proto = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "panes::tests::a_tail_keeps"]
hd-corpus = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "testing::corpus::tests::"]
hd-guard = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "testing::corpus::guard::"]
hd-claude-identity = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::dialog_identity::"]
hd-base-dialog = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "testing::base_dialog::"]
hd-claude-cu = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::computer_use_prompt::"]
hd-rig-codex = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_codex_chiefs_idle_prompt_was_read_as_a_dialog::"]

