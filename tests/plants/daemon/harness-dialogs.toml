# A harness's own idle prompt is never a choice of a dialog (T-1240; the live matrix's
# `question-ask-answer` with a Codex chief, 2026-11-05, T-1178), and no screen the release head read
# as no dialog reads as one (T-1243, the review of `9a7fca6cb`). The engine reads the pane host's
# tail, which has no empty line and no rule that says no word: Codex's composer ("› Ask Codex to do
# anything"), its footer and the line of the conversation over them ("  Worked for 5s • 16:00") were
# one under the other in one column, as a list of choices is, and a worker's question above them
# became the dialog's words: the chief was held as waiting.
#
# - the shared reader (`shared/dialog.rs`) takes a cursor line under a rule across the screen
#   (Devin's and Muse's rules say something, so the tail keeps them) for an input box's, and reads
#   a numbered list, a hint of keys and a `›` as it always did: a rule that ended a numbered list at
#   the first line that is not numbered read Pi's and Muse's transcripts as dialogs;
# - Codex's window (`codex/adapter.rs`) reads no dialog by its screen's shape (T-1243, the second
