# - the corpus (`cf_harness::testing::corpus`) holds the release bar: 918 labelled screens read by each
#   window and by `5b7acff7f`'s window, frozen (`testing/base_dialog.rs`), cut with the pane host's
#   own tail filter (`cf_proto::panes::word_tail`).
# - the corpus's data is held clean by a guard (`testing/corpus/guard.rs`, T-1243, the third review): per
#   class of what the scrub removed (the owner's name, paths, ids, emails, keys, usage/credit/quota/reset
