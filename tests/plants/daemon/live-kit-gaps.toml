# The live kit's gaps on real harnesses (T-972, 3.0.7; the regression audits T-961 and
# T-962): the judges of the live suites this round added, held by their own tests.
#
# - `live own-cf`: a member's shell finds its window's own `cf` ahead of a decoy its profile
#   puts first (`devin-shell-finds-installed-cf`, `devin-shell-on-windows-does-not-find-cf`):
#   a decoy that was run fails the worker by its folder, only the daemon's own answer to
#   `cf whoami` proves the window's `cf`, and the run's home puts the decoys first;
# - `live paste-enter`: a paste the human sends with Enter goes on that Enter
#   (`codex-windows-ignores-enter-after-paste`): the two shapes of typing, and the verdict;
# - `eval chiefs`: the `conversation` eval for each chief harness (`chief-does-the-work-itself`);
# - `live resume-cut`: a cut that found the turn over cut nothing, and the case was not run
#   (`live-resume-cut-codex-never-reaches-the-cut`);
# - the kit: a window on a home of the run's own is given the person's home, never the folder
#   its harness reads its login from (Codex's `~/.codex`, where project folders were made);
# - the `conversation` eval's expectations: only the owner's changes count, the English task names
#   the evaluation page, a chief's own edits are none (`chief-does-the-work-itself`);
# - `live --set windows`: the regular Windows live run, the typed marks of `live parity` in it
#   (`human-typing-loses-marks-in-devin-codex-on-windows`).
#
# One plant takes one rule out; a test fails. Every name holds `live kit gaps`, so
# `npm run plants:daemon -- "live kit gaps"` runs them all.

[run]
live-own-cf = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_own_cf"]
live-paste-enter = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_paste_enter"]
evals-chiefs = ["cargo", "test", "--offline", "-p", "cf-evals", "--lib", "chiefs::"]
live-resume-cut = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_resume_cut"]
e2e-lib-machine = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::machine::"]
evals-scenarios = ["cargo", "test", "--offline", "-p", "cf-evals", "--test", "scenarios"]
xtask-live = ["cargo", "test", "--offline", "-p", "xtask", "--lib", "live::"]

[[plant]]
name = "live kit gaps: a decoy cf the worker's shell ran does not fail it"
meant = "a_decoy_that_was_run_fails_it_by_its_folder_whatever_the_result_says"
runs = ["live-own-cf"]

[[plant.edit]]
file = "crates/cf-e2e/tests/live_own_cf/verdict.rs"
find = "    for (label, calls) in &seen.decoys {"
replace = "    for (label, calls) in seen.decoys.iter().filter(|_| false) {"

[[plant]]
name = "live kit gaps: any result proves the window's own cf, the stand-in's answer too"
meant = "a_result_with_no_answer_of_the_daemons_proves_nothing_and_fails"
