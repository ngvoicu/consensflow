# The words a window writes in reply to a tell, before its first tool call (T-1151). `live tell
# devin` on the Mac (T-1131's sweep, 2026-11-02, Devin 3000.11.234): the chief asked for one line as
# text, a short command, and a last line. Devin wrote the line, ran the command (and `cf answer m-2`
# with the last line, in the second run), and ended with the last line. The note a tell's turn leaves
# (T-442) took what follows the turn's last tool call and called the rest progress, so nothing
# carried the line written first. The sweep's Claude Code, Codex and Muse records hold the same shape;
# theirs reached the chief because the model put the line into `cf answer` or wrote it again.
#
# The rules (`crates/cf-engine/src/role_change.rs` `answers_to_the_task`, `crates/cf-engine/src/
# turn_end.rs` `reply_of`, `crates/cf-engine/src/turn_end/paused.rs`, `crates/cf-ledger/src/messages/
# paused_answers.rs`): what a member wrote after its message and before its first tool call is its
# reply, where a tool call followed; what a harness wrote itself is none, and what it marks as
# progress (Codex) is one; what it wrote between its tools is not; the note holds the reply beside the
# last words, unless they are the same words or the window sent them with `cf answer`; a resume
# keeps the reply in the words of a task that has moved on; a note with a reply is read back as
# itself. Finish takes the last words alone, as before.
#
# Each plant takes one rule out again. The names begin with `tell reply`, so
# `cargo xtask plants daemon "tell reply"` runs them.

[run]
tell-reply-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "paused_answers::"]
tell-reply-unit = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "role_change::tests::"]
tell-reply-ledger-unit = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "messages::paused_answers::"]
tell-reply-ledger-notes = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "pause_notes"]
tell-reply-rig = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_reply_written_before_the_tools_of_a_tells_turn"]
tell-reply-stand-in = ["cargo", "test", "--offline", "-p", "cf-e2e", "--features", "test-support", "--bin", "fake-agent", "steps::tests::a_said_line"]

[[plant]]
name = "tell reply: a member's first words are never collected"
meant = "what_a_member_writes_before_its_first_tool_call_is_its_reply_and_what_it_writes_between_its_tools_is_not"
runs = ["tell-reply-unit", "tell-reply-engine"]

[[plant.edit]]
file = "crates/cf-engine/src/role_change.rs"
find = "            Role::Assistant if !self.over && !item.synthetic => self.run.push(item),"
replace = "            Role::Assistant if !self.over && !item.synthetic => {}"

