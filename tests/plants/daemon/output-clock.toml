# The window's output clock while a read of its output is on its way to the screen (N17). The paste's
# Enter waits for the window to be quiet, and a box reader asks whether the window answered the human's
# last key. A read of erases on the biggest screen takes longer than the 120 ms the Enter waits when the
# machine is loaded, and bytes the pty gave waited behind the consumer's other work and the screen's
# lock where no clock knew of them. Now each pane counts two things: the bytes the thread that reads
# the pty has taken, advanced the moment they are in hand, and the bytes in the screen, advanced when
# each feed ends. Output is pending while the first is the greater.
#
# - the window is not quiet while output is pending, and a paste's Enter waits then, up to the cap
#   and a grace; it is looked at again with the pane's writer held, where it is written; at the cap
#   it goes, as it did before the counts, and the paste is answered as made;
# - a read is counted the moment the pty returns it, before the lock of the activity time;
# - an answer of the input box's reader says how many feeds had changed the screen when it was
#   read (`shownAt`), and a paste goes in over a count only while none has since and none is pending
#   (a window that repaints the same at rest leaves the answer good, T-1083);
# - the pair is sampled once, drawn first and read after it;
# - every snapshot carries both counts; a counts-only one waits for no lock, one with the screen's
#   lines takes the counts with the lock held;
# - the input box is current only where the counts are equal (the shared reader of cf-harness);
# - a panic in the feed ends the pane's generation: its program is ended, it admits nothing, and its
#   exit is told.
#
# Every name holds `output clock`, so `cargo xtask plants daemon "output clock"` runs them.

[run]
oc-feed = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "--", "pane_handlers::feeding_tests::", "pane_handlers::native_tests::"]
oc-muse = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "--", "muse::window::"]
oc-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "--", "presses_no_enter_once_more_while"]
oc-dispatch = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "--", "lacks_output", "screen_that_fell_behind", "screen_lacks_bytes_the_window_printed", "read_in_flight_looks_once_more", "shows_less_than_it_printed"]
oc-pty = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "--", "pty::tests::a_read_is_counted"]
oc-paste = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "--", "shared::pane::tests::a_paste_over_a_read_empty_box"]
oc-reader = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "--", "shared::input_box::tests::a_box_on_a_screen_that_lacks"]

[[plant]]
name = "output clock: a read is counted after the lock of the activity time"
meant = "a_read_is_counted_while_the_activity_lock_is_held"
runs = ["oc-pty"]

[[plant.edit]]
file = "crates/cf-panes/src/pty/flow.rs"
find = """            self.counts.took(byte_count);
            *self
                .last_activity
                .lock()
                .map_err(|_| io::Error::other("pane activity lock is poisoned"))? = Instant::now();"""
replace = """            *self
                .last_activity
                .lock()
                .map_err(|_| io::Error::other("pane activity lock is poisoned"))? = Instant::now();
            self.counts.took(byte_count);"""

