# N17's delivery checks, and the output clock under them (T-2125, T-2144, T-2164, T-2233). A
# delivery's decisions about a window's input box rest on one observation, a look: the pane host's
# snapshot with the screen's last lines, read under the screen's lock, named by `seen` (a digest of
# those lines and the cursor). A look exists only where the pane is current: the terminal holds
# nothing (asked under a gate the reader reads inside), and read equals drawn. Every act on the box
# (a paste, an Enter that is not a paste's first, the key that empties it) carries the `seen` that
# licensed it, and the host checks it again where it writes, with the pane's writer held, then the
# screen's lock, the pane's input state and the gate:
#
# - the pane current, for every paste with a look and every `pane.enter`;
# - the digest made again equals the look's, and no key of the human's came since;
# - a box read empty sets the count of the human's keys aside only on evidence the host took at the
#   key ("erased", "typed elsewhere"), which the paste names and the host checks; no time does;
# - a read is counted inside the gate, before the lock of the activity time;
# - a paste's first Enter waits for a current pane up to the cap and a grace, and is checked again
#   with the writer held; `pane.enter` is never written while the pane is not current;
# - a window that takes its messages through a channel is given no look.
#
# Each plant here is caught by a fixed schedule of the model (`cf-panes`' `model::cases`) or a test
# of the host or the reader; the random walks (`model::walks`) run where they can see it. Every
# name holds `output clock`, so `cargo xtask plants daemon "output clock"` runs them.

[run]
oc-model = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "--", "model::cases::"]
oc-walks = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "--", "model::walks::"]
oc-feed = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "--", "pane_handlers::feeding_tests::", "pane_handlers::native_tests::"]
oc-pty = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "--", "pty::tests::a_read_is_counted"]
oc-harness = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "--", "shared::look::tests::", "shared::input_box::tests::"]
oc-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "--", "pastes_nothing_again", "a_look_the_host_did_not_give", "presses_no_enter_once_more_while", "stale_box::", "still_there::", "a_paced_paste_goes_only_on_a_look_its_window_approved", "a_paste_into_a_box_read_empty_retires_the_mark"]
oc-conpty = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "--", "pty::conpty::tests::a_windows_output_pipe"]
oc-devin = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "--", "devin::adapter::tests::bypass::"]
oc-gate = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "--", "pty::tests::a_gate_asked_with_the_writer_held"]

