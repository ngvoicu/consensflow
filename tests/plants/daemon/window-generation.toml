# T-1780: distinguish a session's new window from its earlier window.

[[plant]]
name = "t1780 generation: token forgets its boundary"
meant = "the_engines_window_token_keeps_its_launch_boundary"
runs = [["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "the_engines_window_token_keeps_its_launch_boundary"]]
[[plant.edit]]
file = "crates/cf-daemon/src/api/credentials.rs"
find = "        self.issue_with_start(project, participant, Some(start))"
replace = "        self.issue_with_start(project, participant, None)"

[[plant]]
name = "t1780 generation: engine credential adapter drops boundary"
meant = "the_engines_window_token_keeps_its_launch_boundary"
runs = [["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "the_engines_window_token_keeps_its_launch_boundary"]]
[[plant.edit]]
file = "crates/cf-daemon/src/api/credentials.rs"
find = "        Credentials::issue_for_window(self, project, participant, start)"
replace = "        Credentials::issue(self, project, participant)"

[[plant]]
name = "t1780 generation: old window forgets its task"
meant = "window_generation_refuses_an_ended_tasks_old_window_and_allows_a_fresh_one"
runs = [["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "window_generation_refuses_an_ended_tasks_old_window_and_allows_a_fresh_one"]]
[[plant.edit]]
file = "crates/cf-daemon/src/api/callers.rs"
