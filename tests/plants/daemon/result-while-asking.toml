# A worker's result is not lost because a turn of its that ended with the write-up was not taken
# (T-1204, from the field board's T-837 of 2026-10-28; T-1219, from T-1200 of 2026-11-04). The result is
# the final answer of the last turn, so a turn that ended with a complete answer and was followed by a
# message to the window lost its words when the task waited for an answer (T-837: the worker's own
# question was out), when its end was held for a job that runs, or when Claude Code's queue held a job's
# notice as the turn ended and the notice began the next turn (T-1200: the record read in flight, nothing
# held, nothing told).
#
# The rule (`crates/cf-engine/src/turn_end/earlier_turns.rs`), applied where a result is recorded: by the
# turn's end (`Dispatcher::collect`, `turn_end.rs`) and by Finish (`turn_end/finish.rs`). Every turn after
# the latest message of the task's own that ended with a complete answer and was followed by a message to
# the window (the answer to the worker's question, a note of ConsensFlow's, another message of its, or one
# with no header of its: the harness's notice, or words typed in) comes first in the result, labelled with
# what followed it, and the last words follow "What it said last:". Not kept: a turn cut off, one that wrote
# no words, a line about where it stands (at most 500 characters) before any message but an answer, a turn
# that ended on its question (the last output of a tool is `cf ask`'s own, or it ran none) in at most 500
# characters, the question ConsensFlow raised from the words, and a repeat. The text `cf ask` prints is
# `cf-proto`'s, and the engine reads it.
#
# Each plant takes one rule out again. The names begin with `result while asking`, so
# `cargo xtask plants daemon "result while asking"` runs them.

[run]
rwa-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "result_while_asking::"]
rwa-held = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "result_after_held_turn::"]
rwa-lib = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "earlier_turns::"]
rwa-rig = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_workers_write_up_was_lost_when_its_question_was_still_out"]
rwa-rig-held = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_held_workers_write_up_was_lost_when_its_jobs_end_woke_a_short_turn"]
rwa-cf = ["cargo", "test", "--offline", "-p", "cf", "--test", "board_goldens"]

[[plant]]
name = "result while asking: the turn's end records the result without the turns that ended before it"
meant = "a_write_up_that_ended_the_turn_with_the_workers_question_out_is_in_the_result_before_the_reply"
runs = ["rwa-engine"]

[[plant.edit]]
file = "crates/cf-engine/src/turn_end.rs"
find = '''        let words = for_task(&thread.task, with_earlier(words, &earlier));
'''
replace = '''        let _ = &earlier;
        let words = for_task(&thread.task, words);
'''

