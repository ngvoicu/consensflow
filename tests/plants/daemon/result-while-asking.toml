# A worker's result is not lost because a question of its was still out when its turn ended (T-1204,
# from the field board's T-837 of 2026-10-28; the triage T-1201 found it again as T-846). T-837's worker
# asked the chief a question that needed no answer (`cf ask`) and went on in the same turn; its task read
# `waiting`. The turn ended with a 5.8 KB write-up on a task that was not working, which takes no result,
# the answer went in after it, and the turn it began ended with five lines that became the result.
#
# The rule (`crates/cf-engine/src/turn_end/while_asking.rs`), applied where a result is recorded: by the
# turn's end (`Dispatcher::collect`, `turn_end.rs`) and by Finish (`turn_end/finish.rs`). The turns that
# ended right before the paste of an answer to one of the worker's own questions on the task, after the
# latest message of the task's own, come first in the result, each labelled "Written before the answer to
# its question m-N went in:", and the last words follow "What it said last:". Not kept: a turn cut off, one
# that wrote no words, one that ended on its question (the last output of a tool is `cf ask`'s own, or it ran
# none) in at most 500 characters, the question ConsensFlow raised from the words, and a repeat. The text
# `cf ask` prints is `cf-proto`'s, and the engine reads it.
#
# Each plant takes one rule out again. The names begin with `result while asking`, so
# `cargo xtask plants daemon "result while asking"` runs them.

[run]
rwa-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "result_while_asking::"]
rwa-rig = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_workers_write_up_was_lost_when_its_question_was_still_out"]
rwa-cf = ["cargo", "test", "--offline", "-p", "cf", "--test", "board_goldens"]

[[plant]]
name = "result while asking: the turn's end records the result without the turns that ended with a question out"
meant = "a_write_up_that_ended_the_turn_with_the_workers_question_out_is_in_the_result_before_the_reply"
runs = ["rwa-engine"]

[[plant.edit]]
file = "crates/cf-engine/src/turn_end.rs"
find = '''        let words = with_earlier(words, &earlier);
'''
replace = '''        let _ = &earlier;
'''

[[plant]]
name = "result while asking: the rig's worker that asked and went on has the reply alone for its result"
meant = "a_write_up_the_turn_ended_with_while_the_question_was_out_is_in_the_result_before_the_reply"
runs = ["rwa-rig"]
builds = true

[[plant.edit]]
file = "crates/cf-engine/src/turn_end.rs"
find = '''        let words = with_earlier(words, &earlier);
'''
replace = '''        let _ = &earlier;
'''

[[plant]]
name = "result while asking: Finish takes the last words without the turns that ended with a question out"
meant = "the_chief_finishing_the_held_reply_to_an_answer_gives_the_write_up_too"
runs = ["rwa-engine"]

[[plant.edit]]
file = "crates/cf-engine/src/turn_end/finish.rs"
find = '''        let words = with_earlier(
            with_lost(words_of(&run), &participant.handle, lost),
            &earlier,
        );
'''
replace = '''        let _ = &earlier;
        let words = with_lost(words_of(&run), &participant.handle, lost);
'''

[[plant]]
name = "result while asking: the words of a round before the latest message of the task are kept too"
meant = "a_write_up_from_before_the_words_that_resumed_the_task_is_not_in_its_result"
runs = ["rwa-engine"]

