# A window that stopped a turn before a word of its answer took the turn's
# message back out of its conversation: its look says so, the stop is paid at
# rest and, in the same step, the ledger keeps the message for the window
# again, so the words that resume the task carry it. A stop that leaves the
# message in the conversation changes nothing. One plant takes one rule out;
# a test of it fails.

[run]
# The engine's tests of the rule, on the fake window.
taken-back-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "taken_back"]
# The ledger's tests of the rule: what is kept, and what carries it.
taken-back-ledger = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "taken_back"]

[[plant]]
name = "taken back: the stop is paid at rest and the ledger is not told"
meant = "a_stop_paid_at_rest_by_a_window_that_took_its_brief_back_keeps_the_brief_for_the_words_that_resume_the_task"
runs = ["taken-back-engine"]

[[plant.edit]]
file = "crates/cf-engine/src/stops.rs"
find = "                    if observed.took_back {"
replace = "                    if observed.took_back && false {"

[[plant]]
name = "taken back: every stop paid at rest takes its message back"
meant = "a_stop_that_leaves_the_message_in_the_conversation_leaves_it_received_and_the_resume_carries_no_brief"
runs = ["taken-back-engine"]

[[plant.edit]]
file = "crates/cf-engine/src/stops.rs"
find = "                    if observed.took_back {"
replace = "                    if true {"

[[plant]]
name = "taken back: a turn that began with another message than the task`s is taken for it"
meant = "a_stop_that_leaves_the_message_in_the_conversation_leaves_it_received_and_the_resume_carries_no_brief"
runs = ["taken-back-engine"]

[[plant.edit]]
file = "crates/cf-engine/src/taken_back.rs"
find = "                && turn.is_some_and(|turn| turn.text.contains(&marker_of(message.id)))"
replace = "                && turn.is_some()"

[[plant]]
name = "taken back: the stop is paid before the ledger is told, and a failed write loses it"
meant = "a_ledger_that_could_not_be_written_leaves_the_stop_owed_and_the_next_look_at_rest_takes_it_back"
runs = ["taken-back-engine"]

[[plant.edit]]
file = "crates/cf-engine/src/stops.rs"
find = '''
                    if observed.took_back {
                        self.take_back(participant, &stop, observed)?;
                    }
                    self.pay(record, &stop);'''
replace = '''
                    self.pay(record, &stop);
                    if observed.took_back {
                        self.take_back(participant, &stop, observed)?;
                    }'''

[[plant]]
name = "taken back: the message is cancelled, not kept for the window again"
meant = "a_brief_its_window_took_back_is_kept_again_and_the_words_that_resume_the_task_carry_it"
runs = ["taken-back-ledger"]

[[plant.edit]]
file = "crates/cf-ledger/src/messages/taken_back.rs"
find = '''"UPDATE message SET state = 'queued', reason = ?, delivered_at = NULL, receipt = NULL'''
replace = '''"UPDATE message SET state = 'cancelled', reason = ?, delivered_at = NULL, receipt = NULL'''

[[plant]]
name = "taken back: it does not join the words that already wait for the window"
meant = "words_that_resumed_the_task_before_the_stop_was_paid_take_the_message_in_when_it_is_taken_back"
runs = ["taken-back-ledger", "taken-back-engine"]

[[plant.edit]]
file = "crates/cf-ledger/src/messages/taken_back.rs"
find = '''
        adopt(store, message_id)?;
        known_message(store, message_id)
    })
}'''
replace = '''
        known_message(store, message_id)
    })
}'''

[[plant]]
name = "taken back: what its paste carried is left received, and lost with it"
meant = "a_resume_taken_back_with_what_it_carried_is_kept_again_with_it_and_the_next_words_carry_each_once"
runs = ["taken-back-ledger"]

[[plant.edit]]
file = "crates/cf-ledger/src/messages/taken_back.rs"
find = '''
        store.db.execute(
            "UPDATE message SET state = 'queued', delivered_at = NULL, receipt = NULL,
               handed_at = COALESCE(handed_at, delivered_at)
         WHERE carried_by = ? AND state = 'delivered'",
            [message_id],
        )?;'''
replace = ""

[[plant]]
name = "taken back: the look at a Claude window does not say it took its message back"
meant = "a_turn_the_daemon_interrupted_before_claude_wrote_a_word_is_read_at_rest_a_moment_after_the_press"
runs = ["harness-launch-claude-stops"]

[[plant.edit]]
file = "crates/cf-harness/src/claude/adapter.rs"
find = '''observed(at_rest, settled && !at_rest, waiting, by_press, at_prompt)'''
replace = '''observed(at_rest, settled && !at_rest, waiting, false, at_prompt)'''

