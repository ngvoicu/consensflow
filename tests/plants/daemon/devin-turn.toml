# A Devin turn as the launch's own wire log says it, on Devin 3000.11's log and on 3000.12.43's,
# which says no word of its own on a turn (T-1423, alpha-5 A5-18 and A5-19, from T-1417's
# reading of three live runs and T-1423's two). The rules are decided by what the log holds:
#
# - a message said back live (its event type `user_message`, its client id, no event id) opens
#   the turn, as `working` did; a replay's, or 3000.11's with no event type, opens nothing;
# - 3000.11's message said back (no event type, no event id) is the turn's where a turn is open
#   at it or opens before the next turn end or `turnClientMessageId`; a replay's never is;
# - a permission dialog's line clears the turn's work, as `blocked` did, and that call's next
#   update sets it again; the turn stays open;
# - any `cause` ends the turn, a name this reader does not know too;
# - the window reads the log no earlier than the record (the review T-1411 of T-1403);
# - the window tells the engine which deliveries its open turn said back, and the engine's
#   never-began watch leaves those, and only those, be.
#
# The reader's cases are in `crates/cf-harness/src/devin/record/tests/unsaid.rs`; the window's
# in `crates/cf-harness/tests/launch/devin/resumed.rs` and `own_turn.rs`; the engine's in
# `crates/cf-engine/tests/dispatcher/brief_never_began.rs`.

[run]
harness-lib-devin-unsaid = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "devin::record::tests::unsaid::"]
harness-devin-resumed = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "devin::resumed::"]
harness-devin-own-turn = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "devin::own_turn::"]
engine-never-began = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "brief_never_began::"]

[[plant]]
name = "devin turn: a message said back live opens no turn"
meant = "a_devin_3000_12_turn_is_at_work_from_the_message_it_says_back_before_its_first_streamed_word"
runs = ["harness-lib-devin-unsaid", "harness-devin-own-turn"]

[[plant.edit]]
file = "crates/cf-harness/src/devin/record/wires.rs"
find = "            self.busy = true;\n            self.said_back.push(text.to_owned());"
replace = "            self.said_back.push(text.to_owned());"

