# Paced delivery (3.0.7, `chief-meeting`): a board message goes into a window once, and its
# arrival is proven from the harness's own record. A message Claude Code takes into a turn
# under way is the user's item of its record, which begins no turn (CMT-02): a human's alone,
# in the main conversation, its words a text or blocks. A message is typed in only once the
# window has read at rest, from a record that was read, on one last item, for the settle, the
# human's keys quiet as long, and a fresh look before the paste reads it so (CMT-03 to CMT-06);
# a member's question goes first (CMT-07); the looks are in the events (CMT-08); a record that
# holds the header after the hand-over is never pasted over (CMT-23). One plant takes one rule
# out; a test of it fails.

[run]
# The Claude reader's own tests: what each record says of a turn.
pacing-claude-reader = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record"]
# The engine's pacing and arrival cases (`tests/dispatcher/pacing.rs`, `unproven.rs`, `still_there.rs`, `quoted_headers.rs`).
pacing-kit = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "--", "pacing::", "unproven::", "still_there::", "quoted_headers::"]
# The ledger's order of a queue.
pacing-ledger = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "questions_first"]
# Codex's broker, and what its window makes of it.
pacing-broker = ["cargo", "test", "--offline", "-p", "cf-codex-session", "--lib", "broker::tests::delivery"]
pacing-codex = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "codex::windows"]
# Pi's channel.
pacing-pi = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "pi::"]
# The pane host's count of the human's keys.
pacing-panes = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "arbiter"]
# A Claude chief whose cancelled compact left `/compact` in its box (the regression's).
pacing-compact = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "--", "a_claude_chief_whose_compact_the_human_cancelled_is_at_rest_and_is_handed_its_workers_result_alone"]
pacing-rig-lists = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "--", "reports::a_platform_attribute_in_a_suites_list_sits_on_the_mod_line_it_gates"]
pacing-gate-steps = ["cargo", "test", "--offline", "-p", "xtask", "--lib", "check::tests::"]

