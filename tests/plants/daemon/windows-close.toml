# A worker's window that closed in the middle of its task (the owner's report of 2026-10-15,
# B2, ConsensFlow 3.0.3 or 3.0.4 on their Windows machine: T-18 paused, "window closed", its
# worker very likely a Devin, and no logs). Which way the window ended is not known; what is
# ConsensFlow's stands in 3.0.5, each held by tests:
#
# - the pause note of a task whose window ended under it says how the window's program ended
#   and what its screen showed last, as far as the pane host said, and what the close ended
#   between the two (`crates/cf-engine/src/dispatcher.rs`, `shown.rs`): the next report shows
#   the cause;
# - a line of a screen that names a secret is not quoted, nor are the rows beside it (a value
#   wraps onto the next row), nor, where its value may go on over rows, the rest of the screen,
#   nor a private key's block; the other lines are quoted through the masker and the note says
#   how many were left out, in a pause note and a launch's failure alike. A screen of nothing
#   else says its lines were left out, and keeps the exit code (the lead's decision of
#   2026-10-16, which left the whole screen out for one line, and T-823, which does not;
#   `shown/secret.rs`, `shown.rs` `without_secrets`);
# - an exit above 128 names the signal it is, and a close the engine had no part in says that
#   the signal was not ConsensFlow's; the note names the last tool call the window's record
#   shows, masked and cut short (T-823, kluris T-153: exit 143, "its last screen lines named a
#   secret", and no cause); A password, `pwd`, an API or private key, a
#   credential is named anywhere in a name, whatever its case or split (`PassWord`,
#   `MYSQL_PWD`), and API keys in the plural (round 5); a secret, a token, auth, bearer only as
#   a word or a part of a name, never as a piece of a word such as `author`; blanks are nothing
#   but what parts words;
# - a Windows status (a crash, a console's Ctrl+C) is written as Windows writes it, in hex;
# - the work of the windows that go with a project when its chief's window closes by itself
#   says so, with how the chief's window ended and what it showed last: a worker's own crash
#   and its chief's read the same before;
# - a window the engine closed itself (the human's Close, the chief's) says nothing of how the
#   kill ended its program, which the host says while the kill is answered;
# - the late exit of a window the engine closed itself pauses nothing its session was given
#   meanwhile: what was given waits, queued, for the next window (held already; the plant shows
#   the test would see it otherwise);
# - a window's output ends only for good (`crates/cf-panes/src/pty/output_end.rs`): on Unix not
#   while its program runs, for a terminal it let go of may be opened again; the reader asks
#   whether the program has gone on a schedule of its own, whatever it reads, for a helper the
#   program left can hold the terminal silent (Sol's sequence) or write to it without a pause
#   (round 3); once the program has gone, what the terminal still has is read before the output
#   ends (Astra's race), for a second at most; on Windows when its console host has gone;
# - the daemon is told a window closed only on proof that its program has gone (its status
#   read, or the system's word that it was reaped): a pane out of the table is none, for a close
#   takes it out before it has ended its programs. A program that outlived its output is ended
#   as a close ends one, on a thread of its own, and the proof is waited for until a bound of
#   thirty seconds and no longer (a close waits for the exit with no bound: round 5); then the
#   daemon is told the program could not be ended (`survivor`), and the note says it may still
#   run. Nothing refuses a window of the same name (round 5: a registry of such programs could
#   refuse one for ever, and forgot them on a restart).
#
# The case of the rig is `crates/cf-e2e/tests/regressions/devin_window_closed_mid_task.rs`: the
# real daemon and pane host on a stand-in Devin that ends its program with the code 3 in the
# middle of its task, after its last words. Its run builds the native `cf` from the sources as
# they are planted, so its plant says `builds`. One plant takes one rule out; a test fails.
#
# **Windows.** The handoff of a window whose console host died is held on Windows by the test
# of the pane handlers (`pane_handlers::windows_tests`), which ends the host of a pane whose
# program let go of its console and asks whether the program runs at the moment the host hands
# `pane.exit` to the bridge (`EXIT_HANDED`). The three plants of the handoff (`windows close: a
# program that outlived`, `the daemon is told before`, `the host tells`) are caught by it on
# zeewin, and on a Mac by the tests of the table and of the headless helper:
# `cargo xtask windows --host zeewin -- cargo xtask plants daemon "windows close: the host
# tells"`, and so on for the other two.
#
# - the windows a pane host still has open when its peer ends its input are ended with it, and it
#   tells the exit of each, with what the window left running, before it closes its own output
#   (`crates/cf-panes/src/headless.rs`, `shut_down`; the bridge keeps its output past the end of its
#   input for it, `crates/cf-bridge/src/lib.rs`): the long run's final drain learns what each window
#   left from them, as it learns of a window that ended before. The host waits for the exits it owes
#   three seconds at most (`FAREWELL`) and for what it told to be written two (`FLUSH`), and a peer
#   that reads nothing is not waited for any longer (3.0.6, item 8). The daemon is not told: both
#   ends of a stop end the daemon's input first, and a daemon whose input has ended handles no event.
#   The case of the rig is `crates/cf-e2e/tests/rig/last_exits.rs`, which builds the pane host from
#   the sources as planted, so its plants say `builds`.
#
# - the stand-in Codex's plugin servers and workers write their process whole from the moment their
#   file is there (`cf_e2e::files::say_its_process`, in `crates/cf-e2e/src/files.rs`, which the
#   stand-in agent's jobs and builds use too), and the case that waits for the
#   file waits for a number (`stand_ins::pid_in`): the flake of `ParseIntError`, an empty file read
#   between its making and its writing (3.0.6, item 8).
#
# Every name holds `windows close`, so `npm run plants:daemon -- "windows close"` runs them all.

[run]
engine-shown = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "shown::"]
engine-windows = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "windows::"]
engine-assigning = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "assigning::"]
engine-closing = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "closing::"]
engine-unstarted = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "unstarted::"]
engine-window-closes = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "window_closes::"]
headless-reopened = ["cargo", "test", "--offline", "-p", "cf-panes", "--test", "headless", "a_program_that_lets_go_of_its_terminal_and_opens_it_again_is_read_on_and_not_ended"]
headless-orphan = ["cargo", "test", "--offline", "-p", "cf-panes", "--test", "headless", "a_program_that_exits_while_an_orphan_holds_its_terminal_is_told_closed"]
headless-orphan-writes = ["cargo", "test", "--offline", "-p", "cf-panes", "--test", "headless", "a_program_that_exits_while_an_orphan_writes_on_to_its_terminal_is_told_closed"]
headless-cleans-up = ["cargo", "test", "--offline", "-p", "cf-panes", "--test", "headless", "a_window_closed_while_its_program_cleans_up_is_told_closed_once_the_program_has_gone"]
panes-output-end = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "pty::output_end::"]
panes-handlers-windows = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "pane_handlers::windows_tests::"]
rig-regression-devin-window-closed = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "devin_window_closed_mid_task::"]
# A host shut down with windows open, its peer's input ended: it tells their exits before its output ends.
headless-shut-down = ["cargo", "test", "--offline", "-p", "cf-panes", "--test", "headless", "a_host_shut_down_with_windows_open"]
# A host whose peer reads nothing, or is gone, shuts down within its bounds.
headless-peer-reads-nothing = ["cargo", "test", "--offline", "-p", "cf-panes", "--test", "headless", "a_host_whose_peer_reads_nothing"]
# The exits a table owes, and is waited on for.
panes-lib-owed = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "pty::owed::"]
# The bridge that keeps its output past the end of its input, and the one that does not.
bridge-lib-kept-output = ["cargo", "test", "--offline", "-p", "cf-bridge", "--lib", "--", "keeps_its_output", "does_not_keep_its_output", "reads_nothing_gives_up", "an_output_the_bridge_kept"]
# The last word of a closed rig: every exit the pane host told, the windows open as it closed among them.
rig-last-exits = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "last_exits::"]
# The stand-in Codex's servers and workers, and the pid files they write.
rig-stand-in-codex = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "stand_in_codex::"]

