meant = "a_host_whose_peer_reads_nothing_shuts_down_within_its_bounds"
runs = ["headless-peer-reads-nothing"]

[[plant.edit]]
file = "crates/cf-panes/src/headless.rs"
find = "const FLUSH: Duration = Duration::from_secs(2);"
replace = "const FLUSH: Duration = Duration::from_secs(3600);"

# The bridge that keeps its output past the end of its input.

[[plant]]
name = "windows close: a bridge that keeps its output refuses what it is told after its input ends"
meant = "a_bridge_that_keeps_its_output_says_what_is_left_after_its_input_ends_and_ends_it_on_request"
runs = ["bridge-lib-kept-output", "headless-shut-down"]

[[plant.edit]]
file = "crates/cf-bridge/src/lib.rs"
find = "            && (!self.keeps_output || self.output_ended.load(Ordering::Acquire))"
replace = "            && true"

[[plant]]
name = "windows close: a bridge that does not keep its output keeps it"
meant = "a_bridge_that_does_not_keep_its_output_ends_it_with_its_input"
runs = ["bridge-lib-kept-output"]

[[plant.edit]]
file = "crates/cf-bridge/src/lib.rs"
find = "self.close_transport(BridgeError::Eof, false, self.inner.keeps_output);"
replace = "self.close_transport(BridgeError::Eof, false, true);"

[[plant]]
name = "windows close: a bridge that ends its output waits for a peer that reads nothing"
meant = "ending_the_output_of_a_peer_that_reads_nothing_gives_up_after_its_time"
runs = ["bridge-lib-kept-output"]

[[plant.edit]]
file = "crates/cf-bridge/src/lib.rs"
find = '''
        let flushed = self.wait_for_the_writer(deadline);
        self.cut_output();
        flushed'''
replace = '''
        let flushed = self.wait_for_the_writer(deadline);
        flushed'''

[[plant]]
name = "windows close: a failed write leaves the output a bridge kept open"
meant = "a_failed_write_ends_an_output_the_bridge_kept"
