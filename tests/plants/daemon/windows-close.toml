# The stand-in Codex's pid files.

[[plant]]
name = "windows close: the stand-in Codex's file is there before it holds the process"
meant = "the_stand_in_codexs_plugin_server_and_worker_write_their_process_whole_or_not_at_all"
runs = ["rig-stand-in-codex"]

[[plant.edit]]
file = "crates/cf-e2e/src/bin/fake_codex/servers.rs"
find = '''
    let writing = format!("{file}.pid.writing");
    fs::write(&writing, std::process::id().to_string())?;
    fs::rename(writing, format!("{file}.pid"))'''
replace = '''
    let mut made = fs::File::create(format!("{file}.pid"))?;
    thread::sleep(Duration::from_millis(300));
    made.write_all(std::process::id().to_string().as_bytes())'''

[[plant]]
name = "windows close: the stand-in Codex's worker never says its process"
meant = "the_stand_in_codexs_plugin_server_leads_a_group_of_its_own_and_starts_its_workers_when_a_tool_is_called"
runs = ["rig-stand-in-codex"]

[[plant.edit]]
file = "crates/cf-e2e/src/bin/fake_codex/servers.rs"
find = '''
    if let Err(failed) = say_its_process(file) {
        return refuse(&failed.to_string());
    }
    thread::sleep(Duration::from_secs(seconds));'''
replace = "    thread::sleep(Duration::from_secs(seconds));"
