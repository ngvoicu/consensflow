# New project holds every section Project settings holds (T-1268, Gabriel, 2026-11-06: New project does
# not offer the settings Project settings has, so a project starts without its rules). The page's
# `project-sections` template holds the rules for the staff, the compaction, Human approval, Wake-up
# calls, Specs and Computer use, and both dialogs build them from it; New project starts with what the
# human set in them in the one write that makes the project (`project.open` takes `rules` and
# `compaction`), holds the start back where a section holds what no project can start with, and reads
# computer use for the folder picked (`computer_use.get` takes a `directory`). One plant takes one rule
# out; a test of it fails. Every name holds `new project sections`.

[run]
nps-page = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "New project"]
nps-ledger = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "opened_with"]
nps-daemon-opening = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::opening"]
nps-daemon-computer-use = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::computer_use"]

[[plant]]
name = "new project sections: a section is put back into Project settings' own form"
meant = "New project holds every section Project settings holds, in its order, but those named with a reason"
runs = ["nps-page"]

[[plant.edit]]
file = "app/ui/index.html"
find = '''
      </fieldset>
      <div data-project-sections></div>
      <div class="dialog-actions">
        <button class="quiet-button" type="button" value="cancel">Close</button>'''
replace = '''
      </fieldset>
      <fieldset class="project-section"><legend>Only here</legend></fieldset>
      <div data-project-sections></div>
      <div class="dialog-actions">
        <button class="quiet-button" type="button" value="cancel">Close</button>'''

