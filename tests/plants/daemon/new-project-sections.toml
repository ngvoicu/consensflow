file = "app/ui/index.html"
find = '''
      </fieldset>
      <div data-project-sections></div>
      <div class="dialog-actions">
        <button class="quiet-button" type="button" value="cancel">Close</button>'''
replace = '''
      </fieldset>
      <fieldset class="project-section"><legend>Only here</legend></fieldset>
      <div data-project-sections></div>
      <div class="dialog-actions">
        <button class="quiet-button" type="button" value="cancel">Close</button>'''

