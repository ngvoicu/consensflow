# A member held for its account says which, billing or login, and the harness's own words, from
# the hold it keeps (the owner's field find, 2026-11-22, T-2010): the hold's `member.out` event
# keeps them (`mark_out_saying`), the board says them (`outBecause`, `page_reads::board`), and
# Pi's refusals are read for what they are: a limit that resets is never billing or login, and
# a login Pi 1.6.1 could not refresh is a login.
#
# Every name holds `held words`, so `cargo xtask plants daemon "held words"` runs them all.

[run]
held-words-ledger = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "hold_words"]
held-words-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "unavailable_accounts::"]
held-words-n35 = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "n35_hold::a_task_that_failed_on"]
held-words-pi = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "pi::record::tests::steps"]
held-words-quota = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::quota::tests::a_quota_refusal"]
held-words-muse = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "muse::record::tests::provisional"]

[[plant]]
name = "held words: the hold keeps none of the harness's words"
meant = "the_board_says_the_words_a_hold_was_made_from"
runs = ["held-words-ledger"]

[[plant.edit]]
file = "crates/cf-ledger/src/staff/quota.rs"
find = 'event["because"] = json!(because);'
replace = 'let _ = because;'

[[plant]]
name = "held words: the engine marks an account's refusal out with none of its words"
meant = "keeps_the_harnesss_words_with_the_hold_for_the_board_to_say"
runs = ["held-words-engine"]

[[plant.edit]]
file = "crates/cf-engine/src/dispatcher.rs"
find = "Some(Unwell::Account(because) | Unwell::Moved(because)) => self"
replace = "Some(Unwell::Account(_) | Unwell::Moved(_)) if true => self\n                .seams\n                .ledger\n                .borrow_mut()\n                .mark_out_with_kind(owner.id, &reset, hold, kind)?,\n            Some(Unwell::Account(because) | Unwell::Moved(because)) => self"

[[plant]]
name = "held words: Pi reads a limit that resets as billing because its words name a billing page"
meant = "pi_reads_each_providers_refusal_for_what_it_is"
runs = ["held-words-pi"]

[[plant.edit]]
file = "crates/cf-harness/src/shared/quota/patterns.rs"
find = "r\"(?i-u:billing_error|requires more credits|credit balance is too low|insufficient_quota)\""
replace = "r\"(?i-u:billing|requires more credits|credit balance is too low|insufficient_quota)\""

[[plant]]
name = "held words: Pi reads an account's spent quota as a limit that resets"
meant = "pi_reads_each_providers_refusal_for_what_it_is"
runs = ["held-words-pi"]

[[plant.edit]]
file = "crates/cf-harness/src/pi/record.rs"
find = "let refusal = account_refusal(&failure, None);"
replace = "let refusal = account_refusal(&failure, None).filter(|_| !refused_for_quota(&failure));"

[[plant]]
name = "held words: Pi reads a login it could not refresh as nothing"
meant = "pi_reads_each_providers_refusal_for_what_it_is"
runs = ["held-words-pi"]

[[plant.edit]]
file = "crates/cf-harness/src/shared/quota/patterns.rs"
find = "|invalid_grant|session expired \\(status 40[13]\\))|token refresh request failed\\.[^\\n]*status=401(?-u:\\b)\""
replace = ")\""

[[plant]]
name = "held words: Pi reads a refresh refused for a moment as a login refused"
meant = "pi_reads_each_providers_refusal_for_what_it_is"
runs = ["held-words-pi"]

[[plant.edit]]
file = "crates/cf-harness/src/shared/quota/patterns.rs"
find = "refresh failed \\(401\\)|invalid_grant"
replace = "refresh failed \\(50[0-9]\\)|refresh failed \\(401\\)|invalid_grant"

[[plant]]
name = "held words: an expired access token is read as a refused login"
meant = "an_expired_access_token_is_no_refused_login_but_a_refused_refresh_a_bad_key_and_a_bare_401_are"
runs = ["held-words-quota", "held-words-pi", "held-words-muse"]

[[plant.edit]]
file = "crates/cf-harness/src/shared/quota.rs"
find = "_ if access_token_expired(text) => None,"
replace = "_ if false => None,"


[[plant]]
name = "held words: an expired token beside a revoked key is read as nothing"
meant = "an_expired_access_token_is_no_refused_login_but_a_refused_refresh_a_bad_key_and_a_bare_401_are"
runs = ["held-words-quota"]

[[plant.edit]]
file = "crates/cf-harness/src/shared/quota/patterns.rs"
find = 'invalid_grant|refresh[_ ]token|refresh (?:request )?failed|invalid x-api-key|invalid[_ ]api[_ ]key|revoked|'
replace = 'invalid_grant|refresh[_ ]token|refresh (?:request )?failed|invalid x-api-key|invalid[_ ]api[_ ]key|'

[[plant]]
name = "held words: an expired token beside a refresh token is read as nothing"
meant = "an_expired_access_token_is_no_refused_login_but_a_refused_refresh_a_bad_key_and_a_bare_401_are"
runs = ["held-words-quota"]

[[plant.edit]]
file = "crates/cf-harness/src/shared/quota/patterns.rs"
find = 'invalid_grant|refresh[_ ]token|refresh (?:request )?failed|'
replace = 'invalid_grant|refresh (?:request )?failed|'

[[plant]]
name = "held words: an expired token beside words that tell the person to log in is read as nothing"
meant = "an_expired_access_token_is_no_refused_login_but_a_refused_refresh_a_bad_key_and_a_bare_401_are"
runs = ["held-words-quota"]

[[plant.edit]]
file = "crates/cf-harness/src/shared/quota/patterns.rs"
find = '|/login|log ?in again|sign(?:ing)? in again|please (?:log|sign) ?in)'
replace = ')'

[[plant]]
name = "held words: Pi's Meta session that needs a new login is read as nothing"
meant = "an_expired_access_token_is_no_refused_login_but_a_refused_refresh_a_bad_key_and_a_bare_401_are"
runs = ["held-words-quota"]

[[plant.edit]]
file = "crates/cf-harness/src/shared/quota/patterns.rs"
find = '|session expired \(status 40[13]\))'
replace = ')'

[[plant]]
name = "held words: a refusal's words reach the ledger unscreened"
meant = "a_refusal_that_names_a_key_or_a_login_is_kept_with_none_of_its_words_and_says_which_it_was"
runs = ["held-words-engine"]

[[plant.edit]]
file = "crates/cf-engine/src/dispatcher.rs"
find = '''
        let screened = reported.as_deref().map(crate::shown::screened_hold);
        let unwell = Unwell::of(screened.as_ref());
        // A busy model is tried again'''
replace = '''
        let screened = reported.as_deref().cloned();
        let unwell = Unwell::of(screened.as_ref());
        // A busy model is tried again'''

[[plant]]
name = "held words: the tries end on an expired token and say nothing of the login"
meant = "a_task_that_failed_on_an_expired_token_says_what_the_person_does_in_one_sentence"
runs = ["held-words-n35"]

[[plant.edit]]
file = "crates/cf-engine/src/turn_retry.rs"
find = 'if cf_harness::records::access_token_expired(said) {'
replace = 'if false {'

[[plant]]
name = "held words: an edit that renames the member loses the hold's words"
meant = "an_edit_that_keeps_the_hold_and_renames_the_member_keeps_the_holds_words"
runs = ["held-words-ledger"]

[[plant.edit]]
file = "crates/cf-ledger/src/page_reads.rs"
find = 'names.extend(serde_json::from_str::<Vec<String>>(&former).unwrap_or_default());'
replace = 'let _ = former;'
