# The three board-CLI reports of Gabriel's other board (T-1118): a follow-up of a task whose
# result is in waits for its acceptance; the copy of a window is in the order its items came, so
# `cf task get --transcript` shows the newest last even after a record shrank; and a task's title
# changes with `--title` on `cf task edit`, `reopen` and `resume`, `edit` taking it alone in any
# state. One plant takes one rule out, and a test of it fails.
#
# Every name holds `cli reports 1118`, so `cargo xtask plants daemon "cli reports 1118"` runs them
# all, and `... "cli reports 1118 follow-up"`, `... "cli reports 1118 copy"` or `... "cli reports
# 1118 title"` one report's.

[run]
bcr-ledger-follow-up = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "follow_up_of_a_done_task"]
bcr-rig-done-task = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_follow_up_waits_for_the_done_task"]
bcr-ledger-receipt-decided = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "decided::"]
bcr-ledger-receipt-behind-work = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "behind_work::"]
bcr-ledger-receipt-sessions = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "sessions::"]
bcr-daemon-routes-tasks = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "routes::tasks"]
bcr-engine-follow-ups = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "follow_ups"]
bcr-ledger-order = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "transcript_order"]
bcr-engine-transcript-whole = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "transcript_whole"]
bcr-ledger-retitle = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "retitle"]
bcr-daemon-verbs = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "routes::task::tests::verbs"]
bcr-cf-lib-task = ["cargo", "test", "--offline", "-p", "cf", "--lib", "board::task"]
bcr-cf-help = ["cargo", "test", "--offline", "-p", "cf", "--test", "help"]
bcr-engine-text-roles = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text", "roles"]

