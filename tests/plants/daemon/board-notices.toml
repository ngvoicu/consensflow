# What a board's reader is told, in what order and how often (3.0.7-alpha.2, T-1113; the field board
# of 2026-11-02). The chief is given its notes one at a time, the oldest first, so the order a step
# writes them in is the order the chief reads them in:
#
# - a task the daemon gives up on is told to its requester in one note, the failure first, with the
#   tasks that wait for it and were asked for by the same requester named in it (it was two notes,
#   the waiting task's first, a millisecond apart: the chief acted on the consequence with the cause
#   unknown and was given the cause a turn later, as news it had dealt with);
# - a member's removal is told before the tasks that waited on its work (the same inversion);
# - a user's item of the harness's own words (Claude Code's `<task-notification>`, which wakes the
#   chief when a background command ends) is copied as the harness's, so the wake-up calls do not
#   take it for the human typing to the chief: nothing had moved on the board between a project's
#   second and third wake-up, and the notice was the whole of the "news".
#
# One plant takes one rule out; a test of it fails. Every name holds `board notices:`, so
# `npm run plants:daemon -- "board notices:"` runs them all.

[run]
bn-ledger-cause-first = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "cause_first"]
bn-engine-wake-ups = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "wake_ups::what_the_harness"]
bn-engine-copy = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "transcripts::"]

# --- a task given up on: the failure first, and one note ---

[[plant]]
name = "board notices: a task given up on is told to its requester after the tasks that wait for it"
meant = "a_task_the_daemon_gives_up_on_is_told_to_its_requester_before_the_task_that_waits_for_it"
runs = ["bn-ledger-cause-first"]

[[plant.edit]]
file = "crates/cf-ledger/src/tasks/finishing.rs"
find = "        if store.participant_row(waiter.requester_id)?.handle == requester {"
replace = "        if false && store.participant_row(waiter.requester_id)?.handle == requester {"

[[plant.edit]]
file = "crates/cf-ledger/src/tasks/finishing.rs"
find = "        if named == Some(requester.handle.as_str()) {"
replace = "        if false {"

[[plant.edit]]
file = "crates/cf-ledger/src/tasks/finishing.rs"
find = "        if given_up {\n            let words = failed(told.waiting_for_the_reopen(None));"
replace = "        if given_up && false {\n            let words = failed(told.waiting_for_the_reopen(None));"

[[plant.edit]]
file = "crates/cf-ledger/src/tasks/finishing.rs"
find = "        task_by_id(store, task.id)\n    })\n}\n\n/// The human takes finished tasks off the board for good"
replace = "        if given_up {\n            send(\n                store,\n                project_id,\n                &Sent {\n                    to: &requester.handle,\n                    task: Some(number),\n                    kind: \"note\",\n                    body: &failed(told.waiting_for_the_reopen(None)),\n                    ..Sent::default()\n                },\n            )?;\n        }\n        task_by_id(store, task.id)\n    })\n}\n\n/// The human takes finished tasks off the board for good"

[[plant]]
