# A resumed Devin window in full permission (the field report B1 of 2026-10-15,
# ConsensFlow 3.0.4 on Windows: a Devin worker resumed after the app's quit had every
# write, shell and `cf` call come back "Tool execution was rejected: User skipped this
# tool call"). Devin's `--resume` of a session the quit cut in its first turn drops
# `--permission-mode dangerous` and comes up in its normal mode, where a prompt file's
# calls are refused and a pasted turn's wait at a dialog. The fix: a resumed window's
# first message goes behind `/bypass` (the Devin adapter's `first_message`); no Devin
# window is ready for a delivery while its wire says the normal mode, and it is given
# `/bypass` once drawn (`ready`, by the mode the wire log reads); one still in that mode
# after its time is unfit for work, and the engine gives its launch up on the board
# (`give_up_unfit`).
#
# The case of the regressions is `crates/cf-e2e/tests/regressions/
# a_resumed_devin_worker_skipped_every_call.rs`: the real daemon and pane host on the
# stand-in Devin, which does what Devin 3000.11.92 did; its run builds the native `cf`
# from the sources as they are planted, so its plants say `builds`. The other plants run
# the adapter's, the wire log's, the launch goldens' and the engine's tests. One plant
# takes one rule out; a test of it fails.
#
# Every name holds `devin resume`, so `npm run plants:daemon -- "devin resume"` runs them all.

[run]
# The Devin adapter's own tests, and its wire log's.
harness-lib-devin = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "devin::"]
# The shared record reader's tests: the JSONL file read on, and a transcript followed.
harness-lib-record = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::record::"]
# The launch goldens, each harness's scenarios played.
harness-launch-scenarios = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "scenarios::"]
# A window that says it never will be ready, in the engine.
engine-dispatcher-unfit = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "unfit::"]
# B1's case, found by the start of its module's name.
rig-regression-resumed-devin = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_resumed_devin_worker_skipped_every_call::"]
# A member's launch that was to say its role first, in the engine.
engine-dispatcher-role-launch = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "role_change::launch::"]
# The stand-in Devin resumed in its normal mode, its readiness the product's own.
rig-live-member-readiness = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "live_member::a_window_cut_in_its_first_turn"]
# The live checks' own support: the launch without the owner's hooks, and the machine's processes.
e2e-lib-window = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::window::"]
# How the live checks find and end their window's command: through the pane host's seam,
# and through the real pane host on the stand-in Devin.
e2e-lib-command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::members::command::"]
e2e-lib-descent = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::members::descent::"]
# The readiness relay of the live checks, and the live suite's own rules.
e2e-lib-ask-readiness = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::ask::readiness::"]
live-suite-units = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_devin_resume"]
rig-live-member-work = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "live_member::the_check_ends"]
# The other live suites that ended what a window ran by a mark (round 6): what each now
# chooses to end, of a window's own tree.
live-finish-leaving = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_finish", "leaving::tests::"]
# Round 7: the window's process, read as the pane host answers its open, and kept.
e2e-lib-rig = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "rig::"]
live-stops-stuck = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_stops", "stuck::"]

