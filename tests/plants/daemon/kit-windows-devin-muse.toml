# The live kit gives Devin and Muse Code a home of the run's own on Windows (T-1084). Until then the
# kit had no row for them there (`Harness::Devin | Harness::Muse => None`), so a live case that
# seated either on a Windows machine ran on the owner's own folders: Devin's config, its sessions and
# the folders it trusts. One plant takes one rule out; a test of it fails. The tests are path arithmetic
# over a profile laid out as Windows lays it (`live/isolation/windows.rs`), so a Mac catches them; the
# arms that pick a plan by the system are caught on Windows alone. Every name holds `kit windows`.
#
# Devin's rules, found on zeewin2 with test files only: it ignores the XDG variables and `APPDATA`, and
# the system's known folders it finds its own by expand `%USERPROFILE%` from the window's environment
# (and fail with "path not found" where the folders below it are missing); the daemon reads Devin's
# sessions by `APPDATA` first.

[run]
windows-lib = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::isolation::windows::"]

# ---------------------------------------------------------------------------- Devin: the variables

[[plant]]
name = "kit windows: Devin's window keeps the owner's profile, which is where it finds its folders"
meant = "a_devin_run_on_windows_is_given_a_profile_of_its_own_and_the_three_variables_that_name_it"
runs = ["windows-lib"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/isolation.rs"
find = '''                ("USERPROFILE", profile),
'''
replace = ''''''

[[plant]]
name = "kit windows: the daemon reads Devin's sessions in the owner's Roaming folder"
meant = "a_devin_run_on_windows_is_given_a_profile_of_its_own_and_the_three_variables_that_name_it"
runs = ["windows-lib"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/isolation.rs"
find = '''                ("APPDATA", roaming.clone()),
'''
replace = ''''''

[[plant]]
name = "kit windows: Devin's cache is the owner's Local folder"
meant = "a_devin_run_on_windows_is_given_a_profile_of_its_own_and_the_three_variables_that_name_it"
runs = ["windows-lib"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/isolation.rs"
find = '''                ("LOCALAPPDATA", local),
'''
replace = ''''''

[[plant]]
name = "kit windows: the profile's AppData folders are not made, and the known-folder call fails"
meant = "a_devin_run_on_windows_is_given_a_profile_of_its_own_and_the_three_variables_that_name_it"
runs = ["windows-lib"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/isolation.rs"
find = '''            folders: vec![roaming.clone(), local.clone()],'''
replace = '''            folders: Vec::new(),'''

[[plant]]
name = "kit windows: Devin's variables take HOME from the person"
meant = "a_devin_run_on_windows_keeps_the_owners_home_for_what_reads_it_by_home"
runs = ["windows-lib"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/isolation.rs"
find = '''                ("USERPROFILE", profile),
'''
replace = '''                ("HOME", profile.clone()),
                ("USERPROFILE", profile),
'''

# ---------------------------------------------------------------------------- Devin: what is copied

[[plant]]
name = "kit windows: a run with no Devin login on the machine goes on"
meant = "a_devin_login_that_is_not_there_stops_the_run_naming_the_file_before_anything_is_made"
runs = ["windows-lib"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/isolation.rs"
find = '''                    to: roaming.join("devin").join("credentials.toml"),
                    login: true,'''
replace = '''                    to: roaming.join("devin").join("credentials.toml"),
                    login: false,'''

[[plant]]
name = "kit windows: a run with no Devin config on the machine stops"
meant = "a_devin_config_that_is_not_there_is_no_reason_to_stop"
runs = ["windows-lib"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/isolation.rs"
find = '''                    to: roaming.join("devin").join("config.json"),
                    login: false,'''
replace = '''                    to: roaming.join("devin").join("config.json"),
                    login: true,'''

[[plant]]
name = "kit windows: Devin's config is not copied to the run's Roaming folder"
meant = "a_devin_run_on_windows_copies_its_login_and_config_to_the_roaming_folder_and_nothing_else"
runs = ["windows-lib"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/isolation.rs"
find = '''                    to: roaming.join("devin").join("config.json"),'''
replace = '''                    to: roaming.join("devin-config").join("config.json"),'''

[[plant]]
name = "kit windows: Devin's login is copied to a folder Devin does not read"
meant = "a_devin_run_on_windows_copies_its_login_and_config_to_the_roaming_folder_and_nothing_else"
runs = ["windows-lib"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/isolation.rs"
find = '''                    to: roaming.join("devin").join("credentials.toml"),'''
replace = '''                    to: roaming.join("devin-login").join("credentials.toml"),'''

