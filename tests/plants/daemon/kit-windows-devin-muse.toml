# ---------------------------------------------------------------------------- Devin: the arm (Windows)

[[plant]]
name = "kit windows: Devin has no home of the run's own on Windows again"
meant = "on_windows_devin_has_a_home_of_the_runs_own_made_from_the_machines_roaming_folder"
runs = ["windows-lib"]
platforms = ["windows"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/isolation.rs"
find = '''                Some(Self::devin_on_windows(home, &roaming))'''
replace = '''                let _ = roaming;
                None'''

[[plant]]
name = "kit windows: Devin's home is copied from the profile's Roaming folder, not the machine's APPDATA"
meant = "on_windows_devin_has_a_home_of_the_runs_own_made_from_the_machines_roaming_folder"
runs = ["windows-lib"]
platforms = ["windows"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/isolation.rs"
find = '''                let roaming = machine("APPDATA")
                    .map_or_else(|| home.join("AppData").join("Roaming"), PathBuf::from);'''
replace = '''                let roaming = home.join("AppData").join("Roaming");'''
