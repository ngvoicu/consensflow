# A line of a harness's record torn for good (T-187, T-213, T-223, 2026-10-22): a short write
# leaves part of a record and the next append makes one line of it and itself, which is not JSON.
# The reader failed every look at the record from then on, as Node's did, and the engine read
# nothing more of the conversation: no delivery confirmed, no turn's end, no result, no copy. The
# rules (crates/cf-harness/src/shared/record/jsonl.rs): a torn line is passed over once a record
# follows it, and said once in the daemon's log by its file and record; one with nothing after it
# waits, the records before it read, for TORN_WAIT_MS, and is then passed over; an unterminated
# last line waits, whatever it holds. The cases are the reader's own
# (`shared::record::jsonl::tests`, `shared::record::followed::tests`) and the rig's
# `crates/cf-e2e/tests/regressions/a_torn_record_line_hid_the_rest_of_a_conversation.rs`, which
# builds the native `cf` from the sources as planted, so its plants say `builds`. Every name
# begins `torn line`, so `npm run plants:daemon -- "torn line"` runs them all.

[run]
base-append = ["cargo", "test", "--offline", "-p", "cf-base", "--lib", "file::append"]
base-append-processes = ["cargo", "test", "--offline", "-p", "cf-base", "--test", "append_processes"]
harness-codex-record = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "codex::record::tests"]
engine-lost-lines = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "lost_lines::"]
harness-claude-torn = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record::tests::torn"]
harness-launch-devin = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "devin::"]
harness-pi-steps = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "pi::record::tests::steps"]
rig-regression-torn-line = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_torn_record_line_hid_the_rest_of_a_conversation::"], builds = true }
harness-record-shared = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::record::"]

