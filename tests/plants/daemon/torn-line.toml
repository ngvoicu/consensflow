find = "        Err(_) if is_json_lossy(raw) => Err(cannot_hold(index)),\n"
replace = "        Err(_) if is_json_lossy(raw) => Err(cannot_hold(index)),\n        Err(_) if true => Err(Stop::Failed(format!(\"malformed JSONL at record {index}\"))),\n"

