name = "carried restart: a start lets go of what a carrier on its way carried, and the window is given the answers again after the paste that had them (main, 2026-10-16)"
meant = "answers_a_paste_carried_into_a_claude_workers_window_are_not_pasted_again_after_a_restart"
runs = ["rig-regression-carried-received"]
builds = true

