[[plant]]
name = "carried restart: a carrier queued again at a start lets go of what it carried"
meant = "rows_that_rode_in_a_paste_the_daemon_stopped_in_go_again_in_its_paste_when_the_record_does_not_show_it"
runs = ["ledger-receipt"]

[[plant.edit]]
file = "crates/cf-ledger/src/messages/delivery.rs"
find = '''
             WHERE id = ?1
               AND carried_by IN (SELECT id FROM message WHERE state NOT IN ('queued', 'gated'))",
            [message_id],
        )?;'''
replace = '''
             WHERE id = ?1
               AND carried_by IN (SELECT id FROM message WHERE state NOT IN ('queued', 'gated'))",
            [message_id],
        )?;
        store.db.execute(
            "UPDATE message SET carried_by = NULL WHERE carried_by = ?1 AND state = 'queued'",
            [message_id],
        )?;'''

