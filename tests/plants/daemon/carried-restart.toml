# What a paste carried, when the daemon stopped between the paste and its receipt (a review of
# 2026-10-16, GPT-6-Astra and GPT-6.1-Sol): the words that resume a task carry what was kept for its
# window (the answers to its questions), and the start that finds their carrier still on its way
# settles what it carried with it: received with it where the window's record shows the carrier's
# marker, queued again with it where it does not. Opening the ledger let go of the rows of a carrier
# that was `delivering`, which a start then pasted again on their own, or sent without their carrier.
# Only a carrier this ledger wrote is so: it froze the set at the first paste. A carrier an earlier
# build wrote may hold a row its recorded paste never had (Node pasted a carrier's own words alone;
# up to 3.0.4 a row could join a carrier that waited again after a late first paste), and migration
# 0019 lets go of what each carried, whatever its state, in the step that writes its version; each
# start reconciles the tasks of what the log says was let go of and not yet reconciled, and says so
# (the reviews of 2026-10-16 and 2026-10-17).
#
# The cases are `crates/cf-e2e/tests/regressions/rows_a_paste_carried_pasted_again_after_a_restart.rs`
# (the real daemon and pane host, a Claude worker and a Devin worker, the paste caught by the rig and
# the app started again on the same home) and the ledger's own, `crates/cf-ledger/tests/receipt/`
# (`carrying.rs`, and `legacy.rs` for the rows the Node daemon left). The rig's cases build the native
# `cf` from the sources as planted, so their plants say `builds`.
#
# Every name holds `carried restart`, so `npm run plants:daemon -- "carried restart"` runs them all.

[run]
# `ledger-receipt` (the ledger's receipt tests) is the kit's own.
rig-regression-carried-received = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "rows_a_paste_carried_pasted_again_after_a_restart::answers_a_paste_carried_into"]
rig-regression-carried-requeued = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "rows_a_paste_carried_pasted_again_after_a_restart::answers_a_paste_never_carried_into"]
# The rig's reader of Devin's store, which the Devin cases read the worker's record by.
rig-lib-devin-store = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "devin_store::"]
# The engine's start and the human's Resume after it.
engine-dispatcher-resume = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "resume::"]
# What a start does with what was on its way, the ledger opened again as a start opens it.
engine-dispatcher-restart = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "restart::"]

