# A pause never ends a window's work (T-1117: a worker's database tests in WSL were ended
# by the close of a window that ignored its pause). A window that ignored every round of
# a pause is closed only where its close would end nothing it started: what the host lists
# of its turn's work (`pane.background`, no answer counted as work), and the jobs and agents
# its harness's record says run. One that runs any is kept open, its task paused, the
# chief and the human told once (only deleting its session ends it sooner), asked again
# every ten seconds with no key, and given three fresh rounds once that work has ended; a
# window that ignores those too with nothing running is kept as well (T-1199: a pause never
# closes a window), its note saying what was checked. The engine's tests are `crates/cf-engine/tests/dispatcher/paused_left.rs`; the
# rig's case, `crates/cf-e2e/tests/regressions/
# a_pause_a_busy_worker_ignored_closed_its_window_and_ended_its_work.rs`, is the real
# daemon and pane host on a stand-in that leaves a job in its tree and takes no Escape.
#
# - a window that runs work is taken for one that runs nothing (the engine's tests, and the
#   rig's case);
# - a host that gives no answer is read as one that says nothing runs;
# - the jobs and the agents the harness's record counts are not counted;
# - a kept window is pressed while its work runs;
# - a kept window is never asked again, and stays kept after its work ended;
# - once its work ended, it is given no fresh rounds;
# - the chief is told again at each look; the human is not told;
# - the note of a window kept running nothing does not say what was checked;
# - the live kit's command matching (T-1117's kit fix);
# - T-1137: what the harness says it keeps running (Codex's background terminals, from its
#   broker's GET /terminals, which asks Codex's server) is not asked, or a harness that
#   cannot say is read as one that runs none; the broker's route, its reading of Codex's
#   list, the channel's route and the adapter's word; the kit's stuck script is found by
#   Node's line, and midtool's command by the count in its file.
#
# Every name holds `pause keeps work`, so `cargo xtask plants daemon "pause keeps work"`
# runs them all.

[run]
engine-dispatcher-paused-left = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "paused_left::"]
engine-dispatcher-stops-keeps = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "stops::"]
rig-regression-busy-pause = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_pause_a_busy_worker_ignored_closed_its_window_and_ended_its_work::"], builds = true }
cf-e2e-lib-runs-command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "a_line_runs_the_command"]
codex-session-terminals = ["cargo", "test", "--offline", "-p", "cf-codex-session", "terminals"]
harness-codex-channel = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "codex::channel"]
harness-launch-codex-kept = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "what_a_codex_window_keeps_running"]
live-stops-stuck-unit = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_stops", "stuck::"]
live-stops-tool-unit = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_stops", "midturn::tool::"]

