# What the chief is told of a task that failed, and in what order (3.0.7-alpha.2, T-1148; the
# field board of 2026-11-02, where "T-303 waits for T-302, which failed" reached the chief before
# "T-302 failed", T-1113 having fixed the ledger's own failure of a turn). The chief is given its
# notes one at a time, the oldest first, so the order they are written in is the order it reads
# them in. A task failed by a delivery that did not arrive (a launch that did not come up or never
# showed its first message, a brief or told words that never reached the window) was told to the
# chief with no word of the tasks that wait for it, and now:
#
# - the engine's note to the task's requester names the tasks that requester asked for that wait
#   for it, after the words of the failure, as the ledger's own note of a turn that failed does;
# - the requesters of the other waiters are told last, each in a note of its own, after every word
#   of the failure, the human's included.
#
# The engine's cases are `crates/cf-engine/tests/dispatcher/failure_first.rs`; the ledger's are
# `crates/cf-ledger/tests/receipt/waiting_after_failure.rs`; the rig's case is
# `crates/cf-e2e/tests/regressions/a_task_waiting_for_a_failed_one_was_told_to_the_chief_before_the_failure.rs`,
# whose run builds the native `cf` from the sources as they are planted.
#
# One plant takes one rule out; a test of it fails. Every name holds `failure first:`, so
# `npm run plants:daemon -- "failure first:"` runs them all.

[run]
ff-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "failure_first"]
ff-ledger = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "waiting_after_failure"]
ff-rig = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_task_waiting_for_a_failed_one_was_told_to_the_chief_before_the_failure::"], builds = true }

