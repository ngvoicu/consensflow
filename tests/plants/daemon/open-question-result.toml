# A window's result is delivered while a question of its task is still open (T-2197): a turn
# that ends settled, begun by a message that came after every open question was asked, is the
# task's result (`crates/cf-engine/src/turn_end.rs`, `went_past`); the ledger closes each open
# question with the result and names it there (`crates/cf-ledger/src/tasks/finishing.rs`).
#
# Every name holds `open question result`, so `npm run plants:daemon -- "open question result"`
# runs them all.

[run]
oqr-dispatcher = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "open_question_result::", "open_question_opening::"]

[[plant]]
name = "open question result: the result is held while a question is open"
meant = "a_result_is_delivered_when_the_first_of_two_questions_is_still_open"
runs = ["oqr-dispatcher"]

[[plant.edit]]
file = "crates/cf-engine/src/turn_end.rs"
find = '''task.filter(|thread| (thread.task.state == "working" || went_past) && !waiting)'''
replace = '''task.filter(|thread| (thread.task.state == "working") && !waiting)'''

[[plant]]
name = "open question result: the note is missing its number"
meant = "a_result_after_resume_words_closes_both_open_questions_and_names_them"
runs = ["oqr-dispatcher"]

[[plant.edit]]
file = "crates/cf-ledger/src/tasks/finishing.rs"
find = '''(ConsensFlow: m-{question} was left unanswered'''
replace = '''(ConsensFlow: a question was left unanswered'''

[[plant]]
name = "open question result: a turn that asked again is taken for a result"
meant = "a_turn_that_asks_again_after_an_answer_and_ends_on_it_is_still_a_wait"
runs = ["oqr-dispatcher"]

[[plant.edit]]
file = "crates/cf-ledger/src/messages/receipt.rs"
find = '''        if after {'''
replace = '''        if false && after {'''

[[plant]]
name = "open question result: a question is placed by the paste's order, not by when the answer was written"
meant = "an_answer_written_before_the_next_question_is_no_result_after_it"
runs = ["oqr-dispatcher"]

[[plant.edit]]
file = "crates/cf-ledger/src/messages/receipt.rs"
find = '''            (Some(asked), Some(written)) => asked > written,'''
replace = '''            (Some(asked), Some(_)) => paste.is_none_or(|paste| asked > paste),'''

[[plant]]
name = "open question result: a turn that ended in another pane is taken for a result"
meant = "a_real_hold_route_and_show_do_not_take_the_pre_exit_turn"
runs = ["oqr-dispatcher"]

[[plant.edit]]
file = "crates/cf-engine/src/turn_end.rs"
find = '''*message == pasted.id && was == now))'''
replace = '''*message == pasted.id && (was == now || true)))'''

[[plant]]
name = "open question result: a turn after a change of conversation is taken for a result"
meant = "returning_to_a_conversation_does_not_publish_the_stored_turn"
runs = ["oqr-dispatcher"]

[[plant.edit]]
file = "crates/cf-ledger/src/messages/receipt.rs"
find = '''        if conversation_changed_since(store, window, pasted.project_id, paste)? {'''
replace = '''        if false && conversation_changed_since(store, window, pasted.project_id, paste)? {'''

[[plant]]
name = "open question result: a turn with no words is taken for a result"
meant = "an_empty_following_turn_does_not_close_an_open_question"
runs = ["oqr-dispatcher"]

[[plant.edit]]
file = "crates/cf-engine/src/turn_end.rs"
find = '''if thread.task.state == "waiting" && !has_words(&answers.final_run) {'''
replace = '''if false && thread.task.state == "waiting" && !has_words(&answers.final_run) {'''

[[plant]]
name = "open question result: words on their way do not hold the result"
meant = "a_queued_answer_on_its_way_holds_the_result"
runs = ["oqr-dispatcher"]

[[plant.edit]]
file = "crates/cf-ledger/src/messages/receipt.rs"
find = '''        .exists(params![task, window])?
    {
        return Ok(Vec::new());
    }
    let Some(pasted)'''
replace = '''        .exists(params![task, window])? && false
    {
        return Ok(Vec::new());
    }
    let Some(pasted)'''

[[plant]]
name = "open question result: a paste before the close still begins the turn"
meant = "a_turn_that_ended_before_a_close_unlooked_at_is_no_result"
runs = ["oqr-dispatcher"]

[[plant.edit]]
file = "crates/cf-ledger/src/messages/receipt.rs"
find = '''    if run.is_some_and(|run| paste.is_none_or(|paste| paste < run)) {'''
replace = '''    if run.is_some_and(|run| paste.is_none_or(|paste| paste < run)) && false {'''

[[plant]]
name = "open question result: the result names questions it leaves open"
meant = "a_question_closed_by_the_result_is_closed_in_a_window_the_human_keeps_open"
runs = ["oqr-dispatcher"]

[[plant.edit]]
file = "crates/cf-ledger/src/tasks/finishing.rs"
find = '''                close_by_the_result(store, &task, &left)?;'''
replace = '''                let _ = &left;'''

[[plant]]
name = "open question result: a done task's refusal points elsewhere"
meant = "a_result_is_delivered_when_the_first_of_two_questions_is_still_open"
runs = ["oqr-dispatcher"]

[[plant.edit]]
file = "crates/cf-ledger/src/messages.rs"
find = '''            "To send words to its window, reopen the task: `cf task reopen T-{number} \"…\"`."
        ),'''
replace = '''            "To send words to its window, use `cf tell T-{number}`."
        ),'''
