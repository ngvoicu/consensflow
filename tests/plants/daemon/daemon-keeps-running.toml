# A daemon that stops under load is not the end of the board (Gabriel's field bug of 2026-11-09,
# T-1344): the Mac was at a load of 100 to 170, the daemon's passes took five seconds each and
# its windows' steps half a minute, the app's writer queue to the daemon (32 frames) filled, a
# full queue closed the bridge, the daemon's input ended, it exited 0, and the person was told
# to quit the app and open it again, which ends every window that is working.
#
# What stands against it:
#
# - the app's end of the bridge (`crates/cf-bridge/src/lib.rs`) never ends the transport for a
#   full queue: an event waits, a response waits at most `RESPONSE_WAIT_MS` and is dropped and
#   told of past it, and no more than `MAX_WAITING_RESPONSES` wait at once; its tests are
#   `queue_tests`;
# - the daemon's input is read on a thread of its own (`cf_bridge::local::read_ahead`), so a
#   pass that holds the daemon's one thread leaves nothing unread in the pipe;
# - a window a pass went on without is slow, and the passes after it do not wait for it again
#   (`crates/cf-engine/src/steps.rs`);
# - the app starts a daemon that stopped again, with its windows closed first, and asks the
#   person to quit only when the restarts do not hold (`app/src-tauri/src/daemon.rs`).

[run]
bridge-queue = ["cargo", "test", "--offline", "-p", "cf-bridge", "--lib", "queue_tests::"]
bridge-read-ahead = ["cargo", "test", "--offline", "-p", "cf-bridge", "--features", "local", "--lib", "local::tests::read_ahead::"]
daemon-input = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "start::tests::input::"]
engine-slow-window = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "unknown_looks::a_window_a_pass_went_on_without"]
app-daemon-restart = ["cargo", "xtask", "app", "test", "daemon::tests::"]

[[plant]]
name = "daemon keeps running: a response that does not get into the writer queue closes the transport"
meant = "a_response_that_waits_out_its_time_is_dropped_and_told_never_the_bridge"
runs = ["bridge-queue"]

[[plant.edit]]
file = "crates/cf-bridge/src/lib.rs"
find = '''
        if !admitted {
            self.tell_stall(&format!('''
replace = '''
        if !admitted {
            self.fail_transport(BridgeError::Io("bridge writer queue is full".to_string()));
            self.tell_stall(&format!('''

