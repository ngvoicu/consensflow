# The rules a human writes for a project's staff (spec smaller-contexts, SCX-12 to SCX-16,
# T-1012): kept in the ledger (`crates/cf-ledger/src/projects/staff_rules.rs`, migration 0025),
# written on the page alone (`project.rules`, Project settings' "Rules for the staff"), and given
# to every window of the project at the end of its text, whatever its harness, at its launch, on
# resume and by the note that says a role again (`crates/cf-engine/src/roles.rs`,
# `Dispatcher::role_text`). Each plant breaks one of these and the test written for it fails.
#
# Every name holds `staff rules`, so `npm run plants:daemon -- "staff rules"` runs them all.

[run]
harness-devin-adapter-lib = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "devin::adapter::tests::"]
ledger-rules = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "described", "rules::"]
ledger-rules-lib = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "projects::staff_rules::"]
ledger-testing-rules-lib = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "testing::staff_rules::"]
engine-text-rules = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text", "roles::", "--", "--skip", "goldens_roles"]
engine-role-change-lib = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "role_change::tests::"]
engine-dispatcher-rules = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "role_change::staff_rules::"]
daemon-rules-page = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::staff_rules"]
proto-page-rules = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "page::"]
page-rules = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "rules for the staff|rules for its staff"]

