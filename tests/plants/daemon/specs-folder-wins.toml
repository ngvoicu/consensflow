# A project's specs folder wins over the skill's (T-662, 2026-11-01, ConsensFlow 3.0.7; the live suite
# `specs` on Pi, `cf task get T-656` F2): a Pi chief of a project whose specs are in `docs/specs`
# wrote its spec and registry to `.specs`. The folder reached Pi correctly (the role text, through
# `--append-system-prompt`), but the bundled skill's own files call `.specs` the canonical folder in
# 35 places of `SKILL.md` alone, and the chief went by the skill. A role sentence cannot undo a skill
# that says the opposite, and an installed skill is never edited for one project: so the chief of a
# project whose folder is another is given ConsensFlow's own copy of the skill with the project's
# folder where the vendored files say `.specs`, kept beside the others under the folder's hash
# (`crates/cf-harness/src/shared/specmint.rs`), whether or not its harness has the variant
# installed, and its role text names that folder and no `.specs`
# (`crates/cf-engine/src/roles/specs.rs`).
#
# The cases are in `crates/cf-harness/src/shared/specmint/tests.rs` (every harness, every variant),
# each harness's `tests/launch/<harness>/specs.rs`, `crates/cf-engine/tests/dispatcher/specs.rs` and
# `roles/specs/tests.rs`, and the live suite's judge (`crates/cf-e2e/tests/live_specs/launched/`).
#
# Every name holds `specs folder`, so `cargo xtask plants daemon "specs folder"` runs them all.

[run]
specs-folder-shared = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::specmint"]
specs-folder-launch = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "whose_specs_are_in_another_folder"]
specs-folder-muse = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "muse::adapter"]
specs-folder-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "specs::"]
specs-folder-roles = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "roles::specs"]
specs-folder-live-judge = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_specs"]

[[plant]]
name = "specs folder: the copy a chief is given still says .specs where the project's folder is another (the field's)"
meant = "a_chief_of_a_project_whose_folder_is_another_is_given_a_copy_that_names_its_folder_and_never_dot_specs"
runs = ["specs-folder-shared"]

[[plant.edit]]
file = "crates/cf-harness/src/shared/specmint.rs"
find = "        let bytes = in_folder(bytes, folder);\n"
replace = "        let bytes = Cow::Borrowed(*bytes);\n"

