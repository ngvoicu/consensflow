find = '        let after_a_tool = self.after_a_tool.remove(&id);'
replace = '        let after_a_tool = self.after_a_tool.remove(&id) && false;'

[[plant]]
name = "result-text reader: the record that holds the advisor's answer is a place of its message's words"
