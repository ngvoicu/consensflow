# A result is the text the member wrote after its turn's last tool call, and where it wrote
# none, the last words it wrote before it in that turn (the chief's decisions on T-262), with
# what decides on the words after the last tool call alone reading those (T-878).
#
# - Claude's reader: a message that holds a tool's result itself (the advisor's) goes on after
#   it in an item of its own, so the words before the call are a step that stopped for it
#   (T-593's result, m-4165, began with them; `crates/cf-harness/src/claude/record/items.rs`,
#   `replay.rs`).
# - The engine: a final answer with no words is the last item of the turn that has some, never
#   one of the turn before the latest message to the member, nor the harness's own words, and
#   Finish takes the same (`crates/cf-engine/src/role_change.rs`).
# - Strict: a tell's note reads the words after the last tool call alone
#   (`Answers::after_the_last_tool`, `turn_end/paused.rs`; Calliope's P2 on T-262, T-878).
#
# - T-1311, T-1310's review of T-878: a result of the last words says so above them
#   (`turn_end::LAST_WORDS`, `role_change::Run`); Claude Code's errors of the API, which it writes
#   in the assistant's place, are the harness's own words (`synthetic`), which no result takes
#   (`claude/record/items.rs`, `replay.rs`); the long run's oracle judges the result the engine
#   gives (`crates/cf-evals/src/long_run/invariants/order.rs`).
#
# The rig's cases build the native `cf` from the sources as planted, so their plants say `builds`.
# Every name holds `result-text`, so `cargo xtask plants daemon result-text` runs them all.

[run]
rt-reader = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record::tests::final_answer"]
rt-role-change-lib = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "role_change"]
rt-engine-final = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "final_answer::"]
rt-engine-paused = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "paused_answers::"]
rt-reader-refusals = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record::tests::refusals"]
rt-turn-end-lib = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "turn_end::"]
rt-oracle = ["cargo", "test", "--offline", "-p", "cf-evals", "--test", "long_run", "order::"]
rt-rig-progress = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "results_that_began_with_the_workers_progress::"], builds = true }

[[plant]]
name = "result-text reader: a message that held the advisor's answer goes on in the same item"
meant = "what_a_message_wrote_after_an_advisors_answer_in_it_is_an_item_of_its_own_after_the_tool"
runs = ["rt-reader"]

[[plant.edit]]
file = "crates/cf-harness/src/claude/record/replay.rs"
find = '''
        if holds_a_result {
            self.items.after_a_tool(&message_id);
        }'''
replace = ''

