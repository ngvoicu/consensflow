# What the app does with a panic, and on macOS with an Objective-C exception, in the code the
# system's event loop calls (T-908). On 2026-10-28 the live app (3.0.6-alpha.3) aborted in tao's
# `extern "C"` `sendEvent:` with nothing in its log but "panic in a function that cannot unwind":
# an exception AppKit raised under it, as far as can be told, unwound into tao's frame, and Rust
# aborted there. Now every panic is written to the error log with its place and backtrace before
# anything can abort, and an abort no panic began is said to be a foreign unwind
# (`app/src-tauri/src/panics.rs`); the app's callbacks of the event loop stop a panic at their edge
# and tell the person once; AppKit's own `-[NSApplication sendEvent:]` and `-[NSWindow sendEvent:]`
# are run where an exception or a panic under them is caught below tao's frame
# (`panics/appkit.rs`); and the update state is read on after a panic that held it.
# One plant takes one rule out; a test fails.
#
# Every name holds `event-loop-panic`, so `npm run plants:daemon -- "event-loop-panic:"` runs them all.

[run]
app-panics = ["cargo", "xtask", "app", "test", "panics::"]
app-update-state = ["cargo", "xtask", "app", "test", "the_update_state_is_read_after_a_panic_that_held_it"]
app-at-exit = ["cargo", "xtask", "app", "test", "a_shutdown_that_panics_still_leaves_every_descriptor_close_on_exec"]

[[plant]]
name = "event-loop-panic: the app's panics are not written to its error log"
meant = "a_panic_is_written_to_the_error_log_with_its_thread_place_and_backtrace"
runs = ["app-panics"]

[[plant.edit]]
file = "app/src-tauri/src/panics.rs"
find = "        write(&describe(info));"
replace = "        let _ = describe;"

[[plant]]
name = "event-loop-panic: a panic is written without its backtrace"
meant = "a_panic_is_written_to_the_error_log_with_its_thread_place_and_backtrace"
runs = ["app-panics"]

[[plant.edit]]
file = "app/src-tauri/src/panics.rs"
find = "        Backtrace::force_capture()"
replace = "        Backtrace::disabled()"

[[plant]]
name = "event-loop-panic: a panic is written after the hook returns, too late for the abort it ends in"
meant = "a_panic_that_ends_in_an_abort_is_written_before_it"
runs = ["app-panics"]

[[plant.edit]]
file = "app/src-tauri/src/panics.rs"
find = "        write(&describe(info));"
replace = '''        let text = describe(info);
        std::thread::spawn(move || {
            std::thread::sleep(Duration::from_millis(300));
            write(&text);
        });'''

