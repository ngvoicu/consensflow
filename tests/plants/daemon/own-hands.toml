# Faults in the switch's two silent engine/daemon boundaries.

[run]
own-off = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "role_news::own_hands_going_off_gives_the_ordinary_role_whole"]
own-rules = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "role_news::the_rules_for_the_staff_are_in_a_chiefs_launch_only_while_own_hands_is_off"]
own-guide = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "routes::guide"]
own-short = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text", "own_hands"]
own-news = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "role_news::own_hands_switch_is_told_once_each_way_on_every_harness"]
own-text = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "own_hands_selects_the_chiefs_text_and_keeps_the_members_text"]

[[plant]]
name = "own hands: a switch under a running chief is never noticed"
meant = "own_hands_switch_is_told_once_each_way_on_every_harness"
runs = ["own-news"]

[[plant.edit]]
file = "crates/cf-engine/src/role_news.rs"
find = '''            specs: self.specs_setting(project, participant),
            rules: rules_told(project),
            own_hands: project.own_hands,'''
replace = '''            specs: self.specs_setting(project, participant),
            rules: rules_told(project),
            own_hands: false,'''

[[plant]]
name = "own hands: the chief is always given the ordinary text"
meant = "own_hands_selects_the_chiefs_text_and_keeps_the_members_text"
runs = ["own-text"]

[[plant.edit]]
file = "crates/cf-daemon/src/seams.rs"
find = '''            specs,
            project.own_hands,'''
replace = '''            specs,
            false,'''

[[plant]]
name = "own hands: the switch going off gives the chief no more than a section, not its whole role"
meant = "own_hands_going_off_gives_the_ordinary_role_whole_cut_for_cf_inbox_read_on_every_harness"
runs = ["own-off"]

[[plant.edit]]
file = "crates/cf-engine/src/role_news.rs"
find = '''                crate::role_change::body_of(&role.instructions, &self.seams.roles.cf(participant))'''
replace = '''                crate::roles::news::own_hands_on(&role.instructions)'''

[[plant]]
name = "own hands: the staff's rules stay in the role of a chief that does the work itself"
meant = "the_rules_for_the_staff_are_in_a_chiefs_launch_only_while_own_hands_is_off"
runs = ["own-rules"]

[[plant.edit]]
file = "crates/cf-engine/src/specs.rs"
find = '''            .filter(|_| !(participant.role == "chief" && project.own_hands));'''
replace = '''            .filter(|_| true);'''

[[plant]]
name = "own hands: the board's guide leaves out the project's rules for its staff"
meant = "the_project_s_rules_for_its_staff_are_in_the_guide_as_they_are_now"
runs = ["own-guide"]

[[plant.edit]]
file = "crates/cf-daemon/src/api/routes/guide.rs"
find = '''        caller.project.staff_rules.as_deref(),'''
replace = '''        None,'''

[[plant]]
name = "own hands: the short text is the ordinary chief's whole role"
meant = "own_hands_gives_a_short_text_that_is_whole_in_itself"
runs = ["own-short"]

[[plant.edit]]
file = "crates/cf-engine/src/roles.rs"
find = '''    if own_hands {
        // The short text has no table'''
replace = '''    if false {
        // The short text has no table'''
