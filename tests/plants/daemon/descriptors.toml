# What a program ConsensFlow starts is left of the descriptors of the one that starts it
# (T-133, 3.0.6): on macOS std makes a socket or a pipe close-on-exec in a second step, and a
# program started on another thread between the two holds it to its end. A listener that was
# closed goes on taking connections, a pipe is never at its end, a port cannot be bound.
# `cf_process::hold_only_the_streams` (`crates/cf-process/src/descriptors.rs`) closes, in the new
# process and before the exec, every descriptor above the standard streams that is not
# close-on-exec, up to the end of the descriptor table, whatever the limits on descriptors were
# lowered to (T-183); every program cf-process starts has it (`spawn`, `hand_over`, `capture`), and
# the app's daemon command, the app's login shell and the Codex supervisor's two programs ask for
# it. The window's programs are the pane host's, which portable-pty starts and cleans.
# One plant takes one rule out; a test fails.
#
# Every name holds `descriptors`, so `npm run plants:daemon -- "descriptors:"` runs them all.

[run]
process-descriptors = ["cargo", "test", "--offline", "-p", "cf-process", "--lib", "descriptors::"]
app-daemon-descriptors = ["cargo", "xtask", "app", "test", "the_daemon_holds_nothing"]
app-login-descriptors = ["cargo", "xtask", "app", "test", "the_login_shell_holds_nothing"]
codex-descriptors = ["cargo", "test", "--offline", "-p", "cf-codex-session", "--lib", "codexs_programs_hold_nothing"]

[[plant]]
name = "descriptors: a program is left the descriptors its parent had open and not close-on-exec"
meant = "a_program_run_beside_this_one_holds_no_descriptor_that_was_open_when_it_started"
runs = ["process-descriptors"]

[[plant.edit]]
file = "crates/cf-process/src/descriptors.rs"
find = "if flags >= 0 && flags & libc::FD_CLOEXEC == 0 {"
replace = "if false && flags >= 0 && flags & libc::FD_CLOEXEC == 0 {"

[[plant]]
name = "descriptors: the programs cf-process starts to run beside it do not ask for it"
meant = "a_program_run_beside_this_one_holds_no_descriptor_that_was_open_when_it_started"
runs = ["process-descriptors"]

[[plant.edit]]
file = "crates/cf-process/src/child.rs"
find = '''
    crate::descriptors::hold_only_the_streams(command.as_std_mut());
'''
replace = ""

[[plant]]
name = "descriptors: the programs cf-process lets go do not ask for it"
meant = "a_program_let_go_holds_no_descriptor_that_was_open_when_it_started"
runs = ["process-descriptors"]

[[plant.edit]]
file = "crates/cf-process/src/hand_over.rs"
find = '''
    crate::descriptors::hold_only_the_streams(command.as_std_mut());
'''
replace = ""

[[plant]]
name = "descriptors: a descriptor the listing names is left to the program"
meant = "a_program_run_beside_this_one_holds_no_descriptor_that_was_open_when_it_started"
runs = ["process-descriptors"]

[[plant.edit]]
file = "crates/cf-process/src/descriptors.rs"
find = '''
            for entry in &listing[..listed.min(LISTED)] {
                highest = highest.max(entry.proc_fd);
                let_go(entry.proc_fd);
            }
'''
replace = '''
            for entry in &listing[..listed.min(LISTED)] {
                highest = highest.max(entry.proc_fd);
            }
'''

[[plant]]
name = "descriptors: the app starts its daemon with whatever the app held"
meant = "the_daemon_holds_nothing_of_the_apps_but_its_streams_whatever_was_open_as_it_started"
runs = ["app-daemon-descriptors"]

[[plant.edit]]
file = "app/src-tauri/src/daemon_command.rs"
find = '''
    cf_process::hold_only_the_streams(&mut command);
'''
replace = ""

[[plant]]
name = "descriptors: the programs cf-process runs to their end do not ask for it"
meant = "a_program_run_to_its_end_holds_no_descriptor_that_was_open_when_it_started"
runs = ["process-descriptors"]

[[plant.edit]]
file = "crates/cf-process/src/capture.rs"
find = '''
    crate::descriptors::hold_only_the_streams(command.as_std_mut());
'''
replace = ""

[[plant]]
name = "descriptors: the scan above a full listing ends at the limit on descriptors"
meant = "a_program_holds_none_of_a_crowd_of_descriptors_whatever_the_limit_was_lowered_to"
runs = ["process-descriptors"]

[[plant.edit]]
file = "crates/cf-process/src/descriptors.rs"
find = "        let end = table().or(ceiling).ok_or_else(io::Error::last_os_error)?;"
replace = '''
        // SAFETY: no pointer is passed.
        #[allow(unsafe_code)]
        let end = unsafe { libc::getdtablesize() }.min(table().or(ceiling).unwrap_or(0));
'''

[[plant]]
name = "descriptors: the scan above a full listing starts above the table"
meant = "a_program_holds_none_of_a_crowd_of_descriptors_whatever_the_limit_was_lowered_to"
runs = ["process-descriptors"]

[[plant.edit]]
file = "crates/cf-process/src/descriptors.rs"
find = "        scan(first, end);"
replace = "        scan(end + 1, end.max(first));"

[[plant]]
name = "descriptors: the table's bound is taken for the hard limit on descriptors, or the system's ceiling"
meant = "a_program_holds_none_of_a_crowd_of_descriptors_whatever_the_hard_limit_was_lowered_to"
runs = ["process-descriptors"]

[[plant.edit]]
file = "crates/cf-process/src/descriptors.rs"
find = "        let end = table().or(ceiling).ok_or_else(io::Error::last_os_error)?;"
replace = "        let end = ceiling.or(table()).ok_or_else(io::Error::last_os_error)?;"

[[plant.edit]]
file = "crates/cf-process/src/descriptors.rs"
find = "        (answered == 0 && most > 0).then_some(most)"
replace = '''
        let mut limit = libc::rlimit {
            rlim_cur: 0,
            rlim_max: 0,
        };
        // SAFETY: the answer's room is one `rlimit`.
        #[allow(unsafe_code)]
        unsafe {
            libc::getrlimit(libc::RLIMIT_NOFILE, &raw mut limit);
        }
        (answered == 0 && most > 0).then_some(most.min(c_int::try_from(limit.rlim_max).unwrap_or(c_int::MAX)))
'''

[[plant]]
name = "descriptors: Codex's server and TUI do not ask for it"
meant = "codexs_programs_hold_nothing_of_the_windows_but_their_streams"
runs = ["codex-descriptors"]

[[plant.edit]]
file = "crates/cf-codex-session/src/supervisor.rs"
find = '''
    cf_process::hold_only_the_streams(command.as_std_mut());
'''
replace = ""

[[plant]]
name = "descriptors: the app's login shell does not ask for it"
meant = "the_login_shell_holds_nothing_of_the_apps_but_its_streams"
runs = ["app-login-descriptors"]

[[plant.edit]]
file = "app/src-tauri/src/daemon_command.rs"
find = '''
    cf_process::hold_only_the_streams(&mut asked);
'''
replace = ""
