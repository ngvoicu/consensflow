# What a program ConsensFlow starts is left of the descriptors of the one that starts it
# (T-133, 3.0.6): on macOS std makes a socket or a pipe close-on-exec in a second step, and a
# program started on another thread between the two holds it to its end. A listener that was
# closed goes on taking connections, a pipe is never at its end, a port cannot be bound.
# `cf_process::hold_only_the_streams` (`crates/cf-process/src/descriptors.rs`) closes, in the new
# process and before the exec, every descriptor above the standard streams that is not
# close-on-exec, up to the end of the descriptor table, whatever the limits on descriptors were
# lowered to (T-183), and refuses the start when the system will not say how big the table is
# (T-190); every program cf-process starts has it (`spawn`, `hand_over`, `capture`), and the app's
# daemon command, its login shell, the tools an update is checked with, the app an update started
# again, the page opener, the Codex supervisor's two programs and the rig's programs ask for it. The window's programs are the pane host's, which portable-pty starts and cleans.
# One plant takes one rule out; a test fails.
#
# Every name holds `descriptors`, so `npm run plants:daemon -- "descriptors:"` runs them all.

[run]
process-descriptors = ["cargo", "test", "--offline", "-p", "cf-process", "--lib", "descriptors::"]
app-daemon-descriptors = ["cargo", "xtask", "app", "test", "the_daemon_holds_nothing"]
app-login-descriptors = ["cargo", "xtask", "app", "test", "the_login_shell_holds_nothing"]
app-update-tools-descriptors = ["cargo", "xtask", "app", "test", "the_programs_an_update_is_checked_with"]
app-relaunch-descriptors = ["cargo", "xtask", "app", "test", "relaunch::"]
app-page-descriptors = ["cargo", "xtask", "app", "test", "the_opener_holds_nothing"]
rig-descriptors = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "process::tests::a_program_a_case_starts"]
codex-descriptors = ["cargo", "test", "--offline", "-p", "cf-codex-session", "--lib", "codexs_programs_hold_nothing"]

[[plant]]
name = "descriptors: a program is left the descriptors its parent had open and not close-on-exec"
meant = "a_program_run_beside_this_one_holds_no_descriptor_that_was_open_when_it_started"
runs = ["process-descriptors"]

[[plant.edit]]
file = "crates/cf-process/src/descriptors.rs"
find = "if flags >= 0 && flags & libc::FD_CLOEXEC == 0 {"
replace = "if false && flags >= 0 && flags & libc::FD_CLOEXEC == 0 {"

[[plant]]
name = "descriptors: the programs cf-process starts to run beside it do not ask for it"
meant = "a_program_run_beside_this_one_holds_no_descriptor_that_was_open_when_it_started"
runs = ["process-descriptors"]

[[plant.edit]]
file = "crates/cf-process/src/child.rs"
find = '''
    crate::descriptors::hold_only_the_streams(command.as_std_mut());
'''
replace = ""

