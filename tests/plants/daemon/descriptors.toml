[[plant.edit]]
file = "crates/cf-process/src/descriptors.rs"
find = "        let end = table().ok_or_else(io::Error::last_os_error)?;"
replace = '''
        // SAFETY: no pointer is passed.
        #[allow(unsafe_code)]
        let end = unsafe { libc::getdtablesize() }.min(table().unwrap_or(0));
'''

[[plant]]
name = "descriptors: the scan above a full listing starts above the table"
meant = "a_program_holds_none_of_a_crowd_of_descriptors_whatever_the_limit_was_lowered_to"
runs = ["process-descriptors"]

[[plant.edit]]
file = "crates/cf-process/src/descriptors.rs"
find = "        scan(first, end);"
replace = "        scan(end + 1, end.max(first));"

[[plant]]
name = "descriptors: the table's bound is taken for the hard limit on descriptors"
meant = "a_program_holds_none_of_a_crowd_of_descriptors_whatever_the_hard_limit_was_lowered_to"
runs = ["process-descriptors"]

[[plant.edit]]
file = "crates/cf-process/src/descriptors.rs"
find = "        let end = table().ok_or_else(io::Error::last_os_error)?;"
replace = '''
        let mut limit = libc::rlimit {
            rlim_cur: 0,
            rlim_max: 0,
        };
        // SAFETY: the answer's room is one `rlimit`.
        #[allow(unsafe_code)]
        unsafe {
            libc::getrlimit(libc::RLIMIT_NOFILE, &raw mut limit);
        }
        let end = table()
            .map(|_| c_int::try_from(limit.rlim_max).unwrap_or(c_int::MAX))
            .ok_or_else(io::Error::last_os_error)?;
'''

