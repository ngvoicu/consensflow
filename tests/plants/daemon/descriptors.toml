# What a program ConsensFlow starts is left of the descriptors of the one that starts it
# (T-133, 3.0.6): on macOS std makes a socket or a pipe close-on-exec in a second step, and a
# program started on another thread between the two holds it to its end. A listener that was
# closed goes on taking connections, a pipe is never at its end, a port cannot be bound.
# `cf_process::hold_only_the_streams` (`crates/cf-process/src/descriptors.rs`) closes, in the new
# process and before the exec, every descriptor above the standard streams that is not
# close-on-exec, up to the end of the descriptor table, whatever the limits on descriptors were
# lowered to (T-183), and refuses the start when the system will not say how big the table is
# (T-190); every program cf-process starts has it (`spawn`, `hand_over`, `capture`), and the app's
# daemon command, its login shell, the tools an update is checked with, the page opener, the Codex
# supervisor's two programs, the rig's programs and the tests' own ask for it. The app an update
# installed is started by Tauri's restart, with a bare `Command`, on the main thread after the
# event loop ends: the app's last code there makes every descriptor close-on-exec
# (`cf_process::close_all_on_exec` in `at_exit`, app/src-tauri/src/lib.rs, T-244), as
# `restart_swept` does before a restart Tauri starts on the spot (T-211). The window's programs are
# the pane host's, which portable-pty starts and cleans.
# One plant takes one rule out; a test fails.
#
# Every name holds `descriptors`, so `npm run plants:daemon -- "descriptors:"` runs them all.

[run]
process-descriptors = ["cargo", "test", "--offline", "-p", "cf-process", "--lib", "descriptors::"]
app-daemon-descriptors = ["cargo", "xtask", "app", "test", "the_daemon_holds_nothing"]
app-login-descriptors = ["cargo", "xtask", "app", "test", "the_login_shell_holds_nothing"]
app-update-tools-descriptors = ["cargo", "xtask", "app", "test", "the_programs_an_update_is_checked_with"]
app-restart-descriptors = ["cargo", "xtask", "app", "test", "the_app_restarts_with"]
app-end-descriptors = ["cargo", "xtask", "app", "test", "the_apps_end_leaves_every_descriptor"]
app-tests-descriptors = ["cargo", "xtask", "app", "test", "testing::tests::a_program_a_test_starts"]
panes-tests-descriptors = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "testing::a_program_a_test_starts"]
cf-tests-descriptors = ["cargo", "test", "--offline", "-p", "cf", "--test", "process"]
harness-tests-descriptors = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "a_process_of_the_tests_own_holds_nothing"]
cf-daemon-tests-descriptors = ["cargo", "test", "--offline", "-p", "cf", "--test", "daemon_stop", "the_daemon_a_test_keeps"]
harness-loopback-descriptors = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "loopback", "the_server_a_test_keeps"]
ledger-opening-descriptors = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "opening", "a_child_a_test_starts"]
cf-goldens-descriptors = ["cargo", "test", "--offline", "-p", "cf", "--test", "cli_goldens", "the_command_a_case_starts"]
sentinel-descriptors = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "a_sentinel_holds_nothing"]
headless-descriptors = ["cargo", "test", "--offline", "-p", "cf-panes", "--test", "headless", "the_helper_a_test_starts"]
daemon-runs-descriptors = ["cargo", "test", "--offline", "-p", "cf-daemon", "--test", "api", "a_run_holds_nothing"]
rig-shell-descriptors = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "the_shell_a_case_starts"]
app-page-descriptors = ["cargo", "xtask", "app", "test", "the_opener_holds_nothing"]
rig-descriptors = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "process::tests::a_program_a_case_starts"]
codex-descriptors = ["cargo", "test", "--offline", "-p", "cf-codex-session", "--lib", "codexs_programs_hold_nothing"]

