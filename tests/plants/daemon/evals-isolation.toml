# The evals run every real harness on a home of the run's own (T-785, T-724's "Findings to file" 4).
# `cf-evals/src/run/machine.rs` built its installs bare, so an eval's Pi, Codex and Devin windows
# ran for hours on the owner's own login folders, and its rig gave every window the owner's
# `CODEX_HOME`. Now each harness with a real window gets the kit's home (`live::isolation`), Pi's
# with the logins of the run's own Pi models for the planned length and the evals' 30 minutes (the
# kit's own margin is 10 since T-1067, so an eval asks it for the rest, T-1358), and
# what the homes find at the end (the owner's hashes before and after, a file changed, a login
# written again) is kept for the eval's report instead of failing a rig of hours at its end. The
# guard (`tests/cli/live_homes.rs`) covers the evals now. One plant takes one rule out; a test of
# it fails. Every name holds `evals isolation`.

[run]
ei-evals-machine = ["cargo", "test", "--offline", "-p", "cf-evals", "--lib", "run::machine"]
ei-evals-login = ["cargo", "test", "--offline", "-p", "cf-evals", "--lib", "run::login"]
ei-evals-report = ["cargo", "test", "--offline", "-p", "cf-evals", "--lib", "long_run::report"]
ei-kit-isolation = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::isolation"]
ei-guard = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "cli", "live_homes"]

[[plant]]
name = "evals isolation: an eval's real windows run on the owner's login folders"
meant = "an_eval_machines_real_windows_run_on_the_kits_homes_and_its_rig_names_no_codex_home_of_the_owners"
runs = ["ei-evals-machine"]

[[plant.edit]]
file = "crates/cf-evals/src/run/machine.rs"
find = '''    if let Some(isolation) = isolation(harness, install.home(), seated)? {'''
replace = '''    if let Some(isolation) = isolation(harness, install.home(), seated)?.filter(|_| false) {'''

[[plant]]
name = "evals isolation: the eval's rig gives every window the owner's CODEX_HOME again"
meant = "no_live_source_makes_the_home_of_a_real_harness_by_hand"
runs = ["ei-guard"]

[[plant.edit]]
file = "crates/cf-evals/src/run/machine.rs"
find = '''            .var("HOME", &home)
'''
replace = '''            .var("HOME", &home)
            .var(
                "CODEX_HOME",
                codex_home(&self.home).to_string_lossy().into_owned(),
            )
'''

[[plant]]
name = "evals isolation: a harness whose windows are all the stand-in gets a home with a login to copy"
meant = "an_eval_machines_real_windows_run_on_the_kits_homes_and_its_rig_names_no_codex_home_of_the_owners"
