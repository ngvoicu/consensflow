# The Devin arrival branch (3.0.6, item 7): the review of B5 by GPT-6-Astra and GPT-6.1-Sol
# (2026-10-18), the live probe of what Devin writes (T-102, 2026-10-21) and the review of
# c2e29f2d (T-101):
#
# - Devin 3000.6.14 to 3000.11.92 write no request of the TUI's to the wire log: whether
#   Devin took a paste, and holds it queued, is read from its store (`devin/history.rs`):
#   from 3000.11.92 on, a `prompt_history` row of the conversation shown, written since
#   the hand-over, that begins with the whole paste, is its word that the TUI took it, and
#   one its record does not show yet is held. An older Devin's window says nothing of it.
#   A prompt submitted since the engine's look holds the window from a paste; and a
#   message of the user's the agent has not answered, which Devin's record reads at rest,
#   is a turn begun for 30 s (`adapter`'s `begun_on_the_store`);
# - a paste taken in a conversation the human left (`/new`, `/resume`) is settled by that
#   conversation's record (`Delivering::session`, `arrival`'s `watch_left`): confirmed where
#   it shows it, given back after a whole arrival window of rest without it, a record that
#   cannot be read being at rest, or after half an hour of reading at work, unchanged; and
#   a window that closes settles it by that record too (`in_flight`);
# - the live guard asks Devin's store whether or not the wait for the note's turn saw it
#   arrive, and reads the daemon's reader again until it holds the note.
#
# One plant takes one rule out; a test fails. Every name holds `devin arrival`, so
# `npm run plants:daemon -- "devin arrival"` runs them all.

[run]
engine-slow-records = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "slow_records"]
# The dispatcher over generated schedules of looks, turns and sleeps, and the grid.
engine-schedules = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "schedules::"]
harness-devin = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "devin::"]
live-devin-resume-back = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_devin_resume", "back::tests::"]

# 1. Devin's store: the TUI took the paste, or holds it queued.

[[plant]]
name = "devin arrival: a history row that begins with the paste's header and goes on in other words is the paste"
meant = "the_tui_took_a_paste_once_its_store_has_a_row_of_it_whole_in_the_conversation_shown_since_the_hand_over"
runs = ["harness-devin"]

[[plant.edit]]
file = "crates/cf-harness/src/devin/history.rs"
