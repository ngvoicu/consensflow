# Three Devin arrival gaps main had, found by GPT-6-Astra and GPT-6.1-Sol reviewing B5 on
# 2026-10-18, and two of the live guard of a resumed window's first message (3.0.6, item 7):
#
# - a turn the human began as a paste went in, which no look saw before it ended, held the
#   paste; a look that woke half an hour on found the window at rest and pasted again,
#   seconds before Devin ran the paste it had queued. The window says a turn that held the
#   paste ended since the last look (`Window::released`), and the paste's time starts at
#   that look (`arrival`'s `rested`);
# - a paste Devin had taken (`Window::took`) was waited for in the record of the
#   conversation the human switched the window to (`/new`, `/resume`), which never shows
#   it, and the window's queue behind it waited for good. A delivery keeps the conversation
#   it went into (`Delivering::session`), and that record, read with no window, confirms it
#   or gives it back once it rests without it;
# - the wire took any text of any request that began with the paste's first line for the
#   paste put to the agent: a human's prompt whose later part quoted it, a request that is
#   no prompt, a prompt of another conversation. Only a prompt of the conversation shown
#   whose text, its parts joined as Devin's record joins them, begins with the whole paste;
# - the live guard asked Devin's store only where the wait for the note's turn saw it
#   arrive, and read the daemon's reader once, whatever lock its store was under.
#
# The engine's rules run on its fake windows and on the schedules of looks against a model
# of Devin's queue; the wire log's and the window's in the Devin adapter's tests; the
# guard's in the live suite's own unit tests. One plant takes one rule out; a test fails.
#
# Every name holds `devin arrival`, so `npm run plants:daemon -- "devin arrival"` runs them all.

[run]
engine-slow-records = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "slow_records"]
# The dispatcher over generated schedules of looks, turns and sleeps, and the grid.
engine-schedules = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "schedules::"]
harness-devin = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "devin::"]
live-devin-resume-back = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_devin_resume", "back::tests::"]

