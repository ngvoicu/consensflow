# BKV-04: the page's copy and same-model merge must preserve backup identity.

[[plant]]
name = "bkv page: opening the last staff loses its backup link"
meant = "bkv_page_open_from_last_staff_preserves_the_backup_link"
runs = [["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "bkv_page_open_from_last_staff_preserves_the_backup_link"]]
[[plant.edit]]
file = "crates/cf-engine/src/dispatcher.rs"
find = ".create_project_with_staff(&source)?;"
replace = ".create_project(&request)?;"

[[plant]]
name = "bkv page: a new member merges into its model's backup"
meant = "bkv_page_adding_a_primary_does_not_merge_into_the_same_model_backup"
runs = [["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "bkv_page_adding_a_primary_does_not_merge_into_the_same_model_backup"]]
[[plant.edit]]
file = "crates/cf-daemon/src/page/staff.rs"
find = "            && !ledger.is_backup(project, &member.handle)?"
replace = "            && true"

[[plant]]
name = "bkv page: changing a backup leaves its window open"
meant = "bkv_page_changing_or_removing_a_backup_closes_its_window"
runs = [["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "bkv_page_changing_or_removing_a_backup_closes_its_window"]]
[[plant.edit]]
file = "crates/cf-daemon/src/page/staff.rs"
find = "page.engine.change_backup(project, &handle, &backup).await?"
replace = "page.ledger.borrow_mut().change_backup(project, &handle, &backup)?"

[[plant]]
name = "bkv page: removing a backup leaves its window open"
meant = "bkv_page_changing_or_removing_a_backup_closes_its_window"
runs = [["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "bkv_page_changing_or_removing_a_backup_closes_its_window"]]
[[plant.edit]]
file = "crates/cf-daemon/src/page/staff.rs"
find = "page.engine.remove_backup(project, &handle).await?"
replace = "page.ledger.borrow_mut().remove_backup(project, &handle)?"

# BKV-05: the page routes need the engine's session proof and change notification.
[[plant]]
name = "bkv05: Vacation route only marks the ledger"
meant = "bkv05_vacation_route_releases_unopened_pool_work_but_keeps_named_work"
runs = [["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "bkv05_vacation_route_releases_unopened_pool_work_but_keeps_named_work"]]
[[plant.edit]]
file = "crates/cf-daemon/src/page/staff.rs"
find = "page.engine.send_on_vacation(project, &handle).await?"
replace = "page.ledger.borrow_mut().send_on_vacation(project, &handle, &[])?"

[[plant]]
name = "bkv05: return route only marks the ledger"
meant = "bkv05_return_route_uses_engine_and_chief_is_refused"
runs = [["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "bkv05_return_route_uses_engine_and_chief_is_refused"]]
[[plant.edit]]
file = "crates/cf-daemon/src/page/staff.rs"
find = "page.engine.bring_back_from_vacation(project, &handle)?"
replace = "page.ledger.borrow_mut().bring_back(project, &handle)?"

[[plant]]
name = "bkv05: board says a resting backup can take tasks"
meant = "bkv05_board_says_only_a_scheduler_eligible_backup_is_ready"
runs = [["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "bkv05_board_says_only_a_scheduler_eligible_backup_is_ready"]]
[[plant.edit]]
file = "crates/cf-engine/src/scheduler.rs"
find = '''                let candidates = self
                    .seams
                    .ledger
                    .borrow()
                    .candidates_for(project.id, role, tier)?;'''
replace = '''                let mut candidates = self
                    .seams
                    .ledger
                    .borrow()
                    .candidates_for(project.id, role, tier)?;
                for candidate in &mut candidates {
                    if let Some(backup) = &mut candidate.backup {
                        backup.vacation_since = None;
                    }
                }'''
