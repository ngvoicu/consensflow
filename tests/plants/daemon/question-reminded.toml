# Q2 (N24): a question a restart or a project Close closed is reminded while its task waits.
# The wait is a row of `question_wait` (the close's place, the note, the clock, a cursor of its own);
# eligibility is read where a reminder is written and where it is admitted.
[run]
question-reminded-ledger = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "closed_wait::"]
question-reminded-daemon = ["cargo", "test", "--offline", "-p", "cf-daemon", "--test", "closed_wait_inbox"]
question-reminded-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "t1924_"]

[[plant]]
name = "question reminded: a tell still queued is not the chief's action"
meant = "a_tell_queued_before_the_returned_answers_note_is_the_chiefs_action"
runs = ["question-reminded-ledger"]
[[plant.edit]]
file = "crates/cf-ledger/src/waiting_questions.rs"
find = "              AND a.state IN ('queued','gated','delivering','delivered','read'))\";"
replace = "              AND a.state IN ('delivered','read'))\";"

[[plant]]
name = "question reminded: acted is counted from the note, not from the close"
meant = "a_tell_queued_before_the_returned_answers_note_is_the_chiefs_action"
runs = ["question-reminded-ledger"]
[[plant.edit]]
file = "crates/cf-ledger/src/waiting_questions.rs"
find = "\"UPDATE question_wait SET note_id = coalesce(note_id, ?1) WHERE question_id = ?2\","
replace = "\"UPDATE question_wait SET after_id = ?1, note_id = coalesce(note_id, ?1) WHERE question_id = ?2\","

[[plant]]
name = "question reminded: the clock is the question's own receipt"
meant = "a_restarted_question_is_a_wait_once_its_note_is_delivered"
runs = ["question-reminded-ledger"]
[[plant.edit]]
file = "crates/cf-ledger/src/waiting_questions.rs"
