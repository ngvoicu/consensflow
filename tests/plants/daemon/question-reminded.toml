meant = "a_closed_questions_reminder_has_a_cursor_of_its_own_and_the_open_ones_link_stays"
runs = ["question-reminded-ledger"]
[[plant.edit]]
file = "crates/cf-ledger/src/waiting_questions.rs"
find = '''            "UPDATE question_wait SET reminder_id = ?1 WHERE question_id = ?2",
            params![sent.id, id],
        )?;'''
replace = '''            "UPDATE question_wait SET reminder_id = ?1 WHERE question_id = ?2",
            params![sent.id, id],
        )?;
        store.db.execute(
            "INSERT INTO question_reminder(question_id, reminder_id, ended) VALUES (?2, ?1, 0)
             ON CONFLICT(question_id) DO UPDATE SET reminder_id=excluded.reminder_id",
            params![sent.id, id],
        )?;'''

