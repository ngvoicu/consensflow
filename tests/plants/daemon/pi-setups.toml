# Pi lists its models in every setup Pi itself can run in (HMD-13, T-1264), and the review of
# that fix (T-1270): the list is read as a Pi window starts, with the packages and extensions the
# human has (crates/cf-harness/src/pi/models.rs); a failure takes one start of Pi and says what
# that start said and the code it exited with (crates/cf-harness/src/shared/one_shot.rs, over
# cf-process's `Streams::Conversation`, which keeps the last of a child's error stream and its
# exit code and ends the group it leads); a Pi that lists nothing says whether any provider is
# set up, by names alone and only then, read on a thread of its own, one read at a time, waited for
# a bounded time (crates/cf-harness/src/pi/setup.rs); a Refresh runs the update and asks Pi once;
# and the words of Pi that a failure carries (after the mark `cf_proto::models::IT_SAID`) are screened
# whole, every line of them a stack frame among them, before any cut, and withheld whole if anything in
# them may hold a credential or a row end falls in a URL's user and password (T-1276); where the front
# of what Pi said was let go (cf-process keeps the last 4 KiB; `pi update --models` is held to the
# same), none of it is handed on; every other
# reason is only masked (crates/cf-engine/src/shown/quotable.rs, used in crates/cf-daemon/src/models.rs and
# crates/cf-engine/src/chief_model.rs); the daemon reads each harness on a turn of its own and
# answers a list the home kept with no turn (crates/cf-daemon/src/models.rs).
# `npm run plants:daemon -- "pi-setups:"` runs them.

[run]
ps-models = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "pi::models::"]
ps-setup = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "pi::setup::"]
ps-one-shot = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::one_shot::"]
ps-process = ["cargo", "test", "--offline", "-p", "cf-process", "--lib", "child::"]
ps-daemon = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "models::"]
ps-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "chief_models::"]
ps-quotable = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "shown::quotable::"]
ps-screen = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "shown::screen::"]
ps-seams = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "seams::processes::"]

