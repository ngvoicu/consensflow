# Pi lists its models in every setup Pi itself can run in (HMD-13, T-1264): the list is read as a
# Pi window starts, with the packages and extensions the human has (crates/cf-harness/src/pi/
# models.rs), a failure says what Pi said, and a Pi that lists nothing says whether any provider
# is set up (crates/cf-harness/src/pi/setup.rs). `npm run plants:daemon -- "pi-setups:"` runs them.

[run]
ps-models = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "pi::models::"]
ps-setup = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "pi::setup::"]

[[plant]]
name = "pi-setups: the list is read with Pi's extensions left out"
meant = "every_setup_pi_can_run_in_lists_its_models"
runs = ["ps-models"]

[[plant.edit]]
file = "crates/cf-harness/src/pi/models.rs"
find = 'let args = ["--mode", "rpc", "--no-session", "--no-mcp", "--offline"];'
replace = 'let args = ["--mode", "rpc", "--no-session", "--no-mcp", "--no-extensions", "--offline"];'

[[plant]]
name = "pi-setups: the list is read with Pi's extensions left out by their short flag"
meant = "the_list_is_read_offline_with_the_packages_and_extensions_a_window_starts_with"
runs = ["ps-models"]

[[plant.edit]]
file = "crates/cf-harness/src/pi/models.rs"
find = 'let args = ["--mode", "rpc", "--no-session", "--no-mcp", "--offline"];'
replace = 'let args = ["--mode", "rpc", "--no-session", "--no-mcp", "-ne", "--offline"];'

[[plant]]
name = "pi-setups: Pi may install a package the list needs"
meant = "the_list_is_read_offline_with_the_packages_and_extensions_a_window_starts_with"
runs = ["ps-models"]

[[plant.edit]]
file = "crates/cf-harness/src/pi/models.rs"
find = 'let args = ["--mode", "rpc", "--no-session", "--no-mcp", "--offline"];'
replace = 'let args = ["--mode", "rpc", "--no-session", "--no-mcp"];'

[[plant]]
name = "pi-setups: an empty list is told as no login"
