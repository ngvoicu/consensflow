# A job the agent detached from its shell is seen (T-1145: Muse on Windows detached a `ping` with
# `Start-Process`, and the chief was told nothing, T-1126; Pi and Devin detach with `&`, the limit
# T-1117 wrote down: a paused window with only that running was closed, and the close ended it
# unnamed). The pane host's tree holds the job (the pane's job object on Windows, the window's
# session on the Mac), but only a chain of processes that run, up to a shell the harness started,
# made a process the turn's work, and a detached job has lost the shell. The host now names it as
# **detached work** (`Baseline::detached`, `work::detached`): a process of the tree that began after
# the mark, is none of the harness's own, and has lost the process that started it, with what
# descends from it, if a close of the window ends it. So a pause keeps the window for it (T-1117's
# rule, which reads `pane.background`), the chief is told it runs, and a close names what it ended.
# The rules, each with its plant:
#
# - a process whose starter has gone, and what descends from it, is detached work;
# - a process whose parent began before the mark (the harness's own child) is not;
# - what the harness's own is, with what descends from it, is not;
# - what the tree had when the turn began is not;
# - the host is asked what a close ends only when there is a detached job to ask of;
# - only a detached job a close ends is named, and the turn's work always;
# - what a close ends on the Mac is what the selection names and the bound allows;
# - a look names it, and so does the second look a close keeps for its exit;
# - on Windows a close ends the whole job, so every detached job is named;
# - the stand-in's `--detach-here` keeps the shell in the window's session.
#
# The tests are `crates/cf-panes` (the rule, the baseline, the made-up machine, the real panes of
# `pty::turn::leaving_tests` and the headless host) and the rig's cases in
# `crates/cf-e2e/tests/regressions/a_job_the_agent_detached_was_never_seen_and_a_close_ended_it_unnamed.rs`.
# Every name holds `detached work`, so `cargo xtask plants daemon "detached work"` runs them all.

[run]
dw-panes-work = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "background::work::"]
dw-panes-baseline = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "background::tests::"]
dw-panes-leaving = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "pty::turn::leaving_tests::"]
dw-panes-machine = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "process_tree::machine_tests::"]
dw-panes-births = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "background::births::"]
dw-panes-listener = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "job_object::listener_tests::"]
dw-rig-regression = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_job_the_agent_detached_was_never_seen"], builds = true }

