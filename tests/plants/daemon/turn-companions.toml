# The record Claude Code writes beside a user's message, to say where the images it attached to it
# came from (`turnCompanion`, with the sources: `[Image: source: <path>]`): the harness's own words,
# and no message of the user's (Claude Code takes it for no prompt itself, 2.1.308). The reader makes
# of it an item of the harness's own, as it does of what a hook added to a prompt, so the last user's
# item of a window stays the message it is about. T-265, the second finding of T-215: the window of a
# task that was called off, or one stopped before a word of its answer, was looked at by that last
# item; the companion was it, held no header, and no Escape was pressed into the turn (the first), the
# message not taken back (the second). Found by the brain's `issues/a-cancelled-tasks-turn-with-
# images-attached-gets-no-escape.md`. The history of the chief did the same: the placeholders Claude
# puts ahead of a delivery's header, and the wrapper's opening line, were the human's last words.
#
# The cases are the reader's, `claude::record::tests::companions` (and the field row of `fields`) in
# `crates/cf-harness`, the engine's, `cancelled_task.rs` and `taken_back.rs` of the dispatcher's tests
# and `tests/text/handoff.rs`, the rule's own, `delivery_text::tests`, and on the rig
# `a_task_cancelled_after_images_were_attached_to_the_words_that_resumed_it_had_no_escape_pressed`
# (the stand-in Claude makes attachments of a paste as Claude Code does, and keeps a launch's first
# message as it was).
#
# The merge with alpha.3 (T-515) added two cases where these rules meet main's: turn-end's result
# (`paste_shapes.rs` of the dispatcher's tests: a worker resumed with a picture's path ends its turn
# with its answer for the result, the harness's own items beside it none of it) and the stand-in's
# notifications (`tests::a_notification_that_names_a_picture_...` of the `fake-agent` bin: a job's
# notification is no paste, so no picture is attached from it).
#
# Every name holds `turn companion`, so `npm run plants:daemon -- "turn companion"` runs them all.

[run]
harness-companions = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record::tests::companions::"]
harness-fields = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record::tests::fields::"]
engine-dispatcher-companions = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "images_were_attached"]
engine-dispatcher-paste-shapes = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "paste_shapes::"]
engine-text-handoff = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text", "names_what_claude_put_ahead"]
engine-lib-delivery-text = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "delivery_text::"]
engine-text-viewer = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text", "viewer::types_nothing_for_what_claude_put_ahead"]
harness-ancestry = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record::tests::ancestry::"]
ledger-healing = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "whole_history", "healing::"]
standin-notification = ["cargo", "test", "--offline", "-p", "cf-e2e", "--bin", "fake-agent", "a_notification_that_names_a_picture"]
standin-first-message = ["cargo", "test", "--offline", "-p", "cf-e2e", "--bin", "fake-agent", "a_first_message_given_as_an_argument"]
rig-companions = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_task_cancelled_after_images_were_attached_to_the_words_that_resumed_it_had_no_escape_pressed::"]

