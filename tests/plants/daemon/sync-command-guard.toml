# A panic in a command the page asks does not end the app (T-1050). On macOS the page's invoke
# reaches the app inside wry's `extern "C"` handler of the `ipc` protocol, on Windows inside
# WebView2's handler of a request, and Tauri runs a synchronous command right there with nothing
# to catch a panic: one that unwinds into those frames aborts the app. Every command the page may
# ask is run inside `panics::answered` (`page_commands`, app/src-tauri/src/lib.rs), which stops a
# panic at the app's edge, writes it down, tells the person, and answers the page with the error;
# an asynchronous command runs as a task, whose panic left the page's promise unsettled and told
# nobody, so its body runs inside `panics::settled`, which answers and tells; a rule reads every
# `#[tauri::command]` of the app and holds that each is run there, and each async one's body in
# `settled`.
# One plant takes one rule out; a test fails.
#
# Every name holds `sync-command-guard`, so `npm run plants:daemon -- "sync-command-guard:"` runs them all.

[run]
app-command-panic = ["cargo", "xtask", "app", "test", "a_panic_in_a_command_the_page_asks_is_answered_and_the_app_runs_on"]
app-command-rule = ["cargo", "xtask", "app", "test", "every_command_of_the_app_is_run_where_its_panic_is_stopped"]
app-async-command-panic = ["cargo", "xtask", "app", "test", "a_panic_in_an_async_command_the_page_asks_is_answered_and_told"]

[[plant]]
name = "sync-command-guard: the page's commands are run past the app's edge, a panic in one unwinding into the webview's frame"
meant = "panics::tests::a_panic_in_a_command_the_page_asks_is_answered_and_the_app_runs_on"
runs = ["app-command-panic"]

[[plant.edit]]
file = "app/src-tauri/src/lib.rs"
find = "        panics::answered(invoke, |invoke| {"
replace = "        unguarded(invoke, |invoke| {"

[[plant.edit]]
file = "app/src-tauri/src/lib.rs"
find = "/// What the app's builder is given for its page, by `with_page`: Tauri's builder, or"
replace = '''fn unguarded<R: Runtime>(
    invoke: tauri::ipc::Invoke<R>,
    run: impl FnOnce(tauri::ipc::Invoke<R>) -> bool,
) -> bool {
    run(invoke)
}

/// What the app's builder is given for its page, by `with_page`: Tauri's builder, or'''

