# The work a Close paused goes on with the human's Resume (Gabriel, 2026-10-16: "on resume tasks
# should resume, right?"). The engine pauses the task of a window it closed itself, and in a
# suspended project the ledger marks that pause (`paused_with_project`, migration 0021): the
# human's Close and the chief's window ending close every window of the project so. The write
# that opens the project again has each marked task at work again (waiting, where its window's
# question is unanswered), withdraws the note that told the chief it was paused, and leaves a
# task whose session left; the chief's window opens first, then each window with work, on its
# own conversation, told its turn was cut in words that say only that ConsensFlow stopped. Every
# other pause stays: the human's, the chief's, a window that closed by itself, a hold, and any a
# ledger made before the mark. A window that holds several tasks comes back for none: they stay
# paused, for the chief to resume one by one, and no word tells it to go on. A word to go on goes
# with any move of its task out of the work, and a reader of a closed project reads only what a
# window was handed (migration 0022). The case on the rig is
# `crates/cf-e2e/tests/regressions/tasks_left_paused_by_a_close_and_resume.rs`, which builds the
# native `cf` from the sources as planted, so its plants say `builds`.
#
# Every name holds `resume tasks`, so `npm run plants:daemon -- "resume tasks"` runs them all.

[run]
# The ledger's tests of the pauses a suspension makes and its Resume ends.
ledger-suspended = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "suspended::"]
# What the players of Node's recordings hold apart of what only this ledger writes.
ledger-testing-mark = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "testing::"]
# The engine's tests of a start, a Close and the human's Resume, on the fake windows.
engine-resume-tasks = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "resume::"]
# The engine's tests of a window slow to come up, Node's trace of a Resume that comes
# while a Close is still under way among them.
engine-window-takes-long = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "window_takes_long::"]
# The engine's tests that a closed project's windows are handed nothing, whatever
# wait the Close comes in, and of the Resume that follows.
engine-closed-given-nothing = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "closed_given_nothing::"]
# The hand-overs every adapter makes through the pane host: a paste, and a claim.
harness-hand-overs = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::pane::"]
# Each adapter's hand-over the host no longer admits, after the adapter's own waits.
harness-admission = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "admit"]
# A request to a peer on loopback over a real socket, its connection a wait of the system's.
harness-net = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::net::"]
# The ledger's tests of a question's door, which claims an answer for its harness.
ledger-doors = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "doors::"]
# The daemon's door, which waits for an answer and has the ledger claim it.
daemon-door = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "api::routes::door::"]
# Every route of the agents' API: what a window of a closed project reads of a message.
daemon-routes = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "api::routes::"]
# The ledger's continuations: withdrawn with any move of their task out of the work, and
# never carried into the next window's brief.
ledger-continuations = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "continuations::"]
# What the transport let go to a window, as the ledger marks it, and what a reader reads of it.
ledger-handed = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "handed::"]
# A launch whose first message's task is paused while it waits.
engine-launch-stops = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "launch_stops::"]
# The words a pause note's reconciliation says of each state a task can be in.
ledger-pause-words = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "messages::pauses"]
# Where each harness's window takes its first message.
harness-first-message = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "first_message::"]
# The words of a continuation, written and read back.
ledger-continuation-words = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "messages::continuations"]
# The Enter pressed once more for a paste never sends words twice (round 11).
engine-withheld-enter = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "withheld_enter::"]
# What the live tools are told of each harness's windows.
harness-tooling = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "tooling::"]
# What the input box holds after a withheld Enter (round 12).
engine-stale-box = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "stale_box::"]
# The owner's shape on the rig: two tasks at work and one the human paused, closed and resumed.
rig-regression-resume-tasks = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "tasks_left_paused_by_a_close_and_resume::"]
# Where the Resume's Enter meets main's field 3.0.6 (the merge of T-392): own steps, told words.
engine-meeting-main = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "meeting_main::"]
# What one task's route reads out, a closed project's brief among it.
daemon-routes-task = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "api::routes::task::"]
# Words told to a task's window, where their way is not the straight one.
ledger-told-edges = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "told_edges::"]
# The engine's tests of words told to a window before it has its task.
engine-queued-tells = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "queued_tells"]

