            self.open_soon(chief.id, Some(Coming::Chief)).await;
        }
        for (participant, tasks) in at_work {
            self.open_soon(participant, Some(Coming::Member(tasks)))
                .await;
        }'''
replace = '''
        for (participant, tasks) in at_work {
            self.open_soon(participant, Some(Coming::Member(tasks)))
                .await;
        }
