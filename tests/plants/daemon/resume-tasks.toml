name = "resume tasks: the human's Resume leaves the work the Close paused paused, as 3.0.4 did (the rig)"
meant = "a_close_and_a_resume_bring_back_the_tasks_the_close_paused_in_their_own_windows_and_a_task_the_human_paused_stays_paused"
runs = ["rig-regression-resume-tasks"]
