# Delete finished clears the Finished column (T-721, 3.0.6; Gabriel's board of 2026-10-26: 48 finished
# tasks, every one needed by a task the chief held, so the control was gone and none could be deleted).
# Deleting only takes a task off the board (`deleted_at`): what waits for it reads its state as before
# (`release_ready` and a waiter's `needs` take it), so a finished task is kept only while a task not yet
# finished needs it *and it can still change*: a failed one, which the chief can reopen (a deleted task
# is not reopened). An accepted task is accepted for good and a cancelled one never will be, so each goes
# though a task needs it. The page draws the control whenever the Finished column holds a task, and its
# dialog says what goes, what stays and why, or that nothing may go; the ledger decides again.
#
# One plant takes one part out; a test of it fails: the browser's (`app/tests/core-page.spec.mjs`), the
# ledger's own, the page's operation over a real ledger, or the rig's case in the field's shape (which
# builds the native `cf` as planted, so its plant says `builds`). Every name holds `delete finished`, so
# `npm run plants:daemon -- "delete finished"` runs them all.

[run]
ledger-delete-needed = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "delete_needed"]
daemon-page-deleting = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::deleting"]
page-delete-finished = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "Delete finished when every finished|nothing can be deleted when every|deletes every finished task that may go"]
rig-delete-finished = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "the_finished_column_could_not_be_cleared_while_its_tasks_were_needed"]
rig-delete-finished-needs = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "work_added_to_wait_for_an_accepted_task_the_human_cleared"]

