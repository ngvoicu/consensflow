# The words and the designer, 3.0.7 (alpha.4, A4-14): the chief's text says its model is the human's
# to change in its window, which a reopen keeps, and that Switch the chief is for another harness or a
# fresh conversation (CHF-22, T-732; skill/core/chief.md, app/ui/index.html's help for New project and
# Switch chief); the staff table has no column of models, a member being named by its model, and
# names one only beside a name that holds none (T-1234; crates/cf-engine/src/roles.rs, roles/skill.rs);
# the image designer draws the chief's precise orders (T-160; skill/core/chief.md and staff.md); a
# design task's result says each image file it names, its size, type and alpha, read from the header
# (designer P1, T-1280; crates/cf-engine/src/image_facts.rs, turn_end.rs, turn_end/finish.rs); and the
# designer's line tells the truth (designer P2): no model, effort or tier is asked of it, it is read as
# running on Codex's own model, and it has no tier to say (crates/cf-ledger/src/views.rs,
# crates/cf-daemon/src/page/staff.rs, api/routes/staff.rs, crates/cf/src/board/mod.rs and the page's
# app/ui/core/dialogs.js and board.js). `cargo xtask plants daemon "chief-words:"` runs them.

[run]
cw-text = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text"]
cw-roles = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "role_change::"]
cw-image = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "image_facts::"]
cw-dispatcher = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "designer_images::"]
cw-ledger = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "designer_view"]
cw-daemon = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::members"]
cw-staff-route = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "routes::staff"]
cw-cf = ["cargo", "test", "--offline", "-p", "cf", "--lib", "the_staff_says"]
cw-page = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "image designer"]
cw-page-card = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "a member's card says its role"]
cw-page-help = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "say the same of the chief"]

