# The plants of K3's doors, part 4: the guards the last critical review (T-2295) found with no plant,
# each held by a test that fails when it goes. A plant here is run by the tests that ask the guard
# a question and start nothing the guard keeps out: no run of this table names a test that starts
# the Keychain's utility, cargo or a harness's program by its real path.
[run]
kd4-reads = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::k3_tests::a_path_below_a_protected_root_is_read_by_no_plain_reader_and_no_copy"]
kd4-shell = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::k3_tests::a_shell_told_a_command_is_judged_by_its_program_and_an_unreadable_one_is_refused"]
kd4-shells = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::shells::tests::a_posix_command_that_is_not_one_program_with_words_is_refused"]
kd4-words = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "process::tests::a_script_naming_a_program_with_a_door_of_its_own_is_refused_before_it_starts"]
kd4-entry = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::k3_tests::a_script_entry_starts_a_shell_and_no_other_program"]
kd4-audit = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::rule::a_new_caller_of_a_script_entry_is_found_outside_the_files_that_call_one_today"]
kd4-cargo = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::k3_tests::no_child_is_told_the_accounts_cargo_or_rustup_folder"]
kd4-cargo-homes = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::k3_tests::the_starts_that_run_cargo_are_told_the_cargo_and_rustup_folders"]
kd4-again = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::again::tests::the_say_only_child_is_told_the_toolchain_homes"]
kd4-control = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::keychain::control_tests::the_control_starts_claude_on_the_accounts_home_and_a_folder_this_run_made_and_no_other"]
kd4-live-reads = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::rule::the_rule_finds_a_read_outside_the_readers_and_an_account_asked_for_outside_its_files"]

[[plant]]
name = "K3 part 4: the read door admits a path inside a protected root"
meant = "a_path_below_a_protected_root_is_read_by_no_plain_reader_and_no_copy"
runs = ["kd4-reads"]

[[plant.edit]]
file = "crates/cf-e2e/src/door/reads.rs"
find = '''pub(super) fn admitted(path: &Path) -> io::Result<()> {
    if Roots::now().holds(path) {'''
replace = '''pub(super) fn admitted(path: &Path) -> io::Result<()> {
    if false && Roots::now().holds(path) {'''

[[plant]]
name = "K3 part 4: a shell's command is not judged by the program it starts"
