[[plant]]
name = "K3 part 4: every child is told the account's cargo and rustup folders"
meant = "no_child_is_told_the_accounts_cargo_or_rustup_folder"
runs = ["kd4-cargo"]

[[plant.edit]]
file = "crates/cf-e2e/src/door/account.rs"
find = '''    let (path, digest) = own_file()?;
    Ok(vec![
        (
            PROTECTED_FILE.to_owned(),
            path.to_string_lossy().into_owned(),
        ),
        (PROTECTED_DIGEST.to_owned(), digest),
    ])'''
replace = '''    let (path, digest) = own_file()?;
    let mut told = vec![
        (
            PROTECTED_FILE.to_owned(),
            path.to_string_lossy().into_owned(),
        ),
        (PROTECTED_DIGEST.to_owned(), digest),
    ];
    told.extend(toolchain_homes());
    Ok(told)'''

