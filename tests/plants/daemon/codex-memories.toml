        self.send(path, None)'''
replace = '''
    pub fn get(&self, path: &str) -> Result<Answer, BoardError> {
        if let Some(why) = &self.no_writes {
            return Err(BoardError::NoWrites(why.clone()));
        }
        self.send(path, None)'''

