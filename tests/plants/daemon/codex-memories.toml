# Codex's memory job put a task on the board as the chief (T-1313; the issue
# `codex-memories-post-to-the-board-as-the-chief` in consensflow-sme, found on the `sites` board,
# 2026-10-21). The job is a thread of the window's own Codex server, started after a turn, whose
# working folder is `$CODEX_HOME/memories` and which is given the window's config: ConsensFlow's
# role and `CONSENSFLOW_*`, the token among them. Codex has no key that fences it with memories on,
# so `cf` run with its working folder in the memories folder changes nothing on the board. The
# registry says which harness has background work and where (`launch::background_work`, Codex's
# `codex::memories`), `background::refusal` looks the folder up with its links resolved and
# `shared::folders` compares the names in any form a Mac or a Windows path is written in, the
# board `cf` is given refuses every write (`cf-board`), and `cf` says why in Codex's words. The
# class fix, a token the board takes only from the window's own thread, is 3.0.8's.
#
# The cases are the regression `a_codex_memory_job_put_a_task_on_the_board_as_the_chief` (the real
# daemon, pane host and `cf` on the stand-in Codex whose server runs the job), `cf`'s own
# `memories_tests` (every write verb refused with nothing sent, what reads, the usage and a hook
# allowed, an inbox read received by no one) and the harness crate's (`background`,
# `codex::memories`, `shared::folders`). One plant takes one rule out; a test of it fails.
#
# Every name holds `codex memories`, so `npm run plants:daemon -- "codex memories"` runs them all.

[run]
rig-regression-codex-memories = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_codex_memory_job_put_a_task_on_the_board_as_the_chief::"], builds = true }
cf-lib-memories = ["cargo", "test", "--offline", "-p", "cf", "--lib", "memories_tests::"]
harness-lib-memories = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "--", "background::", "codex::memories::", "shared::folders::"]

[[plant]]
name = "codex memories: cf run in the memories folder keeps the board it was given"
meant = "memories_tests::a_command_that_changes_the_board_is_refused_in_the_memories_folder_in_the_words_and_asks_nothing"
runs = ["cf-lib-memories"]

