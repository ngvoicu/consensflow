# A failed task whose work is done can be accepted (T-1111: a designer's session died with
# "Selected model is at capacity" after it had saved both final files, `cf task accept` was
# refused, and the task that needed it was stuck until the chief cancelled it and added it
# again). The chief that has checked the work accepts the failed task with the words of what
# it checked, which the ledger keeps as the task's result; what waits for it is released as
# for any accepted task; a failed task nobody accepts stays failed, and is reopened as it
# was. The role text and the usage say so. One plant takes one rule out; a test of it fails.

[run]
accept-failed-cf-help = ["cargo", "test", "--offline", "-p", "cf", "--test", "help"]
accept-failed-cf-usage = ["cargo", "test", "--offline", "-p", "cf", "--lib", "board::usage"]
accept-failed-engine-text = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text", "goldens_roles"]

[[plant]]
name = "accept failed: a failed task is accepted with no words of what was checked"
meant = "a_failed_task_is_not_accepted_without_the_words_of_what_was_checked"
runs = ["ledger-receipt"]

[[plant.edit]]
file = "crates/cf-ledger/src/tasks/finishing.rs"
find = "        if js::trim(checked).is_empty() {"
replace = "        if js::trim(checked).is_empty() && false {"

[[plant]]
name = "accept failed: the words of what was checked have no bound"
meant = "a_failed_task_is_not_accepted_without_the_words_of_what_was_checked"
runs = ["ledger-receipt"]

[[plant.edit]]
file = "crates/cf-ledger/src/tasks/finishing.rs"
find = '''
        model::require_text(checked, "body", MAX_BODY)?;
        accepted(store, project_id, &task, by, Some((author.id, checked)))'''
replace = "        accepted(store, project_id, &task, by, Some((author.id, checked)))"

[[plant]]
name = "accept failed: a task that has not failed is accepted on the words of a check"
meant = "only_a_failed_task_is_accepted_on_the_words_of_a_check"
runs = ["ledger-receipt"]

[[plant.edit]]
file = "crates/cf-ledger/src/tasks/finishing.rs"
find = '''        require_task_state(&task, &["failed"], "accept")?;'''
replace = '''        require_task_state(&task, &["failed", "done"], "accept")?;'''

[[plant]]
name = "accept failed: the words are kept as a note, not as the task's result"
meant = "a_failed_task_is_accepted_with_what_the_chief_checked_and_those_words_are_its_result"
runs = ["ledger-receipt"]

[[plant.edit]]
file = "crates/cf-ledger/src/tasks/finishing.rs"
find = '''
                    kind: "result",
                    task_id: Some(task.id),
                    body: words,'''
replace = '''
                    kind: "note",
                    task_id: Some(task.id),
                    body: words,'''

[[plant]]
name = "accept failed: the words are pasted into the chief's window as a message"
meant = "a_failed_task_is_accepted_with_what_the_chief_checked_and_those_words_are_its_result"
runs = ["ledger-receipt"]

[[plant.edit]]
file = "crates/cf-ledger/src/tasks/finishing.rs"
find = '''
                    body: words,
                    from_window: true,'''
replace = '''
                    body: words,'''

[[plant]]
name = "accept failed: what waits for the accepted failed task is not released"
meant = "what_waits_for_a_failed_task_goes_on_when_it_is_accepted_and_not_before"
runs = ["ledger-receipt"]

[[plant.edit]]
file = "crates/cf-ledger/src/tasks/finishing.rs"
find = '''
    store.move_task(task, "accepted", detail)?;
    release_ready(store, project_id)?;'''
replace = '''
    store.move_task(task, "accepted", detail)?;'''

[[plant]]
name = "accept failed: words told to a window that failed before it had them stay queued"
meant = "words_told_to_a_failed_tasks_window_that_it_never_had_go_with_the_accept"
runs = ["ledger-receipt"]

[[plant.edit]]
file = "crates/cf-ledger/src/tasks/finishing.rs"
find = '''       WHERE task_id = ? AND recipient_id = ? AND state = 'queued'",
            params![
                format!(
                    "T-{} was accepted before it reached @{}",'''
replace = '''       WHERE task_id = ? AND recipient_id = ? AND state = 'cancelled'",
            params![
                format!(
                    "T-{} was accepted before it reached @{}",'''

[[plant]]
name = "accept failed: a failed task cannot be reopened"
meant = "a_failed_task_nobody_accepts_is_reopened_as_it_was"
runs = ["ledger-receipt"]

[[plant.edit]]
file = "crates/cf-ledger/src/tasks/finishing.rs"
find = '''        require_task_state(&task, &["done", "failed"], "reopen")?;'''
replace = '''        require_task_state(&task, &["done"], "reopen")?;'''

[[plant]]
name = "accept failed: the daemon takes a failed task for one the words do not concern"
meant = "the_chief_accepts_a_failed_task_on_the_words_of_what_it_checked_and_they_are_its_result"
runs = ["daemon-lib-routes-task"]

[[plant.edit]]
file = "crates/cf-daemon/src/api/routes/task.rs"
find = '''.is_some_and(|thread| thread.task.state == "failed");'''
replace = '''.is_some_and(|thread| thread.task.state == "never");'''

[[plant]]
name = "accept failed: the daemon takes a done task for one that needs words"
meant = "a_done_tasks_accept_is_as_it_was_whatever_words_come_with_it"
runs = ["daemon-lib-routes-task"]

[[plant.edit]]
file = "crates/cf-daemon/src/api/routes/task.rs"
find = '''.is_some_and(|thread| thread.task.state == "failed");'''
replace = '''.is_some_and(|thread| thread.task.state == "done");'''

[[plant]]
name = "accept failed: the daemon gives the ledger no words"
meant = "the_chief_accepts_a_failed_task_on_the_words_of_what_it_checked_and_they_are_its_result"
runs = ["daemon-lib-routes-task"]

[[plant.edit]]
file = "crates/cf-daemon/src/api/routes/task.rs"
find = "ledger.accept_failed_task(project, number, by, words)?"
replace = 'ledger.accept_failed_task(project, number, by, "")?'

[[plant]]
name = "accept failed: the usage does not say a failed task takes words"
meant = "every_board_command_answers_help_with_its_usage_and_asks_the_board_nothing"
runs = ["accept-failed-cf-help"]

[[plant.edit]]
file = "crates/cf/src/board/usage.txt"
find = '''
  cf task accept T-3 "…"            accept a failed task you checked; your words are its result'''
replace = ""

[[plant]]
name = "accept failed: the usage lists the accept of a failed task as the cancel's"
meant = "a_line_that_names_two_commands_is_the_usage_of_each"
runs = ["accept-failed-cf-usage"]

[[plant.edit]]
file = "crates/cf/src/board/usage.txt"
find = '''  cf task accept|cancel T-3         move a task you asked for
  cf task accept T-3 "…"            accept a failed task you checked; your words are its result'''
replace = '''  cf task accept|cancel T-3         move a task you asked for
  cf task cancel T-3 "…"            accept a failed task you checked; your words are its result'''

[[plant]]
name = "accept failed: the chief's text does not say a failed task can be accepted"
meant = "every_role_is_given_the_text_node_gave_it_or_refused_as_node_refused_it"
runs = ["accept-failed-engine-text"]

[[plant.edit]]
file = "skill/core/chief.md"
find = '''
   undecided stays Done, and any task that needs it stays blocked. A failed
   task whose work you checked is accepted too, with what you checked:
   `cf task accept T-3 "what I checked"`.'''
replace = '''
   undecided stays Done, and any task that needs it stays blocked.'''
