# One note for one cause, and no note of a failure that is no longer true (3.0.7-alpha.4 fixes,
# T-1196; the field board of 2026-11-03: the Mac's DNS dropped, six working tasks failed on the
# harness's "API Error: Can't reach the API server … (ENOTFOUND)" over 25 minutes, and the chief,
# given its notes one at a time, took 13 of them, most after it had reopened the six). The rules:
#
# - the windows of one outage give up each at its own pace: while the requester has not been given
#   the note of the first, the failures that say the same within half an hour of the newest are
#   told in that note, which is written again and the old one withdrawn, "superseded by m-<new>"
#   (`cf-ledger`'s `tasks::outage`); the note names the tasks, the words of each failure, that the
#   same error from several windows looks like an outage of the network or the API, what waits for
#   them, what their windows' closes ended, and one line that reopens them all;
# - a single failure, one with other words, one that came half an hour after the last, and one
#   whose requester was given the note before it are notes of their own, as they always were;
# - the close of a window is a line of a note of several failures, and a note of its own beside a
#   note of one;
# - a task that is no longer failed (reopened, accepted), or no longer waits (called off), leaves
#   the note that names it, which is written again for the tasks that failed still, or withdrawn;
#   one given to the chief is its own, and one on its way and not handed over is withdrawn
#   (`Store::move_task`, as a continuation is).
#
# - what tells one outage from the next is a SHA-256 of what the failure said, made where the key is
#   made (`cf-engine`'s `shown::hashed`): a window's screen or a provider's error can name a key
#   (T-1217), and the ledger, its log and the engine's memory keep nothing readable of it; no key
#   stays no key.
#
# The engine's cases are `crates/cf-engine/tests/dispatcher/outage_notes.rs`; the ledger's are
# `crates/cf-ledger/tests/receipt/outage_notes.rs`.
#
# One plant takes one rule out; a test of it fails. Every name holds `outage notes:`, so
# `npm run plants:daemon -- "outage notes:"` runs them all.

[run]
on-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "outage_notes::"]
on-ledger = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "outage_notes::"]
on-key = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "shown::"]

[[plant]]
