# The plants of K3's doors judged by identity (N7, T-2222): a place is inside a store, or below a
# folder this run made, by the file system's identity for it, not by the text of its path. A
# folder that has two real spellings is one place to the judge, the seal and the run's registry.
[run]
kdi-addition = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::identity_tests::an_addition_inside_a_store_through_its_other_spelling_is_refused"]
kdi-unreadable = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::identity_tests::a_store_whose_identity_cannot_be_read_refuses_every_act"]
kdi-holds = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::identity_tests::a_place_that_holds_a_store_is_not_taken_or_moved_through_its_other_spelling"]
kdi-seal = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::identity_tests::the_seal_takes_a_variable_that_names_a_store_through_its_other_spelling"]
kdi-seal-unreadable = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::identity_tests::a_store_whose_identity_cannot_be_read_refuses_every_act"]
kdi-made = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::identity_tests::a_folder_this_run_made_is_the_runs_through_its_other_spelling_and_a_persons_is_not"]

[[plant]]
name = "K3 identity: the judge puts a place inside a store by the text of its path again"
meant = "an_addition_inside_a_store_through_its_other_spelling_is_refused"
runs = ["kdi-addition"]

[[plant.edit]]
file = "crates/cf-e2e/src/door/place.rs"
find = '''        (within(place, root, any_case) || inside_by_identity(&parts, key, any_case)).then_some(root)'''
replace = '''        within(place, root, any_case).then_some(root)'''

[[plant]]
name = "K3 identity: a store whose identity cannot be read is no store to the judge"
meant = "a_store_whose_identity_cannot_be_read_refuses_every_act"
runs = ["kdi-unreadable"]

[[plant.edit]]
file = "crates/cf-e2e/src/door/place.rs"
find = '''    roots.iter().map(|root| key_of(root)).collect()'''
replace = '''    roots
        .iter()
        .map(|root| {
            Ok(key_of(root).unwrap_or_else(|_| Link {
                id: String::new(),
                tail: Vec::new(),
            }))
        })
        .collect()'''

[[plant]]
name = "K3 identity: a place that holds a store is judged by the text of the store's path again"
meant = "a_place_that_holds_a_store_is_not_taken_or_moved_through_its_other_spelling"
runs = ["kdi-holds"]

[[plant.edit]]
file = "crates/cf-e2e/src/door/place.rs"
find = '''        if within(root, place, any_case) || inside_by_identity(&chain(root)?, &key, any_case) {'''
replace = '''        if within(root, place, any_case) {'''

[[plant]]
name = "K3 identity: the seal judges a variable by the text of its path again"
meant = "the_seal_takes_a_variable_that_names_a_store_through_its_other_spelling"
runs = ["kdi-seal"]

[[plant.edit]]
file = "crates/cf-e2e/src/door.rs"
find = '''        let by_identity = ways.iter().any(|way| {'''
replace = '''        let by_identity = false && ways.iter().any(|way| {'''

[[plant]]
name = "K3 identity: the seal lets a path through where a store's identity cannot be read"
meant = "a_store_whose_identity_cannot_be_read_refuses_every_act"
runs = ["kdi-seal-unreadable"]

[[plant.edit]]
file = "crates/cf-e2e/src/door.rs"
find = '''        let Ok(keys) = &self.keys else {
            return true;
        };'''
replace = '''        let Ok(keys) = &self.keys else {
            return false;
        };'''

[[plant]]
name = "K3 identity: a place below a folder this run made is told by the text of its path again"
meant = "a_folder_this_run_made_is_the_runs_through_its_other_spelling_and_a_persons_is_not"
runs = ["kdi-made"]

[[plant.edit]]
file = "crates/cf-e2e/src/door.rs"
find = '''                .any(|part| part.id == id && !part.tail.is_empty())'''
replace = '''                .any(|part| part.id == id && !part.tail.is_empty() && false)'''
