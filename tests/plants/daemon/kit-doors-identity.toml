name = "K3 identity: the seal judges a variable by the text of its path again"
meant = "the_seal_takes_a_variable_that_names_a_store_through_its_other_spelling"
runs = ["kdi-seal"]
platforms = ["macos", "windows"]

[[plant.edit]]
file = "crates/cf-e2e/src/door.rs"
find = '''        let by_identity = ways.iter().any(|way| {'''
replace = '''        let by_identity = false && ways.iter().any(|way| {'''

[[plant]]
name = "K3 identity: the seal lets a path through where a store cannot be read"
meant = "a_store_whose_identity_cannot_be_read_refuses_every_act"
runs = ["kdi-seal-unreadable"]
platforms = ["macos", "linux"]

[[plant.edit]]
file = "crates/cf-e2e/src/door.rs"
find = '''        let Ok(keys) = &self.keys else {
            return true;
        };'''
replace = '''        let Ok(keys) = &self.keys else {
            return false;
        };'''

[[plant]]
name = "K3 identity: a folder the run made counts without the identity it had when it was registered"
meant = "a_folder_put_at_the_path_of_one_the_run_made_is_not_the_runs"
runs = ["kdi-made-id"]

[[plant.edit]]
file = "crates/cf-e2e/src/door.rs"
find = '''                .is_some_and(|then| identity::of_path(&self.real).is_ok_and(|now| now == *then))'''
replace = '''                .is_some_and(|_| true)'''

[[plant]]
name = "K3 identity: a place no part of which can be reached is refused again"
meant = "a_place_below_a_folder_the_account_cannot_enter_is_not_held_for_it"
runs = ["kdi-absence"]
platforms = ["macos", "linux"]

[[plant.edit]]
file = "crates/cf-e2e/src/door/place.rs"
find = '''            Err(_) if links.is_empty() && store.is_none() => {}
'''
replace = '''            Err(failed) if links.is_empty() && store.is_none() => {
                return Err(unresolved(&at, &failed));
            }
'''

[[plant.edit]]
file = "crates/cf-e2e/src/door.rs"
find = '''            place::chain(way).is_ok_and(|parts| {
                keys.iter()
                    .any(|key| place::inside_by_identity(&parts, key, any_case))
            })'''
replace = '''            place::chain(way).map_or(true, |parts| {
                keys.iter()
                    .any(|key| place::inside_by_identity(&parts, key, any_case))
            })'''

[[plant]]
name = "K3 identity: a store that is not there is refused again"
meant = "a_store_that_is_not_there_or_whose_drive_is_not_there_is_judged_by_its_text_alone"
runs = ["kdi-absence-store"]
platforms = ["windows"]

[[plant.edit]]
