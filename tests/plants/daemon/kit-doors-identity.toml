# The plants of K3's doors judged by identity (N7, T-2222, and T-2319's round): a place is inside a
# store by the text of its path or by the file system's identity for it; what the run made is the
# run's by its text and by the identity it had when it was registered; an absence is no refusal;
# the recursive copy asks the door of every child. Each plant names the systems it bites on.
[run]
kdi-ident = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::identity_tests::an_addition_inside_a_store_through_its_other_spelling_is_refused"]
kdi-unreadable = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::identity_tests::a_store_whose_identity_cannot_be_read_refuses_every_act"]
kdi-holds = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::identity_tests::a_place_that_holds_a_store_is_not_taken_or_moved_through_its_other_spelling"]
kdi-seal = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::identity_tests::the_seal_takes_a_variable_that_names_a_store_through_its_other_spelling"]
kdi-seal-unreadable = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::identity_tests::a_store_whose_identity_cannot_be_read_refuses_every_act"]
kdi-made-id = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::identity_reds::a_folder_put_at_the_path_of_one_the_run_made_is_not_the_runs"]
kdi-absence = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::identity_reds::a_place_below_a_folder_the_account_cannot_enter_is_not_held_for_it"]
kdi-absence-store = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::identity_reds::a_store_that_is_not_there_or_whose_drive_is_not_there_is_judged_by_its_text_alone"]
kdi-copy-dir = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::identity_reds::a_recursive_copy_takes_nothing_of_a_store_below_its_starting_folder"]
kdi-copy-file = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::identity_reds::a_recursive_copy_takes_no_hard_link_to_a_file_that_is_a_store"]

[[plant]]
name = "K3 identity: the judge puts a place inside a store by the text of its path again"
meant = "an_addition_inside_a_store_through_its_other_spelling_is_refused"
runs = ["kdi-ident"]
platforms = ["macos", "windows"]

[[plant.edit]]
file = "crates/cf-e2e/src/door/place.rs"
find = '''        (within(place, root, any_case)
            || key
                .as_ref()
                .is_some_and(|key| inside_by_identity(&parts, key, any_case)))
        .then_some(root)'''
replace = '''        within(place, root, any_case).then_some(root)'''

[[plant]]
name = "K3 identity: a store that is there and cannot be read is no store to the judge"
meant = "a_store_whose_identity_cannot_be_read_refuses_every_act"
runs = ["kdi-unreadable"]
platforms = ["macos", "linux"]

[[plant.edit]]
file = "crates/cf-e2e/src/door/place.rs"
find = '''    roots.iter().map(|root| key_of(root)).collect()'''
replace = '''    roots.iter().map(|root| Ok(key_of(root).unwrap_or(None))).collect()'''

[[plant]]
name = "K3 identity: a place that holds a store is judged by the text of the store's path again"
meant = "a_place_that_holds_a_store_is_not_taken_or_moved_through_its_other_spelling"
runs = ["kdi-holds"]
platforms = ["macos", "windows"]

[[plant.edit]]
file = "crates/cf-e2e/src/door/place.rs"
find = '''        if let (Some(key), Some(parts)) = (&key, store_chain(root, false)?) {
            if inside_by_identity(&parts, key, any_case) {
                return Ok(Some(root));
            }
        }'''
replace = ''''''

