# The capture closes its streams before it asks the program to end (probed on Node): on B the case runs
# alone, in a process of its own (stop-deadline's `the_closed_stream_alone`), where no other thread forks a
# program that holds the read end, so its one program dies of the closed stream (integration B round 2,
# T-800: Calliope's T-672 pick, `alone` kept and the tries dropped).

[[plant]]
name = "load timing: a capture out of time closes its streams after the program has ended"
meant = "a_program_out_of_time_that_writes_once_asked_dies_of_its_closed_stream"
runs = ["lt-closed"]
platforms = ["macos", "linux"]

[[plant.edit]]
file = "crates/cf-process/src/capture.rs"
find = '''    drop((stdout, stderr));
    group.end(Ending::Asked);
    (forced(child, group).await, killed)
}'''
replace = '''    group.end(Ending::Asked);
    let ended = forced(child, group).await;
    drop((stdout, stderr));
    (ended, killed)
}'''

