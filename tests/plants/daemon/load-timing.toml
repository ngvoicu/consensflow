replace = "command.spawn()"

# The capture closes its streams before it asks the program to end (probed on Node): the case needs
# one program of its tries to die of the closed stream, since a program another thread has forked and
# not started holds the read end for a moment on a loaded machine, and that one's echo succeeds.

[[plant]]
name = "load timing: a capture out of time closes its streams after the program has ended"
meant = "a_program_out_of_time_that_writes_once_asked_dies_of_its_closed_stream"
runs = ["lt-closed"]
platforms = ["macos", "linux"]

[[plant.edit]]
file = "crates/cf-process/src/capture.rs"
find = '''    drop((stdout, stderr));
    group.end(Ending::Asked);
    (forced(child, group).await, killed)
}'''
replace = '''    group.end(Ending::Asked);
    let ended = forced(child, group).await;
    drop((stdout, stderr));
    (ended, killed)
}'''

# --- cf-daemon: a lost wake still fails the liveness case ---

[[plant]]
name = "load timing: a wake from another thread does not wake the driver"
meant = "wakes_streamed_from_another_thread_while_drains_run_and_end_are_never_lost"
runs = ["lt-liveness"]

[[plant.edit]]
file = "crates/cf-engine/src/runtime/executor.rs"
find = '''            if let Some(driver) = driver {
                driver.wake();
            }'''
replace = '''            if let Some(driver) = driver {
                let _ = driver;
            }'''

[[plant]]
name = "load timing: the driver registers no waker, so that a wake from another thread finds none"
meant = "wakes_streamed_from_another_thread_while_drains_run_and_end_are_never_lost"
runs = ["lt-liveness"]

[[plant.edit]]
file = "crates/cf-engine/src/runtime/executor.rs"
find = '''            *locked(&executor.woken.driver) = Some(context.waker().clone());'''
replace = '''            let _ = context;'''

# --- cf-panes: a flow held up, an ack that frees nothing ---

[[plant]]
name = "load timing: a write holds the table while it waits for the pane's flow, and another pane's waits for the table"
meant = "input_remains_responsive_while_output_waits_for_ack"
runs = ["lt-pty"]
platforms = ["macos", "linux"]

[[plant.edit]]
file = "crates/cf-panes/src/pty.rs"
find = '''        let _active_write = ActiveWrite(active_writes);
        let mut writer = writer.lock().map_err(|_| PaneError::LockPoisoned)?;'''
replace = '''        let _active_write = ActiveWrite(active_writes);
        let _table = self.lock_panes()?;
        let mut writer = writer.lock().map_err(|_| PaneError::LockPoisoned)?;'''

[[plant]]
name = "load timing: an ack frees nothing of the pane's flow"
meant = "input_remains_responsive_while_output_waits_for_ack"
runs = ["lt-pty"]
platforms = ["macos", "linux"]

[[plant.edit]]
file = "crates/cf-panes/src/pty.rs"
find = '''            state.unacked.pop_front();
            state.unacked_bytes -= byte_count;
        }
        self.ready.notify_all();
        Ok(())'''
replace = '''            state.unacked.pop_front();
            state.unacked_bytes -= byte_count;
        }
