# --- T-643: five more tests of the same kind ---
#
# - cf-evals `a_program_waiting_in_a_write_nobody_reads_and_one_stopped_are_told_apart`: its wait went on
#   once two processes were listed, and took the look of a job that had not read the terminal yet (`R`, `S`,
#   `U`), or of a program not yet waiting (`Rs+`); it waits for the job to be `T` under a program in `S`.
# - cf-panes `what_a_program_says_after_an_end_of_its_output_and_before_it_is_seen_gone_is_read`: the test sent
#   SIGKILL to the helper its program leaves, which was still dying when the close of the pane came for it, and
#   the guard of the test's signals, which knew nothing of the helper, stopped the close's SIGTERM. The test
#   registers the helper with the guard and lets the close end it.
# - cf-e2e `a_spawned_programs_input_is_ended_after_everything_queued_is_written`: what the case read of the
#   error output right after the program's end was what the thread that reads it had read so far; on B,
#   `Spawned::wait` waits for the stream's end (merge-flakes' settle, whose plants are merge-flakes.toml's), so
#   the case reads `errors()` after the wait (3.0.6-alpha.3 integration B round 2, T-800).
# - cf-panes `input_remains_responsive_while_output_waits_for_ack` is T-581's (the gates of T-610 failed it at
#   the 10 s it had: "blocked input write resumes after output acks: Timeout").

[[plant]]
name = "load timing: a job is taken for stopped under its program once two processes are listed"
meant = "a_job_is_stopped_under_its_program_only_when_the_states_say_so_not_when_it_is_listed"
runs = ["lt-held"]
platforms = ["macos", "linux"]

