# A human's paste into a Codex window on Windows stayed in its box after Enter (T-1025, T-1048;
# `codex-windows-ignores-enter-after-paste` in consensflow-sme). On Windows the console hands a
# paste on to the program as key presses, and Codex reads them without drawing anything (a
# 7,775-character paste for about 4.5 s on zeewin2), taking an Enter that comes meanwhile for a
# line break in the paste. Its adapter declares it (`Adapter::silent_paste`, Codex on Windows
# alone); the engine opens the window with it, the daemon says it in `pane.open`'s
# `silentPaste`, and the pane host holds the human's keys after their paste in that window
# until it has drawn it: never sooner than its pace, by a print 50 ms or more after the paste,
# then 120 ms of quiet, at the most a second and a millisecond a character; and the terminal's
# replies go past that hold on a worker of their own (Codex asks where the cursor is as a paste
# comes, and read nothing of it while the answer waited behind the held Enter). A window whose
# harness declares nothing has the human's keys as they come. The live suite types as the page
# does (`pane.typed`, line breaks as carriage returns), judges a paste by the trace or the
# chief's answer drawn, and says when each Enter was written.
#
# One plant takes one rule out; a test fails. The Windows ones (`platforms = ["windows"]`) run
# the console tests on a Windows machine. Every name holds `paste enter`, so
# `npm run plants:daemon -- "paste enter"` runs them all.

[run]
paste-enter-proto = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "panes::tests::a_silent_paste_says_its_read_time_and_its_cap_for_a_pastes_length"]
paste-enter-harness = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "silent_paste::"]
paste-enter-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "background::a_window_is_opened_with_how_its_harness_reads_a_paste_where_it_reads_one_silently"]
paste-enter-daemon = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "host::tests::an_open_of_a_harness_that_reads_a_paste_silently_says_how"]
paste-enter-open = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "pane_handlers::tests::the_daemons_own_keys_hold_no_paste_and_no_claim"]
paste-enter-arbiter = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "arbiter::tests::"]
paste-enter-bridge-reply = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "pane_handlers::tests::a_reply_over_the_bridge_goes_past_the_humans_keys_held_after_their_paste"]
paste-enter-page-reply = ["cargo", "test", "--offline", "-p", "app", "--lib", "commands::tests::the_pages_reply_goes_past_the_humans_keys_held_after_their_paste"]
paste-enter-replies = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_terminals_reply_goes_past_the_humans_keys_held_after_their_paste"]
paste-enter-console = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "arbiter::tests::windows::"]
paste-enter-live = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_paste_enter", "tests::"]

