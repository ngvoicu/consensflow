# 3.0.6-alpha.3 integration B round 2 (T-800): B's detached Python server (headless.rs's `SERVER`) has no
# parent to look at, and is given its owner's number in `$OWNER`; the rule reads `os.kill(owner, 0)`.

[[plant]]
name = "fixtures end with their owner: a detached Python server looks no more at its owner"
meant = "no_string_of_a_test_in_the_workspace_runs_on_without_looking_at_its_owner"
runs = ["fx-rule"]
platforms = ["macos", "linux"]

[[plant.edit]]
file = "crates/cf-panes/tests/headless.rs"
find = """
owner = int(os.environ["OWNER"])
def owner_there():
    try:
        os.kill(owner, 0)
        return True
    except OSError:
        return False
"""
replace = """
"""

[[plant.edit]]
file = "crates/cf-panes/tests/headless.rs"
find = """
while owner_there():
    time.sleep(1)
"#;"""
replace = """
while True:
    time.sleep(1)
"#;"""
