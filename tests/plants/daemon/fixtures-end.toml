# T-693, 3.0.6: no test fixture outlives the test process that started it (the class of T-686's
# two shells that ignored TERM and looped for eight hours, and the twenty-six that ignored TERM and
# HUP for four days). A fixture that does not end of itself looks at its owner
# (`kill -0 $PPID`, `kill -0 {owner}` where the owner is not the parent, Python's `os.getppid()`), as
# `cf_base::fixture` does for the programs that ignore signals; the rule test
# `fixtures_end_with_their_owner` (cf-e2e, the `cli` suite) refuses a string of a test that loops
# without. A plant puts one shape back: the owner is not looked at, and the rule (or the case of the
# shape's own, where it has one) fails.
#
# Every name holds `fixtures end with their owner`, so
# `npm run plants:daemon -- "fixtures end with their owner"` runs them all.

[run]
fx-rule = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "cli", "fixtures_end_with_their_owner"]
fx-base = ["cargo", "test", "--offline", "-p", "cf-base", "--lib", "fixture::"]
fx-sentinel = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "sentinel::"]


[[plant]]
name = "fixtures end with their owner: the shared deaf script goes on when its owner is gone"
meant = "a_deaf_script_goes_on_when_asked_to_end_and_ends_when_its_owner_does"
runs = ["fx-base"]
platforms = ["macos", "linux"]

[[plant.edit]]
file = "crates/cf-base/src/fixture.rs"
find = '''{first}while {OWNER_THERE}; do /bin/sleep 0.2; done")'''
replace = '''{first}while :; do /bin/sleep 0.2; done")'''

[[plant]]
name = "fixtures end with their owner: a program that waits to be asked and is not asked loops for ever"
meant = "no_string_of_a_test_in_the_workspace_runs_on_without_looking_at_its_owner"
runs = ["fx-rule"]
platforms = ["macos", "linux"]

[[plant.edit]]
file = "crates/cf-process/src/execute.rs"
find = '''echo hi; while kill -0 $PPID 2>/dev/null; do /bin/sleep 0.05; done'''
replace = '''echo hi; while true; do /bin/sleep 0.05; done'''

