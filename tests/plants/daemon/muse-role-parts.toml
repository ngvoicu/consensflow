# A Muse window's role in parts (T-1246): Muse Code 1.4.14 takes at most 16,384 bytes of a
# SessionStart hook's output, and every chief's role is longer, so the launch gives Muse a hook for
# each part of the role, framed, first among its hooks, and a filler for each of the hooks past them,
# eight in all whatever the role needs (`crates/cf-harness/src/muse/session_hook.rs`: `parts`,
# `blocks`, `FILLER`, the hook that says one block; `muse/launch.rs`: `hooks`, `added_hooks`,
# `integration`; `muse/adapter.rs`: the count and the refusal; `cf hook muse-session`'s third
# word, in `crates/cf/src/hook.rs`), the sizes of the roles ConsensFlow makes held against it
# (`cf-engine`'s `role_change` tests), and the rig's cases on the machine's own Muse
# (`crates/cf-e2e/tests/rig/muse_role.rs`). Every name here begins `muse role parts:`, so
# `cargo xtask plants daemon "muse role parts:"` runs them.

[run]
mrp-hook = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "muse::session_hook::"]
mrp-launch = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "muse::launch::"]
mrp-adapter = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "muse::adapter::"]
mrp-cf = ["cargo", "test", "--offline", "-p", "cf", "--test", "dispatch", "muses_session_hook"]
mrp-pins = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "role_change::tests::the_largest_roles_are_given"]
# The rig's cases on the machine's Muse (none where it has none: they pass, saying why, so
# their plants say `harnesses = ["muse"]` and are not run there).
mrp-rig = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "muse_role::a_muse_chief_with_the_largest_role"]
mrp-rig-chief = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "muse_role::a_resumed_muse_chief"]
mrp-rig-member = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "muse_role::a_resumed_muse_member"]
mrp-rig-window = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "muse_role::a_window_that_resumes"]

# What a part may say: a hook of Muse's takes 16,384 bytes.
[[plant]]
name = "muse role parts: a part is given more than a hook may say"
meant = "the_blocks_of_a_long_role_keep_it_to_the_byte_once_muse_cuts_their_ends_and_each_goes_in_a_hook"
runs = ["mrp-hook"]

[[plant.edit]]
file = "crates/cf-harness/src/muse/session_hook.rs"
find = '''const PART_OUTPUT: usize = 16_000;'''
replace = '''const PART_OUTPUT: usize = 20_000;'''

[[plant]]
name = "muse role parts: the rig's Muse takes a part past its limit and keeps nothing of it"
