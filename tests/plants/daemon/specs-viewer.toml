# The specs viewer (2026-10-15, for 3.0.5: the owner asked for a button beside Project settings that
# opens a project's specs folder in a dialog, its tree on the left, each file shown as it is meant to
# be read; reviewed twice by Astra and Sol as security reviewers, and rebuilt each time on what the
# lead decided of their findings). The daemon reads the folder for the page through page operations
# that change nothing (`specs.tree`, `specs.file`, `specs.present`): the folder the project names,
# else `.specs`, specs on or off, found by a walk from the project's folder that follows no link,
# through a door that opens each name through the folder above it and never a link, reads the very
# object it checked, never waits on a FIFO and refuses a file of two names; within budgets of
# entries, names read (each one the folder gives), depth and bytes, each said in words; off the
# daemon's executor, so many at once, a presence looked at once however many ask. An HTML spec is
# not run in the app: it shows as a card and opens in the browser as a copy of what was read, with
# its assets (`specs.open`, a regular HTML file of the folder only, in time). The page draws the
# board without waiting for the folder, arranges the tree by the registry, shows the registry as
# rows (a parse in linear time, the rows capped), Markdown with its tasks and its Mermaid diagrams
# (so many a document, none drawn for a file left), which draw under the app's own
# Content-Security-Policy (`tauri.conf.json`), with a label sanitizer and a check of the drawing
# behind it. One plant takes one rule out; a test of it fails. The daemon's plants run its tests
# (`page::viewer::`, `page::tests::viewer`, the names of the page's operations in `cf-proto`, and
# cf-process's `hand_over`); three run the door's tests on Windows, on zeewin (`viewer-windows`).
# The page's arranging runs the Node tests of `app/ui/core/specs-folder.js`, and the rest the
# browser's (`app/tests/specs-viewer.spec.mjs`, served under the app's policy, beside a server of
# its own whose arrivals are what left the page, on fixture folders of each Specmint variant and
# hostile ones; Mermaid and xterm are the tracked `app/ui/vendor`, so no plant bundles). Every name
# holds `specs viewer`, so `npm run plants:daemon -- "specs viewer"` runs them all.

[run]
# The door, the folder read, the copies, the opener's program: on folders made by the test.
viewer-folder = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::viewer::"]
# How the opener is handed a file and let go (cf-process).
viewer-hand-over = ["cargo", "test", "--offline", "-p", "cf-process", "--lib", "hand_over"]
# What Windows's sharing keeps out of a held folder, and a junction on the copies' way: the viewer's
# tests on Windows, on zeewin, over ssh (`cargo xtask windows`), from a checkout whose app/.cache and
# resources are folders of its own.
viewer-windows = ["cargo", "xtask", "windows", "--host", "zeewin", "--", "cargo", "test", "-p", "cf-daemon", "--lib", "page::viewer::"]
# A short name given by hand, which takes zeewin's ssh shell to be an administrator's (the test is
# ignored elsewhere): `fsutil file setshortname`.
viewer-windows-admin = ["cargo", "xtask", "windows", "--host", "zeewin", "--", "cargo", "test", "-p", "cf-daemon", "--lib", "short_name_given_by_hand", "--", "--ignored"]
# The operations over the bridge, and the fixture folders read as the page's stand-in answers.
viewer-page = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::viewer"]
# The names of the page's operations, which the app forwards, and which of them wake the dispatcher.
viewer-proto-page = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "page::"]
# The page's arranging of the tree, its registry, its links, in Node.
viewer-arranging = ["node", "--test", "--test-reporter=tap", "tests/specs-folder.test.mjs"]
# The viewer in the browser Playwright keeps, by its parts.
viewer-button = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/specs-viewer.spec.mjs", "-g", "the Specs button"]
viewer-menu = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/specs-viewer.spec.mjs", "-g", "in the project menu"]
viewer-tree = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/specs-viewer.spec.mjs", "-g", "the specs tree"]
viewer-registry = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/specs-viewer.spec.mjs", "-g", "the registry"]
viewer-markdown = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/specs-viewer.spec.mjs", "-g", "a Markdown spec"]
viewer-files = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/specs-viewer.spec.mjs", "-g", "other files"]
viewer-html = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/specs-viewer.spec.mjs", "-g", "an HTML spec"]
viewer-hostile = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/specs-viewer.spec.mjs", "-g", "a hostile spec"]
viewer-policy = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/specs-viewer.spec.mjs", "-g", "the app's policy|makes no request leave"]
viewer-refresh = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/specs-viewer.spec.mjs", "-g", "Refresh"]
# The page's modals, in the browser: a viewer opened in the task that shut it, and the rest of what holds
# an open modal whole (`app/tests/modal-stack.spec.mjs`).
viewer-modals = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/modal-stack.spec.mjs", "-g", "task that shut it"]
viewer-banner = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/modal-stack.spec.mjs", "-g", "its notice is drawn over it"]
viewer-colours = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/specs-viewer.spec.mjs", "-g", "in the page's colours"]

