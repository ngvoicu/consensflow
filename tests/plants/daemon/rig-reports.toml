# What the rig tells of a case that failed, and of none that passed, and what CI keeps of it
# (T-143, 3.0.6; the Windows run of 2026-10-21, 39616304894). A rig dropped unclosed keeps
# its report beside its home (`crates/cf-e2e/src/rig/report.rs`); fourteen cases that passed
# had dropped theirs, and the one report that mattered was lost with the runner, which
# `.github/workflows/ci.yml` now uploads for a failed job. T-428: a rig whose case returns an
# `Outcome` (`crates/cf-e2e/src/outcome.rs`) learns that its case failed when the case's `?`
# makes a `Failed`, so a rig dropped unclosed by a case that passed keeps no report, and a
# report names the test that left it. The tests are `crates/cf-e2e/tests/rig/reports.rs`; the
# plants of the rig's own `Drop` and of the report's say-so are theirs, as are those of the
# cases that must close and of the workflow's two steps. The runs build the rig suite's own
# programs only.

[run]
reports-closed = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "reports::a_rig_its_case_closed"]
reports-error = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "reports::a_rig_its_case_left"]
reports-check = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "reports::a_rig_shut_down"]
reports-said = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "reports::where_a_report"]
reports-closes = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "reports::every_function"]
reports-scan = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "reports::the_scan"]
reports-close-fails = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "reports::a_rig_whose_close_fails"]
reports-close-held = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "reports::a_rig_whose_case_holds"]
reports-live = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "reports::a_live_rigs"]
reports-lib = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "rig::report"]
reports-nested = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "reports::a_nested"]
reports-nested-lib = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "rig::nested"]
reports-nested-rule = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "cli", "nested_cases_name_their_limit::"]
reports-asked = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "reports::a_report_of_a_rig_whose_close"]
reports-xtask-driver = ["cargo", "test", "--offline", "-p", "xtask", "--lib", "plants::driver::tests::the_commands_are_given"]
reports-xtask-runs = ["cargo", "test", "--offline", "-p", "xtask", "--lib", "plants::runs::tests::a_command_is_given"]
reports-xtask-gitless = ["cargo", "test", "--offline", "-p", "xtask", "--lib", "plants::driver::tests::a_run_refused_for_a_checkout"]
reports-xtask-socket = ["cargo", "test", "--offline", "-p", "xtask", "--lib", "plants::driver::tests::the_longest_socket"]
reports-xtask-kept = ["cargo", "test", "--offline", "-p", "xtask", "--lib", "plants::driver::tests::a_run_with_a_plant"]
reports-xtask-removed = ["cargo", "test", "--offline", "-p", "xtask", "--lib", "plants::driver::tests::a_plant_is_in_the_sources"]
reports-homes = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "homes::"]
reports-sweep = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "rig::sweep"]
reports-env = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "rig::install"]
reports-ci = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "reports::ci_uploads"]
reports-passed = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "reports::a_rig_dropped_unclosed_by_a_case_that_passed"]
reports-after = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "reports::a_rig_started_after_a_case_failed"]
reports-panic = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "reports::a_rig_dropped_unclosed_while_a_check_fails"]
reports-not-judged = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "reports::a_rig_not_judged"]
reports-named = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "reports::a_report_names_the_test"]
reports-returns = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "reports::every_case_of_the_rig"]
