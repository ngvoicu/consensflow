# A pause closes a window that ignores it (the zeewin long run of 2026-10-19: a Pi
# worker hung in a model request ignored the pause's Escape, its window read working
# for good, and the words that resumed its task waited 1 h 48 min with 0 attempts).
# Every round of Escape ignored, the window of the pause's task is closed, the task
# stays paused, and the notes say why; resumed, the window opens again on its
# conversation. The engine's tests are in `crates/cf-engine/tests/dispatcher/stops.rs`;
# the case of the regressions, `crates/cf-e2e/tests/regressions/
# a_pause_a_hung_worker_ignored_stranded_its_task.rs`, is the real daemon and pane host
# on a stand-in whose turn takes no Escape (`HANG`), and its run builds the native `cf`
# from the sources as they are planted, so its plant says `builds`.
#
# - a window that ignores every round is left open, as on main (the engine's tests,
#   and the rig's case);
# - a window that did stop is closed;
# - the close loses the paused state: the task goes on by itself;
# - the notes promise words to a task cancelled or ended while its window closed, or
#   queued for another window (Astra on round 1);
# - a window whose member is out of quota is never closed;
# - the rig's case reads the close by sampling the lane for its closed pane, which a
#   look that comes after the window came back never sees (both reviewers on round 1);
# - the live suite's cases against the stand-in agent (`crates/cf-e2e/tests/live_stops/
#   midturn/`) read the lane over the stop as working and then closed, at whatever look
#   the first came: held to "+0.0 s" they failed when the daemon answered the pause late
#   (T-403), and a lane that never closed must still fail them; and a close is read
#   from the pane host's closes of the window, never from a note's words alone (T-807).
#
# Every name holds `pause closes`, so `cargo xtask plants daemon "pause closes"` runs
# them all.

[run]
# The case of the regressions that is the long run's, found by the start of its module's name.
rig-regression-hung-pause = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_pause_a_hung_worker_ignored_stranded_its_task::"], builds = true }
# The engine's own tests of the stops.
engine-lib-stops = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "stops::"]
# The rig's process support, whole: the stop and the continue of a program are tested there.
cf-e2e-lib-process = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "process::"]
# The live suite's case of a pause the daemon answers late (the daemon is stopped for a moment).
live-stops-late = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_stops", "midturn::stand_in::a_pause_the_daemon_answers_a_fifth"]
# The live suite's judge, whole: the reader of the lane over the stop is one of its tests.
live-stops-judge = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_stops", "midturn::judge::"]
# The live suite's case of a stand-in that ignores every round, against the native `cf`.
live-stops-ignored = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_stops", "midturn::stand_in::a_stand_in_that_goes_on_through_three_rounds"], builds = true }

[[plant]]
