# A pause never closes a window (T-1199, the owner's rule of 2026-11-03: "pause should never
# close the window"; before it, from the zeewin long run of 2026-10-19, a window that ignored
# every round of Escape was closed). A window that ignores every round of a pause is kept,
# its task paused, and whoever gave the task and the human are told once that it did not
# stop, what it runs as far as ConsensFlow can tell (nothing it can see, for a hung harness),
# and that only the human can end it, by deleting its session; it is asked again every
# minute, and pays the stop at rest once its turn ends. Only a pause asks a stop: a hold for
# quota, the daemon's resume after it, a resume whose words never went in, a reopen and its
# words ask none (T-1199's bugs 9 and 10: a hold's stop, pressed into a window that waited at
# work to continue by itself, closed it; and one no look paid waited through its task's
# result for the reopen). The engine's tests are in `crates/cf-engine/tests/dispatcher/
# stops.rs`, the ledger's in `crates/cf-ledger/tests/receipt/sessions.rs`; the case of the
# regressions, `crates/cf-e2e/tests/regressions/a_pause_a_hung_worker_ignored_stranded_its_
# task.rs`, is the real daemon and pane host on a stand-in whose turn takes no Escape
# (`HANG`), and its run builds the native `cf` from the sources as they are planted, so its
# plant says `builds`.
#
# - a window that ignores every round is closed (the engine's tests, and the rig's case);
# - a window that did stop is closed;
# - a window kept running nothing is never asked again;
# - the kept note says a task resumed meanwhile is paused, or offers a cancelled one a resume;
# - a hold asks a stop (bug 10), or a resume whose words never went in does;
# - a reopen, or a resume, asks a stop (bug 9's class);
# - the live suite's cases against the stand-in agent (`crates/cf-e2e/tests/live_stops/
#   midturn/`) read the lane over the stop, at whatever look the first came (T-403), and a
#   close is read from the pane host's closes of the window, never from a note's words
#   alone (T-807).
#
# Every name holds `pause closes`, so `cargo xtask plants daemon "pause closes"` runs
# them all.

[run]
# The case of the regressions that is the long run's, found by the start of its module's name.
rig-regression-hung-pause = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_pause_a_hung_worker_ignored_stranded_its_task::"], builds = true }
# The engine's own tests of the stops.
engine-lib-stops = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "stops::"]
# The rig's process support, whole: the stop and the continue of a program are tested there.
cf-e2e-lib-process = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "process::"]
# The live suite's case of a pause the daemon answers late (the daemon is stopped for a moment).
live-stops-late = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_stops", "midturn::stand_in::a_pause_the_daemon_answers_a_fifth"]
# The live suite's judge, whole: the reader of the lane over the stop is one of its tests.
live-stops-judge = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_stops", "midturn::judge::"]
# The live suite's case of a stand-in that ignores every round, against the native `cf`.
live-stops-ignored = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_stops", "midturn::stand_in::a_stand_in_that_goes_on_through_three_rounds"], builds = true }

[[plant]]
name = "pause closes: a window that ignores every round is closed"
meant = "three_rounds_ignored_keep_the_window_said_once_its_task_paused_and_asked_again_every_minute"
runs = ["engine-dispatcher"]

[[plant.edit]]
file = "crates/cf-engine/src/stops.rs"
find = "                    (None, Kept::No) => Kept::Ignored,"
replace = """                    (None, Kept::No) => {
                        self.retire(record).await?;
                        return Ok(());
                    }"""

