# A Muse window in a rig that seats Devin never named its session (T-1081; alpha.1's Mac release
# check, a Muse advisor under a Devin chief, 2 runs of 2): Devin's home sets the four XDG folders
# as the rig's last word, and the daemon looked for the Muse window's session in Devin's data
# folder while the rig's Muse wrote it in the rig's home. Each plant takes one rule of the fix out,
# and the case named in `meant` fails.
#
# - The rig links `muse` under each XDG folder a home moved to the rig's own Muse folder
#   (`crates/cf-e2e/src/rig/install.rs`, `give_muse_its_folders`), and puts back a link a rig
#   before it left in the same home.
# - Devin's home reaches none of the owner's Muse (`crates/cf-e2e/src/live/isolation.rs`,
#   `XDG_HARNESSES`).
# - The rig's Muse on echo keeps its folders in the rig's home, as the live one does
#   (`crates/cf-e2e/src/muse.rs`, `write_stand_in`).
#
# The same live case then showed a second cause, the product's: a pause cancelled the advisor's
# backgrounded command, and Muse 1.4.14 filled its empty box with one of its tips ("Ask to monitor
# a running build or log and get pinged on changes"), which Muse's reader took for words: the
# resume was held for them, 2 runs of 2. A box that shows only a tip, as the cursor says (at the
# box's start, nothing from it drawn plain), is empty, and the human is told so
# (`crates/cf-harness/src/muse/screen.rs`, `only_a_tip`).
#
# Every name holds `muse advisor start`: `npm run plants:daemon -- "muse advisor start"` runs them
# all.

[run]
muse-advisor-start-homes = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "harness_homes::"]
muse-advisor-start-isolation = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::isolation::"]
muse-advisor-start-kit-muse = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "muse::tests::"]
muse-advisor-start-screen = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "muse::screen::"]

[[plant]]
name = "muse advisor start: the daemon reads Muse's folders where a home moved them, not where the rig's Muse writes"
meant = "a_rig_that_runs_muse_beside_devins_home_reads_muse_where_its_muse_writes"
runs = ["muse-advisor-start-homes"]

[[plant.edit]]
file = "crates/cf-e2e/src/rig/install.rs"
find = '''    if config.muse.is_none() {
        return Ok(());
    }
    let own = files::real_path(&root.join("home"));'''
replace = '''    if true || config.muse.is_none() {
        return Ok(());
    }
    let own = files::real_path(&root.join("home"));'''

[[plant]]
name = "muse advisor start: a rig on a home another rig linked fails to start"
meant = "a_rig_that_runs_muse_beside_devins_home_reads_muse_where_its_muse_writes"
runs = ["muse-advisor-start-homes"]

[[plant.edit]]
file = "crates/cf-e2e/src/rig/install.rs"
find = '''                std::fs::remove_file(&link).map_err(Error::file("remove", &link))?;'''
replace = ""

[[plant]]
name = "muse advisor start: Devin's home reaches the owner's Muse"
meant = "a_devin_home_reaches_none_of_the_owners_muse"
runs = ["muse-advisor-start-isolation"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/isolation.rs"
find = '''const XDG_HARNESSES: [&str; 2] = ["devin", "muse"];'''
replace = '''const XDG_HARNESSES: [&str; 2] = ["devin", "devin"];'''

[[plant]]
name = "muse advisor start: the rig's Muse on echo keeps its folders where a home moved them"
meant = "the_rigs_muse_on_echo_keeps_its_folders_in_the_rigs_home_as_the_live_one_does"
runs = ["muse-advisor-start-kit-muse"]

[[plant.edit]]
file = "crates/cf-e2e/src/muse.rs"
find = '''( IFS=$'\x1f'; printf '%s\x1e' "$*" ) >> '{argv}'
export XDG_CONFIG_HOME='{rig}/.config' XDG_DATA_HOME='{rig}/.local/share' XDG_CACHE_HOME='{rig}/.cache'
'''
replace = '''( IFS=$'\x1f'; printf '%s\x1e' "$*" ) >> '{argv}'
: '{rig}'
'''

[[plant]]
name = "muse advisor start: a box that shows only Muse's tip holds words"
meant = "a_box_that_shows_only_muse_s_tip_is_empty_and_words_typed_there_are_held"
runs = ["muse-advisor-start-screen"]

[[plant.edit]]
file = "crates/cf-harness/src/muse/screen.rs"
find = '''        if (typed.is_empty() && !more) || only_a_tip(screen, first, more, cursor) {'''
replace = '''        if (typed.is_empty() && !more) || (false && only_a_tip(screen, first, more, cursor)) {'''

[[plant]]
name = "muse advisor start: the human is told Muse's tip as the box's words"
meant = "a_box_that_shows_only_muse_s_tip_is_empty_and_words_typed_there_are_held"
runs = ["muse-advisor-start-screen"]

[[plant.edit]]
file = "crates/cf-harness/src/muse/screen.rs"
find = '''    if only_a_tip(screen, first, more, cursor) {
        return Some(String::new());
    }'''
replace = ""

[[plant]]
name = "muse advisor start: words typed in Muse's box with the cursor at their start read as a tip"
meant = "a_box_that_shows_only_muse_s_tip_is_empty_and_words_typed_there_are_held"
runs = ["muse-advisor-start-screen"]

[[plant.edit]]
file = "crates/cf-harness/src/muse/screen.rs"
find = '''            cursor.line == first && cursor.col == start && cursor.plain_after == 0'''
replace = '''            cursor.line == first && cursor.col == start'''
