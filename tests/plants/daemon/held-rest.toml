# Plants for the Fixed pages whose test held the bug but had no plant to prove it (the audits of
# 2026-10-29, T-961 and T-962, read again by T-976; Gabriel: "we don't want issues that happen once
# and are fixed to happen again"; rule 6 of `decisions/2026-10-21-every-bug-and-feature-gets-tests.md`
# in consensflow-sme: every Fixed issue page names the test and the plant that hold it). Each plant
# puts a fix's bug back, and the test the page names fails:
#
# - the role cards say the result is the final message of the turn (answers-reach-the-board-shortened);
# - the Pi channel looks a second past a record's expiry for the extension's verdict, and looks
#   until that deadline (ci-pi-ack-timeout-race);
# - a paste its window did not send is pressed Enter again (devin-chief-launch-message-left-unsubmitted);
# - a window whose own question dialog is open is a window waiting (no-waiting-for-input-marker);
# - the Pi extension sends a message id it settled no more (pi-extension-double-send);
# - a queue removal names the message whose envelope has other attributes (results-held-at-the-gate);
# - the PowerShell that says when a process began is given time (stand-in-detached-job-dies-on-the-
#   windows-runner), a Windows plant;
# - a page of a list is cut at half a frame (state-list-grows-toward-frame-cap);
# - a terminal takes a size once it has held, and its card is its own width (terminal-resize-cascade);
# - what the router keeps of a window is bounded (the-rigs-capture-is-unbounded);
# - a turn ended for its quota is read as one (devin-quota-turn-end-not-read);
# - a stand-in's `cf` form that no longer parses turns a rig case red (packaged-smoke-silently-broken);
# - a platform that installs nothing itself reads the feed for a page (windows-update-check-platform-
#   not-found), the Mac's and Windows' plants;
# - B7 of field-reports-2026-10-15: a search sends its words, a page is from one, a page counts its
#   items from the first; A3: the note that a worker goes on comes before its result.
#
# A1 of that page has its plant already, in `background.toml` ("background regression: a build's
# daemon, its build ended, is taken for the turn's work and told as left"), and the rest of B7 in
# `decisions-306.toml` ("transcript pages: …"). The T-139 plants of `the-rigs-capture-is-unbounded`
# are in `long-run.toml` ("long run: the rig keeps every byte a window printed, …").
#
# Every name here begins `held-rest:`, so `npm run plants:daemon -- "held-rest:"` runs them all.

[run]
# The role texts, and the golden of Node's chief text that holds them whole.
rest-engine-text-goldens-roles = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text", "goldens_roles"]
# The text's goldens hold no tester (Node had none): the tester's card is read by its own test.
rest-engine-text-roles-tester = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text", "roles::teach_the_tester_only_the_board_s_commands"]
# The Pi channel's looks for the extension's verdict, on a clock the test moves.
rest-pi-send-record = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "pi::channel::send::tests::record::"]
# A paste the window still holds is pressed Enter again.
rest-engine-still-there = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "--", "still_there::"]
# What a record says a window waits for.
rest-record-state = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::record_state::tests::"]
# The Pi extension's followups, sent by Rust.
rest-pi-message = ["node", "--test", "--test-reporter=tap", "tests/pi-message.test.mjs"]
# Claude's record read across the queue's operations.
rest-claude-queues = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record::tests::queues::"]
# The rig case of a job the agent detached from its shell, on the machine's own processes.
rest-rig-detached-job = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "background_work::a_job_the_agent_detached_from_its_shell"]
# What a page of a list holds of a frame, in the ledger and over the bridge.
rest-ledger-page-reads = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "page_reads::tests::"]
rest-daemon-history = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::history::"]
# The terminals of the page, with a real xterm: the resizes a drag makes of one.
rest-page-resize = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "resizes a terminal once"]
# What the rig's router keeps of a window's output.
rest-e2e-route = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "rig::route::"]
# Devin's wire log, and what it says of its quota.
rest-devin-wire-log = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "devin::wire_log::tests::"]
# The rig case of a test put on the board by the stand-in chief, to a tester's window.
rest-rig-tiered-test = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "core_tiered::a_test_is_a_task"]
# The app's updates module, and the page's dialog of them.
rest-app-updates = ["cargo", "xtask", "app", "test", "updates::tests"]
rest-page-updates = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/updates.spec.mjs", "-g", "download page"]
# `cf task get T-n --transcript --page N` and `--find`, as a window runs them.
rest-cf-transcript-pages = ["cargo", "test", "--offline", "-p", "cf", "--test", "transcript_pages"]
# A worker's turn that ends with agents pending, on the engine's fake windows.
rest-engine-pending-agents = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "--", "pending_agents::"]

