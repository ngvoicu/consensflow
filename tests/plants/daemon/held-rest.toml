# --- the start time of a process on Windows (stand-in-detached-job-dies-on-the-windows-runner) ---
#
# The PowerShell that says when a process began took 11 to 17 s on GitHub's Windows runner and was
# ended at the 30 s a program is given under a suite's load: a job that ran was said to be none. A
# plant cannot put the old 30 s back, which is a bound met only on a loaded machine; it gives the
# PowerShell no time at all, which says of every process that it began never. A Windows machine's
# plant (`cargo xtask windows --machine zeewin2 -- cargo xtask plants daemon "held-rest: the
# PowerShell"`), skipped elsewhere.

[[plant]]
name = "held-rest: the PowerShell that says when a process began is given no time to start"
meant = "a_job_the_agent_detached_from_its_shell_is_left_running_and_nothing_is_said_of_it"
platforms = ["windows"]
runs = ["rest-rig-detached-job"]

[[plant.edit]]
file = "crates/cf-e2e/src/process/pid.rs"
find = "        .limit(STARTED_LIMIT)"
replace = "        .limit(std::time::Duration::from_millis(1))"

