file = "crates/cf-ledger/src/projects/claude_compaction.rs"
find = '''    (CLAUDE_COMPACTION_MIN..=CLAUDE_COMPACTION_MAX)'''
replace = '''    (0..=CLAUDE_COMPACTION_MAX)'''

