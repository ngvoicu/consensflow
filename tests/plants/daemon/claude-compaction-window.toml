# The size a project chooses for its Claude members' windows to compact at (spec
# smaller-contexts, SCX-24 to SCX-26, T-1017): kept in the ledger (`crates/cf-ledger/src/projects/
# claude_compaction.rs`, migration 0026's second column), chosen on the page alone
# (`project.compaction`, Project settings' "Compaction for Claude members"), given by the engine to
# a Claude member's launch at launch and on resume and never to the chief's or another harness's
# (`crates/cf-engine/src/windows.rs`), and written by Claude's adapter into the launch's own
# settings file as `autoCompactWindow` (`crates/cf-harness/src/claude/install.rs`, T-1016's
# route), never into the owner's. Each plant breaks one of these and the test written for it fails.
#
# Every name holds `claude compaction`, so `npm run plants:daemon -- "claude compaction"` runs them all.

[run]
cc-ledger-lib = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "projects::claude_compaction::"]
cc-ledger-described = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "described", "claude_compaction::"]
cc-ledger-testing-lib = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "testing::staff_rules::"]
cc-engine-dispatcher = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "compaction_window::"]
cc-harness-launch = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "claude::compaction_window"]
cc-harness-tooling = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "tooling::"]
cc-daemon-page = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::claude_compaction"]
cc-proto-page = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "page::"]
cc-page-suite = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "Compaction for Claude members|the Claude members' compaction|saves the choice of a size|holds the size to the range"]

[[plant]]
name = "claude compaction: the ledger takes a size below the range"
meant = "a_size_below_or_above_what_claude_takes_is_refused_in_the_words_that_say_the_range"
runs = ["cc-ledger-lib"]

