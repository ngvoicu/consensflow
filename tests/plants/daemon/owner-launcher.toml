# The owner's launchers of the harnesses, which a live run never moves (T-1082, found by the alpha.1
# Mac release check, T-1068): a live run keeps the person's `HOME`, and Claude Code's native updater
# put its newest version in the run's throwaway `XDG_DATA_HOME` and re-pointed the person's
# `~/.local/bin/claude` at it, a link into a folder the run removed. Two rules keep a run off the
# launchers (`live/launcher.rs`): every window and probe of the kit is told to update no harness
# (Claude Code's two switches, Muse's one: the rig's environment, and the probe of a version), and
# every launcher of a harness the rig seats is hashed around the run, as the link it reads, where
# it ends, the bytes of the file it ends at, and the entries of the folder the harness installs
# its versions in. One plant takes one rule out; a test of it fails. Every name holds `owner launcher`.
# Most tests make links and run a shell updater, which only the Unix machines have, so most plants are run
# there; the ones whose tests hold with a launcher that is a file, as Windows installs one, are run on
# every machine (without them a plants run on Windows would run no test and read every plant as missed).

[run]
launcher-unit = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::launcher"]
launcher-rig = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "owner_launchers::"]
keychain-unit = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::keychain"]
login-unit = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::login"]
evals-login-unit = ["cargo", "test", "--offline", "-p", "cf-evals", "--lib", "run::login"]

