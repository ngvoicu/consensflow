# The owner's Keychain (T-1102): a Claude Code that is given a config folder of its own keeps what it
# stores in the login Keychain under a name made of the folder's path, and the folder goes with the
# run. Three rules: the guard of Claude Code lists the Keychain's names around every rig and fails
# the rig that ends for one gained (`live/launcher.rs`); the item of a folder is named as Claude Code
# names it, and a login that went into it is said once, as that (`live/keychain.rs`, `live/login.rs`);
# a probe that cannot take --strict-mcp-config has a `security` that holds no item first on its PATH.
# The cases that write an item of the Keychain are the Mac's.

