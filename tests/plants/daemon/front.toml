[[plant.edit]]
file = "crates/cf-daemon/src/api/credentials.rs"
find = "        self.by_digest.borrow_mut().remove(&digest(token));"
replace = "        let _ = token;"

[[plant]]
name = "credentials: any word is the UI token"
