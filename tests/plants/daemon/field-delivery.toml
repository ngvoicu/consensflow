# Two delivery bugs from Gabriel's other Mac (T-958, issues/a-chiefs-queue-held-silently-
# while-its-window-read-at-work.md and issues/a-tells-answer-and-the-result-carry-one-report.md
# in consensflow-sme).
#
# 1. On 3.0.6-alpha.2 the chief's window, opened again at a Resume with no proof that the
#    program before it was gone, read at work for 54 hours while its record answered the
#    human: the closing Claude Code had queued the notification of the job it ended, and
#    seven results waited, queued, with no word to anyone. A notification of a job Claude
#    Code ended begins no turn (T-814), at the reopen too; and a chief's window not at rest
#    holds the head of its queue on the clock every hold of it runs on, told to the human
#    once at ten minutes, in words that say what holds it and whether its record answered
#    since or its harness says it waits at its prompt, and said on the chief's lane.
# 2. The answer of a window's turn on a tell, given in a note, and the result of the turn
#    its resume began each carried the report: the note says it is not the result and that
#    the result comes as its own message, and the result's paste names the note and says it
#    is the one to decide.
#
# One plant takes one rule out; a test of it fails. Every name holds `field delivery`, so
# `npm run plants:daemon -- "field delivery"` runs them all.

[run]
fd-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "held_at_work::"]
fd-reopen = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "claude::relaunched::a_window_opened_again_without_a_proof_reads_its_turns_at_rest_after_the_closing_process_queued_a_killed_job"]
fd-answers = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "paused_answers::"]
fd-ledger-lib = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "messages::paused_answers"]
fd-ledger-notes = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "pause_notes"]

