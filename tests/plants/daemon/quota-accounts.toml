# Results stayed queued after a quota pause (the field report of 2026-10-22, 3.0.5, T-254): the
# chief ran on the account its members ran on and ran out with them, so ConsensFlow marked it out
# until the reset two days on. A `/login` brought the members back, their windows answering again,
# but a chief at rest takes no turn of its own, so it stayed out and every result sent to it stayed
# queued, and the board told the human nothing of it.
#
# The rules: where a harness logs every window into one account (`Adapter::one_account`, Claude
# Code's), a turn of any window that gets through is news for every other participant out on that
# harness, the chief among them, marked out before it (`crates/cf-engine/src/scheduler.rs`,
# `back_on_its_account`, called in `dispatcher.rs`'s step), and the human's Try again now on any of
# them brings back all (`back_from_quota`). One account is not one quota (Calliope's review, T-287):
# a member back from its reset brings back none out until a later one, and a window that was never
# out brings one back once for each reset. A window out of quota with a message waiting for it is
# said to the human once for each mark, naming what waits (`tell_what_waits`, called in
# `while_out`). The engine's tests are `crates/cf-engine/tests/dispatcher/quota_accounts.rs`; the
# case is `crates/cf-e2e/tests/regressions/results_stay_queued_after_a_quota_pause.rs`, whose
# stand-in chief and worker share an account that runs out (`CF_TEST_QUOTA_SPENT`).
#
# The case builds the native `cf` from the sources as they are planted, so its plants say `builds`.
# Every name holds `quota-accounts`, so `npm run plants:daemon -- "quota-accounts"` runs them all.

[run]
quota-accounts-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "quota_accounts::"]
quota-accounts-words = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "scheduler::tests"]
quota-accounts-rig = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "results_stay_queued_after_a_quota_pause::"]

[[plant]]
name = "quota-accounts: a window's turn that gets through brings back only its own member, and the chief at rest is never handed its worker's result"
meant = "a_chief_out_of_quota_with_its_worker_is_handed_the_result_once_the_workers_window_answers_on_the_new_account"
runs = ["quota-accounts-rig"]
builds = true

