# Where these rules meet turn-end's (T-530's merge of 3.0.6-alpha.3): a refusal is no result, what a
# held task tells a chief out of quota waits and is said to the human, and a refused turn ends its
# task's hold.

# The refusal is kept from the result rule twice: the refused task is held, so its resume's
# words are pasted before any answer is read (mark_back makes the hold due), and a task still
# at work when its window reads a refusal goes on (cut_short) before turn_end::collect. The
# plant takes both away, so a refusal reaches collect.
[[plant]]
