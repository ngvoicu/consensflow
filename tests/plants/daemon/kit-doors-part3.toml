# The plants of K3's doors, part 3: the guards a critical review (T-2086, P4) found with no plant,
# each held now by a test that fails when it goes: the judge's ground by act, a write through a last
# link, a name below a file, `program_of` and the window's refusals of the Keychain's utility and
# cargo, the seal's refusal of the door's own variables and of one profile half, `inheritable` and
# the removal of the machine's profile halves.
[run]
kd3-lib-door = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::"]
kd3-lib-process = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "process::tests"]
kd3-lib-renew = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::renew"]

[[plant]]
name = "K3 part 3: a name a caller gives is made over what is there"
meant = "the_judges_ground_is_by_the_act"
runs = ["kd3-lib-door"]

[[plant.edit]]
file = "crates/cf-e2e/src/door/place.rs"
find = '''        Act::Name => fs::symlink_metadata(path).is_err(),'''
replace = '''        Act::Name => true,'''

