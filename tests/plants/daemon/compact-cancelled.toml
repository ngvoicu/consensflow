name = "compact-cancelled: the words before a command beside a bare /compact end nothing, and the chief reads working until the human types"
meant = "a_claude_chief_whose_compact_the_human_cancelled_is_at_rest_and_is_handed_its_workers_result_alone"
runs = ["compact-cancelled-rig"]
builds = true

