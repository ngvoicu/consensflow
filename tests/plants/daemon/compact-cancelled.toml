# A `/compact` the human cancelled with Escape held the Claude chief, and would have taken the
# next message (3.0.6, item 6b; the live suite `commands-at-rest`, Claude Code 2.1.304 and
# 2.1.310). Claude Code writes of the cancel the bare `/compact` and, at the Escape, the words it
# writes before a command (`<local-command-caveat>`, a meta record), a sibling of the bare
# command, and nothing more, and puts the `/compact` back in its input box. Claude's reader ends
# the turn at those words and says the command is back in the box (`Lines::put_back`;
# `crates/cf-harness/src/claude/record/replay.rs`, `project.rs`, `patterns.rs`, `record.rs`); the
# adapter reads the box on the screen before the next paste and clears it with one Ctrl+C where it
# shows text and the human typed nothing, pastes with no key where it reads empty, and holds the
# paste as the human's unsent words where the screen shows no box, which the board says
# (`holding`; `crates/cf-harness/src/claude/adapter.rs`, `shared/input_box.rs`). The long run's watch reads a command the system writes whole as no turn
# (`crates/cf-evals/src/long_run/record.rs`, `Kind::Printed`). The reader's tests are
# `crates/cf-harness/src/claude/record/tests/commands.rs`, the adapter's
# `crates/cf-harness/tests/launch/claude/compact_cancelled.rs` (on a live run's records), the
# case `crates/cf-e2e/tests/regressions/a_cancelled_compact_held_the_chief_and_took_its_next_message.rs`,
# whose stand-in cancels a compaction as Claude Code does.
#
# The case builds the native `cf` from the sources as they are planted, so its plants say
# `builds`. Every name holds `compact-cancelled`, so `cargo xtask plants daemon compact-cancelled`
# runs them all.

[run]
compact-cancelled-reader = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record"]
compact-cancelled-adapter = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "claude::compact_cancelled"]
compact-cancelled-rig = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_cancelled_compact_held_the_chief_and_took_its_next_message::"]
compact-cancelled-watch = ["cargo", "test", "--offline", "-p", "cf-evals", "--lib", "long_run::record"]
compact-cancelled-live = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_commands_at_rest"]
compact-cancelled-live-product = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_compact_cancelled"]
compact-cancelled-scrub = ["cargo", "test", "--offline", "-p", "xtask", "--lib", "scrub_transcript::"]
compact-cancelled-kit = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::claude"]

