# Shift+Enter in a window is the new line its harness takes (T-1330, T-1336). xterm.js 6 has no kitty
# keyboard protocol and no modifyOtherKeys and sends the plain Enter's CR for Shift+Enter, so a
# message was sent where the human asked for a new line, in every harness. The page now sends
# (`shiftEnterFor`, app/ui/term.js):
#
# - **a key that never starts with Escape** (T-1336): a read that ends between the two bytes of a write
#   (a pty's input queue nearly full behind a long paste, the console host's 4,096-byte read) reads an
#   Escape alone, which stops a running turn. So Ctrl+J, a line feed, on a Mac in every harness and on
#   Windows for Claude Code and Pi;
# - Alt+Enter (ESC CR) to Codex, Devin and Muse on Windows, which read key events there (a line feed is
#   the Enter key with Control, bound to nothing; `CSI 13;2u` is seven typed characters), **until the
#   human decides** (T-1336);
# - only for Shift+Enter alone, typed and not chosen in an input method, once, as the human's own
#   key (a reply of the emulator would take another road), with nothing left for xterm to send
#   after it; Alt+Enter and Ctrl+J typed stay xterm's;
# - to the window of the harness it was **launched** with, which the daemon says with the pane
#   (`pane.harness`): a member edited while its window is open runs the new harness from its next
#   window, and a reload changes nothing; the card tells the emulator;
# - the arbiter counts a line feed as a character of the draft, not an Enter that clears it, so a
#   delivery stays held behind a Shift+Enter.
#
# `app/tests/fixtures/pane-keys/newline-cases.json` says what the page writes (`sends`) and what each
# harness's input box does with each byte string a pane might write (`make-newline-cases.mjs`: Pi's
# editor and Codex's key reader run, the others read from their source and documentation), and the
# page tests are held to it, in a real xterm, on a Mac's user agent and on Windows'. The real-pty
# test of `cf-panes` (`pty/keys.rs`, `boundary`) reads the same `sends`. What the console host makes
# of the bytes is the Windows tests' of `cf-panes`, which need a Windows machine (no plant of them).
#
# One plant takes one rule out; a test of it fails. Every name holds `pane shift enter`, so
# `npm run plants:daemon -- "pane shift enter"` runs them all.

[run]
pse-page = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "Shift.Enter in a window|keeps the keys of the harness"]
pse-arbiter = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "arbiter::"]
pse-boundary = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "pty::keys::boundary"]
pse-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "launched_harness"]
pse-daemon = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::engine::tests"]

