# Shift+Enter in a window is a line feed (T-1330, T-1336, T-1348). xterm.js 6 has no kitty keyboard
# protocol and no modifyOtherKeys and sends the plain Enter's CR for Shift+Enter, so a message was
# sent where the human asked for a new line, in every harness. The page now sends (`SHIFT_ENTER`,
# app/ui/term.js):
#
# - **one byte, a line feed (Ctrl+J), in every harness on a Mac and on Windows**: a key that begins
#   with Escape can reach a window as an Escape alone (a pty's input queue nearly full behind a long
#   paste, the console host's 4,096-byte read), which stops a running turn, and then the rest, which
#   may send the message. Claude Code, Codex, Devin, Muse and Pi list Ctrl+J as a new line on a Mac, and
#   Claude Code and Pi on Windows. Codex, Devin and Muse on Windows read the console's key events, which
#   make a line feed the Enter key with Control, bound to nothing: Shift+Enter does nothing there, safely;
# - only for Shift+Enter alone, typed and not chosen in an input method, once, as the human's own
#   key (a reply of the emulator would take another road), with nothing left for xterm to send
#   after it; Alt+Enter and Ctrl+J typed stay xterm's;
# - the arbiter counts a line feed as a character of the draft, not an Enter that clears it, so a
#   delivery stays held behind a Shift+Enter;
# - the daemon says the harness a window was **launched** with, with its pane (`pane.harness`), and the
#   page takes what a file dropped on the window may carry from it, not from the harness the member is
#   configured to run now (a member edited while its window is open runs the new harness from its next
#   window).
#
# `app/tests/fixtures/pane-keys/newline-cases.json` says what the page writes (`sends`), what that does in
# each harness's input box (`shiftEnter`), and what each harness's input box does with each byte string a
# pane might write (`make-newline-cases.mjs`: Pi's editor and Codex's key readers run, the others read from
# their source and documentation), and the page tests are held to it, in a real xterm, on a Mac's user agent
# and on Windows'. The real-pty test of `cf-panes` (`pty/keys.rs`, `boundary`) reads the same `sends`. What the
# console host makes of the bytes is the Windows tests' of `cf-panes`, which need a Windows machine (no plant
# of them). A guard in the pane host that waited for an empty pipe before an Escape-led write was built and
# taken out again (T-1336, T-1348): its plants went with it.
#
# One plant takes one rule out; a test of it fails. Every name holds `pane shift enter`, so
# `npm run plants:daemon -- "pane shift enter"` runs them all.

[run]
pse-page = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "Shift.Enter in a window|goes by .*, which a window was launched with"]
pse-arbiter = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "arbiter::"]
pse-boundary = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "pty::keys::boundary"]
pse-sends = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "pty::keys::sends"]
pse-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "launched_harness"]
pse-daemon = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::engine::tests"]

