ki-lib-door = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::"]
ki-lib-stores = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::stores"]
ki-lib-ask = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::ask"]
