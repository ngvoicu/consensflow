# A member works to 100% of its quota (Gabriel, 2026-11-09, T-1356): "this needs to be removed; we
# allow 100% even if the task is blocked because of quota and wait as the others". A critical
# review waited with "T-1355 waits for a free critical advisor: @gpt-6-astra-max is low on quota"
# while the Codex account had 5% left. Codex and Muse report their usage ahead of a refusal
# (`Level::Low` from 95 percent: `crates/cf-harness/src/codex/quota.rs`, `muse/usage.rs`), and the
# scheduler kept such a member from every new task until the reset it named, or for an hour
# (`low_until`, `is_low`, in `crates/cf-engine/src/scheduler.rs`). Claude Code, Pi and Devin report
# no count, so their members took work until the harness refused. Now a member is held only when it
# is out (`out_until`): its harness refused, its account was refused, its model moved, or its server
# was busy; a quota nearly spent holds nobody, on any harness.
#
# The plants put the hold back, as it was: a mark on the member's own record at each look that
# reports the count low (`dispatcher.rs`, where `record_quota` is called), and a reason in
# `why_not_free` that reads it. One for every harness, one for Codex alone and one for Muse alone,
# the two the old hold fell on. The tests are in `crates/cf-engine/tests/dispatcher/quota.rs`: a
# member at 96 percent is given work, runs out mid-task, and goes on after the reset, on each of
# Claude Code, Codex and Muse. Two more hold what is kept: a count past 95 percent is an
# allowance, which brings back a member whose account was unavailable (`shows_an_allowance`); and
# a Codex refusal at the edge of its allowance takes the reset of the window that is past 95
# percent (`reset_after`), which picks a reset and holds nobody.
#
# The same table holds the plants of T-1357, the quota the person renewed by hand: the board
# learns of a quota from a record of one of a member's windows, so a member marked out until its
# reset stays out when the human renews the quota early, unless they say so (Try again now,
# `member.back`, `back_from_quota`). Their word is for the account they renewed: every member on
# the harness's one login is back (`Adapter::one_login`: Claude Code, Codex, Devin and Muse, not
# Pi, which logs into a provider for each model), in every project; the wait for a free member
# says what to press (`scheduler.rs`, `out_for_a_reset`), and the board's lane and a held task's
# card say the quota may have been renewed. Tests: `crates/cf-engine/tests/dispatcher/
# renewed_quota.rs`, `crates/cf-harness/tests/launch/one_login.rs`, the page's.
#
# Every name holds `no low hold`, so `cargo xtask plants daemon "no low hold"` runs them all.

[run]
no-low-hold-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "quota::"]
no-low-hold-accounts = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "unavailable_accounts::"]
no-low-hold-codex = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "codex::record"]
no-low-hold-renewed = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "renewed_quota::"]
no-low-hold-busy = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "busy_models::"]
no-low-hold-login = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "one_login"]
no-low-hold-page-lane = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "shows a member out of quota"]
no-low-hold-page-daemon = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::busy"]
no-low-hold-page-holds = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "a member out of quota says so, to renew|a member held for its account says|a member whose model is busy"]
no-low-hold-page-staff = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "the staff in Project settings says a member is out"]
no-low-hold-page-card = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "a task held while its member is out of quota says when it goes on"]

