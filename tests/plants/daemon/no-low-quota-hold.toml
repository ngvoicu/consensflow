    pub(crate) handled: Option<Arc<Quota>>,
    pub(crate) low_until: Option<String>,
'''

[[plant.edit]]
file = "crates/cf-engine/src/scheduler.rs"
find = '''
                Held::Quota => format!("@{} is out of quota until {until}", member.handle),
            });
        }
        None
    }
'''
replace = '''
                Held::Quota => format!("@{} is out of quota until {until}", member.handle),
            });
        }
        let until = self
            .record(member.id)
            .and_then(|record| record.quota.borrow().low_until.clone());
        if self.out(until.as_deref()) {
            return Some(format!("@{} is low on quota", member.handle));
        }
        None
    }
'''

[[plant.edit]]
file = "crates/cf-engine/src/dispatcher.rs"
find = '''
        self.record_quota(record, observed.quota.clone());
'''
replace = '''
        self.record_quota(record, observed.quota.clone());
        let low = observed
            .quota
            .as_deref()
            .filter(|quota| quota.level() == cf_harness::records::Level::Low)
            .map(|quota| self.reset_of(Some(quota)));
        self.record_of(owner.id).quota.borrow_mut().low_until = low;
'''

