# D3's N35 (T-2108): a turn that fails is tried again twice before its task fails, each try a hold
# of the task and main's own Resume. The count is read from the message last pasted into the window
# (`turn_retry_tries`), never kept; the fact of a hold is written once with the hold; the Resume's
# words go into no window whose question is open; the exit's look reads what a pass's look reads.
#
# Not planted, since each is equivalent to what the code does anyway:
# - the chief held out of a retry (`participant.role == "chief"` in `failed_end`): the chief's turn never
#   reaches the failed-turn path of `collect`, which only a staff window's look calls;
# - a try counted before its paste is received (`last_pasted` taking a message still on its way): a
#   Resume that is not yet received makes `collect` return at `resume_words_wait` before any failed end
#   is read, so no look reaches the count with such a message last.
#
# Every name holds `n35 hold`, so `cargo xtask plants daemon "n35 hold"` runs them all.

[run]
n35-dispatcher = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "n35_hold"]
n35-probe = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "held_route"]
n35-ledger = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "turn_retry"]
n35-devin = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "error_before_text"]

[[plant]]
name = "n35 hold: a third try"
meant = "the_second_failed_end_holds_two_minutes_from_its_look_and_the_third_fails_the_task"
runs = ["n35-dispatcher"]

