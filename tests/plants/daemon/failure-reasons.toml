meant = "a_request_id_that_differs_each_turn_is_the_same_failure"
runs = ["failure-reason-told"]

[[plant.edit]]
file = "crates/cf-engine/src/shown.rs"
find = '''
        (pattern(r"[A-Za-z0-9]{16,}"), "#id"),
'''
replace = '''
        (pattern(r"[A-Za-z0-9]{160,}"), "#id"),
'''

