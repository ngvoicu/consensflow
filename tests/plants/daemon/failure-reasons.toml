runs = ["failure-reason-engine"]

[[plant.edit]]
file = "crates/cf-harness/src/contract.rs"
find = '''
            Some(Reading::Known(record)) if self.failed => record.failure.as_deref(),
'''
replace = '''
            Some(Reading::Known(_)) if self.failed => None,
'''

[[plant]]
name = "failure reason: a record that says nothing of why leaves the window's screen unasked"
