# Every failure note names its reason (dip-agentos, 2026-10-17 to 19, ConsensFlow
# 3.0.4: each failure said only "the harness reported a failure", and neither the
# chief nor the human could tell a crash from a refusal from a bad model name; row 4
# of `issues/field-reports-2026-10-19-dip-agentos.md` in consensflow-sme). Each
# harness's record keeps the words its failed turn ended with
# (`crates/cf-harness/src/*/record*`, `Record::failure`), and the engine's note
# quotes them, held to a quote's bounds, or else the window's last screen lines
# (`crates/cf-engine/src/deliveries.rs`, `why_it_failed`; `shown.rs`,
# `after_words`), where turn-end's `collect` fails the task
# (`crates/cf-engine/src/turn_end.rs`, since the merge with turn-end, T-531). The
# engine's cases are
# `crates/cf-engine/tests/dispatcher/failure_reasons.rs`; the rig's case, whose
# stand-in Codex fails a turn in Codex's shape, is
# `crates/cf-e2e/tests/regressions/a_failure_said_no_reason.rs`, and its run builds
# the native `cf` from the sources as they are planted.
#
# Every name holds `failure reason`, so `cargo xtask plants daemon "failure reason"`
# runs them all.

[run]
failure-reason-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "failure_reasons"]
failure-reason-told = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "told_once"]
failure-reason-shown = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "shown::"]
# The dispatcher's budget for an operation's future (`dispatcher/tests.rs`).
engine-future-sizes = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "dispatcher::tests::an_operations_work_is_small"]
failure-reason-ask = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "testing::ask"]
failure-reason-live-suite = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_paste_screen"]
# The kit's homes (`live/isolation.rs`), where the copy of a harness's login a live suite runs on is made.
failure-reason-live-homes = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::isolation"]
failure-reason-live-muse-rig = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::machine::tests::a_rig_that_seats_muse"]
failure-reason-claude = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record"]
failure-reason-codex = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "codex::record"]
failure-reason-pi = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "pi::record"]
failure-reason-devin = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "devin::record"]
failure-reason-muse = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "muse::record"]
failure-reason-calls = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::record::calls"]
failure-reason-contract = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "contract::"]
failure-reason-windows = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "windows::"]
failure-reason-rig = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_failure_said_no_reason::"], builds = true }

