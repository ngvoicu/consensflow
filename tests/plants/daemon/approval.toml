# The approval gate (the human's reports from the live app, alpha.81, which ran
# Node's engine: the words they passed on that were never typed, m-1930, and a
# result typed into a chief that had accepted its task, m-1929; and a Codex
# answer that reached the chief with the markup of Codex's own screen in it).
# With approval required, every word one agent gives another waits at the gate,
# out of its recipient's inbox and queue, until the human passes it on or
# declines it. One plant takes one rule out; a test of it fails. The ledger's
# plants run its own tests of the gate (`crates/cf-ledger/tests/receipt/approval.rs`),
# the page's the human's approve and decline (`crates/cf-daemon/src/page/tests/gate.rs`),
# the engine's the dispatcher's (`tests/dispatcher/approval.rs`), the readers'
# their own; the `approval rig:` plants after them hold that the rule reaches the
# chief through the real daemon and pane host (`crates/cf-e2e/tests/rig/approval.rs`,
# one case each, found by the start of its name) and say `builds`: the family
# builds the native `cf` again once each is put back. Every name holds
# `approval`, so `npm run plants:daemon -- approval` runs them all, and
# `npm run plants:daemon -- "approval rig:"` the end to end ones (the words of a
# filter are each a word that may hold, so a filter of two words picks both).

[run]
# The ledger's tests of what each kind of word does at the gate.
ledger-approval = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "approval::"]
# The page's tests of the human's approve and decline.
daemon-approval-page = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::gate"]
# The dispatcher's tests of what a window is given, and when, while words wait.
engine-approval = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "approval::"]
# What Codex's answers read as.
harness-codex-record = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "codex::record"]
# Where a Claude turn ends when it was interrupted.
harness-claude-interrupts = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record::tests::interrupts"]
# The cases of the rig, found by the start of their names.
rig-approval-decided = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "approval::a_result_the_human_passed_on_while_the_chief_was_in_a_turn_is_withdrawn"]
rig-approval-refused = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "approval::a_chief_that_accepts_a_task_whose_result_waits_at_the_gate"]
# How long the stand-in agent waits, as its variables tell it.
fake-agent-waits = ["cargo", "test", "--offline", "-p", "cf-e2e", "--bin", "fake-agent", "tests::a_wait_is_the_milliseconds"]

