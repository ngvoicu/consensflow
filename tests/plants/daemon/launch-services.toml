# The update's relaunch and its Local Network notice (T-2105). A Mac's Local Network decision may
# not reach an app the old app started directly after an update, so the app starts the installed
# one through LaunchServices (`open -n`, from a helper that waits for the old app to end), and
# directly only in a packaged self-test; and the first launch after an update says once how to
# allow Local Network again, and a first install says nothing. Every name here begins
# `launch-services:`.

[run]
app-updates = ["cargo", "xtask", "app", "test", "updates::"]

# The production start is the direct one again: the new app is the old one's child.
[[plant]]
name = "launch-services: the app starts the installed update directly again"
meant = "the_installed_app_is_started_through_launch_services_and_directly_only_in_a_selftest"
runs = ["app-updates"]

[[plant.edit]]
file = "app/src-tauri/src/updates/relaunch.rs"
find = """
    if selftest {
        direct(installed)
    } else {
        through_launch_services(installed)
    }"""
replace = """
    let _ = (selftest, through_launch_services);
    direct(installed)"""

# The helper opens the new app without waiting for the old one to end.
[[plant]]
name = "launch-services: the helper opens the new app while the old one is alive"
meant = "the_launch_services_start_waits_for_the_old_app_and_opens_a_fresh_process"
runs = ["app-updates"]

[[plant.edit]]
file = "app/src-tauri/src/updates/relaunch.rs"
find = 'while kill -0 "$old" 2>/dev/null; do'
replace = "while false; do"

# A failed opener leaves the person with no app (T-2114, blocker 1): the helper's fall back to
# the direct start, and its word in the log, taken out.
[[plant]]
name = "launch-services: a failed open leaves no app and no word"
meant = "a_failed_open_starts_the_installed_app_directly_and_says_why"
runs = ["app-updates"]

[[plant.edit]]
file = "app/src-tauri/src/updates/relaunch.rs"
find = '"$opener" "$@" && exit 0'
replace = '"$opener" "$@"; exit 0'

# Never two apps (T-2114, blocker 2): at the bound the helper goes on to start the app over the
# old one, as the 300 polls of the first build did at 32 seconds.
[[plant]]
name = "launch-services: the helper starts a second app at its bound"
meant = "an_old_app_still_alive_at_the_bound_is_not_started_over"
runs = ["app-updates"]

[[plant.edit]]
file = "app/src-tauri/src/updates/relaunch.rs"
find = '''    exit 0
  fi
  /bin/sleep 0.1'''
replace = '''    break
  fi
  /bin/sleep 0.1'''

# The notice at a first install: no file is a launch after an update.
[[plant]]
name = "launch-services: the notice is shown at a first install"
meant = "the_notice_is_for_the_first_launch_after_an_update_only"
runs = ["app-updates"]

[[plant.edit]]
file = "app/src-tauri/src/updates/local_network.rs"
find = "    seen.map_or(earlier_run, |seen| seen != current)"
replace = "    seen.map_or(true, |seen| seen != current)"

# The upgrade from a build that wrote no marker (T-2114, blocker 3): a missing file is a first
# install whatever the home shows.
[[plant]]
name = "launch-services: an upgrade from a build with no marker shows no notice"
meant = "an_upgrade_from_a_build_that_wrote_no_marker_shows_the_notice_once"
runs = ["app-updates"]

[[plant.edit]]
file = "app/src-tauri/src/updates/local_network.rs"
find = "    seen.map_or(earlier_run, |seen| seen != current)"
replace = "    seen.map_or(false, |seen| seen != current)"
