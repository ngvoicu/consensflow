# A project's wake-up calls (2026-10-13: the human turns them on for a project, and its
# chief at rest is asked now and then whether it still has work to do, so that a chief
# that stopped while work is left carries on). A wake-up is a note from the human to the
# chief, queued when the interval has passed since the latest of the last wake-up, the last
# Resume and the last change of the setting; never while one is on its way, never to a
# chief in a turn, waiting, out of quota or held for words the human typed, and never while a
# task is queued, working, waiting for an answer on its way (or at the gate), held for its member's
# quota or open behind one of those (a question the chief has not answered, a task the chief holds
# itself, and what it paused are the chief's own and are woken for;
# a skip is logged and the interval counts from it); a quiet board is not asked twice, and the
# first after an enable or a Resume always goes. One plant takes one rule out; a test of it fails. The ledger's plants run its own tests
# (`crates/cf-ledger/tests/wake_ups/` and the unit tests of `wake_ups`), the engine's the
# dispatcher's (`tests/dispatcher/wake_ups.rs` and `wake_ups/ending.rs`), the page's the operations'
# (`crates/cf-daemon/src/page/tests/wake_up.rs`) and the dialog's the browser's; the
# `wake-up rig:` plants say `builds`, run the cases of the rig (a real daemon, the real pane
# host, a stand-in chief: a real minute each, `crates/cf-e2e/tests/rig/wake_ups.rs`), and the
# family builds the native `cf` again once each is put back. Every name holds `wake-up`, so
# `npm run plants:daemon -- wake-up` runs them all, and `npm run plants:daemon -- "wake-up rig:"`
# the end to end ones.

[run]
# The ledger's tests of the setting, the migration, when a wake-up is due and what is withdrawn.
ledger-wake-ups = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "wake_ups"]
# The words of the setting and what it makes of a request.
ledger-wake-ups-lib = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "wake_ups::"]
# The dispatcher's tests of when a chief is nudged.
engine-wake-ups = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "wake_ups::"]
# The page's operations, over the bridge.
daemon-wake-up-page = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::wake_up"]
# The names of the page's operations, which the app forwards, and which of them wake the dispatcher.
proto-page = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "page::"]
# The cases of the rig, a real minute each.
rig-wake-ups-turn = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "wake_ups::a_chief_in_a_long_turn"]
rig-wake-ups-first = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "wake_ups::a_wake_up_set_for_a_minute"]
# What the live run judges the evidence by (no harness, no quota).
live-wake-ups = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_wake_ups"]
# The dialog's group, in the browser Playwright keeps (each plant's `prepare` bundles the page's
# xterm first, as `npm run test:ui` does).
page-wake-up = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "wake-up"]

