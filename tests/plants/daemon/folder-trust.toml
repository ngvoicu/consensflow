# A harness's question about trusting a folder stopped every launch in a new repository
# (dip-agentos's T-11, T-13, T-14 and T-15, 2026-10-17 to 10-19, ConsensFlow 3.0.4: Claude Code's
# "Do you trust this folder?" after `git init`). the owner's decision of 2026-10-20: choosing a
# folder for a project counts as trusting it. The engine watches a window that may ask from the
# moment it opens (`crates/cf-engine/src/trust.rs`), reads the question in its last lines through
# its harness's reader (`crates/cf-harness/src/claude/trust.rs`), and answers
# yes a key at a time where what a yes trusts (`shared/trust.rs`: the root of the repository the
# folder is in) is the project's folder or below it, the human told once; a yes that would trust a
# folder outside it is the human's, told once, and once they said yes in a window the project's
# other windows that ask of that folder are answered. Nothing goes into the window, and nothing
# gives its launch up, while the question is on its screen (`dispatcher.rs`, `arrival.rs`).
#
# Round 2 (a review of round 1): a window opened again on its conversation is past the question only
# once its record grows past what it opened with; what a yes trusts is found from the folder as the
# system names it, and a linked worktree's yes is its main checkout's; the watch ends on the
# harness's prompt or the record's growth, never on a screen without the question; a key goes only
# into a screen that moved since the last one.
#
# Round 3 (a review of round 2): an asking window is past the question on its prompt, on its
# record's growth past the first reading that could read it, or once the question has been gone
# for a few looks; only a prompt says the human said yes; the question is the two choices with the
# cursor on one; a key the window did not take is pressed again.
#
# Round 4 (a review of round 3, T-120): a look the host could not answer says nothing of the
# question; the question is its two choices, each a line of its own, and one whose cursor the
# reader cannot place is pressed nothing, the human told once it stays so.
#
# Round 5 (a check of round 4, T-231): a `❯` on a line that names no choice is an input box,
# and the prompt wins over a question whose choice is unplaced; a choice may end with a box's
# edge, and the cursor stand inside one; looks with no screen end once the record grows, or
# after 30 s with the human told; a yes is banked after an unplaced question only once it was
# read long enough to tell the human, who is told of it no sooner.
#
# Round 6 (a re-check of round 5, T-299): a `❯` with the prompt's line below it is the input
# box, and one on a choice the reader does not know, under the question's hint line, is the
# question unplaced; a question not answered here is told to the human once it stayed 5 s; a
# yes is banked only from a question with its choice placed, at a prompt whose screen no
# longer names the choices, and where the choice could not be placed the other windows are
# told of again; a window whose screen goes unread is held until a look reads it; the live
# suite's sweep of the owner's Claude records has its plants.
#
# The cases are `crates/cf-e2e/tests/regressions/a_trust_question_after_git_init_stopped_every_launch.rs`
# (a stand-in that asks as Claude Code 2.1.305 does, the shape the live suite
# `cargo xtask live folder-trust` found) and the readers' own tests. The rig's cases build the
# native `cf` from the sources as planted, so their plants say `builds`. Every name holds
# `folder trust`, so `npm run plants:daemon -- "folder trust"` runs them all.

[run]
folder-trust-rig-unread-chief = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_trust_question_after_git_init_stopped_every_launch::a_chief_opened_again_at_rest_whose_screen_goes_unread"]
