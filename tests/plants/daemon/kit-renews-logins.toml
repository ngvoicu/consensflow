# The live kit renews the logins of Claude Code and Pi on a test machine (T-1067, Gabriel's decision of
# 2026-11-01). On zeewin2 the owner rarely uses either, so their access tokens ended between his visits and
# the kit refused a live run as "expired" even where the refresh token behind it worked. Now, on a machine
# the Windows runner started the command on (it gives it `CONSENSFLOW_TEST_MACHINE`, which nothing else
# sets), a login that has run short of the run and its margin is renewed by the harness itself, run once as
# the owner with a tiny prompt (`live/renew.rs`), and then copied as before. Never on the owner's Mac (no
# runner, no variable), never `/login`, never anything of the owner's changed but the login, and a renewal
# that ran and failed is said in the refusal. One plant takes one rule out; a test of it fails. The
# runner's own plants are of `tools/xtask/src/windows`, and are caught by its tests. Every name holds
# `kit renews logins`.

[run]
renew-lib = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "renew"]
planned-lib = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "--", "planned", "forty_two", "too_short", "twenty_five", "ten_minutes_left", "no_refresh_token", "codex_copy", "renews_it"]
renew-windows = ["cargo", "test", "--offline", "--target-dir", "app/src-tauri/target/xtask-check", "-p", "xtask", "--lib", "windows::"]

