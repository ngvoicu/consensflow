# ---------------------------------------------------------------------------- a copy that cannot renew (T-1067)
#
# Measured on zeewin2, 2026-11-01. Claude Code 2.1.316 runs on a copy with no refresh token, does not
# look at its expiry (a copy that ended a minute ago ran), and fails with a 401 where the server refuses
# the token; Pi 1.4.0 runs on one too, and where less than five minutes of the access token are left it
# tries to renew, is refused (`invalid_grant`) and fails the run loudly, even in the middle of one.
# Neither touched the owner's file (hashed before and after), and the owner's next run worked.

