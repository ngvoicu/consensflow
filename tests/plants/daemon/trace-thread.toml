# One thread writes events.jsonl (D2's P19-D, R70): a trace line is queued where it is said and
# never waits, so a held file holds that thread and nothing of the daemon's; the thread appends in
# the order sent and forgets a deleted project's lines in that order, answering that it is done
# only once each replaced file is on the disk; the queue holds 4,096 ordinary lines and counts
# what it drops; each file has its own lock in the process; the stop waits a quarter of a second
# for the writer. `cargo xtask plants daemon "trace thread:"` runs them.

[run]
tt-held = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "start::tests::held::"]
tt-base = ["cargo", "test", "--offline", "-p", "cf-base", "--lib", "file::append::"]

[[plant]]
name = "trace thread: the line is appended on the caller's thread"
meant = "a_held_trace_file_holds_neither_a_timer_nor_a_ping"
runs = ["tt-held"]

[[plant.edit]]
file = "crates/cf-daemon/src/files/trace.rs"
find = '''        let text = format!("{json}\n");
        let mut state = self.shared.lock();'''
replace = '''        let text = format!("{json}\n");
        let _ = append_rotating(&self.file, &text, LIMIT);
        let mut state = self.shared.lock();'''

[[plant]]
name = "trace thread: a forgetting goes ahead of the lines sent before it"
meant = "lines_a_move_aside_and_a_forgetting_are_done_in_the_order_they_were_sent"
runs = ["tt-held"]

[[plant.edit]]
file = "crates/cf-daemon/src/files/trace.rs"
find = '''        self.shared
            .lock()
            .jobs
            .push_back(Job::Forget { project, answer });
        self.shared.work.notify_one();
        async move {'''
replace = '''        self.shared
            .lock()
            .jobs
            .push_front(Job::Forget { project, answer });
        self.shared.work.notify_one();
        async move {'''

[[plant]]
name = "trace thread: a line the full queue drops is not counted"
meant = "lines_past_the_queue_behind_a_held_file_are_one_count_once_it_drains"
runs = ["tt-held"]

[[plant.edit]]
file = "crates/cf-daemon/src/files/trace.rs"
