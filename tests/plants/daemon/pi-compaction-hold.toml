# The close of a done task's Pi window waits for a compaction ConsensFlow's own extension asked for
# (T-1475). A Pi member whose task is one turn is at rest as its result is taken; the extension
# asks Pi to compact at that rest (`agent_settled`, past the project's size), and the engine closed
# the window ten seconds after the result (`STILL_BOUND_MS`, the screen being drawn): the close's
# TERM ran Pi's `dispose()` and `abortCompaction()`, the summary (39 to 80 seconds in the records)
# ended `aborted`, and the compaction was lost every time (the owner's cached-compaction ledger
# said `cancelled`, T-1467's Pi member at 477,875 tokens). Now the extension writes its word
# (`settled/<launch>.compacting.json`: launch, conversation, time) before it asks and takes it back
# as that compaction ends, however it ends and at shutdown; the Pi window says it
# (`Window::compaction_asked`); and the engine holds the close (`Dispatcher::compaction_held`, in
# `still_drawing`, so the session's next task waits as for a screen) while it stands, at most
# `COMPACTION_HOLD_MS` from the engine's first sight of it (a read that fails is not a word that is gone). Each plant breaks one half and the test written for it
# fails.
#
# Every name holds `pi compaction hold`, so `npm run plants:daemon -- "pi compaction hold"` runs
# them all.

[run]
pch-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "close_for_compaction::"]
pch-channel = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "pi::channel::"]
pch-launch = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "pi::a_window_says_when_its_extension_asked"]
pch-extension = ["node", "--test", "tests/pi-extension.test.mjs"]

[[plant]]
name = "pi compaction hold: the engine holds nothing for a compaction"
meant = "a_done_tasks_window_stays_open_while_its_extension_compacts_and_closes_in_the_step_the_word_is_taken_back"
runs = ["pch-engine"]

[[plant.edit]]
file = "crates/cf-engine/src/windows.rs"
find = "        mono - seen.since < COMPACTION_HOLD_MS"
replace = "        mono - seen.since < 0"

[[plant]]
name = "pi compaction hold: the engine holds for as long as the word stands, with no bound"
