# A project's name and the line under it (2026-10-13: a right-click on a project in the list
# renames it, or writes a line under its name, for the human alone). The migration adds a
# nullable `description` to `project` and keeps every row; a rename has the rules a name has
# when a project is opened, a description is one line of at most 200 characters and none where
# it is blank; each change logs an event (`project.renamed`, `project.described`) only where
# something changed; both are page operations of the human's, which no route of the agents'
# API reaches, and no agent is told the line. One plant takes one rule out; a test of it fails.
# The ledger's plants run its own tests (`crates/cf-ledger/tests/described.rs`, the unit tests
# of `projects::describing`, `schema` and `testing`), the page's the operations'
# (`crates/cf-daemon/src/page/tests/describing.rs`) and the menu's and the dialogs' the
# browser's (`project menu` in `app/tests/core-page.spec.mjs`; the page's xterm they stand on
# is the tracked `app/ui/vendor`, so no plant bundles it). Every name holds `describe`, so
# `npm run plants:daemon -- describe` runs them all.

[run]
# The migration, a rename, the line under the name and the event each logs.
ledger-described = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "described"]
# What a text makes of a description: its trim, its limit, its line.
ledger-describing-lib = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "projects::describing::"]
# Each migration, byte for byte as it shipped.
ledger-schema-lib = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "schema::"]
# What the players of Node's recordings hold apart from this ledger's.
ledger-testing-lib = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "testing::"]
# The page's operations over the bridge, and the agents' API they are not reached by.
daemon-describing-page = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::describing"]
# The names of the page's operations, which the app forwards, and which of them wake the dispatcher.
proto-page-describing = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "page::"]
# The case of the rig (a real daemon and pane host, a stand-in chief): the event file, the
# folder, and what no window is told.
rig-described = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "described::"]
# The menu and the dialogs, in the browser Playwright keeps.
page-project-menu =["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "project menu"]

