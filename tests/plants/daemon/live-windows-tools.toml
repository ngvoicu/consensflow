# The live kit runs on Windows as on a Mac (T-1079; the alpha.1 release check, T-1069, found four cases
# that could not): `codex-role` started `ps` and `pgrep`, `stops --case stuck` told a Codex window to run
# `sh ./script` (PowerShell knows no `sh`), `folder-trust claude` looked for its notes by Windows'
# verbatim canonical name (`\\?\C:\…`, which the product never writes), and `outside-claude` told Claude
# to run `python3` (what Windows' `PATH` holds under that name opens the Store). Now the processes are the
# machine's own table (`ThisMachine`), the stuck workload and the token probe are Node's, a note is found by
# the name the product writes, the waits are the kit's quiet command; the rig's close lists what it left
# through the same table, the pacing chief's minute is Node's ticks, and a guard holds every file of the
# live kit that starts a Unix-only program to a list that says why it is no Windows case's. One plant takes
# one rule out; a test of it fails. Every name holds `live tools on windows`.

[run]
lw-files = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "files::"]
lw-trust = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_folder_trust", "--", "tests::a_trust_note"]
lw-outside = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_outside_claude"]
lw-role = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_codex_role"]
lw-stuck = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_stops", "--", "stuck::tests"]
lw-closing = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::members::closing"]
lw-command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::members::command"]
lw-pacing = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_pacing"]
lw-guard = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::members::descent::tests::no_live_check_starts"]

[[plant]]
name = "live tools on windows: a trust note is not found by a drive's folder with the verbatim prefix taken off"
meant = "a_folder_is_named_as_the_product_writes_it_with_no_verbatim_prefix_of_a_drive_or_a_share"
runs = ["lw-files"]

[[plant.edit]]
file = "crates/cf-e2e/src/files.rs"
find = '''        Some(rest) if has_drive(rest) => rest.to_owned(),'''
replace = '''        Some(rest) if has_drive(rest) => canonical.to_owned(),'''

