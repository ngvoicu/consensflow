# A member's turn that ends to wait for its own work is no result: it is sent on once (T-1923, the
# advice T-1919). On 2026-11-21 two Claude Code workers ended their turns on a line about waiting
# ("I'll check them at the next wakeup."; "I'm ending this turn until it runs.") with nothing pending
# that the board could see, and the board took each line for the task's result.
#
# The rule (`crates/cf-engine/src/turn_end/waits.rs`), applied in `Dispatcher::collect`
# (`crates/cf-engine/src/turn_end.rs`) after a question to the chief is read and before the result is
# recorded: the last paragraph of the member's own words says, in the first person and in English,
# that it ends its turn to wait, or goes on when or once its own work ends. No result is taken: the
# window is typed one note, as it rests, and the requester is told nothing. The note is sent once for
# each delivery of the task (read from the task's thread, so a restart sends no second); a second such
# end is the result.
#
# Each plant takes one rule out again. The names begin with `go on note`, so
# `cargo xtask plants daemon "go on note"` runs them.

[run]
goon-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "go_on_note::"]
goon-lib = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "turn_end::waits::"]
goon-resume = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "resume::a_task_held_for_a_job_at_the_close_is_done_after_the_resume"]
goon-rig = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_turn_that_ended_to_wait"]

[[plant]]
name = "go on note: a final answer is never looked at for a wait"
meant = "a_turn_that_ends_to_wait_is_no_result_and_the_member_is_sent_on_once"
runs = ["goon-engine"]

[[plant.edit]]
file = "crates/cf-engine/src/turn_end.rs"
find = '''        if pending.retired == 0
            && ends_to_wait(&words_of(&answers.final_run))
            && !go_on_told(&thread, participant)
        {
'''
replace = '''        if false
            && pending.retired == 0
            && ends_to_wait(&words_of(&answers.final_run))
            && !go_on_told(&thread, participant)
        {
'''

[[plant]]
name = "go on note: the rig's worker that ends to wait is given its interim line as a result"
meant = "a_claude_code_turn_that_ended_to_wait_is_sent_on_and_its_next_turn_is_the_result"
runs = ["goon-rig"]
builds = true

