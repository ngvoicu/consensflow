# The size a project chooses for its members' windows to compact at, whatever their harness
# (spec smaller-contexts, SCX-24 to SCX-26, T-1017, widened to every harness by SCX-28 to SCX-30,
# T-1265): kept in the ledger (`crates/cf-ledger/src/projects/compaction.rs`, migration 0026's
# second column, renamed by 0034), chosen on the page alone (`project.compaction`, Project
# settings' "Compaction"), given by the engine to every member's launch at launch and on resume
# and never to the chief's (`crates/cf-engine/src/windows.rs`), and given each harness by its
# own route, never in the owner's config: Claude's launch settings file (`autoCompactWindow`),
# Codex's `-c model_auto_compact_token_limit`, Devin's `DEVIN_COMPACTION_THRESHOLDS`, Pi's
# ConsensFlow extension (`CF_COMPACTION_TOKENS`, a compaction asked at a rest), and Muse's
# `-c context_compaction.provider_context_limit_tokens` up to its real window. Each plant breaks
# one of these and the test written for it fails.
#
# Every name holds `members compaction`, so `npm run plants:daemon -- "members compaction"` runs them all.

[run]
mc-ledger-lib = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "projects::compaction::"]
mc-ledger-described = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "described", "compaction::"]
mc-ledger-testing-lib = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "testing::staff_rules::"]
mc-engine-dispatcher = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "compaction_window::"]
mc-harness-launch = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "claude::compaction_window"]
mc-harness-tooling = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "tooling::"]
mc-daemon-page = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::compaction"]
mc-proto-page = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "page::"]
mc-ledger-rename = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "testing::members_compaction::"]
mc-codex = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "codex::compaction::"]
mc-devin = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "devin::compaction::"]
mc-pi-launch = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "pi::compaction::"]
mc-muse = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "muse::adapter::tests::"]
mc-pi-extension = ["node", "--test", "tests/pi-extension.test.mjs"]
mc-rig = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "members_compaction::"], builds = true }
mc-page-suite = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "the members' compaction|saves the choice of a size|holds the size to the range|sections, in that order"]

