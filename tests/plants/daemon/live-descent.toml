# The live kit proves each child of a window's tree against the particular parent that made it, and
# leaves a process it cannot prove running, and says so (review T-2228: on a Mac a stranger's child
# that took a listed leaf's number and its parent's number in the same printed second, and on Windows a
# parent taken from a later Git Bash listing, were taken for the window's and ended). On a Mac the
# child's forker must be the parent's own unique identifier; on Windows the creator the child's own
# handle names, read with every other handle held open, and the order they began in; a link the system
# would not say, one that is ambiguous, or one read another way proves nothing, and what it leaves is
# named as left running, never ended. The leaf's identifier is read again at the send. One plant takes
# one rule out; a test of it fails. Every name holds `live descent`. No plant sends a signal: the tests
# read recorded tables and the recorder says what it was asked to end.

[run]
ld-recorded = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::members::descent::ownership"]
ld-tests = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::members::descent::tests"]
ld-native = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::members::descent::native"]
ld-door = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::tests::what_"]
ld-table = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::members::descent::tests::"]
ld-later = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "door::tests::a_process_chosen_by_a_later_look"]

[[plant]]
name = "live descent: a Mac child is the parent's on the parent's number alone"
meant = "a_mac_leaf_whose_number_and_parent_number_a_stranger_took_in_the_same_printed_second_is_left_running"
runs = ["ld-recorded"]

