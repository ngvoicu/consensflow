# --- Windows lists processes through the system's own table, with no program (T-2366) ---
#
# A PowerShell took 20 to 30 s to start on a machine with many modules. The table is now what
# `NtQuerySystemInformation` writes, read by where each field of an entry is; the image and the
# command line are read on each process's held handle. A process the handle cannot be had of keeps
# what the table says and proves nothing.

