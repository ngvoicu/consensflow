# A role that changed under a resumed Codex thread (the owner's report of 2026-10-13, ConsensFlow
# 3.0.3 on Codex 0.162.1: a chief given specs, closed and resumed, never learned of them, for a
# resumed thread keeps the developer instructions it began with and ConsensFlow gave the new text
# in the setting that thread does not read). The harness says it keeps them (`Adapter::
# keeps_first_instructions`, Codex alone); the ledger records the text each conversation was
# last told (migration 0016); the engine compares it with the text a resumed window would be
# given and, where it differs, opens the window with no first message and, once it is up, gives
# it a note from ConsensFlow first (by paste, so the role is on the command line once): the new
# text in full and said to replace the one the thread began with, then the message the launch
# would have begun with, then the rest of its queue. The text is recorded in the very write that
# confirms the note's delivery, so that it is given once; a role told in part (cut at what a paste
# holds) is not recorded and the human is told so; a note whose window closed before it was seen
# is looked for in the conversation's own record before it is withdrawn; and what a member's
# window answers to the note is no answer to its task. The ledger knows such a note by the role
# text it holds (migration 0018, a column of `message`) and by nothing in its words, and a turn
# of a member's record is a note's by the id in its header. A launch that says the role first
# owes it (`role_change/prelude.rs`) what a launch with a first message has: its window that
# exits, or is never ready within the time a launch has, or is refused the note as often as a
# message is given attempts, is a launch that did not come up (a member's displaced message
# fails once, a chief's stays queued, its window is never closed for being slow). The text names
# ConsensFlow's copy of Specmint where the harness has none, and the harness crate keeps that copy
# at one place for every launch (one for each harness and variant, named by the commit it is
# vendored at, in no launch's folder, each file put in place whole), or the role text would differ
# at every launch and be said again at every Resume. A Codex window opened on a thread the quit
# cut in a turn, with no message, reads at rest. A conversation whose harness holds nothing of it
# (a thread that never had a turn) is opened afresh and is told no role: whether a window goes on
# with its conversation is decided before the role is compared with what the conversation was
# told, for a chief and for a member (whose message is begun, and the stop its window owes read,
# before its harness is asked, and goes back to its queue where the role is then to go ahead of
# it). One plant takes one rule out, or puts one wrong; a test of it fails. The ledger's plants
# run its own tests (`tests/conversation_role.rs`, `tests/role_note.rs`, the receipt suite's
# `told::` and the unit tests of `testing::role_text` and `testing::role_note`), the harness's the
# launch suite's
# (`tests/launch/first_instructions.rs`, `codex::resumed::`, and its tests of a chief given specs)
# and the unit tests of the copy (`shared::specmint`), the engine's the dispatcher's
# (`tests/dispatcher/role_change.rs` and its modules) and its unit tests (`role_change::`,
# `delivery_text::`), the stand-in Codex's its own (`agent::tests`); the `codex role rig:` plants
# run the cases of the rig and the regression (a real daemon, the real pane host, a chief on the
# stand-in Codex or Claude: `crates/cf-e2e/tests/rig/specs.rs` and
# `tests/regressions/codex_role_on_resume.rs`), and the ones that plant the product say `builds`:
# the family builds the native `cf` again once each is put back. Every name holds `codex role`,
# so `npm run plants:daemon -- "codex role"` runs them all, `"codex role:"` the ones that do not
# run the rig and `"codex role rig:"` the ones that do.

[run]
# The ledger's tests of the column: the migration, writing and reading it, what it never logs.
ledger-conversation-role = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "conversation_role"]
# What the ledger's tests of Node's recordings hold apart, and the migrations as they shipped.
# (The ledger's replay of Node's recordings, which holds the column apart, is the kit's
# `ledger-replay`.)
ledger-lib = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib"]
# What the ledger asks of the queue for a message put ahead of it, and the one write that confirms
# a note that says a role and records what the conversation was told.
ledger-receipt-told = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "told::"]
# The column that makes a message a replacement of a role (migration 0018): the migration, and
# what a ledger opened again knows.
ledger-role-note = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "role_note"]
# Which harness keeps the first instructions of a resumed conversation.
harness-first-instructions = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "first_instructions::"]
# A Codex window opened again on a thread the quit cut in a turn, with no message of its own.
harness-codex-resumed = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "codex::resumed::"]
# The harness's tests of ConsensFlow's copy of Specmint: where it is kept, what is written and
# when, and what each harness is told of it.
harness-specmint = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "specmint"]
harness-launch-specs = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "--", "given_specs", "second_launch", "has_the_variant_installed"]
# The engine's tests of a role that changed, on the fake windows, and of how the text reads.
engine-role-change = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "role_change::"]
engine-role-change-lib = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "role_change::"]
# How a message reads in the pane, and whether it goes whole.
engine-delivery-text = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "delivery_text::"]
# The stand-in Codex's own tests: what a thread begins with, and keeps.
fake-codex = ["cargo", "test", "--offline", "-p", "cf-e2e", "--bin", "fake-codex"]
# The case of the rig and the regression: a chief on the stand-in Codex, resumed.
rig-codex-role = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "specs_codex::"]
# The rig's cases of a chief given specs, on the stand-in Claude: the folders it is given.
rig-claude-specs = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "specs::a_chief_of_a_project"]
rig-regression-codex-role = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "codex_role_on_resume::"]
# The case of a Codex chief that never had a turn, given specs before its Resume: opened afresh, told no note.
rig-regression-never-had-a-turn = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_codex_chief_that_never_had_a_turn_is_opened_afresh"]
# What the live specs run judges of a Codex chief's own record (no harness is run).
live-specs-judge = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_specs", "launched::"]

