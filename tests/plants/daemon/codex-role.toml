# A role that changed under a resumed Codex thread (the owner's report of 2026-10-13, ConsensFlow
# 3.0.3 on Codex 0.162.1: a chief given specs, closed and resumed, never learned of them, for a
# resumed thread keeps the developer instructions it began with and ConsensFlow gave the new text
# in the setting that thread does not read). The harness says it keeps them (`Adapter::
# keeps_first_instructions`, Codex alone); the ledger records the text each conversation was
# last told (migration 0016); the engine compares it with the text a resumed window would be
# given and, where it differs, puts a note from ConsensFlow first, the new text in full and said
# to replace the one the thread began with, and records the new text once the note is delivered,
# so that it is given once. The text names ConsensFlow's copy of Specmint where the harness has
# none, and the harness crate keeps that copy at one place for every launch (one for each harness
# and variant, named by the commit it is vendored at, in no launch's folder), or the role text
# would differ at every launch and be said again at every Resume. One plant takes one rule out,
# or puts one wrong; a test of it fails. The ledger's plants run its own tests
# (`tests/conversation_role.rs` and the unit tests of `testing::role_text`), the harness's the
# launch suite's (`tests/launch/first_instructions.rs`, and its tests of a chief given specs) and
# the unit tests of the copy (`shared::specmint`), the engine's the dispatcher's
# (`tests/dispatcher/role_change.rs`) and its unit tests (`role_change::`), the stand-in Codex's
# its own (`agent::tests`); the `codex role rig:` plants run the cases of the rig and the
# regression (a real daemon, the real pane host, a chief on the stand-in Codex or Claude:
# `crates/cf-e2e/tests/rig/specs.rs` and `tests/regressions/codex_role_on_resume.rs`), and the
# ones that plant the product say `builds`: the family builds the native `cf` again once each
# is put back. Every name holds `codex role`, so `npm run plants:daemon -- "codex role"` runs
# them all, `"codex role:"` the ones that do not run the rig and `"codex role rig:"` the ones
# that do.

[run]
# The ledger's tests of the column: the migration, writing and reading it, what it never logs.
ledger-conversation-role = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "conversation_role"]
# What the ledger's tests of Node's recordings hold apart, and the migrations as they shipped.
# (The ledger's replay of Node's recordings, which holds the column apart, is the kit's
# `ledger-replay`.)
ledger-lib = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib"]
# Which harness keeps the first instructions of a resumed conversation.
harness-first-instructions = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "first_instructions::"]
# The harness's tests of ConsensFlow's copy of Specmint: where it is kept, what is written and
# when, and what each harness is told of it.
harness-specmint = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "specmint"]
harness-launch-specs = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "--", "given_specs", "second_launch", "has_the_variant_installed"]
# The engine's tests of a role that changed, on the fake windows, and of how the text reads.
engine-role-change = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "role_change::"]
engine-role-change-lib = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "role_change::"]
# The stand-in Codex's own tests: what a thread begins with, and keeps.
fake-codex = ["cargo", "test", "--offline", "-p", "cf-e2e", "--bin", "fake-codex"]
# The case of the rig and the regression: a chief on the stand-in Codex, resumed.
rig-codex-role = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "specs_codex::"]
# The rig's cases of a chief given specs, on the stand-in Claude: the folders it is given.
rig-claude-specs = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "specs::a_chief_of_a_project"]
rig-regression-codex-role = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "codex_role_on_resume::"]
# What the live specs run judges of a Codex chief's own record (no harness is run).
live-specs-judge = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_specs", "launched::"]

