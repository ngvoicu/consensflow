# A command typed at an idle Claude's prompt read as a turn that never ended (the Mac's live
# long run of 2026-10-19, Claude Code 2.1.303: `/compact` typed into the idle chief, which read at
# work for the 80 minutes left, and T-13's result was never handed to it). Claude Code writes the
# command's records as user's records (the bare `/compact` as it is typed, the words before a
# command, the command) and then what it printed (`<local-command-stdout>`), as a user's record
# or, for a `/compact` that found nothing to compact (2.1.304, the live run of 2026-10-20), as the
# system's (`local_command`), and runs no model. Claude's reader ends the command's turn at what
# it printed, where it follows the command with nothing open and the command is one of those
# that run no model (`QUIET_COMMAND`: 2.1.303's `/plan <description>` goes on to ask the model,
# Sol's look at round 1) (`crates/cf-harness/src/claude/record/replay.rs`, `project.rs`,
# `patterns.rs`), and the long run's watch reads it the same way
# (`crates/cf-evals/src/long_run/record.rs`). The reader's own tests are
# `crates/cf-harness/src/claude/record/tests/commands.rs` and `clear.rs`; the case is
# `crates/cf-e2e/tests/regressions/a_compact_typed_into_an_idle_chief_held_a_workers_result.rs`,
# whose stand-in compacts as 2.1.303 does and finds nothing to compact as 2.1.304 does.
#
# The case builds the native `cf` from the sources as they are planted, so its plants say
# `builds`. Every name holds `compact-rest`, so `npm run plants:daemon -- "compact-rest"` runs them
# all.

[run]
compact-rest-reader = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record"]
compact-rest-rig = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_compact_typed_into_an_idle_chief_held_a_workers_result::"]
compact-rest-watch = ["cargo", "test", "--offline", "-p", "cf-evals", "--lib", "long_run::record"]
compact-rest-stand-in = ["cargo", "test", "--offline", "-p", "cf-e2e", "--features", "test-support", "--bin", "fake-agent", "a_compaction"]
compact-rest-live = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_commands_at_rest"]

