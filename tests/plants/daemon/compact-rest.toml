name = "compact-rest: what a command typed at the prompt printed begins a turn, as Node read it, and the chief given a /compact is never handed its worker's result"
meant = "a_claude_chief_given_a_compact_while_idle_is_at_rest_after_it_and_is_handed_its_workers_result"
runs = ["compact-rest-rig"]
builds = true

