# T-858: the suites that made their own Claude config folder (`live held-typed`, `live escape-unsent`)
# judged the copy by its bytes, and Claude Code 2.1.310 writes what it learns of the account beside the
# tokens (zeewin2: `subscriptionTypeSource`), so every run said the login was refreshed. Integration C
# (T-881) put those suites on the kit's own folder (T-724), and holds the owner's login to its tokens as
# the copy is.
[[plant]]
name = "windows live: a copy that Claude Code lost is not a refreshed one"
meant = "a_copy_that_was_refreshed_or_lost_fails_with_a_warning_that_the_machines_login_may_be_stale"
runs = ["live-login"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/login.rs"
find = '''            Self::Lost => {
                Some("the folder's .credentials.json is gone or no longer holds a login".to_owned())
            }'''
replace = '''            Self::Lost => None,'''

[[plant]]
