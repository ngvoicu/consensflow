# Models only from the harnesses (spec harness-models, T-1187): a member is a harness, a model
# that harness lists, an effort it lists for that model and a tier the human picks; no bundled
# list, no nicknames, no saved agents. A member is named by its model and effort (`@opus-high`,
# the harness in front where that is taken, a number after where that is too: crates/cf-ledger/
# src/handles.rs); migration 0031 runs every member a ready-made agent named on that agent's model
# and names it so, its windows after it; a second Add of a model and effort a member runs is roles
# more for that member; `cf staff` and `cf task list` say what each runs on; a chief's effort is
# picked as its model's is and given as its harness takes it (Pi's as its thinking, none for
# Devin). One plant takes one rule out; a test of it fails. Every name holds `harness models:`:
# `npm run plants:daemon -- "harness models:"` runs them.

[run]
hm-ledger-handles = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "handles::"]
hm-ledger-members = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "members_by_model"]
hm-engine-chief = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "chief_model::"]
hm-engine-named = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "named_by_model::"]
hm-daemon-members = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::members::"]
hm-daemon-tasks = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "api::routes::tasks::"]
hm-cf-board = ["cargo", "test", "--offline", "-p", "cf", "--test", "board_goldens"]
hm-cf-task-list = ["cargo", "test", "--offline", "-p", "cf", "--lib", "board::task::"]
hm-evals-plan = ["cargo", "test", "--offline", "-p", "cf-evals", "--test", "plan"]
hm-e2e-wrapper = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::machine::wrapper"]
hm-page-chief = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "asks the chief's effort"]
hm-page-history = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/history-viewer.spec.mjs", "-g", "every name a member had|member that joined in alpha.2"]
hm-page-needs-edit = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "could not run on what it ran on"]
hm-page-designer = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "keeps an image designer a member of its own"]
hm-harness-window = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "window_args::"]
hm-ledger-replay = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "replay"]
hm-engine-chief-models = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "chief_models::"]
hm-page-chief-model = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "could not tell the model of"]
hm-page-staff = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "starts a project in a chosen folder|shows the staff as one row per member"]

