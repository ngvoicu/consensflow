# What the Tauri 2.12 upgrade keeps of the app's update restart (T-930). Since Tauri 2.12.2 its
# restart starts a macOS app through LaunchServices (`open -n`): launchd's child, in a session of
# its own, its input and output `/dev/null`. The updater smoke's app reads the smoke's FIFO, writes
# its reports on its output and is ended with its process group, so the app an update installed is
# started by the app itself at its event loop's end, as Tauri 2.11 did
# (`app/src-tauri/src/updates.rs`, `relaunch_installed`). One plant takes one part of that out; a
# test fails.
#
# Every name holds `tauri-2-12`, so `npm run plants:daemon -- "tauri-2-12:"` runs them all.

[run]
app-relaunch = ["cargo", "xtask", "app", "test", "an_installed_update_starts_with_this_apps_environment_input_and_arguments"]
app-relaunch-once = ["cargo", "xtask", "app", "test", "the_installed_app_is_started_once_whatever_the_cleanup_and_the_start_do"]
app-static-crt = ["cargo", "xtask", "app", "test", "the_windows_app_links_its_c_runtime_statically"]

[[plant]]
name = "tauri-2-12: the installed update is started as Tauri 2.12 starts it, through LaunchServices"
meant = "an_installed_update_starts_with_this_apps_environment_input_and_arguments"
runs = ["app-relaunch"]

[[plant.edit]]
file = "app/src-tauri/src/updates.rs"
find = """
    let mut command = std::process::Command::new(app.join("Contents/MacOS").join(&executable));
    command.args(args);"""
replace = """
    let mut command = std::process::Command::new("/usr/bin/open");
    command.arg("-n").arg(app).arg("--args").args(args).stdin(std::process::Stdio::null());"""

[[plant]]
name = "tauri-2-12: the installed update is started without this app's input"
meant = "an_installed_update_starts_with_this_apps_environment_input_and_arguments"
runs = ["app-relaunch"]

[[plant.edit]]
file = "app/src-tauri/src/updates.rs"
find = """
    command.args(args);
    cf_process::hold_only_the_streams(&mut command);"""
replace = """
    command.args(args).stdin(std::process::Stdio::null());
    cf_process::hold_only_the_streams(&mut command);"""

[[plant]]
name = "tauri-2-12: the installed update is started without this app's arguments"
meant = "an_installed_update_starts_with_this_apps_environment_input_and_arguments"
runs = ["app-relaunch"]

[[plant.edit]]
file = "app/src-tauri/src/updates.rs"
find = """
    command.args(args);
    cf_process::hold_only_the_streams(&mut command);"""
replace = """
    let _ = args;
    cf_process::hold_only_the_streams(&mut command);"""

[[plant]]
name = "tauri-2-12: the installed update is started holding this app's descriptors"
meant = "an_installed_update_starts_with_this_apps_environment_input_and_arguments"
runs = ["app-relaunch"]

[[plant.edit]]
file = "app/src-tauri/src/updates.rs"
find = """
    command.args(args);
    cf_process::hold_only_the_streams(&mut command);"""
replace = """
    command.args(args);"""

# The installed app is started once (T-941): Tauri's cleanup runs before the start, a panic of it
# stopped, and a start is followed by the exit alone, so Tauri's restart never starts it again.

[[plant]]
name = "tauri-2-12: Tauri's cleanup runs between the installed update's start and the exit, as before T-941"
meant = "the_installed_app_is_started_once_whatever_the_cleanup_and_the_start_do"
runs = ["app-relaunch-once"]

[[plant.edit]]
file = "app/src-tauri/src/updates.rs"
find = """
    if std::panic::catch_unwind(std::panic::AssertUnwindSafe(cleanup)).is_err() {
        eprintln!("ConsensFlow's cleanup before starting the installed update panicked");
    }
    match start(installed) {
        Ok(()) => exit(),"""
replace = """
    match start(installed) {
        Ok(()) => {
            cleanup();
            exit()
        }"""

[[plant]]
name = "tauri-2-12: a panic of Tauri's cleanup before the installed update's start is not stopped"
meant = "the_installed_app_is_started_once_whatever_the_cleanup_and_the_start_do"
runs = ["app-relaunch-once"]

[[plant.edit]]
file = "app/src-tauri/src/updates.rs"
find = """
    if std::panic::catch_unwind(std::panic::AssertUnwindSafe(cleanup)).is_err() {
        eprintln!("ConsensFlow's cleanup before starting the installed update panicked");
    }"""
replace = """
    cleanup();"""

[[plant]]
name = "tauri-2-12: the installed update's start is not followed by the exit"
meant = "the_installed_app_is_started_once_whatever_the_cleanup_and_the_start_do"
runs = ["app-relaunch-once"]

[[plant.edit]]
file = "app/src-tauri/src/updates.rs"
find = "        Ok(()) => exit(),"
replace = "        Ok(()) => drop(exit),"

[[plant]]
name = "tauri-2-12: the app starts an update where none was installed"
meant = "the_installed_app_is_started_once_whatever_the_cleanup_and_the_start_do"
runs = ["app-relaunch-once"]

[[plant.edit]]
file = "app/src-tauri/src/updates.rs"
find = """
    let Some(installed) = installed else {
        return;
    };
    if std::panic::catch_unwind"""
replace = """
    let installed = installed.unwrap_or(Path::new("/"));
    if std::panic::catch_unwind"""

# The Windows app links its C runtime statically, and its configuration says so (T-941).

[[plant]]
name = "tauri-2-12: the Windows app is configured to link its C runtime dynamically"
meant = "the_windows_app_links_its_c_runtime_statically"
runs = ["app-static-crt"]

[[plant.edit]]
file = "app/src-tauri/tauri.conf.json"
find = '"staticVCRuntime": true'
replace = '"staticVCRuntime": false'
