# Plants in the page's acknowledgement of the windows' output and in the app's
# web view, T-454's round. The pane host stops reading a window once a window of
# its output (1 MiB) is owed an acknowledgement, and only the page acknowledges:
# the page writes each message to its terminal as it comes and acknowledges up to
# the last one drawn (app/ui/terminal-link.js), acknowledges the output of a pane
# it let go of while it still runs, and on Windows a page whose process failed is
# loaded again (app/src-tauri/src/page_crash.rs), kept apart and given up on when it
# fails as fast as it loads (page_reloads.rs, T-499). What a throttled page gains is
# shown on a built app only (crates/cf-e2e/tests/smoke/hidden.rs, its plants in
# release/packaged.toml), and macOS's throttling switched off on an app built
# with the plant, by hand.

[run]
page-acks = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "writes each message to its terminal|acknowledges what comes for a window"]
app-page-crash = ["cargo", "xtask", "app", "test", "page_crash"]
app-page-reloads = ["cargo", "xtask", "app", "test", "page_reloads"]
tiny-output = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "tiny_read"]

[[plant]]
name = "tiny read: a queued byte keeps the whole read buffer"
meant = "a_one_byte_read_does_not_keep_an_eight_kibibyte_allocation"
runs = ["tiny-output"]

[[plant.edit]]
file = "crates/cf-panes/src/pty/flow.rs"
find = "                bytes: buffer[..byte_count].to_vec(),"
replace = '''                bytes: {
                    let mut bytes = Vec::with_capacity(8 * 1024);
                    bytes.extend_from_slice(&buffer[..byte_count]);
                    bytes
                },'''

[[plant]]
name = "tiny read: waiting reads are never joined"
meant = "tiny_read_queued_burst_is_joined_in_order_before_the_exit"
runs = ["tiny-output"]
platforms = ["macos", "linux"]

[[plant.edit]]
file = "crates/cf-panes/src/pane_handlers.rs"
find = '''    while let Ok(next) = stream.try_recv() {
        if next.bytes.len() > MAX_OUTPUT_MESSAGE_BYTES.saturating_sub(message.bytes.len()) {
            *pending = Some(next);
            break;
        }
        feed(&next.bytes);
        message.bytes.extend_from_slice(&next.bytes);
        message.seq = next.seq;
    }'''
replace = '''    if let Ok(next) = stream.try_recv() {
        *pending = Some(next);
    }'''

[[plant]]
name = "tiny read: joined reads reverse their order"
meant = "tiny_read_batches_obey_the_bound_and_keep_the_last_sequence"
runs = ["tiny-output"]

[[plant.edit]]
file = "crates/cf-panes/src/pane_handlers.rs"
find = "        message.bytes.extend_from_slice(&next.bytes);"
replace = "        drop(message.bytes.splice(0..0, next.bytes.iter().copied()));"

[[plant]]
name = "tiny read: a joined message acknowledges only its first read"
meant = "tiny_read_batches_obey_the_bound_and_keep_the_last_sequence"
runs = ["tiny-output"]

[[plant.edit]]
file = "crates/cf-panes/src/pane_handlers.rs"
find = "        message.seq = next.seq;"
replace = "        let _ = next.seq;"

[[plant]]
name = "tiny read: joined reads hide a screen change"
meant = "tiny_read_batch_keeps_each_screens_change_boundary"
runs = ["tiny-output"]

[[plant.edit]]
file = "crates/cf-panes/src/pane_handlers.rs"
find = "        feed(&next.bytes);"
replace = "        // A later read does not reach the screen."

[[plant]]
name = "page acks: each message waits for the one before it to be drawn"
meant = "writes each message to its terminal as it comes and acknowledges up to the last one drawn"
runs = ["page-acks"]

[[plant.edit]]
file = "app/ui/terminal-link.js"
find = '''    emulator
      .write(new Uint8Array(message.bytes ?? []))
      .then(() => this.#drawn(key, message))'''
replace = '''    this.last = (this.last ?? Promise.resolve()).then(() =>
      emulator.write(new Uint8Array(message.bytes ?? [])),
    )
    this.last
      .then(() => this.#drawn(key, message))'''

[[plant]]
name = "page acks: every message is acknowledged on its own"
meant = "writes each message to its terminal as it comes and acknowledges up to the last one drawn"
runs = ["page-acks"]

[[plant.edit]]
file = "app/ui/terminal-link.js"
find = "    if (!ack.sending) void this.#acknowledge(ack)"
replace = "    void this.#invoke('pane_ack', { id, generation, seq })"

[[plant]]
name = "page acks: the output of a pane let go of while it runs is dropped unacknowledged"
meant = "acknowledges what comes for a window the page let go of while it still runs, and draws none of it"
runs = ["page-acks"]

[[plant.edit]]
file = "app/ui/terminal-link.js"
find = "    if (this.#retired.has(key)) return this.#drawn(key, message)"
replace = "    if (this.#retired.has(key)) return"

[[plant]]
name = "page crash: a page whose own process ended is not loaded again (Windows)"
meant = "only_the_pages_own_process_ending_or_hanging_loads_it_again"
runs = ["app-page-crash"]
platforms = ["windows"]

[[plant.edit]]
file = "app/src-tauri/src/page_crash.rs"
find = '''    kind == COREWEBVIEW2_PROCESS_FAILED_KIND_RENDER_PROCESS_EXITED
        || kind == COREWEBVIEW2_PROCESS_FAILED_KIND_RENDER_PROCESS_UNRESPONSIVE'''
replace = '''    kind == COREWEBVIEW2_PROCESS_FAILED_KIND_RENDER_PROCESS_UNRESPONSIVE'''

[[plant]]
name = "page crash: the browser's own process ending is taken for the page's (Windows)"
meant = "only_the_pages_own_process_ending_or_hanging_loads_it_again"
runs = ["app-page-crash"]
platforms = ["windows"]

[[plant.edit]]
file = "app/src-tauri/src/page_crash.rs"
find = '''    kind == COREWEBVIEW2_PROCESS_FAILED_KIND_RENDER_PROCESS_EXITED
        || kind == COREWEBVIEW2_PROCESS_FAILED_KIND_RENDER_PROCESS_UNRESPONSIVE'''
replace = '''    kind.0 <= COREWEBVIEW2_PROCESS_FAILED_KIND_RENDER_PROCESS_UNRESPONSIVE.0'''

[[plant]]
name = "page crash: two kinds of failure are said in the same words (Windows)"
meant = "every_failure_is_said_by_its_kind_and_with_what_is_done_with_it"
runs = ["app-page-crash"]
platforms = ["windows"]

[[plant.edit]]
file = "app/src-tauri/src/page_crash.rs"
find = '''        COREWEBVIEW2_PROCESS_FAILED_KIND_GPU_PROCESS_EXITED => "the GPU's process ended",
'''
replace = ""

[[plant]]
name = "page reloads: a failed page is loaded again as fast as it fails"
meant = "a_page_that_fails_as_it_loads_is_loaded_five_s_apart_and_given_up_on_after_five_in_a_minute"
runs = ["app-page-reloads"]

[[plant.edit]]
file = "app/src-tauri/src/page_reloads.rs"
find = "let at = self.at.back().map_or(now, |last| now.max(*last + APART));"
replace = "let at = now;"

[[plant]]
name = "page reloads: a page that fails as it loads is never given up on"
meant = "a_page_that_fails_as_it_loads_is_loaded_five_s_apart_and_given_up_on_after_five_in_a_minute"
runs = ["app-page-reloads"]

[[plant.edit]]
file = "app/src-tauri/src/page_reloads.rs"
find = "        if self.at.len() >= AT_MOST {"
replace = "        if self.at.len() >= usize::MAX {"

[[plant]]
name = "page reloads: a load more than a minute ago is counted still"
meant = "the_loads_of_more_than_a_minute_ago_are_not_counted"
runs = ["app-page-reloads"]

[[plant.edit]]
file = "app/src-tauri/src/page_reloads.rs"
find = ".is_some_and(|first| now.saturating_duration_since(*first) >= WITHIN)"
replace = ".is_some_and(|first| now.saturating_duration_since(*first) > WITHIN * 60)"
