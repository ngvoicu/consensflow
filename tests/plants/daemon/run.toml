[[plant]]
name = "throttle: every call begins a wait of its own, and the page is told twice"
meant = "the_page_is_told_the_board_moved_a_hundred_milliseconds_after_the_first_change_and_once"
runs = ["daemon-lib-start"]

[[plant.edit]]
file = "crates/cf-daemon/src/pass.rs"
find = '''
        if pending.replace(true) {
            return;
        }'''
replace = "        pending.replace(true);"

[[plant]]
name = "throttle: a later call puts the wait off"
meant = "the_page_is_told_the_board_moved_a_hundred_milliseconds_after_the_first_change_and_once"
runs = ["daemon-lib-start"]

[[plant.edit]]
file = "crates/cf-daemon/src/pass.rs"
find = '''
    let pending = Rc::new(Cell::new(false));
    let work = Rc::new(work);'''
replace = '''
    let pending = Rc::new(Cell::new(false));
    let latest = Rc::new(Cell::new(0_u32));
    let work = Rc::new(work);'''

[[plant.edit]]
file = "crates/cf-daemon/src/pass.rs"
find = '''
        if pending.replace(true) {
            return;
        }
        let (pending, work) = (Rc::clone(&pending), Rc::clone(&work));
        drop(tokio::task::spawn_local(async move {
            sleep(wait).await;
            pending.set(false);
            work();
        }));'''
replace = '''
        let call = latest.get() + 1;
        latest.set(call);
        let (latest, pending, work) = (Rc::clone(&latest), Rc::clone(&pending), Rc::clone(&work));
        drop(tokio::task::spawn_local(async move {
            sleep(wait).await;
            if latest.get() == call {
                pending.set(false);
                work();
            }
        }));'''

