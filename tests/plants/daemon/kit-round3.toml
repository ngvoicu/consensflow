# Offline, fabricated fixtures protect source-tree links and run-owned readers.
[run]
round3-lib = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "kit_round3"]
round3-parity = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_parity", "kit_round3"]
round3-muse = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_muse_background", "kit_round3"]
round3-muse-reads = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_muse_reads", "kit_round3"]
round3-compaction = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_compaction_routes", "kit_round3"]
round3-subagent = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_subagent", "kit_round3"]
round3-specs = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_specs", "kit_round3"]
round3-dialog = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_harness_dialogs", "kit_round3"]
round3-history = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_history_items", "kit_round3"]

[[plant]]
name = "kit round3: Devin carries Git credentials"
meant = "kit_round3_devin_does_not_carry_git_credentials"
runs = ["round3-lib"]
platforms = ["linux", "macos"]
[[plant.edit]]
file = "crates/cf-e2e/src/live/isolation.rs"
find = '''                Seed::Fixed {
                    to: "config/git/config".into(),'''
replace = '''                Seed::Copy {
                    from: config.join("git").join("credentials"),
                    to: "config/git/credentials".into(),
                    login: false,
                },
                Seed::Fixed {
                    to: "config/git/config".into(),'''

[[plant]]
name = "kit round3: Pi package follows a link out"
meant = "kit_round3_pi_package_skips_links_out_and_keeps_links_inside"
runs = ["round3-lib"]
platforms = ["linux", "macos"]
[[plant.edit]]
file = "crates/cf-e2e/src/door/writes.rs"
find = '''            let Ok(real) = fs::canonicalize(&source) else {
                continue;
            };
            let Ok(relative) = real.strip_prefix(source_root) else {
                continue;
            };
            let destination = target_root.join(relative);
            copied_link(&destination, &target, real.is_dir())?;'''
replace = '''            copy_keeping_mode(&source, &target)?;'''

