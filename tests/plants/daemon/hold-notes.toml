# The note a held task's requester is given (3.0.7-alpha.4 fixes, T-1181; the field boards of
# 2026-10-26 and 2026-11-02): kluris' T-104 and T-105 sent their chief about ten "goes on in the
# background" notes while they waited for Windows runs, T-298 twelve in 1 h 46, and each woke the
# chief for a turn with nothing to do; one chief could not read a note of a monitor that "said its
# time ran out at 11:38:54 UTC; … is over once no command of … runs in its window, once nothing else
# of it is pending". The rules:
#
# - a task that goes on in the background is told to its requester once, and its result when it
#   comes: a job that ends or begins, a monitor's notice, what a look at the window found are told
#   no more (`turn_end`, `Told`);
# - the one change told after the first note is a hold nothing but Finish ends (every job left is a
#   monitor that said it ended and has no command of the window to look for, or the host cannot
#   see the window's commands): told once more, in the words of that, and not again;
# - the note is plain: what runs by kind and count (commands, agents, monitors), what the harness's
#   reader knows of a command (since when it runs, and that a time limit moved it into the
#   background: the field board's T-299 had one run 100 minutes with its worker none the wiser),
#   that the result comes when they end, and the one other choice, to take what the worker said
#   last now (`running_said`);
# - Claude Code's reader keeps when each command began and the limit that moved it
#   (`toolUseResult.timedOutAfterMs` beside `backgroundTaskId`), and its reading says its
#   commands as it says its monitors (`claude::record::jobs`, `Record::commands`).
#
# One plant takes one rule out; a test of it fails. The other plants of the note's rules are in
# `turn-end-min`, `pending-agents` and `torn-line`. Every name holds `hold notes:`, so
# `npm run plants:daemon -- "hold notes:"` runs them all.

[run]
hn-reader = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record"]
hn-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "hold_notes::"]

# --- the reader: a command's start and the limit that moved it ---

[[plant]]
name = "hold notes: the reader keeps no start for a command"
meant = "a_command_that_was_asked_to_run_in_the_background_began_when_its_record_was_written"
