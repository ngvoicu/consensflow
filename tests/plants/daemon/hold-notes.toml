[[plant.edit]]
file = "crates/cf-harness/src/claude/record/jobs.rs"
find = "        let since = at.map(|at| at.saturating_sub(limit_ms.unwrap_or(0)));"
replace = "        let since: Option<i64> = at.map(|_| 0).filter(|_| false);"

[[plant]]
