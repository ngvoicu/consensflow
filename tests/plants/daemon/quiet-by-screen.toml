[[plant.edit]]
file = "crates/cf-engine/src/arrival.rs"
find = "            .and_then(|snapshot| snapshot.get(SCREEN_QUIET_MS))"
replace = """            .and_then(|snapshot| snapshot.get("outputQuietMs"))"""

[[plant]]
name = "quiet by screen: the key that empties a box waits for a quiet output"
