replace = """        let screen_quiet_ms = ms(&snapshot, "outputQuietMs");"""

[[plant]]
name = "quiet by screen: the fallback's lane says a quiet screen unasked"
meant = "a_harness_with_no_idle_word_of_its_own_waits_for_a_quiet_screen_too_and_says_so"
runs = ["qs-engine"]

[[plant.edit]]
