# A window that repaints without changing what it shows counts as quiet (T-1083, found by
# T-1081). Muse Code 1.4.14, at rest after a command it ran in the background was stopped,
# writes colour resets and a move of the cursor to where it is every 50 ms. The daemon judged a
# window at rest by its output going quiet, so the resume words of T-1081's live run waited
# 360 s and were never let in, while the board said "a quiet screen". Now the pane host keeps a
# second clock beside the output's: when what the screen shows last changed (`screenQuietMs`),
# from a digest of its cells after each chunk; and every judge of a screen at rest or still
# being drawn reads it. The paste's Enter and a box reader's "did the window answer the last
# key" keep the output's clock.
#
# - the pane host: a chunk that changes nothing shown does not move the screen's clock; the
#   cursor is not part of what is shown, the styled mark of a cell is; the host's resize is no
#   change; the snapshot says the screen's clock apart from the output's;
# - the paste's Enter waits on the output, not on the screen;
# - the engine: the pacing's fallback, the lane that says it, a fresh window's drawn screen,
#   the Enter again for a paste the record never showed (both of its looks), the key that
#   empties a box, the daemon's host look of a closing window, Devin's `/bypass`: each reads
#   the screen's clock; the lane's look costs no turn of the Node traces;
# - a box reader asks the output whether the window answered the human's last key.
#
# Every name holds `quiet by screen`, so `cargo xtask plants daemon "quiet by screen"` runs them.

[run]
qs-panes = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "--", "screen::", "arbiter::", "pane_handlers::"]
qs-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "--", "pacing::", "looks::", "still_there::", "stale_box::", "close_when_drawn::"]
qs-daemon = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "host::", "contract::bridge::"]
qs-harness = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "devin::adapter::", "shared::input_box::"]

[[plant]]
name = "quiet by screen: every chunk moves the screen's clock"
meant = "a_window_that_repaints_what_it_shows_is_quiet_by_its_screen_and_not_by_its_output"
runs = ["qs-panes"]

[[plant.edit]]
file = "crates/cf-panes/src/pane_handlers.rs"
find = "            printed.note(changed);"
replace = "            printed.note(changed || !changed);"

[[plant]]
name = "quiet by screen: a chunk that draws again what is shown is a change"
meant = "a_screen_printed_again_as_it_is_shows_no_change_and_what_a_person_sees_change_is_one"
runs = ["qs-panes"]

[[plant.edit]]
file = "crates/cf-panes/src/screen.rs"
find = "        let changed = shows != self.shows;"
replace = "        let changed = shows == shows;"

[[plant]]
name = "quiet by screen: the cursor is part of what the screen shows"
meant = "a_screen_printed_again_as_it_is_shows_no_change_and_what_a_person_sees_change_is_one"
runs = ["qs-panes"]

[[plant.edit]]
file = "crates/cf-panes/src/screen/grid.rs"
find = "        (self.rows, self.cols).hash(&mut hasher);"
replace = "        (self.rows, self.cols, self.row, self.col).hash(&mut hasher);"

[[plant]]
name = "quiet by screen: a cell drawn plain where it was styled is no change"
meant = "a_screen_printed_again_as_it_is_shows_no_change_and_what_a_person_sees_change_is_one"
runs = ["qs-panes"]

[[plant.edit]]
file = "crates/cf-panes/src/screen/grid.rs"
find = "            row.styled.hash(&mut hasher);"
replace = "            let _ = &row.styled;"

[[plant]]
name = "quiet by screen: the host's resize is the program's change"
meant = "a_resize_is_no_change_and_what_is_drawn_after_it_is"
runs = ["qs-panes"]

[[plant.edit]]
file = "crates/cf-panes/src/screen.rs"
find = """
        self.grid.resize(usize::from(rows), usize::from(cols));
        self.shows = self.grid.digest();"""
replace = """
        self.grid.resize(usize::from(rows), usize::from(cols));"""

[[plant]]
name = "quiet by screen: the screen's clock is the output's"
meant = "a_snapshot_says_how_long_the_screen_has_shown_the_same_apart_from_the_output"
runs = ["qs-panes"]

[[plant.edit]]
file = "crates/cf-panes/src/arbiter.rs"
find = "            screen_quiet_ms: self.output.screen_quiet_ms(),"
replace = "            screen_quiet_ms: self.output.quiet_ms(),"

[[plant]]
name = "quiet by screen: the snapshot does not say the screen's clock"
meant = "a_window_that_repaints_what_it_shows_is_quiet_by_its_screen_and_not_by_its_output"
runs = ["qs-panes"]

[[plant.edit]]
file = "crates/cf-panes/src/pane_handlers.rs"
find = """
        "screenQuietMs":snapshot.screen_quiet_ms,"""
replace = ""

[[plant]]
name = "quiet by screen: a paste's Enter waits on the screen"
