# The catalog's tiers and Devin's models, and the order the agent pickers offer them in (T-553,
# 2026-10-25, Gabriel: "move opus medium to standard work... add from devin all models it has...
# the dropdown list split by tier, harness and also order by max, xhigh, …"). Opus 5.5 at medium
# is standard work; every model Devin lists is a preset at each of its levels from low to max, or
# by its plain id, at the tiers Gabriel decided; Kimi K3.1 Pro and Gemini 4 Argon have rules of
# their own; Devin's Claude and GPT agents are hidden with the others when the human keeps those
# models to their own harnesses; the staff's and the chief's pick lists group by tier, then
# harness, then effort, and so does the Agents page grouped by tier. One plant takes one rule out;
# a test of it fails. Every name holds `catalog tiers`, so `npm run plants:daemon -- "catalog
# tiers"` runs them all.

[run]
tiers-catalog = ["cargo", "test", "--offline", "-p", "cf-catalog", "--test", "catalog"]
tiers-preferences = ["cargo", "test", "--offline", "-p", "cf-catalog", "--lib", "roster::preferences"]
# The two pick lists, in the browser.
tiers-page-pickers = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "pick list orders|pick list groups"]
# Khnum, which left the catalog, in the engine, the daemon's board and the page.
tiers-engine-retired = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "retired_agents::"]
tiers-daemon-board = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::reading"]
tiers-page-khnum = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "staffed with Khnum|its agent gone, it says so"]
tiers-catalog-lib = ["cargo", "test", "--offline", "-p", "cf-catalog", "--test", "catalog", "offers_devin_s_swe_1_6"]
# The Agents page is the daemon's, built into `cf`: built again from the sources as planted.
tiers-agents-checkbox = { command = ["node", "tests/agents-page-built.mjs", "a checkbox keeps Claude and OpenAI"], builds = true }
tiers-agents-page = { command = ["node", "tests/agents-page-built.mjs", "grouped by work tier"], builds = true }

# --- the tiers ---

[[plant]]
name = "catalog tiers: Opus 5.5 at medium is complex work again"
meant = "assigns_four_work_tiers_by_model_and_effort_across_routes_without_agent_name_rules"
runs = ["tiers-catalog"]

