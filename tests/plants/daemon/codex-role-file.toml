[[plant.edit]]
file = "crates/cf-codex-session/src/broker/selection.rs"
find = '''        let role = self.role.as_deref().filter(|_| main_start);'''
replace = '''        let role = self.role.as_deref().filter(|_| false);'''

[[plant]]
