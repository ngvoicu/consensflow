# A Codex window's role on no command line (T-698, 2026-10-26). A Codex window was given its role
# text as `-c developer_instructions=<JSON>` on the supervisor's command line, which the supervisor
# put on Codex's app-server's and TUI's as well: every user of the machine reads a command line
# (`ps` is setuid root on macOS), and a pattern of its words matched the window. The harness writes
# the text (Codex's own instructions, then the role) to a file of the launch's own, 0600, and names
# it in the window's environment (`CF_CODEX_ROLE_FILE`); the supervisor reads it before Codex
# starts (a file named and unreadable, or empty, opens no window), tells neither program its name,
# and hands the text to the broker, which gives it to the TUI's main thread starts as their
# `developerInstructions` (which replace what Codex's configuration says for the thread, so the
# text holds Codex's own as well), in place of any the TUI named, and to no other start, resume or
# fork. The stand-in Codex begins a thread with what its start names. One plant takes one rule out,
# or puts the old code back; a test of it fails. The broker's and the supervisor's plants run the
# crate's own tests, the harness's its role tests and the launch suite (its rule test over both
# platforms' recordings and the adapter, and the scenarios), the stand-in's its own; the
# `codex role file rig:` plants run the regression and the rig's case of a Codex chief (a real
# daemon, the real pane host, the stand-in Codex), and say `builds`: the family builds the native
# `cf` again once each is put back. Every name holds `codex role file`.

[run]
# The broker's and the supervisor's own tests.
codex-session = ["cargo", "test", "--offline", "-p", "cf-codex-session", "--lib"]
# The harness's tests of the role's text and its file.
harness-codex-role = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "codex::role"]
# The launch suite's Codex cases: the rule test, the launch, the specs.
harness-launch-codex = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "codex::"]
# Every adapter's scenarios as Node played them, moved where the role left the command line.
harness-scenarios = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "scenarios::"]
# The stand-in Codex's own tests: what a thread begins with.
fake-codex-own = ["cargo", "test", "--offline", "-p", "cf-e2e", "--bin", "fake-codex"]
# The rule over both platforms' launch goldens: no board token on a command line.
harness-launch-secrets = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "secrets::"]
# The regression: a Codex chief's role on no command line, fresh and resumed, and its thread
# begins with it once.
rig-regression-role-file = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_codex_windows_role_was_on_its_command_line::"]
# The rig's case of a Codex chief given specs: its thread begins with its role.
rig-specs-codex = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "specs_codex::"]

