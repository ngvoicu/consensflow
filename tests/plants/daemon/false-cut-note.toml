# A window whose turn had ended, with only background work running, is at rest at
# the human's Resume, and is told nothing of a cut turn: the notification of a job
# Claude Code ended itself begins no turn, and what only its notices hold open was
# no turn; an idle compaction's summary is no word of the user's. A note a Resume
# wrote of a window's state is judged again at the next, and withdrawn where the
# record no longer says it. A cut turn is named by when the message that began it
# came and its first words (T-814: poker-lab's and sites's chiefs, told their turns
# were cut, went to work on their own). One plant takes one rule out; a test of it
# fails.

[run]
# The Claude reader's own tests: what each record says of a turn.
fcn-claude-reader = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record"]
# What the engine asks of a record with no window open, on every harness.
fcn-harness-contract = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "contract::"]
# The field records, read as the Resume reads them, with Claude's statuses or none.
fcn-harness-closed = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "claude::closed_at_rest"]
fcn-harness-outside = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "claude::outside"]
# The Resume's notes.
fcn-engine-resume = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "resume::"]
# The ledger's words of a continuation, and its withdrawal of a note.
fcn-ledger-lib = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "messages::continuations"]
fcn-ledger-receipt = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "continuations::"]

