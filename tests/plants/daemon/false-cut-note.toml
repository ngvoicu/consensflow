# --- B: a note of a window's state holds for its Resume alone ---

[[plant]]
name = "false cut note: a note an earlier Resume left queued is given without the record read again"
meant = "a_cut_note_an_earlier_resume_left_queued_is_withdrawn_where_the_record_now_reads_at_rest"
runs = ["fcn-engine-resume"]

[[plant.edit]]
file = "crates/cf-engine/src/resume.rs"
find = '''
        if handed_again {
            return Ok(None);
        }
'''
replace = '''
        if handed_again {
            return Ok(None);
        }
        let earlier = self
            .seams
            .ledger
            .borrow()
            .pending(participant.id)?
            .into_iter()
            .find(|message| {
                message.sender.is_none()
                    && message.kind == "note"
                    && message.state == "queued"
                    && coming.told_in(&message.body)
            });
        if earlier.is_some() {
            return Ok(earlier);
        }
'''

