        }
        let earlier = self
            .seams
            .ledger
            .borrow()
            .pending(participant.id)?
            .into_iter()
            .find(|message| {
                matches!(coming, Coming::Member { .. })
                    && message.sender.is_none()
                    && message.kind == "note"
                    && message.state == "queued"
                    && coming.told_in(&message.body)
            });
        if earlier.is_some() {
