# Models are shown by their id and members are named by it (spec harness-models, HMD-12, T-1263):
# a member's name is its model's id and effort (`@claude-opus-5-5-high`; Pi's without its provider,
# Devin's by the id its list holds), the provider of a Pi model in front where that is taken, then
# the harness, then a number; migration 0033 renames every member with a model, its windows after
# it, and keeps each name it leaves; Edit member renames the member and its windows, one at work
# too; the board says a name apart where it holds no model, and a card says its role, tier and
# harness and no more under a name that holds the model; every select offers the id; History
# says every earlier name. One plant takes one rule out; a test of it fails. Every name holds
# `model ids:`: `npm run plants:daemon -- "model ids:"` runs them.

[run]
mi-ledger-handles = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "handles::"]
mi-ledger-ids = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "model_ids"]
mi-ledger-members = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "members_by_model"]
mi-engine-named = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "named_by_model::"]
mi-daemon-members = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::members::"]
mi-daemon-routes = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "api::routes::"]
mi-cf-board = ["cargo", "test", "--offline", "-p", "cf", "--test", "board_goldens"]
mi-page-selects = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "model selects of New project"]
mi-page-cards = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "card says its role"]
mi-page-edit = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "Edit member to another model renames"]
mi-page-history = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/history-viewer.spec.mjs", "-g", "every name a member had|member that joined in alpha.2"]

