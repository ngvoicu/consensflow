find = '''
    Ok(NewProject::from_json(&Value::Object(request))?)
'''
replace = '''
    let sent = request.get("staff").and_then(Value::as_array).cloned().unwrap_or_default();
    let mut project = NewProject::from_json(&Value::Object(request))?;
    for (member, sent) in project.staff.iter_mut().zip(&sent) {
