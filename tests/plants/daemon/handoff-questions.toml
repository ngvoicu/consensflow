# A Switch chief's handoff sent the new chief to answer a question on a cancelled task (the
# owner's `sites` project, 2026-10-21, T-157): a worker asked on T-9, the chief answered and
# cancelled T-9 at once, the cancel took the answer's delivery back (the answer read
# `cancelled`), and four hours later the handoff listed the question under "What waits on you
# now". `chief_open_work` (`crates/cf-ledger/src/conversations/chief.rs`) lists a question the
# chief has no live answer to, and now only while its task is not over: accepted, cancelled or
# failed. A question on a task that is open, queued, working, waiting, paused or done, and one
# on no task, is listed as it was; an answer cancelled for another reason (withdrawn while the
# task goes on) leaves its question listed.
#
# The cases are the ledger's (`crates/cf-ledger/tests/chief_open_work.rs`) and the rig's, in the
# field's shape (`crates/cf-e2e/tests/regressions/a_switched_chief_was_sent_to_answer_a_question_on_a_cancelled_task.rs`).
# The rig's build the native `cf` from the sources as planted, so their plants say `builds`.
# Every name holds `handoff questions`, so `npm run plants:daemon -- "handoff questions"` runs
# them all.

[run]
handoff-open-work = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "chief_open_work"]
handoff-rig-cancelled = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_switched_chief_was_sent_to_answer_a_question_on_a_cancelled_task::a_question_whose_answer"]
handoff-rig-waiting = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_switched_chief_was_sent_to_answer_a_question_on_a_cancelled_task::a_question_on_a_task_that_still_waits"]

[[plant]]
name = "handoff questions: a question on a task that is over is listed, whatever became of its answer"
meant = "a_question_on_a_task_cancelled_after_its_answer_is_not_open"
runs = ["handoff-open-work"]

[[plant.edit]]
file = "crates/cf-ledger/src/conversations/chief.rs"
find = "SELECT 1 FROM task q WHERE q.id = m.task_id AND q.state IN ({finished})"
replace = "SELECT 1 FROM task q WHERE 0 AND q.id = m.task_id AND q.state IN ({finished})"

[[plant]]
name = "handoff questions: the same, and the handoff of a switched chief sends it to answer a question the cancel left (the field's shape)"
meant = "a_question_whose_answer_a_cancel_took_back_is_not_in_the_handoff_of_a_switched_chief"
runs = ["handoff-rig-cancelled"]
builds = true

[[plant.edit]]
file = "crates/cf-ledger/src/conversations/chief.rs"
find = "SELECT 1 FROM task q WHERE q.id = m.task_id AND q.state IN ({finished})"
replace = "SELECT 1 FROM task q WHERE 0 AND q.id = m.task_id AND q.state IN ({finished})"

[[plant]]
name = "handoff questions: a question on an accepted task is listed"
meant = "a_question_on_a_task_the_chief_accepted_is_not_open"
runs = ["handoff-open-work"]

[[plant.edit]]
file = "crates/cf-ledger/src/conversations/chief.rs"
find = "AND q.state IN ({finished})"
replace = "AND q.state IN ({finished}) AND q.state != 'accepted'"

[[plant]]
name = "handoff questions: a question on a failed task is listed"
meant = "a_question_on_a_task_the_daemon_failed_is_not_open"
runs = ["handoff-open-work"]

[[plant.edit]]
file = "crates/cf-ledger/src/conversations/chief.rs"
find = "AND q.state IN ({finished})"
replace = "AND q.state IN ({finished}) AND q.state != 'failed'"

[[plant]]
name = "handoff questions: a question on a task that waits or is paused is dropped with the ones on tasks that are over"
meant = "a_question_on_a_task_still_waiting_or_paused_is_open"
runs = ["handoff-open-work"]

[[plant.edit]]
file = "crates/cf-ledger/src/conversations/chief.rs"
find = "AND q.state IN ({finished})"
replace = "AND q.state IN ({finished}, 'waiting', 'paused')"

[[plant]]
name = "handoff questions: the same, and the handoff of a switched chief leaves out a question on a task that still waits"
meant = "a_question_on_a_task_that_still_waits_is_in_the_handoff_of_a_switched_chief"
runs = ["handoff-rig-waiting"]
builds = true

[[plant.edit]]
file = "crates/cf-ledger/src/conversations/chief.rs"
find = "AND q.state IN ({finished})"
replace = "AND q.state IN ({finished}, 'waiting', 'paused')"

[[plant]]
name = "handoff questions: any answer a cancel took back closes its question, the withdrawn answer of a live task too"
meant = "a_question_whose_answer_was_withdrawn_while_its_task_goes_on_is_still_open"
runs = ["handoff-open-work"]

[[plant.edit]]
file = "crates/cf-ledger/src/conversations/chief.rs"
find = "AND a.state NOT IN ('gated', 'cancelled')"
replace = "AND a.state NOT IN ('gated')"
