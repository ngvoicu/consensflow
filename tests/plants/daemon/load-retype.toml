# A message the chief took, typed into its window again when the Mac was loaded (2026-10-22,
# ConsensFlow 3.0.5, T-269): the pane host answered nothing in time for three minutes, the
# chief's record and status read at rest, and the arrival window ran on through the stalls, so
# the brief was pasted again and both copies reached the chief. The case is
# `crates/cf-e2e/tests/regressions/a_message_the_chief_took_was_typed_in_again_under_load.rs`:
# the rig's router holds the paste and every frame between the daemon and the pane host for
# 200 s, or until the daemon pastes it again (so a red case ends at about 165 s, inside the kit's
# five minutes a run; the runner has no limit of a plant's own), and the result must be pasted
# once, and the stall leave its lines in the daemon's log.
#
# What stands against it (`cf-engine`'s `arrival`, its tests in
# `crates/cf-engine/tests/dispatcher/unknown_looks.rs`): a read of the window that fails or comes
# too late is unknown, counts no rest and decides nothing; before a paste goes again the window is
# read once more, the host first (nothing going in, and no paste written into the window for a
# whole arrival window), then the record; and a pass waits for its steps 5 s at most, so one
# window's stuck read holds no other window's delivery. Each read that comes to nothing, and each
# pass that goes on without a step, is a line in the daemon's log, at most once a minute.

[run]
engine-unknown-looks = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "unknown_looks::"]
harness-devin-rows = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "devin::record::tests::rows::"]
panes-lib-snapshot = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "a_snapshot_says"]
panes-lib-handlers = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "pane_handlers::"]
e2e-lib-route = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "rig::route::"]
harness-reading = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::record::reading::"]
engine-resume-close-look = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "resume::a_window_that_asks_and_ends_by_itself_while_the_close_looks_past"]
e2e-lib-stranger = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "rig::stranger::"]
harness-contract = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "contract::tests::"]
rig-regression-load-retype = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_message_the_chief_took_was_typed_in_again_under_load::"]

