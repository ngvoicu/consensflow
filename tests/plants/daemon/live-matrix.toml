# The live matrix's runner (spec `live-matrix`, LMX-04, T-1135): `crates/cf-e2e/src/matrix/`, a
# real harness in each position of a board, the chief driven by a scripted human, and an oracle
# that reads the ledger and the windows' records. Its control (`tests/live_matrix.rs`,
# `the_matrix_passes_its_scenario_on_the_rigs_stand_ins`) runs the same driver and oracle on the
# rig's stand-ins and passes; the first two plants put a wrong assignee and a missing result in
# what the oracle reads, and the control fails. The others take a rule of the oracle, the
# driver, the bindings or the stand-in out, and the matrix's or the stand-in's own tests fail.
#
# Every name holds `live matrix`, so `cargo xtask plants daemon "live matrix"` runs them all.

[run]
# The control, on the rig's stand-ins.
matrix-control = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_matrix", "tests::"]
# The matrix's own tests.
matrix-lib = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "matrix::"]
# The stand-in agent's replies.
matrix-fake-agent-reply = ["cargo", "test", "--offline", "-p", "cf-e2e", "--bin", "fake-agent", "reply::"]
# The live suite's own tests, the controls among them, by name.
matrix-control-end = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_matrix", "tests::a_cancelled"]
matrix-control-smoke = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_matrix", "tests::the_matrix_passes"]
# The daemon's API, the tooling's look at it among it.
matrix-daemon-api = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "api::tests::"]
# The rig's environment and its live Muse launcher.
matrix-rig-install = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "rig::install::"]

[[plant]]
name = "live matrix: the oracle reads each task's assignee as another task's (a wrong assignee)"
meant = "the_matrix_passes_its_scenario_on_the_rigs_stand_ins"
runs = ["matrix-control"]

[[plant.edit]]
file = "crates/cf-e2e/src/matrix/oracle.rs"
find = '''        let assignee = task["assignee"].as_str().unwrap_or_default();'''
replace = '''        let assignee = snapshot.task(number % 4 + 1).and_then(|other| other["assignee"].as_str()).unwrap_or_default();'''

[[plant]]
name = "live matrix: the oracle looks for each result under another task (a missing result)"
meant = "the_matrix_passes_its_scenario_on_the_rigs_stand_ins"
runs = ["matrix-control"]

[[plant.edit]]
file = "crates/cf-e2e/src/matrix/oracle.rs"
find = '''        let result = snapshot.delivered_result(number);'''
replace = '''        let result = snapshot.delivered_result(number + 100);'''

