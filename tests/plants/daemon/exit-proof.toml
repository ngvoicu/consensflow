# The host's proof that a window's program is gone, kept across a restart (T-541; T-530's
# follow-up went to a new conversation after the board's restart, m-3891). Another task goes on
# in a session's conversation only where the host proved the program of the last window on it
# gone (`crates/cf-engine/src/ownership.rs`). The ledger keeps that word on the conversation
# (`program_gone`, migration 0024; `crates/cf-ledger/src/conversations.rs`), written as the
# host proves the window's exit (`crates/cf-engine/src/dispatcher.rs`, `exited` and
# `heard_exit`), set back before a window opens on it (`crates/cf-engine/src/windows.rs`) or the
# human switches a window to it, and read by `kept_apart` and the next launch's
# `previous_gone`. A window open when the daemon stopped is no proof: the window's quit ends it
# after the daemon has gone and tells no one (`cf_panes::headless::reap_all`). The case on the
# rig is `crates/cf-e2e/tests/regressions/a_follow_up_after_a_restart_lost_its_windows_conversation.rs`,
# which builds the native `cf` from the sources as planted, so its plant says `builds`.
#
# Every name holds `exit proof`, so `npm run plants:daemon -- "exit proof"` runs them all.

[run]
# The engine's tests of the proof across a restart, on the fake windows.
ep-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "exit_proof::"]
# The engine's tests of what a window opened again is told of the program before it.
ep-engine-windows = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "windows::"]
# The ledger's tests of the column.
ep-ledger = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "program_gone::"]
# The field's shape on the rig: the daemon killed and started again on the same home.
ep-rig = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_follow_up_after_a_restart_lost_its_windows_conversation::"]
# What the players of Node's recordings hold apart of what only this ledger writes.
ep-ledger-testing = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "testing::program_gone"]

