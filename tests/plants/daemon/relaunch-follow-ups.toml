# The relaunch boundary's three follow-ups (T-442's three, T-489): the boundary bound to a checked
# prefix, a Claude the human starts outside ConsensFlow on a window's conversation, and an idle quit
# that leaves no sign in the record.
#
# - The boundary is the transcript's length and the bytes before it (`Boundary`,
#   `crates/cf-harness/src/shared/record/boundary.rs`), taken by the records seam
#   (`crates/cf-harness/src/records.rs`), and holds only in a transcript that still has those bytes
#   there; a later start told replaces the one the reader knows, or any where that one no longer
#   holds (`crates/cf-harness/src/claude/record.rs`). The reader's tests are
#   `crates/cf-harness/src/claude/record/tests/restart.rs`.
# - Claude's statuses say who shows a conversation (`crates/cf-harness/src/claude/status.rs`): a
#   window is told no boundary while a Claude shows its conversation, is told one where none does
#   though the host proved nothing, and says so on every look once another Claude has shown it
#   (`Observed::shared`, `crates/cf-harness/src/claude/adapter.rs`); the engine then takes no answer
#   for the task's result and tells its requester once (`crates/cf-engine/src/turn_end.rs`). The
#   adapter's tests are `crates/cf-harness/tests/launch/claude/outside.rs`, the engine's
#   `crates/cf-engine/tests/dispatcher/shared.rs`.
# - The Resume's look at a record no Claude shows is told where it ends
#   (`Records::turn_cut`, `crates/cf-harness/src/contract.rs`): a message queued and never taken is
#   no cut turn. The rig's cases are
#   `crates/cf-e2e/tests/regressions/an_idle_quit_with_a_message_queued_read_as_a_cut_turn.rs`, which
#   build the native `cf` from the sources as they are planted, so their plants say `builds`. The
#   Resume's look tells the record's reader where the record ended before the window is prepared,
#   and the reader keeps it, so on the rig the chief opened again after the app's quit is read right
#   by either rule, the Resume's or the adapter's (the case goes red with both planted, not with one):
#   the adapter's rule alone decides for a window opened once the reader has forgotten the Resume's
#   word (`IDLE_MS`), and is held by its own tests (`outside.rs`).
#
# Every name holds `relaunch-follow-ups`, so `npm run plants:daemon -- "relaunch-follow-ups"` runs
# them all.

[run]
relaunch-follow-ups-reader = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record::tests::restart"]
relaunch-follow-ups-boundary = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::record::boundary"]
relaunch-follow-ups-status = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::status"]
relaunch-follow-ups-adapter = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "claude::outside"]
relaunch-follow-ups-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "shared::"]
relaunch-follow-ups-rig = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "an_idle_quit_with_a_message_queued_read_as_a_cut_turn::"]

