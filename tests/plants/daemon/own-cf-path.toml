# Every command a window is taught names the window's own `cf` by its full path (T-1049; T-972's
# live kit found it on 2026-10-31: Devin 3000.11.228 on the Mac runs its commands through a login
# zsh whose PATH puts the user's `~/.local/bin` before the window's folder, and Claude Code 2.1.312
# on Windows through a login Git Bash that puts `~/bin` first; another program is also called `cf`,
# the Cloud Foundry CLI). No order of a PATH can matter to a full path, so:
#
# - the role texts (`skill/core/chief.md`, `skill/core/staff.md`) write `{{cf}}` where a command
#   starts, and `role_instructions` puts the window's path there (quoted as one word where a shell
#   would read it otherwise), where a section at the end asked a window to run it by its path
#   when its own `cf` answered as another program;
# - the hooks a launch writes (`cf hook claude`, `cf hook devin`, `cf hook devin-session`, `cf hook
#   muse-session`) are run by that path too (`shared::shell::cf_hook`).
#
# The texts are held by `crates/cf-engine/tests/text/roles.rs` (every role, with and without specs,
# with a path and with a path a shell reads: no bare `cf` anywhere), `roles/member.rs`'s tests (the
# part of a role gets it too) and the goldens of the texts; the hooks by the harness tests of each
# (`claude`'s launch, `devin::install`, `muse::launch`, `tooling::launch`) and `shared::shell`.
# `cargo xtask live own-cf` shows it on the real harnesses.
#
# Every name holds `own cf path`, so `npm run plants:daemon -- "own cf path"` runs them all.

[run]
engine-text-roles = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text", "roles::", "--", "--skip", "goldens_roles"]
engine-text-goldens-roles = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text", "goldens_roles"]
engine-lib-roles = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "roles::"]
harness-lib-shell = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::shell::"]
harness-lib-devin-install = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "devin::install::"]
harness-lib-muse-launch = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "muse::launch::"]
harness-launch-claude = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "claude::launches_a_fresh_worker"]
harness-lib-tooling-launch = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "tooling::launch::"]

# The texts.

[[plant]]
name = "own cf path: a member's command table says the word cf"
meant = "every_command_a_text_teaches_names_this_window_s_cf_by_its_full_path"
runs = ["engine-text-roles"]

[[plant.edit]]
file = "skill/core/staff.md"
find = '    {{cf}} ask "…"                    a question to the chief; then end your turn'
replace = '    cf ask "…"                    a question to the chief; then end your turn'

[[plant]]
name = "own cf path: a worker's closing line asks with the word cf"
meant = "every_command_a_text_teaches_names_this_window_s_cf_by_its_full_path"
runs = ["engine-text-roles"]

[[plant.edit]]
file = "skill/core/staff.md"
find = '''
the evidence, and anything left open. If you cannot go on without an answer,
ask with `{{cf}} ask "…"` and end your turn;'''
replace = '''
the evidence, and anything left open. If you cannot go on without an answer,
ask with `cf ask "…"` and end your turn;'''

[[plant]]
