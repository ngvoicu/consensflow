# Every command a window is taught names the window's own `cf` by its full path (T-1049; T-972's
# live kit found it on 2026-10-31: Devin 3000.11.228 on the Mac runs its commands through a login
# zsh whose PATH puts the user's `~/.local/bin` before the window's folder, and Claude Code 2.1.312
# on Windows through a login Git Bash that puts `~/bin` first; another program is also called `cf`,
# the Cloud Foundry CLI). No order of a PATH can matter to a full path, so:
#
# - the first word of a command is `cf::CfWord` (cf-proto): the window's path as its shell takes it
#   (`Roles::cf`, by harness and platform): as it is, one single-quoted word in a bash-like shell
#   where it holds a space or a shell character, `& '…'` in PowerShell (Codex on Windows);
# - the role texts (`skill/core/chief.md`, `skill/core/staff.md`) write `{{cf}}` where a command
#   starts, and `role_instructions` puts the word there, where a section at the end asked a window
#   to run it by its path when its own `cf` answered as another program;
# - every text typed into a window (`delivery_text`) starts the commands it teaches with the word:
#   the footers and the commands that read the rest are written with it, and what ConsensFlow
#   wrote of a message (the engine's and the ledger's own notes, `sender` none, which the board
#   shows with the word `cf`) has each command it names by the word `cf` started by it
#   (`CfWord::in_text`); what a participant wrote is never changed;
# - the hooks a launch writes (`cf hook claude`, `cf hook devin`, `cf hook devin-session`, `cf hook
#   muse-session`) are run by that path too (`shared::shell::cf_hook`);
# - every window is told its word (`CONSENSFLOW_CF`, `WindowEnv::with_cf`), and every `cf` it runs
#   (`Board::cf`) says its own hints and refusals with it: a question's refusal (`door::ask`), a
#   usage, a board's refusal, the notes of ConsensFlow's own in a thread or the inbox, the list's and
#   the step's hints, and the history, which the daemon makes with the word its `cf history` says
#   (`cf=`) and measures its pages with.
#
# The texts are held by `crates/cf-engine/tests/text/roles.rs` (every role, with and without specs,
# for a path, a path with a space and a path with a shell's characters, in each shell: no bare `cf`
# anywhere), `roles/member.rs`'s tests (the part of a role gets it too), the goldens of the texts,
# `tests/text/delivery_text.rs` and `handoff.rs` (every footer and note), the dispatcher's
# `window_cf.rs` and `cf-proto`'s `cf_word`; the hooks by the harness tests of each (`claude`'s
# launch, `devin::install`, `muse::launch`, `tooling::launch`) and `shared::shell`; the first word
# of each harness and platform by the daemon's `seams` tests. `cargo xtask live own-cf` shows it on
# the real harnesses.
#
# Not planted: the word of `why_it_failed`'s pastes (`deliveries.rs`), which no test of the
# dispatcher can tell from the bare word without a failed turn that carries a note of
# ConsensFlow's, and the word `cf hook` prints (`main.rs`, from the program's own path).
#
# Every name holds `own cf path`, so `npm run plants:daemon -- "own cf path"` runs them all.

[run]
engine-text-roles = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text", "roles::", "--", "--skip", "goldens_roles"]
engine-text-goldens-roles = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text", "goldens_roles"]
engine-text-delivery = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text", "delivery_text::"]
engine-text-handoff = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text", "handoff::"]
engine-lib-roles = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "roles::"]
engine-dispatcher-window-cf = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "window_cf::"]
proto-lib-cf-word = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "cf_word::"]
proto-lib-agents = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "agents::"]
board-lib = ["cargo", "test", "--offline", "-p", "cf-board", "--lib", "tests::"]
daemon-lib-routes-history = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "routes::history"]
daemon-lib-seams = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "seams::"]
harness-lib-shell = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::shell::"]
harness-lib-devin-install = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "devin::install::"]
harness-lib-muse-launch = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "muse::launch::"]
harness-launch-claude = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "claude::launches_a_fresh_worker"]
harness-lib-tooling-launch = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "tooling::launch::"]
live-own-cf = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_own_cf"]

