# BKV-02: the ledger protects backup links and Vacation independently of the picker.
# Every name contains `bkv ledger`, so one turn runs this table.

[run]
bkv-ledger = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "backup_vacation"]

[[plant]]
name = "bkv ledger: inserting a backup skips link validation"
meant = "a_backup_insert_cannot_link_across_projects_or_to_a_chief"
runs = [["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "backup_vacation", "a_backup_insert_cannot_link_across_projects_or_to_a_chief"]]
[[plant.edit]]
file = "crates/cf-ledger/migrations/0038.sql"
find = '''CREATE TRIGGER participant_backup_insert BEFORE INSERT ON participant
WHEN NEW.backup_of IS NOT NULL AND NEW.left_at IS NULL'''
replace = '''CREATE TRIGGER participant_backup_insert BEFORE INSERT ON participant
WHEN NEW.backup_of IS NOT NULL AND NEW.left_at IS NULL AND 0'''

[[plant]]
name = "bkv ledger: a member can have two live backups"
meant = "a_live_member_cannot_have_two_live_backups"
runs = [["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "backup_vacation", "a_live_member_cannot_have_two_live_backups"]]
[[plant.edit]]
file = "crates/cf-ledger/migrations/0038.sql"
find = "CREATE UNIQUE INDEX participant_one_live_backup"
replace = "CREATE INDEX participant_one_live_backup"

[[plant]]
name = "bkv ledger: a backup can cross projects"
meant = "a_backup_must_belong_to_the_same_project_as_a_live_member"
runs = [["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "backup_vacation", "a_backup_must_belong_to_the_same_project_as_a_live_member"]]
[[plant.edit]]
file = "crates/cf-ledger/migrations/0038.sql"
find = '''CREATE TRIGGER participant_backup_update
BEFORE UPDATE OF backup_of, left_at, member_id, role, project_id ON participant
WHEN NEW.backup_of IS NOT NULL AND NEW.left_at IS NULL
BEGIN
  SELECT CASE WHEN NEW.member_id IS NOT NULL OR NEW.role IN ('human', 'chief')
    OR NEW.id = NEW.backup_of
    OR NOT EXISTS (
      SELECT 1 FROM participant owner WHERE owner.id = NEW.backup_of
        AND owner.project_id = NEW.project_id AND owner.member_id IS NULL'''
replace = '''CREATE TRIGGER participant_backup_update
BEFORE UPDATE OF backup_of, left_at, member_id, role, project_id ON participant
WHEN NEW.backup_of IS NOT NULL AND NEW.left_at IS NULL
BEGIN
  SELECT CASE WHEN NEW.member_id IS NOT NULL OR NEW.role IN ('human', 'chief')
    OR NEW.id = NEW.backup_of
    OR NOT EXISTS (
      SELECT 1 FROM participant owner WHERE owner.id = NEW.backup_of
        AND owner.member_id IS NULL'''

