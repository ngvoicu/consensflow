# BKV-02: the ledger protects backup links and Vacation independently of the picker.
# BKV-03: the scheduler gives a task to a backup only when no member is free, and a member on
# Vacation takes none (`crates/cf-engine/src/scheduler.rs`, `taker`, `not_free`;
# `dispatcher.rs`, `send_on_vacation`, `remove_member`). The engine's cases are
# `crates/cf-engine/tests/dispatcher/backups.rs` and `vacation.rs`.
# Every name contains `bkv ledger` or `bkv engine`, so one turn runs this table.

[run]
bkv-ledger = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "backup_vacation"]
bkv-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "backups::"]
bkv-vacation = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "vacation::"]
bkv-plain-run = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "plain_run::"]

