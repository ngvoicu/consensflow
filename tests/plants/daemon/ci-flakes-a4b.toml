# The CI flakes of alpha.4's A4-16, part 2 (T-1332): tests that raced a real-time bound against a
# thread's wake-up now wait for the event each means (the decision `a-test-waits-on-an-event-never-on-a-time`
# of consensflow-sme), and each is held by a plant of the bug it is there for:
#
# - a write into a pane whose program reads nothing blocks for good, and neither another pane's
#   write nor the kill of that pane waits for it (`crates/cf-panes/src/pty.rs`, `blocked_write_…`:
#   "blocked write unblocked after kill: Timeout" at a load of 15 to 25, T-971);
# - the API front's tests of a handler, a client that leaves and a close (`crates/cf-daemon/src/api/server/tests.rs`:
#   "Connection reset by peer" at a load of 48 and more, T-968, T-992) wait for the handler's word that it
#   has its request, and for its being told;
# - a request given up ends its connection (`screens/network/tests.rs`, T-1020): given up once the server
#   has read its head;
# - the stand-in's agents, absorbed notification and `CLAUDE-HELD` line that the T-678 case rests on
#   (`crates/cf-e2e/src/bin/fake_agent/`);
# - part 3 (T-1343): a run of the stand-in's status line says how long it lived, so that the cases of
#   the status line in a group of its own judge what the host named by the host's rule and not by a
#   loaded machine's speed (`regressions/claude_status_line_taken_for_background_work.rs`, held
#   by `background.toml`'s plants); and the waiting-notes case asks the daemon's pause event and
#   not the task's state, which the chief's own answer changes a pass later
#   (`crates/cf-e2e/tests/rig/waiting_notes.rs`).
#
# The reply tests (`…reply_goes_past…`) are held by `paste-enter.toml`'s plants; the approval case by
# `approval.toml`'s; the T-678 case by `turn-end-min.toml`'s.
#
# Every name holds `ci flakes a4b`, so `cargo xtask plants daemon "ci flakes a4b"` runs them all.

[run]
a4b-blocked-write = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "pty::tests::blocked_write_does_not_stall_other_panes_or_kill"]
a4b-api-server = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "api::server::tests::"]
a4b-network = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "screens::network::tests::a_request_given_up_ends_its_connection"]
a4b-agents = ["cargo", "test", "--offline", "-p", "cf-e2e", "--bin", "fake-agent", "agents::"]
a4b-steps = ["cargo", "test", "--offline", "-p", "cf-e2e", "--bin", "fake-agent", "steps::"]
a4b-status-line = ["cargo", "test", "--offline", "-p", "cf-e2e", "--bin", "fake-agent", "status_line::"]
a4b-rig-waiting = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "waiting_notes::a_chief_given_the_note_that_a_task_is_held"]

[[plant]]
name = "ci flakes a4b: the kill of a pane waits for the write its blocked program left in hand"
meant = "blocked_write_does_not_stall_other_panes_or_kill"
platforms = ["macos"]
runs = ["a4b-blocked-write"]

[[plant.edit]]
file = "crates/cf-panes/src/pty.rs"
find = '''    if pane.active_writes.load(Ordering::Acquire) == 0 {
        let result = terminate(&mut pane, grace);'''
replace = '''    while pane.active_writes.load(Ordering::Acquire) != 0 {
        std::thread::sleep(Duration::from_millis(1));
    }
    if pane.active_writes.load(Ordering::Acquire) == 0 {
        let result = terminate(&mut pane, grace);'''

[[plant]]
