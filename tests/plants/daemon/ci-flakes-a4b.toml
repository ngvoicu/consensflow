[[plant.edit]]
file = "crates/cf-daemon/src/api/server.rs"
find = '''        let outcome = contain(async {
            let request = Request::from_hyper(request)?.consumed_by(consumer);
            (state.handler)(request).await
        })
        .await;'''
replace = '''        let watching = consumer.clone();
        let outcome = contain(async {
            let request = Request::from_hyper(request)?.consumed_by(consumer);
            tokio::select! {
                answered = (state.handler)(request) => answered,
                () = watching.left() => Ok(Answer::ok(serde_json::Value::Null)),
            }
        })
        .await;'''

