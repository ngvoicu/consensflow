# Mutations of the shared test rig and harness, caught by their own tests.
[run]
e2e-lib-left = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "rig::left::"]
e2e-lib-machine = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "a_harness_whose_version_leaves_a_process_holding_its_output_says_it_and_holds_nothing"]
e2e-lib-process = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "process::"]
e2e-lib-process-shell = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "process::tests::shell::"]
e2e-lib-report = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "rig::report"]
e2e-lib-route = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "rig::route"]
fake-agent-compact = ["cargo", "test", "--offline", "-p", "cf-e2e", "--features", "test-support", "--bin", "fake-agent", "a_compaction"]
fake-agent-records = ["cargo", "test", "--offline", "-p", "cf-e2e", "--features", "test-support", "--bin", "fake-agent", "records::tests::"]
fake-agent-reply = ["cargo", "test", "--offline", "-p", "cf-e2e", "--features", "test-support", "--bin", "fake-agent", "reply::"]
fake-devin-store = ["cargo", "test", "--offline", "-p", "cf-e2e", "--features", "test-support", "--bin", "fake-devin", "store::"]
harness-claude-projection = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record::tests::projection"]
rig-printed-output = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "printed_output::"]
rig-stranger = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "stranger::"]

[[plant]]
name = "rig: a version command that leaves a process holding its output holds the run's setup for as long as that process lives"
meant = "a_program_that_leaves_a_process_holding_its_output_is_read_a_while_and_says_so"
runs = ["e2e-lib-process"]

[[plant.edit]]
file = "crates/cf-e2e/src/process.rs"
find = "    while !thread.is_finished() && Instant::now() < by {"
replace = "    while !thread.is_finished() {"

[[plant]]
name = "rig: a harness whose version left its output held says nothing of it"
meant = "a_harness_whose_version_leaves_a_process_holding_its_output_says_it_and_holds_nothing"
runs = ["e2e-lib-machine"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/machine.rs"
find = "        if ran.is_some_and(|ran| ran.held) {"
replace = "        if ran.is_some_and(|ran| ran.held && false) {"

[[plant]]
name = "rig: the rig's stranger, its own child, is left running when the rig is dropped"
