# The notes a chief is handed after a cancel (the owner's report of 2026-10-13, ConsensFlow 3.0.3:
# a Devin chief on Windows read each of two notes twice, m-186, m-186, m-187, m-187). The case is
# `crates/cf-e2e/tests/regressions/devin_notes_twice.rs`: the real daemon and pane host on a stand-in
# Devin that takes a model's time to its first word and runs a message it is handed in a turn when
# the turn ends, with the human's prompt and a cancel in its first seconds; the engine's own tests of
# the rule, `crates/cf-engine/tests/dispatcher/slow_records.rs`; and the Devin adapter's, in
# `crates/cf-harness/src/devin/` (`wire_log/tests/prompts.rs`, `adapter/tests.rs`). Three rules stand
# against a second paste of a message the window has:
#
# - the engine counts the arrival window in the time the window is at rest, its turns no part of it,
#   and a harness that says at the hand-over that its own queue holds the message (OpenCode, Pi) is
#   waited for as one that queued it itself is;
# - Devin's window reads busy from the prompt its TUI puts to its agent, before the agent's first
#   word, for a gap and no longer, until the turn ends or the request is answered;
# - Devin holds a message in the turn of the prompt its TUI puts to its agent with the words pasted,
#   the first line of what was pasted beginning them, for as long as that prompt is asked (the reviews
#   of 2026-10-16: a request that held the line anywhere was Devin's word for good that its queue had
#   the message, and the human's words that quoted the header of a paste Devin dropped gave it).
#
# The one more Enter a paste is given (`deliveries`) stays what it was: once, in the first arrival
# window only, however long the record is waited for after it.
#
# The case builds the native `cf` from the sources as they are planted, so the plant of it says
# `builds`: the family builds the `cf` again once it is put back. One plant takes one rule out, or
# puts one wrong; a test fails (the plant of the case takes out the first two rules, the two that
# stand against a second paste in the case's shape).
#
# Every name holds `notes twice`, so `npm run plants:daemon -- "notes twice"` runs them all.

[run]
engine-slow-records = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "slow_records"]
harness-devin = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "devin::"]
engine-deliveries = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "deliveries::"]
rig-regression-devin-notes = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "devin_notes_twice::"]

[[plant]]
name = "notes twice: the window reads at rest in the first seconds of a turn and a paste is tried again at the arrival window, its turns or none, and the chief reads the second note twice"
meant = "two_notes_that_come_together_after_a_cancel_go_into_a_devin_chief_s_window_once_each"
runs = ["rig-regression-devin-notes"]
builds = true

[[plant.edit]]
file = "crates/cf-harness/src/devin/adapter.rs"
find = "                observed.settled = false;"
replace = ""

[[plant.edit]]
file = "crates/cf-engine/src/arrival.rs"
find = "        } = self.rested(record, observed, self.held(record));"
replace = '''
        } = Rest {
            rested: waited,
            turned: false,
            ..self.rested(record, observed, self.held(record))
        };'''

# Devin's store says it took a paste from its Enter on (3000.11.92, and the stand-in that
# plays it), which keeps the note once whatever this rule does: it is taken out too (T-107).
[[plant.edit]]
file = "crates/cf-harness/src/devin/history.rs"
find = "                let took = seen.took || (pasted.is_some() && self.seen.get().took);"
replace = "                let took = false;"

[[plant]]
name = "notes twice: the engine counts the arrival window from the hand-over, its turns or none"
meant = "waits_for_the_record_of_a_message_while_its_window_is_in_a_turn_and_pastes_it_once"
runs = ["engine-slow-records"]

[[plant.edit]]
file = "crates/cf-engine/src/arrival.rs"
find = "        } = self.rested(record, observed, self.held(record));"
replace = '''
        } = Rest {
            rested: waited,
            turned: false,
            ..self.rested(record, observed, self.held(record))
        };'''

[[plant]]
