# A file dropped on a terminal window (the owner's request of 2026-10-15, ConsensFlow 3.0.5): in a
# terminal, a file dropped on Claude Code, OpenCode or another harness types its path, and Claude
# Code attaches an image from it; the dock's windows did nothing, for Tauri catches a drop over the
# whole window and nothing in the page heard it. Now the page listens for the drag as Tauri says it
# (`tauri://drag-enter`, `-over` and `-leave`) and for the drop as the app says it (`file-drop`:
# Tauri's own, with the number the app keeps it by), which `core:default` lets it hear, and the
# rules stand, each held by a test:
#
# - a drop types the paths of its files into the running window under the pointer when it is
#   dropped, as a paste: xterm's own `paste`, so between the markers the program asked for and on
#   the path any paste takes; each path is one word of the system's shell, a space between the paths
#   and none after the last (`app/ui/core/file-drop.js`, Node's own tests in
#   `tests/file-drop.test.mjs`, which bash and zsh read back): on a Mac a backslash before a space
#   and every character a shell reads, on Windows double quotes round a path with a space;
# - a name that holds a control character (U+0000 to U+001F, DEL; a Mac's may hold a line break or
#   a tab) types nothing on either system, for no window takes one as part of a path, and the status
#   line names the file, its control characters shown by their pictures (the lead's call, 2026-10-16:
#   `$'…'` is a shell's, and the windows are no shells);
# - a path is never typed changed: a window that reads key presses through Windows' console (Devin,
#   Codex) gets a path its console would change by its short name (8.3), which the app looks up only
#   for the paths of a drop it heard itself on its window, `main`, which the page names by its
#   number (the app keeps the last 16, so a drop waiting for its lookup keeps its paths while others
#   come), a bounded batch at a time, one lookup at a time, refusing what is no whole path to a file
#   (`app/src-tauri/src/file_drop.rs`), the app built for it by the one function its tests build
#   too (`with_page`, lib.rs), so a drop the app's builder routes nowhere fails them; a lookup is
#   the turn of the task that reads Windows, given back when that task ends whoever waits for it,
#   and one asked meanwhile is answered busy, which the page asks again (every 250 ms, a minute at
#   most: a page reloaded while Windows read a far share leaves such a task); where there is none
#   it takes, nothing is typed and the status line names the characters and says why, in the app's
#   words; what the human types or pastes there still goes in the console's ASCII;
# - where the drop is, Tauri says in the pointer's own units, and the page's pixels are not the
#   same: Windows' in device pixels, which the display's scale divides, a Mac's in points, which are
#   the page's already (wry's sources say so; the first thing to look at by hand is a drop on the
#   right-hand one of two windows on a Retina Mac);
# - a drop anywhere but on a running window types nothing: the board, the projects, a dialog (the
#   window behind it is found by what is drawn at the place, not by boxes), a closed project's dock
#   (another project's windows live on off screen); where it was meant for a window the status line
#   says why: the chief's card while its window is down, the place of a window that ended under
#   the file, until the drag ends, or a window that closed while its short names were read;
# - drops are typed in the order they came, one waiting for the short names of the one before;
# - while files are dragged over a running window it shows that a drop goes there (a ring and a tint
#   in the app's seafoam), one window at a time, and the mark goes with the leave and with the drop
#   (no leave comes before a drop); a drag that carries no file marks nothing and types nothing;
# - the window dropped on has the keyboard after it, and on Windows the app's window comes in front
#   (`focus_after_drop`, the app's, once for each drop and only while the window in front is still
#   the one the file came from; no permission of the page's): unless the human acted after the drop
#   (a click, a key, the app's window left or come back to), when the paths still go to the window
#   they were dropped on, and nothing takes the keyboard or comes in front;
# - the page hears each of its events with one listener: Tauri keeps every one it is given.
#
# One plant takes one rule out; a test of it fails. The unit plants run Node's own tests, the page's
# the browser's (`file drop` in `app/tests/core-page.spec.mjs`, on real terminals; the xterm they
# stand on is the tracked `app/ui/vendor`, so no plant bundles it), the app's the tests of the drop
# module on this system. Its Windows-only lookups (`GetShortPathNameW`, the long form, the error
# words) are held by the tests that run on Windows alone. Every name holds `file drop`, so
# `npm run plants:daemon -- "file drop"` runs them all.

[run]
# The words a drop types, what a key-reading window takes, where the drop is, what the page may do.
quoting = ["node", "--test", "tests/file-drop.test.mjs"]
# The events, the window under the pointer, the mark and the paste, in the browser Playwright keeps.
page-drop = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "file drop"]
# How many listeners each of the app's events has.
page-listeners = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "one listener"]
# The app's drop module: what it hears, what it looks up and for whom, and when it comes in front.
app-test-file-drop = ["cargo", "xtask", "app", "test", "file_drop"]

