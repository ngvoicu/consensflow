# The staff as slots (`architecture/staff-slots.md`, section 7): the twelve plants of the build, and
# one for each of the review's four amendments (T-1897) and each of main's faults the build mends
# (a purpose accepted at any tier, Edit member leaving a backup's windows at the old tier, an image
# designer's backup read as a worker). A plant puts back the behaviour of main, or takes the fix
# out, and a test of the staff as slots fails for it. Every name holds `staff slots`, so
# `cargo xtask plants daemon "staff slots"` runs them all.

[run]
ss-ledger-slots = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "slots"]
ss-ledger-roles = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "roles::"]
ss-ledger-update = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "update_to_slots"]
ss-ledger-messages = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "update_keeps_messages"]
ss-ledger-briefs = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "brief_before_slots"]
ss-engine-tier = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "tier_fallback::"]
ss-engine-router = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "slot_router::"]
ss-engine-text = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text"]
ss-daemon-routes-tasks = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "routes::tasks"]
ss-daemon-members = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::members"]

