# Questions of a window that no longer has a task cannot take an answer.

[[plant]]
name = "t1780 engine: a release leaves the old questions live"
meant = "moved_question_after_human_reassign_says_the_task_is_open_and_refuses_the_answer"
runs = [["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "moved_question_after"]]
[[plant.edit]]
file = "crates/cf-ledger/src/messages/carrying.rs"
find = '''               AND NOT {}",
            super::has_standing_answer("message")'''
replace = '''               AND 0 AND NOT {}",
            super::has_standing_answer("message")'''

[[plant]]
name = "t1780 engine: an answer to a moved question is not refused"
meant = "moved_question_after_backup_takes_the_task_names_the_backup_and_refuses_the_answer"
runs = [["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "moved_question_after"]]
[[plant.edit]]
file = "crates/cf-ledger/src/messages.rs"
find = 'if question.reason.as_deref() == Some(MOVED_QUESTION) {'
replace = 'if false && question.reason.as_deref() == Some(MOVED_QUESTION) {'

[[plant]]
name = "t1780 ledger: an older release leaves a delivered question live"
meant = "an_older_ledger_retires_a_delivered_question_left_behind_by_a_release"
runs = [["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "an_older_ledger_retires_a_delivered_question_left_behind_by_a_release"]]
[[plant.edit]]
file = "crates/cf-ledger/src/ledger.rs"
find = '    retire_old_moved_questions(&mut store)?;'
replace = '    // The older moved questions are left as they were.'

[[plant]]
name = "t1780 ledger: an accepted task still asks its old question"
meant = "accepting_a_result_withdraws_the_unseen_question_before_the_chief_gets_it"
runs = [["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "accepting_a_result_withdraws_the_unseen_question_before_the_chief_gets_it"]]
[[plant.edit]]
file = "crates/cf-ledger/src/tasks/finishing.rs"
find = '    withdraw_open_questions(store, task, "was accepted")?;'
replace = '    // The question stays queued.'

[[plant]]
name = "t1780 ledger: cancelling leaves the delivered question live"
meant = "cancelling_with_a_delivered_question_closes_its_door_and_withdraws_it"
runs = [["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "cancelling_with_a_delivered_question_closes_its_door_and_withdraws_it"]]
[[plant.edit]]
file = "crates/cf-ledger/src/tasks/finishing.rs"
find = '    withdraw_open_questions(store, &task, "was cancelled")?;'
replace = '    // The delivered question stays live.'

[[plant]]
name = "t1780 ledger: cancelling leaves the questions door waiting"
meant = "cancelling_with_a_delivered_question_closes_its_door_and_withdraws_it"
runs = [["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "cancelling_with_a_delivered_question_closes_its_door_and_withdraws_it"]]
[[plant.edit]]
file = "crates/cf-ledger/src/tasks/finishing.rs"
find = '''    store.move_task(&task, "cancelled", json!({ "by": by }))?;
    if let Some(window) = task.assignee_id {
        shut_doors(store, &task, window)?;
    }
    release_ready(store, project_id)?;'''
replace = '''    store.move_task(&task, "cancelled", json!({ "by": by }))?;
    // Its door is left open.
    release_ready(store, project_id)?;'''

