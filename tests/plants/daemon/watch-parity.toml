# The long run's watch reads Claude Code's record with a reader of its own (`crates/cf-evals/src/long_run/record.rs`),
# which the product's reader leaves behind each time it learns a rule (T-695: a cancelled /compact, a TaskStop, a
# monitor, a notification's status), and which T-1069's two Windows long runs of alpha.1 failed on (a successful
# TaskStop ignored, a wrapped Claude prompt missed, a quoted opening counted as a second delivery, the compact
# checkpoint, A5's setup). Each plant is the watch's rule undone, and its test is the case that holds it: the
# parity test (`crates/cf-evals/tests/long_run/parity.rs`) reads the product's fixtures and the shapes made there
# through both readers after every line, the product's through the test binary `harness-ask`
# (`claude_prefixes`, `crates/cf-harness/src/tooling/prefixes.rs`).

[run]
watch-parity = ["cargo", "test", "--offline", "-p", "cf-evals", "--test", "long_run", "parity::"]
watch-long-run = ["cargo", "test", "--offline", "-p", "cf-evals", "--test", "long_run"]
watch-lib-long-run = ["cargo", "test", "--offline", "-p", "cf-evals", "--lib", "long_run"]

