# A meeting with the chief (3.0.7, `chief-meeting`, CMT-11 to CMT-17): while the human's
# meeting is on (the project's `meeting_at`, migration 0025), what is queued for the chief is
# held: it is not the head of the chief's queue, so nothing of it is typed in and no closed chief
# window opens for it, and the engine's hold and its ten-minute note never start for it; the
# chief's `cf` does not read it (`Waits`); the board lists it, a member's question first. What a
# launch owes the chief (a replacement of its role, a handoff, the note that its turn was cut)
# and the note a Switch chief asks with are not held; a member's queue goes on. No wake-up is
# queued during a meeting, and the calls count again from its end. The human's Start and Stop
# (the page's `project.meeting`) are logged once each, a closed project's refused; the Close and
# the daemon's start after a quit end it; the app forwards the page's Start and Stop, and each
# wakes the dispatcher. A task's thread and the chief's history say, in the place of a message
# the meeting (or a closed project) holds, that it waits, in one sentence with the refusal's and
# never a byte of its text (T-942). One plant takes one rule out; a test of it fails. The
# `meeting rig:` plants say `builds` and run the cases of the rig (a real daemon, the real pane
# host, a stand-in chief). Every name holds `meeting`.

[run]
# The ledger's tests of a meeting (`crates/cf-ledger/tests/meeting/`).
meeting-ledger = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "meeting"]
# The engine's cases (`tests/dispatcher/meeting.rs`).
meeting-kit = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "--", "meeting::"]
# The chief's reads through the agents' API.
meeting-api = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "api::routes::tests::meeting"]
# What a window of a closed project reads in a task's thread, and in the chief's history (T-942).
meeting-thread-closed = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "api::routes::task::tests::while_the_project_is_closed"]
meeting-history-closed = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "api::routes::history::tests::while_the_project_is_closed"]
# What `cf task get` prints of a thread, and what it says it received (T-942).
meeting-cf-thread = ["cargo", "test", "--offline", "-p", "cf", "--lib", "board::tests"]
# The page's operation, over the bridge.
meeting-page = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::meeting"]
# The names of the page's operations, which the app forwards, and which of them wake the dispatcher.
meeting-proto = ["cargo", "test", "--offline", "-p", "cf-proto", "--lib", "page::"]
# The page's button, its count, the chief's line and the held strips, in the browser Playwright
# keeps (each plant's `prepare` bundles the page's xterm first, as `npm run test:ui` does).
meeting-page-ui = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "meets the chief from its card|keeps the chief's head inside its card in a meeting"]
# The rig's cases.
meeting-rig-held = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "--", "meeting::a_meeting_started_on_the_page_holds_the_chiefs_messages_and_its_stop_lets_them_go_question_first"], builds = true }
meeting-rig-quit = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "--", "meeting::the_apps_quit_ends_a_meeting_and_what_it_held_goes_in_after_the_resume"], builds = true }

