# A launch's asks of the system (a macOS permission query, a read of Claude Code's configuration)
# never hold the daemon's thread, and the daemon waits for them no longer than a limit (T-2203:
# the owner's board stood still for 14 minutes while a launch waited). The calls are made on the
# worker of `MachineComputerUse` (crates/cf-daemon/src/computer_use.rs, `ask`), whose answer is
# waited for with a timeout. Round 2: the launch's plan finds the program, reads the project's
# folders and writes the launch's files on the plan's worker (crates/cf-harness/src/shared/
# off_thread.rs), waited for as long as it takes, and a launch the system gave no answer to says
# so in the log (crates/cf-engine/src/computer_use.rs, `went_on_without_the_note`).

[run]
lf-late = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "a_launch_whose_plan_was_late", "--", "--test-threads=2"]
lf-nowait = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "a_line_said_while_the_log_is_held"]
lf-drop = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "lines_the_writer_is_too_far_behind"]
lf-page = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "a_check_the_system_did_not_answer"]
lf-plan = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "plan_off_thread", "--", "--test-threads=1"]
lf-folder = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "plan_off_thread::a_plan_that_waits_on_a_folder"]
lf-whole = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "plan_off_thread::a_launch_file_is_in_place_only"]
lf-log = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "a_launch_the_system_gave_no_answer", "--", "--test-threads=2"]
lf-query = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "computer_use::off_thread::a_permission_query_that_waits"]
lf-config = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "computer_use::off_thread::a_read_of_claude_codes"]
lf-never = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "computer_use::off_thread::a_permission_query_that_never_ends"]

[[plant]]
name = 'launch-freeze: the permission query is made on the daemon thread again'
meant = "a_permission_query_that_waits_leaves_the_thread_going_and_is_answered_when_it_ends"
runs = ["lf-query"]

[[plant.edit]]
file = "crates/cf-daemon/src/computer_use.rs"
find = """        Box::pin(async move { self.ask(move |_| grants()).await })"""
replace = """        Box::pin(async move { Ok(grants()) })"""

[[plant]]
name = 'launch-freeze: Claude Code configuration is read on the daemon thread again'
meant = "a_read_of_claude_codes_configuration_that_waits_leaves_the_thread_going"
runs = ["lf-config"]

[[plant.edit]]
file = "crates/cf-daemon/src/computer_use.rs"
find = """            self.ask(move |configuration| configuration.computer_use(&env, &asked))
                .await
        })"""
replace = """            Ok(computer_use::Configuration::default().computer_use(&env, &asked))
        })"""

[[plant]]
name = 'launch-freeze: the wait for the system has no limit of its own'
meant = "a_permission_query_that_never_ends_is_given_up_and_the_thread_goes_on"
runs = ["lf-never"]

[[plant.edit]]
