# The host writes a window's calls in the order of their numbers, and by the epoch it gave the
# document (P4-B): a call of an epoch that is not the host's current one is never written; a call
# that comes early waits for the numbers before it, at most the bound, and a reload cancels what
# still waits in order; every loss the host knows of is a notice with an id, kept until the
# person dismisses that exact id, never edited (a change is a new notice), and the oldest past 64
# are folded into one row. A call is judged by the window, its generation, the page's epoch and
# its number. A reply has room of its own (P4-D).
[run]
pane-order = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::calls_that_come_out_of_order_reach_the_writer_in_number_order"]
pane-order-bound = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_number_that_never_comes_holds_what_is_behind_it_for_the_bound_only"]
pane-order-own-wait = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_later_arrival_does_not_stretch_an_earlier_calls_wait"]
pane-order-bounded = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::what_a_page_holds_behind_a_gap_is_bounded"]
pane-order-numbered = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_dismissal_clears_only_the_notice_of_its_id"]
pane-order-kept = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::typing_lost_with_no_page_current_is_told_at_the_next_activation"]
