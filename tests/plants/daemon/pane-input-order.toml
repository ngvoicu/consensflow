# The host writes a window's calls in the order of their numbers, and by the epoch it gave the
# document (P4-B): a call of an epoch that is not the host's current one is never written; a call
# that comes early waits for the numbers before it, at most the bound, and a reload cancels what
# still waits in order; every loss the host knows of is kept, by version, until the current page
# says it showed that version, and the losses past the bound are counted apart. A reply has room
# of its own (P4-D).
[run]
pane-order = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::calls_that_come_out_of_order_reach_the_writer_in_number_order"]
pane-order-bound = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_number_that_never_comes_holds_what_is_behind_it_for_the_bound_only"]
pane-order-own-wait = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_later_arrival_does_not_stretch_an_earlier_calls_wait"]
pane-order-bounded = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::what_a_page_holds_behind_a_gap_is_bounded"]
pane-order-numbered = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_notice_told_clears_only_the_losses_up_to_its_number"]
pane-order-kept = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::typing_lost_with_no_page_current_is_told_at_the_next_activation"]
pane-reply-room = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_reply_is_admitted_while_a_paste_is_pending"]
pane-full = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_full_window_refuses_the_next_key_once_and_goes_on"]
pane-hundred = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_hundred_large_calls_ahead_of_a_missing_one_are_refused_past_8_mib"]
epoch-r1 = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::boundary::r1_"]
epoch-r2 = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::boundary::r2_"]
epoch-r3 = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::boundary::r3_"]
epoch-r4 = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::boundary::r4_"]
epoch-r5 = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::boundary::r5_"]
epoch-r6 = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::boundary::r6_"]
epoch-r7 = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::boundary::r7_"]
epoch-r8 = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::boundary::r8_"]
epoch-r9 = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::boundary::r9_"]
epoch-r10 = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::boundary::r10_"]
epoch-r11 = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::boundary::r11_"]
epoch-r12 = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::boundary::r12_"]
epoch-gate = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "--workers=4", "-g", "R3: until the document is acknowledged"]
epoch-closed-row = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "--workers=4", "-g", "R7: a window that has closed"]
epoch-overflow-row = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "--workers=4", "-g", "R11: the losses past the host"]
epoch-skip-retry = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "--workers=4", "-g", "a skip the host cannot make final"]
epoch-f2 = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::boundary::f2_"]
epoch-f3 = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::boundary::f3_"]
epoch-f6 = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::boundary::f6_"]
epoch-seen = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "--workers=4", "-g", "confirmed only once a person can see it|only the rows in view"]
epoch-place = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "--workers=4", "-g", "keeps its place before a key typed after it"]

