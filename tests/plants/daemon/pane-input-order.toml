# The host writes a window's calls in the order of their numbers (P4-B): a call that
# comes early waits for the numbers before it, at most the bound; a page that has
# gone is heard for the bound, and the next page's calls for a window wait until
# its lane has closed; every loss the host knows of is kept, by number, until a
# page says it told the person, and the page confirms only a notice it showed.
# A reply has room of its own (P4-D).
[run]
pane-order = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::calls_that_come_out_of_order_reach_the_writer_in_number_order"]
pane-order-bound = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_number_that_never_comes_holds_what_is_behind_it_for_the_bound_only"]
pane-order-lane = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_departed_pages_calls_go_in_before_the_next_pages"]
pane-order-reload = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_second_reload_inside_the_first_keeps_every_pages_order"]
pane-order-lost = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_number_that_never_comes_from_a_departed_page_is_told_to_the_current_page"]
pane-order-gap = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_gap_given_up_before_the_renderer_recovers_is_told_when_it_does"]
pane-order-kept = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::typing_lost_with_no_page_current_is_told_at_the_next_activation"]
pane-order-numbered = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_notice_told_clears_only_the_losses_up_to_its_number"]
pane-order-refused = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_departed_pages_refusal_is_told_to_the_current_page"]
pane-order-transit = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_refusal_in_transit_at_navigation_is_told_to_the_next_page"]
pane-order-failed = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_write_that_failed_before_its_answer_was_fetched_is_told_to_the_next_page"]
pane-order-settle = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_write_that_fails_as_the_page_goes_is_told_to_the_next_page"]
pane-order-timeout-skip = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_departed_pages_timeout_skip_is_told_to_the_current_page"]
pane-order-own-wait = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_later_arrival_does_not_stretch_an_earlier_calls_wait"]
pane-order-clock = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_call_that_waits_for_the_lock_past_the_bound_is_refused"]
pane-order-skip = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_departed_pages_skip_leaves_the_current_pages_ticket"]
pane-order-bounded = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::what_a_page_holds_behind_a_gap_is_bounded"]
pane-order-retire = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_departed_pages_waiting_call_refused_at_retirement_is_told"]
pane-order-shown = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "--workers=4", "-g", "the page confirms only a notice it showed"]
pane-reply-room = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_reply_is_admitted_while_a_paste_is_pending"]
pane-full = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_full_window_refuses_the_next_key_once_and_goes_on"]
pane-hundred = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "input_queue::tests::a_hundred_large_calls_ahead_of_a_missing_one_are_refused_past_8_mib"]

