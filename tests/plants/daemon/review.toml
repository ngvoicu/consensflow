[[plant]]
name = "review: cf says it wrote answers whole of an output a harness may cut"
meant = "a_thread_a_harness_may_cut_says_nothing_of_the_answers_in_it_and_they_come_as_text"
runs = ["cf-lib-board"]

[[plant.edit]]
file = "crates/cf/src/board/cut.rs"
find = '''    printed.len() < SEEN_WHOLE_BYTES && printed.matches('\n').count() < SEEN_WHOLE_LINES'''
replace = "    !printed.is_empty() || printed.is_empty()"

[[plant]]
name = "review: cf counts the characters of an output, not its bytes, against what a harness shows"
meant = "what_is_counted_is_bytes_so_that_characters_of_more_than_one_are_not_missed"
runs = ["cf-lib-board"]

[[plant.edit]]
file = "crates/cf/src/board/cut.rs"
find = '''    printed.len() < SEEN_WHOLE_BYTES && printed.matches('\n').count() < SEEN_WHOLE_LINES'''
replace = '''    printed.chars().count() < SEEN_WHOLE_BYTES && printed.matches('\n').count() < SEEN_WHOLE_LINES'''

[[plant]]
name = "review: cf does not count the lines of an output against what a harness shows"
meant = "what_is_measured_is_what_was_printed_so_lines_count_in_the_text_and_not_in_the_json"
runs = ["cf-lib-board"]

[[plant.edit]]
file = "crates/cf/src/board/cut.rs"
find = '''    printed.len() < SEEN_WHOLE_BYTES && printed.matches('\n').count() < SEEN_WHOLE_LINES'''
replace = "    printed.len() < SEEN_WHOLE_BYTES"

[[plant]]
name = "review: cf measures the text of a command even when it printed its JSON"
meant = "what_is_measured_is_what_was_printed_so_lines_count_in_the_text_and_not_in_the_json"
runs = ["cf-lib-board"]

[[plant.edit]]
file = "crates/cf/src/board/mod.rs"
find = '''
            let printed = if json {
                let data = cf_base::json::js_order(data);
                format!("{}\n", serde_json::to_string_pretty(&data)?)
            } else {
                format!("{text}\n")
            };'''
replace = '''
            let measured = format!("{text}\n");
            let printed = if json {
                let data = cf_base::json::js_order(data);
                format!("{}\n", serde_json::to_string_pretty(&data)?)
            } else {
                measured.clone()
            };'''

[[plant.edit]]
file = "crates/cf/src/board/mod.rs"
find = "wrote.filter(|_| cut::seen_whole(&printed))"
replace = "wrote.filter(|_| cut::seen_whole(&measured))"

