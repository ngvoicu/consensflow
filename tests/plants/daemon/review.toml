# Calliope's review of the merged fix round: the door's receipt is said again
# while the board cannot be reached, `cf` says nothing of the answers in an
# output a harness may cut, the one asked is told to answer again when an
# answer did not stand, a row Node was pasting is not stranded, and a task
# sent back to a busy session is told what it can do. One plant takes one fix
# out, and a test of it fails. A run written `{ node: [...] }` is `node --test`
# of those files.

[run]
# The one case of the fixture with no board: it sets the shell's variables itself, so a run of
# the plant that takes the fix out never reaches the board of the window it is run in.
opencode-no-board = ["node", "--test", "--test-reporter=tap", "--test-name-pattern=outside a window means no board", "tests/opencode-extension.test.mjs"]

[[plant]]
name = "review: a row Node was pasting on its own stays under the carrier it rode in when its delivery goes again"
meant = "a_row_node_was_pasting_on_its_own_under_a_carrier_that_is_over_goes_again_as_a_row_of_its_own"
runs = ["ledger-receipt"]

[[plant.edit]]
file = "crates/cf-ledger/src/messages/delivery.rs"
find = '''
        store.db.execute(
            "UPDATE message SET carried_by = NULL
             WHERE id = ?1
               AND carried_by IN (SELECT id FROM message WHERE state NOT IN ('queued', 'gated'))",
            [message_id],
        )?;
        adopt(store, message_id)?;'''
replace = "        adopt(store, message_id)?;"

[[plant]]
name = "review: a task sent back to a busy session is told it can be opened for its tier"
meant = "a_task_is_not_reopened_onto_a_session_that_has_another_and_is_told_what_a_reopen_can_do"
runs = ["ledger-receipt"]

[[plant.edit]]
file = "crates/cf-ledger/src/staff/sessions.rs"
find = '''
            Giving::SentBack(number) => {
                format!(" before sending T-{number} back, or open a new task for its tier")
            }'''
replace = '            Giving::SentBack(_) => ", or open the task for its tier".to_owned(),'

[[plant]]
name = "review: an answer that failed to arrive is not told to the one asked"
meant = "an_answer_whose_delivery_failed_for_a_question_withdrawn_at_the_gate_tells_the_chief_to_answer_it_again"
runs = ["ledger-receipt"]

[[plant.edit]]
file = "crates/cf-ledger/src/messages/delivery.rs"
find = '''
            if message.kind == "answer" {
                tell_failed_answer(store, &message, &task, reason)?;
