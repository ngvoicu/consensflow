# A tell refused for a task still queued (the field report of 2026-10-15, batch B, B3: the chief
# told a task before its worker's window was up, and the board answered "T-n has no window to tell:
# it is queued"). The words are kept for the window now (`crates/cf-ledger/src/messages/told.rs`):
# they ride in the brief's paste while it waits, or go in as the window's next message once a launch
# has begun with the brief, and the window's answer is no result until it has had them; a cancel
# that comes first takes them, and whoever told them hears so. The case is
# `crates/cf-e2e/tests/regressions/tell_refused_for_a_queued_task.rs`; the ledger's tests are in
# `crates/cf-ledger/tests/receipt/queued_tells.rs`, the engine's in
# `crates/cf-engine/tests/dispatcher/queued_tells.rs`.
#
# The first plant puts 3.0.5's refusal back; the next two take out what makes the words go in after
# a brief already on its way (the hold of the result, and the words as the window's latest message),
# each shown on the rig and in its own crate; one makes the words no row the window keeps, so they
# ride in no brief's paste; the rest take out what says the words went with a cancel (to the
# requester, to another teller, to the chief that cancels), what `cf` says of a kept tell, and the
# board's story of them. The rig's case builds the
# native `cf` from the sources as they are planted, so its plants say `builds`. Every name holds
# `tell queued`, so `npm run plants:daemon -- "tell queued"` runs them all.

[run]
rig-regression-tell-queued = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "tell_refused_for_a_queued_task::"]
engine-queued-tells = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "queued_tells"]
cf-tell = ["cargo", "test", "--offline", "-p", "cf", "--test", "tell"]
board-story = ["node", "--test", "--test-reporter=tap", "--test-name-pattern=told to a task", "tests/board-ui.test.mjs"]
ledger-told-edges = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "told_edges::"]
rig-stand-in-codex-workers = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "stand_in_codex::the_stand_in_codexs_plugin_server_leads"]

