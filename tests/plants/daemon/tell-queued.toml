# The flake found in the gate (2026-10-15): the case read a worker's process file as
# soon as it was there, which under load was before its process was in it. The plant
# writes the file in two steps and puts the case's old read back: it fails as it did.

[[plant]]
name = "tell queued: a worker's process file read as soon as it is there, written in two steps"
meant = "the_stand_in_codexs_plugin_server_leads_a_group_of_its_own_and_starts_its_workers_when_a_tool_is_called"
runs = ["rig-stand-in-codex-workers"]

[[plant.edit]]
file = "crates/cf-e2e/src/bin/fake_codex/servers.rs"
find = '''
    if let Err(failed) = fs::write(format!("{file}.pid"), std::process::id().to_string()) {
        return refuse(&failed.to_string());
    }
    thread::sleep(Duration::from_secs(seconds));'''
replace = '''
    let pid = format!("{file}.pid");
    let written = fs::write(&pid, "").and_then(|()| {
        thread::sleep(Duration::from_millis(500));
        fs::write(&pid, std::process::id().to_string())
    });
    if let Err(failed) = written {
        return refuse(&failed.to_string());
    }
    thread::sleep(Duration::from_secs(seconds));'''

[[plant.edit]]
file = "crates/cf-e2e/tests/rig/stand_in_codex.rs"
find = '''        let pid = until_pid(&worker(number)).ok_or(format!("worker {number} never ran"))?;'''
replace = '''        assert!(until_there(&beside(&worker(number), "pid")), "worker {number} runs");
        let pid: u32 = files::read_string(&beside(&worker(number), "pid"))?
            .trim()
            .parse()?;'''
