# The terminal command's plants (`crates/cf-launcher`), with those of what
# `crates/cf-harness` does with it (`prepare.toml`): each bug is one a test was
# written for, and the plant says which. They are the proof that those tests
# hold what they claim, and run with the rest: `npm run plants:daemon --
# launcher` (every name here begins with it; the harness's begin `stale` and
# `prepare`).
#
# What no plant can show is what only a system that is not this one reads: the
# `.cmd` run by cmd.exe (`crates/cf-launcher/tests/run.rs` runs it on Windows),
# and libuv's attribute test of a writable folder there (`places.rs`).

[run]
launcher-units = ["cargo", "test", "--offline", "-p", "cf-launcher", "--lib"]
launcher-goldens = ["cargo", "test", "--offline", "-p", "cf-launcher", "--test", "goldens"]
launcher-run = ["cargo", "test", "--offline", "-p", "cf-launcher", "--test", "run"]
launcher-repair = ["cargo", "test", "--offline", "-p", "cf-launcher", "--test", "repair"]
launcher-holds = ["cargo", "test", "--offline", "-p", "cf-launcher", "--test", "repair_holds"]
launcher-terminal = ["cargo", "test", "--offline", "-p", "cf-launcher", "--test", "terminal"]

[[plant]]
name = "launcher: a launcher for cmd ends its lines in LF"
meant = "the_launcher_for_cmd_ends_its_lines_in_cr_lf_and_forwards_the_arguments_with_percent_star"
runs = ["launcher-units", "launcher-goldens"]

[[plant.edit]]
file = "crates/cf-launcher/src/text.rs"
find = '{pin}\"{}\" %*\r\n",'
replace = '{pin}\"{}\" %*\n",'

[[plant]]
name = "launcher: a launcher for sh forwards no arguments"
