# The terminal's command on Windows is a program that reads a launch file, and never a `.cmd`
# (T-997): cmd.exe ends a command at the first line break of an argument, so a many-line
# `cf ask "…"` typed in PowerShell reached the board as its first line. The plants of the
# shells it was typed in are `tests/plants/cli/shells.toml`'s, which run on Windows alone.
# There is no plant of a launch file that names its own shim: the shim would start itself
# again and again, and the test that holds it (`a_launch_file_that_names_the_shim_itself_does_not_start_it_again`)
# has no way to fail but to start them.

