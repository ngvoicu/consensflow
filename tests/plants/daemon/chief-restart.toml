# A chief opened again after the app's restart is not left "starting" (zeewin's 2-hour
# live run of 2026-10-19: a Codex chief whose turn ended a second before the restart
# was opened again at rest on its thread, its broker never named the thread, and its
# lane read "starting" for the 78 minutes left while a worker's result waited for it).
# A Codex window opened on a thread waits for its broker to name it, for the minute a
# new window has (`crates/cf-harness/src/codex/adapter.rs`), and a launch whose window
# never comes up is given up whether or not it had a first message
# (`crates/cf-engine/src/windows.rs`): the chief's window is closed, the human told
# once, and the chief opened again at the backoff with what waits for it. The engine's
# tests are in `crates/cf-engine/tests/dispatcher/resume.rs`, the adapter's in
# `crates/cf-harness/tests/launch/codex/windows.rs`; the case of the regressions,
# `crates/cf-e2e/tests/regressions/a_codex_chief_opened_again_after_a_restart_read_starting_for_good.rs`,
# is the real daemon and pane host on a stand-in Codex that leaves a resume unanswered,
# and its run builds the native `cf` from the sources as they are planted.
#
# Every name holds `chief restart`, so `cargo xtask plants daemon "chief restart"` runs
# them all.

[run]
# The case of the regressions, found by its module's name.
rig-regression-chief-restart = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_codex_chief_opened_again_after_a_restart_read_starting_for_good::"], builds = true }
# The tests of a Codex window once it is open.
harness-launch-codex-windows = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "codex::windows"]

[[plant]]
name = "chief restart: a launch with no first message whose window never came up is left starting"
meant = "a_chief_opened_again_at_rest_whose_window_never_comes_up_is_closed_the_human_told_and_its_result_goes_in_with_the_next"
runs = ["engine-dispatcher"]

[[plant.edit]]
file = "crates/cf-engine/src/windows.rs"
find = "        if let Err(error) = &started {"
replace = "        if let (Err(error), true) = (&started, failing.is_some()) {"

[[plant]]
name = "chief restart: a launch with no first message whose window never came up is left starting, on the rig"
meant = "a_codex_chief_whose_window_does_not_come_up_after_a_restart_is_closed_the_human_told_and_its_result_goes_in_once_it_can"
runs = ["rig-regression-chief-restart"]
builds = true

[[plant.edit]]
file = "crates/cf-engine/src/windows.rs"
find = "        if let Err(error) = &started {"
replace = "        if let (Err(error), true) = (&started, failing.is_some()) {"

[[plant]]
name = "chief restart: a member's window that never came up is left open"
meant = "a_member_opened_again_at_rest_whose_window_never_comes_up_is_closed_and_said"
runs = ["engine-dispatcher"]

[[plant.edit]]
file = "crates/cf-engine/src/windows.rs"
find = "                        let _ = this.seams.host.kill(&pane).await;"
replace = "                        let _ = (&this, &pane);"

[[plant]]
name = "chief restart: a window whose exit came while it was waited for is given up again"
meant = "a_chief_window_that_exits_while_it_is_waited_for_to_come_up_is_given_up_no_more"
runs = ["engine-dispatcher"]

[[plant.edit]]
file = "crates/cf-engine/src/windows.rs"
find = "            if !first && record.window.borrow().pane.as_ref() != Some(&pane) {"
replace = "            if false {"

[[plant]]
name = "chief restart: a Codex window opened on a thread has nothing to learn from its broker"
meant = "a_window_opened_on_a_thread_is_up_once_its_broker_names_it_and_its_launch_fails_if_it_never_does"
runs = ["harness-launch-codex-windows"]

[[plant.edit]]
file = "crates/cf-harness/src/codex/adapter.rs"
find = "            if self.named.get() {"
replace = "            if self.named.get() || self.thread.borrow().is_some() {"

[[plant]]
name = "chief restart: a Codex window opened on a thread has nothing to learn from its broker, on the rig"
meant = "a_codex_chief_whose_window_does_not_come_up_after_a_restart_is_closed_the_human_told_and_its_result_goes_in_once_it_can"
runs = ["rig-regression-chief-restart"]
builds = true

[[plant.edit]]
file = "crates/cf-harness/src/codex/adapter.rs"
find = "            if self.named.get() {"
replace = "            if self.named.get() || self.thread.borrow().is_some() {"
