# A chief opened again after the app's restart is not left "starting" (zeewin's 2-hour
# live run of 2026-10-19: a Codex chief whose turn ended a second before the restart
# was opened again at rest on its thread, its broker never named the thread, and its
# lane read "starting" for the 78 minutes left while a worker's result waited for it).
# A Codex window opened on a thread waits for its broker to name it, asking at the
# deadline too, for the minute a new window has the first time and twice as long for
# each window given up before it in a row, to ten minutes
# (`crates/cf-harness/src/codex/adapter.rs`). A launch whose window never comes up is
# given up whether or not it had a first message, once its harness was asked again right
# before the close (`crates/cf-engine/src/windows.rs`, `unstarted.rs`): the chief's
# window is closed, the human told once, a first message its record shows confirmed, and
# the chief opened again at the backoff whatever waits for it, told its turn was cut where
# its record holds one (`dispatcher.rs`); one whose exit came meanwhile is not given up
# again. The engine's tests are in
# `crates/cf-engine/tests/dispatcher/resume.rs`, the adapter's in
# `crates/cf-harness/tests/launch/codex/windows.rs`; the cases of the regressions,
# `crates/cf-e2e/tests/regressions/a_codex_chief_opened_again_after_a_restart_read_starting_for_good.rs`,
# are the real daemon and pane host on a stand-in Codex that leaves a resume unanswered
# or answers it late, and their run builds the native `cf` from the sources as they are
# planted.
#
# Every name holds `chief restart`, so `cargo xtask plants daemon "chief restart"` runs
# them all.

[run]
# The cases of the regressions, found by their module's name.
rig-regression-chief-restart = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_codex_chief_opened_again_after_a_restart_read_starting_for_good::"], builds = true }
# The tests of a Codex window once it is open.
harness-launch-codex-windows = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "codex::windows"]

[[plant]]
name = "chief restart: a launch with no first message whose window never came up is left starting"
meant = "a_chief_opened_again_at_rest_whose_window_never_comes_up_is_closed_the_human_told_and_its_result_goes_in_with_the_next"
runs = ["engine-dispatcher"]

