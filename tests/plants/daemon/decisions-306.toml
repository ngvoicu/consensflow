# The owner's decisions of 2026-10-16 on the field report of 2026-10-15, for 3.0.6:
#
# - B4, the chief's own step (`cf task add --self`): `cf task done` takes it queued or at work,
#   withdraws a brief not yet given, and accepts it with the words, so what needs it goes on
#   (`crates/cf-ledger/src/tasks/own_steps.rs`; tests `crates/cf-ledger/tests/receipt/self_steps.rs`,
#   `crates/cf/tests/own_step.rs`);
# - B6, a brief a shell cut: `--file <path>` on `cf task add`, `reopen`, `resume` and `tell`, and the
#   reply's line of how many characters went and how they end (`crates/cf/src/board/brief.rs`;
#   tests `crates/cf/tests/brief_from_a_file.rs`, `brief_from_stdin.rs`, the brief's own);
# - B7, the transcript's depth: `--page` and `--find` (`crates/cf-daemon/src/api/routes/task/pages.rs`,
#   `crates/cf/src/board/transcript.rs`; tests `routes::task::tests::depth`,
#   `crates/cf/tests/transcript_pages.rs`, the transcript's own).
#
# Each plant takes one of them out again. The names begin with `own steps`, `briefs` or
# `transcript pages`, so `npm run plants:daemon -- "own steps" briefs "transcript pages"` runs them.

[run]
ledger-self-steps = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "self_steps::"]
cf-own-step = ["cargo", "test", "--offline", "-p", "cf", "--test", "own_step"]
cf-brief-file = ["cargo", "test", "--offline", "-p", "cf", "--test", "brief_from_a_file"]
cf-brief-stdin = ["cargo", "test", "--offline", "-p", "cf", "--test", "brief_from_stdin"]
cf-brief-tell = ["cargo", "test", "--offline", "-p", "cf", "--test", "tell"]
cf-lib-brief = ["cargo", "test", "--offline", "-p", "cf", "--lib", "board::brief"]
cf-lib-transcript = ["cargo", "test", "--offline", "-p", "cf", "--lib", "board::transcript"]
cf-transcript-pages = ["cargo", "test", "--offline", "-p", "cf", "--test", "transcript_pages"]
cf-help-pages = ["cargo", "test", "--offline", "-p", "cf", "--test", "help"]
cf-board-goldens-306 = ["cargo", "test", "--offline", "-p", "cf", "--test", "board_goldens"]
engine-chief-text = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text", "goldens_roles"]
daemon-depth = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "routes::task::tests::depth"]

