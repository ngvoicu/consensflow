# Project settings, and a new project's (2026-10-15: the board's Staff button became Project
# settings, with Staff, Human approval, Wake-up calls and Specs as its sections; New project has
# the same four, built from the same code; the project's menu opens them for any project; a
# project's description shows whole in the list). The wake-up calls and the specs a new project
# says are carried by `project.open` and kept in the very write that makes the project, because
# the chief's first launch reads the specs of the project it is given, and a second call from
# the page could not beat it. A setting the ledger refuses refuses the whole start, in the words
# the Project settings dialog is refused in, before anything is written, and a write that fails
# after the project's row is made leaves no project. One plant takes one rule out; a test of it
# fails. The ledger's plants run its own tests (`crates/cf-ledger/tests/opened_with.rs`), the
# engine's the dispatcher's (`specs::` and `wake_ups::` of `tests/dispatcher`), the page's the
# operation's (`crates/cf-daemon/src/page/tests/opening.rs`) and the dialogs' the browser's
# (`Project settings`, `New project` and `project menu` in `app/tests/core-page.spec.mjs`; the
# page's xterm they stand on is the tracked `app/ui/vendor`, so no plant bundles it). The
# `project settings rig:` plants run the case of the rig that holds the chief's very first
# window to the specs (`crates/cf-e2e/tests/rig/specs.rs`), and say `builds`: the family builds
# the native `cf` again once each is put back. The settings of a closed project open as an open
# one's do (the owner's report, the same day: a start leaves every project closed until its
# Resume, and the specs reach the chief only as it starts); the daemon accepts each save of
# them and starts nothing for it, which the page's operations hold on the real dispatcher
# (`crates/cf-daemon/src/page/tests/suspended.rs`). Every name holds `project settings`, so
# `npm run plants:daemon -- "project settings"` runs them all.

[run]
# The ledger's tests of a project opened with its calls and specs said.
ledger-opened-with = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "opened_with"]
# The dispatcher's: the chief's first launch has the specs, and the calls wake it.
engine-specs = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "specs::"]
engine-opened-wake-up = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "wake_ups::a_project_opened"]
# The page's `project.open`, over the bridge, and the words New project starts the calls with.
daemon-opening-page = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::opening"]
daemon-wake-up-page = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::wake_up"]
# The page's saves of a closed project, over the bridge: accepted, and no window opened for them.
daemon-suspended = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::suspended"]
# The dialog and the menu, in the browser Playwright keeps, and New project's start.
page-project-settings = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "Project settings"]
# The same, with the closed project's board that stays read-only beside them.
page-closed-settings = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "Project settings|closed project"]
page-new-project = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "New project"]
# What the board says of a project with no members, which names where to add them.
page-board-empty = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "no members yet|board says it has none"]
# The case of the rig (a real daemon and pane host, a stand-in chief): the chief's very first window.
rig-specs-first = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "specs::a_project_opened_with_specs_on"]

