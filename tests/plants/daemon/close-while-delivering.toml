# A window closed while its brief was still on its way failed the task for good (T-1076; the issue
# `issues/a-close-while-a-brief-is-on-its-way-failed-devins-task.md` in consensflow-sme). The
# alpha.1 release check T-1068 closed a Devin worker's project 500 ms after its brief was on its
# way: Devin reads its brief from the file its command line names as its window opens
# (`FirstMessage::Opened`), and the window's exit gave back only a first message handed over once
# up (T-523's `owed` or `late`). The brief and its task failed, the chief and the human were told,
# and the Resume brought nothing back. 3.0.6-alpha.3 did the same: no release check ran Devin's.
#
# - A window that closed with its project fails nothing that was on its way to it: what its record
#   does not show it took goes back to its queue with its attempt, a launch's first message however
#   it went in, and any later message on its last attempt (`dispatcher.rs`'s exit).
# - What its record shows it took is confirmed, a member's launch's first message too, and the
#   Resume goes on in the same conversation without it (`in_flight.rs`'s `settle_gone`).
# - `cargo xtask live close-early` runs every harness where none is named.
# - Every live rig that seats Muse asks its allowance as it writes its launcher, and stops only on
#   a window or a week used up (100%; a run may use all of it, T-1123) before anything is spent
#   (`cf-e2e` `rig/install.rs`, `muse.rs`'s `guard_allowance`): close-early ran Muse at 99% of its
#   week, where only `live muse-window` asked.
#
# Every name holds `close while delivering`, so `npm run plants:daemon -- "close while delivering"`
# runs them all.

[run]
cwd-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "close_while_delivering::"]
cwd-live-default = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_close_early", "tests::the_workers_are_every_harness_unless_named"]
cwd-muse-rig = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "rig::install::tests::a_live_rig_that_seats_muse"]
cwd-muse-stop = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "muse::tests::a_live_run_stops_where_the_window_or_the_week_is_used_up"]

[[plant]]
name = "close while delivering: a brief read as its window opened fails at a Close, as only owed or late ones were given back (main's shape)"
meant = "a_brief_its_window_reads_as_it_opens_whose_project_closes_before_its_record_shows_it_goes_back_and_in_once_after_the_resume"
runs = ["cwd-engine"]

[[plant.edit]]
file = "crates/cf-engine/src/dispatcher.rs"
find = "                    if delivering.chief || closed_with_project {"
replace = "                    if delivering.chief || (closed_with_project && (!delivering.launch || delivering.owed.is_some() || delivering.late)) {"

[[plant]]
name = "close while delivering: a member's launch brief closed with its project is given back unread, and its recorded brief goes again"
meant = "a_brief_its_window_read_as_it_opened_and_recorded_before_the_close_is_confirmed_and_never_given_again"
runs = ["cwd-engine"]

[[plant.edit]]
file = "crates/cf-engine/src/in_flight.rs"
find = "        if delivering.launch && !delivering.chief && !with_project {"
replace = "        if delivering.launch && !delivering.chief {"

[[plant]]
name = "close while delivering: a later message closed with its project spends its attempt and fails on its last"
meant = "a_message_on_its_last_attempt_whose_project_closes_goes_back_and_waits_for_the_resume"
runs = ["cwd-engine"]

[[plant.edit]]
file = "crates/cf-engine/src/dispatcher.rs"
find = "                    if delivering.chief || closed_with_project {"
replace = "                    if delivering.chief || (closed_with_project && delivering.launch) {"

[[plant]]
name = "close while delivering: live close-early runs Claude Code and Codex alone where no harness is named"
meant = "the_workers_are_every_harness_unless_named"
runs = ["cwd-live-default"]

[[plant.edit]]
file = "crates/cf-e2e/tests/live_close_early.rs"
find = "        return Ok(Harness::ALL.to_vec());"
replace = "        return Ok(vec![Harness::Claude, Harness::Codex]);"

[[plant]]
name = "close while delivering: a live rig that seats Muse spends its allowance unasked, as close-early did at 99% of the week"
meant = "a_live_rig_that_seats_muse_is_refused_on_an_allowance_used_up_and_runs_under_it"
runs = ["cwd-muse-rig"]

[[plant.edit]]
file = "crates/cf-e2e/src/rig/install.rs"
find = "            crate::muse::guard_allowance(install, real_home, &home.join(\".config\"))?;\n"
replace = ""

[[plant]]
name = "close while delivering: Muse's allowance stop is back at 90%, so a run at 99% of the week never starts"
meant = "a_live_run_stops_where_the_window_or_the_week_is_used_up_and_runs_under_it"
runs = ["cwd-muse-stop", "cwd-muse-rig"]

[[plant.edit]]
file = "crates/cf-e2e/src/muse.rs"
find = "pub const STOP_AT_PERCENT: u64 = 100;"
replace = "pub const STOP_AT_PERCENT: u64 = 90;"
