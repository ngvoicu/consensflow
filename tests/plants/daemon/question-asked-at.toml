# Q1 (N2): a member's question belongs to the holding its window had when its asking began.
# `cf ask`, `cf hook` and the Codex broker stamp `askedAt`; the ledger places the question by it
# (`placed_at`), from each holding's begin and end and the one it replaced, kept in `question_holding`.
#
# Every name holds `question asked at`, so `npm run plants:daemon -- "question asked at"` runs them all.

[[plant]]
name = "question asked at: the holding of the arrival again, the stamp unread"
meant = "q1_a_taskless_turns_late_question_stays_the_sessions_and_a_fresh_one_is_the_tasks"
runs = [["cargo", "test", "--offline", "-p", "cf-daemon", "--test", "question_asked_at"]]
[[plant.edit]]
file = "crates/cf-ledger/src/ledger/messages.rs"
find = "            let selected = if let Some(at) = asked_at {"
replace = "            let selected = if let Some(at) = asked_at.filter(|_| false) {"

[[plant]]
name = "question asked at: a stamp at the begin is still the earlier holding's"
meant = "q1_a_stamp_at_the_begin_is_the_new_holdings_and_one_from_the_future_is_the_arrival"
runs = [["cargo", "test", "--offline", "-p", "cf-daemon", "--test", "question_asked_at"]]
[[plant.edit]]
file = "crates/cf-ledger/src/holding.rs"
find = "    if began.is_none_or(|began| at >= began) {"
replace = "    if began.is_none_or(|began| at > began) {"

