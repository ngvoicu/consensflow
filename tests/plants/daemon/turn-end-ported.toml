# Round 7's plants that still apply to turn-end's smallest rule (T-14 of 2026-10-21): wt/turn-end
# left 280 plants unrun; those whose every edit is still found once in this tree, and that no table of
# this tree holds already, are kept here as round 7 wrote them, with their runs, so the rules they
# took out are still proven held: the final answer's words, the notification head, `cf task finish`
# and the page's Finish and lane. The rest are answered in turn-end-min's result: removed machinery,
# or a rule turn-end-min.toml plants in its new place. Every name holds `turn end` and none
# `turn-end-min`, so `npm run plants:daemon -- "turn end"` runs these and not that table.

[run]
tep-background-rig-background-grace = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "background_work::a_job_that_ignores"]
tep-engine-turn-end = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "turn_end::"]
tep-turn-end-finish-cf-verb = ["cargo", "test", "--offline", "-p", "cf", "--lib", "board::task"]
tep-turn-end-finish-cf-goldens = ["cargo", "test", "--offline", "-p", "cf", "--test", "board_goldens"]
tep-turn-end-finish-daemon-api = ["cargo", "test", "--offline", "-p", "cf-daemon", "--test", "api"]
tep-turn-end-finish-page-finish = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "background|Finish"]
tep-turn-end-finish-regression-never-ends = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_job_that_never_ends"]
tep-turn-end-review-2-claude-reader = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record"]
tep-turn-end-review-2-cf-board-task = ["cargo", "test", "--offline", "-p", "cf", "--lib", "board::task"]
tep-turn-end-review-3-claude-reader = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record"]
tep-turn-end-review-3-regression-still-ran = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_job_that_still_ran"]
tep-turn-end-review-4-claude-reader = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record"]
tep-turn-end-claude-reader = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record"]
tep-turn-end-engine-final-answer = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "final_answer"]
tep-turn-end-engine-lib-turn-end = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "turn_end"]

