# B3 and main's B1 (T-46, 2026-10-21): told words kept for their task's resume, as their paste
# failed while the task was paused, are no silent wait: the requester hears why and which words
# wait, in ConsensFlow's queued note of the pause or in a note of its own (`tell_kept` in
# `crates/cf-ledger/src/messages/pauses.rs`), and the human once, as main told it of a failure
# (`tell_kept` in `crates/cf-engine/src/deliveries.rs`). A member's window given up as unfit has
# its exit settled first (`give_up_unfit`), so its task is paused before the message goes: the
# bridge host answers a kill before the exit comes (the merge's review, T-16 F1).

[[plant]]
name = "review 306: the requester is not told of told words kept for the resume"
meant = "told_words_whose_last_paste_fails_while_the_task_is_paused_are_kept_for_its_resume"
runs = ["ledger-told-kept", "engine-queued-tells", "engine-dispatcher-unfit"]

