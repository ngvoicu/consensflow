# The second review of 3.0.6's field work (GPT-6-Astra and GPT-6.1-Sol, 2026-10-16), each finding
# fixed with a test that failed on the code it read:
#
# - B4: a brief of the chief's own step being pasted when the step is done goes no further at the
#   refusal or the retry, in the finish's words (`withdrawn_late` in
#   `crates/cf-ledger/src/tasks/own_steps.rs`; tests `self_steps.rs`, the engine's `own_steps`);
# - B6: `--file` names its file by its bytes, reads only a file of its own, never a link, a pipe, a
#   device or a folder, no further than the board takes, and takes no `--file` with no name; the
#   reply and the refusals show a control character escaped (`crates/cf/src/board/brief.rs`; tests
#   `crates/cf/tests/brief_file_checks.rs`, the brief's own);
# - B7: a task whose brief reached no window has no transcript of its own, and says so
#   (`crates/cf-ledger/src/conversations/transcripts.rs`, the route's `pages`, `cf`'s `transcript`;
#   tests the route's `own_steps`, `crates/cf/tests/transcript_pages.rs`);
# - B3: told words are a note to the task's own window, and a note to anyone else fails nothing
#   (`is_told`); a resume keeps the order they were told in (`fold`, `adopt`); words whose last paste
#   fails while the task is paused are kept for its resume, and nobody hears of a failure
#   (`kept_for_resume`, the engine's `fail_delivery`; tests `told_kept.rs`, the engine's
#   `queued_tells`);
# - B3, Astra's look at round 4: a `cf task done` while told words are on their way to the window is
#   refused until it has them (`record_result` in `crates/cf-ledger/src/tasks/finishing.rs`; test
#   `told_edges.rs`).
#
# Each plant takes one fix out again. The names begin with `review 306`, so
# `npm run plants:daemon -- "review 306"` runs them.

[run]
ledger-self-steps = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "self_steps::"]
ledger-told-kept = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "told_kept::"]
ledger-told-edges = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "told_edges::"]
engine-own-steps = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "own_steps::"]
engine-queued-tells = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "queued_tells::"]
cf-brief-checks = ["cargo", "test", "--offline", "-p", "cf", "--test", "brief_file_checks"]
cf-lib-brief = ["cargo", "test", "--offline", "-p", "cf", "--lib", "board::brief"]
cf-transcript-pages = ["cargo", "test", "--offline", "-p", "cf", "--test", "transcript_pages"]
daemon-own-steps = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "routes::task::tests::own_steps"]
engine-dispatcher-unfit = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "unfit::"]
ledger-lib-pauses = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "messages::pauses::"]
engine-dispatcher-resume = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "resume::"]
engine-role-change-members = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "role_change::members::"]
ledger-receipt-carrying = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "carrying::"]
engine-dispatcher-window-closes = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "window_closes::"]
engine-dispatcher-approval = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "approval::"]
engine-lib-stalls = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "stalls::"]
engine-lib-windows = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "windows::"]
engine-dispatcher-stale-box = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "stale_box::"]
ledger-receipt-suspended = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "receipt", "suspended::"]

