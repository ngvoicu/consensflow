# T-77, round 2 (the chief's answers): words still waiting for a member's window when a give-up
# of it pauses the task wait for its resume and are named in the note of the pause, the human
# told once (`keep_waiting`, the engine's in `crates/cf-engine/src/deliveries.rs` and the
# ledger's in `crates/cf-ledger/src/messages/told.rs`), in each of the three give-ups; the words
# that resume a paused task, given up before its window had them, pause it again and never fail
# it (`pause_again`, `crates/cf-ledger/src/tasks/pausing.rs`), the why said once in the note
# (`with_kept`, `pauses.rs`); and the give-up of an unfit member's window is no longer held for a
