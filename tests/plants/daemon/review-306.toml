[[plant.edit]]
file = "crates/cf-engine/src/deliveries.rs"
find = "            GivenUp::Kept => return self.tell_kept(message, because),"
replace = "            GivenUp::Kept => return Ok(()),"

[[plant]]
name = "review 306: a member's unfit window is given up before its exit is settled"
meant = "a_members_window_unfit_for_work_closes_and_the_words_told_to_it_are_kept_for_its_resume"
runs = ["engine-dispatcher-unfit"]

[[plant.edit]]
file = "crates/cf-engine/src/unstarted.rs"
find = """        let closed = match &pane {
            Some(pane) => self.close_own(record, pane).await?,
            None => true,
        };
        // A chief's window the host would not kill is looked at again; a member's
        // message goes all the same, its task never paused by an exit that never came
        // (T-47 P3-1: left at work, asked and killed again at every pass, nobody told).
        if !closed && participant.role == "chief" {
            return Ok(());
        }
        self.launch_failed(record, &project, &participant, Some(failing), &said)"""
replace = """        let (this, held) = (Rc::clone(self), Rc::clone(record));
        let closing = begin(&*self.seams.spawn, async move { this.retire(&held).await }).await;
        self.launch_failed(record, &project, &participant, Some(failing), &said)?;
        closing.await?;
        Ok(())"""

