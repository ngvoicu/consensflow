replace = "    if true { return Ok(()); }\n    let requester = store.participant_row(task.requester_id)?.handle;"

[[plant]]
name = "review 306: a pause note says the why again for each word kept"
meant = "the_words_kept_for_a_resume_are_named_after_the_why_said_once_and_read_back"
