# What a start leaves, and what the human's Resume brings back (2026-10-12: when
# ConsensFlow starts, every project stays closed until the human resumes it). The
# ledger suspends what was open and marks nothing, and its migration drops the
# mark; the engine settles what was on its way and opens no window, and the
# Resume opens the chief and each window with a task at work or waiting, a window
# the quit cut told so once, as the first thing it is given; the board of a
# suspended project says what its Resume will start, in a line. One plant takes
# one rule out; a test of it fails.

[run]
# The ledger's tests of a start: the suspension, the migration, the board's counts.
ledger-starting = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "starting"]
# What the ledger's tests of Node's recordings share, and hold apart.
ledger-testing = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "testing::"]
# The engine's tests of a start and of the human's Resume, on the fake windows.
engine-resume = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "resume::"]
# What the engine asks of a harness's record with no window open.
harness-contract = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "contract::"]
# The case of the rig where the app quits with a worker in its turn and starts again.
rig-start-suspended = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "start_suspended"]
# The page's tests of a suspended project's banner (the cases of `app/tests/core-page.spec.mjs` in the
# browser Playwright keeps; each plant's `prepare` bundles the page's xterm first, as `npm run test:ui` does).
page-banner = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "closed project|waits for Resume"]

