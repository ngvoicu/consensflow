# P23-A (CLN-65): a rollback that fails is said, a ledger left in a transaction refuses every
# later write, and the daemon ends and tells the app, which does not start it again.
[run]
p23a-store = ["cargo", "test", "--offline", "-p", "cf-ledger", "--lib", "store::tests"]
p23a-ledger = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "broken_ledger"]
p23a-daemon = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "start::tests::broken"]
p23a-app = ["cargo", "xtask", "app", "test", "daemon::tests::"]
p23a-writes = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "writes_go_through_the_guard"]
p23a-page = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "says a ledger that cannot be saved to"]
p23a-log = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "files::log::tests"]
p23a-trace = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "files::trace::tests::once_the_ledger_broke"]
p23a-viewer = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::viewer::"]
p23a-copies = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::viewer::copies"]
p23a-console = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "console::tests"]
p23a-pageops = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::a_change_made_before"]
p23a-bridge = ["cargo", "test", "--offline", "-p", "cf-bridge", "--features", "local", "--lib", "local::tests::input"]

[[plant]]
name = "broken ledger: the rollback's result is discarded"
meant = "a_rollback_that_fails_is_said_after_the_failure_that_asked_for_it_and_breaks_the_ledger"
runs = ["p23a-store"]

[[plant.edit]]
file = "crates/cf-ledger/src/store.rs"
find = "        let rolled = crate::rollback::roll_back(&self.db);"
replace = '''        let rolled = {
            let _ = crate::rollback::roll_back(&self.db);
            Ok(())
        };'''

