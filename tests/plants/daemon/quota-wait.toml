# A quota wait never fails (dip-agentos, 2026-10-17 to 19, ConsensFlow 3.0.4: T-17
# and T-20 were told they wait out of quota and go on by themselves, then ended
# "failed: the harness reported a failure", their work left in their windows;
# row 3 of `issues/field-reports-2026-10-19-dip-agentos.md` in consensflow-sme).
# While a member is out its task waits with its window, whoever else of its tier
# is free (`crates/cf-engine/src/scheduler.rs`, `hold_work`), and so does the work
# of a window whose own refusal is dated before its member was marked out
# (`refused_while_out`, `crates/cf-engine/src/dispatcher.rs`, `while_out`); what
# the window was receiving arrived if its record shows it, else goes again with
# its attempt (`out_of_quota`). A refusal of the words that resumed a task holds
# it again with no new note to its requester, and the human is told once that the
# account may need them. Codex's turn a limit cut (`usage_limit_exceeded`,
# `rate_limit_exceeded`) is a refusal for quota, with the reset its rate limits
# name before or after it (`crates/cf-harness/src/codex/record.rs`), and so is
# Anthropic's spent extra usage, a 400, in Pi's, Claude Code's and OpenCode's
# words (`crates/cf-harness/src/shared/quota.rs`, `claude/record/project.rs`,
# `opencode/record/answer.rs`). The engine's cases are
# `crates/cf-engine/tests/dispatcher/quota_waits.rs`; the rig's are
# `crates/cf-e2e/tests/regressions/a_quota_wait_ended_failed.rs`, whose stand-in
# Codex is refused mid-task in Codex's shape, and
# `claude_continues_by_itself_after_its_limit.rs`, whose stand-in Claude continues
# by itself once its limit resets; their runs build the native `cf` from the
# sources as they are planted. A held task's window that goes on with it by
# itself, in a turn of its own that got through, is the task going on: it
# resumes with no words, or the daemon's bare words that resume it are withdrawn
# (`crates/cf-ledger/src/tasks/pausing.rs`, `go_on_in_window`), and its answer is
# the result (`scheduler.rs`, `went_on_by_itself`; `deliveries.rs`, `collect`).
#
# Every name holds `quota wait`, so `cargo xtask plants daemon "quota wait"` runs
# them all.

[run]
quota-wait-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "quota"]
quota-wait-codex = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "codex::record"]
quota-wait-claude = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "claude::record"]
quota-wait-opencode = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "opencode::record"]
quota-wait-refusals = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::quota"]
quota-wait-rig = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_quota_wait_ended_failed::"], builds = true }
quota-wait-continues = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "claude_continues_by_itself_after_its_limit::"], builds = true }

