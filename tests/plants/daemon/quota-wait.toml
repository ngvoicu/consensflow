# A quota wait never fails (dip-agentos, 2026-10-17 to 19, ConsensFlow 3.0.4: T-17
# and T-20 were told they wait out of quota and go on by themselves, then ended
# "failed: the harness reported a failure", their work left in their windows;
# row 3 of `issues/field-reports-2026-10-19-dip-agentos.md` in consensflow-sme).
# While a member is out its task waits with its window, whoever else of its tier
# is free (`crates/cf-engine/src/scheduler.rs`, `hold_work`); what the window was
# receiving arrived if its record shows it, else goes again with its attempt
# (`crates/cf-engine/src/dispatcher.rs`, `out_of_quota`). Codex's turn its usage
# limit cut (`usage_limit_exceeded`) is a refusal for quota
# (`crates/cf-harness/src/codex/record.rs`), and so is Anthropic's spent extra
# usage in Pi's words (`crates/cf-harness/src/shared/quota.rs`). The engine's
# cases are `crates/cf-engine/tests/dispatcher/quota_waits.rs`; the rig's case,
# whose stand-in Codex is refused mid-task in Codex's shape, is
# `crates/cf-e2e/tests/regressions/a_quota_wait_ended_failed.rs`, and its run
# builds the native `cf` from the sources as they are planted.
#
# Every name holds `quota wait`, so `cargo xtask plants daemon "quota wait"` runs
# them all.

[run]
quota-wait-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "quota"]
quota-wait-codex = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "codex::record"]
quota-wait-refusals = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::quota"]
quota-wait-rig = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_quota_wait_ended_failed::"], builds = true }

[[plant]]
name = "quota wait: Codex's turn its usage limit cut reads as failed for another reason, and the task waiting out its quota ends failed (the field's)"
meant = "a_codex_worker_cut_by_its_usage_limit_mid_task_waits_with_its_window_and_goes_on_there_never_failed"
runs = ["quota-wait-rig"]
builds = true

[[plant.edit]]
file = "crates/cf-harness/src/codex/record.rs"
find = '''
        if field(error, "codex_error_info").and_then(Value::as_str) != Some(USAGE_LIMIT) {
            return None;
        }
'''
replace = '''
        if field(error, "codex_error_info").is_some() {
            return None;
        }
'''

[[plant]]
name = "quota wait: Codex's turn its usage limit cut reads as failed for another reason, in its reader"
meant = "a_turn_ended_for_its_usage_limit_is_a_refusal_for_quota_at_its_time_with_the_reset_the_limits_named"
runs = ["quota-wait-codex"]

[[plant.edit]]
file = "crates/cf-harness/src/codex/record.rs"
find = '''
        if field(error, "codex_error_info").and_then(Value::as_str) != Some(USAGE_LIMIT) {
            return None;
        }
'''
replace = '''
        if field(error, "codex_error_info").is_some() {
            return None;
        }
'''

[[plant]]
name = "quota wait: Codex's refusal takes a reset the rate limits named before it for its own"
meant = "a_reset_the_limits_named_before_the_refusal_is_none_of_its_own"
