# The staff's guardrail (the owner's Windows machine, 2026-10-15, ConsensFlow 3.0.4: a worker
# overwrote a file that held uncommitted work with `git checkout`, and other workers said they had
# restored files they had not). The rule is held by tests:
#
# Every member's text (`skill/core/staff.md`) says others work in the same folder, never to throw
# away a change it did not make (no `git checkout` or `git restore` over a file, with unstaging its own change still allowed;
# no `git reset --hard`, `git stash` or
# `git clean` over work that is not committed), and to say a file is restored only once it has
# checked it (`crates/cf-engine/tests/text/roles.rs`, and the 27 members' rows of
# `crates/cf-engine/tests/goldens/text.json`, moved by hand).
#
# One plant takes a rule out, or puts it wrong; a test fails. Every name holds
# `worker guardrail`, so `npm run plants:daemon -- "worker guardrail"` runs them all.

[run]
# The texts of the roles, without the golden of Node's texts, which the whole `text` test holds.
engine-text-roles-guardrail = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text", "roles::", "--", "--skip", "goldens_roles"]

# The staff's text.

[[plant]]
name = "worker guardrail: the staff's text does not say to keep a change it did not make"
meant = "teach_the_worker_only_the_board_s_commands"
runs = ["engine-text-roles-guardrail"]

[[plant.edit]]
file = "skill/core/staff.md"
find = "Others work in this folder too, with work not committed. Never throw away a change you did not make: no `git checkout` or `git restore` over a file, no `git reset --hard`, `git stash` or `git clean` over uncommitted work; take out a change of yours by hand, and say a file is restored only once you have checked it."
replace = "Others work in this folder too. Say a file is restored only once you have checked it."
[[plant]]
name = "worker guardrail: the staff's text forbids git checkout and git restore but lets a stash or a hard reset through"
meant = "teach_the_worker_only_the_board_s_commands"
runs = ["engine-text-roles-guardrail"]

[[plant.edit]]
file = "skill/core/staff.md"
find = "no `git checkout` or `git restore` over a file, no `git reset --hard`, `git stash` or `git clean` over uncommitted work;"
replace = "no `git checkout` or `git restore` over a file;"
[[plant]]
name = "worker guardrail: the staff's text does not say a restore is said only once it is checked"
meant = "teach_the_worker_only_the_board_s_commands"
runs = ["engine-text-roles-guardrail"]

[[plant.edit]]
file = "skill/core/staff.md"
find = ", and say a file is restored only once you have checked it."
replace = "."
