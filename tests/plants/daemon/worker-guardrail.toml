# The staff's guardrail (the owner's Windows machine, 2026-10-15, ConsensFlow 3.0.4: a worker
# overwrote a file that held uncommitted work with `git checkout`, and other workers said they had
# restored files they had not). Two rules stand in 3.0.5, each held by tests:
#
# - every member's text (`skill/core/staff.md`) says others work in the same folder, never to throw
#   away a change it did not make (no `git checkout` or `git restore` that overwrites a file, while
#   `git restore --staged` of its own change is fine; no `git reset --hard`, `git stash` or
#   `git clean` over work that is not committed), and to say a file is restored only once it has
#   checked it (`crates/cf-engine/tests/text/roles.rs`, and the 27 members' rows of
#   `crates/cf-engine/tests/goldens/text.json`, moved by hand);
#
# One plant takes one rule out, or puts one wrong; a test fails. Every name holds
# `worker guardrail`, so `npm run plants:daemon -- "worker guardrail"` runs them all. The setup's
# empty hook folder, its `commit.gpgsign=false` and its `--no-verify` have no plant: with every
# configuration channel and the template folder cut off, nothing is left to name a hook or ask
# for signing, so taking one of them out changes nothing a test could see.

[run]
# The texts of the roles, without the golden of Node's texts, which the whole `text` test holds.
engine-text-roles-guardrail = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "text", "roles::", "--", "--skip", "goldens_roles"]

# The staff's text.

[[plant]]
name = "worker guardrail: the staff's text does not say to keep a change it did not make"
meant = "teach_the_worker_only_the_board_s_commands"
runs = ["engine-text-roles-guardrail"]

[[plant.edit]]
file = "skill/core/staff.md"
find = '''
Others work in this folder too, and not all of their work is committed. Never
throw away a change you did not make: no `git checkout` or `git restore` that
overwrites a file (`git restore --staged` of your own change is fine), and no
`git reset --hard`, `git stash` or `git clean` over work that is not committed;
take a change of yours out by hand. Say'''
replace = "Say"

[[plant]]
name = "worker guardrail: the staff's text forbids git checkout and git restore but lets a stash or a hard reset through"
meant = "teach_the_worker_only_the_board_s_commands"
runs = ["engine-text-roles-guardrail"]

[[plant.edit]]
file = "skill/core/staff.md"
find = '''
(`git restore --staged` of your own change is fine), and no
`git reset --hard`, `git stash` or `git clean` over work that is not committed;'''
replace = "(`git restore --staged` of your own change is fine);"

[[plant]]
name = "worker guardrail: the staff's text does not say a restore is said only once it is checked"
meant = "teach_the_worker_only_the_board_s_commands"
runs = ["engine-text-roles-guardrail"]

[[plant.edit]]
file = "skill/core/staff.md"
find = ''' Say a file is restored only once you have
checked it: its diff, or what it holds.'''
replace = ""

[[plant]]
name = "worker guardrail: the staff's text forbids any git checkout or git restore of a file, an unstaging too"
meant = "teach_the_worker_only_the_board_s_commands"
runs = ["engine-text-roles-guardrail"]

[[plant.edit]]
file = "skill/core/staff.md"
find = '''
no `git checkout` or `git restore` that
overwrites a file (`git restore --staged` of your own change is fine), and no'''
replace = '''
no `git checkout` or `git restore` of a
file, and no'''

[[plant]]
name = "worker guardrail: the staff's text does not say a worker may unstage its own change"
meant = "teach_the_worker_only_the_board_s_commands"
runs = ["engine-text-roles-guardrail"]

[[plant.edit]]
file = "skill/core/staff.md"
find = " (`git restore --staged` of your own change is fine)"
replace = ""

