# A resumed task whose window is at work on it reads working (T-1139, field bug 8: after
# `cf tell`, the window's answer and `cf task resume`, the window went on with the turn the
# tell began and the board read `T-10 [queued]` for as long as it ran commands on it, because
# only the paste of the resume's words moved a task to working, and nothing is typed into a
# turn at work). The look is `crates/cf-engine/src/resumed_at_work.rs`; the ledger's move is
# `work_while_resumed`. The engine's tests are `crates/cf-engine/tests/dispatcher/
# resumed_at_work.rs`; the rig's case, `crates/cf-e2e/tests/regressions/
# a_task_resumed_after_a_tell_read_queued_while_its_window_worked_on_it.rs`, is the real
# daemon and pane host on a stand-in that answers the tell and goes on working at a pace.
#
# - the look that shows the task working is never made (engine and rig);
# - a turn in flight alone counts as work, whatever the record shows of the agent;
# - a turn that has ended counts as one at work;
# - the baseline is the start of the record, so what the agent wrote before the resume counts;
# - a record rewritten under the baseline counts as work;
# - what the harness writes in its agent's place counts as work, and so does a message typed in;
# - a turn the record has said is over, not yet for a moment, counts as one at work;
# - the daemon's own bare words that resume a held task count as the chief's;
# - a first brief counts as the words that resumed a task;
# - words already being pasted can be shown as work;
# - a task shown working never reads queued again for a window at rest with the words held;
#   it reads queued again at the first look at rest, though the words go in as they should;
# - T-1153's review (F1 to F5, the churn and the guards no plant held): the exit of a window,
#   its Close and a quit take the claim with them; go_on passes over it; every door of a
#   waiting task is shut; a second tell is kept behind the words; a task sent back is not
#   shown working again for 30 s; each guard of the look (a failed turn, another program in
#   the conversation, a dialog (an unnamed window says it waits), a turn taken back, a closed project on both
#   moves, a settled look for the send back, the second resume's baseline) is held;
# - what the task needs once it reads working with its words waiting: the one-task rules of
#   the queue and of the begin of a delivery hold its own words back; the turn before the words
#   is taken for its result; the note of what that turn ended with is not told; the words that
#   never reach the window leave the task working; a question's door is open; the window's own
#   `cf task done` goes through; the chief's Finish leaves the words queued.
#
# Every name holds `resume shows working`, so `cargo xtask plants daemon "resume shows working"`
# runs them all.

[run]
engine-dispatcher-resumed-at-work = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "resumed_at_work"]
engine-lib-stops = ["cargo", "test", "--offline", "-p", "cf-engine", "--lib", "stops::"]
daemon-routes-verbs = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "a_pause_with_words_of_a_task_shown_working"]
rig-regression-resumed-after-tell = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_task_resumed_after_a_tell_read_queued_while_its_window_worked_on_it::"], builds = true }

