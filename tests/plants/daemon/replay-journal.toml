# Plants in D4's P5-B: the journal a window keeps of its output and resizes, and the boundary a
# page's subscription fixes (crates/cf-panes/src/journal*, output_hub.rs, pty/flow.rs,
# pane_handlers.rs). What a reloaded page shows is the journal replayed, so a wrong byte, a byte
# twice or a byte in neither is silent.

[run]
journal = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "--", "journal::"]
host = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "--", "--test-threads", "2", "pty::journal_tests"]
page = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "--", "page::tests"]
ended = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "--", "tiny_read_queued_burst"]

[[plant]]
name = "journal: a byte is in the history and on the live path"
meant = "a_subscription_splits_the_bytes_into_the_history_and_the_live_path_with_no_byte_twice"
runs = ["host"]

[[plant.edit]]
file = "crates/cf-panes/src/output_hub.rs"
find = """        let handed = state.handed.clone();
        state.sink = Some(sink);
        let pending = std::mem::take(&mut state.pending);
        for message in pending {
            Self::deliver_or_park(&mut state, message);
        }
        handed"""
replace = """        state.sink = Some(sink);
        let pending = std::mem::take(&mut state.pending);
        for message in pending {
            Self::deliver_or_park(&mut state, message);
        }
        state.handed.clone()"""

