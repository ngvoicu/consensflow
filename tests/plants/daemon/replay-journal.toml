# Plants in D4's P5-B: the journal a window keeps of its output and resizes, and the boundary a
# page's subscription fixes (crates/cf-panes/src/journal*, output_hub.rs, pty/flow.rs,
# pane_handlers.rs). What a reloaded page shows is the journal replayed, so a wrong byte, a byte
# twice or a byte in neither is silent.

[run]
journal = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "--", "journal::"]
host = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "--", "--test-threads", "2", "pty::journal_tests"]

[[plant]]
name = "journal: a byte is in the history and on the live path"
meant = "a_subscription_splits_the_bytes_into_the_history_and_the_live_path_with_no_byte_twice"
runs = ["host"]

[[plant.edit]]
file = "crates/cf-panes/src/output_hub.rs"
find = """        let boundaries = state.handed.clone();
        state.sink = Some(sink);
        let pending = std::mem::take(&mut state.pending);
        for message in pending {
            Self::deliver_or_park(&mut state, message);
        }
        boundaries"""
replace = """        state.sink = Some(sink);
        let pending = std::mem::take(&mut state.pending);
        for message in pending {
            Self::deliver_or_park(&mut state, message);
        }
        state.handed.clone()"""

[[plant]]
name = "journal: a byte is in neither the history nor the live path"
meant = "a_subscription_splits_the_bytes_into_the_history_and_the_live_path_with_no_byte_twice"
runs = ["host"]

[[plant.edit]]
file = "crates/cf-panes/src/output_hub.rs"
find = "                state.handed.insert(key, end);"
replace = "                state.handed.insert(key, end.saturating_sub(1));"

[[plant]]
name = "journal: the boundary is read outside the step that swaps the sink"
meant = "each_of_many_subscriptions_against_a_running_consumer_has_the_stream_exactly_once"
runs = ["host"]

[[plant.edit]]
file = "crates/cf-panes/src/output_hub.rs"
find = """        let boundaries = state.handed.clone();
        state.sink = Some(sink);"""
replace = """        let boundaries = state.handed.clone();
        drop(state);
        std::thread::sleep(std::time::Duration::from_millis(1));
        let mut state = self.state.lock().unwrap_or_else(|error| error.into_inner());
        state.sink = Some(sink);"""

[[plant]]
name = "journal: a subscription does not settle the room the old page left"
meant = "a_program_stops_at_one_mebibyte_and_a_subscription_settles_the_room_the_old_page_left"
runs = ["host"]
platforms = ["macos", "linux"]

[[plant.edit]]
file = "crates/cf-panes/src/pty/flow.rs"
