# Keys the human typed into a harness's dialog or picker and left with Escape held every
# delivery to the window (T-288, issues/keys-cleared-with-escape-still-hold-deliveries.md
# in consensflow-sme): the pane host counts the human's keys for what they leave unsent,
# and Escape clears nothing. The adapters that paste (Claude Code's, Devin's) read their
# input box on the screen, the pane host's screen as drawn (`bottom`); a paste whose
# adapter read it empty, the human's last key a second past, goes in over the count
# (`readEmpty`) unless a key came since. Escape itself still clears nothing: Claude Code
# and Devin keep words typed in the box at one Escape and at two (`cargo xtask live
# escape-unsent`). One plant takes one rule out; a test of it fails. The `rig:` plants
# hold the rule end to end through the real daemon and pane host
# (`crates/cf-e2e/tests/regressions/keys_cleared_with_escape_held_every_delivery.rs`) and
# say `builds`. Every name holds `escape-unsent`, so `npm run plants:daemon --
# escape-unsent` runs them all.

[run]
escape-unsent-arbiter = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "arbiter::tests::a_paste_read_empty"]
escape-unsent-screen = ["cargo", "test", "--offline", "-p", "cf-panes", "--lib", "screen::tests::the_bottom"]
escape-unsent-readers = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "input_box"]
escape-unsent-adapters = ["cargo", "test", "--offline", "-p", "cf-harness", "--test", "launch", "input_box"]
escape-unsent-page = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "out of quota too"]
escape-unsent-rig = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "keys_cleared_with_escape_held_every_delivery::"]

# --- the pane host ---

[[plant]]
name = "escape-unsent: the host holds every paste while the count is up, read empty or not"
meant = "a_paste_read_empty_at_the_last_key_goes_in_over_the_count_and_clears_it"
runs = ["escape-unsent-arbiter"]

[[plant.edit]]
file = "crates/cf-panes/src/arbiter.rs"
find = "                if read_empty != Some(state.typed) {"
replace = "                if true {"

[[plant]]
name = "escape-unsent: the host takes a paste read empty at any count, a key since or not"
meant = "a_paste_read_empty_at_the_last_key_goes_in_over_the_count_and_clears_it"
runs = ["escape-unsent-arbiter"]

[[plant.edit]]
file = "crates/cf-panes/src/arbiter.rs"
find = "                if read_empty != Some(state.typed) {"
replace = "                if read_empty.is_none() {"

[[plant]]
name = "escape-unsent: Escape clears the count, though the box may keep the words"
meant = "a_paste_read_empty_at_the_last_key_goes_in_over_the_count_and_clears_it"
runs = ["escape-unsent-arbiter"]

[[plant.edit]]
file = "crates/cf-panes/src/arbiter.rs"
find = '''            0x1b => {
                at += match rest.get(1) {'''
replace = '''            0x1b => {
                unsent = 0;
                at += match rest.get(1) {'''

[[plant]]
name = "escape-unsent: the screen as drawn leaves out its rules and an empty prompt, as the tail does"
meant = "the_bottom_keeps_rules_and_an_empty_prompt_and_ends_at_the_last_drawn_line"
runs = ["escape-unsent-screen"]

[[plant.edit]]
file = "crates/cf-panes/src/screen.rs"
find = '''        let mut lines = self.grid.lines();
        let drawn = lines'''
replace = '''        let mut lines: Vec<String> = self
            .grid
            .lines()
            .into_iter()
            .filter(|line| line.chars().any(char::is_alphanumeric))
            .collect();
        let drawn = lines'''

