# Two results a Devin chief is handed one after the other (the owner's report of 2026-10-15, B5: a
# result went into a chief's window twice, the second copy glued in front of the next result, m-246
# and m-248, on Windows, a version nobody noted). The cases are
# `crates/cf-e2e/tests/regressions/a_result_delivered_twice_to_a_devin_chief.rs`: the real daemon and
# pane host on a stand-in Devin chief that runs what it is handed in a turn when the turn ends, and two
# workers of the stand-in Claude. Each result goes in once, whole and apart, when:
#
# - the first result's record is late (the human's turn is in front of it, its agent silent past the
#   30 s the window reads busy from its prompt, so the result goes into that turn);
# - the same, with the chief at work on a turn when the second result comes;
# - the turn in front says nothing for two and a half minutes, as a Devin resumed after a cut sat at
#   "Thinking" (B1 of the same report): more than the daemon's minute of the window's rest goes by
#   before the record shows the first result (3.0.4 pasted it again);
# - Devin's TUI dropped the first paste, and the daemon pastes it again after its minute at rest;
# - the same, and the human's words quote its header (the reviews of 2026-10-16): they are no paste of
#   it, and it goes again after the human's turn and the daemon's minute.
#
# What stands against a second paste there: the engine counts the arrival window in the window's
# rest (`notes-twice.toml`), and a window whose harness says the paste went into a turn it is in still
# (`Window::held`) is in that turn, however at rest it reads, and its paste never goes again while it
# is, not even past the half hour after which a paste never shown is pasted again (the reviews of
# 2026-10-16; `cf-engine`'s `arrival`, its tests in
# `crates/cf-engine/tests/dispatcher/slow_records.rs`). Devin's adapter says so from its wire log: a
# paste made while a prompt of its TUI was asked is held as long as a prompt is, and so is one a prompt
# read after it was put to the agent ahead of (it began while the window was found ready, the reviews
# of 2026-10-16), and so is one its TUI put to the agent in a prompt of its own, whose words begin with
# the paste's line, for that prompt's turn and no longer; a prompt of a conversation the window no
# longer shows is none (`cf-harness`'s `devin::wire_log`). The cases build
# the native `cf` from the sources as they are planted, so their plants say `builds`. One plant takes
# a rule out, or puts it wrong; a test fails.
#
# Every name holds `results twice`, so `npm run plants:daemon -- "results twice"` runs them all.

[run]
engine-slow-records = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "slow_records"]
harness-devin = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "devin::"]
rig-regression-results-late = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_result_delivered_twice_to_a_devin_chief::two_results_for_a_devin_chief_whose_record_of_the_first_is_late"]
rig-regression-results-at-work = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_result_delivered_twice_to_a_devin_chief::two_results_for_a_devin_chief_at_work_when"]
rig-regression-results-silent = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_result_delivered_twice_to_a_devin_chief::two_results_for_a_devin_chief_whose_turn_says_nothing"]
rig-regression-results-dropped = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_result_delivered_twice_to_a_devin_chief::two_results_for_a_devin_chief_whose_tui_dropped"]
rig-regression-results-quoted = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_result_delivered_twice_to_a_devin_chief::a_result_whose_paste_devins_tui_dropped"]

# The cases of the rig, each a version's shape.

[[plant]]
name = "results twice: a paste into a Devin turn whose agent says nothing past the gap is not held, and is pasted again after the daemon's minute of rest (3.0.4)"
meant = "two_results_for_a_devin_chief_whose_turn_says_nothing_for_minutes_go_in_once_each_whole_and_apart"
runs = ["rig-regression-results-silent"]
builds = true

[[plant.edit]]
file = "crates/cf-harness/src/devin/wire_log.rs"
find = "        state.into_a_turn = !state.asked.is_empty();"
replace = "        state.into_a_turn = false;"

[[plant]]
name = "results twice: the record of the first result is late, the arrival window counted from the hand-over, turns or none (3.0.3)"
meant = "two_results_for_a_devin_chief_whose_record_of_the_first_is_late_go_in_once_each_whole_and_apart"
runs = ["rig-regression-results-late"]
builds = true

[[plant.edit]]
