# A window at work is no window that lost what it was given (T-901). On 2026-10-28 (3.0.6-alpha.2)
# a Codex window opened again on a long thread took the chief's tell from its broker and compacted
# the thread before it wrote the tell ("• Compacting context (2m 57s • esc to interrupt)"); the
# first message's three minutes ran out, the daemon failed it as "the window never showed its first
# message" and closed the window, and the chief sent the words again from memory.
#
# - The engine reads a window at work by its record, a turn in flight in a conversation that holds
#   one, or by its screen, its harness's status that it compacts (`Window::compacting`, read in
#   `crates/cf-harness/src/shared/compacting.rs` for Claude Code, Codex and Pi): a launch's first
#   message found so at the end of its time is given its time again, and a later paste is not
#   pasted again while its window compacts (`arrival.rs`, `at_work.rs`). One that waits 15 min on a
#   compaction, or a first message on a window at work on something else, is told once to whoever
#   sent it and the human.
# - A launch given up whose window never showed its prompt says which screen line was waited for,
#   and one never ready says its harness's words for why (T-863, `arrival.rs`'s `never_ready`).
# - Words told to a task's window that fail come back to whoever told them, word for word
#   (`deliveries.rs`'s `words_back` and the told-words failure note).
# - The stand-in Codex compacts at a turn's start for `COMPACT <seconds>` (`fake_codex/agent.rs`),
#   and the live case reads a rollout's compaction before its message (`tests/live_compacting.rs`).
#
# The rig's case builds the native `cf` from the sources as planted, so its plant says `builds`.
# Every name holds `compacting:`, so `npm run plants:daemon -- "compacting:"` runs them all.

[run]
cmp-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "compacting::"]
cmp-engine-delivered = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "first_delivered::"]
cmp-engine-told = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "queued_tells::"]
cmp-harness = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::compacting::"]
cmp-rig = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "regressions", "a_codex_window_compacting_before_its_first_message_was_closed::"], builds = true }
cmp-stand-in = ["cargo", "test", "--offline", "-p", "cf-e2e", "--bin", "fake-codex", "agent::"]
cmp-live = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_compacting", "tests::"]

