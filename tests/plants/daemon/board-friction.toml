runs = ["friction-last-need"]

[[plant.edit]]
file = "crates/cf-ledger/src/tasks/finishing.rs"
find = "       WHERE t.project_id = ? AND t.state = 'open' AND t.assignee_id IS NOT NULL\n         AND NOT EXISTS (SELECT 1 FROM task_need n JOIN task d ON d.id = n.needs_id"
replace = "       WHERE t.project_id = ? AND t.state = 'open' AND t.assignee_id IS NOT NULL\n         AND EXISTS (SELECT 1 FROM task_need n WHERE n.task_id = t.id)\n         AND NOT EXISTS (SELECT 1 FROM task_need n JOIN task d ON d.id = n.needs_id"

