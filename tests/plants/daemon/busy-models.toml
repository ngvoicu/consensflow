# A temporary model error failed the task (T-1112, Gabriel's field report, 2026-11-02): a
# designer's Codex window ended on "Selected model is at capacity. Please try a different
# model." (`codex_error_info` `server_overloaded`), and ConsensFlow failed its task, though its
# work was saved. A model overloaded or at capacity, a server's error (a 5xx, Anthropic's 529),
# is a refusal of its provider for a moment: waiting cures it.
#
# The rules: each harness's reader reads such a refusal from its own record as
# `Quota::Busy` (`crates/cf-harness/src/shared/quota.rs`'s `busy_refusal`, called by the readers
# of Claude Code, Codex, Pi, Devin and Muse), after a quota (a 429) and an account's refusal (a
# 401, a 402), which stay theirs. The engine takes it as it takes a refusal, never as the
# turn's failure: the task is held with its window and its member is out until a backoff, a
# minute, then two, then four (`crates/cf-engine/src/scheduler.rs`, `BUSY_BACKOFF_MS`,
# `busy_reset`, `hold_busy`); once those tries are refused too, a task given by tier goes to
# another free member of its tier, or is held on and tried every five minutes while none is
# free (`BUSY_HOLD_MS`). Its requester is told once, plainly (`note_hold_busy`), and told again
# only where that note was withdrawn before it was given. A turn through begins the tries
# again. A chief's busy turn is still the human's to hear. The lane and the board say the
# model is busy. The engine's tests are `crates/cf-engine/tests/dispatcher/busy_models.rs`; the
# readers' are beside each reader.
#
# Every name holds `busy-models`, so `cargo xtask plants daemon busy-models` runs them all.

[run]
busy-models-engine = ["cargo", "test", "--offline", "-p", "cf-engine", "--test", "dispatcher", "busy_models::"]
busy-models-readers = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib"]

[[plant]]
name = "busy-models: a busy model's refusal is the turn's failure"
meant = "busy_models::a_busy_model_holds_the_task_with_its_window_and_tries_it_again_after_a_minute"
runs = ["busy-models-engine"]

[[plant.edit]]
file = "crates/cf-harness/src/shared/quota.rs"
find = '''
            | Quota::Moved { .. }
            | Quota::Busy { .. } => Level::Exhausted,
'''
replace = '''
            | Quota::Moved { .. } => Level::Exhausted,
            Quota::Busy { .. } => Level::Ok,
'''

