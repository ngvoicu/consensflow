# Members' models from their harness (T-1143, staff-chains' CHN-10 moved ahead): Add member and
# Edit member in Project settings pick a harness, a model that harness lists of itself
# (`models.get`, CHF-03), an effort it lists for that model and a tier the human chooses; a
# member whose harness no longer lists its model is marked; Refresh reads a harness again.
# The ledger keeps a tier the human chose (migration 0028, `participant.tier_chosen`), which
# `refresh_member_tiers` passes by (crates/cf-ledger/src/staff.rs); the catalog says the
# presets' tier only of a model a preset runs (crates/cf-catalog/src/profile.rs,
# `Catalog::preset_tier`); the daemon checks what was picked against the kept listing and runs
# the member on a saved agent of the human's for it (crates/cf-daemon/src/page/staff.rs,
# crates/cf-daemon/src/roster.rs); the page shares the chief's picker (app/ui/core/dialogs.js,
# `ModelLists`, `ModelPicker`, `MemberPicker`). Every name holds `member models:`:
# `npm run plants:daemon -- "member models:"` runs them.

[run]
mm-ledger = ["cargo", "test", "--offline", "-p", "cf-ledger", "--test", "chosen_tier"]
mm-catalog = ["cargo", "test", "--offline", "-p", "cf-catalog", "--lib", "profile::"]
mm-daemon = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::members::"]
mm-page = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "Add member|adds a member on a model|Edit member|no longer lists its model"]
mm-page-chief = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "Refresh beside the chief"]

