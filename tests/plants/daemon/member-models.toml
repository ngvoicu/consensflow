# Members' models from their harness (T-1143, then harness-models): Add member and Edit member
# in Project settings pick a harness, a model that harness lists of itself (`models.get`,
# CHF-03), an effort it lists for that model and a tier the human chooses, none picked for them;
# a member whose harness no longer lists its model is marked; Refresh reads a harness again. The
# daemon checks what was picked against the kept listing, holds Devin's exact id for the effort,
# and takes a second Add of a model and effort a member runs as roles more for that member
# (crates/cf-daemon/src/page/staff.rs); the page shares the chief's picker (app/ui/core/dialogs.js,
# `ModelLists`, `ModelPicker`, `MemberPicker`). Every name holds `member models:`:
# `npm run plants:daemon -- "member models:"` runs them.

[run]
mm-daemon = ["cargo", "test", "--offline", "-p", "cf-daemon", "--lib", "page::tests::members::"]
mm-page = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "Add member|adds a member on a model|Edit member|no longer lists its model"]
mm-page-listing = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "adds a member on a model its harness lists"]
mm-page-chief = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/core-page.spec.mjs", "-g", "Refresh beside the chief"]

