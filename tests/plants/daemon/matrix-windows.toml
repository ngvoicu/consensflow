# Every harness can sit in a seat of one rig on zeewin2, isolated (T-1136, the live matrix's prerequisites).
# Four rules, each held by tests a Mac runs: a test machine whose Pi has no OpenRouter login runs Pi on
# the model the kit names for that machine, says which, and chooses nothing else (`live/agents.rs`); no two
# harness homes of one rig set one variable to two values (`rig/homes.rs`), the five harnesses' homes
# together among them (`live/isolation/windows.rs`); the shell of every harness on Windows is named with
# where it is known from (`live/members/descent/tests.rs`); and a seat's reply is the word and the command's
# output (`tests/live_seat.rs`). One plant takes one rule out; a test of it fails. Every name holds `matrix`.

[run]
agents-lib = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::agents::"]
homes-lib = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "rig::homes::"]
isolation-windows-lib = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::isolation::windows::"]
descent-lib = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::members::descent::"]
seat-offline = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_seat"]

