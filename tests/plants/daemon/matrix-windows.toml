# Every harness can sit in a seat of one rig on zeewin2, isolated (T-1136, the live matrix's
# prerequisites); and Pi can sit in one on the owner's Mac through the provider its Pi has,
# CLIProxyAPI (T-1172). Rules, each held by tests a Mac runs: a test machine whose Pi has no
# OpenRouter login runs Pi on the model the kit names for that machine, says which, and chooses
# nothing else, and the owner's Mac whose Pi has only the local proxy's `cliproxyapi` login runs
# Pi on `cliproxyapi/muse-spark-1.3-contributor` at `minimal`, says which, and chooses nothing
# else (`live/agents.rs`); a run on a provider the agent folder gives Pi carries its files, its
# package, a `settings.json` that names it and its login with no refresh token, is refused before
# a window where the provider or the proxy is missing, and holds every one of the provider's
# owner files not to change (`live/isolation.rs`, `live/isolation/pi.rs`); a person's Pi window keeps
# the proxy's variables, which only the kit's rigs leave out (`cf-harness`' `shared/window_args.rs`,
# T-1358); no two harness homes of
# one rig set one variable to two values (`rig/homes.rs`), the five harnesses' homes together
# among them (`live/isolation/windows.rs`); the shell of every harness on Windows is named with
# where it is known from (`live/members/descent/tests.rs`); and a seat's reply is the word and
# the command's output (`tests/live_seat.rs`). One plant takes one rule out; a test of it fails.
# Every name holds `matrix`.

[run]
agents-lib = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::agents::"]
homes-lib = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "rig::homes::"]
isolation-windows-lib = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::isolation::windows::"]
descent-lib = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::members::descent::"]
seat-offline = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_seat"]
login-lib = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::login::"]
pi-lib = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::isolation::tests::"]
window-golden = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "shared::window_args::tests::every_window_opens_and_resumes_as_node_built_it"]
launch-lib = ["cargo", "test", "--offline", "-p", "cf-harness", "--lib", "tooling::launch::tests::a_members_pi_window_is_the_adapters_whole"]

