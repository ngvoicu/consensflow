# Plants in the standalone verbs and in the roster they write through: the
# recording of Node's CLI, replayed against the native `cf`, must catch each.

[[plant]]
name = "verbs: a name of the catalog is padded to 13, not 12"
meant = "every_case_says_writes_and_exits_as_node_did"
runs = ["goldens"]

[[plant.edit]]
file = "crates/cf/src/standalone/catalog.rs"
find = "pad_end(&entry.name, 12),"
replace = "pad_end(&entry.name, 13),"

[[plant]]
name = "verbs: the table of a harness is no wider than 33 at the least"
meant = "every_case_says_writes_and_exits_as_node_did"
runs = ["goldens"]

[[plant.edit]]
file = "crates/cf/src/standalone/catalog.rs"
find = ".fold(34, usize::max)"
replace = ".fold(33, usize::max)"

[[plant]]
name = "verbs: the model of an agent is padded to 35, not 36"
meant = "every_case_says_writes_and_exits_as_node_did"
runs = ["goldens"]

[[plant.edit]]
file = "crates/cf/src/standalone/agent.rs"
find = "pad_end(model, 36),"
replace = "pad_end(model, 35),"

[[plant]]
name = "verbs: the home is made before an agent is refused"
meant = "every_case_says_writes_and_exits_as_node_did"
runs = ["goldens"]

[[plant.edit]]
file = "crates/cf/src/standalone/agent.rs"
find = '''
    let catalog = bundled()?;
    match action {'''
replace = '''
    let catalog = bundled()?;
    if let Some(path) = cf_catalog::roster_path(env) {
        let _ = std::fs::create_dir_all(path.parent().unwrap_or(&path));
    }
    match action {'''

