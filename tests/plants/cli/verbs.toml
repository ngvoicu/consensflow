# Plants in the standalone verbs and in the roster they write through: the
# recording of Node's CLI, replayed against the native `cf`, must catch each.

[[plant]]
name = "verbs: the usage ends without its blank line"
meant = "every_case_says_writes_and_exits_as_node_did"
runs = ["goldens"]

[[plant.edit]]
file = "crates/cf/src/standalone/mod.rs"
find = 'writeln!(out, "{}", usage()).map_err(Stop::from)'
replace = 'write!(out, "{}", usage()).map_err(Stop::from)'

[[plant]]
name = "verbs: a refusal exits with 0"
meant = "every_case_says_writes_and_exits_as_node_did"
runs = ["goldens"]

[[plant.edit]]
file = "crates/cf/src/standalone/mod.rs"
find = "Ok(1)"
replace = "Ok(0)"

[[plant]]
name = "verbs: an unknown command is said without JSON's escapes"
meant = "every_case_says_writes_and_exits_as_node_did"
runs = ["goldens"]

[[plant.edit]]
file = "crates/cf/src/standalone/mod.rs"
find = "js::stringify(&Value::from(other))"
replace = 'format!("\"{other}\"")'

[[plant]]
name = "verbs: the usage has no doctor"
meant = "every_case_says_writes_and_exits_as_node_did"
runs = ["goldens"]

[[plant.edit]]
file = "crates/cf/src/standalone/usage.txt"
find = "doctor                                    Inspect runtime, harnesses and bundled roles"
replace = ""
