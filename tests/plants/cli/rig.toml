[[plant]]
name = "rig: a result the chief accepted is not withdrawn"
meant = "a_result_the_chief_read_and_decided_on_in_its_own_turn_is_withdrawn_and_the_next_result_reaches_it"
runs = ["rig-decided-result"]
builds = true

[[plant.edit]]
file = "crates/cf-ledger/src/tasks/finishing.rs"
find = '''
