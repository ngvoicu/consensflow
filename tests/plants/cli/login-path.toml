# Plants in the PATH the app gives its daemon (`app/src-tauri/src/daemon_command.rs`):
# the login shell's, given long enough to answer on a loaded machine, else the app's
# own, as it is (the daemon puts the system's folders after it, and looks for a harness
# on it as given: `daemon/detect.toml`); a line of the app's log when a login shell gave
# none; a lookup bounded by its deadline and ended by the app's quit, which ends the
# shell itself and never what its login files started, and starts none once the app is
# quitting; no lookup on Windows; the page, whose menu's Check for Updates works while
# the daemon waits on that shell; and the tests' own environments, which give no `cf`
# the machine's Homebrew programs. The owner's login shell had not answered in five
# seconds at load 17–18 (2026-10-15, 3.0.4), and the daemon ran on the Finder's PATH: a
# Homebrew `codex` was "not installed", and Homebrew's `git` and `node` were off every
# window's PATH. The two reviews of the fix (2026-10-16) found the rest. One plant takes
# one rule out, or puts one wrong; a test fails. Every name holds `login path`, so
# `npm run plants:cli -- "login path"` runs them all.

[run]
app-daemon-path = ["cargo", "xtask", "app", "test", "daemon_command::"]
# The app's quit, with a start still asking the login shell.
app-quit = ["cargo", "xtask", "app", "test", "quitting_ends_a_login_shell"]
# The page's start with a daemon that has not answered (each plant's `prepare` bundles
# the page's xterm first, as `npm run test:ui` does).
page-late-daemon = ["node", "app/node_modules/@playwright/test/cli.js", "test", "app/tests/updates.spec.mjs", "-g", "daemon has not answered"]
# The environment the scripts' and the page's tests give what they start.
js-helpers = ["node", "--test", "tests/helpers.test.mjs"]
# Every source that starts the cf under test sets a folder for the system's programs.
tool-folders-scan = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "cli", "tool_folders::"]
# The rig's environment.
rig-install = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "rig::install::"]

# How long the login shell has.
