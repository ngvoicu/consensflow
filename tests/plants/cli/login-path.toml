[[plant.edit]]
file = "app/src-tauri/src/daemon_command.rs"
find = "const LOGIN_PATH_TIMEOUT: Duration = Duration::from_secs(30);"
replace = "const LOGIN_PATH_TIMEOUT: Duration = Duration::from_secs(5);"

