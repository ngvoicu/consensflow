[[plant.edit]]
file = "app/src-tauri/src/daemon_command.rs"
find = '''
            let mut asking = self.lock();
            if let Some(shell) = asking.shell.as_mut() {
                let _ = shell.kill();
            }
            asking.shell.take()
        };
        between();
        if let Some(mut shell) = shell {
            let _ = shell.wait();'''
replace = '''
            let mut asking = self.lock();
            asking.shell.take()
        };
        between();
        if let Some(mut shell) = shell {
            let _ = shell.kill();
            let _ = shell.wait();'''

