# A lookup that gives no PATH: bounded, and leaving nothing running.
[[plant]]
name = "login path: the read waits a second for each piece of output, however long it goes on"
meant = "a_shell_that_ends_without_its_path_while_what_it_started_writes_on_is_given_up_by_the_deadline"
runs = ["app-daemon-path"]

[[plant.edit]]
file = "app/src-tauri/src/daemon_command.rs"
find = '''
        let left = deadline.checked_duration_since(Instant::now())?;
'''
replace = ""

[[plant.edit]]
file = "app/src-tauri/src/daemon_command.rs"
find = "                .recv_timeout(left.min(Duration::from_secs(1)))"
replace = '''
                .recv_timeout({
                    let _ = deadline;
                    Duration::from_secs(1)
                })'''

# Only the shell is ended, never what its login files started (the second reviews of
# 2026-10-16: an `ssh-agent -D` a login file left in the shell's group was killed with
# it). Each plant starts the shell in a group of its own and ends the group.
[[plant]]
name = "login path: a lookup given up on ends what the login file started too"
meant = "a_login_shell_that_fails_or_hangs_gives_no_path_and_leaves_what_it_started"
runs = ["app-daemon-path"]

[[plant.edit]]
file = "app/src-tauri/src/daemon_command.rs"
find = "        let mut started = shell.spawn().ok()?;"
replace = '''
        std::os::unix::process::CommandExt::process_group(shell, 0);
        let mut started = shell.spawn().ok()?;'''

[[plant.edit]]
file = "app/src-tauri/src/daemon_command.rs"
find = '''
        if let Some(mut shell) = shell {
            let _ = shell.kill();
'''
replace = '''
        if let Some(mut shell) = shell {
            unsafe { libc::killpg(shell.id() as i32, libc::SIGKILL) };
            let _ = shell.kill();
'''

[[plant]]
name = "login path: the app's quit ends what the login file started too"
meant = "ending_a_lookup_ends_the_shell_it_asks_at_once_and_only_it"
runs = ["app-daemon-path"]

[[plant.edit]]
file = "app/src-tauri/src/daemon_command.rs"
find = "        let mut started = shell.spawn().ok()?;"
replace = '''
        std::os::unix::process::CommandExt::process_group(shell, 0);
        let mut started = shell.spawn().ok()?;'''

[[plant.edit]]
file = "app/src-tauri/src/daemon_command.rs"
find = '''
        if let Some(shell) = asking.shell.as_mut() {
            let _ = shell.kill();
'''
replace = '''
        if let Some(shell) = asking.shell.as_mut() {
            unsafe { libc::killpg(shell.id() as i32, libc::SIGKILL) };
            let _ = shell.kill();
'''

