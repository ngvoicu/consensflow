# The page: the menu's Check for Updates before anything waits on the daemon.
[[plant]]
name = "login path: the page sets up updates only once the daemon has answered"
meant = "the menu check works while the daemon has not answered yet, as when a login shell is slow"
runs = ["page-late-daemon"]
prepare = [["node", "app/scripts/bundle-ui.mjs"]]

[[plant.edit]]
file = "app/ui/core/app.js"
find = '''
  // Updates are the app's, not the daemon's, and listen for the menu's Check for
  // Updates before anything waits on the daemon: its start may wait on a slow login
  // shell for half a minute, and a click before a listener is lost.
  await initializeUpdates({'''
replace = '''
  await readAgents().catch(() => {})
  await initializeUpdates({'''

