# Plants in the scripts that stay and in the check that holds Node's sources gone
# (`crates/cf-e2e/tests/cli/off_node.rs`): a script that imports a library of Node's that
# was deleted, a path of Node's CLI named in a script, an import of a helper that is gone,
# and the check that looks at less than it is to. The check must catch each. (A deleted file
# put back is a plant of no edit: it is planted in a tree of its own, by that file's tests.)

[run]
# The check, as the CLI's suite runs it: the repository's own files, read as they are.
off-node = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "cli", "off_node"]
e2e-lib-checkout = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "checkout::"]
# The check that no file names the removed harness, as the CLI's suite runs it.
removed-harness = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "cli", "a_removed_harness_is_named_nowhere"]

[[plant]]
name = "off node: a page spec imports a helper that is gone"
meant = "has_every_script_import_files_that_are_there"
runs = ["off-node"]

[[plant.edit]]
file = "app/tests/harnesses.spec.mjs"
find = "import { tempEnv } from '../../tests/helpers.mjs'"
replace = "import { tempEnv } from '../../tests/engine/helpers.mjs'"

[[plant]]
name = "off node: a script names the file of Node's CLI"
meant = "names_none_of_them_anywhere_but_where_a_recording_or_an_older_release_says_them"
runs = ["off-node"]

[[plant.edit]]
file = "tests/helpers.mjs"
find = "const WINDOWS = process.platform === 'win32'"
replace = "const WINDOWS = process.platform === 'win32' // run it with node bin/cf.mjs"

[[plant]]
name = "off node: the check does not read the host extensions"
meant = "reads_the_scripts_it_is_to_hold"
runs = ["off-node"]

[[plant.edit]]
file = "crates/cf-e2e/tests/cli/off_node.rs"
find = 'const ROOTS: [&str; 4] = ["tests", "app/tests", "app/scripts", "hosts"];'
replace = 'const ROOTS: [&str; 3] = ["tests", "app/tests", "app/scripts"];'

# T-71 / T-118: a copy without git (the commit gate's export) holds links to folders
# (`node_modules`, `app/.cache`); the walk lists each as the link and no look reads through one.

[[plant]]
name = "off node: a link to a folder is read as the file it points at"
meant = "a_link_to_a_folder_in_a_copy_without_git_is_listed_as_the_link_and_not_read"
runs = ["off-node"]

[[plant.edit]]
file = "crates/cf-e2e/tests/cli/off_node.rs"
find = "        if !checkout::is_plain_file(&under(root, file)) {"
replace = "        if false {"

[[plant]]
name = "off node: a plain file is taken for one that a link to a folder is too"
meant = "a_plain_file_is_neither_a_folder_nor_a_link_to_one_nor_to_a_file_nor_a_broken_link"
runs = ["e2e-lib-checkout"]

[[plant.edit]]
file = "crates/cf-e2e/src/checkout.rs"
find = "    fs::symlink_metadata(path).is_ok_and(|kind| kind.is_file())"
replace = "    path.is_file()"

# The check that no file of the repository names a harness the app removed
# (`crates/cf-e2e/tests/cli/a_removed_harness_is_named_nowhere.rs`, T-570): it reads the names
# and the text of every file, and the unzipped text of every recording, in any case, but in the
# two files that keep the word on purpose. A plant takes one of those looks out, or puts the
# word into a file, and a test of the check fails. The word is written as an escape below, as
# the check would find it in these very files otherwise.

[[plant]]
name = "a removed harness: a recording is not read unzipped"
meant = "finds_it_in_a_text_in_any_case_in_a_recording_and_in_a_name"
runs = ["removed-harness"]

[[plant.edit]]
file = "crates/cf-e2e/tests/cli/a_removed_harness_is_named_nowhere.rs"
find = "        if file.ends_with(\".gz\") {\n"
replace = "        if false && file.ends_with(\".gz\") {\n"

[[plant]]
name = "a removed harness: a file's name is not looked at"
meant = "finds_it_in_a_text_in_any_case_in_a_recording_and_in_a_name"
runs = ["removed-harness"]

[[plant.edit]]
file = "crates/cf-e2e/tests/cli/a_removed_harness_is_named_nowhere.rs"
find = "        if names_it(file.as_bytes()) {\n"
replace = "        if false && names_it(file.as_bytes()) {\n"

[[plant]]
name = "a removed harness: the word in capitals is not found"
meant = "finds_it_in_a_text_in_any_case_in_a_recording_and_in_a_name"
runs = ["removed-harness"]

[[plant.edit]]
file = "crates/cf-e2e/tests/cli/a_removed_harness_is_named_nowhere.rs"
find = "        .to_ascii_lowercase()\n"
replace = "        .to_vec()\n"

[[plant]]
name = "a removed harness: the two files that keep it are not told from the others"
meant = "leaves_the_two_files_that_keep_it_alone"
runs = ["removed-harness"]

[[plant.edit]]
file = "crates/cf-e2e/tests/cli/a_removed_harness_is_named_nowhere.rs"
find = "        if KEPT.contains(&file.as_str()) {\n"
replace = "        if false && KEPT.contains(&file.as_str()) {\n"

[[plant]]
name = "a removed harness: a keyword of package.json names it"
meant = "names_it_nowhere_in_the_repository_but_in_the_two_places_that_keep_it"
runs = ["removed-harness"]

[[plant.edit]]
file = "package.json"
find = "    \"codex\",\n    \"pi\",\n"
replace = "    \"codex\",\n    \"\u006fpencode\",\n    \"pi\",\n"

[[plant]]
name = "a removed harness: the rule reads files git does not track"
meant = "reads_what_git_tracks_and_not_what_lies_untracked_beside_it"
runs = ["removed-harness"]

[[plant.edit]]
file = "crates/cf-e2e/tests/cli/off_node.rs"
find = "    listed(root, false)\n"
replace = "    listed(root, true)\n"
