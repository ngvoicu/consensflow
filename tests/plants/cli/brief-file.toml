# Every command that takes words takes `--file <path>` for them, and a flag
# the command does not know, in front of the words, is refused rather than
# kept as the words. One plant takes one piece out; a test of it fails. The
# field report these rules were made for (2026-11-02): `cf task done T-1110
# --file /tmp/result.md` stored "--file /tmp/result.md" as the result.

[run]
# The commands run as a window runs them, against a scripted API.
brief = ["cargo", "test", "--offline", "-p", "cf", "--test", "brief_from_a_file"]
# The words parser's own tests.
words = ["cargo", "test", "--offline", "-p", "cf", "--lib", "board::words::"]
# What encoding a text may come in, from a file and from standard input (T-1435, the review T-1447).
encodings = ["cargo", "test", "--offline", "-p", "cf", "--test", "brief_encodings"]
# The same for every command of `cf help` that takes a text.
class = ["cargo", "test", "--offline", "-p", "cf", "--test", "text_commands"]

[[plant]]
name = "a brief's file: the moved task commands do not know --file, and it is words"
meant = "a_task_done_takes_its_result_from_a_file_as_the_report_ran_it"
runs = ["brief"]

[[plant.edit]]
file = "crates/cf/src/board/task.rs"
find = "const FILED: Shape = Shape {\n    valued: &[brief::FILE],"
replace = "const FILED: Shape = Shape {\n    valued: &[],"

[[plant]]
name = "a brief's file: note, ask and answer do not know --file, and it is words"
meant = "every_command_that_takes_words_takes_a_file_of_them"
runs = ["brief"]

[[plant.edit]]
file = "crates/cf/src/board/mod.rs"
find = '''
    switches: &["--human"],
    valued: &[brief::FILE],'''
replace = '''
    switches: &["--human"],
    valued: &[],'''

[[plant]]
name = "a brief's words: a flag a command does not know in front of them is kept"
meant = "a_flag_the_command_does_not_know_in_front_of_the_words_is_refused_not_kept"
runs = ["brief"]

[[plant.edit]]
file = "crates/cf/src/board/words.rs"
find = "            if split.stray.is_none()"
replace = "            if split.stray.is_some()"

# What encoding a text may come in. Windows PowerShell 5.1 writes what `>` and `Out-File` send to a
# file as UTF-16 with a byte order mark; `cf` once posted it read as UTF-8, `��W\0r\0i\0…`, and the
# ledger took it as a brief (the review T-1447 of T-1435, finding 1): the wrong result is silent.
# UTF-8 with or without its mark and UTF-16 with a mark are the text; any other bytes that are not
# valid UTF-8 are refused, and nothing is posted. One plant takes one piece out.

[[plant]]
name = "a brief's encoding: a NUL byte is text"
meant = "a_text_that_is_not_utf8_or_utf16_with_a_mark_is_refused_and_nothing_is_posted"
runs = ["encodings", "class"]

[[plant.edit]]
file = "crates/cf/src/board/brief.rs"
find = '''    if let Some(at) = bytes.iter().position(|byte| *byte == 0) {'''
replace = '''    if let Some(at) = bytes.iter().position(|byte| *byte == 0).filter(|_| false) {'''

[[plant]]
name = "a brief's encoding: what is not UTF-8 is read lossily, and posted"
meant = "a_text_that_is_not_utf8_or_utf16_with_a_mark_is_refused_and_nothing_is_posted"
runs = ["encodings", "class"]

[[plant.edit]]
file = "crates/cf/src/board/brief.rs"
find = '''    String::from_utf8(bytes.to_vec()).map_err(|cause| {'''
replace = '''    #[allow(unreachable_code)]
    return Ok(String::from_utf8_lossy(bytes).into_owned());
    #[allow(unreachable_code)]
    String::from_utf8(bytes.to_vec()).map_err(|cause| {'''

