# Plants in the parser the verbs read their words with (`cf_base::args`), and
# in the padding of their tables: the recording of Node's `parseArgs` and of the
# CLI must catch each.

[[plant]]
name = "parser: a value of two units is no option-like value, only one of three"
meant = "every_list_of_words_is_read_as_node_reads_it"
runs = ["args"]

[[plant.edit]]
file = "crates/cf-base/src/args.rs"
find = "value.len() > 1 && value.starts_with('-')"
replace = "value.len() > 2 && value.starts_with('-')"

