'''

# A byte order mark before the words (Windows PowerShell 5.1 pipes one, Notepad saves one) is no
# part of them (CI run 41767889064; T-1177). Since T-1435 one function decodes a file and standard
# input alike (`brief::words_of`), so one plant takes the mark out of both.

[[plant]]
name = "text: a byte order mark before the words, piped or in a file, stays in them"
meant = "a_byte_order_mark_before_a_brief_on_standard_input_or_in_a_file_is_no_part_of_it"
runs = ["cf-text-mark"]

[[plant.edit]]
file = "crates/cf/src/board/brief.rs"
find = '''
        [0xef, 0xbb, 0xbf, rest @ ..] => (utf8(rest, 3)?, false),
'''
replace = ''''''
