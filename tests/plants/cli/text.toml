runs = ["cf-text"]

[[plant.edit]]
file = "crates/cf/src/board/usage.txt"
find = '''
  cf answer m-12 "…"                answer a question put to you
'''
replace = ""

[[plant]]
name = "text: a command reads a text and the table does not have it"
meant = "a_function_that_reads_a_text_is_a_command_of_the_table"
runs = ["cf-text"]

[[plant.edit]]
file = "crates/cf/src/board/mod.rs"
find = '''
fn staff(rest: &[String], board: &Board) -> Result<Said, Failure> {
'''
replace = '''
fn staff(rest: &[String], board: &Board) -> Result<Said, Failure> {
    let _ = text_of(String::new(), &mut io::empty());
'''
