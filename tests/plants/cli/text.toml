# The text a board command is given (issue `brief-backticks-run-as-commands`, and the argument cut at
# a line break of `cmd-cuts-multiline-cf-arguments`): `text_of` reads standard input when the text is
# `-`, the commands that give a window work read a file too (`--file`), and an argument arrives
# whole. `crates/cf/tests/text_commands.rs` runs every command of the table `cf help` prints that
# ends in a text, so a plant at one command's reading fails it, not a test of that command alone.
# The names begin `text:`, so `npm run plants:cli -- "text:"` runs them. The plants that edit the
# usage and the sources only take a command out of the table or put a reader in that it has no line
# for; the one test over the sources (`a_function_that_reads_a_text_is_a_command_of_the_table`) says.

[run]
cf-text = ["cargo", "test", "--offline", "-p", "cf", "--test", "text_commands"]
cf-text-mark = ["cargo", "test", "--offline", "-p", "cf", "--test", "brief_from_stdin"]

# `text_of` itself.

[[plant]]
name = "text: a dash is the text, standard input is not read"
meant = "every_command_that_takes_a_text_reads_it_from_standard_input_at_a_dash"
runs = ["cf-text"]

[[plant.edit]]
file = "crates/cf/src/board/mod.rs"
find = '    if text != "-" {'
replace = '    if true {'

[[plant]]
name = "text: the heredoc's last line break stays in the text"
meant = "every_command_that_takes_a_text_reads_it_from_standard_input_at_a_dash"
runs = ["cf-text"]

[[plant.edit]]
file = "crates/cf/src/board/brief.rs"
find = '''
    let text = text
        .strip_suffix("\r\n")
        .or_else(|| text.strip_suffix('\n'))
        .unwrap_or(&text);
    Ok(text.to_owned())
'''
replace = '''
    Ok(text.to_string())
'''

[[plant]]
name = "text: a Windows line ending stays in the text, as PowerShell and type end what they pipe"
meant = "every_command_that_takes_a_text_reads_it_from_standard_input_at_a_dash"
runs = ["cf-text"]

[[plant.edit]]
file = "crates/cf/src/board/brief.rs"
find = '''
        .strip_suffix("\r\n")
        .or_else(|| text.strip_suffix('\n'))
        .unwrap_or(&text);
    Ok(text.to_owned())
'''
replace = '''
        .strip_suffix('\n')
        .unwrap_or(&text);
    Ok(text.to_owned())
'''

# Each place a command reads its text: one forgets the dash, the others go on reading it.

