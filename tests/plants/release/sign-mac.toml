# Plants in the Mac signing (tools/cf-release, `cf-release sign-mac`): the order
# an app is signed in, what is cleaned up when a call fails, what is kept
# secret, and what the notary and Gatekeeper are asked and held to. The
# crate's tests, which run the steps against a script in place of Apple's
# tools, must catch each.

[run]
# The steps against the script: the order of the calls, the cleanup, the secrets.
sign-mac = ["cargo", "test", "--offline", "-p", "cf-release", "--lib", "sign_mac::"]
# The command as a process, with the tools of the system.
with-apples-tools = ["cargo", "test", "--offline", "-p", "cf-release", "--test", "sign_mac"]

# A keychain with the Developer ID's key left on the machine of whoever ran this.
[[plant]]
name = "sign-mac: the keychain is not removed, nor the search list put back, when a call fails"
meant = "whichever_call_fails_the_search_list_is_back_the_keychain_is_gone_and_the_run_ends_there"
runs = ["sign-mac"]

[[plant.edit]]
file = "tools/cf-release/src/sign_mac/keychain.rs"
find = '''
    tools.attempt("security", restored);
    tools.attempt("security", args!["delete-keychain", &keychain]);
'''
replace = '''
    if result.is_ok() {
        tools.attempt("security", restored);
        tools.attempt("security", args!["delete-keychain", &keychain]);
    }
'''

[[plant]]
name = "sign-mac: the keychain is deleted only when the run went well"
meant = "whichever_call_fails_the_search_list_is_back_the_keychain_is_gone_and_the_run_ends_there"
runs = ["sign-mac"]

[[plant.edit]]
file = "tools/cf-release/src/sign_mac/keychain.rs"
find = '''
    tools.attempt("security", args!["delete-keychain", &keychain]);
'''
replace = '''
    if result.is_ok() {
        tools.attempt("security", args!["delete-keychain", &keychain]);
    }
'''

[[plant]]
name = "sign-mac: the search list is put back only when the run went well"
meant = "whichever_call_fails_the_search_list_is_back_the_keychain_is_gone_and_the_run_ends_there"
runs = ["sign-mac"]

[[plant.edit]]
file = "tools/cf-release/src/sign_mac/keychain.rs"
find = '''
    tools.attempt("security", restored);
'''
replace = '''
    if result.is_ok() {
        tools.attempt("security", restored);
    }
'''

# The bundle's seal covers what is in it: a file signed after it breaks the seal.
[[plant]]
name = "sign-mac: an inner binary is signed after the app that contains it"
meant = "what_a_bundle_seals_is_signed_before_the_bundle_and_the_ticket_is_on_the_app_before_the_dmg_holds_it"
runs = ["sign-mac"]

[[plant.edit]]
file = "tools/cf-release/src/sign_mac/signing.rs"
find = '''
    let entitlements = entitlements.to_string_lossy();
    codesign(
        tools,
        signing,
        app,
        &["--options", "runtime", "--entitlements", &entitlements],
    )
}'''
replace = '''
    Ok(())
}'''

[[plant.edit]]
file = "tools/cf-release/src/sign_mac/signing.rs"
find = '''
    for path in macho::mach_os(app)?
'''
replace = '''
    codesign(
        tools,
        signing,
        app,
        &["--options", "runtime", "--entitlements", &entitlements.to_string_lossy()],
    )?;
    for path in macho::mach_os(app)?
'''

