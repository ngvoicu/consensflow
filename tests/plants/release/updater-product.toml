# Plants in the product that the updater smoke (`npm run smoke:updater`) must
# fail on, each rebuilding what it plants and running the smoke on the result:
# the daemon's readiness taken out (the app says nothing of the cf it starts; the
# daemon logs no start), the ledger's check taken out (a second daemon opens the
# ledger the first holds; an update empties it), the refused update's check
# taken out (the installed app takes a bundle with no `cf`, and one whose seal is
# broken), and the update's own work taken out (no repair of the terminal
# command, a repair of another home's, a daemon that is not the cf the log
# names).
#
# They need the smoke's builds to have been made once, at the paths below, in
# app/src-tauri/target/updater-smoke of the checkout: the installed flip app, the
# update, the installed bridge app (whose terminal command is the old shape, the one
# thing the repair at the app's start has to work on), and the bridge's source, which
# the check of an update is planted in, as the installed app is the one that judges
# an update. Three commands make them (the smoke's default cache is outside the
# checkout, so that what it builds there is built with its own Cargo configuration;
# `--build-only` builds, says where, and runs nothing):
#
#   cargo xtask smoke-updater --build-only --from bridge --cache app/src-tauri/target/updater-smoke
#   cargo xtask smoke-updater --build-only --from flip --to-app app/src-tauri/target/updater-smoke/update/ConsensFlow.app
#   /usr/bin/ditto <the "installed flip app" the second says> app/src-tauri/target/updater-smoke/flip/ConsensFlow.app
#
# The first builds the bridge and the update in the checkout's folder: the bridge's
# Cargo configuration holds no `xtask` alias, so reading the checkout's as well does
# no harm there. The flip release cannot be built in the checkout (its configuration
# holds the alias, which both would write, doubled: its `prepare-sidecar` is `cargo
# xtask stage`), nor can it be asked for in the first command, which builds the flip
# before the bridge when no `--from` is given. So the second builds it in the smoke's
# default cache, taking the update the first built, and the third copies it in. They
# are built into a folder of their own, so what a run kept is not replaced by a
# plant's.

[run]
smoke-flip-update = ["cargo", "xtask", "smoke-updater", "--from-app", "app/src-tauri/target/updater-smoke/flip/ConsensFlow.app", "--from-release", "flip", "--cache", "app/src-tauri/target/updater-smoke-plants", "--only", "the update installs and restarts", "--timeout", "60000"]
smoke-bridge-refused = ["cargo", "xtask", "smoke-updater", "--from", "bridge", "--bridge", "app/src-tauri/target/updater-smoke/bridge-source", "--to-app", "app/src-tauri/target/updater-smoke/update/ConsensFlow.app", "--cache", "app/src-tauri/target/updater-smoke-plants", "--only", "refused", "--timeout", "60000"]
# The installed app built from the planted sources, which performs the restart, updated to the
# update the run of `cargo xtask smoke-updater --from flip --flip . --cache
# app/src-tauri/target/updater-smoke-sweep` kept (built from this checkout, unplanted): the
# restart is the planted build's. Nothing is exported, so the cache may be in the checkout.
smoke-own-update = ["cargo", "xtask", "smoke-updater", "--from", "flip", "--flip", ".", "--to-app", "app/src-tauri/target/updater-smoke-sweep/update/ConsensFlow.app", "--cache", "app/src-tauri/target/updater-smoke-sweep-plants", "--only", "the update installs and restarts", "--timeout", "60000"]
smoke-bridge-update = ["cargo", "xtask", "smoke-updater", "--from-app", "app/src-tauri/target/updater-smoke/bridge/ConsensFlow.app", "--from-release", "bridge", "--cache", "app/src-tauri/target/updater-smoke-plants", "--only", "the update installs and restarts", "--timeout", "60000"]

# Readiness: what the smoke reads of an app that started its daemon.
[[plant]]
name = "updater product: the app does not say which cf it starts"
meant = "the update installs and restarts"
runs = ["smoke-flip-update"]
builds = true
requires = ["app/src-tauri/target/updater-smoke/flip/ConsensFlow.app"]

[[plant.edit]]
file = "app/src-tauri/src/daemon_command.rs"
find = '''
    eprintln!("consensflow: {}", starting(&cf));
'''
replace = ""

[[plant]]
name = "updater product: the daemon logs no start line"
meant = "the update installs and restarts"
runs = ["smoke-flip-update"]
builds = true
requires = ["app/src-tauri/target/updater-smoke/flip/ConsensFlow.app"]

[[plant.edit]]
file = "crates/cf-daemon/src/start.rs"
find = '''
    log.info(&format!(
        "start pid {} rust {VERSION} home {}",
        std::process::id(),
        home.display()
    ));
'''
replace = ""

# The ledger's check: one holder, and what it holds.
[[plant]]
name = "updater product: a second daemon opens the ledger the first holds"
meant = "the update installs and restarts"
runs = ["smoke-flip-update"]
builds = true
requires = ["app/src-tauri/target/updater-smoke/flip/ConsensFlow.app"]

[[plant.edit]]
file = "crates/cf-ledger/src/ledger.rs"
find = '''
        db.execute_batch("PRAGMA locking_mode = EXCLUSIVE")?;
'''
replace = ""

[[plant.edit]]
file = "crates/cf-ledger/src/ledger.rs"
find = '''
        db.execute_batch("BEGIN EXCLUSIVE; COMMIT")?;
'''
replace = ""

[[plant]]
name = "updater product: the update empties the events of the ledger it opens"
meant = "the update installs and restarts"
runs = ["smoke-flip-update"]
builds = true
requires = ["app/src-tauri/target/updater-smoke/flip/ConsensFlow.app"]

[[plant.edit]]
file = "crates/cf-ledger/src/ledger.rs"
find = '''
        migrate(&db, &MIGRATIONS)
    })();'''
replace = '''
        migrate(&db, &MIGRATIONS)?;
        db.execute_batch("DELETE FROM event")?;
        Ok(())
    })();'''

# The refused update's check: the installed app's, which is the bridge's.
[[plant]]
name = "updater product: the installed app takes a bundle with no cf"
meant = "without-cf"
runs = ["smoke-bridge-refused"]
builds = true
prepare = [
  ["cargo", "xtask", "smoke-updater", "--export-bridge", "--cache", "app/src-tauri/target/updater-smoke"],
]
requires = ["app/src-tauri/target/updater-smoke/update/ConsensFlow.app"]

[[plant.edit]]
file = "app/src-tauri/target/updater-smoke/bridge-source/app/src-tauri/src/update_install.rs"
find = '''
    if !app.join("Contents/Resources/cli/bin/cf").is_file() {
        return Err("The archive must include cf, the command a window runs".into());
    }
'''
replace = ""

[[plant]]
name = "updater product: the installed app takes a bundle whose seal is broken"
meant = "tampered"
runs = ["smoke-bridge-refused"]
builds = true
prepare = [
  ["cargo", "xtask", "smoke-updater", "--export-bridge", "--cache", "app/src-tauri/target/updater-smoke"],
]
requires = ["app/src-tauri/target/updater-smoke/update/ConsensFlow.app"]

[[plant.edit]]
file = "app/src-tauri/target/updater-smoke/bridge-source/app/src-tauri/src/update_install.rs"
find = "    if !signature.status.success() {"
replace = "    if false && !signature.status.success() {"

# What the update does of its own.
[[plant]]
name = "updater product: the app does not repair the terminal command at its start"
meant = "the update installs and restarts"
runs = ["smoke-bridge-update"]
builds = true
requires = ["app/src-tauri/target/updater-smoke/bridge/ConsensFlow.app"]

[[plant.edit]]
file = "app/src-tauri/src/lib.rs"
find = '''
        launcher::repair_in_background(app.handle());
'''
replace = ""

[[plant]]
name = "updater product: the app repairs a command that serves another home"
meant = "the update installs and restarts"
runs = ["smoke-bridge-update"]
builds = true
requires = ["app/src-tauri/target/updater-smoke/bridge/ConsensFlow.app"]

[[plant.edit]]
file = "crates/cf-launcher/src/repair.rs"
find = '''
    if !serves(&text, windows, env) {
        return Repair::Elsewhere;
    }
'''
replace = ""

# The app's log names the bundle's cf, and another program is what it starts: only the process
# the machine shows tells.
[[plant]]
name = "updater product: the app starts another program than the cf its log names"
meant = "the update installs and restarts"
runs = ["smoke-flip-update"]
builds = true
requires = ["app/src-tauri/target/updater-smoke/flip/ConsensFlow.app"]

[[plant.edit]]
file = "app/src-tauri/src/daemon_command.rs"
find = "    let mut command = Command::new(cf);"
replace = '    let mut command = Command::new("/usr/bin/true");'

# The new app holds nothing of the old one's: Tauri's restart starts it with a bare `Command`, and
# the old app marks every descriptor close-on-exec first, in its last code (`at_exit`), and before
# a restart Tauri starts on the spot (`restart_swept`). The last code's sweep taken out and the
# install's restart called bare, the new app holds the two descriptors the smoke left the
# installed app (descriptors.rs of the smoke). The restart called bare with the last code's sweep
# in place is no fault: the restart is still swept.
[[plant]]
name = "updater product: the app restarts holding every descriptor it was left"
meant = "the update installs and restarts"
runs = ["smoke-own-update"]
builds = true
requires = ["app/src-tauri/target/updater-smoke-sweep/update/ConsensFlow.app"]

[[plant.edit]]
file = "app/src-tauri/src/lib.rs"
find = """
    #[cfg(target_os = "macos")]
    if let Err(failed) = cf_process::close_all_on_exec() {
        eprintln!("ConsensFlow ends holding descriptors it could not mark close-on-exec: {failed}");
    }"""
replace = ""

[[plant.edit]]
file = "app/src-tauri/src/updates.rs"
find = "restart_swept(|| -> Value { app.restart() })"
replace = "app.restart()"
