# The release commands (tools/xtask/src/release): `release alpha` and `release promote`,
# every check and step held by the module's own tests, on a checkout with real remotes and a
# GitHub that is a script (src/release/tests/fake.rs). Their library tests build no program.

[run]
release-commands = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "xtask", "--lib", "--", "release::"]

[[plant]]
