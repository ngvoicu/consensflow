# The release's gate: `cf-release ci-passed` (tools/cf-release/src/ci_passed.rs), whether CI's
# full gate (ci.yml) passed the exact commit on both platforms, by its platforms' summary jobs;
# the release workflow's `gate` job that runs it in place of the gate (.github/workflows/release.yml);
# and CI's own triggers (.github/workflows/ci.yml): a promotion's branch runs it, and no workflow
# calls it. Each refusal is held by the module's tests, the step as written by
# tools/cf-release/tests/ci_passed.rs, and the workflows' text by cf-publish's tests/release_tool.rs.

[run]
# The rule, against a GitHub that is a script.
ci-passed = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "cf-release", "--lib", "--", "ci_passed::"]
# The gate's step as written, the tool built and a gh that answers from files.
gate-step = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "cf-release", "--test", "ci_passed"]
# The workflows' text: the gate job, the publish job that needs it, CI's triggers.
workflow-text = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "cf-publish", "--test", "release_tool", "--test", "release_publish"]

[[plant]]
name = "ci-gate: a green run of another commit is taken"
meant = "ci_green_on_another_commit_is_not_this_ones"
runs = ["ci-passed", "gate-step"]

[[plant.edit]]
file = "tools/cf-release/src/ci_passed.rs"
find = "runs.iter().filter(|run| run.commit == commit).collect();"
replace = "runs.iter().collect();"

[[plant]]
name = "ci-gate: a pull request's run is taken for the commit's"
