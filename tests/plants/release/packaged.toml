# Plants in the packaged smoke and in the candidate builder, both in Rust: the
# smoke's parts (crates/cf-e2e/tests/smoke/ and the paste reader it runs), the
# command that runs it (`cargo xtask smoke`, tools/xtask/src/smoke.rs) and the
# candidate (`cargo xtask candidate`, tools/xtask/src/candidate.rs). What a
# plant is held to is the tests of each, which need no app and no install: the
# smoke's against stand-in apps, the candidate's against a system that is a
# script on a temporary tree, never the real /Applications or a real home.
#
# The plants of the last block plant what only a real app shows, the steps of
# the smoke's own case and its stand-in harness: they run the packaged smoke
# itself, on the app a build of the checkout leaves (`npm --prefix app run build
# -- --bundles app`), and are refused where there is none. They run under
# nextest as every plant does (`cargo xtask smoke` as the runner starts it has
# no `--nocapture`), and they want a window: on a locked screen the app's page
# is put to sleep about 30 s after it starts, so a run that is slower than that
# (a busy Mac) fails at whatever step it is on, plant or none. The smoke has one
# test, so the runner's catch names it for any failure: a catch that took
# minutes is that, and is read in the failure's words (T-429).

[run]
# The tests of the smoke's parts: the bundle, the machine, the app, the extension.
smoke-parts = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "cf-e2e", "--test", "smoke"]
# The reader of a large paste that the stand-in harness runs.
smoke-paste-reader = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "cf-e2e", "--bin", "smoke-paste-reader"]
# The command that runs the smoke: its own tests, the packaged smoke's and not the updater's.
smoke-command = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "xtask", "--lib", "--", "smoke::", "--skip", "updater_smoke"]
# The same command started as a process, against a stand-in for cargo.
smoke-command-run = ["cargo", "test", "--offline", "--target-dir", "app/src-tauri/target/xtask-check", "--no-fail-fast", "-p", "xtask", "--test", "drivers"]
# The candidate's steps, on a machine of the test's own.
candidate-steps = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "xtask", "--lib", "--", "candidate::"]
# The packaged smoke, on the app a build leaves.
smoke-on-the-app = ["cargo", "xtask", "smoke"]
# The page's half of the smoke: how long it waits, and when a flood has stopped (in fake time).
selftest-wait = ["node", "--test", "tests/selftest-wait.test.mjs"]
# The app's door for the smoke: what the page is told.
app-selftest = ["cargo", "xtask", "app", "test", "the_selftest"]
# Whether the screen is locked, which every smoke that shows a window asks first.
screen-reader = ["cargo", "test", "--offline", "--target-dir", "app/src-tauri/target/xtask-check", "--no-fail-fast", "-p", "xtask", "--lib", "--", "screen::"]
# The updater smoke's driver: what it is given, what it says, the status it answers.
updater-smoke-driver = ["cargo", "test", "--offline", "--target-dir", "app/src-tauri/target/xtask-check", "--no-fail-fast", "-p", "xtask", "--lib", "--", "updater_smoke::tests::"]

