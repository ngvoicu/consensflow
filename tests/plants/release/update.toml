# Plants in the tool that makes the update feed's entry (tools/cf-release,
# `prepare-update`): what holds an archive to its bundle (a path, a kind, a
# mode, a size, a hash), what keeps an archive from being unpacked against the
# machine, the versions that must agree, the shape of the signature, the
# channel, the date and the notes, and the workflow's use of the tool. The
# tool's own tests (its unit tests, and the command run on bundles and archives
# made in the test) must catch each, and the workflow's text test the last.

[run]
# The command, on a bundle, an archive, a signature and notes made for each test.
prepare-update = ["cargo", "test", "--offline", "-p", "cf-release", "--test", "prepare_update"]
# The pure parts: the signature, the date, the channel, the paths, the trees, the entry.
release-lib = ["cargo", "test", "--offline", "-p", "cf-release", "--lib"]
# The workflow's text: where the tool is built, and what runs it.
release-tool = ["cargo", "test", "--offline", "-p", "cf-publish", "--test", "release_tool"]

# What an archive is held to.
[[plant]]
name = "update: an archive entry with a different mode passes"
meant = "rejects_an_entry_whose_mode_is_not_the_bundles"
runs = ["prepare-update", "release-lib"]

[[plant.edit]]
file = "tools/cf-release/src/update/tree.rs"
find = "(Some(in_bundle), Some(in_archive)) if in_bundle == in_archive => None,"
replace = "(Some(in_bundle), Some(in_archive)) if in_bundle.kind == in_archive.kind => None,"

[[plant]]
name = "update: a set-user-id or sticky bit that the bundle does not have passes"
meant = "rejects_a_set_user_id_or_sticky_bit_that_the_bundle_does_not_have"
runs = ["prepare-update"]

[[plant.edit]]
file = "tools/cf-release/src/update/archive.rs"
find = "let mode = entry.header().mode()? & PERMISSION_BITS;"
replace = "let mode = entry.header().mode()? & 0o777;"

[[plant]]
name = "update: a file with other bytes of the same length passes"
meant = "rejects_bytes_that_differ_and_are_as_many"
runs = ["prepare-update"]

[[plant.edit]]
file = "tools/cf-release/src/update/tree.rs"
find = "Ok((size, hex))"
replace = "Ok((size, String::new()))"

[[plant]]
name = "update: an archive with a path more than the bundle has passes"
meant = "rejects_a_path_the_archive_has_and_the_bundle_has_not_and_the_other_way"
runs = ["prepare-update", "release-lib"]

[[plant.edit]]
file = "tools/cf-release/src/update/tree.rs"
find = '(None, Some(_)) => Some(format!("{name} is in the archive and not in the bundle")),'
replace = "(None, Some(_)) => None,"

[[plant]]
