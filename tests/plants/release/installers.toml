runs = [["node", "--test", "--test-name-pattern", "signed for another release", "tests/install-sh.test.mjs"]]
platforms = ["macos"]

[[plant.edit]]
file = "install/install.sh"
find = "  if (named === null || named[1] !== fileName) {"
replace = "  if (named === null) {"

[[plant]]
