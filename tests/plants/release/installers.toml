# Plants in the one-line installers (install/install.sh, install/install.ps1)
# and in what a release gives them: each check a script makes before it
# installs, its own Ed25519 and BLAKE2b, how it installs, and the signed
# SHA256SUMS the release workflow makes (`sign`) and the publisher publishes
# (tools/cf-publish/src/sums.rs). The Mac's script is tried on macOS, Windows'
# on Windows. install.ps1's refusal of Linux has no plant: it is tried only where
# PowerShell 7 runs on Linux, and no machine runs the plants there; the
# Installers workflow's Linux job runs its test.

[run]
# The Mac's script against a scripted feed, a test at a time (its DMGs are made first).
sh = ["node", "--test", "tests/install-sh.test.mjs"]
# Both scripts' signature checks on RFC 8032's and RFC 7693's vectors and Tauri's signatures.
verifiers = ["node", "--test", "tests/install-verifiers.test.mjs"]
# Windows' script against a scripted feed, in Windows PowerShell and PowerShell 7.
ps1 = ["node", "--test", "tests/install-ps1.test.mjs"]
# The publisher's signed SHA256SUMS: what it publishes, what it checks after, and `cf-publish sums`.
signed-sums = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "cf-publish", "--test", "publish_release", "--test", "feeds_check", "--test", "sums_cli"]
# The sign job of the release workflow: its text, and its steps run as written.
sign-job = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "cf-publish", "--test", "release_sign", "--test", "release_publish"]

# --- install.sh: the signature of SHA256SUMS ---

[[plant]]
name = "installers: install.sh installs whatever its signature check says"
meant = "a flipped bit in the signature is refused"
runs = [["node", "--test", "--test-name-pattern", "the signature of SHA256SUMS", "tests/install-sh.test.mjs"]]
platforms = ["macos"]

[[plant.edit]]
file = "install/install.sh"
find = '    if [ "$checked" != ok ]; then'
replace = '    if false; then'

[[plant]]
name = "installers: install.sh does not check the trusted comment's signature"
meant = "the installers' signature check › install.sh's, in macOS's JavaScript (osascript) › tauri signer's signatures hold, and each changed one is refused, saying why"
runs = ["verifiers"]
platforms = ["macos"]

[[plant.edit]]
file = "install/install.sh"
find = "  if (commentBytes === null || !ed25519Verify(publicKey, concat([signature.subarray(10), commentBytes]), global)) {"
replace = "  if (commentBytes === null) {"

[[plant]]
