# Plants in the tools that build and release (tools/xtask, tools/cf-release): the
# version the sources must agree on, the exit status that a command hands back
# from what it ran, and the checkout that `cargo xtask` finds from where its own
# manifest is. The tools' own tests must catch each.

[run]
# The version check's own tests: every agreement, every disagreement, every form.
release-version = ["cargo", "test", "--offline", "-p", "cf-release", "--lib", "version::"]
# xtask's process module against a child that ends as it is told.
xtask-test-process = ["cargo", "test", "--offline", "--target-dir", "app/src-tauri/target/xtask-check", "-p", "xtask", "--test", "process"]
# What the tools are built with, read from the lockfile.
xtask-test-closure = ["cargo", "test", "--offline", "--target-dir", "app/src-tauri/target/xtask-check", "-p", "xtask", "--test", "closure"]

[[plant]]
name = "tooling: a package.json that says another version is passed"
meant = "any_file_that_says_another_version_is_refused_with_every_file_named"
runs = ["release-version"]

[[plant.edit]]
file = "tools/cf-release/src/version.rs"
find = "if package == cargo && package == tauri {"
replace = "if cargo == tauri {"

[[plant]]
name = "tooling: a Cargo.toml that says another version is passed"
meant = "any_file_that_says_another_version_is_refused_with_every_file_named"
runs = ["release-version"]

[[plant.edit]]
file = "tools/cf-release/src/version.rs"
find = "if package == cargo && package == tauri {"
replace = "if package == tauri {"

[[plant]]
name = "tooling: a tauri.conf.json that says another version is passed"
meant = "any_file_that_says_another_version_is_refused_with_every_file_named"
runs = ["release-version"]

[[plant.edit]]
file = "tools/cf-release/src/version.rs"
find = "if package == cargo && package == tauri {"
replace = "if package == cargo {"

[[plant]]
name = "tooling: a version with a leading zero is canonical"
meant = "what_is_not_canonical_is_named_and_what_is_canonical_is_not"
runs = ["release-version"]

[[plant.edit]]
file = "tools/cf-release/src/version.rs"
find = '''(*number == "0" || !number.starts_with('0'))'''
replace = "true"

[[plant]]
name = "tooling: a command that fails answers 0"
meant = "the_exit_status_of_what_it_ran_is_its_own"
runs = ["xtask-test-cli"]

[[plant.edit]]
file = "tools/xtask/src/dispatch.rs"
find = '''
let status = process::run(&script.invocation(context, args), &context.env)?;
                Ok(status)'''
replace = '''
process::run(&script.invocation(context, args), &context.env)?;
                Ok(0)'''

[[plant]]
name = "tooling: a program that ends with a code answers 0"
meant = "the_code_a_program_ends_with_is_the_code_run_answers"
runs = ["xtask-test-process", "xtask-test-cli"]

[[plant.edit]]
file = "tools/xtask/src/process.rs"
find = "status.code().unwrap_or(1)"
replace = "0"

[[plant]]
name = "tooling: a program that ends with a code answers pass or fail"
meant = "the_code_a_program_ends_with_is_the_code_run_answers"
runs = ["xtask-test-process", "xtask-test-cli"]

[[plant.edit]]
file = "tools/xtask/src/process.rs"
find = "status.code().unwrap_or(1)"
replace = "i32::from(!status.success())"

[[plant]]
name = "tooling: the checkout is the folder xtask is run in"
meant = "the_checkout_is_the_same_from_the_root_from_app_and_from_anywhere_else"
runs = ["xtask-test-cli"]

[[plant.edit]]
file = "tools/xtask/src/context.rs"
find = 'Self::at(Path::new(env!("CARGO_MANIFEST_DIR")), env)'
replace = 'Self::at(&std::env::current_dir().unwrap_or_default().join("tools").join("xtask"), env)'

# The manifest and the lockfile together, so that cargo has nothing to mend before the test reads it.
[[plant]]
name = "tooling: the release tool is built with the harness"
meant = "neither_tool_is_built_with_the_app_or_the_daemons_crates"
runs = ["xtask-test-closure"]

[[plant.edit]]
file = "tools/cf-release/Cargo.toml"
find = '''
cf-base.workspace = true
serde_json.workspace = true'''
replace = '''
cf-base.workspace = true
cf-harness.workspace = true
serde_json.workspace = true'''

[[plant.edit]]
file = "Cargo.lock"
find = '''
name = "cf-release"
version = "3.0.0-alpha.83"
dependencies = [
 "base64 0.22.1",
 "cf-base",
'''
replace = '''
name = "cf-release"
version = "3.0.0-alpha.83"
dependencies = [
 "base64 0.22.1",
 "cf-base",
 "cf-harness",
'''

[[plant]]
name = "tooling: an alias that finds xtask from the root alone"
meant = "cargo_finds_the_xtask_alias_from_the_root_and_from_app"
runs = ["xtask-test-cli"]

[[plant.edit]]
file = ".cargo/config.toml"
find = 'xtask = ["run", "--locked", "--quiet", "--package", "xtask", "--bin", "xtask", "--"]'
replace = 'xtask = ["run", "--locked", "--quiet", "--manifest-path", "tools/xtask/Cargo.toml", "--bin", "xtask", "--"]'
