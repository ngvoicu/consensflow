# Plants in the tools that build and release (tools/xtask, tools/cf-release): the
# version the sources must agree on, the exit status that a command hands back
# from what it ran, the checkout that `cargo xtask` finds from where its own
# manifest is, and what the plants themselves count as a catch (2026-10-15/16: a run
# of the page's suite that could not load Playwright was counted as one; now a catch
# is the test a plant was meant for failing with it and its command passing once
# without it, where the report its runner wrote names the tests that failed (nextest's
# JUnit for `cargo test` and a suite of xtask's, the plants' own reporter of Node's tests
# run in Node's process, Playwright's JSON; what a run printed is never read for it, and a
# name that stands for two tests registered is none), and a failure that names only others
# MISSED-BY-MEANT; where a failure names no test, a run that exits with a failure twice
# with the plant and passes twice without it, anything else unstable, a run that left
# the checkout otherwise than it found it too; a test file that ran no test of its own,
# an error outside every test, no test found, are BROKEN, a Node test file ended while a
# test of it ran is not; a build nextest says failed DOES NOT COMPILE, whatever a test
# printed, and the build before the rig is cargo's own, which installs nothing, a build
# that fails otherwise NOT BUILT; a run that writes more than it may is HUNG; and the
# runs speak with no colour). The tools' own tests must catch each.

[run]
# The version check's own tests: every agreement, every disagreement, every form.
release-version = ["cargo", "test", "--offline", "-p", "cf-release", "--lib", "version::"]
# xtask's process module against a child that ends as it is told.
xtask-test-process = ["cargo", "test", "--offline", "--target-dir", "app/src-tauri/target/xtask-check", "-p", "xtask", "--test", "process"]
# What the tools are built with, read from the lockfile.
xtask-test-closure = ["cargo", "test", "--offline", "--target-dir", "app/src-tauri/target/xtask-check", "-p", "xtask", "--test", "closure"]
# The plants' own driver, runs and report, on stand-in commands and on this test binary.
xtask-lib-plants = ["cargo", "test", "--offline", "--target-dir", "app/src-tauri/target/xtask-check", "-p", "xtask", "--lib", "plants::"]
# The programs cf-e2e's tests run: built for them, or taken from where the run built them.
cf-e2e-lib-cf = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "cf::"]
# What capturing a program ends when its time runs out.
cf-process-capture = ["cargo", "test", "--offline", "-p", "cf-process", "--lib", "capture::"]

