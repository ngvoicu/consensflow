name = "tooling: the plants' fixtures folder is joined with forward slashes"
meant = "playwright_s_report_names_each_test_and_the_errors_outside_every_test"
runs = ["xtask-lib-plants"]
platforms = ["windows"]

[[plant.edit]]
file = "tools/xtask/src/plants/runs/tests.rs"
find = '''    ["app", "src-tauri", "target", "plants-fixtures"]
        .iter()
        .fold(root.to_path_buf(), |path, part| path.join(part))'''
replace = '''    root.join("app/src-tauri/target/plants-fixtures")'''

