# Plants in the tools that build and release (tools/xtask, tools/cf-release): the
# version the sources must agree on, the exit status that a command hands back
# from what it ran, the checkout that `cargo xtask` finds from where its own
# manifest is, and what the plants themselves count as a catch (2026-10-15/16: a run
# of the page's suite that could not load Playwright was counted as one; now a catch
# is the test a plant was meant for failing with it and its command passing once
# without it, where the report its runner wrote names the tests that failed (nextest's
# JUnit for `cargo test` and a suite of xtask's, its skipped tests named too, the plants'
# own reporters of Node's tests, run in Node's process, and of Playwright's; what a run
# printed is never read for it, and a name that stands for two tests registered, whatever
# came of each, is none, nor is a test file that failed whole), and a failure that names
# only others MISSED-BY-MEANT; a run that has a reporter and fails with no test failing
# catches nothing; where a command has no reporter, a run that exits with a failure twice
# with the plant and passes twice without it, each in its time, anything else unstable, a
# run that left the checkout otherwise than it found it too (where git says nothing of the
# checkout, that is said once, and nothing is unstable for it); a test file that ran no
# test of its own, an error outside every test, no test found, a test nextest could not
# start, a Playwright test whose hook failed, whose body ran no assertion that failed, or that
# was run more than once, a failure that names no test (one cancelled, a Node test file
# ended while a test of it ran) are BROKEN; a run out of its time HUNG whatever it then
# exits with, and nothing it started outlives it,
# the groups nextest gives its tests too (a run leads a session of its own on Unix, and on
# Windows a job it is put in before it runs); the programs cf-e2e's tests run are taken
# from where cargo says it put them; the Windows runner's copy is a checkout of git's whose
# one commit is what went over; a build nextest says failed DOES NOT COMPILE, whatever a test
# printed, and the build before the rig is cargo's own, which installs nothing, a build
# that fails otherwise NOT BUILT; a run that writes more than it may is HUNG; and the
# runs speak with no colour). The tools' own tests must catch each.

[run]
# The version check's own tests: every agreement, every disagreement, every form.
release-version = ["cargo", "test", "--offline", "-p", "cf-release", "--lib", "version::"]
# xtask's process module against a child that ends as it is told.
xtask-test-process = ["cargo", "test", "--offline", "--target-dir", "app/src-tauri/target/xtask-check", "-p", "xtask", "--test", "process"]
# What the tools are built with, read from the lockfile.
xtask-test-closure = ["cargo", "test", "--offline", "--target-dir", "app/src-tauri/target/xtask-check", "-p", "xtask", "--test", "closure"]
# The plants' own driver, runs and report, on stand-in commands and on this test binary.
xtask-lib-plants = ["cargo", "test", "--offline", "--target-dir", "app/src-tauri/target/xtask-check", "-p", "xtask", "--lib", "plants::"]
# The Windows runner: the scripts it sends, and on Windows what they do.
xtask-lib-windows = ["cargo", "test", "--offline", "--target-dir", "app/src-tauri/target/xtask-check", "-p", "xtask", "--lib", "windows::"]
# The programs cf-e2e's tests run: built for them, or taken from where the run built them.
cf-e2e-lib-cf = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "cf::"]
# What capturing a program ends when its time runs out.
cf-process-capture = ["cargo", "test", "--offline", "-p", "cf-process", "--lib", "capture::"]
# The same, with what a program held whole leads (its group, its job) and how a process is
# read before it is signalled.
cf-process-lib = ["cargo", "test", "--offline", "-p", "cf-process", "--lib"]

