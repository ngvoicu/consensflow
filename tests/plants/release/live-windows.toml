# The live suites' support on a Windows user's machine (zeewin, Windows 11, 2026-10-16), whose
# tests of cf-e2e failed where CI's `windows-latest` never runs them (CI runs cf-e2e's
# `daemon`, `rig`, `regressions` and `cli` tests and its library, not the `live_*` ones):
#
# - a program on the PATH is the first of its files there that runs as it is asked
#   (`live::working_command`): the Microsoft Store's alias of `python3`, which a shell finds,
#   ends 9009 with "Python was not found", and the MCP server's test ran it; a Python that runs
#   after it on the PATH is the one taken;
# - a process runs a command when its line ends with the program, as told or by a path, quoted
#   or not, with or without `.exe` and in any case, as a word of its own, then exactly the
#   command's words (`live::members::runs_command`): PowerShell starts a `ping` it finds on the
#   PATH as `"C:\WINDOWS\System32\PING.EXE" -n …`, which the stop case of `live_stops` looks for;
#   a longer name, a longer last word or more words after it is not the command;
# - the stop case reads the process it saw from what the case said (`tool::seen_in_tree`).
#
# The tests are the library's and the live suites' own, which start no window and spend
# nothing. Every name holds `live windows`, so `npm run plants:release -- "live windows"` runs
# them all.

[run]
e2e-live-path = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::machine::path::"]
e2e-live-command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::members::command::"]
e2e-stops-tool = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_stops", "midturn::tool::"]

# Which program on the PATH is taken.

[[plant]]
name = "live windows: a program that ends with an error is taken as working"
meant = "a_file_of_the_name_that_does_not_run_is_passed_over_for_a_later_one_that_does"
runs = ["e2e-live-path"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/machine/path.rs"
find = "    if ran.code == Some(0) {"
replace = "    if ran.code.is_some() {"

[[plant]]
name = "live windows: the first program of the name that does not run ends the look"
meant = "a_file_of_the_name_that_does_not_run_is_passed_over_for_a_later_one_that_does"
runs = ["e2e-live-path"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/machine/path.rs"
find = "            Err(error) => failed.push(error.to_string()),"
replace = "            Err(error) => {\n                failed.push(error.to_string());\n                break;\n            }"

# What line runs a command: the program's name.

[[plant]]
name = "live windows: a program's path in quotes is not read"
meant = "a_line_runs_the_command_as_it_was_told_or_by_its_programs_path_as_powershell_starts_it"
runs = ["e2e-live-command", "e2e-stops-tool"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/members/command.rs"
find = "    let named = match before.strip_suffix('\"') {"
replace = "    let named = match None::<&str> {"

[[plant]]
name = "live windows: a program named with .exe is not its name"
meant = "a_line_runs_the_command_as_it_was_told_or_by_its_programs_path_as_powershell_starts_it"
runs = ["e2e-live-command", "e2e-stops-tool"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/members/command.rs"
find = 'file[at..].eq_ignore_ascii_case(".exe")'
replace = '&file[at..] == ".exe"'

[[plant]]
name = "live windows: a program's name in capitals is another"
meant = "a_line_runs_the_command_as_it_was_told_or_by_its_programs_path_as_powershell_starts_it"
runs = ["e2e-live-command", "e2e-stops-tool"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/members/command.rs"
find = "    stem.eq_ignore_ascii_case(program)"
replace = "    stem == program"

[[plant]]
name = "live windows: a Windows path's folders are taken for the name"
meant = "a_line_runs_the_command_as_it_was_told_or_by_its_programs_path_as_powershell_starts_it"
runs = ["e2e-live-command", "e2e-stops-tool"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/members/command.rs"
find = "named.rsplit(['/', '\\\\'])"
replace = "named.rsplit(['/'])"

[[plant]]
name = "live windows: any program with the command's words runs it"
meant = "a_line_runs_the_command_as_it_was_told_or_by_its_programs_path_as_powershell_starts_it"
runs = ["e2e-live-command", "e2e-stops-tool"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/members/command.rs"
find = "            .is_some_and(|before| ends_with_program(before, program)),"
replace = "            .is_some_and(|_| true),"

# What line runs a command: where the program begins and ends.

[[plant]]
name = "live windows: a program whose name ends in the command's is the command"
meant = "a_line_runs_the_command_only_in_whole_words_and_only_to_its_end"
runs = ["e2e-live-command", "e2e-stops-tool"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/members/command.rs"
find = "    stem.eq_ignore_ascii_case(program)"
replace = "    stem.to_ascii_lowercase().ends_with(&program.to_ascii_lowercase())"

[[plant]]
name = "live windows: a program whose name begins with the command's is the command"
meant = "a_line_runs_the_command_only_in_whole_words_and_only_to_its_end"
runs = ["e2e-live-command", "e2e-stops-tool"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/members/command.rs"
find = "    stem.eq_ignore_ascii_case(program)"
replace = "    stem.to_ascii_lowercase().starts_with(&program.to_ascii_lowercase())"

[[plant]]
name = "live windows: a quoted path glued to the word before it is the program"
meant = "a_line_runs_the_command_only_in_whole_words_and_only_to_its_end"
runs = ["e2e-live-command"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/members/command.rs"
find = "            Some((ahead, named)) if ahead.is_empty() || ahead.ends_with(' ') => named,"
replace = "            Some((_, named)) => named,"

# What line runs a command: its words, to the line's end.

[[plant]]
name = "live windows: the command's words may be followed by more"
meant = "a_line_runs_the_command_only_in_whole_words_and_only_to_its_end"
runs = ["e2e-live-command", "e2e-stops-tool"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/members/command.rs"
find = '''
        Some((program, words)) => line
            .strip_suffix(words)
'''
replace = '''
        Some((program, words)) => line
            .rsplit_once(&format!(" {words} "))
            .map(|(before, _)| format!("{before} "))
            .or_else(|| line.strip_suffix(words).map(str::to_owned))
            .as_deref()
'''

[[plant]]
name = "live windows: a word that begins with the command's last one is it"
meant = "a_line_runs_the_command_only_in_whole_words_and_only_to_its_end"
runs = ["e2e-live-command", "e2e-stops-tool"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/members/command.rs"
find = '''
        Some((program, words)) => line
            .strip_suffix(words)
'''
replace = '''
        Some((program, words)) => line
            .rsplit_once(words)
            .filter(|(_, after)| !after.contains(' '))
            .map(|(before, _)| before)
'''

[[plant]]
name = "live windows: the program and its words may be apart by more than one space"
meant = "a_line_runs_the_command_only_in_whole_words_and_only_to_its_end"
runs = ["e2e-live-command"]

[[plant.edit]]
file = "crates/cf-e2e/src/live/members/command.rs"
find = "            .and_then(|before| before.strip_suffix(' '))"
replace = "            .and_then(|before| before.strip_suffix(' ').map(str::trim_end))"

# What the stop case reads of the tree.

[[plant]]
name = "live windows: the stop case matches the command as told only"
meant = "the_process_the_case_saw_in_the_tree_runs_the_command_on_a_mac_and_on_windows"
runs = ["e2e-stops-tool"]

[[plant.edit]]
file = "crates/cf-e2e/tests/live_stops/midturn/tool.rs"
find = "        runs_command(line, &self.text)"
replace = "        line.contains(&self.text)"

[[plant]]
name = "live windows: the process the stop case saw keeps its number"
meant = "the_process_the_case_saw_in_the_tree_runs_the_command_on_a_mac_and_on_windows"
runs = ["e2e-stops-tool"]

[[plant.edit]]
file = "crates/cf-e2e/tests/live_stops/midturn/tool.rs"
find = "    pid.parse::<u64>().ok().map(|_| line)"
replace = "    pid.parse::<u64>().ok().map(|_| process)"
