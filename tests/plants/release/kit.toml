# The plants of what releases and of the agents screens: the rule of the feeds and its checks,
# the publisher, the release workflow's text, the tool that makes the update feed's entry
# (`cf-release prepare-update`), the portable app's collector, the agents of the daemon as the
# packaged smoke holds them, the thin drivers of xtask (the app’s tests and lint, the lint for
# Windows and its archiver, the departures, the bench) and the gate that runs them, the models
# the live suites run each harness on (`cargo xtask live … --models`) and their support on a
# Windows user's machine (a program on the PATH that runs, a command PowerShell started), the
# Windows runner's copy of the tree (`cargo xtask windows`: what it sends, and what it removes
# there), and the updater smoke: its readers of evidence, and the product it holds (the app’s daemon choice,
# the ledger’s one holder, the check of an update), the packaged smoke and the candidate
# builder (`cargo xtask smoke` and `candidate`), the release commands (`cargo xtask release
# alpha` and `release promote`), the release's gate (`cf-release ci-passed`, the CI run it
# trusts), and what hands over to xtask: the npm scripts and the build hooks of Tauri.
#
# A run that tests the xtask package whole (`-p xtask --test …`) names the folder it is built in,
# `--target-dir app/src-tauri/target/xtask-check`, which `cargo xtask check` tests xtask in: the
# xtask that runs the plants is `target/debug/xtask`, such a test builds xtask again, and a
# program that is running is not to be replaced (Windows refuses; macOS overwrote one without a
# word). The tests of its library (`--lib`) build no program, and have no folder named.
#
# What a plant is, and what this file and the tables beside it hold, is told in
# tools/xtask/src/plants/kit.rs; `cargo xtask plants` runs them.

run_limit_minutes = 10
rebuild = ["cargo", "xtask", "build-cf", "--offline"]
tables = ["feeds", "publish", "workflow", "installers", "portable", "agents", "updater", "updater-product", "tooling", "sidecar", "drivers", "update", "sign-mac", "packaged", "wiring", "live-models", "live-windows", "windows-runner", "release-commands", "ci-times", "ci-gate", "tauri-2-12"]

[run]
# The proof of the agents screens against the native daemon, built from the sources as they are.
agents-proof = { command = ["cargo", "xtask", "test", "agents", "--offline"], builds = true }
# The smoke's readers of evidence (processes, daemon, ledger), and of the terminal command.
smoke-evidence = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "xtask", "--lib", "--", "updater_smoke::evidence", "updater_smoke::ledger"]
# The smoke's driver: where it keeps its builds, and what it does with the apps it is given.
smoke-driver = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "xtask", "--lib", "--", "updater_smoke::tests::"]
# The cache the smoke keeps its builds in: its folder, its marker, its lock, and the record beside the kept update.
smoke-cache = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "xtask", "--lib", "--", "updater_smoke::cache::"]
# The lint a plant is tried with: clippy over xtask with warnings denied, which is the gate's. A run
# whose source does not build is no catch, and clippy ends with "could not compile" when it denies a
# warning, so node runs it and says the first line it denied and nothing more: the run ends with 1
# and its words are no "could not compile". (A plant can only start cargo or node.)
smoke-lint = ["node", "-e", '''
const ran = require("child_process").spawnSync("cargo", ["clippy", "--offline", "-p", "xtask", "--all-targets", "--", "-D", "warnings"], { encoding: "utf8" });
if (ran.status !== 0) {
  const denied = `${ran.stderr}\n${ran.stdout}`.split("\n").find((line) => line.startsWith("error"));
  console.log(`clippy denied: ${denied}`);
  process.exit(1);
}
''']
# The gate's lint of the app for Windows (`cargo xtask clippy-windows app`, its step after the workspace's), said
# as smoke-lint says its own: the first line it denied, and 1 (T-836).
windows-app-lint = ["node", "-e", '''
const ran = require("child_process").spawnSync("cargo", ["xtask", "clippy-windows", "app"], { encoding: "utf8" });
if (ran.status !== 0) {
  const denied = `${ran.stderr}\n${ran.stdout}`.split("\n").find((line) => line.startsWith("error"));
  console.log(`clippy for Windows denied: ${denied}`);
  process.exit(1);
}
''']
# The rule of the feeds and its checks, against GitHub as the simulator has it.
feeds = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "cf-publish", "--test", "feeds_rule", "--test", "feeds_plan", "--test", "feeds_prerequisites", "--test", "feeds_check", "--test", "feeds_cli"]
smoke-launchers = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "xtask", "--lib", "--", "updater_smoke::launchers"]
# The app the smoke starts (what it reports, and that it is ended with all it made), and the machine of a case.
smoke-app = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "xtask", "--lib", "--", "updater_smoke::app"]
smoke-case = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "xtask", "--lib", "--", "updater_smoke::case::"]
# The smoke's look at what the app started again holds of the installed app's.
smoke-descriptors = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "xtask", "--lib", "--", "updater_smoke::descriptors"]
# The app crate's tests of the portable app's collector, built as a worktree can build it.
app-portable = ["cargo", "xtask", "app", "test", "portable::"]
# The publisher, every state a run can be cut short in, and the workflow's steps run as written.
publish = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "cf-publish", "--test", "publish_release", "--test", "publish_rerun", "--test", "publish_cut_short", "--test", "publish_swap", "--test", "release_publish", "--test", "release_steps", "--test", "release_mac"]
# What the smoke is made of apart from the apps: its versions, keys, feed and bundles.
smoke-kit = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "xtask", "--lib", "--", "updater_smoke::versions", "updater_smoke::build", "updater_smoke::bundle", "updater_smoke::processes", "updater_smoke::signing", "updater_smoke::feed"]
# The workflow's own text: who may publish, what holds the token, and the steps that call the publisher.
workflow = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "cf-publish", "--test", "release_publish", "--test", "release_steps", "--test", "release_mac", "--test", "workflow_scripts"]
# What xtask starts programs with (tools/xtask/src/process.rs), which the smoke starts its app by.
xtask-process = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "xtask", "--lib", "--", "process::tests"]
# xtask run as a process, handing its words to a stand-in for node and answering its status.
xtask-test-cli = ["cargo", "test", "--offline", "--target-dir", "app/src-tauri/target/xtask-check", "-p", "xtask", "--test", "cli"]
