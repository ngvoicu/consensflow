# Plants in the rule that the release's bundle identifier, dev.ngvoicu.consensflow, is built by
# GitHub's release workflows and by nothing else (T-903): the configuration every build starts
# from names another, the release's is a file by itself that only the two workflows name, the
# first step of `prepare:app` refuses it anywhere but on GitHub's runner, and `cf-release
# sign-mac` refuses a bundle that is not the release's. `tools/xtask/tests/release_identity.rs`,
# the step's own tests, `scripts.rs` and the signing's tests must catch each.

[run]
# The rule: the configurations, the workflows, and the step as a process.
xtask-test-identity = ["cargo", "test", "--offline", "--target-dir", "app/src-tauri/target/xtask-check", "-p", "xtask", "--test", "release_identity"]
# The step's own reading of the file, the platform's file and the override.
xtask-lib-identity = ["cargo", "test", "--offline", "-p", "xtask", "--lib", "--", "identity::tests::"]
# The scripts and hooks that run the step first.
xtask-test-scripts = ["cargo", "test", "--offline", "--target-dir", "app/src-tauri/target/xtask-check", "-p", "xtask", "--test", "scripts"]
# The signing's refusal of a bundle that is not the release's.
sign-mac-identity = ["cargo", "test", "--offline", "-p", "cf-release", "--lib", "sign_mac::tests::identity"]

[[plant]]
name = "identity: the configuration every build starts from carries the release's identifier"
meant = "the_configuration_every_build_starts_from_is_not_the_releases"
runs = ["xtask-test-identity"]

[[plant.edit]]
file = "app/src-tauri/tauri.conf.json"
find = '"identifier": "dev.ngvoicu.consensflow.local",'
replace = '"identifier": "dev.ngvoicu.consensflow",'

[[plant]]
name = "identity: the release configuration gives another identifier"
meant = "the_release_configuration_gives_the_identifier_and_nothing_else"
runs = ["xtask-test-identity"]

[[plant.edit]]
file = "app/src-tauri/tauri.release.conf.json"
find = '"identifier": "dev.ngvoicu.consensflow"'
replace = '"identifier": "dev.ngvoicu.consensflow.local"'

[[plant]]
name = "identity: the release configuration says more than the identifier"
meant = "the_release_configuration_gives_the_identifier_and_nothing_else"
runs = ["xtask-test-identity"]

[[plant.edit]]
file = "app/src-tauri/tauri.release.conf.json"
find = '''  "identifier": "dev.ngvoicu.consensflow"
'''
replace = '''  "identifier": "dev.ngvoicu.consensflow",
  "version": "9.9.9"
'''

[[plant]]
name = "identity: the Candidate is built with the release's identifier"
meant = "no_other_configuration_names_the_release_identifier"
runs = ["xtask-test-identity"]

[[plant.edit]]
file = "app/src-tauri/tauri.candidate.conf.json"
find = '"identifier": "dev.ngvoicu.consensflow.candidate",'
replace = '"identifier": "dev.ngvoicu.consensflow",'

[[plant]]
name = "identity: the Candidate builder is given the release configuration"
meant = "only_the_release_workflows_name_the_release_configuration"
runs = ["xtask-test-identity"]

[[plant.edit]]
file = "tools/xtask/src/candidate.rs"
find = '''self.app.join("src-tauri").join("tauri.candidate.conf.json")'''
replace = '''self.app.join("src-tauri").join("tauri.release.conf.json")'''

[[plant]]
name = "identity: the release workflow builds the app with the configuration every build starts from"
meant = "every_workflow_that_builds_the_app_builds_it_with_the_release_configuration"
runs = ["xtask-test-identity"]

[[plant.edit]]
file = ".github/workflows/release.yml"
find = "- run: npm --prefix app run build -- --config src-tauri/tauri.release.conf.json"
replace = "- run: npm --prefix app run build"

[[plant]]
