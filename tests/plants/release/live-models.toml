# The models the live suites run each harness on (the owner's rule of 2026-10-15: "when you test
# with all harnesses use whatever they have there"): `cargo xtask live <suite> --models
# pi=openai/gpt-6-luna,codex=gpt-6.1-sol:high` runs each harness it names on that model and that
# effort, the others on their cheap one, and `--claude-model M` says the same as `--models
# claude=M`, which wins where both name Claude. The suites read them in one place
# (`crates/cf-e2e/src/live/agents.rs`), every run on them begins with `Log::begin`, which refuses
# a flag no window could be asked for before anything is spent and says what the flags give each
# harness; the report says what each window was launched on, as the roster row the daemon opens a
# member's on (`agents::write_roster`) and the agent a window opened without the daemon is asked
# for (`window::Open::open`) have it, a suite's own `--model` and all (`Log::launched`,
# `Log::report`, `report::conclude`). A window opened without the daemon is never asked for an
# OpenCode effort, which it would not get (`window::without_the_daemon`; resume-cut refuses it
# first). The runs of agents of their own (`agent`, `designer`) refuse `--models`
# (`Log::own_agents`). xtask hands the flag on as it does every flag (`tools/xtask/src/live.rs`).
# No harness is run: the tests of the support, of the suites that start a window of their own
# (Codex's app-server, resume-cut's Claude) and of xtask's words catch each plant.
#
# A live agent need not be in the catalog (the owner's Nemotron 3.5 Super VL, OpenCode Zen's free
# `opencode/nemotron-3.5-super-vl-free`, which the catalog has no row of, 2026-10-16): the roster
# keeps a row of the human's own on any model, and the live suites' rows are such rows. The rig case
# `live_members::a_task_for_a_member_on_a_model_the_flag_names_…` holds it end to end: the flag's
# row, written as the suites write it, is taken by the real daemon as a member, and a task given it
# has the daemon launch the member's window on a stand-in OpenCode 1.x (`fake-opencode-1`; not
# `fake-opencode`, which is cf-harness's stand-in of its channel tests) with that model, and post
# its first message with the model and the effort (`variant`). The rig's runs
# build the native `cf` from the sources as they are planted, so they say `builds`.
#
# Every name holds `live models`, so `npm run plants:release -- "live models"` runs them all.

[run]
e2e-rig-live-members = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "live_members::a_task_for_a_member_on_a_model_the_flag_names"], builds = true }
# The rig's cases of what a run reports it launched, and of a window opened without the daemon.
e2e-rig-launches = { command = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "rig", "live_members::a_window_"], builds = true }
e2e-live-door = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_door", "the_report_names_the_model_door_model_gave"]
e2e-live = ["cargo", "test", "--offline", "-p", "cf-e2e", "--lib", "live::"]
e2e-live-codex-interrupt = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_codex_interrupt"]
e2e-live-resume-cut = ["cargo", "test", "--offline", "-p", "cf-e2e", "--test", "live_resume_cut"]
xtask-lib-live = ["cargo", "test", "--offline", "-p", "xtask", "--lib", "live::"]

