# Plants in what keeps every test, smoke, plant and tool from the live app (2026-10-28: an
# updater smoke's copy of the app, of the live app's identity, came to the front over the live
# app, and the Quit a person gave the one in front reached the live app next). Each takes one
# guard out: the refusal of an app of the live app's identity (cf_base::bundle) at each start
# held to it, the smoke's own identity for what it builds and exports, the copy the packaged smoke
# starts, the update of an app that is not the release's, the ends by a process's number and
# when it began (cf_process::Started), and the rules of tools/xtask/tests/live_app.rs. What
# catches each is a test that needs no app.

[run]
bundle-gate = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "cf-base", "--lib", "--", "bundle::"]
rig-process = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "cf-e2e", "--lib", "--", "process::tests"]
release-process = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "cf-release", "--lib", "--", "process::tests"]
started = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "cf-process", "--lib", "--", "started::"]
live-app-rules = ["cargo", "test", "--offline", "--target-dir", "app/src-tauri/target/xtask-check", "--no-fail-fast", "-p", "xtask", "--test", "live_app"]
smoke-export = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "xtask", "--lib", "--", "updater_smoke::build", "updater_smoke::tests::"]
app-update-identity = ["cargo", "xtask", "app", "test", "update_install::"]
rig-shipped = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "cf-e2e", "--lib", "--", "shipped::"]
app-builds = ["cargo", "xtask", "app", "test", "tests::a_"]
windows-gate = ["node", "--test", "tests/built-identity.test.mjs"]
app-identity = ["cargo", "xtask", "app", "test", "identity"]
app-daemon-wait = ["cargo", "xtask", "app", "test", "the_first_start_runs_apart_and_what_a_page_asks_waits_for_it"]
packaged-copy = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "cf-e2e", "--test", "smoke", "--", "bundle::"]

