    startable(program)?;'''
replace = '''
pub fn capture(program: &OsStr, args: &[OsString], env: &Env) -> Result<Output, Unstarted> {'''

[[plant]]
name = "live app: the updater smoke takes a bundle of the live app's identity for one of its own"
meant = "a_bundle_of_the_live_apps_identity_is_refused"
runs = ["smoke-kit"]

