replace = 'tests: &["daemon", "rig", "regressions"],'

[[plant]]
name = "wiring: the daemon and rig script hands over to the whole of the daemons"
meant = "the_root_package_runs_each_driver_and_build_step_through_cargo_xtask"
runs = ["xtask-test-scripts"]

[[plant.edit]]
file = "package.json"
find = '"test:daemon-and-rig": "cargo xtask test daemon-and-rig",'
replace = '"test:daemon-and-rig": "cargo xtask test daemons",'
