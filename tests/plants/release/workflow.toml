# Plants in the release workflow's text (.github/workflows/release.yml): who
# may publish, what a hand run is told and not failed by, what holds the write
# token, how the publisher is built and checked before it runs, and the steps
# that call it. The tests that read the workflow and run its steps as written
# must catch each. The plants named "CI's packaged job" are in that job of CI (.github/workflows/ci.yml,
# T-904) and the setup it starts from (.github/actions/setup/action.yml): the app built
# ad hoc and of the smoke's identity, smoked after it, and the lines that keep that job
# from holding a key, asking for the signed bundle, going without a limit, or losing the
# machines of a smoke that failed.

[run]
# The rule over every workflow: a downloaded binary runs only where the job that built it ran.
binaries = ["cargo", "test", "--offline", "--no-fail-fast", "-p", "cf-publish", "--test", "workflow_binaries"]

