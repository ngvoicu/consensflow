# Plants in the release workflow's text (.github/workflows/release.yml): who
# may publish, what a hand run is told and not failed by, what holds the write
# token, how the publisher is built and checked before it runs, and the steps
# that call it. The tests that read the workflow and run its steps as written
# must catch each.

[[plant]]
name = "workflow: a hand run on a tag publishes: the job asks only for a tag"
meant = "is_the_push_of_a_tag_not_a_hand_run_though_it_is_on_a_tag"
runs = ["workflow"]

[[plant.edit]]
file = ".github/workflows/release.yml"
find = "    if: github.event_name == 'push' && github.ref_type == 'tag'"
replace = "    if: github.ref_type == 'tag'"

[[plant]]
name = "workflow: a hand run on a tag takes the group of the releases"
meant = "is_the_push_of_a_tag_for_the_group_of_releases_that_go_out_one_at_a_time_too"
runs = ["workflow"]

[[plant.edit]]
file = ".github/workflows/release.yml"
find = "group: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'release' ||"
replace = "group: ${{ github.ref_type == 'tag' && 'release' ||"

[[plant]]
name = "workflow: a hand run is failed by what a tag would be refused for, before the build"
meant = "asks_the_old_feeds_before_the_build_a_tag_is_refused_a_hand_run_is_told_what_a_tag_would_be"
runs = ["workflow"]
# Its test runs the steps under bash or parses them with ruby, which the Windows machines lack.
platforms = ["macos", "linux"]

[[plant.edit]]
file = ".github/workflows/release.yml"
find = '''
if [ "$GITHUB_EVENT_NAME" != push ]; then dry=(--dry-run); fi
          app/src-tauri/target/release/cf-publish feeds prerequisites'''
replace = "app/src-tauri/target/release/cf-publish feeds prerequisites"

