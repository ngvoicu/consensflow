# The Windows runner (`cargo xtask windows`): zeewin's results are the tree's and nothing else's
# (2026-10-16, after 87 files of other trees' runs were found in its copy and a `cli` test named
# them).
#
# - After the unpack, the sweep (`script::sweep_script`, which goes in the tarball beside the list
#   of what went over) removes every file of the copy the list does not name, and every folder it
#   leaves empty, but for what `script::KEPT` names (the run's own files and the build's outputs),
#   which it does not walk. It reads the list as UTF-8 and compares names in any case, does not
#   look into a folder that is a link, removes with .NET's `Delete` (PowerShell's `Remove-Item`
#   asks before it takes a folder, which stopped a run), says each removal, and what it could not
#   remove ends the run, said.
# - A worker's tree's links `app/.cache` and `app/src-tauri/resources` (into the main checkout) do
#   not go: `app/.gitignore` names them as files too. Worker trees and their links are the Mac's,
#   and Windows makes a link only with a privilege, so the test that catches these plants on every
#   system puts a plain file where the link is, which is what git sees of a link; the links
#   themselves are tried on Unix.
#
# The tests are xtask's library's (`windows::`), which read the scripts' text and pack a tree in a
# repository made for each test; on Windows one runs the sweep in the machine's PowerShell too.
# Every name holds `windows runner`, so `npm run plants:release -- "windows runner"` runs them all.

[run]
xtask-lib-windows = ["cargo", "test", "--offline", "-p", "xtask", "--lib", "windows::"]

# What the copy keeps.

[[plant]]
name = "windows runner: the build folder is not kept"
meant = "the_copy_keeps_the_runs_own_files_and_the_builds_outputs_and_nothing_else"
runs = ["xtask-lib-windows"]

[[plant.edit]]
file = "tools/xtask/src/windows/script.rs"
find = '    "app/src-tauri/target",'
replace = '    "app/src-tauri/targets",'

[[plant]]
name = "windows runner: the evals' reports are not kept"
meant = "the_copy_keeps_the_runs_own_files_and_the_builds_outputs_and_nothing_else"
runs = ["xtask-lib-windows"]

[[plant.edit]]
file = "tools/xtask/src/windows/script.rs"
find = '    "evals/reports",'
replace = '    "evals/report",'

[[plant]]
name = "windows runner: a kept folder is walked before it is passed over"
meant = "the_copy_keeps_the_runs_own_files_and_the_builds_outputs_and_nothing_else"
runs = ["xtask-lib-windows"]

[[plant.edit]]
file = "tools/xtask/src/windows/script.rs"
find = '    if (($kept | Where-Object { $name -like $_ }) -or ($item -is [IO.FileInfo] -and $now.Contains($name)) -or ($deep -and (Clear-Stale $item))) {'
replace = '    if (($deep -and (Clear-Stale $item)) -or ($kept | Where-Object { $name -like $_ }) -or ($item -is [IO.FileInfo] -and $now.Contains($name))) {'

