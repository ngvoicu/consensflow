# Windows' own tar, named by its path (T-348): a bare `tar.exe` is the first on the PATH, and CI's
# Git Bash puts Git's usr\bin, with a GNU tar, before System32; GNU tar takes `C:\…` for a host and
# ends 2 before anything is unpacked (CI run 39896583469: six cases of the lock). A machine without
# it ends the run saying so.

[[plant]]
name = "windows runner: the tree is unpacked by the first tar on the PATH"
meant = "the_tree_is_unpacked_by_windows_own_tar_named_by_its_path_and_never_by_the_first_tar_on_the_path"
runs = ["xtask-lib-windows"]

