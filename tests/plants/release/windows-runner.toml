# The Windows runner (`cargo xtask windows`): zeewin's results are the tree's and nothing else's
# (2026-10-16, after 87 files of other trees' runs were found in its copy and a `cli` test named
# them).
#
# - After the unpack, the sweep (`script::sweep_script`, which goes in the tarball beside the list
#   of what went over) removes every file of the copy the list does not name, and every folder it
#   leaves empty, but for what `script::KEPT` names (the run's own files and the build's outputs),
#   which it does not walk. It reads the list as UTF-8 and compares names in any case, does not
#   look into a folder that is a link, removes with .NET's `Delete` (PowerShell's `Remove-Item`
#   asks before it takes a folder, which stopped a run), says each removal, and what it could not
#   remove ends the run, said.
# - A worker's tree's links `app/.cache` and `app/src-tauri/resources` (into the main checkout) do
#   not go: `app/.gitignore` names them as files too. Worker trees and their links are the Mac's,
#   and Windows makes a link only with a privilege, so the test that catches these plants on every
#   system puts a plain file where the link is, which is what git sees of a link; the links
#   themselves are tried on Unix.
#
# - Several workers' runs queue for the one machine, and each run is its own (2026-10-22, T-219:
#   every run sent to the same `<folder>.tgz`, so a run whose script had not unpacked yet was handed
#   the tree of the run that sent after it, and zeewin's green was another tree's). A run's tarball
#   is named by the run (`<folder>.<id>.tgz`) and the script unpacks that one and removes it
#   however it ends, a refusal by the lock too, and takes the lock away only if it holds it; the
#   lock stays the process alone, as every version of the script reads it, and the run that holds
#   it is named in a file beside it, which a stop reads: a stop ends only its own run. The machine
#   says the tree it unpacked (`== tree <commit> <hash>`, from a file the tarball holds), which
#   must be the one sent: another ends the run there, and a 0 with no tree said is a failure.
#   What runs that never got so far left is taken away by the next sweep, an hour after.
# - The lock is one act of the system (T-253): a file the script opens for itself alone, as its
#   first act in the folder (`FileShare.None`), so of two runs that start within a millisecond one is
#   refused; a run that ended any way has closed it, so a lock a dead run left is no lock. The
#   process stays in the old file for the scripts of the older form, which refuse a run that is still
#   going by it. And the line a run ends by begins with a line feed: a command's output goes to the
#   stream as it writes it, and one that ends inside a line (`type` of a file with no final line end)
#   had the line written onto its words, which was no exit line, and a pass was answered as 1.
#
# - The script is two (T-263): the bootstrap on ssh's command line (the lock, the unpack, the sweep, the
#   tree said) and the run script in the tarball (the steps, the variables, the command), so that what
#   a run is asked for has no limit but the shell's. A stop ends the process the owner file names; the
#   files unpacked are held to the identity by the sweep; the lock's refusal always has its exit line;
#   a process id in the older file counts only for a PowerShell older than the file; the uploads of a
#   folder that is gone are taken away a day after.
# - A stop ends everything the run started (T-322): the run is put in a job that the system ends with
#   the run's process (`CfJob` in the run script), released where the run ends by itself. A stop that
#   was `taskkill /T /F` alone read the tree and then ended what it read, so what a run started while
#   it went on was left running (zeewin, 2026-10-23: 21 to 50 programs of a run that kept starting
#   them, a single `ping -n 60` 7 times in 142 stops, none in 142 with the job). The plants marked `(on the machine)` are of the
#   tests that run PowerShell on Windows; they say `platforms = ["windows"]` and are tried there.
#
# The tests are xtask's library's (`windows::`), which read the scripts' text and pack a tree in a
# repository made for each test; on Windows one runs the sweep in the machine's PowerShell too.
# Every name holds `windows runner`, so `npm run plants:release -- "windows runner"` runs them all.

[run]
xtask-lib-windows = ["cargo", "test", "--offline", "-p", "xtask", "--lib", "windows::"]

