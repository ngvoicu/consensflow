# T-610 (2026-10-26), Calliope's findings on the two machines (T-600).
#
# - `--host zeewin2` is the laptop with its guards: poker-lab's lock, the disk floor, CI's Node.
# - A run goes on there only if the process the owner file names is alive (a stale file, left by a
#   reboot, a battery or a BSOD, is no run); the tests of this are the machine's own PowerShell's
#   (`(on the machine)`, `platforms = ["windows"]`) and the script's text.
# - Both probes of the laptop are bounded alike (ConnectTimeout, BatchMode, ServerAlive).
# - A zeelin that cannot be connected to is an Ubuntu that is not running (a port nothing listens on
#   times out on the laptop, 2026-10-26, and port 22 with WSL stopped is one: its firewall blocks inbound
#   by default and its sshd rule is off); one that connected and cannot say may be running poker-lab's
#   job, and the run is refused.
# - The disk script ends with `exit 0`: with no owner file `Get-Content` fails, `$?` stays false, and the
#   script's last statement (an `if` that runs nothing) left the exit status 1 (the live run on zeewin2).
# - A Ctrl-C ends the probes with the program: a stop, not a zeelin that did not answer; a refused
#   run asks nothing more of the machine, and stops a matrix, whose later evals are `not run`.

