replace = '    "evals/report",'

[[plant]]
name = "windows runner: a kept folder is walked before it is passed over"
meant = "the_copy_keeps_the_runs_own_files_and_the_builds_outputs_and_nothing_else"
runs = ["xtask-lib-windows"]

[[plant.edit]]
