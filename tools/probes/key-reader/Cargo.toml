# A probe, outside the workspace (`exclude = ["tools/probes"]`): what Codex's own key reader makes of
# the bytes a pane writes for a Shift+Enter (T-1336, T-1348). Codex 0.167.0 pins this fork of crossterm;
# Devin and Muse read their keys through crossterm too. `run.py` runs the first binary through a pty
# on a Mac; `run-windows.cjs` runs the second through the pane host's console on Windows.
[package]
name = "key-reader-probe"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "key-reader-probe"
path = "src/main.rs"

# Codex 0.167.0's reader on Windows: crossterm's EventStream inside `WindowsKeySequence`
# (`codex-rs/tui/src/tui/windows_key_sequence.rs`, copied as it is at `rust-v0.167.0`).
[[bin]]
name = "codex-windows-keys"
path = "src/codex_windows_keys.rs"

[dependencies]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "ed1cdab335221515706178d68495bba2aed1924f", features = ["bracketed-paste", "event-stream"] }
tokio = { version = "1", features = ["macros", "rt", "time"] }
tokio-stream = "0.1"

[workspace]
