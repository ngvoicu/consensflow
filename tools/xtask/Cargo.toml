[package]
name = "xtask"
description = "ConsensFlow's build, test and driver commands: `cargo xtask <command>`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

# What the tests start where xtask starts `node`, `cargo` or `npm`: it says where
# it was started and with what, and ends as the environment tells it. Not behind a
# feature, on purpose: a feature of this package that only the tests turn on would
# build `xtask` again for them, and `cargo xtask check` runs those tests while the
# one built for it is running, which Windows does not let a build replace.
[[bin]]
name = "fake-child"
path = "src/bin/fake_child.rs"

[dependencies]
# The environment, read once in `main` and handed to whatever starts a program.
cf-base.workspace = true
# Where a command is on the PATH, with the extensions Windows starts programs by.
cf-process.workspace = true
# The portable exe: `portable pack` writes it and `portable inspect` reads its
# footer, by the library the app unpacks it with.
cf-portable.workspace = true
thiserror.workspace = true
# The version the sources agree on, read by the commands that stage and pack
# (cf-release), and the console host's package (its SHA-256 and its zip).
cf-release.workspace = true
sha2.workspace = true
zip.workspace = true
# The runner of the Windows machine: the PowerShell script that ssh hands it is
# the base64 of its UTF-16 (`-EncodedCommand`).
base64.workspace = true
# The updater smoke: the feed it serves and the evidence it reads. JSON as
# the app and the daemon write it (the feed's document, the build's override, a
# self-test report, a ledger event); the ledger read from outside (SQLite,
# built in, as the daemon's is); the feed over HTTPS on the loopback with a
# certificate made for the run (rustls, on ring, as the app's updater is); a
# bundle's Info.plist; the key a built app holds, found in its executable; and a
# folder of the run's own for each machine.
serde_json.workspace = true
rusqlite.workspace = true
# The plants: their data is TOML (tests/plants), read as the structures that
# say what a plant is; their runs are started by cf-process, which runs on tokio,
# and a Ctrl-C is heard through tokio's signals, so that the sources are put back.
# What a run's tests did is read from the reports the test runners write: JUnit
# (nextest's and Node's) and Playwright's JSON.
serde.workspace = true
tokio = { workspace = true, features = ["rt", "signal"] }
toml.workspace = true
quick-xml.workspace = true
rustls.workspace = true
plist.workspace = true
memchr.workspace = true
tempfile.workspace = true

# The smoke's input to an app is a FIFO, which is ended by signal and by group.
# Both calls are safe in nix, where libc's are not (this crate forbids unsafe).
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "signal"] }

[lints]
workspace = true
