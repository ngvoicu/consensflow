[package]
name = "cf-bridge"
description = "The bridge's JSON-lines transport between the pane host and the daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# The daemon's end of the bridge, on one thread over tokio (`cf_bridge::local`).
local = ["dep:tokio"]

[dependencies]
cf-proto.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true, features = ["io-util", "macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true
