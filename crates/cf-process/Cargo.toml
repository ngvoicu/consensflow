[package]
name = "cf-process"
description = "The one place a ConsensFlow program starts another process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cf-base.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "time"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
# `access`, which asks the system whether this user may run a file.
nix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true
