[package]
name = "cf-base"
description = "What every ConsensFlow crate shares: text as JavaScript measured it, and JSON as Node wrote it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# The programs a test starts that end when the test does (`fixture`): for the
# tests of the crates that start them alone, never into what ships.
[features]
test-support = []

[dependencies]
icu_normalizer.workspace = true
icu_properties.workspace = true
# The escapes in a line of JSON, found at the speed memory reads.
memchr.workspace = true
serde.workspace = true
serde_json.workspace = true

# The errno names Node prints (`EACCES`): the numbers differ between the
# systems, the constants do not.
[target.'cfg(unix)'.dependencies]
libc.workspace = true
nix.workspace = true

# Win32_Networking_WinSock: libuv's table also names the `WSAE…` codes.
[target.'cfg(windows)'.dependencies]
winapi-util.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
