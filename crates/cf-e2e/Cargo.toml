[package]
name = "cf-e2e"
description = "ConsensFlow's black-box suites: the built `cf` and pane host run as processes and judged by what they print, write, answer and exit with. Test support and tests only; it depends on no crate of the product."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# The programs the suites run in place of what ConsensFlow runs: the stand-in
# for a harness's terminal program (`fake-agent`), a Codex (`fake-codex`), a
# Devin (`fake-devin`), the `cf` of a window (`fake-cf`), a daemon that is not
# the native one (`liar-daemon`) and the reader of a large paste that the
# packaged smoke's harness runs (`smoke-paste-reader`). The crate's own tests
# turn it on through the dev-dependency below.
test-support = []

# The stand-in for the `claude` a window runs: it speaks Claude's launch
# arguments, writes Claude's transcript and status, reads its terminal as a TUI
# does, runs `cf` as an agent does, and leaves jobs running past its turn as an
# agent's background shell does (the program is the job too: `--background-job`).
[[bin]]
name = "fake-agent"
path = "src/bin/fake_agent.rs"
required-features = ["test-support"]

# The stand-in for the `codex` that `cf codex-session` starts: Codex's server
# on a socket, and its TUI through the broker.
[[bin]]
name = "fake-codex"
path = "src/bin/fake_codex.rs"
required-features = ["test-support"]

# The stand-in for the `devin` a window runs: it speaks Devin's launch arguments,
# keeps Devin's store and writes Devin's wire log as the daemon reads them, and
# takes Escape as Devin does (twice, to interrupt a turn). It shares its terminal
# and its signals with `fake-agent`.
[[bin]]
name = "fake-devin"
path = "src/bin/fake_devin.rs"
required-features = ["test-support"]

# The stand-in for the `cf` a member's window runs where the real one has no
# daemon to reach: it writes down the calls it is given, for the check that asks
# a window to run `cf ask` and reads what came of it (`live::calls`).
[[bin]]
name = "fake-cf"
path = "src/bin/fake_cf.rs"
required-features = ["test-support"]

# A daemon that says it is Node's, for the case that holds the rig to refusing
# a daemon that is not the native one.
[[bin]]
name = "liar-daemon"
path = "src/bin/liar_daemon.rs"
required-features = ["test-support"]

# What the packaged smoke's stand-in harness runs to read a large paste off its
# terminal and say its size and hash: a program of ours, so that the smoke runs
# no Node (the bundle ships none).
[[bin]]
name = "smoke-paste-reader"
path = "src/bin/smoke_paste_reader.rs"
required-features = ["test-support"]

[dependencies]
# The time the stand-in agent writes in its records.
jiff.workspace = true
# The patterns the support and the stand-ins read text by.
regex.workspace = true
# Devin's store, which the stand-in Devin writes as Devin does (its sessions.db).
rusqlite.workspace = true
# What a case reads of a command's JSON answer, and the frames of the bridge.
serde_json.workspace = true
# The hash of the token the stand-in Codex lets in on loopback.
sha2.workspace = true
# The home of a case, removed with it.
tempfile.workspace = true
thiserror.workspace = true
# Plain HTTP to the daemon on loopback, as the proof of the agents screens and
# the cases that ask the API directly make it.
ureq.workspace = true
# The WebSocket the stand-in Codex speaks, on a socket or on loopback.
tungstenite.workspace = true
# The conversation id a live test opens a Claude Code or Pi window on.
uuid.workspace = true

[dev-dependencies]
cf-e2e = { path = ".", features = ["test-support"] }
# Node's `--import` takes a module as a file URL, on Windows as anywhere.
url.workspace = true

# Signals by process id, whether a process is there, the group it is in, and the
# terminal's raw mode, which std does not give (and this crate forbids unsafe code).
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["process", "signal", "term"] }

# The console's raw mode for the stand-in agent, which std does not give.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console"] }

[lints]
workspace = true
