[package]
name = "cf"
description = "ConsensFlow's command: the board's verbs and the harness hooks inside a window, the standalone verbs and the daemon outside one."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cf-base.workspace = true
cf-board.workspace = true
# The ready-made agents and the roster: the standalone verbs `catalog` and `agent`.
cf-codex-session.workspace = true
cf-daemon.workspace = true
cf-harness.workspace = true
# The terminal command `setup` writes and `doctor` reads.
cf-launcher.workspace = true
# The staff's roles: the switches of `cf task add` and how a task's role is said.
cf-ledger.workspace = true
cf-proto.workspace = true
form_urlencoded.workspace = true
serde_json.workspace = true

# A brief's file is opened as itself, never through a link (`--file`).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
winapi-util.workspace = true
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
cf-board = { workspace = true, features = ["test-support"] }
# The role texts a window is given, for the Windows cases that run the command a text teaches.
cf-engine.workspace = true
# The daemon as a process: a home of its own with a ledger and a fake `claude`.
cf-harness = { workspace = true, features = ["test-support"] }
# A ledger of the daemon's for a test, and a role put in the roles' table for one.
cf-ledger = { workspace = true, features = ["test-support"] }
# Whether a daemon's process is alive, and what a program a test starts holds.
cf-process = { workspace = true, features = ["test-support"] }
# The derives for the structs the goldens deserialise.
serde.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# A descriptor left open and not close-on-exec, for a test of what the `cf` a test starts holds
# ("fs"), and the SIGTERM that asks a daemon to stop, sent by the test, whose failure it says ("signal").
nix = { workspace = true, features = ["fs", "signal"] }

[lints]
workspace = true
