[package]
name = "cf"
description = "ConsensFlow's command: the board's verbs and the harness hooks inside a window, the standalone verbs and the daemon outside one; the CLI's Node sources only for a home that has taken the way back."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cf-base.workspace = true
cf-board.workspace = true
# The ready-made agents and the roster: the standalone verbs `catalog` and `agent`.
cf-catalog.workspace = true
cf-codex-session.workspace = true
cf-daemon.workspace = true
cf-harness.workspace = true
# The terminal command `setup` writes and `doctor` reads.
cf-launcher.workspace = true
cf-process.workspace = true
cf-proto.workspace = true
form_urlencoded.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
cf-board = { workspace = true, features = ["test-support"] }
# The daemon as a process: a home of its own with a ledger and a fake `claude`.
cf-harness = { workspace = true, features = ["test-support"] }
cf-ledger.workspace = true
tempfile.workspace = true

[lints]
workspace = true
