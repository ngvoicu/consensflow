[package]
name = "cf-ledger"
description = "The ledger: the one durable record of every project, participant, task and message, in the home's consensflow.db."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cf-base.workspace = true
cf-proto.workspace = true
# A message's opening is read through SQLite's incremental blob reads, its
# first bytes alone (`Ledger::message_opening`).
rusqlite = { workspace = true, features = ["blob"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
# What the engine's tests watch of the ledger: each read of `projects` and
# `next_delivery`, which a test counts or fails ([`Ledger::watch`]); and the
# most of one value SQLite loads, which a test lowers to prove a read never
# loads a long one ([`Ledger::limit_value_length`]); and the connection, which a
# test counts the pages a read takes by ([`Ledger::sqlite`]).
test-support = ["rusqlite/limits"]

[dev-dependencies]
base64.workspace = true
cf-ledger = { path = ".", features = ["test-support"] }
# The child a test starts holds only its streams.
cf-process.workspace = true
flate2.workspace = true
sha2.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# A descriptor left open and not close-on-exec, for a test of what the child holds.
nix = { workspace = true, features = ["fs"] }

[lints]
workspace = true
