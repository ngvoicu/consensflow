[package]
name = "cf-ledger"
description = "The ledger: the one durable record of every project, participant, task and message, in the home's consensflow.db."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cf-base.workspace = true
cf-proto.workspace = true
# A message's opening is read through SQLite's incremental blob reads, its
# first bytes alone (`Ledger::message_opening`).
rusqlite = { workspace = true, features = ["blob"] }
serde.workspace = true
serde_json.workspace = true
# The hash an item's id longer than the copy keeps one is kept apart by.
sha2.workspace = true
thiserror.workspace = true

[features]
# What the engine's tests watch of the ledger: each read of `projects` and
# `next_delivery`, which a test counts or fails ([`Ledger::watch`]); and the
# most of one value SQLite loads, which a test lowers to prove a read never
# loads a long one ([`Ledger::limit_value_length`]).
test-support = ["rusqlite/limits"]

[dev-dependencies]
base64.workspace = true
cf-ledger = { path = ".", features = ["test-support"] }
flate2.workspace = true
tempfile.workspace = true

[lints]
workspace = true
