[package]
name = "cf-panes"
description = "The pane host: every window's program in a PTY of its own, its input and output, and the bridge handlers that serve them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# What the app's own tests need of the pane host that no program does: a pane
# opened under a name of the table's own with its raw output, the lock that
# keeps PTY tests one at a time, whether a process is still there, the
# sentinel that shows a close or an ending reached no process that is none of
# the window's, and the guard every real signal of the macOS process tree asks
# first (src/process_tree/guard.rs: a signal to a process that is none of the
# test's own panics and is not sent). The app turns it on for its tests alone:
# it must stay off in what ships.
[features]
test-support = ["dep:cf-process"]

# The helper's own tests (tests/headless.rs) start a sentinel too, and start the helper holding
# only its streams.
[dev-dependencies]
cf-panes = { path = ".", features = ["test-support"] }
cf-process = { workspace = true, features = ["test-support"] }

[dependencies]
# The environment, read once in the bridge's main (`Env`); on Windows also cygwin.rs.
cf-base.workspace = true
cf-bridge.workspace = true
# The sentinel holds only its streams (test-support alone).
cf-process = { workspace = true, optional = true }
cf-proto.workspace = true
futures-channel.workspace = true
futures-executor.workspace = true
portable-pty.workspace = true
serde.workspace = true
serde_json.workspace = true

# The macOS process tree (src/process_tree.rs), the pane table's macOS tests, and a
# window's output on Unix, which asks its terminal whether it has anything to read
# (src/pty/output_end.rs), call libc.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# A window's pseudoconsole and its program, started in the window's job
# (src/pty/conpty.rs), answer portable-pty's traits, whose errors are anyhow's. Its
# environment is read whole from portable-pty's own serde form (`serde_support`:
# src/pty/conpty/environment.rs), every value as the system keeps it.
[target.'cfg(windows)'.dependencies]
anyhow.workspace = true
portable-pty = { workspace = true, features = ["serde_support"] }
# `ps -W` of Git Bash says the parent of a program of its own kind whose parent has gone
# (src/cygwin.rs): started through cf-process, the one place a process starts, on a runtime
# of its own for the moment it takes (cf-base is every platform's, above).
cf-process.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "time"] }
windows-sys = { workspace = true, features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# The Windows test of a console host that died finds the pane's host among the test's
# own children (src/pty/output_end/tests.rs).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_ToolHelp"] }

[lints]
workspace = true
