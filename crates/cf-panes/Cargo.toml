[package]
name = "cf-panes"
description = "The pane host: every window's program in a PTY of its own, its input and output, and the bridge handlers that serve them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# What the app's own tests need of the pane host that no program does: a pane
# opened under a name of the table's own with its raw output, the lock that
# keeps PTY tests one at a time, whether a process is still there, the
# sentinel that shows a close or an ending reached no process that is none of
# the window's, and the guard every real signal of the macOS process tree asks
# first (src/process_tree/guard.rs: a signal to a process that is none of the
# test's own panics and is not sent). The app turns it on for its tests alone:
# it must stay off in what ships.
[features]
test-support = []

# The helper's own tests (tests/headless.rs) start a sentinel too.
[dev-dependencies]
cf-panes = { path = ".", features = ["test-support"] }

[dependencies]
cf-bridge.workspace = true
cf-proto.workspace = true
futures-channel.workspace = true
futures-executor.workspace = true
portable-pty.workspace = true
serde.workspace = true
serde_json.workspace = true

# The macOS process tree (src/process_tree.rs), the pane table's macOS tests, and a
# window's output on Unix, which asks its terminal whether it has anything to read
# (src/pty/output_end.rs), call libc.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_Threading",
] }

# The Windows test of a console host that died finds the pane's host among the test's
# own children (src/pty/output_end/tests.rs).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_ToolHelp"] }

[lints]
workspace = true
