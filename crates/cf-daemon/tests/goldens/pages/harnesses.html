<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConsensFlow Harnesses</title>
<link rel="stylesheet" href="/vendor/fonts/fonts.css">
<style>
  :root { color-scheme: dark light; --ink: #09090B; --panel: #18181B; --line: #27272A; --line-strong: #3F3F46; --text: #FAFAFA; --muted: #A1A1AA; --accent: #A5B4FC; --danger: #F87171; }
  @media (prefers-color-scheme: light) {
    :root:not([data-framed]) { color-scheme: light; --ink: #FFFFFF; --panel: #F4F4F5; --line: #E4E4E7; --line-strong: #D4D4D8; --text: #09090B; --muted: #52525B; --accent: #4338CA; --danger: #B91C1C; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px 24px 64px; background: var(--ink); color: var(--text); font: 15px/1.5 "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 760px; margin: 0 auto; }
  .mark { font: 12px ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: 26px; font-weight: 600; letter-spacing: -.01em; margin: 6px 0 4px; }
  .lede, #check-note { color: var(--muted); font-size: 13.5px; }
  #check-note { min-height: 20px; }
  .host { padding: 18px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
  .host strong { display: block; font-size: 17px; color: var(--accent); margin-bottom: 6px; }
  .host div { font-size: 13px; }
  .host small { display: block; color: var(--muted); margin-top: 8px; }
  button { font: inherit; font-size: 13px; color: var(--text); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .6; cursor: wait; }
  .host button { margin: 10px 12px 0 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
<style>
  :root[data-framed] { color-scheme: dark; }
  :root[data-framed] body { padding-top: 22px; }
  :root[data-framed] .mark { display: none; }
</style>
<script>
if (window.parent !== window) {
  document.documentElement.dataset.framed = '';
  addEventListener('keydown', event => {
    if (event.key === 'Escape') window.parent.postMessage('consensflow:close', '*');
  });
}
</script>
</head>
<body>
<main>
  <p class="mark">ConsensFlow</p>
  <h1>Harnesses</h1>
  <p class="lede">Installed coding tools and available updates.</p>
  <button id="check-all" type="button">Check all harnesses</button>
  <p id="check-note" role="status"></p>
  <section id="harnesses" aria-label="Harness diagnostics"></section>
</main>
<script>
const TOKEN = "$TOKEN";
const headers = { authorization: 'Bearer ' + TOKEN, 'content-type': 'application/json' };
const el = (tag, className, text) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
};
let HARNESS_ROWS = [];
const UPDATES = new Map();
// The newest look wins: the daemon stamps each row with the number its look took when it began
// (one counter per harness), and a row is shown only if no row of a later look has shown that
// harness's. Whatever order the answers arrive in, and across a reload (a new page takes what the
// daemon says first, and the stamps order the rest).
const SHOWN = new Map();
function showRows(rows) {
  const byId = new Map(HARNESS_ROWS.map(row => [row.id, row]));
  for (const row of rows) {
    const stamp = row.stamp ?? 0;
    if ((SHOWN.get(row.id) ?? -1) > stamp) continue;
    SHOWN.set(row.id, stamp);
    byId.set(row.id, row);
  }
  HARNESS_ROWS = [...byId.values()];
}
// The status line is the newest operation's: an older one that ends later writes nothing.
let LOOKS = 0;
let SAID = 0;
function say(look, text) {
  if (look < SAID) return;
  SAID = look;
  document.querySelector('#check-note').textContent = text;
}
// One update at a time for a harness: the daemon refuses a second, and its button stays disabled
// through every redraw. An update the daemon is running that this page did not begin (another tab,
// or this page before a reload) is watched until it ends.
const UPDATING = new Set();
const WATCHED = new Set();
async function post(path, body, failed) {
  const response = await fetch(path, { method: 'POST', headers, body: JSON.stringify(body) });
  if (response.ok) return response.json();
  let words = null;
  try { words = (await response.json()).message; } catch (error) { /* no words */ }
  throw new Error(words || failed);
}
function watchUpdate(id, words = 'Updating ' + id + '… this can take a minute.') {
  if (WATCHED.has(id)) return;
  WATCHED.add(id);
  UPDATING.add(id);
  const look = ++LOOKS;
  say(look, words);
  renderHarnesses();
  const poll = async () => {
    let running = true;
    try {
      const { harnesses, updating } = await post('/api/harnesses/check', { id, refresh: false }, 'Harness check failed');
      showRows(harnesses);
      running = updating.includes(id);
    } catch (error) { /* try again */ }
    if (running) return setTimeout(poll, 2000);
    WATCHED.delete(id);
    UPDATING.delete(id);
    say(look, '');
    renderHarnesses();
  };
  setTimeout(poll, 2000);
}
async function updateHarness(id, button) {
  if (UPDATING.has(id)) return;
  UPDATING.add(id);
  const look = ++LOOKS;
  say(look, 'Updating ' + id + '… this can take a minute.');
  button.disabled = true;
  try {
    const { result } = await post('/api/harnesses/update', { id }, 'The update could not be started');
    UPDATES.set(id, result);
    showRows([result.harness]);
    say(look, '');
  } catch (error) {
    if (/already running/.test(error.message)) {
      UPDATING.delete(id);
      return watchUpdate(id, error.message + ': this page shows it when it ends.');
    }
    say(look, error.message + ' — try again.');
  }
  UPDATING.delete(id);
  renderHarnesses();
}
async function checkHarnesses(id = null, button = null) {
  const look = ++LOOKS;
  say(look, 'Checking…');
  if (button) button.disabled = true;
  try {
    const { harnesses, updating } = await post('/api/harnesses/check', { ...(id ? { id } : {}), refresh: button !== null }, 'Harness check failed');
    showRows(harnesses);
    renderHarnesses();
    say(look, '');
    for (const running of updating || []) if (!UPDATING.has(running)) watchUpdate(running);
  } catch (error) {
    say(look, error.message + ' — try checking again.');
  } finally { if (button) button.disabled = false; }
}

function renderHarness(row) {
  const line = el('div', 'host');
  line.append(el('strong', null, row.id));
  line.append(el('div', null, row.installed ? 'Installed: ' + row.path : 'Not installed'));
  if (row.installed) {
    const update = row.update;
    const installedRelease = row.tested?.release || row.version.value;
    const version = installedRelease ? 'Version ' + installedRelease : row.version.reason || 'Version unknown';
    const latest = update.state === 'current' ? ', up to date'
      : update.state === 'available' ? ', ' + update.value + ' is out'
      : update.state === 'unknown' ? '; the latest release is ' + update.value
      : update.state === 'error' ? '; could not check for updates: ' + update.reason
      : '';
    line.append(el('div', null, version + latest));
    if (row.tested?.newest) {
      line.append(el('div', null, 'Tested up to ' + row.tested.newest + '.'));
      if (row.tested.beyond) line.append(el('div', null, 'This version is newer and has not been checked yet.'));
    }
    line.append(el('div', null, row.distribution ? 'Installed with ' + row.distribution : 'Installed in a way ConsensFlow does not recognize'));
    const last = UPDATES.get(row.id);
    if (last) {
      const said = last.state === 'updated' ? 'Updated ' + last.before + ' → ' + last.after
        : last.state === 'unchanged' ? 'Ran ' + last.command + '; the version did not change'
        : last.state === 'failed' ? 'Update failed: ' + last.reason
        : last.reason;
      const outcome = el('div', null, said);
      if (last.state === 'failed') outcome.style.color = 'var(--danger)';
      line.append(outcome);
      if (last.output && last.state !== 'updated') {
        const output = el('pre', null, last.output);
        output.style.cssText = 'font-size:12px;white-space:pre-wrap;color:var(--muted);margin:6px 0 0;';
        line.append(output);
      }
    }
    if (update.state === 'available') {
      if (update.command) {
        const go = el('button', null, 'Update to ' + update.value);
        go.disabled = UPDATING.has(row.id);
        go.onclick = () => updateHarness(row.id, go);
        line.append(go);
      } else {
        line.append(el('small', null, 'Update it the way you installed it.'));
      }
    }
    if (row.extension?.state === 'error' || row.extension?.state === 'not-installed') {
      const status = el('div', null, 'Pi setup failed: ' + (row.extension.reason || 'Setup is missing.'));
      status.style.color = 'var(--danger)';
      line.append(status);
      const retry = el('button', null, 'Retry Pi setup');
      retry.onclick = () => checkHarnesses(row.id, retry);
      line.append(retry);
    }
  }
  if (row.setup?.reason) line.append(el('div', null, row.setup.reason));
  const check = el('button', null, 'Check again');
  check.onclick = () => checkHarnesses(row.id, check); line.append(check);
  line.append(el('small', null, 'Checked: ' + new Date(row.checkedAt).toLocaleString()));
  return line;
}


function renderHarnesses() {
  document.querySelector('#harnesses').replaceChildren(...HARNESS_ROWS.map(renderHarness));
}
const checkAll = document.querySelector('#check-all');
checkAll.onclick = () => checkHarnesses(null, checkAll);
checkHarnesses();
</script>
</body>
</html>
