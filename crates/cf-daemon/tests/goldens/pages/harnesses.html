<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConsensFlow Harnesses</title>
<link rel="stylesheet" href="/vendor/fonts/fonts.css">
<style>
  /* The board's own colours: zinc surfaces, lavender for focus, and a state each harness is in at a
     glance: green it can start, amber it could not be checked, red it cannot start, grey not there. */
  :root { color-scheme: dark light; --ink: #09090B; --card: #111114; --well: #0B0B0E; --panel: #18181B; --line: #27272A; --line-strong: #3F3F46; --text: #FAFAFA; --muted: #A1A1AA; --accent: #A5B4FC; --danger: #F87171; --ok: #6EE7B7; --amber: #FCD34D; --absent: #52525B; --danger-wash: rgba(248, 113, 113, .09); --amber-wash: rgba(252, 211, 77, .08); --shadow: none; }
  @media (prefers-color-scheme: light) {
    :root:not([data-framed]) { color-scheme: light; --ink: #FFFFFF; --card: #FFFFFF; --well: #F4F4F5; --panel: #F4F4F5; --line: #E4E4E7; --line-strong: #D4D4D8; --text: #09090B; --muted: #52525B; --accent: #4338CA; --danger: #B91C1C; --ok: #047857; --amber: #B45309; --absent: #A1A1AA; --danger-wash: rgba(220, 38, 38, .06); --amber-wash: rgba(217, 119, 6, .08); --shadow: 0 1px 2px rgba(9, 9, 11, .05); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px 24px 64px; background: var(--ink); color: var(--text); font: 15px/1.5 "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 760px; margin: 0 auto; }
  .mark { font: 12px "Geist Mono", ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0; }
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; }
  h1 { font-size: 26px; font-weight: 600; letter-spacing: -.01em; margin: 6px 0 4px; }
  .lede { margin: 0; color: var(--muted); font-size: 13.5px; }
  #check-note { margin: 14px 0 10px; min-height: 20px; color: var(--muted); font-size: 13px; }
  #check-note[data-tone="error"] { color: var(--danger); }
  #harnesses { display: grid; gap: 12px; }
  /* One card a harness: its name and state, then what stops it, what it is, and the command. */
  .host { --dot: var(--ok); padding: 14px 18px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow-wrap: anywhere; font-size: 13.5px; }
  .host[data-state="blocked"] { --dot: var(--danger); }
  .host[data-state="unchecked"] { --dot: var(--amber); }
  .host[data-state="absent"] { --dot: var(--absent); }
  .head { display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; }
  .head .who, .head .when { display: flex; align-items: center; gap: 8px 12px; }
  .head .who { gap: 8px; }
  .head .when { margin-left: auto; }
  .head strong { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; }
  .head .cli { color: var(--muted); font: 12.5px "Geist Mono", ui-monospace, monospace; }
  .head strong::before { content: ''; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 0 3px var(--line); }
  .host[data-state="absent"] .head strong::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--dot); }
  .head small { color: var(--muted); font-size: 12px; }
  .launch { margin-top: 8px; }
  .host[data-state="ready"] .launch { color: var(--ok); }
  .host[data-state="absent"] .launch { color: var(--muted); }
  .alert { padding: 8px 12px; border-left: 3px solid var(--danger); border-radius: 0 6px 6px 0; background: var(--danger-wash); }
  .alert.amber { border-left-color: var(--amber); background: var(--amber-wash); }
  .launch b { font-weight: 600; }
  .host > .alert:not(.launch) { margin-top: 8px; }
  .alert + button { margin-top: 8px; }
  .facts { margin-top: 10px; color: var(--muted); font-size: 13px; line-height: 1.6; }
  .facts .version { color: var(--text); }
  .facts .beyond { color: var(--amber); }
  .facts .path span { font: 12px "Geist Mono", ui-monospace, monospace; word-break: break-all; }
  /* The command, as a person pastes it, in a well with Copy beside it; a long one wraps at the
     well's edge, as a terminal wraps a line, never after a hyphen that reads as part of it. */
  .command { display: grid; grid-template-columns: minmax(0, 1fr) auto; margin-top: 14px; }
  .command > span { grid-column: 1 / -1; margin-bottom: 6px; color: var(--muted); font-size: 12.5px; }
  .command code { padding: 8px 12px; font: 12.5px/1.6 "Geist Mono", ui-monospace, monospace; white-space: pre-wrap; word-break: break-all; background: var(--well); border: 1px solid var(--line); border-right: 0; border-radius: 6px 0 0 6px; user-select: all; }
  .command button { border-radius: 0 6px 6px 0; min-width: 72px; }
  .manual { margin: 14px 0 0; padding: 8px 12px; border: 1px dashed var(--line-strong); border-radius: 6px; }
  button { font: inherit; font-size: 13px; color: var(--text); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .6; cursor: wait; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
<style>
  :root[data-framed] { color-scheme: dark; }
  :root[data-framed] body { padding-top: 22px; }
  :root[data-framed] .mark { display: none; }
</style>
<script>
if (window.parent !== window) {
  document.documentElement.dataset.framed = '';
  addEventListener('keydown', event => {
    if (event.key === 'Escape') window.parent.postMessage('consensflow:close', '*');
  });
}
</script>
</head>
<body>
<main>
  <header class="top">
    <div>
      <p class="mark">ConsensFlow</p>
      <h1>Harnesses</h1>
      <p class="lede">Installed coding tools and available updates.</p>
    </div>
    <button id="check-all" type="button">Check all harnesses</button>
  </header>
  <p id="check-note" role="status"></p>
  <section id="harnesses" aria-label="Harness diagnostics"></section>
</main>
<script>
const TOKEN = "$TOKEN";
const headers = { authorization: 'Bearer ' + TOKEN, 'content-type': 'application/json' };
const el = (tag, className, text) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
};
let HARNESS_ROWS = [];
// The product each command is, as the human knows it; a command that is not here is its own
// product's name (agy), and is said once.
const PRODUCTS = { claude: 'Claude Code', codex: 'Codex', pi: 'Pi', devin: 'Devin', muse: 'Muse Code' };
// The newest look wins: the daemon stamps each row with the number its look took when it began
// (one counter per harness), and a row is shown only if no row of a later look has shown that
// harness's. Whatever order the answers arrive in, and across a reload (a new page takes what the
// daemon says first, and the stamps order the rest).
const SHOWN = new Map();
function showRows(rows) {
  const byId = new Map(HARNESS_ROWS.map(row => [row.id, row]));
  for (const row of rows) {
    const stamp = row.stamp ?? 0;
    if ((SHOWN.get(row.id) ?? -1) > stamp) continue;
    SHOWN.set(row.id, stamp);
    byId.set(row.id, row);
  }
  HARNESS_ROWS = [...byId.values()];
}
// The status line is the newest operation's: an older one that ends later writes nothing.
let LOOKS = 0;
let SAID = 0;
function say(look, text, tone = '') {
  if (look < SAID) return;
  SAID = look;
  const note = document.querySelector('#check-note');
  note.textContent = text;
  note.dataset.tone = tone;
}
// The page installs nothing: it shows what the daemon knows of each harness, the command that
// updates it the way it was installed, and Refresh. A refused or failed check is said as sent.
async function post(path, body, failed) {
  const response = await fetch(path, { method: 'POST', headers, body: JSON.stringify(body) });
  if (response.ok) return response.json();
  let words = null;
  try { words = (await response.json()).error; } catch (error) { /* no words */ }
  throw new Error(words || failed);
}
async function checkHarnesses(id = null, button = null) {
  const look = ++LOOKS;
  say(look, 'Checking…');
  if (button) button.disabled = true;
  try {
    const { harnesses } = await post('/api/harnesses/check', { ...(id ? { id } : {}), refresh: button !== null }, 'Harness check failed');
    showRows(harnesses);
    renderHarnesses();
    say(look, '');
  } catch (error) {
    say(look, error.message + ' — try checking again.', 'error');
  } finally { if (button) button.disabled = false; }
}

async function copyCommand(text, button) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (error) {
    const area = document.createElement('textarea');
    area.value = text;
    document.body.append(area);
    area.select();
    document.execCommand('copy');
    area.remove();
  }
  button.textContent = 'Copied';
  setTimeout(() => { button.textContent = 'Copy'; }, 1500);
}

function renderHarness(row) {
  const line = el('div', 'host');
  const setup = row.setup;
  const setupFailed = row.extension?.state === 'error' || row.extension?.state === 'not-installed';
  // The card's state at a glance, of what its lines say: its dot, and the colour of its first line.
  line.dataset.state = !row.installed ? 'absent'
    : setup?.state === 'update-required' || setupFailed ? 'blocked'
    : setup?.state === 'unchecked' ? 'unchecked'
    : 'ready';
  // The name with its command, and the check's time with Refresh: two pairs that wrap whole.
  const head = el('div', 'head');
  const who = el('div', 'who');
  const product = PRODUCTS[row.id] ?? row.id;
  who.append(el('strong', null, product));
  if (product !== row.id) who.append(el('span', 'cli', '(' + row.id + ')'));
  const when = el('div', 'when');
  when.append(el('small', null, 'Checked: ' + new Date(row.checkedAt).toLocaleString()));
  const check = el('button', null, 'Refresh');
  check.onclick = () => checkHarnesses(row.id, check); when.append(check);
  head.append(who, when);
  line.append(head);
  if (!row.installed) line.append(el('div', 'launch', 'Not installed'));
  if (row.installed) {
    const update = row.update;
    // The launch's own check: whether ConsensFlow can start it, and the reason when it can't.
    const launch = el('div', 'launch');
    if (setup?.state === 'update-required' || setup?.state === 'unchecked') {
      launch.classList.add('alert');
      if (setup.state === 'unchecked') launch.classList.add('amber');
      launch.append(el('b', null, setup.state === 'update-required' ? 'ConsensFlow cannot start it: ' : 'ConsensFlow could not check it: '), setup.reason);
    } else {
      launch.textContent = 'ConsensFlow can start it.';
    }
    line.append(launch);
    if (setupFailed) {
      const status = el('div', 'alert', 'Pi setup failed: ' + (row.extension.reason || 'Setup is missing.'));
      status.style.color = 'var(--danger)';
      line.append(status);
      const retry = el('button', null, 'Retry Pi setup');
      retry.onclick = () => checkHarnesses(row.id, retry);
      line.append(retry);
    }
    const facts = el('div', 'facts');
    const installedRelease = row.tested?.release || row.version.value;
    const version = installedRelease ? 'Version ' + installedRelease : row.version.reason || 'Version unknown';
    const latest = update.state === 'current' ? ', up to date'
      : update.state === 'available' ? ', ' + update.value + ' is out'
      : update.state === 'unknown' ? '; the latest release is ' + update.value
      : update.state === 'error' ? '; could not check for updates: ' + update.reason
      : '';
    facts.append(el('div', 'version', version + latest));
    if (row.tested?.newest) {
      facts.append(el('div', null, 'Tested up to ' + row.tested.newest + '.'));
      if (row.tested.beyond) facts.append(el('div', 'beyond', 'This version is newer and has not been checked yet.'));
    }
    if (row.distribution) facts.append(el('div', null, 'Installed with ' + row.distribution));
    const path = el('div', 'path', 'Installed: ');
    path.append(el('span', null, row.path));
    facts.append(path);
    line.append(facts);
    const required = row.setup?.state === 'update-required';
    if (update.state === 'available' || required) {
      const command = update.command;
      if (command) {
        const put = el('div', 'command');
        put.append(el('span', null, 'To update it the way it was installed: '));
        put.append(el('code', null, command));
        const copy = el('button', null, 'Copy');
        copy.onclick = () => copyCommand(command, copy);
        put.append(copy);
        line.append(put);
      } else {
        line.append(el('p', 'manual', 'Update it the way you installed it, as its own update instructions say.'));
      }
    }
  }
  return line;
}


function renderHarnesses() {
  document.querySelector('#harnesses').replaceChildren(...HARNESS_ROWS.map(renderHarness));
}
const checkAll = document.querySelector('#check-all');
checkAll.onclick = () => checkHarnesses(null, checkAll);
checkHarnesses();
</script>
</body>
</html>
