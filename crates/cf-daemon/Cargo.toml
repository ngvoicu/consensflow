[package]
name = "cf-daemon"
description = "ConsensFlow's daemon: the one process that owns its state, around the engine. Its run and stop, its HTTP front, the page's operations over the bridge, its log and trace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# An image of a project's specs folder reaches the page as base64 (`page::viewer`).
base64.workspace = true
bytes.workspace = true
cf-base.workspace = true
# The daemon's end of the bridge, which no other crate turns on.
cf-bridge = { workspace = true, features = ["local"] }
cf-catalog.workspace = true
cf-engine.workspace = true
cf-harness.workspace = true
cf-ledger.workspace = true
cf-process.workspace = true
cf-proto.workspace = true
# A panic is caught where a future runs (`catch_unwind`), and a body is a stream.
futures-util.workspace = true
# The window tokens and the UI token.
getrandom.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
# The harness feed's client (`screens::network`): the HTTPS of Node's `fetch`,
# on rustls and the platform's own trust, built on ring.
reqwest.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
# A window's token is kept as its digest.
sha2.workspace = true
# The UI token is compared in constant time.
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }
# A request's target is read as the WHATWG URL standard reads it, as Node's `new URL`.
url.workspace = true

# The specs viewer opens each name of a project's specs folder through the
# folder above it, never through a link (`page::viewer::door`).
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# The same on Windows: each folder held while a name in it is opened, and a
# handle's type and number of names (`page::viewer::door`).
[target.'cfg(windows)'.dependencies]
winapi-util.workspace = true
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
# The players read Node's traces (gzipped JSON, bodies that are no UTF-8)
# and compare the ledger's file as the recorder dumped it; base64, which they
# read the bodies with, is a dependency of the daemon's own.
cf-engine = { workspace = true, features = ["test-support"] }
cf-harness = { workspace = true, features = ["test-support"] }
flate2.workspace = true
# The screens' player masks the times in what it compares.
regex.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt", "signal", "sync", "test-util", "time"] }

# A FIFO in a specs folder, which the viewer must never wait on (`mkfifo`).
[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["fs"] }

[lints]
workspace = true
