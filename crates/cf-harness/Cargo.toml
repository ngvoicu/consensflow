[package]
name = "cf-harness"
description = "ConsensFlow's integration with each coding-agent harness, one module per harness, and what they share."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cf-base.workspace = true
cf-process.workspace = true
cf-proto.workspace = true
# A probe's run, shared by every caller that asked while it ran.
futures-util.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client"] }
hyper-util.workspace = true
jiff.workspace = true
regex.workspace = true
rusqlite.workspace = true
# `rc`: a reading's quota is shared, as Node shared the object.
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
# The engine's timer, which a window's waits sleep on, and its sockets.
tokio = { workspace = true, features = ["net", "time"] }
url.workspace = true
uuid.workspace = true

[features]
# The fakes of `testing`, for tests of other crates and of this one's
# `tests/`, which turn it on through the dev-dependency below.
test-support = []

[dev-dependencies]
cf-harness = { path = ".", features = ["test-support"] }
flate2.workspace = true
# `parity:records` digests each text as Node's half does.
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }

[lints]
workspace = true
