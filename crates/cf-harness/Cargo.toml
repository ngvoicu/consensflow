[package]
name = "cf-harness"
description = "ConsensFlow's integration with each coding-agent harness, one module per harness, and what they share."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The tokens of Codex's broker, as `randomBytes(24).toString('base64url')`
# makes them.
base64.workspace = true
cf-base.workspace = true
# The terminal command, which what opening the app prepares (`prepare`) makes
# beside the harnesses' extensions.
cf-launcher.workspace = true
cf-process.workspace = true
cf-proto.workspace = true
# A probe's run, shared by every caller that asked while it ran.
futures-util.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client"] }
hyper-util.workspace = true
jiff.workspace = true
# Where a line of a transcript ends, found at the speed a disk reads.
memchr.workspace = true
regex.workspace = true
rusqlite.workspace = true
# `rc`: a reading's quota is shared, as Node shared the object.
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
# A bundle's folder is named by the hash of its files, as Node named it.
sha2.workspace = true
# The engine's timer, which a window's waits sleep on, and its sockets; and
# the channels between the engine's thread and the records thread.
tokio = { workspace = true, features = ["net", "sync", "time"] }
# Codex's `config.toml`, read for whether its computer use is set up.
toml.workspace = true
url.workspace = true
uuid.workspace = true

[features]
# The fakes of `testing`, for tests of other crates and of this one's
# `tests/`, which turn it on through the dev-dependency below, and the
# binaries `pi-send` and `harness-ask`.
test-support = ["tokio/rt"]

# Pi's channel on the system's clock, for the tests of the Pi extension
# (`tests/pi-message.test.mjs`, `tests/pi-extension.test.mjs`), which run
# the extension itself and are JavaScript. The other channels are held in
# `tests/channels`, which calls them directly.
[[bin]]
name = "pi-send"
path = "src/bin/pi_send.rs"
required-features = ["test-support"]

# What the evals and the live tools ask of the harness code: a harness's own
# record of a conversation, its window's command line, the text a window
# takes, and the settings of a Claude window (`tooling`).
[[bin]]
name = "harness-ask"
path = "src/bin/harness_ask.rs"
required-features = ["test-support"]

[dev-dependencies]
cf-harness = { path = ".", features = ["test-support"] }
# What a program a test starts holds.
cf-process = { workspace = true, features = ["test-support"] }
flate2.workspace = true
# The rule that harness dispatch stays where the registry has it reads the sources
# as syntax (`tests/dispatch`).
syn.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }

# The mask the goldens' scenarios make their files under, which std cannot set,
# the most memory a process held, which the memory measurement reports, and
# the kill of the program the processes seam's test of a child's end leaves in
# the background (`seams::processes`).
[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["fs", "resource", "signal"] }

[lints]
workspace = true
