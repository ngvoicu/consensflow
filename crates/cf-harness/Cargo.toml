[package]
name = "cf-harness"
description = "ConsensFlow's integration with each coding-agent harness, one module per harness, and what they share."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cf-base.workspace = true
cf-process.workspace = true
cf-proto.workspace = true
jiff.workspace = true
regex.workspace = true
rusqlite.workspace = true
# `rc`: a reading's quota is shared, as Node shared the object.
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
flate2.workspace = true
# `parity:records` digests each text as Node's half does.
sha2.workspace = true
tempfile.workspace = true

[lints]
workspace = true
